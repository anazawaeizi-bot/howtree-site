5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表の読み取りは、一つまたは複数の表から必要な数値を探し、割合や増減を計算する問題です。表の題、行と列の見出し、単位を先に確かめて、どの数が何を表しているかをつかみます。割合を求めるときは、何を基準（100%）にするかを問題文から読み取ります。複数の表を使うときは、一方の表の割合を、もう一方の表の実際の数にかけて求めます。","example":"全体に占める割合 = その項目の数 ÷ 合計\n増加率 = (後の数 − 前の数) ÷ 前の数\n実際の数 = 基準の数 × 割合\n例　前年50、今年60のときの増加率：(60 − 50) ÷ 50 = 0.2","note":"0.2は20%です。割る数は、基準である前年の50です。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-table","level":"must"},{"id":"math-ratio","level":"must"}],"assessment":{"question":"A店の売上は前年80万円、今年100万円。今年の売上は、前年に比べて何%増えた？","options":["20%","25%","125%"],"answer":1,"explanation":"増加は20万円。基準は前年なので20 ÷ 80 = 0.25で、25%。125%は今年の売上が前年の何%かを表す数で、増えた割合ではない。"},"practice":{"title":"複数の表から、割合や増減を求める","lead":"どの数を基準にするかを、表の見出しで確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全体に占める割合を求める","question":"表1で、5月の3支店の売上の合計に占めるA支店の売上の割合は、何%でしょうか。","answer":"30%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う列：5月\n比べる量：A支店の売上 270万円\n基準：3支店の5月の売上の合計","body":"「合計に占める割合」なので、基準は5月の合計です。4月の列は使いません。"},{"title":"5月の売上の合計を求める","formula":"270 + 360 + 270 = 900","body":"表に合計の行がないので、3支店の5月の売上を足します。"},{"title":"A支店の売上を、合計で割る","formula":"270 ÷ 900 = 0.3","body":"割合は、比べる量÷基準の量です。0.3は30%です。"},{"title":"3支店の割合を足すと、100%になるか確かめる","formula":"B支店：360 ÷ 900 = 0.4\nC支店：270 ÷ 900 = 0.3\n0.3 + 0.4 + 0.3 = 1","body":"B支店は40%、C支店は30%で、3支店を足すと100%になります。基準を4月の合計800万円に取り違えていれば、足しても100%になりません。"}]},{"label":"前の月からの増加率を求める","question":"表1で、C支店の5月の売上は、4月に比べて何%増えたでしょうか。","answer":"35%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う行：C支店\n4月：200万円（基準）\n5月：270万円","body":"「4月に比べて」なので、基準は4月の売上です。"},{"title":"増えた金額を求める","formula":"270 − 200 = 70","body":"5月の売上から4月の売上を引きます。"},{"title":"増えた金額を、基準の4月の売上で割る","formula":"70 ÷ 200 = 0.35","body":"0.35は35%です。5月の270万円で割ると、基準を取り違えた別の数になります。"},{"title":"4月の売上を35%増やすと、5月の売上になるか確かめる","formula":"200 × (1 + 0.35) = 200 × 1.35 = 270","body":"200万円の1.35倍が270万円で、表の5月の数と合います。"}]},{"label":"二つの表を組み合わせる","question":"表1と表2から、5月の商品Xの売上は、3支店の合計で何万円でしょうか。また、それは5月の3支店の売上の合計の何%でしょうか。","answer":"369万円、5月の3支店の売上の合計の41%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]},{"caption":"表2　各支店の5月の売上に占める商品別の割合（％）","rows":[["支店","商品X","商品Y","商品Z"],["A支店","40","35","25"],["B支店","50","30","20"],["C支店","30","30","40"]]}],"steps":[{"title":"二つの表の関係を置く","formula":"表1：支店ごとの売上（万円）\n表2：その支店の5月の売上を100%としたときの、商品ごとの割合","body":"表2の割合は、支店ごとに基準が違います。商品Xの金額は、支店ごとに「表1の5月の売上×表2の割合」で求めます。"},{"title":"A支店の商品Xの売上を求める","formula":"270 × 0.4 = 108","body":"A支店の5月の売上270万円の40%です。"},{"title":"B支店の商品Xの売上を求める","formula":"360 × 0.5 = 180","body":"B支店の5月の売上360万円の50%です。"},{"title":"C支店の商品Xの売上を求める","formula":"270 × 0.3 = 81","body":"C支店の5月の売上270万円の30%です。"},{"title":"3支店の商品Xの売上を足す","formula":"108 + 180 + 81 = 369","body":"金額に直してから足します。"},{"title":"5月の売上の合計に占める割合を求める","formula":"5月の売上の合計：270 + 360 + 270 = 900\n369 ÷ 900 = 0.41","body":"基準は3支店の5月の売上の合計900万円です。0.41は41%です。"},{"title":"割合を平均してはいけないことを確かめる","formula":"(40 + 50 + 30) ÷ 3 = 40","body":"三つの割合を平均すると40%になり、正しい41%と合いません。支店ごとに売上の大きさが違うので、割合どうしをそのまま平均することはできません。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-work":{"id":"spi-work","name":"仕事算","type":"learn","goal":"全体を1として、複数人での仕事にかかる日数を求められる。","part_of":"spi","tags":["num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"仕事算は、複数の人や機械が一つの仕事をするときに、かかる日数や時間を求める問題です。仕事の量が具体的な数で書かれていないので、仕事全体を1と置きます。すると、1人で8日かかる人は、1日に全体の1/8を進めると表せます。一緒に働くときは、それぞれの1日分を足して、全体の1をその和で割ります。","example":"1日にできる量 = 1 ÷ かかる日数\n一緒にしたときの1日分 = それぞれの1日分の和\nかかる日数 = 1 ÷ 1日分\n例　どちらも1人で8日かかる二人の1日分：1/8 + 1/8 = 1/4","note":"この二人が一緒にすると、1 ÷ (1/4) で4日かかります。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"ある仕事を、Aが1人ですると6日、Bが1人ですると3日かかります。二人が一緒にすると、何日で終わるでしょうか。","options":["2日","3日","4.5日"],"answer":0,"explanation":"1日分は1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2。全体1を終えるには1 ÷ (1/2) = 2日。"},"practice":{"title":"全体を 1 として、仕事にかかる日数を求める","lead":"1日にできる量を、分数で表す。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"二人で一緒に進める","question":"ある仕事を、Aが1人ですると12日、Bが1人ですると4日かかります。二人が一緒にすると、何日で終わるでしょうか。","answer":"3日","steps":[{"title":"仕事全体を 1 と置く","formula":"仕事全体：1\nAが1人でかかる日数：12日\nBが1人でかかる日数：4日","body":"仕事の量が数で書かれていないので、全体を1と置きます。こうすると、1日にできる量を分数で表せます。"},{"title":"それぞれが1日にできる量を求める","formula":"Aの1日分：1 ÷ 12 = 1/12\nBの1日分：1 ÷ 4 = 1/4","body":"全体1を、かかる日数で割ります。Aは1日に全体の1/12、Bは1日に全体の1/4を進めます。"},{"title":"二人が一緒にしたときの1日分を求める","formula":"1/12 + 1/4 = 1/12 + 3/12 = 4/12 = 1/3","body":"同じ日に二人とも働くので、1日分どうしを足します。分母を12にそろえて計算します。"},{"title":"全体を1日分で割って、日数を求める","formula":"1 ÷ (1/3) = 3","body":"1日に全体の1/3ずつ進むので、全体1が終わるまでに3日かかります。"},{"title":"3日で仕事がちょうど終わるか確かめる","formula":"Aの3日分：1/12 × 3 = 1/4\nBの3日分：1/4 × 3 = 3/4\n1/4 + 3/4 = 1","body":"二人の3日分を足すと全体の1になります。"}]},{"label":"途中から一人で進める","question":"ある仕事を、Aが1人ですると10日、Bが1人ですると15日かかります。はじめの4日間は二人で一緒に行い、残りをBが1人で行いました。Bは、あと何日かかったでしょうか。","answer":"あと5日","steps":[{"title":"仕事全体を 1 と置き、進め方を二つの期間に分ける","formula":"仕事全体：1\n期間1：二人で4日間\n期間2：残りをBが1人で","body":"途中で働く人数が変わるので、期間ごとに進んだ量を考えます。"},{"title":"それぞれが1日にできる量を求める","formula":"Aの1日分：1/10\nBの1日分：1/15","body":"全体1を、1人でかかる日数で割った量です。"},{"title":"二人が一緒にしたときの1日分を求める","formula":"1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6","body":"分母を30にそろえて足します。二人なら1日に全体の1/6が進みます。"},{"title":"はじめの4日間で進んだ量を求める","formula":"1/6 × 4 = 4/6 = 2/3","body":"1日分の1/6に、日数の4をかけます。"},{"title":"残っている仕事の量を求める","formula":"1 − 2/3 = 1/3","body":"全体1から、進んだ2/3を引きます。"},{"title":"残りをBの1日分で割って、日数を求める","formula":"(1/3) ÷ (1/15) = 1/3 × 15 = 5","body":"残りの1/3を、Bが1日に進める1/15ずつ片づけます。分数で割るときは、逆数をかけます。"},{"title":"全部を足して仕事が終わるか確かめる","formula":"二人の4日分：2/3\nBの5日分：1/15 × 5 = 1/3\n2/3 + 1/3 = 1","body":"二つの期間で進んだ量を足すと、全体の1になります。"}]},{"label":"一人でかかる日数をさかのぼる","question":"ある仕事を、AとBの二人が一緒にすると6日で終わります。同じ仕事をAが1人ですると9日かかります。Bが1人ですると、何日かかるでしょうか。","answer":"18日","steps":[{"title":"仕事全体を 1 と置く","formula":"仕事全体：1\n二人でかかる日数：6日\nAが1人でかかる日数：9日","body":"わかっているのは、二人の場合とAだけの場合です。ここからBだけの場合を求めます。"},{"title":"1日にできる量を、二人の場合とAだけの場合で求める","formula":"二人の1日分：1/6\nAの1日分：1/9","body":"どちらも、全体1をかかる日数で割った量です。"},{"title":"二人の1日分からAの1日分を引いて、Bの1日分を求める","formula":"1/6 − 1/9 = 3/18 − 2/18 = 1/18","body":"二人の1日分は、Aの1日分とBの1日分を足したものです。引くのは日数どうし（9 − 6）ではなく、1日分の量どうしです。"},{"title":"全体をBの1日分で割って、日数を求める","formula":"1 ÷ (1/18) = 18","body":"Bは1日に全体の1/18ずつ進めるので、1人では18日かかります。"},{"title":"Bが18日なら、二人で6日になるか確かめる","formula":"1/9 + 1/18 = 2/18 + 1/18 = 3/18 = 1/6","body":"二人の1日分が1/6になり、6日で終わるという条件に合います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]}}};
</script>
<script>
(function () {
  'use strict';

  var DATA = window.HOWTREE_DATA;
  var N = DATA.nodes;
  var CFG = DATA.config;
  var app = document.getElementById('app');

  // ---- 端末内の保存 ----
  var KNOWN_KEY = 'howtree.known.v2';
  var REPORT_KEY = 'howtree.reports.v1';
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できなくても動かす */ }
  }
  var known = {};
  list(KNOWN_KEY).forEach(function (id) { if (N[id]) known[id] = 1; });
  function persist() { save(KNOWN_KEY, Object.keys(known)); }


  var EVENT_KEY = 'howtree.events.v1', CONSENT_KEY = 'howtree.measure.v1', START_KEY = 'howtree.started.v1';
  function list(key) { var x = load(key); return Array.isArray(x) ? x : []; }
  function track(kind, node, value) {
    if (load(CONSENT_KEY) !== true) return;
    var events = list(EVENT_KEY);
    events.push({kind: kind, node: node || null, value: value || null, at: new Date().toISOString()});
    save(EVENT_KEY, events.slice(-1000));
  }
  function exportRecords() {
    var data = {version: 1, exported_at: new Date().toISOString(), known: Object.keys(known), events: list(EVENT_KEY), reports: list(REPORT_KEY)};
    var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    var a = document.createElement('a'); a.href=url; a.download='howtree-feedback.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function viewRecords() {
    app.innerHTML='<div class="wrap narrow">'+header()+'<div class="card"><h1>学習の記録</h1>'+
      '<p>習得済みと学習中の単元は、このブラウザに保存します。操作履歴は協力を選んだ場合だけ記録します。自動送信はしません。</p>'+
      '<p>書き出すファイルには単元名に対応するID、操作日時、教材を開いた履歴、報告、習得済みが入ります。内容を確認してから、試用を依頼した人に任意で渡してください。</p>'+
      '<p>操作履歴 '+list(EVENT_KEY).length+'件 / 報告 '+list(REPORT_KEY).length+'件。最大1,000件を端末に保存します。</p>'+
      '<div class="btns"><button class="btn" data-act="measure">'+(load(CONSENT_KEY)===true?'操作履歴の記録を止める':'試用に協力：操作履歴を記録する')+'</button>'+
      '<button class="btn" data-act="export">記録を書き出す</button><button class="btn" data-act="erase">操作履歴と報告を削除</button></div><p class="note">習得済みの記録は削除しません。書き出しは購入や広告への同意ではありません。</p></div>'+footer()+'</div>';
  }
  // 概念の説明と具体例。単元の詳細と練習ページの上に出す。
  function conceptHtml(n) {
    var c = n.concept;
    if (!c) return '';
    return '<div class="blk concept"><div class="sub">' + (n.type === 'target' ? 'これは何か' : esc(n.name) + 'とは') + '</div><p>' + esc(c.text) + '</p>' +
      (c.example ? '<pre class="step-formula">' + esc(c.example) + '</pre>' : '') +
      (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '</div>';
  }
  function miniLesson(n) {
    if(n.practice) return '<div class="blk"><div class="sub">問題で学ぶ</div><a class="btn red" href="#/practice/'+encodeURIComponent(n.id)+'">'+n.practice.problems.length+'問の例題を開く</a></div>';
    if (!n.assessment) return '';
    var a=n.assessment;
    return '<div class="blk"><div class="sub">無料で一問試す（独自作成）</div><p>'+esc(a.question)+'</p><details><summary>答えと考え方</summary><p>'+esc(a.explanation)+'</p></details><p class="note">一問は理解の手がかりです。単元全体の習得は到達条件でも確認してください。</p></div>';
  }

  var practiceNode=null, practiceIndex=0;
  function practicePrompt(index) {
    var a=N[practiceNode].practice.problems[practiceIndex], step=a.steps[index];
    var previous=index ? a.steps.slice(0,index).map(function(s){return s.formula;}).join('\n\n') : '問題文から、文字を置くところです。';
    var tables=(a.tables||[]).map(function(t){return '\n\n'+t.caption+'\n'+t.rows.map(function(row){return row.join(' | ');}).join('\n');}).join('');
    return '問題：'+a.question+tables+'\n\nここまで：\n'+previous+'\n\n次の段階：'+step.title+'\n'+step.formula+'\n\nなぜこのように進められるのか、わかりやすく教えて。';
  }
  function viewPractice(id) {
    if(id!==practiceNode){practiceNode=id;practiceIndex=0;}
    var n=N[id], P=n.practice, practiceProblems=P.problems, a=practiceProblems[practiceIndex];
    app.innerHTML='<div class="wrap practice">'+header('<a class="link" href="#/g/'+encodeURIComponent(id)+'">ツリーに戻る</a>')+
      '<div class="practice-heading"><div class="rule"></div><p class="sub">'+esc(n.name)+'</p><h1>'+esc(P.title)+'</h1>'+(P.lead?'<p class="muted">'+esc(P.lead)+'</p>':'')+'</div>'+conceptHtml(n)+
      '<nav class="practice-tabs" aria-label="問題を選ぶ">'+practiceProblems.map(function(p,i){return '<button class="btn '+(i===practiceIndex?'fill':'')+'" data-act="practice-pick" data-v="'+i+'" aria-pressed="'+(i===practiceIndex)+'">'+(i+1)+'. '+esc(p.label)+'</button>';}).join('')+'</nav>'+
      '<article class="exercise"><div class="sub">問題 '+(practiceIndex+1)+' / '+practiceProblems.length+'</div><h2>'+esc(a.question)+'</h2>'+
      (a.tables||[]).map(function(t){return '<figure class="ptable"><figcaption>'+esc(t.caption)+'</figcaption><table>'+t.rows.map(function(row,i){return '<tr>'+row.map(function(c,j){return (i&&j?'<td>':'<th>')+esc(c)+(i&&j?'</td>':'</th>');}).join('')+'</tr>';}).join('')+'</table></figure>';}).join('')+
      '<details class="exercise-answer"><summary>答えを見る</summary><p>'+esc(a.answer)+'</p></details>'+
      '<div class="walkthrough"><h3>考え方</h3>'+a.steps.map(function(step,i){return '<details class="explain-step" '+(i<2?'open':'')+'><summary><span class="step-number">'+(i+1)+'</span> '+esc(step.title)+'</summary><div class="step-body"><pre class="step-formula">'+esc(step.formula)+'</pre><p>'+esc(step.body)+'</p><button class="link" data-act="practice-prompt" data-v="'+i+'">'+(i?'前の段階から、なぜこうなる？':'なぜこの置き方をする？')+'　AIに尋ねる質問をコピー</button><p class="note copied" role="status"></p></div></details>';}).join('')+'</div>'+
      '<div id="prompt-panel" hidden><label for="practice-prompt">コピーした質問（別のAIに貼り付ける）</label><textarea id="practice-prompt" rows="8"></textarea><div class="btns"><button class="btn" data-act="practice-copy">もう一度コピー</button><button class="link" data-act="practice-close">閉じる</button></div><p id="copy-status" role="status"></p></div>'+
      '<div class="exercise-bottom"><span class="note">'+(P.original?'独自作成の問題':'既存例題の日本語訳')+'・'+(P.reviewed_at?'AI検証済み（'+esc(P.reviewed_at)+'）':'AI検証前の下書き')+'</span><button class="btn" data-act="practice-pick" data-v="'+((practiceIndex+1)%practiceProblems.length)+'">'+(practiceIndex===practiceProblems.length-1?'最初の問題へ':'次の問題へ')+'</button></div>'+
      '<p class="note exercise-source">'+(P.original?'出典：この問題と解説は'+esc(CFG.name)+'の独自作成です。':'出典：<a href="'+esc(P.source_url)+'" target="_blank" rel="noopener">'+esc(P.source_title)+(a.source?', '+esc(a.source):'')+'</a>。<a href="'+esc(P.license_url)+'" target="_blank" rel="noopener">'+esc(P.license)+'</a>（商用利用可）。'+esc(P.changes))+'</p></article>'+footer()+'</div>';
  }

  // ---- グラフ ----
  var FLOW = ['must', 'helps'];
  function reqs(id, levels) {
    return (N[id].requires || []).filter(function (r) { return levels.indexOf(r.level) >= 0; }).map(function (r) { return r.id; });
  }
  function closure(id, levels) {
    var seen = {};
    (function go(k) {
      reqs(k, levels).forEach(function (p) { if (!seen[p]) { seen[p] = 1; go(p); } });
    })(id);
    return seen;
  }
  function mustAnc(id) { return closure(id, ['must']); }
  var depthMemo = {};
  function depth(id) {
    if (depthMemo[id] === undefined) {
      var ps = reqs(id, FLOW);
      depthMemo[id] = ps.length ? 1 + Math.max.apply(null, ps.map(depth)) : 0;
    }
    return depthMemo[id];
  }
  function byDepth(a, b) { return depth(a) - depth(b) || (a < b ? -1 : 1); }
  function hours(id) { return (N[id].cost && N[id].cost.hours) || 0; }
  function yen(id) { return (N[id].cost && N[id].cost.yen) || 0; }

  // 目標までの計画: 必須の前提のうち、まだ習得していないもの
  function plan(goal) {
    var all = mustAnc(goal);
    all[goal] = 1;
    var rest = Object.keys(all).filter(function (k) { return !known[k]; }).sort(byDepth);
    var restSet = {};
    rest.forEach(function (k) { restSet[k] = 1; });
    return {
      all: Object.keys(all).sort(byDepth),
      rest: rest,
      restSet: restSet,
      hours: rest.reduce(function (s, k) { return s + hours(k); }, 0),
      yen: rest.reduce(function (s, k) { return s + yen(k); }, 0)
    };
  }
  function markKnown(id) { known[id] = 1; persist(); track('complete', id); }
  function unmarkKnown(id) {
    delete known[id];
    track('unmark', id);
    persist();
  }

  // ---- 表示の部品 ----
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function header(right) {
    return '<div class="hd"><a class="brand" href="#/">' +
      '<span class="logo"><i class="b1"></i><i class="b2"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i></span>' +
      '<span class="word"><small>HOW TO<br>LEARN ANYTHING</small><b>' + esc(CFG.name) + '</b></span></a>' +
      '<div class="right">' + (right || '') + '</div></div>';
  }
  function footer() {
    return '<div class="foot">HOW TO LEARN ANYTHING ｜ ' + esc(CFG.name) + '　試作品。内容はAIの下書きで、未検証。 <a href="#/records">学習の記録・試用への協力</a>' +
      (HAS_ADS ? '<br>一部のリンクは紹介リンクです。購入や申込があると、運営者が紹介料を受け取ることがあります。' : '') + '</div>';
  }
  function yenText(v) { return v.toLocaleString('ja-JP'); }

  // ---- トップ ----
  var topMessage = '';
  function viewTop() {
    var names = Object.keys(N).map(function (k) { return '<option value="' + esc(N[k].name) + '">'; }).join('');
    var goals = Object.keys(N).filter(function (k) { return N[k].featured; }).map(function (k) {
      return { id: k, p: plan(k) };
    }).sort(function (a, b) {
      return (a.p.rest.length === 0) - (b.p.rest.length === 0) || a.p.hours - b.p.hours;
    });
    var rows = goals.map(function (g) {
      var sq = g.p.all.map(function (k) { return '<i class="' + (known[k] ? 'k' : '') + '"></i>'; }).join('');
      var done = g.p.rest.length === 0;
      return '<a class="goal" href="#/g/' + g.id + '">' +
        '<span class="t">' + esc(N[g.id].name) + '<span class="g">' + esc(CFG.groups[N[g.id].part_of] || '') + '</span></span>' +
        '<span class="sqs" aria-hidden="true">' + sq + '</span>' +
        (done
          ? '<span class="n">習得済み</span><span class="h"></span>'
          : '<span class="n">残り <b>' + g.p.rest.length + '</b> 単元</span><span class="h">' + g.p.hours + '<span>H・仮</span></span>') +
        '</a>';
    }).join('');
    var knownCount = Object.keys(known).length;
    var resume=load('howtree.resume.v1');
    var resumeHtml=resume && N[resume.goal] && N[resume.node] ? '<p><a class="btn" href="#/g/'+resume.goal+'">前回の続き：'+esc(N[resume.node].name)+'</a></p>' : '';
    app.innerHTML = '<div class="wrap narrow">' + header() +
      (list('howtree.known.v1').length && !load(KNOWN_KEY) ? '<p class="note">診断を改良しました。旧版で自動推定した習得記録は保管したまま、現在地を確認し直す方式に変更しています。</p>' : '') + resumeHtml + '<div class="hero"><form data-act="search">' +
      '<label for="goal-input">How to</label>' +
      '<div class="field"><input id="goal-input" type="text" list="goal-names" placeholder="SPI非言語" autocomplete="off">' +
      '<datalist id="goal-names">' + names + '</datalist>' +
      '<button class="go" type="submit">道を見る</button></div></form>' +
      '<div class="lead">' + (topMessage ? esc(topMessage) : '目標を入れると、今の自分からそこまでに必要な学習だけが見える。') + '</div></div>' +
      '<div class="sec"><div class="sechead"><div><div class="rule"></div><h2>今の自分から近い目標</h2></div>' +
      '<div class="right"><span class="sub">現在地</span><span class="badge fill">習得済み ' + knownCount + ' 単元</span>' +
      '<a class="link" href="#/check">現在地を調べる</a>' +
      (knownCount ? '<button class="link" type="button" data-act="reset">最初からにする</button>' : '') +
      '</div></div>' +
      '<div class="goals">' + rows + '</div>' +
      '<div class="legend" style="margin-top:12px"><span><i style="background:var(--ink)"></i>習得済み</span>' +
      '<span><i style="border:1.5px solid var(--red);background:#fff"></i>これから進む</span></div></div>' +
      footer() + '</div>';
    topMessage = '';
  }

  // ---- 囲い(タグの系統) ----
  var SYSTEMS = CFG.systems || [];
  var REGION_KEY = 'howtree.region.v1';
  function regionSystem() {
    var saved = load(REGION_KEY);
    if (saved === 'none') return null;
    return SYSTEMS.filter(function (s) { return s.id === saved; })[0] || SYSTEMS[0] || null;
  }
  // その系統でノードが持つタグ。build.py が1系統1タグを保証する。
  function tagIn(id, sys) {
    var mine = N[id].tags || [];
    for (var i = 0; i < sys.tags.length; i++) if (mine.indexOf(sys.tags[i].id) >= 0) return i;
    return -1;
  }

  // ---- ツリーの配置 ----
  var BW = 116, BH = 46, COLW = 190, ROWH = 68, PADX = 24, PADY = 20, PULL = 0.85;
  var REGPAD = 12, REGGAP = 32, REGTOP = 32;
  function layout(goal, sys) {
    var S = closure(goal, FLOW);
    S[goal] = 1;
    var ids = Object.keys(S);
    var col = {};
    function colOf(id) {
      if (col[id] === undefined) {
        var ps = reqs(id, FLOW);
        col[id] = ps.length ? 1 + Math.max.apply(null, ps.map(colOf)) : 0;
      }
      return col[id];
    }
    ids.forEach(colOf);
    var maxCol = Math.max.apply(null, ids.map(function (k) { return col[k]; }));
    var layers = [];
    for (var c = 0; c <= maxCol; c++) layers.push([]);
    var items = {};
    function add(key, c2) {
      items[key] = { key: key, col: c2, up: [], down: [] };
      layers[c2].push(key);
    }
    ids.sort(byDepth).forEach(function (k) { add(k, col[k]); });
    var edges = [];
    ids.forEach(function (v) {
      (N[v].requires || []).forEach(function (r) {
        if (FLOW.indexOf(r.level) < 0) return;
        var u = r.id, chain = [u];
        for (var c3 = col[u] + 1; c3 < col[v]; c3++) {
          var key = u + '>' + v + '#' + c3;
          add(key, c3);
          chain.push(key);
        }
        chain.push(v);
        for (var i = 0; i < chain.length - 1; i++) {
          items[chain[i]].down.push(chain[i + 1]);
          items[chain[i + 1]].up.push(chain[i]);
        }
        edges.push({ a: u, b: v, level: r.level, chain: chain });
      });
    });
    // 交差を減らす: 隣の列での平均位置で並べ替える
    var pos = {};
    function index() {
      layers.forEach(function (L) { L.forEach(function (k, i) { pos[k] = i; }); });
    }
    index();
    function sweep(L, side) {
      var bc = {};
      L.forEach(function (k) {
        var ns = items[k][side];
        bc[k] = ns.length ? ns.reduce(function (s, n) { return s + pos[n]; }, 0) / ns.length : pos[k];
      });
      L.sort(function (a, b) { return bc[a] - bc[b]; });
      index();
    }
    for (var t = 0; t < 6; t++) {
      for (var d = 1; d <= maxCol; d++) sweep(layers[d], 'up');
      for (var u2 = maxCol - 1; u2 >= 0; u2--) sweep(layers[u2], 'down');
    }
    var maxRows = Math.max.apply(null, layers.map(function (L) { return L.length; }));
    var height = PADY * 2 + maxRows * ROWH;
    var xy = {};
    var regions = [];
    if (!sys) {
      layers.forEach(function (L, c4) {
        L.forEach(function (k, i) {
          xy[k] = { x: PADX + c4 * COLW, y: height / 2 + (i - (L.length - 1) / 2) * ROWH };
        });
      });
    } else {
      // 囲いあり: 同じタグの単元を一つの帯にまとめる。タグのない単元は一つずつ別の帯にする。
      // 帯の中の上下の順は、交差を減らした並びをそのまま使う。
      var bands = [], bandBy = {};
      layers.forEach(function (L, c5) {
        L.forEach(function (k, i) {
          if (!S[k]) return;
          var tag = tagIn(k, sys), key = tag >= 0 ? 't' + tag : 'n' + k;
          var b = bandBy[key];
          if (!b) { b = bandBy[key] = { tag: tag, c0: c5, c1: c5, cols: {}, sum: 0, n: 0 }; bands.push(b); }
          b.c0 = Math.min(b.c0, c5); b.c1 = Math.max(b.c1, c5);
          (b.cols[c5] = b.cols[c5] || []).push(k);
          b.sum += L.length > 1 ? i / (L.length - 1) : 0.5; b.n++;
        });
      });
      bands.forEach(function (b) {
        b.rows = Math.max.apply(null, Object.keys(b.cols).map(function (c6) { return b.cols[c6].length; }));
        b.h = b.rows * ROWH;
        b.mean = b.sum / b.n;
      });
      // 上から積む順: タグの定義順(どの目標でも同じ上下になる)。タグのない単元はその後ろ。
      bands.sort(function (a, b) { return (a.tag < 0) - (b.tag < 0) || a.tag - b.tag || a.mean - b.mean; });
      // 列の範囲が重なる帯だけ縦に積む。重ならない帯は同じ高さに並べてよい。
      function overlap(a, b) { return a.c0 <= b.c1 && b.c0 <= a.c1; }
      bands.forEach(function (b, i) {
        b.top = 0;
        for (var j = 0; j < i; j++) {
          var p = bands[j];
          if (overlap(p, b)) b.top = Math.max(b.top, p.top + p.h + (p.tag >= 0 || b.tag >= 0 ? REGGAP : 0));
        }
      });
      // 列の範囲がつながった帯の組ごとに、縦の中央へ寄せる。
      var groups = [];
      bands.slice().sort(function (a, b) { return a.c0 - b.c0; }).forEach(function (b) {
        var g = groups[groups.length - 1];
        if (g && b.c0 <= g.c1) { g.c1 = Math.max(g.c1, b.c1); g.h = Math.max(g.h, b.top + b.h); g.bands.push(b); }
        else groups.push({ c1: b.c1, h: b.top + b.h, bands: [b] });
      });
      var inner = Math.max.apply(null, groups.map(function (g) { return g.h; }));
      height = REGTOP + inner + PADY;
      groups.forEach(function (g) {
        g.bands.forEach(function (b) {
          var mid = REGTOP + (inner - g.h) / 2 + b.top + b.h / 2;
          var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
          Object.keys(b.cols).forEach(function (c7) {
            b.cols[c7].forEach(function (k, i) {
              var p = xy[k] = { x: PADX + c7 * COLW, y: mid + (i - (b.cols[c7].length - 1) / 2) * ROWH };
              x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + BW);
              y0 = Math.min(y0, p.y - BH / 2); y1 = Math.max(y1, p.y + BH / 2);
            });
          });
          if (b.tag >= 0) regions.push({ name: sys.tags[b.tag].name, x: x0 - REGPAD, y: y0 - REGPAD, w: x1 - x0 + REGPAD * 2, h: y1 - y0 + REGPAD * 2 });
        });
      });
      // 仮ノードは場所を取らない。予備の経路のために、両端を結ぶ直線上に置く。
      edges.forEach(function (e) {
        var a = xy[e.a], b = xy[e.b], last = e.chain.length - 1;
        for (var i = 1; i < last; i++) xy[e.chain[i]] = { x: PADX + items[e.chain[i]].col * COLW, y: a.y + (b.y - a.y) * i / last };
      });
    }
    // 仮ノードは並べ替えにのみ使う。線は箱との衝突を調べて最短の形にする。
    function segment(p, q) {
      if (Math.abs(p.y - q.y) < 0.01) return {p:p, q:q, straight:true};
      var dx=q.x-p.x;
      return {p:p, q:q, c1:{x:p.x+dx*PULL,y:p.y}, c2:{x:p.x+dx*(1-PULL),y:q.y}};
    }
    function point(seg, t) {
      if (seg.straight) return {x:seg.p.x+(seg.q.x-seg.p.x)*t,y:seg.p.y};
      var u=1-t;
      return {x:u*u*u*seg.p.x+3*u*u*t*seg.c1.x+3*u*t*t*seg.c2.x+t*t*t*seg.q.x,
        y:u*u*u*seg.p.y+3*u*u*t*seg.c1.y+3*u*t*t*seg.c2.y+t*t*t*seg.q.y};
    }
    function clear(route, edge) {
      var obstacles=ids.filter(function(k){return k!==edge.a && k!==edge.b;});
      return route.every(function(seg){
        // 約2pxごとに検査し、太い線と枠の間に余白を残す。
        var samples=Math.max(16,Math.ceil((seg.q.x-seg.p.x+Math.abs(seg.q.y-seg.p.y))/2));
        for(var i=0;i<=samples;i++) {
          var v=point(seg,i/samples);
          for(var j=0;j<obstacles.length;j++) {
            var box=xy[obstacles[j]];
            if(v.x>box.x-6 && v.x<box.x+BW+6 && v.y>box.y-BH/2-6 && v.y<box.y+BH/2+6) return false;
          }
        }
        return true;
      });
    }
    var usedBottom=0;
    function routePath(route) {
      route.forEach(function(seg){usedBottom=Math.max(usedBottom,seg.p.y,seg.q.y);});
      var d='M'+route[0].p.x+' '+route[0].p.y;
      route.forEach(function(seg){
        if(seg.straight) d+=' L'+seg.q.x+' '+seg.q.y;
        else d+=' C'+seg.c1.x+' '+seg.c1.y+' '+seg.c2.x+' '+seg.c2.y+' '+seg.q.x+' '+seg.q.y;
      });
      return d;
    }
    edges.forEach(function(e){
      var a=xy[e.a], b=xy[e.b], start={x:a.x+BW,y:a.y}, end={x:b.x,y:b.y};
      var direct=[segment(start,end)];
      if(clear(direct,e)) { e.d=routePath(direct); return; }
      // 途中の列は一本の水平な通路で抜ける。列ごとの蛇行を作らない。
      var firstX=PADX+(col[e.a]+1)*COLW;
      var lastX=PADX+(col[e.b]-1)*COLW+BW;
      var lanes=[a.y,b.y,(a.y+b.y)/2,8,height-8];
      ids.forEach(function(k){
        if(col[k]>col[e.a] && col[k]<col[e.b]) {
          lanes.push(xy[k].y-BH/2-8,xy[k].y+BH/2+8);
        }
      });
      var candidates=lanes.filter(function(y,i){return y>=8 && y<=height-8 && lanes.indexOf(y)===i;}).map(function(y){
        var route=[segment(start,{x:firstX,y:y}),segment({x:firstX,y:y},{x:lastX,y:y}),segment({x:lastX,y:y},end)];
        return {route:route, score:Math.abs(y-a.y)+Math.abs(b.y-y), curves:route.filter(function(s){return !s.straight;}).length};
      }).sort(function(x,y){return x.score-y.score || x.curves-y.curves;});
      var chosen=candidates.filter(function(c){return clear(c.route,e);})[0];
      if(chosen) {e.d=routePath(chosen.route); return;}
      // 通路が塞がる特殊な配置だけ、箱を避ける従来の通過位置を使う。
      var fallback=[];
      for(var i=0;i<e.chain.length-1;i++) {
        var p=xy[e.chain[i]], q=xy[e.chain[i+1]];
        fallback.push(segment({x:p.x+BW,y:p.y},{x:q.x,y:q.y}));
        if(i<e.chain.length-2) fallback.push(segment({x:q.x,y:q.y},{x:q.x+BW,y:q.y}));
      }
      e.d=routePath(fallback);
    });
    return {
      width: PADX * 2 + maxCol * COLW + BW,
      height: Math.max(usedBottom, Math.max.apply(null,ids.map(function(k){return xy[k].y+BH/2;})))+PADY,
      nodes: ids.map(function (k) { return { id: k, x: xy[k].x, y: xy[k].y - BH / 2 }; }),
      edges: edges,
      regions: regions
    };
  }

  // ---- 目標ページ ----
  var selected = null;
  var reportMode = '';
  function viewGoal(goal) {
    if (!N[goal]) { location.hash = '#/'; return; }
    if (!selected || !N[selected]) selected = goal;
    var p = plan(goal);
    var sys = regionSystem();
    var L = layout(goal, sys);
    var frames = L.regions.map(function (r) {
      return '<div class="region" style="left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w + 'px;height:' + r.h + 'px"></div>';
    }).join('');
    var frameNames = L.regions.map(function (r) {
      return '<span class="region-name" style="left:' + (r.x + 10) + 'px;top:' + (r.y - 10) + 'px">' + esc(r.name) + '</span>';
    }).join('');
    var regionSwitch = SYSTEMS.length ? '<div class="region-switch"><span class="sub">囲い</span>' + SYSTEMS.map(function (s) {
      return '<button type="button" class="chip' + (sys && sys.id === s.id ? ' known' : '') + '" data-act="region" data-v="' + esc(s.id) + '" aria-pressed="' + !!(sys && sys.id === s.id) + '">' + esc(s.name) + '</button>';
    }).join('') + '<button type="button" class="chip' + (sys ? '' : ' known') + '" data-act="region" data-v="none" aria-pressed="' + !sys + '">なし</button></div>' : '';
    var stubCount = p.rest.filter(function (k) { return N[k].status === 'stub'; }).length;
    var num = {};
    p.rest.forEach(function (k, i) { num[k] = i + 1; });
    var rank = { off: 0, known: 1, path: 2 };
    var paths = L.edges.map(function (e) {
      var state = 'off';
      if (e.level === 'must' && p.restSet[e.b] && (p.restSet[e.a] || known[e.a])) state = 'path';
      else if (e.level === 'must' && known[e.a] && known[e.b]) state = 'known';
      return { state: state, html: '<path data-from="'+e.a+'" data-to="'+e.b+'" class="' + e.level + ' ' + state + '" d="' + e.d + '"></path>' };
    }).sort(function (a, b) { return rank[a.state] - rank[b.state]; }).map(function (x) { return x.html; }).join('');
    var boxes = L.nodes.map(function (n) {
      var k = n.id, cls = 'nd';
      if (k === goal && !known[k]) cls += ' goalnode';
      else if (p.restSet[k]) cls += ' rest';
      else if (known[k]) cls += ' known';
      if (N[k].status === 'stub') cls += ' stub';
      if (k === selected) cls += ' sel';
      return '<button type="button" class="' + cls + '" data-act="select" data-id="' + k + '" style="left:' + n.x + 'px;top:' + n.y + 'px">' +
        '<span class="t">' + (num[k] ? '<b>' + num[k] + '</b>' : '') + esc(N[k].name) + '</span>' +
        '<span class="c">' + (N[k].status === 'stub' ? '未作成' : '約' + hours(k) + ' H') + '</span></button>';
    }).join('');
    var selectedStep = p.rest.indexOf(selected);
    var visibleSteps = selectedStep >= 0 ? p.rest.slice(0, selectedStep + 1) : p.rest;
    var steps = visibleSteps.length
      ? visibleSteps.map(function (k) {
        return '<button type="button" class="step" data-act="select" data-id="' + k + '"><span class="no">' + num[k] + '</span>' +
          '<span class="t">' + esc(N[k].name) + '</span><span class="h">' + '約' + hours(k) + ' H</span></button>';
      }).join('')
      : '<p class="muted">この目標は、すでに習得済み。</p>';
    app.innerHTML = '<div class="wrap">' + header('<a class="link" href="#/check/'+goal+'">この目標の現在地を調べる</a>') +
      '<div class="band"><div class="main"><span class="tag">目標</span><h1>' + esc(N[goal].name) + '</h1><p>' + esc(N[goal].goal) + '</p></div>' +
      '<div class="stats"><div class="stat"><div class="k">残り</div><div class="v">' + p.rest.length + '<span class="jp">単元</span></div></div>' +
      '<div class="stat"><div class="k">学習時間（仮の目安）</div><div class="v">' + p.hours + '<span class="jp">時間</span></div></div>' +
      (p.yen ? '<div class="stat"><div class="k">費用</div><div class="v">' + yenText(p.yen) + '<span class="jp">円</span></div></div>' : '') +
      '</div></div>' +
      '<p class="note">' + (stubCount ? '未作成の単元が ' + stubCount + ' 個あり、その学習時間は合計に入っていません。' : '') + '時間は実測前の仮置きです。教材の購入費は含みません。既にできる単元は個別に習得済みにできます。</p>' + (N[goal].scope_note ? '<p class="note">'+esc(N[goal].scope_note)+'</p>' : '') + '<div class="legend" style="margin-top:20px"><span><i style="border:2px solid var(--red);background:#fff"></i>これから進む</span>' +
      '<span><i style="background:var(--ink)"></i>習得済み</span>' +
      '<span><i style="border:1px solid var(--ink)"></i>通らなくてよい</span>' +
      '<span><i style="border:1px dashed var(--gray)"></i>未作成（枠だけ）</span>' +
      '<span><i style="height:2px;width:22px;background:var(--gray)"></i>細い線は「あると楽」</span></div>' +
      (p.rest.length ? '<p><button class="btn" data-act="next" data-id="'+p.rest[0]+'">次の一単元：'+esc(N[p.rest[0]].name)+'</button></p>' : '') + regionSwitch + '<p class="note mobile-hint">ツリーは上下・左右にスクロールできます。下の一覧からも単元を選べます。</p><div class="treebox"><div class="tree" style="width:' + L.width + 'px;height:' + L.height + 'px">' +
      frames + '<svg width="' + L.width + '" height="' + L.height + '" aria-hidden="true">' + paths + '</svg>' + frameNames + boxes + '</div></div>' +
      '<div class="cols"><div class="sequence"><div class="rule"></div><h2>進む順番</h2><div class="steps">' + steps + '</div></div>' +
      '<div class="detail">' + detail(selected, goal) + '</div></div>' +
      footer() + '</div>';
    var treebox=document.querySelector('.treebox');
    if(window.innerWidth<=640) treebox.scrollTop=Math.max(0,(treebox.scrollHeight-treebox.clientHeight)/2);
  }

  // 中身がどこまでできているか。ノードの内容から決まり、手では付けない。
  function stageText(n) {
    if (n.status === 'verified') return 'AI検証済み';
    if (n.status === 'stub') return '未作成（枠だけ）';
    if (n.type === 'target') return '到達点・AI下書き';
    if (!n.practice) return '説明のみ・練習は未作成';
    return n.practice.reviewed_at ? '練習までAI検証済み' : '練習あり・AI検証前';
  }
  function amazonUrl(url) {
    return url + (CFG.amazon_tag ? (url.indexOf('?') < 0 ? '?' : '&') + 'tag=' + encodeURIComponent(CFG.amazon_tag) : '');
  }
  // 紹介リンクが一つでもあれば、全ページの下にその旨を出す
  var HAS_ADS = !!CFG.amazon_tag || Object.keys(N).some(function (k) {
    return (N[k].resources || []).some(function (r) { return r.sponsored; });
  });
  function detail(id, goal) {
    var n = N[id];
    var res = (n.resources || []).map(function (r) {
      if (r.kind === 'book' || r.kind === 'course') {
        // 本と講座は表紙つきの札で出す。店ごとにボタンを並べ、紹介リンクにはその表示を付ける。
        var stores = [];
        if (r.url) stores.push({ label: r.kind === 'course' ? '講座を見る' : 'Amazonで見る', url: r.kind === 'book' ? amazonUrl(r.url) : r.url, ad: !!r.sponsored || (r.kind === 'book' && !!CFG.amazon_tag) });
        if (r.rakuten_url) stores.push({ label: '楽天ブックスで見る', url: r.rakuten_url, ad: !!r.sponsored });
        var ad = stores.some(function (st) { return st.ad; });
        function attrs(st) { return 'data-act="resource" data-id="' + id + '" data-v="' + esc(st.url) + '" href="' + esc(st.url) + '" target="_blank" rel="noopener' + (st.ad ? ' sponsored' : '') + '"'; }
        return '<div class="book"><a class="cover" ' + attrs(stores[0]) + ' aria-hidden="true" tabindex="-1">' +
          (r.image ? '<img src="' + esc(r.image) + '" alt="" loading="lazy">' : '<span>' + esc(r.title) + '</span>') + '</a>' +
          '<div class="info"><div class="meta"><span class="badge">' + (r.kind === 'course' ? '講座' : '本') + '</span>' + (ad ? '<span class="note">紹介リンク</span>' : '') + '</div>' +
          '<a class="t" ' + attrs(stores[0]) + '>' + esc(r.title) + '</a>' +
          (r.publisher ? '<span class="a">' + esc(r.publisher) + '</span>' : '') +
          (r.assumes ? '<span class="a">前提: ' + esc(r.assumes) + '</span>' : '') +
          '<div class="btns">' + stores.map(function (st) { return '<a class="btn" ' + attrs(st) + '>' + st.label + '</a>'; }).join('') +
          (r.errata_url ? '<a class="link" href="' + esc(r.errata_url) + '" target="_blank" rel="noopener">正誤表</a>' : '') + '</div></div></div>';
      }
      return '<div class="res"><span class="badge' + (r.free ? ' fill' : '') + '">' + (r.free ? '無料' : '本') + '</span>' +
        '<a data-act="resource" data-id="'+id+'" data-v="'+esc(r.url)+'" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>' +
        (r.assumes ? '<span class="a">前提: ' + esc(r.assumes) + '</span>' : '') + '</div>';
    }).join('');
    var tag = CFG.amazon_tag ? '&tag=' + encodeURIComponent(CFG.amazon_tag) : '';
    var search = 'https://www.amazon.co.jp/s?k=' + encodeURIComponent(n.name + ' 入門') + tag;
    var report = '';
    if (reportMode === 'done') {
      report = '<p class="sub" style="margin-top:12px">かかった時間は、' + hours(id) + '時間と比べてどうだった</p><div class="btns">' +
        ['短かった', '同じくらい', '長かった'].map(function (v) { return '<button type="button" class="chip" data-act="report-send" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>';
    } else if (reportMode === 'stuck') {
      var opts = Object.keys(closure(id, FLOW)).sort(byDepth).reverse().slice(0, 6);
      report = '<p class="sub" style="margin-top:12px">抜けていたと思う前提はどれ</p><div class="btns">' +
        opts.map(function (k) { return '<button type="button" class="chip" data-act="report-send" data-v="' + k + '">' + esc(N[k].name) + '</button>'; }).join('') +
        '<button type="button" class="chip" data-act="report-send" data-v="unknown">わからない</button></div>';
    } else if (reportMode === 'res') {
      report = '<p class="sub" style="margin-top:12px">合わなかった理由はどれ</p><div class="btns">' +
        ['難しすぎた', '簡単すぎた', '内容が違った'].map(function (v) { return '<button type="button" class="chip" data-act="report-send" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>';
    } else if (reportMode === 'sent') {
      report = '<p class="note">この端末に記録した。試作品のため、まだ送信はされない。</p>';
    }
    return '<div class="rule"></div><h2>選択中の単元</h2>' +
      '<h3>' + esc(n.name) + '</h3>' +
      '<div class="meta"><span class="badge">' + stageText(n) + '</span>' +
      '<span class="muted">' + esc(CFG.groups[n.part_of] || '') + ' ・ ' + hours(id) + '時間' + (yen(id) ? ' ・ ' + yenText(yen(id)) + '円' : '') + '</span></div>' +
      (n.status === 'stub' ? '<p class="note">この単元はまだ中身がありません。名前・到達条件・前提は、学習指導要領の項目名をもとにした仮置きです。</p>' : '') +
      conceptHtml(n) +
      '<div class="blk"><div class="sub">到達条件</div><p>' + esc(n.goal) + '</p></div>' +
      miniLesson(n) + '<div class="blk"><div class="sub">読む資料</div>' + (res || '<p class="muted">資料はまだ選ばれていない。</p>') +
      '<p><a data-act="resource" data-id="'+id+'" data-v="book-search" class="link" href="' + search + '" target="_blank" rel="noopener sponsored">この単元の本を探す</a>' + (CFG.amazon_tag ? ' <span class="note">紹介リンク</span>' : '') + '</p></div>' +
      '<div class="blk"><button class="btn red" data-act="start" data-id="'+id+'">'+(list(START_KEY).indexOf(id)>=0?'学習中・ここから再開':'ここから学習を始める')+'</button><p class="note">資料を別タブで開き、戻ったら到達条件を確認して習得済みにしてください。</p></div>' + (n.sources ? '<div class="blk"><div class="sub">範囲を確認した資料</div>'+n.sources.map(function(r){return '<p><a target="_blank" rel="noopener" href="'+esc(r.url)+'">'+esc(r.title)+'</a></p>';}).join('')+'</div>':'') + '<div class="blk btns">' +
      (id !== goal ? '<a class="btn red" href="#/g/' + id + '">ここを目標にする</a>' : '') +
      (known[id]
        ? '<button type="button" class="btn" data-act="unknow" data-id="' + id + '">習得済みを取り消す</button>'
        : '<button type="button" class="btn fill" data-act="know" data-id="' + id + '">習得済みにする</button>') +
      '</div>' +
      '<div class="blk"><div class="sub">報告する</div><div class="btns">' +
      [['done', 'できた'], ['stuck', 'つまずいた'], ['res', '資料が合わない']].map(function (b) {
        return '<button type="button" class="btn' + (reportMode === b[0] ? ' fill' : '') + '" data-act="report" data-v="' + b[0] + '">' + b[1] + '</button>';
      }).join('') + '</div>' + report + '</div>';
  }

  // 目標の前提を個別に確認する。正解から他単元の習得を推定しない。
  var chk = null;
  function viewCheck(goal) {
    goal = N[goal] ? goal : 'spi-nonverbal';
    if (!chk || chk.goal !== goal) {
      var all=mustAnc(goal); all[goal]=1;
      chk={goal:goal, ids:Object.keys(all).filter(function(k){return N[k].assessment;}).sort(byDepth), i:0, answers:Object.assign({},known), revealed:false};
    }
    var done=chk.i>=chk.ids.length, id=chk.ids[chk.i], card='';
    if(done){
      card='<h2>結果を確認して、残す単元を選ぶ</h2><p>チェックした単元だけを習得済みにします。一問では単元全体を判定できないため、到達条件も確認してください。</p>'+chk.ids.map(function(k){
        return '<label class="review-row"><input type="checkbox" data-act="check-toggle" data-id="'+k+'" '+(chk.answers[k]?'checked':'')+'> <b>'+esc(N[k].name)+'</b><span>'+esc(N[k].goal)+'</span></label>';
      }).join('')+'<div class="btns"><button class="btn red" data-act="check-apply">選んだ単元だけ反映して木へ</button><button class="btn" data-act="check-reset">やり直す</button></div>';
    } else {
      var q=N[id].assessment;
      card='<div class="sub">'+esc(N[id].name)+'</div><div class="q">'+esc(q.question)+'</div>';
      if(chk.revealed) card+='<p role="status">'+(chk.answers[id]?'正解です。':'ここは復習の候補です。')+' '+esc(q.explanation)+'</p><button class="btn red" data-act="check-next">次へ</button>';
      else card+='<div class="btns">'+q.options.map(function(o,i){return '<button class="btn" data-act="check-answer" data-v="'+i+'">'+esc(o)+'</button>';}).join('')+'<button class="btn" data-act="check-answer" data-v="-1">わからない・後で確認</button></div>';
      card+='<p><button class="link" data-act="check-finish">ここまでで結果を見る</button></p>';
    }
    app.innerHTML='<div class="wrap narrow">'+header()+'<div class="band"><div><span class="tag">'+esc(N[goal].name)+'</span><h1>開始地点を確認する</h1><p>'+ (done?'結果の見直し':(chk.i+1)+' / '+chk.ids.length+'問・途中で終えられます')+'</p></div></div><p class="note">独自の確認問題です。SPIの実問題や能力判定ではありません。反映ボタンを押すまでは、既存の習得記録は変更しません。結果画面でチェックを直せます。</p><div class="card">'+card+'</div><p><a class="link" href="#/g/'+goal+'">反映せず木を見る</a></p>'+footer()+'</div>';
  }

  // ---- 画面の切り替えと操作 ----
  var lastGoal = null;
  function render() {
    var h = location.hash.replace(/^#\/?/, '');
    var pid = h.indexOf('practice/') === 0 ? decodeURIComponent(h.slice(9)) : '';
    if (pid && N[pid] && N[pid].practice) { viewPractice(pid);
    } else if (h.indexOf('g/') === 0) {
      var goal = decodeURIComponent(h.slice(2));
      if (goal !== lastGoal) { var resume=load('howtree.resume.v1'); selected = resume && resume.goal===goal && N[resume.node] ? resume.node : goal; reportMode = ''; lastGoal = goal; track('goal', goal); }
      viewGoal(goal);
    } else if (h === 'records') { viewRecords();
    } else if (h === 'check' || h.indexOf('check/') === 0) {
      viewCheck(h.slice(6));
    } else {
      viewTop();
    }
  }
  function rerenderKeepingScroll() {
    var box = document.querySelector('.treebox');
    var sx = box ? box.scrollLeft : 0, st = box ? box.scrollTop : 0, sy = window.scrollY;
    render();
    box = document.querySelector('.treebox');
    if (box) { box.scrollLeft = sx; box.scrollTop = st; }
    window.scrollTo(0, sy);
  }
  window.addEventListener('hashchange', function () { if(location.hash.indexOf('#/g/')!==0) lastGoal=null; render(); window.scrollTo(0, 0); });

  var lastNodeClick = {id: null, at: 0};
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.tagName === 'FORM') return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
    if(act==='practice-pick'){practiceIndex=Number(v);viewPractice(practiceNode);}
    else if(act==='practice-prompt'){
      // 押した時点でコピーする。できない環境では、文章を選択して手動に切り替える。
      var panel=document.getElementById('prompt-panel'), box=document.getElementById('practice-prompt'), mark=el.parentNode.querySelector('.copied');
      box.value=practicePrompt(Number(v)); panel.hidden=false; document.getElementById('copy-status').textContent='';
      Array.prototype.forEach.call(document.querySelectorAll('.copied'),function(x){x.textContent='';});
      var manual=function(){mark.textContent='自動でコピーできませんでした。下の文章を選択したので、手動でコピーしてください。';panel.scrollIntoView({behavior:'smooth',block:'nearest'});box.focus();box.select();};
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(function(){mark.textContent='コピーしました。使っているAIに貼り付けてください。';},manual);
      else manual();
    }
    else if(act==='practice-close'){document.getElementById('prompt-panel').hidden=true;}
    else if(act==='practice-copy'){
      var field=document.getElementById('practice-prompt'), status=document.getElementById('copy-status');
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(field.value).then(function(){status.textContent='コピーしました。使っているAIに貼り付けてください。';},function(){field.focus();field.select();status.textContent='文章を選択しました。手動でコピーしてください。';});
      else {field.focus();field.select();status.textContent='文章を選択しました。手動でコピーしてください。';}
    }
    else if (act === 'region') { save(REGION_KEY, v); render(); }
    else if (act === 'next') { selected=id; reportMode=''; render(); document.querySelector('.detail').scrollIntoView({behavior:'smooth'}); }
    else if (act === 'select') {
      if (el.classList.contains('nd') && lastNodeClick.id === id && Date.now() - lastNodeClick.at < 400) {
        lastNodeClick = {id: null, at: 0}; location.hash = '#/g/' + encodeURIComponent(id); return;
      }
      lastNodeClick = el.classList.contains('nd') ? {id: id, at: Date.now()} : {id: null, at: 0};
      selected = id; reportMode = ''; rerenderKeepingScroll();
    }
    else if (act === 'know') { markKnown(id); rerenderKeepingScroll(); }
    else if (act === 'unknow') { unmarkKnown(id); rerenderKeepingScroll(); }
    else if (act === 'report') { reportMode = v; rerenderKeepingScroll(); }
    else if (act === 'report-send') {
      var reports = list(REPORT_KEY);
      reports.push({ node: selected, kind: reportMode, value: v, at: new Date().toISOString() });
      save(REPORT_KEY, reports.slice(-1000));
      if (reportMode === 'done') markKnown(selected);
      track('report',selected,reportMode);
      reportMode = 'sent';
      rerenderKeepingScroll();
    }
    else if (act === 'reset') { known = {}; persist(); render(); }
    else if(act==='check-answer'){ var k=chk.ids[chk.i]; chk.answers[k]=Number(v)===N[k].assessment.answer; chk.revealed=true; track('check',k,chk.answers[k]?'correct':'review'); render(); }
    else if(act==='check-next'){chk.i++; chk.revealed=false; render();}
    else if(act==='check-finish'){chk.i=chk.ids.length; render();}
    else if(act==='check-toggle'){chk.answers[id]=el.checked;}
    else if(act==='check-reset'){chk=null; render();}
    else if(act==='check-apply'){
      chk.ids.forEach(function(k){if(chk.answers[k]) known[k]=1; else if(chk.answers[k]===false) delete known[k];}); persist();
      var dest=chk.goal; chk=null; track('check_apply',dest); location.hash='#/g/'+dest;
    }
    else if(act==='resource'){track('resource',id,v);}
    else if(act==='start'){var started=list(START_KEY); if(started.indexOf(id)<0) started.push(id); save(START_KEY,started); save('howtree.resume.v1',{goal:lastGoal,node:id}); track('start',id); rerenderKeepingScroll();}
    else if(act==='measure'){save(CONSENT_KEY,load(CONSENT_KEY)!==true); render();}
    else if(act==='export'){exportRecords();}
    else if(act==='erase'){save(EVENT_KEY,[]); save(REPORT_KEY,[]); render();}

  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var q = (document.getElementById('goal-input').value || '').trim();
    if (!q) return;
    var ids = Object.keys(N);
    var hit = ids.filter(function (k) { return N[k].name === q; })[0] ||
      ids.filter(function (k) { return N[k].name.indexOf(q) >= 0 || q.indexOf(N[k].name) >= 0; })[0];
    if (hit) { location.hash = '#/g/' + hit; }
    else { topMessage = '「' + q + '」の木は、まだない。'; render(); }
  });

  render();
})();

</script>
</body>
</html>
