"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を、練習の検証と合わせて確認。辞書の語釈（リーグ戦、シード）と照合し、指摘を反映した後に再検証。","text":"リーグ戦（総当たり戦）は、どのチームも、ほかのすべてのチームと対戦する試合の方式です。2回以上ずつ対戦するリーグ戦もありますが、ここでは、どのチームとも1回ずつ対戦するものとします。nチームのリーグ戦では、1チームの試合数は n − 1、全体の試合数は、nチームから対戦する2チームを選ぶ組合せの数で n × (n − 1) ÷ 2 です。引き分けがなければ、1試合ごとに勝ちが1つと負けが1つ生まれるので、全チームの勝ち数の合計も、負け数の合計も、試合数と等しくなります。結果は勝敗表に整理します。行のチームから見た結果を、勝ちは○、負けは×で書きます。AがBに勝てば、A の行の B の欄が○、B の行の A の欄が×になり、斜めに折り返した位置の欄は、いつも反対の印です。トーナメント戦（勝ち抜き戦）では、1試合ごとに1チームが負けて抜け、優勝する1チームのほかはちょうど1回ずつ負けます。引き分けや3位決定戦がなければ、試合数は「チーム数 − 1」で、1回戦を戦わずに2回戦から出るチーム（シードと呼ばれることが多い）があっても変わりません。","example":"5チームのリーグ戦：5 × (5 − 1) ÷ 2 = 10\n1チームの試合数：5 − 1 = 4\n10チームのトーナメント戦：10 − 1 = 9","note":"勝敗表の左上から右下への斜めの欄は、自分どうしの対戦なので「－」にします。まだ決まっていない欄は「・」で表します。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。「確実に言える」の判定のために、推論を必須の前提に足した。学習時間は、公務員の単元どうしの釣り合いと予備校・対策本の分野の立て方との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"spi-counting","level":"must"},{"id":"spi-inference","level":"must"},{"id":"kmn-matching","level":"helps"}],"assessment":{"question":"7チームがリーグ戦（総当たり戦。どのチームとも1回ずつ対戦）を行います。試合は全部で何試合でしょうか。","options":["21試合","42試合","6試合"],"answer":0,"explanation":"7 × 6 ÷ 2 = 21。42試合は、AとBの対戦とBとAの対戦を別に数えた誤りで、2で割る。6試合は、1チームあたりの試合数。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の読み・別の選択肢で試して確認。選択肢と別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","title":"試合数と勝ち数の合計から、勝敗を推理する","lead":"勝敗表は、対称の欄を反対の印で埋める。勝ち数の合計は試合数と等しい。本試験は五つの選択肢から確実に言えるものを選ぶ形式で、チームの数はもっと多くなります。ここでは解き方を身につけるために、小さい大会で練習します。","original":true,"problems":[{"label":"勝敗表を埋めて、成績を決める","question":"A、B、C、Dの4チームがリーグ戦（どのチームとも1回ずつ対戦）を行いました。引き分けはありません。次のことがわかっています。\n・Aは全勝した。\n・BはCに勝った。\n・Dは1勝だけした。\n・Cは全敗ではない。\nBは何勝何敗でしたか。","answer":"1勝2敗","alternatives":[{"try":"2勝1敗（BはCとDに勝った）","why_not":"BがDに勝つと、Dの1勝はCから挙げたことになり、CはA、B、Dの全部に負けて全敗になります。「Cは全敗ではない」に合いません。"}],"steps":[{"title":"勝敗表を作り、条件をそのまま書き入れる","table":{"rows":[["","A","B","C","D"],["A","－","○","○","○"],["B","・","－","○","・"],["C","・","・","－","・"],["D","・","・","・","－"]]},"body":"Aは全勝なので、Aの行はすべて○です。BはCに勝ったので、Bの行のCの欄が○です。行のチームから見た結果を書いています。"},{"title":"斜めに折り返した位置に、反対の印を書く","table":{"rows":[["","A","B","C","D"],["A","－","○","○","○"],["B","×","－","○","・"],["C","×","×","－","・"],["D","×","・","・","－"]]},"body":"AがBに勝てば、BはAに負けています。Bの行のAの欄は×です。同じように、C と D の行の A の欄、C の行の B の欄も×になります。残っている試合は、BとD、CとDの2試合です。"},{"title":"Cが全敗でないことから、CとDの試合を決める","table":{"rows":[["","A","B","C","D"],["A","－","○","○","○"],["B","×","－","○","・"],["C","×","×","－","○"],["D","×","・","×","－"]]},"body":"CはAにもBにも負けています。残りのDとの試合で勝たないと全敗になるので、CはDに勝ちました。"},{"title":"Dの1勝から、BとDの試合を決める","table":{"rows":[["","A","B","C","D"],["A","－","○","○","○"],["B","×","－","○","×"],["C","×","×","－","○"],["D","×","○","×","－"]]},"body":"DはAにもCにも負けています。1勝するには、残りのBとの試合で勝つしかありません。"},{"title":"Bの成績を読み、勝ち数の合計で確かめる","formula":"B：Cに勝ち、AとDに負け → 1勝2敗\n試合数：4 × 3 ÷ 2 = 6\n勝ち数の合計：3 + 1 + 1 + 1 = 6","body":"勝ち数は、A が3、B が1、C が1、D が1です。合計が試合数の6と等しく、表に矛盾がありません。"}]},{"label":"リーグ戦とトーナメント戦を合わせた試合数","question":"24チームを、4チームずつの6つの組に分け、組ごとにリーグ戦（どのチームとも1回ずつ対戦）を行います。そのあと、各組で1位になった6チームがトーナメント戦を行い、優勝を決めます。引き分けや3位決定戦はありません。全部で何試合行われるでしょうか。","answer":"41試合","alternatives":[{"try":"77試合（1組のリーグ戦を 4 × 3 = 12 試合として数える）","why_not":"4 × 3 は、AとBの対戦とBとAの対戦を別々に数えています。同じ試合を2回数えているので、2で割って1組6試合です。"}],"steps":[{"title":"1組のリーグ戦の試合数を求める","formula":"4 × (4 − 1) ÷ 2 = 6","body":"4チームから対戦する2チームを選ぶ組合せの数です。"},{"title":"6組分のリーグ戦の試合数を求める","formula":"6 × 6 = 36","body":"どの組も4チームなので、1組6試合が6組あります。"},{"title":"トーナメント戦の試合数を求める","formula":"6 − 1 = 5","body":"6チームのトーナメント戦では、優勝の1チームのほかの5チームが1回ずつ負けます。1試合で負けるのは1チームなので、5試合です。6チームでは、1回戦を戦わずに2回戦から出るチーム（シードと呼ばれることが多い）ができますが、試合数は変わりません。"},{"title":"合計する","formula":"36 + 5 = 41","body":"リーグ戦とトーナメント戦の試合数を足します。"}]},{"label":"勝ち数の合計から、残りのチームの勝ち数を求める","question":"A〜Fの6チームがリーグ戦（どのチームとも1回ずつ対戦）を行いました。引き分けはありません。表は、A〜Eの5チームの勝ち数です。Fは何勝何敗でしたか。","answer":"1勝4敗","tables":[{"caption":"A〜Eの勝ち数","rows":[["チーム","A","B","C","D","E"],["勝ち数","4","3","3","2","2"]]}],"alternatives":[{"try":"16勝（勝ち数の合計を 6 × 5 = 30 として引く）","why_not":"6 × 5 = 30 は、同じ試合を両方のチームから数えた数です。試合数は15で、勝ち数の合計も15です。また、1チームの試合数は5なので、16勝はあり得ません。"}],"steps":[{"title":"試合数を求める","formula":"6 × (6 − 1) ÷ 2 = 15","body":"引き分けがないので、勝ち数の合計は試合数の15と等しくなります。"},{"title":"A〜Eの勝ち数を合計する","formula":"4 + 3 + 3 + 2 + 2 = 14","body":"表の5チームの勝ち数を足します。"},{"title":"残りがFの勝ち数になる","formula":"15 − 14 = 1","body":"Fは1勝です。"},{"title":"Fの負け数を求める","formula":"5 − 1 = 4","body":"6チームのリーグ戦なので、Fの試合数は5です。1勝なので、負けは4です。"}]},{"label":"勝ち数がすべて違うときに、確実に言えることを選ぶ","question":"A〜Eの5チームがリーグ戦（どのチームとも1回ずつ対戦）を行いました。引き分けはありません。次のことがわかっています。\n・5チームの勝ち数は、すべて違う。\n・AはBに負けた。\n・CはBに勝った。\n・EはCに勝った。\n次のア〜ウのうち、確実に言えるものを1つ選んでください。","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"Eは全勝した。","correct":false,"reason":"勝ち数の多い順に D、E、C、B、A の場合も条件に合います。このとき全勝はDで、Eは3勝1敗です。"},{"key":"イ","text":"Aは全敗した。","correct":false,"reason":"勝ち数の多い順に E、C、B、A、D の場合も条件に合います。このとき全敗はDで、Aは1勝3敗です。"},{"key":"ウ","text":"CはAに勝った。","correct":true,"reason":"勝ち数がすべて違うので、勝ち数の多いチームは、少ないチームに必ず勝っています。CはBより、BはAより勝ち数が多いので、CはAより勝ち数が多く、Aに勝っています。"}],"steps":[{"title":"試合数と、1チームの勝ち数の範囲を確かめる","formula":"試合数：5 × 4 ÷ 2 = 10\n1チームの試合数：5 − 1 = 4","body":"1チームの勝ち数は、0、1、2、3、4のどれかです。"},{"title":"勝ち数がすべて違うことから、勝ち数の組を決める","formula":"勝ち数：4、3、2、1、0\n4 + 3 + 2 + 1 + 0 = 10","body":"あり得る勝ち数は0〜4の5通りで、5チームの勝ち数がすべて違うので、ちょうど一つずつ使います。合計は試合数の10と合います。"},{"title":"勝ち数の多いチームが、少ないチームに勝っていることを確かめる","formula":"4勝のチーム：ほかの4チームすべてに勝った\n3勝のチーム：4勝のチームにだけ負け、残りの3チームに勝った\n2勝のチーム：4勝と3勝のチームに負け、残りの2チームに勝った\n1勝のチーム：0勝のチームにだけ勝った","body":"上から順に決まります。どの2チームでも、勝ち数の多いほうが勝っています。"},{"title":"条件を、勝ち数の多い少ないに直す","formula":"AはBに負けた → B は A より多い\nCはBに勝った → C は B より多い\nEはCに勝った → E は C より多い\n勝ち数の多い順：E、C、B、A（Dの位置は決まらない）","body":"Dについての条件はないので、Dは5か所のどこに入ってもかまいません。"},{"title":"選択肢ごとに、Dの位置を変えて調べる","formula":"ア：Dが最も多いとき、Eは全勝ではない → 確実には言えない\nイ：Dが最も少ないとき、Aは全敗ではない → 確実には言えない\nウ：Dがどこでも、C は A より多い → 確実に言える","body":"Dの位置によって変わることは、確実には言えません。CとAの順は、Dがどこに入っても変わりません。"}]}]}},"kmn-graph":{"id":"kmn-graph","name":"グラフの資料","type":"learn","goal":"対前年増加率や指数を示したグラフから、実数の増減や大小についての記述が正しいかどうかを判定できる。","part_of":"koumuin","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"資料解釈では、実数ではなく、対前年増加率や指数をグラフにした資料がよく出ます。対前年増加率のグラフでは、線や棒の高さは売上などの実数ではありません。高さが下がっても、値が0より大きければ実数は前の年より増えています。実数が減ったのは、値が0より小さい年だけです。何年か離れた年どうしを比べるときは、各年の（1 + 増加率）をかけ合わせます。増加率を足し合わせるのは、近い値を出す目安にしかなりません。指数のグラフは、基準の年を100とした大きさです。基準の年の実数が違うものどうしは、指数が大きくても、実数が多いとは言えません。","example":"対前年増加率 10%：前の年の 1.1 倍\n対前年増加率 −5%：前の年の 0.95 倍\n2年続けて10%増：1.1 × 1.1 = 1.21 倍（20%増ではない）\n指数 80 から 100 へ：100 ÷ 80 = 1.25 倍（指数の差 20 は、増加率ではない）","note":"グラフの値は、問題ごとに「何を表した数か」を、題と縦軸の単位で先に確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。増加率と指数の定義と計算は資料解釈に収まる。増加率の積み重ね、増加額、基準の違う指数を比べられないことは、この単元で説明している。資料解釈との重なりを踏まえ、学習時間を5時間にした。学習時間は、単元どうしの釣り合いと外部の目安との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"kmn-data","level":"must"}],"assessment":{"question":"ある店の売上の対前年増加率は、2023年が20%、2024年が −10% だった。2024年の売上は、2022年の売上と比べてどうなった？","options":["増えた","減った","変わらない"],"answer":0,"explanation":"2022年を1とすると、2023年は1.2、2024年は 1.2 × 0.9 = 1.08 で、2022年より増えている。2024年に10%減ったのは2023年に対してで、2022年に対してではない。2024年に10%減ったことだけを見て「減った」としたり、増えた分と減った分が打ち消し合うと考えて「変わらない」としたりするのは誤り。"},"practice":{"title":"増加率と指数のグラフから、記述の正誤を判定する","lead":"グラフの高さが、実数か、増加率か、指数かを、題と単位で先に確かめる。本試験は五つの選択肢から一つを選ぶ形式です。ここでは解き方を身につけるために、選択肢を三つにしています。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と図の言葉の説明（alt）だけから独立に解いて正答を照合し、増加率を足す別解などを実際に試して確認。選択肢ごとの理由、全段階の式と説明、図の値と座標、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"増加率が下がった年と、実数が減った年を分ける","question":"図は、ある会社の売上高の対前年増加率を示しています。2021年の増加率は、2020年の売上高に対するものです。次のア〜ウのうち、図から正しいと言えるものを1つ選んでください。","answer":"イ","kind":"choice","figures":[{"kind":"line","caption":"図　ある会社の売上高の対前年増加率","unit":"%","alt":"折れ線グラフ。売上高の対前年増加率は、2021年8%、2022年5%、2023年−2%、2024年3%。","x":["2021年","2022年","2023年","2024年"],"series":[{"name":"対前年増加率","values":[8,5,-2,3]}]}],"options":[{"key":"ア","text":"2022年の売上高は、2021年の売上高より少ない。","correct":false,"reason":"2022年の増加率は5%で、0より大きいので、2021年より増えている。増加率が8%から5%に下がっただけで、売上高は減っていない。"},{"key":"イ","text":"2023年の売上高は、2022年の売上高より少ない。","correct":true,"reason":"2023年の増加率は −2% で、0より小さいので、2022年より2%減っている。"},{"key":"ウ","text":"2021年から2024年までのうち、売上高がいちばん多いのは2021年である。","correct":false,"reason":"2020年を100とすると、2021年は108、2022年は113.4、2023年は約111.1、2024年は約114.5で、いちばん多いのは2024年。増加率がいちばん高いのが2021年というだけ。"}],"steps":[{"title":"グラフの値が何を表すかを確かめる","formula":"題：対前年増加率\n単位：%\n高さ：売上高そのものではなく、前の年に比べて何%増えたか","body":"高さがいちばん高い2021年が、売上高がいちばん多い年とはかぎりません。"},{"title":"増加率の正負で、前の年より増えたか減ったかを決める","formula":"2021年：8%（増えた）\n2022年：5%（増えた）\n2023年：−2%（減った）\n2024年：3%（増えた）","body":"売上高が前の年より減ったのは、値が0より小さい2023年だけです。アは誤り、イは正しいとわかります。"},{"title":"2020年を100として、各年の大きさを出す","formula":"2021年：100 × 1.08 = 108\n2022年：108 × 1.05 = 113.4\n2023年：113.4 × 0.98 = 111.132\n2024年：111.132 × 1.03 = 114.46596","body":"グラフに出ていない2020年を、仮に100と置きます。前の年に（1 + 増加率）をかけていくと、年どうしの大小を比べられます。"},{"title":"ウを判定する","formula":"いちばん大きい：2024年（約114.5）\n2021年：108","body":"2021年は4年のうちでいちばん小さく、ウは誤りです。正しいのはイです。"}]},{"label":"離れた年どうしを、かけ合わせて比べる","question":"図は、前の問題と同じ、ある会社の売上高の対前年増加率です。2021年の増加率は、2020年の売上高に対するものです。次のア〜ウのうち、図から正しいと言えるものを1つ選んでください。","answer":"イ","kind":"choice","figures":[{"kind":"line","caption":"図　ある会社の売上高の対前年増加率","unit":"%","alt":"折れ線グラフ。売上高の対前年増加率は、2021年8%、2022年5%、2023年−2%、2024年3%。","x":["2021年","2022年","2023年","2024年"],"series":[{"name":"対前年増加率","values":[8,5,-2,3]}]}],"options":[{"key":"ア","text":"2024年の売上高は、2020年の売上高と比べて、14%以下の増加にとどまる。","correct":false,"reason":"1.08 × 1.05 × 0.98 × 1.03 は約1.145で、約14.5%の増加。14%を超えている。増加率を足した 8 + 5 − 2 + 3 = 14 で判断すると、正しいと見誤る。"},{"key":"イ","text":"2024年の売上高は、2022年の売上高より多い。","correct":true,"reason":"2022年を1とすると、2024年は 0.98 × 1.03 = 1.0094 で、2022年より多い。"},{"key":"ウ","text":"前の年からの売上高の増加額は、2022年より2024年のほうが大きい。","correct":false,"reason":"2020年を100とすると、2022年の増加額は 108 × 0.05 = 5.4、2024年の増加額は約111.1 × 0.03 で約3.3。2024年のほうが小さい。"}],"steps":[{"title":"イを、2022年を1と置いて確かめる","formula":"2023年：1 × 0.98 = 0.98\n2024年：0.98 × 1.03 = 1.0094","body":"2023年に2%減っても、2024年に3%増えたので、2022年より少し多くなります。イは正しいとわかります。"},{"title":"アを、4年分の倍率をかけ合わせて確かめる","formula":"1.08 × 1.05 × 0.98 × 1.03 ≒ 1.145","body":"2020年に比べて約14.5%の増加で、14%を超えています。アは誤りです。"},{"title":"ウを、増加額に直して確かめる","formula":"2022年の増加額：108 × 0.05 = 5.4\n2024年の増加額：111.132 × 0.03 = 3.33396","body":"増加額は、前の年の大きさ × 増加率です。2020年を100としたときの数で比べても、大小は実際の金額と同じになります。2024年のほうが小さいので、ウは誤りです。"}],"alternatives":[{"try":"増加率を足して 8 + 5 − 2 + 3 = 14 とし、アを「14%以下」で正しいとする","why_not":"増加率を足すのは近い値を出す目安で、本当の値は、かけ合わせた約14.5%です。この問題では、足した14%は、かけ合わせた約14.5%より少し小さく出ます。増加と減少が混ざると、足した値は本当の値より大きくも小さくも出るので、境目に近い記述では、かけ合わせて確かめます。"}]},{"label":"指数のグラフで、比べられることと比べられないことを分ける","question":"図は、二つの商品AとBの販売量を、それぞれの2020年の販売量を100とした指数で示しています。次のア〜ウのうち、図から正しいと言えるものを1つ選んでください。","answer":"イ","kind":"choice","figures":[{"kind":"bar","caption":"図　商品Aと商品Bの販売量の指数（それぞれの2020年 = 100）","alt":"棒グラフ。商品Aの指数は、2020年100、2022年120、2024年150。商品Bの指数は、2020年100、2022年90、2024年135。どちらも、それぞれの2020年の販売量を100としている。","x":["2020年","2022年","2024年"],"series":[{"name":"商品A","values":[100,120,150]},{"name":"商品B","values":[100,90,135]}]}],"options":[{"key":"ア","text":"2024年の販売量は、商品Aのほうが商品Bより多い。","correct":false,"reason":"指数の基準は、それぞれの2020年の販売量で、AとBの2020年の販売量の大小はわからない。指数がAのほうが大きくても、販売量が多いとは言えない。"},{"key":"イ","text":"2022年から2024年にかけての販売量の増加率は、商品Bのほうが商品Aより大きい。","correct":true,"reason":"Aは 150 ÷ 120 = 1.25 で25%増、Bは 135 ÷ 90 = 1.5 で50%増。同じ商品の中の比なので、指数だけで比べられる。"},{"key":"ウ","text":"商品Aの2024年の販売量は、2022年の販売量より30%多い。","correct":false,"reason":"指数の差は30だが、増加率は 150 ÷ 120 = 1.25 で25%。指数の差が%になるのは、比べるもとが100のときだけ。"}],"steps":[{"title":"指数の基準を確かめる","formula":"商品A：Aの2020年の販売量を100\n商品B：Bの2020年の販売量を100","body":"基準が商品ごとに違います。AとBの指数どうしを比べても、販売量の大小はわかりません。アは「正しいとは言えない」ので、選べません。"},{"title":"同じ商品の中で、増加率を求める","formula":"商品A：150 ÷ 120 = 1.25\n商品B：135 ÷ 90 = 1.5","body":"同じ商品の指数どうしの比は、販売量の比と同じです。Aは25%増、Bは50%増で、Bのほうが大きく、イは正しいとわかります。"},{"title":"ウを、指数の差ではなく比で確かめる","formula":"指数の差：150 − 120 = 30\n増加率：(150 − 120) ÷ 120 = 0.25","body":"30は、2020年の販売量の30%に当たる量で、2022年の販売量の30%ではありません。ウは誤りです。"}]}]}},"kmn-integers":{"id":"kmn-integers","name":"約数と倍数","type":"learn","goal":"最小公倍数、最大公約数、余りの条件を使って、当てはまる整数を求められる。","part_of":"koumuin","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"ある整数を割り切ることのできる整数を、その数の約数といいます。ある整数に整数をかけてできる数を、その数の倍数といいます。二つの数に共通する約数を公約数、共通する倍数を公倍数といい、公約数のうちいちばん大きいものを最大公約数、公倍数のうちいちばん小さいものを最小公倍数といいます。「同時に起こるのは何回おきか」は公倍数、「同じ数ずつ余りなく分ける」は公約数の問題です。「5で割ると2余る数」は、2と、5の倍数に2を足した数です（2から始めて、5ずつ増やします）。","example":"12の約数：1, 2, 3, 4, 6, 12\n4の倍数：4, 8, 12, 16, …\n4と6の最大公約数：2\n4と6の最小公倍数：12\n5で割ると2余る数：2, 7, 12, 17, …","note":"ここでは、約数と倍数を1以上の整数で考えます。"},"review":{"checked_at":"2026-10-14","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、SPIの検証済みの単元との釣り合いと予備校の記述(単元ごとの時間数は見つからず)との比較だけで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"縦12cm、横18cmの長方形の紙を、同じ大きさの正方形に、余りなく切り分けます。正方形をできるだけ大きくするとき、1辺は何cmでしょうか。","options":["3cm","6cm","36cm"],"answer":1,"explanation":"正方形の1辺は、12と18の両方を割り切る数（公約数）です。公約数は1、2、3、6で、いちばん大きいのは6。3cmでも切り分けられますが、いちばん大きくはありません。36は最小公倍数で、紙より大きくなります。"},"practice":{"title":"最小公倍数、最大公約数、余りから整数を求める","lead":"公倍数の問題か、公約数の問題かを見分ける。本試験は五つの選択肢から一つを選ぶ形式です。ここでは解き方を身につけるために、数を直接答えます。","original":true,"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差を確認。指摘を反映した後に再検証。","problems":[{"label":"同時に起こる時刻を求める","question":"ある停留所からは、A町行きのバスが8分おき、B町行きのバスが12分おきに出発します。午前9時に両方のバスが同時に出発しました。次に同時に出発するのは、午前9時何分でしょうか。","answer":"午前9時24分","alternatives":[{"try":"午前9時4分（8と12の最大公約数の4）","why_not":"4は8と12の両方を割り切る数（公約数）です。4分後には、どちらのバスも出発しません。同時に出発するのは、8の倍数でも12の倍数でもある数（公倍数）の分です。"},{"try":"午前9時48分（8と12の公倍数の48）","why_not":"48分後にも同時に出発しますが、「次に」同時に出発するのは、公倍数のうちいちばん小さい24分後です。"}],"steps":[{"title":"それぞれのバスが出る時刻を書き出す","formula":"A町行き：9時の 8, 16, 24, 32, … 分後\nB町行き：9時の 12, 24, 36, … 分後","body":"A町行きは8の倍数の分に、B町行きは12の倍数の分に出発します。両方が同時に出るのは、8の倍数でも12の倍数でもある数、つまり公倍数のときです。"},{"title":"8と12の最小公倍数を求める","formula":"8の倍数：8, 16, 24, 32, 40, 48, …\n12の倍数：12, 24, 36, 48, …\n共通する数のうち、いちばん小さい数：24","body":"「次に」同時に出るときを聞かれているので、公倍数のうちいちばん小さいもの（最小公倍数）を選びます。"},{"title":"時刻に直す","formula":"午前9時の24分後：午前9時24分","body":"9時のバスを数えずに、A町行きは3本後、B町行きは2本後のバスです。"},{"title":"24がどちらでも割り切れるか確かめる","formula":"24 ÷ 8 = 3\n24 ÷ 12 = 2","body":"どちらも余りなく割り切れるので、24分後に両方のバスが出発します。"}]},{"label":"余りなく同じ数ずつ配る","question":"りんご48個とみかん60個を、何人かの子どもに配ります。りんごもみかんも、全員に同じ数ずつ、余りなく配ります。できるだけ多くの子どもに配るとき、子どもは何人でしょうか。","answer":"12人","alternatives":[{"try":"6人（48と60の公約数の6）","why_not":"6人でも余りなく配れますが、「できるだけ多く」なので、公約数のうちいちばん大きい12人が答えです。"}],"steps":[{"title":"子どもの人数が、何の数になるかを考える","formula":"りんご：48 ÷ 人数 が割り切れる\nみかん：60 ÷ 人数 が割り切れる","body":"余りなく配れるのは、人数が48の約数でも60の約数でもあるとき、つまり公約数のときです。"},{"title":"48と60の約数を書き出す","formula":"48の約数：1, 2, 3, 4, 6, 8, 12, 16, 24, 48\n60の約数：1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60","body":"かけて48になる組（1と48、2と24、3と16、4と12、6と8）のように、組で探すと漏れにくくなります。"},{"title":"共通する約数のうち、いちばん大きい数を選ぶ","formula":"公約数：1, 2, 3, 4, 6, 12\n最大公約数：12","body":"「できるだけ多くの子ども」なので、公約数のうちいちばん大きいもの（最大公約数）を選びます。"},{"title":"12人に配れるか確かめる","formula":"48 ÷ 12 = 4\n60 ÷ 12 = 5","body":"1人に、りんごを4個、みかんを5個ずつ配れます。"}]},{"label":"余りの条件に合う数を求める","question":"4で割ると3余り、6で割ると5余る整数があります。このような整数のうち、1以上でいちばん小さいものはいくつでしょうか。","answer":"11","alternatives":[{"try":"23（4 × 6 = 24 から1を引く）","why_not":"23も二つの条件に合いますが、いちばん小さくはありません。24は4と6の公倍数ですが、最小公倍数は12で、12 − 1 = 11 のほうが小さい数です。"}],"steps":[{"title":"それぞれの条件に合う数を書き出す","formula":"4で割ると3余る数：3, 7, 11, 15, 19, 23, …\n6で割ると5余る数：5, 11, 17, 23, …","body":"4で割ると3余る数は、3から始めて4ずつ増やします。6で割ると5余る数は、5から始めて6ずつ増やします。"},{"title":"両方に出てくる数のうち、いちばん小さい数を選ぶ","formula":"両方に出てくる数：11, 23, …\nいちばん小さい数：11","body":"二つの並びに共通する数が、両方の条件に合う数です。"},{"title":"1を足すと割り切れることから、同じ答えを確かめる","formula":"11 + 1 = 12\n12 ÷ 4 = 3\n12 ÷ 6 = 2","body":"どちらの条件も、余りが割る数より1だけ小さくなっています。だから、求める数に1を足すと、4でも6でも割り切れます。そのような数でいちばん小さいのは、4と6の最小公倍数の12です。12から1を引いて11になります。"},{"title":"11が条件に合うか確かめる","formula":"4 × 2 + 3 = 11\n6 × 1 + 5 = 11","body":"11を4で割ると、2余り3。6で割ると、1余り5です。"}]}]}},"kmn-matching":{"id":"kmn-matching","name":"対応関係","type":"learn","goal":"人と持ち物などの組み合わせの条件を表に整理して、確実に言えることを判断できる。","part_of":"koumuin","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。用語は辞書・事典と照合。指摘を反映した後に再検証。","text":"対応関係は、何人かの人と、色や曜日などの項目との組み合わせを、条件から決める問題です。縦に人、横に項目を並べた表（対応表）を作り、当てはまる欄に○、当てはまらない欄に×を書き入れて整理します。1人に1つずつ、重ならずに対応するときは、ある欄が○に決まると、同じ行と同じ列のほかの欄はすべて×になります。逆に、ある行や列で×でない欄が1つだけ残れば、そこが○に決まります。条件だけでは一通りに決まらないときは、あり得る場合をすべて書き出して、どの場合にも成り立つことを探します。","example":"　　春　夏　秋\nＡ　×　・　・\nＢ　・　×　・\nＣ　・　・　・\n3人の生まれた季節について、「Ａは春でない」「Ｂは夏でない」を書き入れた対応表","note":"まだ決まっていない欄は、ここでは「・」で表します。行の頭のＡ、Ｂ、Ｃは人を表します。"},"review":{"checked_at":"2026-10-14","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、SPIの検証済みの単元との釣り合いと予備校の記述(単元ごとの時間数は見つからず)との比較だけで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"spi-inference","level":"must"}],"assessment":{"question":"A、B、Cの3人が、犬、猫、鳥のうち、それぞれ違う1種類を飼っています。Aは犬を飼っていません。Bは犬も猫も飼っていません。猫を飼っているのはだれでしょうか。","options":["A","B","C"],"answer":0,"explanation":"Bは犬でも猫でもないので鳥。Aは犬でなく、鳥はBなので猫。残りのCが犬です。選択肢のBは、「Bは猫を飼っていない」という条件に反します。Cが猫だとすると、Aが飼えるものがなくなります。"},"practice":{"title":"条件を対応表に書き入れて、組み合わせを決める","lead":"決まった欄から、同じ行と列を消していく。本試験は五つの選択肢から確実に言えるものを選ぶ形式で、人数や項目はもっと多くなります。ここでは解き方を身につけるために、小さい表で練習します。","original":true,"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。あり得る場合をすべて列挙して正答が一つに決まるかを確かめ、選択肢ごとに反例を試し、対応表を一欄ずつ条件と照合。前提の範囲、試験の形との差を確認。指摘を反映した後に再検証。","problems":[{"label":"3人と3つの色を対応させる","question":"A、B、Cの3人が、赤、青、黄のうち、それぞれ違う色の帽子をかぶっています。次のことがわかっています。\n・Aの帽子は赤ではない。\n・Bの帽子は黄ではない。\n・Cの帽子は青である。\nAの帽子は何色でしょうか。","answer":"黄","alternatives":[{"try":"青（Aは赤ではないので、残りの青と黄のうちの青）","why_not":"青はCの帽子です。3人の色はすべて違うので、Aは青ではありません。"}],"steps":[{"title":"条件をそのまま対応表に書き入れる","table":{"kind":"match","rows":[["","赤","青","黄"],["A","×","・","・"],["B","・","・","×"],["C","・","○","・"]]},"body":"「〜ではない」は×、「〜である」は○で書き入れます。まだ決まっていない欄は「・」です。表の行が人、列が色です。"},{"title":"○の欄と同じ行、同じ列を×にする","table":{"kind":"match","rows":[["","赤","青","黄"],["A","×","×","・"],["B","・","×","×"],["C","×","○","×"]]},"body":"Cが青に決まったので、Cは赤でも黄でもありません。また、青はCのものなので、AもBも青ではありません。"},{"title":"×でない欄が1つだけ残った行を、○にする","formula":"A：残っているのは黄だけ → 黄\nB：残っているのは赤だけ → 赤","body":"Aの行は赤と青が×なので、黄に決まります。Bの行は青と黄が×なので、赤に決まります。"},{"title":"決まった組み合わせが、すべての条件に合うか確かめる","formula":"A：黄（赤ではない）\nB：赤（黄ではない）\nC：青","body":"3人の色がすべて違い、三つの条件にも合っています。"}]},{"label":"4人と4つの部を対応させる","question":"A、B、C、Dの4人が、野球部、サッカー部、テニス部、水泳部のうち、それぞれ違う1つの部に入っています。次のことがわかっています。\n・Aは野球部でもサッカー部でもない。\n・Bはテニス部ではない。\n・Cは水泳部である。\n・Dはサッカー部ではない。\nBが入っている部はどれでしょうか。","answer":"サッカー部","alternatives":[{"try":"野球部（Bはテニス部ではなく、水泳部はCなので、残りの野球部とサッカー部のうちの野球部）","why_not":"Bの条件だけでは、野球部とサッカー部のどちらかまでしか決まりません。サッカー部の列を見ると、AもDもサッカー部ではなく、Cは水泳部なので、サッカー部に入れるのはBだけです。"}],"steps":[{"title":"条件を対応表に書き入れる","table":{"kind":"match","rows":[["","野","サ","テ","水"],["A","×","×","・","・"],["B","・","・","×","・"],["C","・","・","・","○"],["D","・","×","・","・"]]},"body":"野は野球部、サはサッカー部、テはテニス部、水は水泳部です。"},{"title":"Cが水泳部に決まったので、同じ行と列を×にする","table":{"kind":"match","rows":[["","野","サ","テ","水"],["A","×","×","・","×"],["B","・","・","×","×"],["C","×","×","×","○"],["D","・","×","・","×"]]},"body":"水泳部はCなので、ほかの3人は水泳部ではありません。Cは、ほかの部でもありません。"},{"title":"Aの行を見て、Aの部を決める","formula":"A：野×、サ×、水× → テニス部","body":"Aの行で残っているのはテニス部だけです。Aがテニス部に決まるので、Dはテニス部ではなくなります。"},{"title":"Dの行を見て、Dの部を決める","formula":"D：サ×、テ×、水× → 野球部","body":"Dの行で残っているのは野球部だけです。Dが野球部に決まるので、Bは野球部ではなくなります。"},{"title":"残った部がBの部になる","formula":"B：野×、テ×、水× → サッカー部","body":"Bの行で残っているのはサッカー部だけです。"},{"title":"すべての条件に合うか確かめる","formula":"A：テニス部（野球部でもサッカー部でもない）\nB：サッカー部（テニス部ではない）\nC：水泳部\nD：野球部（サッカー部ではない）","body":"4人の部がすべて違い、四つの条件にも合っています。"}]},{"label":"一通りに決まらないときに、確実に言えることを選ぶ","question":"A、B、Cの3人が、月曜、火曜、水曜のうち、それぞれ違う1日に当番をします。次のことがわかっています。\n・Aの当番は月曜ではない。\n・Bの当番は水曜ではない。\n次のア〜ウのうち、確実に言えるものを1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"Aの当番が火曜なら、Cの当番は水曜である。","correct":true,"reason":"Aが火曜の場合は、Bが月曜、Cが水曜の一通りだけです。"},{"key":"イ","text":"Bの当番は月曜である。","correct":false,"reason":"Aが水曜、Bが火曜、Cが月曜の場合も条件に合うので、Bが月曜とは限りません。"},{"key":"ウ","text":"Cの当番は火曜ではない。","correct":false,"reason":"Aが水曜、Bが月曜、Cが火曜の場合も条件に合うので、Cが火曜のこともあります。"}],"steps":[{"title":"条件を対応表に書き入れる","table":{"kind":"match","rows":[["","月","火","水"],["A","×","・","・"],["B","・","・","×"],["C","・","・","・"]]},"body":"○に決まる欄がないので、表だけでは組み合わせが一通りに決まりません。"},{"title":"Aの当番で場合を分けて、あり得る組み合わせをすべて書き出す","formula":"Aが火曜のとき：Bは月曜、Cは水曜\nAが水曜のとき：Bは月曜、Cは火曜\nAが水曜のとき：Bは火曜、Cは月曜","body":"Aは火曜か水曜です。Aが火曜なら、Bは水曜でも火曜でもないので月曜に決まります。Aが水曜なら、Bは月曜でも火曜でもよく、二通りあります。全部で三通りです。"},{"title":"選択肢ごとに、三通りのすべてで成り立つかを調べる","formula":"ア：Aが火曜の場合は一通りだけで、Cは水曜 → 確実に言える\nイ：三つ目の場合で、Bは火曜 → 言えない\nウ：二つ目の場合で、Cは火曜 → 言えない","body":"「確実に言える」のは、あり得る場合のすべてで成り立つことだけです。一つでも成り立たない場合があれば、確実には言えません。"}]}]}},"kmn-procedure":{"id":"kmn-procedure","name":"操作の手順","type":"learn","goal":"てんびんで偽物を見つける回数や、容器で水を量り分ける手順を、状態の表で追って、最少の回数を求めることができる。","part_of":"koumuin","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を、練習の検証と合わせて確認。軽微の指摘を反映。","text":"操作の手順は、てんびんで量る、容器から容器へ水を注ぐ、といった操作を繰り返して、目的の状態にする問題です。操作のたびに、状態（候補の枚数や、それぞれの容器の量）を表に書いて、移り変わりを追います。最少の回数は、二つのことを示して決まります。一つは、その回数でできる手順があること。もう一つは、それより少ない回数ではできないことです。てんびん（分銅を使わず、両方の皿の重さを比べるもの）の結果は、左が下がる、右が下がる、つり合う、の3通りです。そこで候補を、左の皿、右の皿、量らないもの、の三つの組に分けます。量らない組も、つり合ったときの答えとして使えるので、1回で候補を3分の1にまで減らせます。回数が1回増えるごとに、区別できる候補の数は3倍になります。容器に目盛りのない油分け算では、注ぐ側が空になるか、受ける側がいっぱいになるまで注ぐことしかできません。1回で作れる状態、2回で作れる状態、と順にすべて書き出し、目的の状態が初めて出た回数が最少の回数です。","example":"てんびん：3枚の中の1枚だけ軽い偽物\n1枚と1枚を量り、1枚は量らない → 1回で決まる\n\n容器：7L（満杯）、4L、3L\n状態は（7Lの量, 4Lの量, 3Lの量）の順に書く\n始め：（7, 0, 0）\n1回目 7Lから4Lへ：（3, 4, 0）\n2回目 4Lから3Lへ：（3, 1, 3）","note":"てんびんの問題では、偽物は1枚だけで、ほかの金貨はすべて同じ重さとします。「必ず見つけられる」は、量った結果がどうなっても、その回数までに偽物が決まることです。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。到達条件の書式を直した。学習時間は、公務員の単元どうしの釣り合いと予備校・対策本の分野の立て方との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-muldiv","level":"must"},{"id":"spi-inference","level":"helps"}],"assessment":{"question":"見た目が同じ8枚の金貨の中に、ほかより軽い偽物が1枚だけあります。分銅のないてんびんで偽物を必ず見つけるには、最少で何回量ればよいでしょうか。","options":["1回","2回","3回"],"answer":1,"explanation":"3枚と3枚を量り、2枚は量らずにおきます。傾けば軽い側の3枚から、1枚と1枚を量って決まります。つり合えば、量らなかった2枚を1枚ずつ量って決まります。どの場合も2回です。1回では結果が3通りしかなく、8枚を区別できません。3回は、半分ずつに分けて量ったとき（4枚、2枚、1枚）の回数で、最少ではありません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、最少の回数は「その回数でできる」と「それより少なくてはできない」の両方を、全部の状態を書き出すプログラムで照合。数値の行が問題の条件に合う組かも確認。軽微の指摘を反映。","title":"状態の表で操作を追い、最少の回数を求める","lead":"1回の操作で何通りに分かれるか、何回でどの状態まで作れるかを表で追う。本試験は五つの選択肢から一つを選ぶ形式です。1問目と3問目は解き方を身につけるために回数を直接答え、2問目は五つの選択肢から選びます。","original":true,"problems":[{"label":"てんびんで偽物を見つける最少の回数","question":"見た目が同じ20枚の金貨の中に、ほかより軽い偽物が1枚だけあります。ほかの19枚はすべて同じ重さです。分銅のないてんびんで偽物を必ず見つけるには、最少で何回量ればよいでしょうか。","answer":"3回","alternatives":[{"try":"4回（10枚と10枚を量り、残った候補もなるべく二つに分けて量っていく）","why_not":"候補をなるべく二つに分けて量ると、1回で候補がおよそ半分にしか減りません（20枚、10枚、5枚（2枚と2枚を量り、1枚は量らない）、2枚、1枚で4回）。量らない組を作って三つに分ければ、1回で3分の1近くまで減らせて、3回で済みます。"},{"try":"2回（7枚と7枚を量ったあと、残った候補を一度に量る）","why_not":"1回目のあとに候補が7枚残ると、2回目の結果は3通りしかないので、7枚から1枚には決まりません。2回で区別できるのは、多くても9枚です。"}],"steps":[{"title":"てんびん1回の結果が何通りかを確かめる","formula":"左の皿が上がる → 左の皿に偽物\n右の皿が上がる → 右の皿に偽物\nつり合う → 量らなかった組に偽物","body":"偽物は軽いので、上がった側の皿にあります。つり合えば、皿にのせなかった金貨の中にあります。1回の結果は3通りです。"},{"title":"2回では足りないことを示す","formula":"2回の結果の組：3 × 3 = 9\n候補：20枚","body":"2回量ったときの結果の組み合わせは9通りしかありません。どう量っても、9通りの結果で20枚のどれが偽物かを区別することはできません。"},{"title":"1回目は、三つの組にできるだけ同じ数ずつ分ける","formula":"7 + 7 + 6 = 20","body":"7枚と7枚をのせ、6枚は量りません。傾けば上がった側の7枚が、つり合えば量らなかった6枚が、候補として残ります。候補は多くても7枚です。"},{"title":"2回目と3回目の量り方を、表にする","table":{"caption":"残った候補ごとの量り方","rows":[["2回目の前の候補","2回目の量り方","3回目の前の候補","3回目の量り方"],["7枚","3枚と3枚（1枚は量らない）","3枚か1枚","3枚なら1枚と1枚（1枚は量らない）"],["6枚","2枚と2枚（2枚は量らない）","2枚","1枚と1枚"]]},"body":"2回目も同じように三つに分けます。7枚のとき、つり合えば量らなかった1枚が偽物に決まり、3回目は要りません。それ以外は、3回目で必ず1枚に決まります。"},{"title":"答えをまとめる","formula":"3回でできる手順がある\n2回ではできない","body":"どの結果になっても3回までに偽物が決まり、2回では決まらないことがあるので、最少の回数は3回です。"}]},{"label":"量る回数と、見つけられる枚数の関係を選ぶ","kind":"choice","question":"見た目が同じ何枚かの金貨の中に、ほかより軽い偽物が1枚だけあり、ほかの金貨はすべて同じ重さです。分銅のないてんびんで偽物を見つけるときの回数について、次のア〜オのうち、正しいものを1つ選んでください。","answer":"イ","options":[{"key":"ア","text":"10枚なら、2回で必ず見つけられる。","correct":false,"reason":"2回量ったときの結果の組は9通りしかないので、10枚のどれが偽物かを区別できません。"},{"key":"イ","text":"9枚なら、2回で必ず見つけられる。","correct":true,"reason":"3枚と3枚を量って3枚は量らずにおくと、1回目で候補が3枚に減ります。その3枚を、1枚と1枚を量って1枚は量らずにおけば、2回目で決まります。"},{"key":"ウ","text":"4枚なら、1回で必ず見つけられる。","correct":false,"reason":"1回の結果は3通りなので、4枚のどれが偽物かを区別できません。たとえば2枚と2枚を量ると、上がった側の2枚が残ります。"},{"key":"エ","text":"30枚なら、3回で必ず見つけられる。","correct":false,"reason":"3回量ったときの結果の組は27通りしかないので、30枚のどれが偽物かを区別できません。"},{"key":"オ","text":"3枚のときは、2回量らないと見つけられないことがある。","correct":false,"reason":"1枚と1枚を量り、1枚は量らずにおけば、傾いても、つり合っても、1回で偽物が決まります。"}],"steps":[{"title":"回数ごとに、区別できる枚数の上限を出す","formula":"1回：3通り\n2回：3 × 3 = 9\n3回：3 × 3 × 3 = 27","body":"1回の結果は3通りなので、量る回数が1回増えるごとに、結果の組の数は3倍になります（1回で3通り、2回で9通り、3回で27通り）。候補がこれより多いと、同じ結果の組になる金貨が出て、偽物を区別できません。"},{"title":"上限を超えている選択肢を外す","formula":"ア：10枚を2回 → 9通りより多い → 誤り\nウ：4枚を1回 → 3通りより多い → 誤り\nエ：30枚を3回 → 27通りより多い → 誤り","body":"候補の枚数が結果の組の数より多いと、どう量っても必ず見つけられるとは言えません。"},{"title":"イの量り方を表にして確かめる","table":{"caption":"9枚を2回で見つける量り方","rows":[["回","量り方","残る候補"],["1回目","3枚と3枚（3枚は量らない）","3枚"],["2回目","1枚と1枚（1枚は量らない）","1枚"]]},"body":"1回目に傾いても、つり合っても、候補は3枚になります。2回目も同じで、候補が1枚に決まります。"},{"title":"オを確かめる","formula":"オ：3枚 → 1枚と1枚（1枚は量らない） → 1回で決まる → 誤り","body":"3枚なら1回で必ず決まるので、2回量らないと見つけられないことはありません。正しいのはイだけです。"}]},{"label":"油分け算で、水を等分する最少の回数","question":"12Lの容器に水がいっぱいに入っていて、8Lの容器と5Lの容器は空です。どの容器にも目盛りはなく、水を捨てたり足したりはできません。一つの容器から別の容器へ注ぐときは、注ぐ側が空になるか、受ける側がいっぱいになるまで注ぎ、これを1回と数えます。12Lの容器と8Lの容器に6Lずつ分けるには、最少で何回注げばよいでしょうか。","answer":"7回","alternatives":[{"try":"8回（手順の表の行を、始めの状態も含めて数えた）","why_not":"始めの状態は、まだ一度も注いでいないので回数に入れません。注いだ回数は、表の始めの行を除いた行の数です。"},{"try":"6回（8Lの容器に6Lが入ったところで止める）","why_not":"6回目のあとは、12Lの容器が1L、8Lの容器が6L、5Lの容器が5Lで、12Lの容器はまだ6Lではありません。5Lの容器の水を12Lの容器に戻す7回目が要ります。"}],"steps":[{"title":"状態の書き方と、始めと目的の状態を決める","formula":"状態：（12Lの量, 8Lの量, 5Lの量）\n始め：（12, 0, 0）\n目的：（6, 6, 0）","body":"水の量の合計は12Lのまま変わりません。三つの容器の量を組にして、1回注ぐごとに書きかえます。"},{"title":"1回目に作れる状態を書き出す","formula":"12Lから8Lへ：（4, 8, 0）\n12Lから5Lへ：（7, 0, 5）","body":"始めは8Lと5Lの容器が空なので、注げるのは12Lの容器からだけです。注ぎ先は2通りあります。"},{"title":"目的の状態まで、手順の表で追う","table":{"caption":"12Lから8Lへ先に注ぐ手順","rows":[["回","注ぎ方","12L","8L","5L"],["始め","","12","0","0"],["1","12Lから8Lへ","4","8","0"],["2","8Lから5Lへ","4","3","5"],["3","5Lから12Lへ","9","3","0"],["4","8Lから5Lへ","9","0","3"],["5","12Lから8Lへ","1","8","3"],["6","8Lから5Lへ","1","6","5"],["7","5Lから12Lへ","6","6","0"]]},"body":"8Lの容器から5Lの容器へ注ぎ、5Lの容器がいっぱいになったら12Lの容器へ戻す、を繰り返します。6回目は、5Lの容器に3L入っているので、8Lの容器からは2Lしか入らず、8Lの容器に6Lが残ります。7回で目的の状態になります。"},{"title":"6回以下ではできないことを、回数ごとの状態で確かめる","table":{"caption":"その回数で初めて作れる状態（12L, 8L, 5L）","rows":[["回","初めて作れる状態"],["1","（4, 8, 0）（7, 0, 5）"],["2","（0, 8, 4）（4, 3, 5）（0, 7, 5）（7, 5, 0）"],["3","（8, 0, 4）（9, 3, 0）（5, 7, 0）（2, 5, 5）"],["4","（8, 4, 0）（9, 0, 3）（5, 2, 5）（2, 8, 2）"],["5","（3, 4, 5）（1, 8, 3）（10, 2, 0）（10, 0, 2）"],["6","（3, 8, 1）（1, 6, 5）"],["7","（11, 0, 1）（6, 6, 0）"]]},"body":"前の回の状態のそれぞれから、注げるすべての注ぎ方を試し、まだ出ていない状態だけを次の行に書きます（前に出た状態に戻っても、回数が増えるだけだからです）。（6, 6, 0）は7回の行で初めて出るので、6回以下ではできません。最少の回数は7回です。"}]}]}},"kmn-proposition":{"id":"kmn-proposition","name":"命題と対偶","type":"learn","goal":"「AならばB」の形の文から、対偶と三段論法を使って、確実に言えることを判断できる。","part_of":"koumuin","tags":["math1","logic"],"status":"verified","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。用語は辞書・事典と照合。指摘を反映した後に再検証。","text":"正しいか正しくないかが決まる文を、命題といいます。正しいことを真、正しくないことを偽ともいいます。「AならばB」という命題に対して、前と後ろを入れかえた「BならばA」を逆、両方を打ち消した「AでないならばBでない」を裏、入れかえて両方を打ち消した「BでないならばAでない」を対偶といいます。もとの命題が正しいとき、対偶は必ず正しくなります。逆と裏は、正しいとは限りません。また、「AならばB」と「BならばC」がどちらも正しいとき、「AならばC」も正しくなります。これを三段論法といいます。「〜な人は…である」という文は、「〜ならば…である」と同じ形です。","example":"命題：犬ならば動物である\n逆：動物ならば犬である（正しいとは限らない）\n裏：犬でないならば動物でない（正しいとは限らない）\n対偶：動物でないならば犬でない（必ず正しい）","note":"猫は動物ですが犬ではないので、この例の逆と裏は正しくありません。「かつ」「または」を含む命題と、「すべての〜」「ある〜」を含む命題は、この単元では扱っていません。"},"review":{"checked_at":"2026-10-14","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、SPIの検証済みの単元との釣り合いと予備校の記述(単元ごとの時間数は見つからず)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"spi-inference","level":"helps"}],"assessment":{"question":"「雨が降るならば、試合は中止になる」が正しいとします。このとき、必ず正しいと言えるのはどれでしょうか。","options":["試合が中止になるならば、雨が降っている","雨が降らないならば、試合は中止にならない","試合が中止にならないならば、雨は降っていない"],"answer":2,"explanation":"三つ目は対偶なので、必ず正しい。一つ目は逆、二つ目は裏で、正しいとは限りません。雨のほかの理由で試合が中止になることがあり得るからです。"},"practice":{"title":"対偶と三段論法で、確実に言えることを選ぶ","lead":"逆と裏は使えない。使えるのは対偶だけ。常識ではなく、与えられた文だけから判断します。本試験は五つの選択肢から一つを選ぶ形式です。ここでは解き方を身につけるために、選択肢を三つにしています。","original":true,"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。あり得る場合をすべて列挙して正答が一つに決まるかを確かめ、選択肢ごとに反例を試し、対応表を一欄ずつ条件と照合。前提の範囲、試験の形との差を確認。指摘を反映した後に再検証。","problems":[{"label":"対偶をつくる","question":"「数学が得意な人は、理科が得意である」が正しいとします。次のア〜ウのうち、必ず正しいと言えるものを1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"理科が得意な人は、数学が得意である。","correct":false,"reason":"もとの命題の逆です。理科が得意で数学が得意でない人がいても、もとの命題には反しません。"},{"key":"イ","text":"理科が得意でない人は、数学が得意でない。","correct":true,"reason":"もとの命題の対偶なので、必ず正しい。"},{"key":"ウ","text":"数学が得意でない人は、理科が得意でない。","correct":false,"reason":"もとの命題の裏です。数学が得意でなくて理科が得意な人がいても、もとの命題には反しません。"}],"steps":[{"title":"命題を「AならばB」の形に整理する","formula":"A：数学が得意\nB：理科が得意\nもとの命題：AならばB","body":"「〜な人は…である」は、「〜ならば…である」と同じ形です。"},{"title":"逆、裏、対偶をつくる","formula":"逆（BならばA）：理科が得意ならば、数学が得意\n裏（AでないならばBでない）：数学が得意でないならば、理科が得意でない\n対偶（BでないならばAでない）：理科が得意でないならば、数学が得意でない","body":"対偶は、AとBを入れかえて、両方を打ち消します。"},{"title":"選択肢が、逆、裏、対偶のどれにあたるかを見る","formula":"ア：逆 → 正しいとは限らない\nイ：対偶 → 必ず正しい\nウ：裏 → 正しいとは限らない","body":"必ず正しいと言えるのは、対偶だけです。"}]},{"label":"二つの命題をつなぐ","question":"次の二つがどちらも正しいとします。\n・読書が好きな人は、映画が好きである。\n・映画が好きな人は、音楽が好きである。\n次のア〜ウのうち、必ず正しいと言えるものを1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"読書が好きな人は、音楽が好きである。","correct":true,"reason":"「読書が好き → 映画が好き → 音楽が好き」と、二つの命題がつながります。"},{"key":"イ","text":"音楽が好きな人は、読書が好きである。","correct":false,"reason":"アの逆です。音楽が好きで読書が好きでない人がいても、二つの命題には反しません。"},{"key":"ウ","text":"映画が好きでない人は、音楽が好きでない。","correct":false,"reason":"二つ目の命題の裏です。映画が好きでなくて音楽が好きな人がいても、二つの命題には反しません。"}],"steps":[{"title":"二つの命題を、矢印で書く","formula":"読書が好き → 映画が好き\n映画が好き → 音楽が好き","body":"「AならばB」を「A → B」と書くと、つながりが見やすくなります。"},{"title":"同じ言葉でつながるところを、一本にする","formula":"読書が好き → 映画が好き → 音楽が好き","body":"一つ目の矢印の先と、二つ目の矢印の元が、どちらも「映画が好き」です。ここでつなぐと、「読書が好きならば、音楽が好き」が言えます（三段論法）。"},{"title":"選択肢を、矢印の向きと照らし合わせる","formula":"ア：読書が好き → 音楽が好き（矢印の向きのとおり） → 必ず正しい\nイ：音楽が好き → 読書が好き（矢印と逆向き） → 正しいとは限らない\nウ：映画が好きでない → 音楽が好きでない（二つ目の裏） → 正しいとは限らない","body":"矢印は、左から右へしかたどれません。逆向きにたどった文と、打ち消しただけの文は、正しいとは限りません。"}]},{"label":"対偶にしてからつなぐ","question":"次の二つがどちらも正しいとします。\n・運動が好きな人は、早起きである。\n・夜ふかしをする人は、早起きでない。\n次のア〜ウのうち、必ず正しいと言えるものを1つ選んでください。","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"夜ふかしをしない人は、運動が好きである。","correct":false,"reason":"ウの逆です。夜ふかしをせず、運動も好きでない人がいても、二つの命題には反しません。"},{"key":"イ","text":"早起きである人は、運動が好きである。","correct":false,"reason":"一つ目の命題の逆です。早起きで運動が好きでない人がいても、二つの命題には反しません。"},{"key":"ウ","text":"運動が好きな人は、夜ふかしをしない。","correct":true,"reason":"二つ目の命題の対偶は「早起きである人は、夜ふかしをしない」。一つ目とつなぐと「運動が好き → 早起きである → 夜ふかしをしない」となります。"}],"steps":[{"title":"二つの命題を、矢印で書く","formula":"運動が好き → 早起きである\n夜ふかしをする → 早起きでない","body":"一つ目の先は「早起きである」、二つ目の先は「早起きでない」で、このままではつながりません。"},{"title":"二つ目の命題を、対偶に書きかえる","formula":"もとの命題：夜ふかしをする → 早起きでない\n対偶：早起きである → 夜ふかしをしない","body":"対偶は、前と後ろを入れかえて、両方を打ち消します。「早起きでない」を打ち消すと「早起きである」、「夜ふかしをする」を打ち消すと「夜ふかしをしない」です。対偶は必ず正しいので、もとの命題の代わりに使えます。"},{"title":"同じ言葉でつなぐ","formula":"運動が好き → 早起きである → 夜ふかしをしない","body":"一つ目の先と、対偶の元が、どちらも「早起きである」になりました。つなぐと、「運動が好きならば、夜ふかしをしない」が言えます。"},{"title":"選択肢を、矢印の向きと照らし合わせる","formula":"ア：夜ふかしをしない → 運動が好き（矢印と逆向き） → 正しいとは限らない\nイ：早起きである → 運動が好き（矢印と逆向き） → 正しいとは限らない\nウ：運動が好き → 夜ふかしをしない（矢印の向きのとおり） → 必ず正しい","body":"矢印の向きのとおりにたどれるのは、ウだけです。"}]}]}},"kmn-quantity":{"id":"kmn-quantity","name":"数量の推理","type":"learn","goal":"人数や個数の合計、大小、差、偶奇の条件から、あり得る組を書き出して、確実に言えることや最大・最小を判断できる。","part_of":"koumuin","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を、練習の検証と合わせて確認。軽微の指摘を反映。","text":"数量の推理は、人数や個数について、合計、大小、差、偶数か奇数か、といった条件だけが与えられ、それぞれの数を絞り込む問題です。まず条件を、合計の式と、大小の並びにまとめます。次に、いちばん少ないもの（または、差で結ばれたもの）の数を小さい順に決めて、条件に合う組をすべて書き出します。あり得る組のすべてで成り立つことだけが、確実に言えることです。偶数は2で割り切れる整数、奇数は2で割り切れない整数です。同じ数を2つ足すと必ず偶数になり、合計が奇数なら、足した数のうち奇数は奇数個あります。「いちばん多い人は少なくとも何個か」のような最大・最小の問いでは、ほかの数をできるだけ大きく（または小さく）して、ぎりぎりの場合を調べます。","example":"偶数＋偶数 → 偶数、奇数＋奇数 → 偶数、偶数＋奇数 → 奇数\n偶数−奇数 → 奇数、奇数−偶数 → 奇数、奇数−奇数 → 偶数\n\n3人で合わせて12個、全員違う個数（1個以上）のとき\nいちばん多い人が最も多い場合：12 − 1 − 2 = 9\nいちばん多い人が5個の場合：5 + 4 + 3 = 12\nいちばん多い人が4個なら、多くても：4 + 3 + 2 = 9\n→ 12個に届かないので、いちばん多い人は5個以上","note":"ここでの個数は、0か正の整数です。「1個以上」と書いていない問題では、0個の場合も調べます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、公務員の単元どうしの釣り合いと予備校・対策本の分野の立て方との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"spi-inference","level":"must"},{"id":"math-muldiv","level":"must"}],"assessment":{"question":"4人で、合わせて15個のあめを分けました。4人とも1個以上で、個数はすべて違います。いちばん少ない人の個数として、あり得るうちで最も多いのは何個でしょうか。","options":["1個","2個","3個"],"answer":1,"explanation":"いちばん少ない人が3個なら、ほかの3人は少なくとも4個、5個、6個で、合計は少なくとも18個になり、15個を超えます。2個なら、2個、3個、4個、6個のように分けられます。1個の分け方もありますが、最も多い値ではありません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、最少の回数は「その回数でできる」と「それより少なくてはできない」の両方を、全部の状態を書き出すプログラムで照合。数値の行が問題の条件に合う組かも確認。軽微の指摘を反映。","title":"条件に合う組を書き出して、個数を絞り込む","lead":"合計と大小の条件をまとめ、ぎりぎりの場合か、あり得る組のすべてを調べる。本試験は五つの選択肢から一つを選ぶ形式です。1問目は解き方を身につけるために数を直接答え、2問目と3問目は五つの選択肢から選びます。","original":true,"problems":[{"label":"いちばん多い人の個数の最小を求める","question":"5人で、合わせて20個のみかんを分けました。5人とも1個以上で、もらった個数はすべて違います。いちばん多くもらった人の個数は、少なくとも何個でしょうか。","answer":"6個","alternatives":[{"try":"4個（20 ÷ 5 で、1人あたりの個数）","why_not":"5人とも4個にすると、個数がすべて違うという条件に合いません。個数が違うので、いちばん多い人は、全員が同じ個数のときの4個より多くなります。"},{"try":"10個（ほかの4人を1個、2個、3個、4個にしたときの、残りの個数）","why_not":"10個は、いちばん多い人の個数として、あり得るうちで最も多い値です。問われているのは、あり得るうちで最も少ない値です。"}],"steps":[{"title":"条件を置き、何を小さくしたいかを決める","formula":"人数：5人、合計：20個\n全員1個以上、個数はすべて違う\n小さくしたいもの：いちばん多い人の個数","body":"いちばん多い人の個数を小さくするには、ほかの4人の個数をできるだけ大きくして、全員の個数を近づけます。いちばん多い人の個数を一つ決めると、ほかの4人は、それより少なく、互いに違う個数です。"},{"title":"いちばん多い人が5個の場合を調べる","formula":"5 + 4 + 3 + 2 + 1 = 15","body":"いちばん多い人が5個なら、ほかの4人は5個より少なく、互いに違うので、多くても4個、3個、2個、1個です。合計は多くても15個で、20個に届きません。いちばん多い人が5個より少ない場合は、合計はさらに少なくなるので、やはり届きません。"},{"title":"いちばん多い人が6個の場合を調べる","formula":"6 + 5 + 4 + 3 + 2 = 20","body":"いちばん多い人が6個なら、ほかの4人を5個、4個、3個、2個にすると、合計がちょうど20個になります。全員1個以上で、個数もすべて違うので、条件に合います。"},{"title":"答えをまとめる","formula":"5個以下：合計が20個に届かない → あり得ない\n6個：分け方がある → あり得る","body":"いちばん多くもらった人の個数は、少なくとも6個です。「少なくとも」の答えは、それより少ない値があり得ないことと、その値があり得ることの両方を示して決まります。"}]},{"label":"偶数と奇数の性質から確実に言えることを選ぶ","kind":"choice","question":"A、B、C、Dの4人が持っているカードの枚数の合計は23枚です。4人とも1枚以上持っていて、次のことがわかっています。\n・AとBは同じ枚数を持っている。\n・CはDより多く持っている。\n次のア〜オのうち、確実に言えるものを1つ選んでください。","answer":"ア","options":[{"key":"ア","text":"CとDの枚数の差は奇数である。","correct":true,"reason":"AとBの枚数の合計は同じ数を2つ足したものなので偶数です。CとDの合計は、23からその偶数を引いた奇数になります。合計が奇数になるのは、偶数と奇数を1つずつ足したときなので、CとDの差も奇数です。"},{"key":"イ","text":"Cの枚数は奇数である。","correct":false,"reason":"Aが1枚、Bが1枚、Cが12枚、Dが9枚の場合も、すべての条件に合います。このときCは偶数です。"},{"key":"ウ","text":"Dの枚数は偶数である。","correct":false,"reason":"Aが3枚、Bが3枚、Cが10枚、Dが7枚の場合も、すべての条件に合います。このときDは奇数です。"},{"key":"エ","text":"Aの枚数は5枚以下である。","correct":false,"reason":"Aが10枚、Bが10枚、Cが2枚、Dが1枚の場合も、すべての条件に合います。"},{"key":"オ","text":"AとCの枚数は違う。","correct":false,"reason":"Aが7枚、Bが7枚、Cが7枚、Dが2枚の場合も、すべての条件に合います。このときAとCは同じ枚数です。"}],"steps":[{"title":"条件を置く","formula":"合計：23枚（奇数）\nAとBは同じ枚数\nC ＞ D\n4人とも1枚以上","body":"あり得る組は多いので、すべてを書き出すのは大変です。偶数と奇数の性質で、どの組にも成り立つことを探し、成り立たない選択肢は、条件に合う組を一つ挙げて退けます。"},{"title":"AとBの合計が偶数であることを使う","formula":"AとBの合計：同じ数を2つ足す → 偶数\nCとDの合計：23 − 偶数 → 奇数","body":"同じ数を2つ足すと、必ず偶数になります。奇数から偶数を引くと奇数になるので、CとDの合計は奇数です。"},{"title":"CとDの合計が奇数のとき、差がどうなるかを調べる","formula":"偶数＋偶数 → 偶数（合わない）\n奇数＋奇数 → 偶数（合わない）\n偶数＋奇数 → 奇数（合う）","body":"CとDの合計が奇数になるのは、一方が偶数、もう一方が奇数のときだけです。偶数と奇数の差は奇数なので、アはどの組でも成り立ちます。"},{"title":"ほかの選択肢には、成り立たない組を一つずつ挙げる","formula":"イ：1 + 1 + 12 + 9 = 23\nウ：3 + 3 + 10 + 7 = 23\nエ：10 + 10 + 2 + 1 = 23\nオ：7 + 7 + 7 + 2 = 23","body":"左からA、B、C、Dの枚数です。どれもAとBが同じ枚数、CがDより多く、4人とも1枚以上で、合計が23枚です。イはCが偶数、ウはDが奇数、エはAが5枚より多く、オはAとCが同じ枚数なので、どれも確実には言えません。"}]},{"label":"差と大小の条件から、あり得る組をすべて書き出す","kind":"choice","question":"赤、青、黄の3色の札が、合わせて13枚あります。どの色も1枚以上あり、次のことがわかっています。\n・赤の札は、青の札より2枚多い。\n・黄の札は、赤の札より少ない。\n次のア〜オのうち、確実に言えるものを1つ選んでください。","answer":"ア","options":[{"key":"ア","text":"黄の札の枚数は奇数である。","correct":true,"reason":"あり得る組は「青4枚・赤6枚・黄3枚」と「青5枚・赤7枚・黄1枚」の2通りで、黄はどちらも奇数です。"},{"key":"イ","text":"青の札は4枚である。","correct":false,"reason":"「青5枚・赤7枚・黄1枚」の組もあり得るので、青が4枚とは限りません。"},{"key":"ウ","text":"赤の札の枚数は、黄の札の枚数の2倍である。","correct":false,"reason":"「青5枚・赤7枚・黄1枚」の組では、赤は黄の7倍です。"},{"key":"エ","text":"黄の札は2枚以上ある。","correct":false,"reason":"「青5枚・赤7枚・黄1枚」の組では、黄は1枚です。"},{"key":"オ","text":"赤と青の札の枚数の合計は奇数である。","correct":false,"reason":"赤と青の合計は、2通りとも偶数（10枚と12枚）です。赤は青より2枚多いので、赤と青の合計は青の2倍に2を足した数になり、いつも偶数です。"}],"steps":[{"title":"条件を置き、決める順番を選ぶ","formula":"合計：13枚\n赤 ＝ 青 ＋ 2\n黄 ＜ 赤\nどの色も1枚以上","body":"赤は青から決まるので、青の枚数を小さい順に決めると、赤と黄が順に決まります。黄は、13枚から赤と青を引いた残りです。"},{"title":"青の枚数ごとに、赤と黄を表にする","table":{"caption":"青の枚数で場合を分ける","rows":[["青","赤","黄（13 − 青 − 赤）","黄は赤より少ないか"],["1","3","9","少なくない"],["2","4","7","少なくない"],["3","5","5","少なくない（同じ）"],["4","6","3","少ない"],["5","7","1","少ない"]]},"body":"青が6枚だと赤は8枚で、合わせて14枚になり、13枚を超えます。青がそれより多くても同じなので、青は5枚までです。"},{"title":"条件に合う組を取り出し、合計を確かめる","formula":"4 + 6 + 3 = 13\n5 + 7 + 1 = 13","body":"左から青、赤、黄の枚数です。黄が赤より少ない組は、この2通りだけです。"},{"title":"選択肢を、2通りの両方で調べる","formula":"ア：黄は3枚と1枚 → どちらも奇数 → 確実に言える\nイ：青は4枚と5枚 → 言えない\nウ：赤6枚・黄3枚は2倍、赤7枚・黄1枚は7倍 → 言えない\nエ：黄1枚の組がある → 言えない\nオ：赤と青の合計は10枚と12枚 → どちらも偶数 → 誤り","body":"2通りのどちらでも成り立つのは、アだけです。黄は、13から青と赤（青＋2）を引いた数なので、11から青の2倍を引いた数になります。11は奇数、青の2倍は偶数なので、黄は青が何枚でも奇数だと、表を作らなくてもわかります。オは、どちらの組でも成り立たないので、確実に誤りです。"}]}]}},"kmn-sequence":{"id":"kmn-sequence","name":"数列の規則","type":"learn","goal":"並んだ数から、差や比、差の並び、1つおきの並び、くり返しの規則を見つけて、空欄の数や先の数を求められる。","part_of":"koumuin","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を、練習の検証と合わせて確認。指摘を反映した後に再検証。","text":"数がある規則で一列に並んだものを数列といい、並んだ一つ一つの数を項といいます。数列の問題では、規則を見つけて、空欄に入る数や、ずっと先の項を求めます。よく使われる規則は五つです。(1) 隣どうしの差がいつも同じ（等差数列）。(2) 前の数に同じ整数をかけて次の数になる（等比数列）。(3) 隣どうしの差を並べると、その差の並びに規則がある（階差数列）。(4) 1つおきに見ると、二つの数列が交互に並んでいる。(5) いくつかの数の組が、同じ順でくり返される。規則を探すときは、まず隣どうしの差を書き出します。差がそろわなければ、比（何倍になっているか）を見ます。それでも見つからなければ、差の並びの規則、1つおきの並びの順に調べます。見つけた規則は、ほかのすべての項で成り立つかを確かめてから使います。","example":"差がいつも同じ：5、8、11、14 は、差がどれも3\n前の数の2倍：3、6、12、24\n差の並びに規則：1、2、4、7、11 は、差が1、2、3、4と1ずつ増える\n1つおきに見る：1、10、2、20、3、30 は、1、2、3 と 10、20、30 が交互に並ぶ\nくり返し：6、1、6、1、… の項は、何番目かを2で割ったあまりが1なら6、0なら1","note":"差がいつも同じ数列で、ずっと先の項を求めるときは、はじめの項に差を何回足すかを数えます。2番目の項は差を1回、3番目の項は差を2回足した数なので、足す回数は、何番目かより1少なくなります。ここでは、区切りごとに項の数が増える群数列や、表や図の形に並んだ数は扱いません。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。学習時間は、公務員の単元どうしの釣り合いとの比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"2、6、18、54、□ の □ に入る数は？","options":["108","162","90"],"answer":1,"explanation":"隣どうしは、どれも3倍になっている（2 × 3 = 6、6 × 3 = 18、18 × 3 = 54）。54 × 3 = 162。108は、最後だけ2倍にした誤り。90は、差の4、12、36を見て、最後の差36をもう一度足した誤りで、差は3倍ずつ大きくなっているので、次の差は36ではない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、□に入る数が規則の別の読み（差、比、差の差、1つおき）で別の数にならないかを実際に試して確認。前提の範囲（文字式を使わない）を確認し、指摘を反映した後に2回再検証。","title":"差、比、1つおき、くり返しを順に調べて、規則を見つける","lead":"まず隣どうしの差を書き出す。本試験は選択肢から一つを選ぶ形式です。ここでは解き方を身につけるために、多くの問題で数を直接答えます。","original":true,"problems":[{"label":"差の並びから空欄を求める","question":"次の数列の □ に入る数を求めましょう。\n3、4、6、9、13、□、24","answer":"18","alternatives":[{"try":"13 + 4 = 17（最後の差4をもう一度足す）","why_not":"差は1、2、3、4と、1ずつ大きくなっています。13の次の差は4ではなく5です。17とすると、その次の24との差が7になり、差の並びが1、2、3、4、4、7となって、規則がくずれます。"}],"steps":[{"title":"隣どうしの差を書き出す","formula":"4 − 3 = 1\n6 − 4 = 2\n9 − 6 = 3\n13 − 9 = 4","body":"□の手前までの、わかっている数どうしの差を、左から順に求めます。差は1、2、3、4で、そろっていません。差がいつも同じ数列ではありません。"},{"title":"比を見て、何倍かの規則でないことを確かめる","formula":"4 ÷ 3 = 1 あまり 1\n6 ÷ 4 = 1 あまり 2\n9 ÷ 6 = 1 あまり 3","body":"どれも割り切れないので、次の数は前の数の整数倍になっていません。同じ整数をかけて次の数になる数列ではありません。"},{"title":"差の並びの規則を見つける","formula":"差：1、2、3、4\n1 + 1 = 2\n2 + 1 = 3\n3 + 1 = 4","body":"差そのものが、1ずつ大きくなっています。この規則が続くとすると、13の次の差は5、その次の差は6です。"},{"title":"13に次の差を足して、□を求める","formula":"4 + 1 = 5\n13 + 5 = 18","body":"□は18です。"},{"title":"□の次の数で確かめる","formula":"5 + 1 = 6\n18 + 6 = 24","body":"□の次の差は6で、18に足すと24になり、問題の最後の数と一致します。差の並びは1、2、3、4、5、6で、規則どおりです。"}]},{"label":"差が同じ数列の、ずっと先の項","question":"4、11、18、25、… と、ある規則で数が並んでいます。30番目の数を求めましょう。","answer":"207","alternatives":[{"try":"4 + 30 × 7 = 214（差を30回足す）","why_not":"2番目の11は、4に差を1回足した数で、3番目の18は2回足した数です。足す回数は何番目かより1少ないので、30番目では差を29回足します。30回足すと、31番目の数になります。"}],"steps":[{"title":"隣どうしの差を確かめる","formula":"11 − 4 = 7\n18 − 11 = 7\n25 − 18 = 7","body":"差はどれも7です。はじめの数4に、7ずつ足していく数列です。"},{"title":"何回足すかを数える","formula":"1番目：4\n2番目：4 + 7 × 1 = 11\n3番目：4 + 7 × 2 = 18\n30番目：4 + 7 × 29","body":"2番目は1回、3番目は2回足しています。足す回数は、何番目かより1少ないので、30番目では29回です。"},{"title":"計算する","formula":"7 × 29 = 203\n4 + 203 = 207","body":"30番目の数は207です。"}]},{"label":"二つの数列が交互に並ぶ","question":"次の数列の □ に入る数を求めましょう。\n2、30、4、27、8、24、□、21、32、18","answer":"16","alternatives":[{"try":"隣どうしの差だけで規則を探す","why_not":"隣どうしを見ると、28増え、26減り、23増え、19減り、16増えと、増えたり減ったりで、規則が見つかりません。1つおきに見ると、二つの単純な数列に分かれます。"},{"try":"奇数番目 2、4、8 の差が2、4と2ずつ増えると見て、8 + 6 = 14","why_not":"差が2ずつ増えるなら、14の次の奇数番目は14 + 8 で22のはずですが、問題では32です。2倍ずつの規則なら、16の次が32で合います。"}],"steps":[{"title":"奇数番目と偶数番目に分ける","formula":"1、3、5、7、9番目：2、4、8、□、32\n2、4、6、8、10番目：30、27、24、21、18","body":"大きい数と小さい数が交互に出てくるので、1つおきに取り出して、二つの数列に分けます。□は7番目なので、奇数番目の数列に入ります。"},{"title":"偶数番目の規則を確かめる","formula":"30 − 27 = 3\n27 − 24 = 3\n24 − 21 = 3\n21 − 18 = 3","body":"偶数番目は、3ずつ減っていく数列です。"},{"title":"奇数番目の規則を見つけて、□を求める","formula":"2 × 2 = 4\n4 × 2 = 8\n8 × 2 = 16\n16 × 2 = 32","body":"奇数番目の差は2、4で、そろいません。差が2ずつ増えると見ると、□は8 + 6 で14になりますが、その次の32との差が18になり、差の並びが2、4、6、18とくずれます。比を見ると、2から4、4から8はどれも2倍で、□を8の2倍の16とすると、その次の32も16の2倍で合います。□は16です。"}]},{"label":"くり返す数列の和","question":"4、9、2、4、9、2、… と、4、9、2 の3つの数が、この順でくり返し並んでいます。1番目から50番目までの数を、すべて足すといくつでしょうか。","answer":"253","alternatives":[{"try":"50個を3つずつに分けると17組できると見て、15 × 17 = 255","why_not":"50個は、3つそろった組が16組と、あと2つの数（4と9）です。17組目は2つしかなく、3つ目の2は50番目までに入りません。17組と数えると、その2の分だけ多くなります。組の数はまるごとそろった分だけ数え、あまりの分は別に足します。"}],"steps":[{"title":"くり返しの1組と、その和を確かめる","formula":"1組：4、9、2（3つ）\n4 + 9 + 2 = 15","body":"3つの数を1組として、同じ組がくり返されます。"},{"title":"50個が、何組とあといくつかを求める","formula":"50 ÷ 3 = 16 あまり 2\n3 × 16 + 2 = 50","body":"16組がまるごと入り、あまりの2個は、17組目のはじめの2つ（4と9）です。"},{"title":"組の分と、あまりの分を足す","formula":"15 × 16 = 240\n4 + 9 = 13\n240 + 13 = 253","body":"1番目から50番目までの和は253です。"}]},{"label":"かける数が変わる数列","question":"次の数列の □ に入る数を、ア〜ウから1つ選んでください。\n1、2、6、24、120、□","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"240","correct":false,"reason":"120を2倍した数です。前の数の2倍になっているのは、1から2へのところだけで、2から6へは3倍です。"},{"key":"イ","text":"600","correct":false,"reason":"最後の24から120へと同じ5倍を続けた数です。かける数は2、3、4、5と1ずつ大きくなっているので、次は5倍ではありません。"},{"key":"ウ","text":"720","correct":true,"reason":"前の数にかける数が2、3、4、5と1ずつ大きくなっているので、次は6倍です。120 × 6 = 720。"}],"steps":[{"title":"差を見る","formula":"2 − 1 = 1\n6 − 2 = 4\n24 − 6 = 18\n120 − 24 = 96","body":"差は1、4、18、96で、そろっていません。差がいつも同じ数列ではないので、次に比を見ます。"},{"title":"何倍になっているかを見る","formula":"2 ÷ 1 = 2\n6 ÷ 2 = 3\n24 ÷ 6 = 4\n120 ÷ 24 = 5","body":"かける数が、2、3、4、5と1ずつ大きくなっています。"},{"title":"次にかける数で、□を求める","formula":"120 × 6 = 720","body":"次にかける数は6です。□は720で、ウです。"}]}]},"sources":[{"title":"アガルート：公務員試験の数的推理（出題分野に数列）","url":"https://www.agaroot.jp/komuin/column/mathmatical_reasoning/","checked_at":"2026-10-16"},{"title":"CREX：TG-WEBの対策（従来型の計数の出題分野に数列）","url":"https://crexgroup.com/ja/shukatsu/?p=207","checked_at":"2026-10-16"}]},"kmn-share":{"id":"kmn-share","name":"構成比の資料","type":"learn","goal":"円グラフや帯グラフの構成比と総数から実数を求め、年どうしや区分どうしを比べる記述が正しいかどうかを判定できる。","part_of":"koumuin","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を、練習の検証と合わせて確認。軽微の指摘を反映。","text":"円グラフと帯グラフは、全体を100%としたときの区分ごとの割合（構成比）を示す図です。円グラフは一つの年の内訳を、帯グラフは何年かの内訳を並べて示します。帯の長さはどの年も同じに描かれていて、総数の大きさは表していません。区分の実数は、総数に構成比をかけて求めます。同じ年の区分どうしなら、総数が同じなので、構成比の比がそのまま実数の比になります。違う年どうしを比べるときは、総数が違うので、構成比だけでは比べられません。総数が減った年では、構成比が上がっても実数が減ることがあります。逆に、総数が増えた年では、構成比が下がっても実数が増えることがあります。","example":"区分の実数 = 総数 × 構成比\n例　総数200人、構成比35%：200 × 0.35 = 70\n翌年、総数150人、構成比40%：150 × 0.4 = 60\n構成比は35%から40%に上がり、実数は70人から60人に減った\n同じ年の区分どうしの比 = 構成比どうしの比","note":"総数は、図の題や注、別の表に書かれています。問題ごとに、どこに書かれているかを先に確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、公務員の単元どうしの釣り合いと予備校・対策本の分野の立て方との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"kmn-data","level":"must"}],"assessment":{"question":"ある学校で自転車で通学する生徒の構成比は、昨年が20%、今年が25%だった。生徒の総数は、昨年が600人、今年が400人だった。自転車で通学する生徒の数は、昨年と比べてどうなった？","options":["増えた","減った","変わらない"],"answer":1,"explanation":"昨年は 600 × 0.2 = 120人、今年は 400 × 0.25 = 100人で、減っている。構成比が上がったことだけを見て「増えた」とするのは誤り。総数が減ったので、構成比が上がっても実数は減ることがある。120人と100人で同じではないので、「変わらない」も誤り。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の読み・別の選択肢で試して確認。円グラフと帯グラフの座標を計算して文字の重なりを確認し、値と alt の一致、実数の表を再計算。軽微の指摘を反映。","title":"円グラフと帯グラフの構成比を実数に直して、記述の正誤を判定する","lead":"図の値は構成比（%）です。区分の実数は、総数 × 構成比 で出します。本試験は五つの選択肢から一つを選ぶ形式です。ここでは、はじめの三問を三つの選択肢にして解き方を身につけ、最後の問題を本試験と同じ五つの選択肢にしています。","original":true,"problems":[{"label":"円グラフの構成比を、総額から実数に直す","question":"図は、ある町の2024年の農産物の出荷額について、品目別の構成比を示しています。2024年の出荷額の総額は50億円でした。次のア〜ウのうち、正しいものを1つ選んでください。","answer":"ア","kind":"choice","figures":[{"kind":"pie","caption":"図　ある町の農産物の出荷額の品目別構成比（2024年）","unit":"%","alt":"円グラフ。2024年の農産物の出荷額の品目別構成比は、米40%、野菜30%、果物20%、その他10%。","x":["米","野菜","果物","その他"],"series":[{"name":"2024年","values":[40,30,20,10]}]}],"options":[{"key":"ア","text":"野菜の出荷額は15億円である。","correct":true,"reason":"総額50億円の30%なので、50 × 0.3 = 15 で15億円。"},{"key":"イ","text":"米の出荷額は、果物の出荷額の2倍より多い。","correct":false,"reason":"同じ年の区分どうしなので、構成比の比がそのまま出荷額の比になる。40 ÷ 20 = 2 で、ちょうど2倍。2倍より多くはない。"},{"key":"ウ","text":"その他の出荷額は10億円である。","correct":false,"reason":"構成比の10%を、そのまま10億円と読んだ誤り。50 × 0.1 = 5 で5億円。"}],"steps":[{"title":"図の値と総数を確かめる","formula":"図の値：品目別の構成比（%）\n総数：出荷額の総額 50億円","body":"図の値は出荷額そのものではなく、総額を100%としたときの割合です。出荷額を出すには、問題文の総額を使います。"},{"title":"百分率を小数に直す","formula":"40% → 0.4\n30% → 0.3\n20% → 0.2\n10% → 0.1","body":"構成比を総数にかけるときは、百分率を100で割って小数にします。"},{"title":"品目ごとの出荷額を出す","formula":"米：50 × 0.4 = 20\n野菜：50 × 0.3 = 15\n果物：50 × 0.2 = 10\nその他：50 × 0.1 = 5","body":"単位は億円です。4品目を足すと 20 + 15 + 10 + 5 = 50 で、総額に戻ります。"},{"title":"選択肢を判定する","formula":"ア：野菜 15億円（正しい）\nイ：米 20億円、果物の2倍 20億円（同じで、多くはない）\nウ：その他 5億円（10億円ではない）","body":"イは、出荷額に直さなくても、構成比の 40 と 20 の比で判定できます。同じ年の円グラフの中なら、総数が同じだからです。正しいのはアです。"}]},{"label":"構成比が上がっても、実数が減ることがある","question":"図は、ある会社の社員の通勤手段別の構成比を、2014年と2024年について示しています。表は、各年の社員の総数です。次のア〜ウのうち、図と表から正しいと言えるものを1つ選んでください。","answer":"ウ","kind":"choice","figures":[{"kind":"band","caption":"図　ある会社の社員の通勤手段別構成比","unit":"%","alt":"帯グラフ。社員の通勤手段別の構成比。2014年は、電車50%、バス25%、自転車15%、徒歩10%。2024年は、電車60%、バス20%、自転車10%、徒歩10%。","x":["電車","バス","自転車","徒歩"],"series":[{"name":"2014年","values":[50,25,15,10]},{"name":"2024年","values":[60,20,10,10]}]}],"tables":[{"caption":"社員の総数","rows":[["年","2014年","2024年"],["社員の総数（人）","800","500"]]}],"options":[{"key":"ア","text":"電車で通勤する社員は、2014年より2024年のほうが多い。","correct":false,"reason":"構成比は50%から60%に上がったが、2014年は 800 × 0.5 = 400人、2024年は 500 × 0.6 = 300人で、減っている。総数が800人から500人に減ったため。"},{"key":"イ","text":"徒歩で通勤する社員の数は、2014年と2024年で同じである。","correct":false,"reason":"構成比はどちらも10%だが、2014年は 800 × 0.1 = 80人、2024年は 500 × 0.1 = 50人で、同じではない。"},{"key":"ウ","text":"バスで通勤する社員は、2014年から2024年にかけて半分に減った。","correct":true,"reason":"2014年は 800 × 0.25 = 200人、2024年は 500 × 0.2 = 100人。100 ÷ 200 = 0.5 で、半分になっている。"}],"steps":[{"title":"年どうしを比べるので、総数を確かめる","formula":"2014年の総数：800人\n2024年の総数：500人","body":"帯の長さは同じに描かれていますが、総数は違います。違う年どうしは、構成比のままでは比べられないので、実数に直します。"},{"title":"アを、電車の実数で確かめる","formula":"2014年 電車：800 × 0.5 = 400\n2024年 電車：500 × 0.6 = 300","body":"構成比は上がっていますが、実数は400人から300人に減っています。総数が大きく減ったためです。アは誤りです。"},{"title":"イを、徒歩の実数で確かめる","formula":"2014年 徒歩：800 × 0.1 = 80\n2024年 徒歩：500 × 0.1 = 50","body":"構成比が同じでも、総数が違えば実数は違います。イは誤りです。"},{"title":"ウを、バスの実数で確かめる","formula":"2014年 バス：800 × 0.25 = 200\n2024年 バス：500 × 0.2 = 100\n100 ÷ 200 = 0.5","body":"2024年は2014年の0.5倍で、半分に減っています。正しいのはウです。"}],"alternatives":[{"try":"電車の構成比が50%から60%に上がったので、アを正しいとする","why_not":"構成比が上がったのは、電車の社員が増えたからではなく、ほかの手段の社員が電車よりも大きな割合で減ったからです。実数は、総数 × 構成比 で、400人から300人に減っています。"}]},{"label":"総数が増えた年は、構成比が下がっても実数が増えることがある","question":"図は、ある市を訪れた観光客の目的別の構成比を、2019年と2024年について示しています。表は、各年の観光客の総数です。次のア〜ウのうち、図と表から正しいと言えるものを1つ選んでください。","answer":"イ","kind":"choice","figures":[{"kind":"band","caption":"図　ある市を訪れた観光客の目的別構成比","unit":"%","alt":"帯グラフ。観光客の目的別の構成比。2019年は、温泉50%、食事20%、祭り20%、その他10%。2024年は、温泉40%、食事30%、祭り20%、その他10%。","x":["温泉","食事","祭り","その他"],"series":[{"name":"2019年","values":[50,20,20,10]},{"name":"2024年","values":[40,30,20,10]}]}],"tables":[{"caption":"観光客の総数","rows":[["年","2019年","2024年"],["観光客の総数（万人）","20","30"]]}],"options":[{"key":"ア","text":"温泉が目的の観光客は、2019年より2024年のほうが少ない。","correct":false,"reason":"構成比は50%から40%に下がったが、2019年は 20 × 0.5 = 10万人、2024年は 30 × 0.4 = 12万人で、増えている。総数が20万人から30万人に増えたため。"},{"key":"イ","text":"2024年の食事が目的の観光客は、2019年の食事が目的の観光客の2倍より多い。","correct":true,"reason":"2019年は 20 × 0.2 = 4万人、2024年は 30 × 0.3 = 9万人。9 ÷ 4 = 2.25 で、2倍より多い。"},{"key":"ウ","text":"祭りが目的の観光客の増加率は、観光客全体の増加率より小さい。","correct":false,"reason":"祭りは 20 × 0.2 = 4万人から 30 × 0.2 = 6万人で50%増、全体は20万人から30万人で50%増。構成比が変わらない区分は、全体と同じ割合で増えるので、同じであって小さくはない。"}],"steps":[{"title":"アを、温泉の実数で確かめる","formula":"2019年 温泉：20 × 0.5 = 10\n2024年 温泉：30 × 0.4 = 12","body":"単位は万人です。構成比は下がっていますが、総数が増えたので、実数は増えています。アは誤りです。"},{"title":"イを、食事の実数で確かめる","formula":"2019年 食事：20 × 0.2 = 4\n2024年 食事：30 × 0.3 = 9\n9 ÷ 4 = 2.25","body":"2.25倍で、2倍より多いので、イは正しいとわかります。"},{"title":"イを、倍率のかけ算で確かめ直す","formula":"総数の倍率：30万人 ÷ 20万人 = 1.5\n構成比の倍率：30% ÷ 20% = 1.5\n食事の実数の倍率：1.5 × 1.5 = 2.25","body":"実数 = 総数 × 構成比 なので、実数の倍率は、総数の倍率と構成比の倍率をかけたものです。実数を一つずつ出さなくても判定できます。"},{"title":"ウを、増加率どうしで比べる","formula":"2019年 祭り：20 × 0.2 = 4\n2024年 祭り：30 × 0.2 = 6\n祭りの増加率：(6 − 4) ÷ 4 = 0.5\n全体の増加率：(30 − 20) ÷ 20 = 0.5","body":"どちらも50%で、同じです。ウは誤りです。正しいのはイです。"}],"alternatives":[{"try":"食事の構成比が20%から30%に上がったので、1.5倍になったとし、イを誤りとする","why_not":"1.5倍は構成比の倍率で、実数の倍率ではありません。総数も1.5倍になっているので、実数は 1.5 × 1.5 = 2.25 倍です。"}]},{"label":"三つの年の帯グラフで、五つの記述を判定する","question":"図は、ある図書館の貸出冊数の分類別の構成比を、2004年、2014年、2024年について示しています。表は、各年の貸出冊数の総数です。次の1〜5のうち、図と表から正しいと言えるものを1つ選んでください。","answer":"3","kind":"choice","figures":[{"kind":"band","caption":"図　ある図書館の貸出冊数の分類別構成比","unit":"%","alt":"帯グラフ。貸出冊数の分類別の構成比。2004年は、小説40%、実用書30%、児童書20%、その他10%。2014年は、小説35%、実用書30%、児童書25%、その他10%。2024年は、小説25%、実用書30%、児童書35%、その他10%。","x":["小説","実用書","児童書","その他"],"series":[{"name":"2004年","values":[40,30,20,10]},{"name":"2014年","values":[35,30,25,10]},{"name":"2024年","values":[25,30,35,10]}]}],"tables":[{"caption":"貸出冊数の総数","rows":[["年","2004年","2014年","2024年"],["貸出冊数の総数（万冊）","50","40","32"]]}],"options":[{"key":"1","text":"実用書の構成比は三つの年で同じなので、実用書の貸出冊数も三つの年で同じである。","correct":false,"reason":"実用書は、2004年が 50 × 0.3 = 15万冊、2014年が 40 × 0.3 = 12万冊、2024年が 32 × 0.3 = 9.6万冊で、総数とともに減っている。"},{"key":"2","text":"児童書の貸出冊数は、2004年から2024年まで増え続けている。","correct":false,"reason":"児童書は、2004年が 50 × 0.2 = 10万冊、2014年が 40 × 0.25 = 10万冊で同じ。構成比は上がり続けているが、2004年から2014年にかけて貸出冊数は増えていない。"},{"key":"3","text":"2024年の児童書の貸出冊数は、2004年の小説の貸出冊数の半分より多い。","correct":true,"reason":"2024年の児童書は 32 × 0.35 = 11.2万冊。2004年の小説は 50 × 0.4 = 20万冊で、その半分は10万冊。11.2万冊は10万冊より多い。"},{"key":"4","text":"2014年から2024年にかけての貸出冊数の減少率は、実用書のほうが小説より大きい。","correct":false,"reason":"小説は14万冊から8万冊で約43%減、実用書は12万冊から9.6万冊で20%減。減少率は小説のほうが大きい。"},{"key":"5","text":"2004年の小説の貸出冊数は、2024年の実用書と児童書の貸出冊数の合計より多い。","correct":false,"reason":"2004年の小説は20万冊、2024年の実用書と児童書の合計は 9.6 + 11.2 = 20.8 万冊。小説のほうが少ない。"}],"steps":[{"title":"分類ごとの貸出冊数を、表にまとめる","body":"三つの年の総数が違うので、記述を判定する前に、総数 × 構成比 で実数の表を作ります。単位は万冊です。例えば、2024年の児童書は 32 × 0.35 = 11.2 です。","table":{"caption":"分類別の貸出冊数（万冊）","rows":[["","2004年","2014年","2024年"],["小説","20","14","8"],["実用書","15","12","9.6"],["児童書","10","10","11.2"],["その他","5","4","3.2"]]}},{"title":"1と2を、表で判定する","formula":"実用書：15 → 12 → 9.6（減っている）\n児童書：10 → 10 → 11.2（2014年は2004年と同じ）","body":"構成比が同じでも、総数が減れば実数は減ります。構成比が上がっても、総数が減れば実数が増えないことがあります。1も2も誤りです。"},{"title":"3を、半分の値と比べる","formula":"2004年の小説の半分：20 ÷ 2 = 10\n2024年の児童書：32 × 0.35 = 11.2","body":"11.2は10より大きいので、3は正しいとわかります。"},{"title":"4を、減少率で比べる","formula":"小説：(14 − 8) ÷ 14 ≒ 0.43\n実用書：(12 − 9.6) ÷ 12 = 0.2","body":"小説のほうが減少率が大きいので、4は誤りです。"},{"title":"5を、合計と比べる","formula":"2024年の実用書と児童書：9.6 + 11.2 = 20.8\n2004年の小説：20","body":"20は20.8より小さいので、5は誤りです。正しいのは3です。"}],"alternatives":[{"try":"構成比どうしで比べて5を判定する（40% < 30% + 35% なので、5は誤りとする）","why_not":"2004年と2024年では総数が50万冊と32万冊で違うので、違う年の構成比は、そのままでは比べられません。この問題では結論がたまたま同じになりますが、実数に直して 20万冊 < 20.8万冊 と確かめる必要があります。"}]}]}},"kmn-stream":{"id":"kmn-stream","name":"流水算と通過算","type":"learn","goal":"川の流れや列車の長さを考えに入れて、速さ、時間、距離を求められる。","part_of":"koumuin","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"流水算は、流れのある川を船が進む問題です。流れのない水（静水）での船の速さに、下るときは流れの速さを足し、上るときは流れの速さを引きます。通過算は、長さのある列車が橋やトンネルを通る問題です。列車の先頭が橋にさしかかってから、最後尾が橋を出るまでに、列車は橋の長さと列車の長さを足した距離を進みます。どちらも、速さを決め直してから「距離 = 速さ × 時間」を使います。","example":"下りの速さ = 静水での速さ + 流れの速さ\n上りの速さ = 静水での速さ − 流れの速さ\n渡りきるまでに進む距離 = 橋の長さ + 列車の長さ\n例　静水での速さが時速10kmの船が、時速2kmで流れる川を下る速さ：10 + 2 = 12","note":"同じ船が上るときの速さは、10 − 2 で時速8kmです。"},"review":{"checked_at":"2026-10-14","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、SPIの検証済みの単元との釣り合いと予備校の記述(単元ごとの時間数は見つからず)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"spi-speed","level":"must"}],"assessment":{"question":"静水での速さが時速15kmの船が、時速3kmで流れる川を36km上ります。何時間かかるでしょうか。","options":["2時間","2.4時間","3時間"],"answer":2,"explanation":"上りの速さは 15 − 3 = 12 で時速12km。36 ÷ 12 = 3時間。2時間は、下りの速さの時速18kmで割った誤り。2.4時間は、流れを考えずに時速15kmで割った誤りです。"},"practice":{"title":"流れと列車の長さを入れて、速さの問題を解く","lead":"先に、実際に進む速さと、実際に進む距離を決める。本試験は五つの選択肢から一つを選ぶ形式です。ここでは解き方を身につけるために、数を直接答えます。","original":true,"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差を確認。指摘を反映した後に再検証。","problems":[{"label":"川を下って、上って戻る","question":"静水での速さが時速12kmの船が、時速4kmで流れる川を48km下り、同じ48kmを上って戻ります。往復で何時間かかるでしょうか。","answer":"9時間","alternatives":[{"try":"8時間（往復の96kmを、静水での速さの時速12kmで割る）","why_not":"下りで速くなる分と、上りで遅くなる分は、打ち消し合いません。遅い上りのほうが長い時間かかるので、流れがないときの8時間より長くなります。"}],"steps":[{"title":"下りの速さと、上りの速さを求める","formula":"下り：12 + 4 = 16\n上り：12 − 4 = 8","body":"下るときは流れに押されるので足し、上るときは流れに逆らうので引きます。どちらも時速（km）で表した速さです。"},{"title":"下りにかかる時間を求める","formula":"48 ÷ 16 = 3","body":"時間は、距離 ÷ 速さで求めます。下りは3時間です。"},{"title":"上りにかかる時間を求める","formula":"48 ÷ 8 = 6","body":"上りは速さが半分なので、時間は2倍の6時間です。"},{"title":"二つの時間を足す","formula":"3 + 6 = 9","body":"往復で9時間かかります。"}]},{"label":"上りと下りの時間から、流れの速さを求める","question":"ある船が、川を30km下るのに2時間、同じ30kmを上るのに3時間かかりました。船の静水での速さと、川の流れの速さは、どちらも一定です。川の流れの速さは、時速何kmでしょうか。","answer":"時速2.5km","alternatives":[{"try":"時速12.5km（下りの速さと上りの速さの平均）","why_not":"時速12.5kmは、船の静水での速さです。聞かれているのは、川の流れの速さです。"},{"try":"時速5km（下りの速さと上りの速さの差）","why_not":"下りの速さは流れの分だけ速く、上りの速さは流れの分だけ遅いので、二つの差は流れの速さの2つ分です。差の5を2で割ります。"}],"steps":[{"title":"下りの速さと、上りの速さを求める","formula":"下り：30 ÷ 2 = 15\n上り：30 ÷ 3 = 10","body":"速さは、距離 ÷ 時間で求めます。どちらも時速（km）で表した速さです。"},{"title":"二つの速さの差が、何を表すかを考える","formula":"下りの速さ = 静水での速さ + 流れの速さ\n上りの速さ = 静水での速さ − 流れの速さ\n下りの速さ − 上りの速さ = 流れの速さ × 2","body":"下りは静水での速さより流れの分だけ速く、上りは流れの分だけ遅くなります。だから、下りと上りの差は、流れの速さの2つ分です。"},{"title":"差を2で割って、流れの速さを求める","formula":"(15 − 10) ÷ 2 = 2.5","body":"流れの速さは時速2.5kmです。"},{"title":"静水での速さを求めて、条件に合うか確かめる","formula":"静水での速さ：15 − 2.5 = 12.5\n上りの速さ：12.5 − 2.5 = 10","body":"下りの速さから流れを引くと、静水での速さは時速12.5kmです。そこからもう一度流れを引くと時速10kmで、上りの速さと合います。"}]},{"label":"列車が橋を渡りきる","question":"長さ200mの列車が、秒速25mで、長さ800mの橋を渡ります。列車の先頭が橋にさしかかってから、最後尾が橋を出るまでに、何秒かかるでしょうか。","answer":"40秒","alternatives":[{"try":"32秒（橋の長さの800mを、秒速25mで割る）","why_not":"32秒後は、先頭が橋を出るときです。そのとき、列車の後ろの部分はまだ橋の上にあります。最後尾が橋を出るまでに、列車の長さの200mをさらに進みます。"}],"steps":[{"title":"先頭が進む距離を考える","formula":"はじめ：先頭が橋の入口\nおわり：最後尾が橋の出口（先頭は、出口から200m先）","body":"列車の一か所に注目します。先頭は、橋の入口から出発して、橋の出口のさらに200m先まで進みます。"},{"title":"進む距離を求める","formula":"800 + 200 = 1000","body":"橋の長さと列車の長さを足した1000mを進みます。"},{"title":"距離を速さで割って、時間を求める","formula":"1000 ÷ 25 = 40","body":"秒速25mで1000mを進むので、40秒かかります。"},{"title":"40秒で進む距離を確かめる","formula":"25 × 40 = 1000","body":"40秒で1000m進み、橋の800mと列車の200mを合わせた長さになります。"}]}]}},"kmn-suuteki":{"id":"kmn-suuteki","name":"公務員の数的処理","type":"target","goal":"判断推理、数的推理、資料解釈の代表的な問題を学び、志望先の過去問で演習を始める。","part_of":"koumuin","status":"draft","featured":true,"scope_note":"代表分野への学習経路です。出題の範囲と数は、試験の種類（国家、地方、市役所など）と年度で違います。受験案内に書かれているのは分野の名前と題数までで、分野の中の分け方は予備校の資料をもとにしています。未収録の分野：「すべて」「ある」を含む命題とベン図を使う命題、図形の問題（判断推理の展開図や立体、数的推理の図形の計量）、複数の資料を組み合わせる問題、数列のうち群数列と表の形に並んだ数、n進法の計算（足し引きや小数）、年齢算以外の方程式の文章題、操作の手順のうち偽物が重いか軽いかわからないてんびんや川渡りなど。「相似」と「三平方の定理」への細い線は、図形の計量に進むときの準備です。「数的処理」は、判断推理・数的推理・資料解釈をまとめる呼び名として、予備校などで使われています。国家公務員の一般職（大卒程度）の受験案内にはこの語はなく、判断推理、数的推理、資料解釈と書かれています。高卒程度の試験では「数的処理」が一つの分野の名前として使われていて、意味が違います。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"出題数、形式、解答時間を人事院の二つの資料の本文と照合。分野の分け方は予備校の資料と照合（公式の一覧はない）。指摘を反映した後に再検証。","text":"公務員試験の教養試験（国家公務員では基礎能力試験）のうち、判断推理、数的推理、資料解釈をまとめて「数的処理」と呼ぶことがあります。国家公務員の一般職試験（大卒程度）の基礎能力試験は30題で、このうち判断推理が7題、数的推理が4題、資料解釈が3題です（2024年の試験から）。多肢選択式（受験案内の表記。人事院の例題は五つの選択肢）で、解答時間は1時間50分です。","example":"判断推理：対応関係、発言の真偽、命題、集合、順序や位置の推論、暗号、試合の勝敗、数量の推理、操作の手順\n数的推理：数列、速さ、仕事算、濃度、約数と倍数、n進法、年齢算、場合の数、確率、損益\n資料解釈：表やグラフ（構成比の円グラフや帯グラフを含む）についての記述の正誤","note":"出題数は人事院の資料で2026-10-13に確認しました。地方公務員の試験は、自治体ごとに違います。受験の前に、志望先の受験案内を確かめてください。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"kmn-integers","level":"must"},{"id":"kmn-concentration","level":"must"},{"id":"kmn-age","level":"must"},{"id":"spi-speed","level":"must"},{"id":"kmn-stream","level":"helps"},{"id":"kmn-matching","level":"must"},{"id":"kmn-proposition","level":"must"},{"id":"kmn-truth","level":"must"},{"id":"kmn-graph","level":"must"},{"id":"kmn-share","level":"must"},{"id":"kmn-cipher","level":"must"},{"id":"kmn-games","level":"must"},{"id":"kmn-quantity","level":"must"},{"id":"kmn-procedure","level":"must"},{"id":"kmn-sequence","level":"must"},{"id":"spi-work","level":"must"},{"id":"spi-profit","level":"helps"},{"id":"math-probability","level":"must"},{"id":"spi-sets","level":"must"},{"id":"math-similarity","level":"helps"},{"id":"math-pythagoras","level":"helps"}],"sources":[{"title":"人事院：基礎能力試験の見直し（出題数の内訳）","url":"https://www.jinji.go.jp/content/900035915.pdf","checked_at":"2026-10-13"},{"title":"人事院：2026年度 国家公務員採用一般職試験（大卒程度試験）受験案内","url":"https://www.jinji.go.jp/content/900036111.pdf","checked_at":"2026-10-13"}]},"kmn-truth":{"id":"kmn-truth","name":"発言の真偽","type":"learn","goal":"うそが混じっている発言の組から、場合分けをして、条件に合う場合を見つけられる。","part_of":"koumuin","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。用語は辞書・事典と照合。指摘を反映した後に再検証。","text":"何人かの発言のうち、一部がうそであるとわかっている問題です。だれの発言が本当かは、すぐにはわかりません。そこで、「実際に起きたこと」か「うそをついている人」を一つ仮に決めて、それぞれの発言が本当かうそかを調べます。本当の発言の数（または、うその発言の数）が問題の条件と合えば、その場合はあり得ます。合わなければ、その場合はあり得ません。あり得る場合が一つだけ残れば、それが答えです。場合を全部調べることが大切で、一つ合う場合を見つけたところでやめてはいけません。","example":"手順1：実際に起きたことを、一つ仮に決める\n手順2：その場合に、それぞれの発言が本当かうそかを調べる\n手順3：本当の発言の数が、条件と合うかを見る\n手順4：ほかの場合についても、同じように調べる","note":"発言の中で人を指している言葉は、だれのことかを確かめてから調べます。"},"review":{"checked_at":"2026-10-14","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の到達点が範囲を超えて使っていないかを照合。学習時間は、SPIの検証済みの単元との釣り合いと予備校の記述(単元ごとの時間数は見つからず)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"spi-inference","level":"helps"}],"assessment":{"question":"A、B、Cのうち1人が窓ガラスを割りました。3人は次のように言いましたが、本当のことを言っているのは1人だけです。\nA「割ったのはBだ」\nB「割ったのはわたしではない」\nC「割ったのはわたしではない」\n窓ガラスを割ったのはだれでしょうか。","options":["A","B","C"],"answer":2,"explanation":"Cが割ったとすると、Aはうそ、Bは本当、Cはうそで、本当は1人だけになり条件に合います。Aが割ったとすると、BとCの2人が本当になります。Bが割ったとすると、AとCの2人が本当になります。どちらも条件に合いません。"},"practice":{"title":"場合を分けて、発言が本当かうそかを調べる","lead":"仮に決めて、条件と合うかを確かめる。全部の場合を調べる。本試験は五つの選択肢から一つを選ぶ形式で、人数はもっと多くなります。ここでは解き方を身につけるために、3人の問題で答えを直接答えます。","original":true,"reviewed_at":"2026-10-13","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。あり得る場合をすべて列挙して正答が一つに決まるかを確かめ、選択肢ごとに反例を試し、対応表を一欄ずつ条件と照合。前提の範囲、試験の形との差を確認。指摘を反映した後に再検証。","problems":[{"label":"起きたことで場合を分ける","question":"A、B、Cの3人のうち、1人だけがケーキを食べました。3人は次のように言いましたが、本当のことを言っているのは1人だけです。\nA「食べたのはCだ」\nB「わたしは食べていない」\nC「Aの言っていることはうそだ」\nケーキを食べたのはだれでしょうか。","answer":"B","alternatives":[{"try":"C（Aの発言をそのまま信じる）","why_not":"Cが食べたとすると、Aの発言とBの発言の二つが本当になり、「本当のことを言っているのは1人だけ」に合いません。"}],"steps":[{"title":"場合の分け方を決める","formula":"場合1：Aが食べた\n場合2：Bが食べた\n場合3：Cが食べた","body":"食べたのは1人だけなので、場合は三つです。それぞれの場合に、3人の発言が本当かうそかを調べます。"},{"title":"Aが食べた場合を調べる","formula":"A「食べたのはCだ」：うそ\nB「わたしは食べていない」：本当\nC「Aの言っていることはうそだ」：本当\n本当の発言：2人","body":"Aの発言がうそなので、「Aの言っていることはうそだ」というCの発言は本当になります。本当が2人なので、条件に合いません。"},{"title":"Bが食べた場合を調べる","formula":"A「食べたのはCだ」：うそ\nB「わたしは食べていない」：うそ\nC「Aの言っていることはうそだ」：本当\n本当の発言：1人","body":"本当が1人だけなので、条件に合います。"},{"title":"Cが食べた場合を調べる","formula":"A「食べたのはCだ」：本当\nB「わたしは食べていない」：本当\nC「Aの言っていることはうそだ」：うそ\n本当の発言：2人","body":"本当が2人なので、条件に合いません。"},{"title":"条件に合う場合を答える","formula":"条件に合う場合：Bが食べた場合だけ","body":"三つの場合をすべて調べて、条件に合うのは一つだけでした。食べたのはBです。"}]},{"label":"うそをついている人で場合を分ける","question":"A、B、Cの3人のうち、1人だけがうそつきで、ほかの2人は正直者です。うそつきの発言はうそで、正直者の発言は本当です。3人は次のように言いました。\nA「Bはうそつきだ」\nB「Cはうそつきではない」\nC「Bはうそつきではない」\nうそつきはだれでしょうか。","answer":"A","alternatives":[{"try":"B（Aの発言をそのまま信じる）","why_not":"Bがうそつきだとすると、Bの発言「Cはうそつきではない」はうそでなければなりません。しかし、うそつきは1人だけでCは正直者なので、この発言は本当になってしまいます。"}],"steps":[{"title":"場合の分け方を決める","formula":"場合1：Aがうそつき（BとCは正直者）\n場合2：Bがうそつき（AとCは正直者）\n場合3：Cがうそつき（AとBは正直者）","body":"うそつきは1人だけなので、場合は三つです。それぞれの場合に、うそつきの発言がうそに、正直者の発言が本当になっているかを調べます。"},{"title":"Aがうそつきの場合を調べる","formula":"A「Bはうそつきだ」：Bは正直者なので、うそ（Aはうそつき → 合う）\nB「Cはうそつきではない」：Cは正直者なので、本当（Bは正直者 → 合う）\nC「Bはうそつきではない」：Bは正直者なので、本当（Cは正直者 → 合う）","body":"3人とも、発言の本当・うそが、その人がうそつきか正直者かと合っています。この場合はあり得ます。"},{"title":"Bがうそつきの場合を調べる","formula":"B「Cはうそつきではない」：Cは正直者なので、本当（Bはうそつき → 合わない）","body":"うそつきのBが本当のことを言っていることになり、合いません。一つでも合わない発言があれば、その場合はあり得ません。"},{"title":"Cがうそつきの場合を調べる","formula":"A「Bはうそつきだ」：Bは正直者なので、うそ（Aは正直者 → 合わない）","body":"正直者のAがうそを言っていることになり、合いません。"},{"title":"条件に合う場合を答える","formula":"あり得る場合：Aがうそつきの場合だけ","body":"三つの場合をすべて調べて、あり得るのは一つだけでした。うそつきはAです。"}]},{"label":"札の正しさで場合を分ける","question":"赤、青、白の3つの箱のうち、1つにだけ当たりが入っています。箱にはそれぞれ次の札がついていて、正しいことが書かれている札は1つだけです。\n赤の箱の札「当たりはこの箱にある」\n青の箱の札「当たりはこの箱にはない」\n白の箱の札「当たりは赤の箱にはない」\n当たりが入っているのは、どの箱でしょうか。","answer":"青の箱","alternatives":[{"try":"赤の箱（赤の箱の札をそのまま信じる）","why_not":"当たりが赤の箱にあるとすると、赤の箱の札と青の箱の札の二つが正しくなり、「正しい札は1つだけ」に合いません。"}],"steps":[{"title":"場合の分け方を決める","formula":"場合1：当たりは赤の箱\n場合2：当たりは青の箱\n場合3：当たりは白の箱","body":"人の発言でなく札でも、調べ方は同じです。当たりの場所を仮に決めて、それぞれの札が正しいかどうかを調べます。"},{"title":"当たりが赤の箱の場合を調べる","formula":"赤の札「当たりはこの箱にある」：正しい\n青の札「当たりはこの箱にはない」：正しい\n白の札「当たりは赤の箱にはない」：正しくない\n正しい札：2つ","body":"正しい札が2つなので、条件に合いません。"},{"title":"当たりが青の箱の場合を調べる","formula":"赤の札「当たりはこの箱にある」：正しくない\n青の札「当たりはこの箱にはない」：正しくない\n白の札「当たりは赤の箱にはない」：正しい\n正しい札：1つ","body":"正しい札が1つだけなので、条件に合います。"},{"title":"当たりが白の箱の場合を調べる","formula":"赤の札「当たりはこの箱にある」：正しくない\n青の札「当たりはこの箱にはない」：正しい\n白の札「当たりは赤の箱にはない」：正しい\n正しい札：2つ","body":"正しい札が2つなので、条件に合いません。"},{"title":"条件に合う場合を答える","formula":"条件に合う場合：当たりが青の箱の場合だけ","body":"三つの場合をすべて調べて、条件に合うのは一つだけでした。当たりは青の箱に入っています。"}]}]}},"kounin-math":{"id":"kounin-math","name":"高卒認定の数学","type":"target","goal":"高卒認定試験の数学で、合格点を取れる。","part_of":"hs-math","status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"高等学校卒業程度認定試験（高卒認定試験）は、高校を卒業していない人などが、高校を卒業した人と同等以上の学力があるかどうかを認定する国の試験です。合格すると、大学入学資格（大学を受験する資格）が得られます。この試験に合格するには、数学だけでなく、各教科の必修の科目すべてに合格する必要があります。数学は必修の科目です。","example":"出題範囲：「数学Ⅰ」（令和4年4月以降に高校へ入学した人が使う教科書）\n試験時間：50分\n実施：年2回（8月と11月）","note":"出題範囲と試験時間は、文部科学省の案内で2026-10-07に確認しました。年度によって変わることがあります。受験の前に、最新の受験案内を確かめてください。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"hs-quadratic","level":"must"},{"id":"hs-trig","level":"must"},{"id":"hs-data","level":"must"}],"sources":[{"title":"文部科学省：高等学校卒業程度認定試験 試験科目・合格要件・出題範囲","url":"https://www.mext.go.jp/a_menu/koutou/shiken/01339.html","checked_at":"2026-10-07"},{"title":"文部科学省：高等学校卒業程度認定試験 時間割","url":"https://www.mext.go.jp/a_menu/koutou/shiken/01339_00003.html","checked_at":"2026-10-07"}]},"math-addsub":{"id":"math-addsub","name":"たし算ひき算","type":"learn","goal":"2けたのたし算とひき算を、暗算か筆算でできる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":1,"check":"48 + 37 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たし算は二つの数を合わせた数を求める計算、ひき算は一方からもう一方を取り除いた残りや、二つの数の差を求める計算です。2けたの数では、十の位と一の位に分けて考えます。一の位どうしを足して10以上になったら十の位に1くり上げ、一の位どうしで引けないときは十の位から1くり下げます。","example":"35 + 49 = 84\n84 − 49 = 35","note":"たし算の答えから足した数を引くと、もとの数に戻ります。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"46 + 27 は？","options":["63","73","83"],"answer":1,"explanation":"40 + 20 と 6 + 7 に分けると、60 + 13 = 73。"},"practice":{"title":"位ごとに分けて、たし算とひき算をする","lead":"くり上がりとくり下がりを、一つずつ確かめる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"くり上がりのあるたし算","question":"58 + 27 を計算してください。","answer":"85","steps":[{"title":"二つの数を、十の位と一の位に分ける","formula":"58 = 50 + 8\n27 = 20 + 7","body":"2けたの数は、十がいくつ、一がいくつ、に分けて考えます。"},{"title":"一の位どうしを足す","formula":"8 + 7 = 15","body":"答えが10以上になりました。15は、十が1つと一が5つです。この十1つを十の位に送ることを、くり上がりといいます。"},{"title":"十の位どうしを足す","formula":"50 + 20 = 70","body":"十が5つと2つで、十が7つです。"},{"title":"二つの答えを合わせる","formula":"70 + 15 = 85","body":"十の位の70に、一の位の答え15を足します。くり上がった十1つが加わり、十の位は8になります。"},{"title":"ひき算で、もとの数に戻るか確かめる","formula":"85 − 27 = 58","body":"答えから足した数を引くと、もとの58に戻ります。"}]},{"label":"くり下がりのあるひき算","question":"73 − 48 を計算してください。","answer":"25","steps":[{"title":"一の位どうしで引けるか調べる","formula":"73 の一の位：3\n48 の一の位：8","body":"3から8は引けません。十の位から十を1つくり下げます（借ります）。これをくり下がりといいます。"},{"title":"73を、60と13に分け直す","formula":"73 = 60 + 13","body":"十7つのうち1つを一の位に回すと、十が6つと、一が13になります。"},{"title":"一の位を引く","formula":"13 − 8 = 5","body":"借りてきた十と合わせた13から、8を引きます。"},{"title":"十の位を引く","formula":"60 − 40 = 20","body":"十を1つ貸したので、70ではなく60から引きます。"},{"title":"二つの答えを合わせる","formula":"20 + 5 = 25","body":"十の位の20と、一の位の5を合わせます。"},{"title":"たし算で、もとの数に戻るか確かめる","formula":"25 + 48 = 73","body":"答えに引いた数を足すと、もとの73に戻ります。"}]},{"label":"減ってから増える場面","question":"図書室の棚に、本が64冊ありました。28冊が借りられ、そのあと19冊が返ってきて、棚に戻されました。棚の本は、いま何冊でしょうか。","answer":"55冊","steps":[{"title":"起きたことを、順に置く","formula":"はじめ：64冊\n借りられた：28冊（減る）\n返ってきた：19冊（増える）","body":"減るときはひき算、増えるときはたし算です。起きた順に計算します。"},{"title":"借りられたあとの冊数を求める","formula":"64 − 28 = 36","body":"一の位の4から8は引けないので、くり下げて 14 − 8 = 6、十の位は 50 − 20 = 30 です。"},{"title":"返ってきたあとの冊数を求める","formula":"36 + 19 = 55","body":"一の位は 6 + 9 = 15 でくり上がり、十の位は 30 + 10 に十1つを足して50です。"},{"title":"別の考え方で確かめる","formula":"28 − 19 = 9\n64 − 9 = 55","body":"28冊減って19冊増えたので、合わせると9冊減ったことになります。はじめの64冊から9冊を引いても、同じ55冊です。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-angle":{"id":"math-angle","name":"角度と三角形","type":"learn","goal":"分度器で角度を測り、三角形の角の和を使える。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"角度は、一つの点から出る二本の直線の開き具合を表す量で、単位は度（°）です。一回転が360°、一直線が180°、直角が90°です。分度器の中心を角の頂点に合わせ、一方の辺を0°の線に重ねると、もう一方の辺が指す目盛りが角度になります。どんな三角形でも、三つの角を足すと180°になります。","example":"三角形の三つの角：60° + 70° + 50° = 180°\n残りの角を求める：180° − 60° − 70° = 50°","note":"二つの角がわかれば、残りの角は計算で求められます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-shapes","level":"must"}]},"math-area":{"id":"math-area","name":"面積と体積","type":"learn","goal":"基本の図形の面積と、直方体の体積を求められる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"面積は平らな形の広さを表す量で、1辺が1cmの正方形がいくつ分かで数え、単位はcm²です。体積は立体のかさを表す量で、1辺が1cmの立方体がいくつ分かで数え、単位はcm³です。長方形の面積は「たて × 横」、三角形の面積は「底辺 × 高さ ÷ 2」、直方体の体積は「たて × 横 × 高さ」で求めます。","example":"長方形（たて4cm、横6cm）の面積：4 × 6 = 24\n三角形（底辺6cm、高さ4cm）の面積：6 × 4 ÷ 2 = 12\n直方体（たて4cm、横6cm、高さ5cm）の体積：4 × 6 × 5 = 120","note":"面積の単位はcm²、体積の単位はcm³です。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-muldiv","level":"must"},{"id":"math-shapes","level":"must"}]},"math-average":{"id":"math-average","name":"平均とデータ","type":"learn","goal":"平均値と中央値を求め、範囲で散らばりの大きさを比べられる。","part_of":"math-school","tags":["sansu","data"],"also_tags":["jhmath"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"平均値は、データの値をすべて足して個数で割った値で、全体をならしたときの大きさを表します。中央値は、データを小さい順に並べたときに真ん中にくる値です。データが偶数個のときは、真ん中の二つの値の平均を中央値とします。極端に大きい値や小さい値があると平均値は大きく動きますが、中央値はあまり動きません。最大の値と最小の値の差（範囲）を見ると、散らばりの大きさがわかります。","example":"データ：2、3、4、5、16\n平均値：(2 + 3 + 4 + 5 + 16) ÷ 5 = 6\n中央値：4\n範囲：16 − 2 = 14","note":"16という大きな値があるため、平均値の6は中央値の4より大きくなっています。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。確認問題を足した後に再検証。学習時間は同じまとまりの単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-table","level":"related"}],"assessment":{"question":"データ 2、5、6、11 の中央値は？","options":["5","5.5","6"],"answer":1,"explanation":"4個なので、真ん中の2つ（5と6）の平均をとって5.5。6は平均値（24 ÷ 4）で、真ん中の2つのうち大きいほうでもある。5は真ん中の2つのうち片方だけを見ている。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と図表だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の読み方を実際に試して確認。選択肢・別解ごとの理由、全段階の計算、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","title":"合計を使って平均を求め、中央値・範囲とくらべる","lead":"平均がわかれば、平均 × 個数で合計がわかる。","original":true,"problems":[{"label":"目標の平均から、次に必要な点数を逆算する","question":"Aさんは、これまでに受けた4回のテストの平均点が72点でした。5回目のテストで何点をとれば、5回の平均点がちょうど75点になるでしょうか。","answer":"87点","alternatives":[{"try":"78点","why_not":"平均の差 75 − 72 = 3 を、75に一度だけ足している。4回それぞれが3点ずつ足りないので、足りない点は 3 × 4 = 12 点で、75 + 12 = 87 になる。"},{"try":"73.5点","why_not":"72と75の真ん中をとっている。平均は、点数どうしの真ん中ではなく、合計 ÷ 回数。"}],"steps":[{"title":"これまでの4回の合計を求める","formula":"72 × 4 = 288","body":"平均 = 合計 ÷ 回数 なので、合計 = 平均 × 回数 です。4回の合計は288点です。"},{"title":"目標とする5回の合計を求める","formula":"75 × 5 = 375","body":"5回の平均を75点にするには、5回の合計が375点になればよいことになります。"},{"title":"差が、5回目に必要な点数になる","formula":"375 − 288 = 87","body":"5回の合計から、4回の合計を引いた残りが、5回目の点数です。"},{"title":"足りない分から考えて、確かめる","formula":"(75 − 72) × 4 = 12\n75 + 12 = 87","body":"4回とも、目標の75点に3点ずつ足りません。5回目で、75点に加えてその12点を取り返せば、全体がならされて75点になります。"}]},{"label":"基準との差を使って、平均を求める（仮平均）","question":"5人の身長は、152cm、158cm、147cm、161cm、157cm です。145cm を基準にして、それぞれの身長と145cmとの差を使い、5人の身長の平均を求めてください。","answer":"155cm","alternatives":[{"try":"10cm","why_not":"差の平均だけを答えている。これは、平均が基準の145cmより何cm高いかを表す数なので、145に足す。"},{"try":"195cm","why_not":"差の合計50を、そのまま基準に足している。差も5人分の合計なので、5でわって平均にしてから足す。"}],"steps":[{"title":"それぞれの身長と、基準との差を求める","formula":"152 − 145 = 7\n158 − 145 = 13\n147 − 145 = 2\n161 − 145 = 16\n157 − 145 = 12","body":"基準をどの身長よりも低い145cmにしたので、差はすべて「基準より何cm高いか」になります。"},{"title":"差の平均を求める","formula":"7 + 13 + 2 + 16 + 12 = 50\n50 ÷ 5 = 10","body":"大きな数を5つ足すかわりに、小さな差を足すだけですみます。"},{"title":"基準に、差の平均を足す","formula":"145 + 10 = 155","body":"5人とも、145cmに差を足した身長です。全員の145cmの部分はそのままで、差の部分だけをならすので、平均は基準より10cm高くなります。"},{"title":"合計 ÷ 人数で確かめる","formula":"152 + 158 + 147 + 161 + 157 = 775\n775 ÷ 5 = 155","body":"ふつうに合計してわっても、同じ値になります。"}]},{"label":"二つの組を合わせた平均を求める","question":"ある学年の1組と2組で、同じ小テストをしました。1組の20人の平均点は64点、2組の30人の平均点は69点でした。1組と2組の50人全体の平均点は何点でしょうか。","answer":"67点","alternatives":[{"try":"66.5点","why_not":"二つの平均点を、そのまま足して2でわっている。人数が違うので、人数の多い2組のほうが、全体の平均に強くきいてくる。それぞれの合計を出して、全体の人数でわる。"}],"steps":[{"title":"組ごとの合計点を求める","formula":"1組：64 × 20 = 1280\n2組：69 × 30 = 2070","body":"合計 = 平均 × 人数 です。"},{"title":"全体の合計を、全体の人数でわる","formula":"1280 + 2070 = 3350\n3350 ÷ 50 = 67","body":"全体の人数は 20 + 30 = 50 人です。"},{"title":"人数の多い組に近くなっていることを確かめる","formula":"67 − 64 = 3\n69 − 67 = 2","body":"全体の平均は、人数の多い2組の69点のほうに寄っています。人数が同じなら、ちょうど真ん中の66.5点になるところです。"}]},{"label":"平均値・中央値・範囲を求める","question":"8人に、先月読んだ本の冊数を聞くと、3、0、5、2、12、4、1、5（冊）でした。平均値、中央値、範囲をそれぞれ求めてください。","answer":"平均値は4冊、中央値は3.5冊、範囲は12冊","alternatives":[{"try":"平均値は約4.6冊","why_not":"0冊の人を数えずに 32 ÷ 7 としている。0冊も1人分のデータなので、8でわる。"},{"try":"中央値は7冊","why_not":"小さい順に並べずに、聞いた順の真ん中の2つ（2と12）の平均をとっている。中央値は、小さい順に並べてから真ん中を見る。"},{"try":"中央値は3冊、または4冊","why_not":"データが8個（偶数個）なので、真ん中の値は1つに決まらない。4番目の3と5番目の4の平均をとって3.5にする。"}],"steps":[{"title":"平均値を求める","formula":"3 + 0 + 5 + 2 + 12 + 4 + 1 + 5 = 32\n32 ÷ 8 = 4","body":"0冊の人も1人として数えるので、わる数は8です。"},{"title":"小さい順に並べる","formula":"0、1、2、3、4、5、5、12","body":"並べたあと、個数が8個のままかを数えて確かめます。"},{"title":"真ん中の2つの値の平均をとる","formula":"4番目：3　5番目：4\n(3 + 4) ÷ 2 = 3.5","body":"8個のデータでは、真ん中は4番目と5番目の間です。その2つの値の平均が中央値です。"},{"title":"範囲を求める","formula":"12 − 0 = 12","body":"範囲は、最大の値から最小の値を引いたものです。"},{"title":"平均値と中央値を比べる","formula":"平均値 4 ＞ 中央値 3.5","body":"12冊という大きな値に引っぱられて、平均値は中央値より大きくなっています。8人のうち平均値の4冊より多く読んだのは3人だけで、ふつうの人の冊数を表すには、中央値のほうが向いています。"}]}]}},"math-circle":{"id":"math-circle","name":"円と円周率","type":"learn","goal":"円周の長さと円の面積を求められる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"円は、中心から同じ距離にある点が集まってできる形です。中心から円周までの長さを半径、中心を通って円周から円周までの長さを直径といい、直径は半径の2倍です。円周の長さは直径の約3.14倍で、この倍率を円周率といいます。円周は「直径 × 3.14」、面積は「半径 × 半径 × 3.14」で求めます。","example":"半径5cmの円の直径：5 × 2 = 10\n半径5cmの円の円周：10 × 3.14 = 31.4\n半径5cmの円の面積：5 × 5 × 3.14 = 78.5","note":"円周率は、中学からは文字 π（パイ）で表します。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-area","level":"must"}]},"math-congruence":{"id":"math-congruence","name":"合同と証明","type":"learn","goal":"三角形の合同条件を使って、証明を書ける。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの図形が、形も大きさも同じでぴったり重なるとき、合同であるといい、記号 ≡ で表します。三角形は、次のどれか一つが成り立てば合同だと言えます。三組の辺がそれぞれ等しい。二組の辺とその間の角がそれぞれ等しい。一組の辺とその両端の角がそれぞれ等しい。証明とは、わかっていること（仮定）から出発し、すでに正しいと認められたことだけを根拠にして、示したいこと（結論）を筋道立てて説明することです。","example":"仮定：AB = DE、BC = EF、∠B = ∠E\n根拠：二組の辺とその間の角がそれぞれ等しい\n結論：△ABC ≡ △DEF","note":"合同な図形では、対応する辺の長さと角の大きさがすべて等しくなります。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-angle","level":"must"}]},"math-fraction":{"id":"math-fraction","name":"小数と分数","type":"learn","goal":"小数と分数の四則計算ができ、互いに変換できる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":3,"check":"2/3 ÷ 4/5 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"小数と分数は、どちらも1より小さい量や、整数と整数の間の量を表す数です。小数は0.1や0.01のように位を10分の1ずつ細かくして表します。分数は、全体をいくつかに等しく分けたうちの何個分かを「分子/分母」の形で表します。同じ量を小数でも分数でも書けるので、計算しやすい方に直して使います。","example":"1/2 = 0.5\n3/4 = 0.75\n1/2 + 1/4 = 2/4 + 1/4 = 3/4\n0.5 × 0.6 = 0.3","note":"分数どうしを足すときは、分母をそろえます。"},"cost":{"hours":40,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"2/3 ÷ 4/5 は？","options":["8/15","6/5","5/6"],"answer":2,"explanation":"割る数の逆数を掛ける。2/3 × 5/4 = 10/12 = 5/6。"},"practice":{"title":"分数と小数を、計算しやすい形に直して計算する","lead":"分母をそろえる、逆数をかける、形をそろえる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"分母の違う分数のたし算","question":"2/3 + 1/4 を計算してください。","answer":"11/12","steps":[{"title":"分母を見て、そのまま足せるか調べる","formula":"2/3 の分母：3\n1/4 の分母：4","body":"分母が違うと、1個分の大きさが違うので、分子どうしをそのまま足せません。分母をそろえます（通分）。"},{"title":"そろえる分母を決める","formula":"3 × 4 = 12","body":"3でも4でも割り切れる数を小さい順に探すと、12が最初に見つかります。これを分母にします。今回は 3 × 4 と同じですが、分母どうしの積がいつもいちばん小さいとは限りません（分母が4と6なら、24ではなく12です）。"},{"title":"それぞれを、分母が12の分数に直す","formula":"2/3 = 8/12\n1/4 = 3/12","body":"分母と分子に同じ数をかけても、分数の大きさは変わりません。2/3 は分母と分子に4を、1/4 は3をかけます。"},{"title":"分子どうしを足す","formula":"8/12 + 3/12 = 11/12","body":"分母はそのままで、分子だけを足します。11と12の両方を割り切る数は1しかないので、これ以上約分（分母と分子を同じ数で割って簡単にすること）はできません。"},{"title":"ひき算で、もとの数に戻るか確かめる","formula":"11/12 − 3/12 = 8/12\n8/12 = 2/3","body":"答えから 1/4（= 3/12）を引くと、もとの 2/3 に戻ります。"}]},{"label":"分数のわり算","question":"3/4 ÷ 5/8 を計算してください。","answer":"6/5（1と1/5。小数では1.2）","steps":[{"title":"割る数の逆数を作る","formula":"割る数：5/8\n逆数：8/5","body":"逆数は、分母と分子を入れかえた数です。分数で割ることは、その逆数をかけることと同じです。"},{"title":"わり算を、かけ算に直す","formula":"(3/4) ÷ (5/8) = 3/4 × 8/5","body":"割られる数の 3/4 はそのままにして、割る数だけを逆数に変えます。"},{"title":"分子どうし、分母どうしをかける","formula":"3 × 8 = 24\n4 × 5 = 20\n3/4 × 8/5 = 24/20","body":"分数のかけ算は、分子どうし、分母どうしをかけます。"},{"title":"約分して、ほかの表し方も確かめる","formula":"24/20 = 6/5\n6 ÷ 5 = 1.2","body":"分母と分子を、どちらも4で割ります。6/5 は1より大きい分数で、1と1/5とも書けます。分子を分母で割って小数に直すと、1.2です。"},{"title":"割る数をかけて、もとの数に戻るか確かめる","formula":"6/5 × 5/8 =
