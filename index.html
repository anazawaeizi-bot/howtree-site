人の年齢について何も述べていません。本文に書かれていないことは、趣旨になりません。"},{"key":"B","text":"本文に書かれているが、最も言いたいことではない","correct":false,"reason":"本文のどの文にも、年齢と使いこなす早さの関係は書かれていません。"},{"key":"C","text":"本文と関係ないことを述べている","correct":true,"reason":"新しい道具という話題は同じですが、年齢による違いは本文にありません。"}],"steps":[{"title":"設問の文の、言いきっている部分をつかむ","formula":"何が：使う人の年齢\nどうなる：若いほど早く使いこなせる","body":"話題は本文と同じ「新しい道具」ですが、比べているのは年齢です。"},{"title":"本文に同じ内容があるかを探す","formula":"本文に出てくる人：多くの人、使い始めた人、説明会の参加者、質問を受ける係\n年齢についての文：なし","body":"本文に出てくる人の分け方に、年齢はありません。"},{"title":"判定する","formula":"本文に書かれている：いいえ\n判定：C","body":"常識として正しそうに思えても、本文に書かれていなければ C です。"}]}]}},"tama-logic":{"id":"tama-logic","name":"論理的読解","type":"learn","goal":"本文を読み、設問の文が本文から明らかに正しいか、明らかに誤りか、本文だけでは判断できないかを判定できる。","part_of":"tamatebako","tags":["kokugo","reading"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"論理的読解は、本文を読んで、設問の文を三つに分ける問題です。玉手箱の言語の形式の一つで、GAB形式とも呼ばれます。適性検査GABの言語も、同じ形です。A は、本文から論理的に考えて明らかに正しいもの。B は、本文から論理的に考えて明らかに誤っているもの。C は、本文を読んだだけでは正しいか誤っているか判断できないものです。判断の根拠は本文だけで、世間の常識や自分の知識は使いません。本文に直接書かれていなくても、本文の文を組み合わせて必ず言えることは A、本文と両立しない（本文と同時には成り立たない）ことは B です。本文に関係する話題でも、本文から正誤が決まらなければ C です。","example":"本文：この図書館は、月曜日を休館日としている。\n設問「この図書館は、月曜日には開いていない」→ A（本文の言いかえ）\n設問「この図書館は、毎日開いている」→ B（月曜日の休館と両立しない）\n設問「この図書館は、日曜日に混雑する」→ C（本文からは決まらない）","note":"設問の一部でも本文と両立しなければ、ほかの部分が正しくても B です。C を選ぶのは、本文が何も決めていないときだけです。常識では正しそうでも、本文が決めていなければ C、常識では意外でも、本文から必ず言えるなら A です。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。指示語と接続語の読み取りは説明文の読解に収まる。A・B・C の判定の決まりはこの単元で説明している。推論の「必ず言える／言えるとは限らない」は、あると楽。学習時間は、単元どうしの釣り合いと外部の目安との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"jp-reading","level":"must"},{"id":"spi-inference","level":"helps"}],"assessment":{"question":"本文「この店は、毎週水曜日を定休日としている。」設問「この店は、木曜日も休みだ。」の判定は？（A：明らかに正しい／B：明らかに誤り／C：本文だけでは判断できない）","options":["A","B","C"],"answer":2,"explanation":"本文は水曜日が定休日だとしか言っていない。木曜日が休みかどうかは、臨時の休みもありうるので本文からは決まらず、C。A とするには本文に木曜日の休みが書かれている必要があり、B とするには「水曜日以外は営業する」と書かれている必要がある。"},"practice":{"title":"本文だけを根拠に、A・B・C を判定する","lead":"設問の文の根拠になる本文の文を探し、見つからなければ C を考える。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の判定・別の選択肢を実際に試して確認。選択肢ごとの理由、全段階の説明、語釈（デジタル大辞泉）、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","passage":"会議の記録を残す方法は、大きく二つに分けられる。発言をできるだけそのまま書き取る方法と、決まったことと次にやることだけを書く方法である。前者は、後から議論の流れをたどれるが、書く人の負担が大きく、読む人も必要な箇所を探しにくい。後者は短く読みやすいが、なぜその結論になったのかが残らない。ある会社では、記録を後者の形に改めたところ、会議のあとに記録が配られるまでの時間が短くなった。一方で、形を改めてから半年後に同じ議題が持ち上がったとき、以前の結論の理由をだれも説明できず、議論をやり直すことになった。この会社はその後、決まったことと次にやることに加えて、結論の理由を一、二行で書く欄を設けた。記録の形は、読む人がいつ、何のために読むかによって選ぶべきだろう。","problems":[{"label":"本文の言いかえを見分ける","question":"設問「発言をそのまま書き取る形の記録を読めば、後から議論の流れをたどることができる。」は、A・B・C のどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"本文から論理的に考えて、明らかに正しい","correct":true,"reason":"本文の「前者は、後から議論の流れをたどれる」の言いかえです。前者は、発言をできるだけそのまま書き取る方法を指します。"},{"key":"B","text":"本文から論理的に考えて、明らかに誤っている","correct":false,"reason":"本文には、設問と両立しない文はありません。設問と同じ内容が、本文にそのまま書かれています。"},{"key":"C","text":"本文だけでは、正しいか誤っているか判断できない","correct":false,"reason":"本文に、設問と同じ内容の文があります。根拠の文が見つかるので、C ではありません。"}],"steps":[{"title":"設問の文の、言いきっている部分をつかむ","formula":"だれが：発言をそのまま書き取る形の記録を読む人\n何ができる：後から議論の流れをたどる","body":"設問の文が何を言いきっているかを、短く分けておきます。"},{"title":"本文で同じことを述べている文を探す","formula":"本文：発言をできるだけそのまま書き取る方法（前者）\n本文：前者は、後から議論の流れをたどれる","body":"「前者」が何を指すかを、直前の文で確かめます。発言をそのまま書き取る方法です。"},{"title":"設問と本文を照らし合わせて判定する","formula":"設問：後から議論の流れをたどることができる\n本文：後から議論の流れをたどれる\n判定：A","body":"設問は本文の言いかえで、言いすぎている部分もありません。A です。"}]},{"label":"本文に書かれていない結果を見分ける","question":"設問「記録の形を改めた会社では、会議そのものにかかる時間も短くなった。」は、A・B・C のどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"本文から論理的に考えて、明らかに正しい","correct":false,"reason":"本文で短くなったと書かれているのは、記録が配られるまでの時間です。会議そのものの時間ではありません。"},{"key":"B","text":"本文から論理的に考えて、明らかに誤っている","correct":false,"reason":"本文には、会議の時間が短くならなかった、長くなったという文もありません。誤りと決める根拠がありません。"},{"key":"C","text":"本文だけでは、正しいか誤っているか判断できない","correct":true,"reason":"会議そのものにかかる時間については、本文は何も述べていません。正しいとも誤りとも決まりません。"}],"steps":[{"title":"設問の文の、言いきっている部分をつかむ","formula":"どこで：記録の形を改めた会社\n何が：会議そのものにかかる時間\nどうなった：短くなった","body":"「会議そのもの」という言葉に印を付けておきます。"},{"title":"本文で、短くなったと書かれているものを確かめる","formula":"本文：会議のあとに記録が配られるまでの時間が短くなった","body":"短くなったのは、記録が配られるまでの時間です。設問の「会議そのものにかかる時間」とは別のものです。"},{"title":"反対の内容が書かれていないかも確かめる","formula":"会議の時間が短くなった：本文になし\n会議の時間が変わらない、長くなった：本文になし\n判定：C","body":"どちらの向きの文もないので、本文からは正誤が決まりません。言葉が似ている文に引っぱられて A にしないことが大切です。"}]},{"label":"本文と両立しない文を見分ける","question":"設問「決まったことと次にやることだけを書く形の記録にも、結論に至った理由は残る。」は、A・B・C のどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"本文から論理的に考えて、明らかに正しい","correct":false,"reason":"本文は、この形の記録には、なぜその結論になったのかが残らないと述べています。設問はその反対です。"},{"key":"B","text":"本文から論理的に考えて、明らかに誤っている","correct":true,"reason":"本文の「後者は……なぜその結論になったのかが残らない」と両立しません。"},{"key":"C","text":"本文だけでは、正しいか誤っているか判断できない","correct":false,"reason":"理由が残るかどうかを、本文ははっきり述べています。判断の根拠があるので C ではありません。"}],"steps":[{"title":"設問が指す記録の形を、本文の言葉に置きかえる","formula":"設問：決まったことと次にやることだけを書く形\n本文：後者","body":"本文の「後者」は、決まったことと次にやることだけを書く方法です。"},{"title":"後者について本文が述べていることを集める","formula":"本文：後者は短く読みやすい\n本文：なぜその結論になったのかが残らない","body":"結論の理由については、「残らない」とはっきり書かれています。"},{"title":"設問と本文を照らし合わせて判定する","formula":"設問：結論に至った理由は残る\n本文：なぜその結論になったのかが残らない\n判定：B","body":"設問は本文と反対のことを言っているので、両方が正しいことはありえません。B です。"}]},{"label":"本文の文を組み合わせて判断する","question":"設問「この会社が、記録に結論の理由を書く欄を設けたのは、記録の形を改めてから半年以上たってからである。」は、A・B・C のどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"本文から論理的に考えて、明らかに正しい","correct":true,"reason":"記録の形を改めたあと、半年後に議論のやり直しがあり、欄を設けたのは「その後」です。二つの文を合わせると、半年以上たってからと言えます。"},{"key":"B","text":"本文から論理的に考えて、明らかに誤っている","correct":false,"reason":"本文に、半年より前に欄を設けたと読める文はありません。設問と両立しない文がないので B ではありません。"},{"key":"C","text":"本文だけでは、正しいか誤っているか判断できない","correct":false,"reason":"「半年以上」という言葉は本文にありませんが、本文の時間の順序から必ず言えます。直接書かれていないことは、すぐに C とはかぎりません。"}],"steps":[{"title":"本文の出来事を、起きた順に並べる","formula":"1　記録を、決まったことと次にやることだけの形に改めた\n2　形を改めてから半年後に同じ議題が持ち上がり、議論をやり直した\n3　その後、結論の理由を書く欄を設けた","body":"「形を改めてから半年後に」と「その後」が、出来事の順序を決める言葉です。"},{"title":"設問の時期と、並べた順序を比べる","formula":"形を改めた時点から、2 までに半年\n3 は 2 より後\n3 は、形を改めてから半年以上たってから","body":"3 は 2 より後なので、形を改めてから少なくとも半年はたっています。"},{"title":"判定する","formula":"設問：半年以上たってから欄を設けた\n本文の順序から必ず言える\n判定：A","body":"本文にそのままの言葉はなくても、本文の文を組み合わせて必ず言えることは A です。"}]}]}},"tama-reverse":{"id":"tama-reverse","name":"四則逆算","type":"learn","goal":"□を含む四則の式で、計算の逆をたどって□に入る数を求められる。","part_of":"tamatebako","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"四則逆算は、式の中の□に入る数を求める問題です。玉手箱の計数の形式の一つで、短い時間にたくさんの式が出ます。□を求めるには、□にされた計算を逆にたどります。足されたなら引き、引かれたなら足し、かけられたなら割り、割られたならかけます。ただし、□が引く数や割る数のときは、逆にたどる計算が変わります。等号の反対側に計算が残っているときは、先にそちらを一つの数にします。□がかっこの中にあるときは、かっこ全体を一つの数と見て、外側の計算から逆にたどります。","example":"□ + a = b　→　□ = b − a\n□ − a = b　→　□ = b + a\na − □ = b　→　□ = a − b\n□ × a = b　→　□ = b ÷ a\n□ ÷ a = b　→　□ = b × a\na ÷ □ = b　→　□ = a ÷ b","note":"a と b は、問題に出てくる数を表します。下の二つの行（□が引く数、割る数のとき）は、上の行と形が違うので気をつけます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは小数と分数の四則で、小数と分数に収まる。□が引く数・割る数のときの逆算と、かっこを一つの数と見る考え方は、この単元で説明している。学習時間は、単元どうしの釣り合いと外部の目安（玉手箱の対策全体で30〜50時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-linear-eq","level":"helps"}],"assessment":{"question":"□ × 4 = 30 のとき、□に入る数は？","options":["7.5","120","26"],"answer":0,"explanation":"□は4をかけられているので、30を4で割って7.5。120は30に4をかけた数、26は30から4を引いた数で、逆にたどる計算を取り違えている。"},"practice":{"title":"□にされた計算を、逆にたどる","lead":"□が何をされたかを先に言葉にしてから、逆の計算をする。試験は選択式で電卓を使えるとされるが、どの計算をするかは自分で決める。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","problems":[{"label":"引かれた□を求める","question":"□ − 37.6 = 82.4 のとき、□に入る数を求めましょう。","answer":"120","steps":[{"title":"□が何をされたかを言葉にする","formula":"□ − 37.6 = 82.4\n□から37.6を引くと、82.4になる","body":"□は、37.6を引かれる数です。引かれる前の数を求めればよいことになります。"},{"title":"引かれた数を足して戻す","formula":"□ = 82.4 + 37.6\n82.4 + 37.6 = 120","body":"引き算の逆は足し算です。引いた37.6を足すと、引かれる前の数に戻ります。"},{"title":"もとの式に戻して確かめる","formula":"120 − 37.6 = 82.4","body":"□に120を入れると、等号の右側と同じ82.4になります。"}],"alternatives":[{"try":"82.4 − 37.6 = 44.8","why_not":"引き算の逆を、さらに引き算にしてしまっています。44.8から37.6を引くと7.2で、82.4になりません。"}]},{"label":"□が割る数のとき","question":"54 ÷ □ = 0.6 + 0.3 のとき、□に入る数は次のうちどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"6","correct":false,"reason":"0.6 + 0.3 の答えを、小数点を落として9とし、54 ÷ 9 を計算した数です。0.6 + 0.3 は0.9です。"},{"key":"B","text":"48.6","correct":false,"reason":"54に0.9をかけた数です。□は割る数なので、かけて戻すのではありません。54 ÷ 48.6 は約1.11で、0.9になりません。"},{"key":"C","text":"60","correct":true,"reason":"54を0.9で割った数です。54 ÷ 60 = 0.9 で、右側の 0.6 + 0.3 と同じになります。"},{"key":"D","text":"90","correct":false,"reason":"54 ÷ 0.6 で、右側の0.3を足す前に割ってしまった数です。54 ÷ 90 = 0.6 で、0.9になりません。"},{"key":"E","text":"約0.017","correct":false,"reason":"0.9を54で割った数です。割る数と割られる数を逆にしています。54をこの数で割ると約3,200で、0.9になりません。"}],"steps":[{"title":"右側の計算を、先に一つの数にする","formula":"0.6 + 0.3 = 0.9\n54 ÷ □ = 0.9","body":"等号の右側に計算が残っているので、先に計算して一つの数にします。"},{"title":"□が何をしているかを言葉にする","formula":"54を□で割ると、0.9になる","body":"□は割られる数ではなく、割る数です。「□ ÷ a = b」の形とは違うので、かけて戻すことはできません。"},{"title":"割る数を求める式に直す","formula":"□ = 54 ÷ 0.9\n54 ÷ 0.9 = 60","body":"54を□で割って0.9になるなら、□は54を0.9で割った数です。6を3で割ると2なら、6を2で割ると3になるのと同じ関係です。"},{"title":"もとの式に戻して確かめる","formula":"54 ÷ 60 = 0.9","body":"右側の 0.6 + 0.3 = 0.9 と同じになります。選択肢では、Cの60です。"}]},{"label":"かっこと分数をふくむ式","question":"(□ + 7) × 3/4 = 12 のとき、□に入る数は次のうちどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"2","correct":false,"reason":"12に3/4をかけて9とし、7を引いた数です。かけられた3/4は、割って戻します。"},{"key":"B","text":"9","correct":true,"reason":"12を3/4で割ると16で、16から7を引いて9です。(9 + 7) × 3/4 = 12 になります。"},{"key":"C","text":"16","correct":false,"reason":"□ + 7 の値です。最後に7を引くのを忘れています。"},{"key":"D","text":"23","correct":false,"reason":"16に7を足した数です。□には7が足されていたので、戻すときは引きます。"},{"key":"E","text":"41","correct":false,"reason":"12に4をかけて48とし、3で割るのを忘れたまま7を引いた数です。12 ÷ (3/4) は、4をかけて3で割ります。"}],"steps":[{"title":"かっこ全体を一つのまとまりと見る","formula":"(□ + 7) × 3/4 = 12\nまとまり × 3/4 = 12","body":"かっこの中を先に求めることにします。まとまりは、3/4をかけられて12になりました。"},{"title":"かけられた3/4を、割って戻す","formula":"まとまり = 12 ÷ (3/4)\n12 ÷ (3/4) = 12 × 4 ÷ 3\n12 × 4 ÷ 3 = 16","body":"分数で割ることは、分母と分子を入れかえた数をかけることと同じです。12に4/3をかけて16です。"},{"title":"かっこの中で、足された7を引いて戻す","formula":"□ + 7 = 16\n□ = 16 − 7\n16 − 7 = 9","body":"まとまりの中では、□に7が足されています。足し算の逆なので、7を引きます。"},{"title":"もとの式に戻して確かめる","formula":"9 + 7 = 16\n16 × 3 ÷ 4 = 12","body":"□に9を入れると、等号の右側と同じ12になります。選択肢では、Bの9です。"}]}]}},"tamatebako":{"id":"tamatebako","name":"玉手箱","type":"target","goal":"受検する玉手箱の計数と言語の形式を学び、形式に合う問題集で時間を計った演習を始める。","part_of":"tamatebako","status":"draft","featured":true,"scope_note":"計数、言語、英語の代表的な形式への学習経路です。近年は出題が少ないとされる言語の「趣旨把握」は未収録です。英語の単元は、高校までに学ぶ単語と文法を身につけた人を前提にしています。この木の図表の読み取りは、表と、棒グラフ・折れ線グラフ・円グラフ・帯グラフの問題を扱います。玉手箱は、計数と言語のそれぞれで、どの形式が出るかを企業が決めます。受検する形式がわからないときは、計数も言語もすべての形式を学んでおくのが安全です。問題数と制限時間は、公式の資料ではなく、就職情報サイトの記述によります。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"科目、形式、答え方、問題数、電卓の扱いを、就職情報サイトの記述と照合（公式の資料は取得できなかった）。指摘を反映した後に再検証。","text":"玉手箱は、日本エス・エイチ・エルの適性検査で、企業の採用選考で自宅のパソコンから受けるWebテストとして使われています。能力検査は計数、言語、英語の科目からなり、企業がどの科目を課すかを選びます。各科目には複数の形式があり、計数は四則逆算、図表の読み取り、表の空欄推測、言語は論理的読解（GAB形式）、趣旨判定（IMAGES形式）などです。一つの科目では、一つの形式の問題が制限時間いっぱい続けて出るとされます。自宅で受けるWebテストの玉手箱は、計数で電卓を使えるとされるので、計数は電卓を使う前提で練習します。どれも一問にかけられる時間が短いので、解き方を知ったうえで、時間を計って慣れることが大切です。","example":"計数の形式：四則逆算、図表の読み取り、表の空欄推測\n言語の形式：論理的読解（A・B・C の三択）、趣旨判定（A・B・C の三択）\n英語の形式：論理的読解（A・B・C の三択）、長文読解（5択）\n例　四則逆算は、就職情報サイトでは50問を9分とされる","note":"形式の組み合わせは企業ごとに違います。前の年に同じ企業を受けた人の体験談などで、形式の見当をつける人もいます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"tama-reverse","level":"must","group":"計数","note":"□を求める式。短い時間に多くの問題が出る"},{"id":"tama-charts","level":"must","group":"計数","note":"表やグラフから計算して、選択肢から選ぶ"},{"id":"tama-blank-table","level":"must","group":"計数","note":"表の規則を見つけて、空欄の数を求める"},{"id":"tama-logic","level":"must","group":"言語","note":"GAB形式。本文から正誤を判定する"},{"id":"tama-gist","level":"must","group":"言語","note":"IMAGES形式。筆者の趣旨かどうかを判定する"},{"id":"tama-eng-logic","level":"must","group":"英語","note":"GAB形式の英語版。英文から A・B・C を判定する"},{"id":"tama-eng-reading","level":"must","group":"英語","note":"IMAGES形式の英語版。英語の設問に5択で答える"}],"sources":[{"title":"就活の教科書：玉手箱の計数の練習問題と対策（形式ごとの問題数と制限時間）","url":"https://reashu.com/tamatebako-keisu/","checked_at":"2026-10-16"},{"title":"就活の教科書：玉手箱の練習問題と対策（言語の形式と、A・B・C の答え方）","url":"https://reashu.com/?p=69419","checked_at":"2026-10-16"},{"title":"CREX：玉手箱の対策（科目の組み合わせは企業や職種で異なる）","url":"https://crexgroup.com/ja/shukatsu/?p=11828","checked_at":"2026-10-16"}]},"ten-career":{"id":"ten-career","name":"転職の目的とキャリアの棚卸し","type":"do","goal":"これまでの仕事の経験を書き出して、できることと実績を整理し、転職で実現したいことと活動の時期を言葉にできる。","part_of":"tenshoku","status":"verified","scope_note":"働いている人や、働いた経験のある人の転職の準備を扱います。棚卸しの答えは人によって違い、この単元の練習で確かめるのは、実績の書き方や、できることと目的の区別のような、考え方の型だけです。雇用保険の基本手当は、受け取るための条件と、受け取れない期間があることの仕組みだけを扱い、金額や日数の計算は扱いません。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"キャリアの棚卸しは、これまでの仕事の経験を書き出して、何ができるか、何を実現したいかを整理する作業です。応募書類と面接で話す内容の材料になり、どの求人に応募するかを決める基準にもなります。進め方は、まず在籍した会社と部署を時期の順に並べます。次に、部署ごとに、担当した業務、使った知識や技能、実績を書きます。実績は、担当した件数や、目標に対する達成の度合い、減らした手間など、数で示せるものを探します。そのうえで、ほかの会社でも通用する技能を取り出し、転職の目的と照らします。転職の目的は、今の職場への不満のままにせず、転職で何を実現したいかの形に言い換えます。勤務地や待遇などの条件は、転職の目的とは分けて書いておきます。今の会社の中で、異動などで実現できないかも確かめておきます。活動の時期は、在職中に始めるか、退職してから始めるかを決めます。在職中なら給与が続きますが、面接の日程を合わせにくくなります。","example":"時期の順：A社 総務部（2年）→ A社 人事部（4年）\n業務：人事部で、中途採用の面接の日程調整と、入社の手続き\n実績：手続きの書類を一覧にして、入社の初日に足りない書類が出る件数を半分にした\n通用する技能：手続きを一覧にして抜けを防ぐこと\n目的：採用の仕事を、日程調整から面接の設計まで担いたい","note":"厚生労働省のジョブ・カードには、職務経歴シートとキャリア・プランシートの様式があり、棚卸しの書き出しに使えます。退職してから活動する場合、雇用保険の基本手当は、離職し、就職する意思と能力があって求職活動をしている人が対象で、離職の前の被保険者期間などの条件があります。受け取れるようになっても、最初の通算7日は待期で支給されず、正当な理由のない自己都合の離職では、さらに給付の制限の期間があります（ハローワークの資料による）。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"キャリアの棚卸しで、実績を書くときに、いちばん役立つのはどれでしょうか。","options":["担当した件数や達成の度合いなど、数で示せるものを添える","周りから言われた評価の言葉を、そのまま書き写す","在籍した年数だけを書き、業務の中身は面接で話す"],"answer":0,"explanation":"実績は、数を添えると、どの程度のことをしたかが読み手に伝わります。周りの評価の言葉は、何をしたかを示しません。年数だけでは、その間に何をしたかがわかりません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢と並びを実際に試して正答が一つに決まるかを確認。選択肢ごとの理由、全段階の説明、書き方の型と制度の記述を公的な資料（厚生労働省、労働局、ハローワーク、国税庁、e-Gov法令検索）と照合し、指摘を反映した後に再検証。","title":"経験を書き出して、できることと転職の目的を分ける","lead":"部署ごとに業務と実績を書き、数で示す。できること、したいこと、条件を分けて言葉にする。","original":true,"problems":[{"label":"実績の書き方を選ぶ","question":"法人向けの営業を3年してきた人が、キャリアの棚卸しで実績を書きました。応募書類の材料として、最も適切なものはどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"毎日、だれよりも早く出社して、一生懸命に営業の仕事に取り組んだ。","correct":false,"reason":"取り組む姿勢を述べているだけで、担当した業務の中身も、どれだけの成果が出たかも書かれていない。"},{"key":"B","text":"営業部に、3年間在籍した。","correct":false,"reason":"在籍した期間だけで、その間に何を担当し、何を達成したかがわからない。"},{"key":"C","text":"事務機器の営業で、約40社を担当した。前の年度は新規の契約を12件結び、売上の目標を1割上回った。","correct":true,"reason":"業務の中身（事務機器の営業）、担当の規模（約40社）、実績（新規の契約12件、目標を1割上回る）が、数とともに書かれている。"},{"key":"D","text":"上司からは、社内でも評判のよい営業だと言われていた。","correct":false,"reason":"周りの評価の言葉で、どんな業務で何を達成したかが書かれていない。"}],"steps":[{"title":"実績に要る要素を確かめる","formula":"業務の中身：何を、だれに\n規模や実績：数で示せるもの","body":"棚卸しの実績は、読み手が「どの程度のことをした人か」をつかめるように書きます。業務の中身と、数で示せる規模や実績がそろっているかを見ます。"},{"title":"選択肢を要素で分ける","formula":"A：姿勢だけ（業務の中身も数もない）\nB：期間だけ\nC：業務の中身、約40社、契約12件、目標を1割上回る\nD：周りの評価だけ","body":"Bの「3年間」は数ですが、在籍した期間で、成果を示す数ではありません。業務の中身と実績の数がそろっているのはCだけです。答えはCです。"}]},{"label":"したいことを、できることや条件と区別する","question":"キャリアの棚卸しで書き出した次の文のうち、「できること（経験や技能）」でも「条件（勤務地や待遇など）」でもなく、「転職で実現したいこと（目的）」に当たるものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"表計算ソフトで、部署の月ごとの経費を集計する表を作れる。","correct":false,"reason":"身につけた技能を述べているので、できることに当たる。"},{"key":"B","text":"集計した数字から、経費の使い方を見直す提案をする仕事を担いたい。","correct":true,"reason":"これから担いたい仕事の中身を述べていて、転職で実現したいことに当たる。"},{"key":"C","text":"通勤の時間は、片道1時間以内にしたい。","correct":false,"reason":"仕事の中身ではなく、働く場所についての希望なので、条件に当たる。"},{"key":"D","text":"取引先からの問い合わせに、電話とメールで5年間対応してきた。","correct":false,"reason":"これまでの経験を述べているので、できることに当たる。"}],"steps":[{"title":"三つの区分を確かめる","formula":"できること：これまでの経験や、身につけた技能\n目的：これから担いたい仕事の中身\n条件：勤務地、通勤、待遇など、仕事の中身の外の希望","body":"目的と条件は、どちらも「〜したい」の形になりえます。違いは、仕事の中身についての希望か、働く場所や待遇についての希望かです。"},{"title":"文を区分に振り分ける","formula":"A：作れる（技能）→ できること\nB：提案をする仕事を担いたい → 目的\nC：通勤の時間 → 条件\nD：対応してきた（経験）→ できること","body":"「〜したい」の形はBとCですが、Cは通勤についての希望で、仕事の中身ではありません。答えはBです。"}]},{"label":"棚卸しの作業を、順に並べる","question":"キャリアの棚卸しの作業ア〜エを、前の作業の結果を使って次へ進める順に並べてください。\nア　部署ごとに、担当した業務と、数で示せる実績を書く。\nイ　取り出した技能と転職の目的を照らして、応募する職種の方向を決める。\nウ　在籍した会社と部署を、時期の順に書き出す。\nエ　業務と実績から、ほかの会社でも通用する技能を取り出す。","answer":"ウ → ア → エ → イ","kind":"order","alternatives":[{"try":"ウ → エ → ア → イ","why_not":"エの技能は、業務と実績（ア）から取り出すもの。アより前には置けない。"},{"try":"ウ → ア → イ → エ","why_not":"イは「取り出した技能」を使う作業なので、技能を取り出す作業（エ）の後でないとできない。"}],"steps":[{"title":"それぞれの作業が、何を材料にしているかを書き出す","formula":"ウ：材料なし（最初に会社と部署を並べる）\nア：部署ごと → ウが要る\nエ：業務と実績 → アが要る\nイ：取り出した技能 → エが要る","body":"前の作業の結果を使う関係を、作業ごとに確かめます。"},{"title":"材料のつながりをたどって並べる","formula":"ウ → ア → エ → イ","body":"材料が要らないウが最初です。ウで並べた部署ごとにアで業務と実績を書き、アからエで技能を取り出し、エの技能をイで目的と照らします。どの作業も一つ前の作業の結果を使うので、この順に決まります。"}]},{"label":"活動の時期の違いを確かめる","question":"転職の活動を、在職中に始めるか、退職してから始めるかを考えています。正しいものはどれでしょうか。","answer":"D","kind":"choice","options":[{"key":"A","text":"退職すれば、雇用保険の基本手当は、離職の翌日から必ず受け取れる。","correct":false,"reason":"基本手当には、離職の前の被保険者期間などの条件がある。条件を満たしても、受給資格の決定から通算7日は待期で支給されず、正当な理由のない自己都合の離職では、さらに給付の制限の期間がある。"},{"key":"B","text":"在職中に、ほかの会社の求人に応募することは、法律で禁じられている。","correct":false,"reason":"在職中に応募することを禁じる法律はない。在職中に転職の活動をする人は多い。"},{"key":"C","text":"在職中のままでも、雇用保険の基本手当を受け取りながら活動できる。","correct":false,"reason":"基本手当の対象の「失業」は、離職していることが前提で、在職中は当たらない。"},{"key":"D","text":"在職中に活動すると、平日の日中に面接を指定されたとき、勤務を休むなどの調整が要る。","correct":true,"reason":"在職中は収入が途切れないが、勤務の時間と面接の日程を調整しなければならない。"}],"steps":[{"title":"基本手当の条件を確かめる","formula":"対象：離職し、就職する意思と能力があり、求職活動をしている人\n条件：離職の前の被保険者期間など\n支給されない期間：待期（通算7日）、自己都合なら給付の制限","body":"この仕組みから、在職中は対象にならず（C）、退職しても翌日から必ず受け取れるわけではない（A）ことがわかります。"},{"title":"残りの選択肢を確かめる","formula":"B：在職中の応募を禁じる法律 → ない\nD：平日の日中の面接には、勤務を休むなどの調整が要る → 正しい","body":"正しいのはDです。どちらの時期を選ぶかは人によって違いますが、それぞれの特徴を知ったうえで決めます。"}]}]},"sources":[{"title":"ジョブ・カード制度総合サイト（厚生労働省）：ジョブ・カードを知る（キャリア・プランシート、職務経歴シート）","url":"https://www.job-card.mhlw.go.jp/guidance/know","checked_at":"2026-10-16"},{"title":"ハローワークインターネットサービス：よくあるご質問（雇用保険。基本手当の受給要件、待期、給付制限）","url":"https://www.hellowork.mhlw.go.jp/help/question05.html","checked_at":"2026-10-16"}]},"ten-interview":{"id":"ten-interview","name":"中途採用の面接","type":"do","goal":"中途採用の面接で、転職の理由を前向きな目標につなげて答え、志望動機を、応募先を選んだ理由、生かせる経験、貢献の意欲の三つで組み立てて答えられる。","part_of":"tenshoku","status":"verified","scope_note":"中途採用の面接で、よく聞かれる転職の理由、志望動機、職歴の質問への答え方を扱います。面接官が見る点と答え方は、ハローワークの面接対策の資料によります。面接に唯一の正解はなく、この単元の練習で確かめるのは、答えの組み立て方の型だけです。結論から答えることは、面接に共通の基本として扱います。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"中途採用の面接では、新卒の面接と同じく結論から答えますが、聞かれることの中心が違います。面接官は、これまでの経験と能力で応募した仕事をこなせるか、この会社で働きたい意欲があるか、職場になじめる人物かを見ています。そのため、前の職場での業務の中身と実績を、棚卸しで整理し、応募書類に書いた業務と実績に沿って具体的に話せるようにしておきます。転職の理由は、ほぼ必ず聞かれます。前の職場への不満を前面に出すと、気持ちの切り替えができていないと受け取られるおそれがあります。事実は短く伝え、次の職場で何をしたいかという前向きな目標につなげます。志望動機は、その仕事と会社を選んだ理由（求人票と会社の採用ページで確かめられる、仕事の中身や扱う製品、働き方の範囲で足ります）、これまでの経験のうち応募先で生かせること、入社してどう貢献したいかの三つを入れて組み立てます。三つの順番に決まりはありませんが、どれか一つが欠けると、ほかの応募者や、ほかの会社でも言える答えになりやすくなります。","example":"質問：「転職を考えた理由を教えてください」\n事実：前の職場では、製品の検査の担当が中心だった\n目標：検査で見つけた不具合の原因を、設計の段階から減らす仕事をしたい\n答えの形：短い事実 → 次に実現したいこと","note":"介護や病気などの個人的な事情で前の職場を辞め、仕事から離れた期間がある場合は、事情を短く伝え、今は働ける状況になっていることをしっかり伝えるよう、ハローワークの資料は勧めています。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"ten-resume","level":"must"},{"id":"ten-reg-hellowork","level":"must","group":"登録先","note":"公的機関。どの職種・年代でも"},{"id":"ten-reg-recruit","level":"must","group":"登録先","note":"総合型のエージェント。職種を絞らない"},{"id":"ten-reg-mynavi20s","level":"must","group":"登録先","note":"20代・第二新卒・既卒向け"},{"id":"ten-reg-type","level":"must","group":"登録先","note":"首都圏のIT・営業など"},{"id":"ten-reg-hoikushibank","level":"must","group":"登録先","note":"保育・療育の仕事向け"},{"id":"ten-reg-levwell-hoiku","level":"must","group":"登録先","note":"保育士向け"},{"id":"ten-reg-levwell-kaigo","level":"must","group":"登録先","note":"介護の仕事向け"},{"id":"ten-reg-levtech","level":"must","group":"登録先","note":"IT・Webのエンジニア向け"},{"id":"ten-reg-geekly","level":"must","group":"登録先","note":"IT・Web・ゲーム業界向け"},{"id":"ten-reg-kensetsu","level":"must","group":"登録先","note":"施工管理・建設業界向け"},{"id":"ten-reg-taiz","level":"must","group":"登録先","note":"メーカー向け"}],"assessment":{"question":"中途採用の面接で、面接官が「前の職場での業務を簡単に教えてください」と聞く主な意図として、最も適切なものはどれでしょうか。","options":["これまでの経験と能力で、応募した仕事をこなせるかを確かめるため","前の会社の売上や取引先の名前を知るため","前の職場の人間関係の不満を聞き出すため"],"answer":0,"explanation":"中途採用では、経験と能力で応募した仕事をこなせるかが、面接官の見る点の一つです。前の会社の売上などの社内の情報を知ることが目的ではありません。不満を聞き出すための質問でもありません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢と並びを実際に試して正答が一つに決まるかを確認。選択肢ごとの理由、全段階の説明、書き方の型と制度の記述を公的な資料（厚生労働省、労働局、ハローワーク、国税庁、e-Gov法令検索）と照合し、指摘を反映した後に再検証。","title":"転職の理由を前向きに、志望動機を三つの要素で組み立てる","lead":"不満は短い事実にとどめ、次に実現したいことにつなげる。志望動機には、選んだ理由、生かせる経験、貢献の意欲を入れる。","original":true,"problems":[{"label":"転職の理由の答えを選ぶ","question":"前の職場で残業が多く、学びたい分野の勉強の時間がとれなかったことが、転職を考えたきっかけの人がいます。面接で「転職の理由を教えてください」と聞かれたときの答えとして、最も適切なものはどれでしょうか。","answer":"D","kind":"choice","options":[{"key":"A","text":"前の会社は残業がとても多く、上司も改善しようとしなかったので、辞めることにしました。","correct":false,"reason":"前の職場と上司への不満が中心で、次に何をしたいかがない。気持ちの切り替えができていないと受け取られるおそれがある。"},{"key":"B","text":"特に理由はありませんが、そろそろ環境を変えたいと思いました。","correct":false,"reason":"理由も、次に実現したいことも伝わらない。同じ理由でまたすぐ辞めるのではと受け取られやすい。"},{"key":"C","text":"残業のない会社であれば、どこでもよいと考えています。","correct":false,"reason":"条件だけを述べていて、その会社で何をしたいかがない。どこでもよいという言い方は、意欲が低いと受け取られる。"},{"key":"D","text":"前の職場では日々の業務が中心で、データ分析を学ぶ時間がとれませんでした。分析の力を身につけ、それを仕事で生かせる環境で働きたいと考えました。","correct":true,"reason":"事実（学ぶ時間がとれなかった）を不満の形にせず短く述べ、次に実現したいこと（分析の力を仕事で生かす）につなげている。"}],"steps":[{"title":"答えに要る二つの部分を確かめる","formula":"短い事実 ＋ 次に実現したい前向きな目標","body":"転職の理由は、事実を短く伝え、そこから次の職場で何をしたいかにつなげます。不満そのものを中心にしないことが基本です。"},{"title":"選択肢を二つの部分で照らす","table":{"rows":[["選択肢","事実の伝え方","前向きな目標"],["A","職場と上司への不満","なし"],["B","なし","なし"],["C","なし（条件だけ）","なし"],["D","学ぶ時間がとれなかった","分析の力を仕事で生かしたい"]]},"body":"二つの部分がそろっているのはDだけです。"},{"title":"不満の言い換えを確かめる","formula":"きっかけ：残業が多い\n→ 事実：学ぶ時間がとれなかった\n→ 目標：分析の力を仕事で生かしたい","body":"Dは、残業の多さという不満を、「何を求めているか」に裏返して伝えています。きっかけは同じでも、面接官に伝わるのは次にしたいことです。答えはDです。"}]},{"label":"志望動機に欠けている要素を見つける","question":"志望動機を、応募先を選んだ理由、生かせる経験、貢献の意欲の三つで組み立てることにしました。次の答えに欠けている要素はどれでしょうか。\n「御社は、地域の小さな店にも使いやすい会計のソフトを作っていて、その姿勢にひかれました。入社したら、小さな店の経理の負担を減らせるよう、使う人の声を製品に生かす仕事で力を尽くしたいと考えています。」","answer":"B","kind":"choice","options":[{"key":"A","text":"応募先を選んだ理由","correct":false,"reason":"「地域の小さな店にも使いやすい会計のソフトを作っている姿勢にひかれた」が、選んだ理由に当たる。欠けていない。"},{"key":"B","text":"生かせる経験","correct":true,"reason":"これまでにどんな仕事をして、何ができるかが一言もない。応募先で生かせる経験が欠けている。"},{"key":"C","text":"貢献の意欲","correct":false,"reason":"「使う人の声を製品に生かす仕事で力を尽くしたい」が、貢献の意欲に当たる。欠けていない。"},{"key":"D","text":"欠けている要素はない","correct":false,"reason":"これまでの経験が書かれていないので、三つはそろっていない。"}],"steps":[{"title":"答えを文ごとに分ける","formula":"1文目：会計のソフトを作る姿勢にひかれた\n2文目：使う人の声を製品に生かす仕事で力を尽くしたい","body":"答えは2文です。それぞれが三つの要素のどれに当たるかを見ます。"},{"title":"要素に当てはめる","formula":"1文目 → 選んだ理由\n2文目 → 貢献の意欲\nこれまでの経験 → どの文にもない","body":"これまでの仕事で何をしてきて、それをどう生かせるかを述べた文がありません。答えはBです。たとえば「前の職場で、店の経理の相談に3年対応してきた」のような経験を加えると、三つがそろいます。"}]},{"label":"離れていた期間の伝え方を選ぶ","question":"家族の介護のために前の会社を辞め、1年ほど仕事から離れていた人が、面接でその期間について聞かれました。ハローワークの資料に照らして、最も適切な答えはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"家族の介護のために退職しました。今は介護の体制が整い、勤務に支障はありません。","correct":true,"reason":"退職の事情を短く伝えたうえで、今は働ける状況になっていることを伝えている。資料が勧める伝え方。"},{"key":"B","text":"個人的なことなので、お答えは控えます。","correct":false,"reason":"事情も、今は働けるのかも伝わらない。面接官は、入社後に勤務を続けられるかを確かめられない。"},{"key":"C","text":"家族の介護のために退職しました。","correct":false,"reason":"事情は伝わるが、今は働ける状況になっているかが伝わらない。資料は、それをしっかり伝えるよう勧めている。"},{"key":"D","text":"介護の大変さを、入院の手続きのことから順に詳しくお話しします。","correct":false,"reason":"話が細かすぎ、聞かれていることの中心（今は働けるか）がいつまでも出てこない。"}],"steps":[{"title":"伝えることを確かめる","formula":"事情を短く ＋ 今は働ける状況であること","body":"面接官が知りたいのは、離れていた理由と、入社後に勤務を続けられるかです。"},{"title":"選択肢を照らす","formula":"A：事情 ＋ 今は働ける → そろっている\nB：どちらもない\nC：事情だけ\nD：事情が長すぎ、今は働けるかがない","body":"両方を短く伝えているのはAだけです。答えはAです。"}]}]},"sources":[{"title":"ハローワーク布施：面接対策セミナー（面接官が見る点、退職理由・志望動機の答え方）","url":"https://jsite.mhlw.go.jp/osaka-hellowork/content/contents/002184437.pdf","checked_at":"2026-10-16"},{"title":"ハローワークインターネットサービス：応募書類（志望動機に入れる三つの点）","url":"https://www.hellowork.mhlw.go.jp/doc/ouboshorui3003.pdf","checked_at":"2026-10-16"}]},"ten-naitei":{"id":"ten-naitei","name":"転職の内定","type":"target","goal":"キャリアの棚卸しをもとに、ハローワークや転職エージェントなどの登録先を選んで登録し、職務経歴書と履歴書を書き、中途採用の面接を経て内定を得られる。","part_of":"tenshoku","status":"draft","featured":true,"scope_note":"働いた経験のある人が、正社員などの期間の定めのない雇用へ転職するときの、一般的な流れ（棚卸し、登録先を選んで登録、応募書類、面接、内定）への学習経路です。登録先は、ハローワークと、民間の転職サイトやエージェントのいくつかを、それぞれ一つの単元として並べています。どれか一つを通ればよい分かれ道で、複数に登録してもかまいません。並べた登録先は一部で、全部のサービスを網羅してはいません。内定の後の、労働条件の確かめ方、退職の申し出、入社までの手続きは、「内定から入社までの手続き」の単元で扱います。新卒の就職活動、公務員などの採用試験、起業や独立は扱っていません。選考の段階と回数は企業によって違い、適性検査やWebテストを課す企業もあります。その場合は、新卒の就活の木のWebテストの単元が使えます。棚卸し、応募書類、面接には一つに決まる答えがなく、この木の練習で確かめるのは、考え方と書き方の型だけです。書き方と答え方の型はハローワークの資料により、職業紹介の手数料などの決まりは、厚生労働省の資料で確かめています。登録先の単元の紹介文は、各サービスの公式サイトの表記の引用です。線はこの経路での準備の順序を表します。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"中途採用には、新卒の採用のような、政府が経済団体などに要請する日程はなく、企業がそれぞれの時期に募集します。採用する側は、これまでの経験と能力で、応募した仕事をこなせるかを重く見ます。準備として、まずこれまでの仕事の経験を書き出すキャリアの棚卸しをして、できることと、転職で実現したいことを言葉にします。次に、ハローワークや、民間の転職エージェントなどに登録します。職種や年代に合う登録先を選び、いくつかに登録して、出てきた求人の条件を同じ物差しで比べ、複数の求人に並行して応募するのが一般的です。応募では、履歴書に加えて、業務と実績を詳しく書いた職務経歴書を出します。書類選考を通ると面接があり、転職の理由と志望動機が中心に聞かれます。面接を経て内定が出たら、労働条件を書面で確かめてから承諾し、退職と入社の手続きに進みます。","example":"準備：キャリアの棚卸し（経験、実績、目的、活動の時期）\n登録：ハローワーク、転職エージェントから選ぶ（求人サイトや直接の応募も使える）（いくつかでもよい）\n応募：求人の条件を比べ、履歴書と職務経歴書で複数に応募 → 書類選考\n選考：面接（企業によって適性検査も）\n内定：労働条件の書面を確かめて承諾 → 退職と入社の手続きへ","note":"内定までにかかるのは、学ぶ時間よりも、応募して選考を受ける期間（月の単位）です。在職中に活動すると、退職の申し出から退職までの期間も加わります。この木の時間は、各段階の準備にかかる学習時間だけを数えています。"},"cost":{"hours":0,"yen":0},"requires":[{"id":"ten-interview","level":"must"},{"id":"ten-taishoku","level":"related"},{"id":"shu-webtest-kind","level":"related"}],"sources":[{"title":"厚生労働省：ハローワーク（職業紹介、職業相談、雇用保険の手続き。無料）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/hellowork.html","checked_at":"2026-10-16"},{"title":"ハローワークインターネットサービス：応募書類（履歴書と職務経歴書）","url":"https://www.hellowork.mhlw.go.jp/doc/ouboshorui3003.pdf","checked_at":"2026-10-16"},{"title":"ハローワーク布施：面接対策セミナー（中途採用で面接官が見る点）","url":"https://jsite.mhlw.go.jp/osaka-hellowork/content/contents/002184437.pdf","checked_at":"2026-10-16"}]},"ten-reg-geekly":{"id":"ten-reg-geekly","name":"Geeklyに登録する","type":"do","goal":"Geeklyに登録して、職種専門のアドバイザーへの相談から求人の紹介、応募までの流れを進められる。","part_of":"tenshoku","status":"verified","scope_note":"IT・Web・ゲームの業界に絞った転職エージェント、Geekly（ギークリー）への登録と、その後の流れを扱います。書いているのは、公式サイトで確かめた2026年10月18日時点の事実と、公式サイトの紹介文の引用です。紹介文の数字は運営側の表記で、条件や時点は公式サイトの注記によります。料金や流れは変わることがあるので、登録の前に公式サイトで確かめてください。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"Geekly（ギークリー）は、IT・Web・ゲームの業界に絞った、民間の職業紹介（転職エージェント）のサービスです。公式サイトでは、転職が決まるまでを「無料で徹底サポートします」としています。登録すると、職種ごとの専門のアドバイザーに相談でき、求人の紹介を受けて応募します。エンジニアのほか、クリエイティブ、営業、マーケティング、コンサルタントなど、IT・Web・ゲームの業界の中の幅広い職種の求人が載っています。公式サイトの紹介文では、「IT・WEB求人 44,000件以上」（2026年9月時点）、「IT転職支援実績 15年」（2025年8月時点）としています（公式サイトの紹介文）。","example":"登録：ウェブで登録（公式サイトの表記では「簡単30秒」）\n登録した後：職種専門のアドバイザーに相談 → 求人の紹介 → 応募"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":1,"yen":0},"requires":[{"id":"ten-search","level":"must"}],"resources":[{"kind":"service","title":"Geekly（ギークリー）","publisher":"株式会社ギークリー","url":"https://www.geekly.co.jp/","for_whom":"IT・Web・ゲームの業界で働きたい人。エンジニア、クリエイター、営業など","checked_at":"2026-10-18"}],"sources":[{"title":"Geekly：トップページ（料金、紹介文、職種）","url":"https://www.geekly.co.jp/","checked_at":"2026-10-18"}]},"ten-reg-hellowork":{"id":"ten-reg-hellowork","name":"ハローワークに登録する","type":"do","goal":"ハローワークに求職の申込みをして、職業相談、職業紹介、インターネットでの求人の検索を使える。","part_of":"tenshoku","status":"verified","scope_note":"国の機関であるハローワークへの求職の申込みと、申し込んだ後に使えるサービスを扱います。雇用保険の手続きの細かな流れは扱いません。書いているのは、公式サイトで確かめた2026年10月18日時点の事実と、公式サイトの紹介文の引用です。紹介文の数字は運営側の表記で、条件や時点は公式サイトの注記によります。料金や流れは変わることがあるので、登録の前に公式サイトで確かめてください。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"ハローワーク（公共職業安定所）は国の機関で、仕事を探す人と、求人を出す事業主に、サービスを無料で提供しています。初めて使うときは、求職の申込みが要ります。申込みには、ハローワークに出向いて館内の端末で求職の情報を入力し（仮登録）、窓口で手続きする方法と、自宅のパソコンなどからハローワークインターネットサービスで求職登録する方法があります。オンラインでは、メールアドレスで求職者マイページのアカウントを作り、14日以内に求職の情報を登録します。窓口で申し込むと、ハローワーク受付票が渡されます。申し込んだ後は、窓口で職業相談、求人の情報の提供、応募書類の作成の助言、職業紹介を受けられます。職種や年代を問わず使え、若者、子育て中の人、中高年などに向けた専門の窓口もあります。公式サイトの紹介文では、「ハローワークでは、全国のハローワークで集めた求人をもとに、お一人お一人に合った仕事が見つかるよう、ご相談しながら仕事をご紹介しています。」とされています（公式サイトの紹介文）。","example":"申込み：窓口（端末で仮登録 → 窓口で手続き）か、オンライン（マイページを作る → 14日以内に求職の情報を登録）\n用意するもの：メールアドレス（オンライン）\n申し込んだ後：職業相談 → 求人の情報 → 応募書類の助言 → 職業紹介","note":"雇用保険の基本手当を受け取る手続きは、オンラインの求職登録だけでは済まず、窓口での手続きが要ります。マイページから自分で応募した求人はハローワークの紹介にならないので、再就職手当などを考えているときは注意するよう、案内されています。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":1,"yen":0},"requires":[{"id":"ten-search","level":"must"}],"resources":[{"kind":"service","title":"ハローワークインターネットサービス","publisher":"厚生労働省","url":"https://www.hellowork.mhlw.go.jp/","for_whom":"職種や年代を問わず、だれでも。地元の求人を探す人、雇用保険の手続きもする人","checked_at":"2026-10-18"}],"sources":[{"title":"厚生労働省：ハローワーク（職業紹介、職業相談。サービスは無償）","url":"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/hellowork.html","checked_at":"2026-10-18"},{"title":"京都労働局：求職申込み手続きのご案内（窓口とオンラインの申込み、14日以内の求職登録、自主応募の注意）","url":"https://jsite.mhlw.go.jp/kyoto-roudoukyoku/content/contents/001935716.pdf","checked_at":"2026-10-18"},{"title":"ハローワークインターネットサービス：仕事をお探しの方へ（紹介文の引用元）","url":"https://www.hellowork.mhlw.go.jp/member/mem_top.html","checked_at":"2026-10-18"}]},"ten-reg-hoikushibank":{"id":"ten-reg-hoikushibank","name":"保育士人材バンクに登録する","type":"do","goal":"保育士人材バンクに登録して、キャリアパートナーへの相談から求人の紹介、面接、入職までの流れを進められる。","part_of":"tenshoku","status":"verified","scope_note":"保育と療育の仕事に絞った転職支援のサービス、保育士人材バンクへの登録と、その後の流れを扱います。書いているのは、公式サイトで確かめた2026年10月18日時点の事実と、公式サイトの紹介文の引用です。紹介文の数字は運営側の表記で、条件や時点は公式サイトの注記によります。料金や流れは変わることがあるので、登録の前に公式サイトで確かめてください。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"保育士人材バンクは、保育と療育の仕事に絞った、無料の就職と転職の支援のサービスです。公式サイトには「お仕事をお探しの方から料金を頂くことは一切ありません」とあります。ウェブのほか、電話でも登録できます。登録すると、希望の地域に詳しいキャリアパートナーから連絡があり、今の状況や希望の条件を伝えます。そのあと、求人の紹介、応募と面接（日程の調整、書類の準備、面接の対策）、内定から入職へと進み、内定の後の条件の確認には、キャリアパートナーが間に入ります。保育士のほか、幼稚園教諭、児童指導員、保育補助などの求人も載っています。公式サイトの紹介文では、「掲載求人数33,627件」（2026年10月18日現在）とし、「10以上の医療福祉系転職サービスと連携しており、「子どもと関わるお仕事」の選択肢が豊富です」としています（公式サイトの紹介文）。","example":"登録：ウェブか電話\n登録した後：キャリアパートナーから連絡、希望を伝える → 求人の紹介 → 応募と面接 → 条件の確認、入職"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":1,"yen":0},"requires":[{"id":"ten-search","level":"must"}],"resources":[{"kind":"service","title":"保育士人材バンク","publisher":"株式会社エス・エム・エス","url":"https://hoiku.jinzaibank.com/","for_whom":"保育士、幼稚園教諭、児童指導員など、子どもと関わる仕事の人","checked_at":"2026-10-18"}],"sources":[{"title":"保育士人材バンク：トップページ（紹介文、料金）","url":"https://hoiku.jinzaibank.com/","checked_at":"2026-10-18"},{"title":"保育士人材バンク：サービス紹介（サポートの流れ、料金）","url":"https://hoiku.jinzaibank.com/service/","checked_at":"2026-10-18"}]},"ten-reg-kensetsu":{"id":"ten-reg-kensetsu","name":"建設JOBsに登録する","type":"do","goal":"建設JOBsに登録して、カウンセリングから求人の紹介、面接、入社が決まるまでの流れを進められる。","part_of":"tenshoku" の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"レバテックキャリアは、IT・Webのエンジニアに絞った、民間の職業紹介（転職エージェント）のサービスです。運営会社が厚生労働省の人材サービス総合サイトに出している手数料の表では、求職の受付の手数料は「無料とする」とされ、手数料は求人を出した企業が払います。登録では、希望の勤務地と、経験した職種を選びます。登録した後は、アドバイザーへの相談、カウンセリング、求人の紹介、応募と面接、内定と入社と進みます。公式サイトの紹介文では、「IT・Webに特化した」求人を持つとし、「3人に2人が年収70万円UPを実現」（2023年1月〜2024年3月の実績）としています（公式サイトの紹介文）。","example":"登録：希望の勤務地、経験した職種\n登録した後：アドバイザーに相談 → カウンセリング → 求人の紹介 → 応募と面接 → 内定と入社","note":"公式サイトの紹介文には「企業からのスカウトも届く」とあり、登録すると、企業から直接声がかかることもあります。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":1,"yen":0},"requires":[{"id":"ten-search","level":"must"}],"resources":[{"kind":"service","title":"レバテックキャリア","publisher":"レバテック株式会社","url":"https://career.levtech.jp/","for_whom":"IT・Webのエンジニアとして経験のある人","checked_at":"2026-10-18"}],"sources":[{"title":"レバテックキャリア：トップページ（流れ、紹介文）","url":"https://career.levtech.jp/","checked_at":"2026-10-18"},{"title":"厚生労働省 人材サービス総合サイト：レバテック株式会社の手数料表（求職の受付の手数料は無料）","url":"https://jinzai.hellowork.mhlw.go.jp/icb_data/UploadFiles/Jigyosho/13-%E3%83%A6-308734/tesuryo/%28LT%29%E6%89%8B%E6%95%B0%E6%96%99%E8%A1%A8.pdf","checked_at":"2026-10-18"}]},"ten-reg-levwell-hoiku":{"id":"ten-reg-levwell-hoiku","name":"レバウェル保育士に登録する","type":"do","goal":"レバウェル保育士に登録して、業界専門のアドバイザーへの相談から求人の確認、入職までの流れを進められる。","part_of":"tenshoku","status":"verified","scope_note":"保育業界に絞った転職支援のサービス、レバウェル保育士への登録と、その後の流れを扱います。書いているのは、公式サイトで確かめた2026年10月18日時点の事実と、公式サイトの紹介文の引用です。紹介文の数字は運営側の表記で、条件や時点は公式サイトの注記によります。料金や流れは変わることがあるので、登録の前に公式サイトで確かめてください。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"レバウェル保育士は、保育業界に絞った転職支援のサービスで、公式サイトでは「【無料】登録して転職サポートを受ける」と、無料で使えることを示しています。登録では「今 月18日時点の事実と、公式サイトの紹介文の引用です。紹介文の数字は運営側の表記で、条件や時点は公式サイトの注記によります。料金や流れは変わることがあるので、登録の前に公式サイトで確かめてください。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"type転職エージェントは、民間の職業紹介（転職エージェント）のサービスです。公式サイトには、求職者に「料金が発生することは一切ありません」とあり、費用は企業から受け取る仕組みだと説明されています。登録では、今の就業の状況（在職中、離職中、退職予定、就業の経験なし）などを入力します。登録した後は、面談、求人の紹介、応募、選考、内定と進みます。公式サイトの紹介文では、「一都三県、ITエンジニア・営業職・ハイキャリアの求人・転職に強い転職エージェントです」とし、「求人総数：37,691、非公開求人数：26,914」（2026年10月18日時点）としています（公式サイトの紹介文）。","example":"登録：今の就業の状況などを入力\n登録した後：面談 → 求人の紹介 → 応募 → 選考 → 内定"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":1,"yen":0},"requires":[{"id":"ten-search","level":"must"}],"resources":[{"kind":"service","title":"type転職エージェント","publisher":"株式会社キャリアデザインセンター","url":"https://type.career-agent.jp/","for_whom":"首都圏（一都三県）で働きたい人。ITエンジニア、営業職など","checked_at":"2026-10-18"}],"sources":[{"title":"type転職エージェント：トップページ（料金、流れ、紹介文）","url":"https://type.career-agent.jp/","checked_at":"2026-10-18"}]},"ten-resume":{"id":"ten-resume","name":"職務経歴書と履歴書","type":"do","goal":"履歴書と職務経歴書の役割を分け、職務経歴書を、経歴に合う形式で、業務と数で示した実績を中心に、A4で1〜2枚にまとめられる。","part_of":"tenshoku","status":"verified","scope_note":"中途採用の応募書類（履歴書と職務経歴書）の書き方を扱います。形式や枚数、書く項目は、ハローワークの資料によります。法律で決まった書式はなく、企業が独自の書式や、ウェブの入力欄を指定することもあります。書く中身（業務と実績）は、キャリアの棚卸しで書き出したものを使います。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"中途採用の応募では、履歴書と職務経歴書を出すのが一般的です。履歴書は、学歴、職歴、資格などの基本を示す書類で、採用の担当者が最初に見ます。職務経歴書は、履歴書の職歴の欄を詳しくした書類で、これまでの業務と実績から、応募先で生かせる力を伝えます。決まった書式はなく、パソコンで作り、A4で1〜2枚にまとめるのが一般的とされます。形式には、経歴を古い順に書く編年体形式、新しい順に書く逆編年体形式、経験した職務ごとにまとめるキャリア形式があります。会社や部署を時期の順に追ってほしいときは時期の順、同じ職務を何社かにまたがって経験したときは職務ごと、というように、経歴に合わせて選びます。業務は、何を担当したかを表す言葉と、規模や成果を表す数を組み合わせ、「〜した」と自分の行動として書きます。応募先の職種に関係の深い経験ほど詳しく書きます。","example":"職務経歴書の並び（一例）\n職務の要約：これまでの経歴を3〜4行で\n職務経歴：期間、会社名、部署、担当した業務、実績\n生かせる知識・技能、資格\n自己PR：強みと、それが出た実績\n書き方の例：「受注の締め切りを週ごとの表で管理し、納期の遅れを前の年の月平均5件から1件にした」","note":"履歴書の職歴は、学校を出てからの会社名と入社・退社の年月を書き、最後に、在職中なら「現在に至る」、そのうえで「以上」と書きます（ハローワークの資料による）。職務経歴書は面接で質問の材料にされるので、出す前に写しを取り、何を聞かれそうかを確かめておきます。職歴の欄の退職の理由は、事実に合う決まった言い方で簡潔に書き、前向きな理由は志望動機などの欄で説明します。本人希望記入欄は空けておかず、給与などの具体的な希望は、面接で相談するのが一般的です（ハローワークの資料による）。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"ten-career","level":"must"}],"assessment":{"question":"中途採用の応募書類で、履歴書と比べたときの職務経歴書の役割として、最も適切なものはどれでしょうか。","options":["これまでの業務と実績を詳しく示し、応募先で生かせる力を伝える","学歴と資格の一覧を、履歴書と同じ形でもう一度示す","希望する給与と勤務地を、詳しく書いて伝える"],"answer":0,"explanation":"職務経歴書は、履歴書の職歴の欄を詳しくしたもので、業務と実績から生かせる力を伝えます。学歴や資格は履歴書に書くもので、同じものを繰り返すだけでは役割を果たしません。給与などの希望は、書類に詳しく書くより、面接で相談するのが一般的とされます。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢と並びを実際に試して正答が一つに決まるかを確認。選択肢ごとの理由、全段階の説明、書き方の型と制度の記述を公的な資料（厚生労働省、労働局、ハローワーク、国税庁、e-Gov法令検索）と照合し、指摘を反映した後に再検証。","title":"経歴に合う形式を選び、実績を自分の行動と数で書く","lead":"経歴の形に合わせて形式を選ぶ。業務は、担当を表す言葉と数を組み合わせ、「〜した」と書く。","original":true,"problems":[{"label":"経歴に合う形式を選ぶ","question":"次の経歴の人が、商品企画の求人に応募します。企画の経験を、まとめて読んでもらえるように職務経歴書を書くとき、最も合う形式はどれでしょうか。\n1社目：商品企画（3年）\n2社目：営業（2年）\n3社目（今）：商品企画（4年）","answer":"C","kind":"choice","options":[{"key":"A","text":"古い順に書く形式","correct":false,"reason":"1社目の企画と3社目の企画の間に営業の2年が入り、企画の経験が二つに分かれて並ぶ。まとめて読んでもらうという目的に合わない。"},{"key":"B","text":"新しい順に書く形式","correct":false,"reason":"順番が逆になるだけで、やはり間に営業が入り、企画の経験が二つに分かれる。"},{"key":"C","text":"職務ごとにまとめる形式","correct":true,"reason":"1社目と3社目の企画をひとまとめにして、合わせて7年の企画の経験として書ける。営業は別の職務として分けて書く。"},{"key":"D","text":"職務経歴書は出さず、履歴書の職歴の欄だけにする","correct":false,"reason":"履歴書の職歴の欄は会社名と年月が中心で、企画の業務と実績を伝えられない。応募の書類として職務経歴書を求める企業も多い。"}],"steps":[{"title":"経歴を時期の順に並べる","formula":"1社目：企画 → 2社目：営業 → 3社目：企画","body":"企画の経験は、1社目と3社目の二か所にあり、間に営業が入っています。"},{"title":"形式ごとに、企画の経験がどう並ぶかを見る","formula":"古い順：企画、営業、企画（分かれる）\n新しい順：企画、営業、企画（分かれる）\n職務ごと：企画（3年＋4年）、営業（2年）","body":"時期の順に並べる形式は、古い順でも新しい順でも、間に営業が入ります。"},{"title":"目的に合う形式を決める","formula":"企画の経験をまとめて読んでもらう → 職務ごとにまとめる形式","body":"同じ職務を何社かにまたがって経験したときは、職務ごとにまとめると、その職務の経験の長さと中身が一か所で伝わります。答えはCです。"}]},{"label":"実績の書き方を選ぶ","question":"職務経歴書の、業務と実績の書き方として、最も適切なものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"受発注の業務に携わり、さまざまなことを学ぶことができました。","correct":false,"reason":"何を担当して、どんな成果を出したかが書かれていない。規模や成果を表す数もない。"},{"key":"B","text":"取引先30社の受発注を担当。入力の手順を一覧表にまとめ、入力の誤りを月平均8件から2件に減らした。","correct":true,"reason":"担当（取引先30社の受発注）、自分の行動（手順を一覧表にまとめた）、成果の数（8件から2件）がそろい、「減らした」と自分の行動として書いている。"},{"key":"C","text":"上司の指示で入力の手順が変わったら、入力の誤りが減りました。","correct":false,"reason":"手順を変えたのは上司で、自分が何をしたかがわからない。誤りがどれだけ減ったかの数もない。"},{"key":"D","text":"業務の改善に力を尽くし、大きな成果を上げました。","correct":false,"reason":"どの業務を、どう改善したかが書かれていない。「大きな成果」も、数がないので程度が伝わらない。"}],"steps":[{"title":"業務と実績に要る要素を確かめる","formula":"担当を表す言葉 ＋ 自分の行動（〜した）＋ 規模や成果の数","body":"読み手が、何を担当して、何をして、どれだけの成果が出たかをつかめるかを見ます。"},{"title":"選択肢を要素で照らす","table":{"rows":[["選択肢","担当","自分の行動","数"],["A","受発注","なし（学んだ）","なし"],["B","取引先30社の受発注","一覧表にまとめた","8件から2件"],["C","なし","なし（上司が変えた）","なし"],["D","なし","改善に力を尽くした","なし"]]},"body":"三つの要素がそろっているのはBだけです。Cは成果が書かれていますが、自分の行動ではなく、上司の指示の結果になっています。答えはBです。"}]},{"label":"履歴書の退職理由を書く","question":"自分の希望で前の会社を辞めた人が、履歴書の職歴の欄に、退職の理由を書きます。ハローワークの資料に照らして、最も適切なものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"一身上の都合により退職","correct":true,"reason":"自分の希望で辞めたときの書き方として、資料が挙げる簡潔な形。前向きな理由を伝えたいときは、志望動機などの欄で説明する。"},{"key":"B","text":"上司との関係が悪くなったため退職","correct":false,"reason":"前の職場への不満が前に出て、書類だけでは事情が伝わらず、悪い印象を与えやすい。職歴の欄は簡潔に書く。"},{"key":"C","text":"会社都合により退職","correct":false,"reason":"会社の側の事情（倒産や人員の削減など）で辞めたときの書き方で、自分の希望で辞めた事実と合わない。"},{"key":"D","text":"給与が低く、将来に不安を感じたため退職","correct":false,"reason":"待遇への不満をそのまま書いている。資料は、職歴の欄は簡潔にし、前向きな理由は別の欄で説明するとしている。"}],"steps":[{"title":"退職の事実に合う書き方を選ぶ","formula":"自分の希望で辞めた → 一身上の都合\n会社の側の事情で辞めた → 会社都合","body":"Cは事実と合いません。残るA、B、Dは、どれも自分の希望で辞めたことを表しています。"},{"title":"職歴の欄の書き方に照らす","formula":"職歴の欄：簡潔に書く\n前向きな理由：志望動機などの欄で説明する","body":"BとDは、不満の中身を職歴の欄に書いています。簡潔に書いているのはAです。答えはAです。"}]},{"label":"本人希望の欄を書く","question":"履歴書の「本人希望記入欄」について、勤務地や給与などに特に譲れない条件がないとき、ハローワークの資料に照らして、最も適切な書き方はどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"何も書かずに空けておく","correct":false,"reason":"資料は、この欄を空けておくのは適切でないとしている。"},{"key":"B","text":"「月給30万円以上を希望します」と、希望の金額を書く","correct":false,"reason":"資料は、給与などの具体的な希望は、この欄に書かずに面接で相談するのが一般的だとしている。しかも、譲れない条件がないという前提と合わない。"},{"key":"C","text":"「貴社の規定に従います」と書く","correct":true,"reason":"特に譲れない条件がないときの書き方として、資料が挙げている形。"},{"key":"D","text":"前の会社で不満だった点を、改めてほしい条件として並べる","correct":false,"reason":"前の職場への不満が前に出るうえ、譲れない条件がないという前提とも合わない。"}],"steps":[{"title":"前提と資料の書き方を照らす","formula":"前提：譲れない条件がない\n資料：空けない。具体的な希望は面接で相談する","body":"空けておくA、金額を書くB、条件を並べるDは、どれも資料の書き方か前提に合いません。答えはCです。"}]}]},"sources":[{"title":"ハローワークインターネットサービス：応募書類（履歴書と職務経歴書の役割、退職理由、本人希望記入欄）","url":"https://www.hellowork.mhlw.go.jp/doc/ouboshorui3003.pdf","checked_at":"2026-10-16"},{"title":"東京ハローワーク：職務経歴書の書き方（編年体形式、キャリア形式、A4で2枚まで）","url":"https://jsite.mhlw.go.jp/tokyo-hellowork/library/tokyo-hellowork/oyakudati/img1/syokumu.pdf","checked_at":"2026-10-16"}]},"ten-search":{"id":"ten-search","name":"求人の探し方","type":"do","goal":"ハローワーク、民間の職業紹介（転職エージェント）、求人サイト、知人の紹介などの経路の違いを知り、どこに登録するかを選び、求人票の労働条件を読み取って比べられる。","part_of":"tenshoku","status":"verified","scope_note":"求人を探す経路の仕組みの違いと、求人票の読み方を扱います。個々の登録先のサービスは、それぞれの「〜に登録する」の単元で扱い、サービスどうしの比較はしません。経路の区分（職業紹介と募集情報等提供）と手数料の決まりは職業安定法によるもので、厚生労働省の資料で確かめています。芸能家やモデル、年収の高い経営管理者などで、求職者から手数料を取れる例外があることだけを示し、細かな条件は扱いません。","concept":{"reviewed_at":"2026-10-17","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を、公式サイト(紹介文は原文と照合)、厚生労働省と労働局の資料、人材サービス総合サイトの手数料表と照合し、こちらで確かめた事実と運営側の紹介文を分けて書いているか、引用の数に時点があるかを確認。指摘を反映した後に再検証。","text":"転職の求人を探す経路には、いくつかの種類があります。ハローワーク（公共職業安定所）は国の機関で、求人の検索、職業の相談、職業の紹介を無料で受けられます。転職エージェントと呼ばれる民間の会社は、法律上は職業紹介の事業者で、国の許可を受けて、求職の申込みを受け、事業者の判断で求人と求職者を結びつけるあっせんをします。紹介の手数料は求人を出した企業が払い、求職者からは、法令が定める一部の職業（年収などの条件付きのものを含む）の例外を除き、手数料を取れません。求人サイトや求人情報誌は、多くが募集の情報を載せる事業（職業安定法の募集情報等提供）で、利用者が自分で探して応募します。このほか、知人や元の同僚の紹介で応募する方法や、企業の採用ページから直接応募する方法もあります。経路ごとに載っている求人が違うので、いくつかに登録して、出てきた求人を同じ物差しで比べ、複数に並行して応募するのが一般的です。求人票では、仕事の中身、就業場所、賃金、労働時間などを確かめます。","example":"求人票の読み方の例\n業務（雇い入れ直後）：経理\n業務（変更の範囲）：経理と法務の業務\n就業場所（雇い入れ直後）：本社\n就業場所（変更の範囲）：本社と国内の支店\n賃金：月給の内訳（基本給、手当）を確かめる","note":"2024年4月から、求人を出すときに、業務と就業場所の「変更の範囲」を示すことが、職業安定法の規則で求められるようになりました。変更の予定がなければ「変更なし」と書かれます。どの経路で探しても、最終的に労働条件を確かめるのは、内定の後に受け取る書面です。"},"review":{"checked_at":"2026-10-18","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。2026-10-18に、転職の木を活動の順の一本道（棚卸し → 職務経歴書と、求人の探し方 → 登録先のどれか一つ、の二つがそろって面接 → 内定）に組み直した後の線、必須度、学習時間、到達条件の書式を確認。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"ten-career","level":"helps"}],"assessment":{"question":"転職の求人を探すとき、ハローワークについて正しいものはどれでしょうか。","options":["国の機関で、求人の検索、職業の相談、職業の紹介を無料で受けられる","民間の会社で、紹介を受けるたびに求職者が手数料を払う","新卒の学生だけが使える窓口で、転職の求人は扱わない"],"answer":0,"explanation":"ハローワークは国の機関で、サービスは無料です。民間の会社ではなく、紹介ごとの手数料もありません。新卒向けの窓口もありますが、転職の求人も扱っています。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢と並びを実際に試して正答が一つに決まるかを確認。選択肢ごとの理由、全段階の説明、書き方の型と制度の記述を公的な資料（厚生労働省、労働局、ハローワーク、国税庁、e-Gov法令検索）と照合し、指摘を反映した後に再検証。","title":"経路の違いを知り、求人票の条件を読み取る","lead":"あっせんをするのが職業紹介、情報を載せるだけなのが募集情報等提供。求人票は、雇い入れ直後と変更の範囲を分けて読む。","original":true,"problems":[{"label":"職業紹介に当たるものを選ぶ","question":"次のサービスのうち、職業安定法の「職業紹介」（求人と求職の申込みを受けて、雇用関係が成り立つようにあっせんすること）に当たるものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"企業から預かった求人の情報をウェブに載せ、利用者が自分で検索して、企業に直接応募する","correct":false,"reason":"情報を載せるだけで、事業者があっせんをしていないので、募集情報等提供に当たる。"},{"key":"B","text":"登録した人の職歴を見て、事業者が合う求人を選んで知らせ、応募の後の連絡も取り次ぐ","correct":true,"reason":"求職の申込みを受け、事業者が求人を選んで、雇用が成り立つようにあっせんしている。職業紹介に当たり、国の許可が要る。"},{"key":"C","text":"求人の広告を集めた冊子を、駅や店で配る","correct":false,"reason":"求人の情報を載せて配るだけで、あっせんをしていない。"},{"key":"D","text":"応募したい会社の採用ページから、自分で応募の書類を送る","correct":false,"reason":"企業に直接応募していて、あいだに入ってあっせんする事業者がいない。"}],"steps":[{"title":"職業紹介の決め手を確かめる","formula":"職業紹介：求人と求職の申込みを受ける ＋ 雇用が成り立つようにあっせんする\n募集情報等提供：情報を載せるだけ（あっせんしない）","body":"決め手は、事業者が求人と求職者のあいだに入って、あっせんをしているかどうかです。事業者が自分の判断で求人を選んで紹介すると、あっせんに当たります。"},{"title":"選択肢ごとに、だれが求人を選んでいるかを見る","formula":"A：利用者が自分で検索する\nB：事業者が職歴を見て求人を選び、知らせる\nC：利用者が冊子から探す\nD：本人が直接応募する","body":"事業者が求人を選んで知らせ、応募の後の連絡まで取り次いでいるのはBだけです。答えはBです。"}]},{"label":"職業紹介の手数料を払う人を選ぶ","question":"会社員のAさんは、民間の職業紹介の事業者（転職エージェント）の紹介で、事務職に転職が決まりました。この紹介の手数料について、正しいものはどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"Aさんが、転職先から受け取る最初の給与から払う","correct":false,"reason":"有料の職業紹介の事業者は、法令が定める一部の職業（年収などの条件付きのものを含む）の例外を除き、求職者から手数料を取れない。事務職はその例外に当たらない。"},{"key":"B","text":"Aさんと転職先の会社が、半分ずつ払う","correct":false,"reason":"求職者のAさんからは、例外を除いて手数料を取れないので、半分ずつにはならない。"},{"key":"C","text":"Aさんを採用した転職先の会社が払い、Aさんは払わない","correct":true,"reason":"紹介の手数料は、求人を出した企業から受け取る。求職者からは、例外の職業を除いて取れない。"},{"key":"D","text":"ハローワークが、国の予算から払う","correct":false,"reason":"ハローワークは国の職業紹介の機関で、民間の事業者の手数料を払う仕組みはない。"}],"steps":[{"title":"求職者から取れるかを確かめる","formula":"有料の職業紹介：求職者からの手数料は原則として取れない\n例外：芸能家、モデル、年収の高い経営管理者など","body":"事務職は例外に当たらないので、Aさんは手数料を払いません。これでA、Bが外れます。"},{"title":"だれが払うかを決める","formula":"手数料を払う：求人を出した企業（Aさんを採用した会社）","body":"Dのような、国が民間の手数料を払う仕組みはありません。答えはCです。"}]},{"label":"求人票の「変更の範囲」を読み取る","question":"求人票の就業場所の欄に、次のように書かれていました。この欄から正しく言えるものはどれでしょうか。\n就業場所（雇い入れ直後）：名古屋営業所\n就業場所（変更の範囲）：名古屋、大阪、福岡の各営業所","answer":"D","kind":"choice","options":[{"key":"A","text":"入社した直後から、名古屋、大阪、福岡の営業所を順に回って働く。","correct":false,"reason":"入社した直後の就業場所は、名古屋営業所と書かれている。大阪や福岡の営業所は、将来の配置転換で変わりうる範囲。"},{"key":"B","text":"入社してから退職するまで、名古屋営業所の外で働くことはない。","correct":false,"reason":"変更の範囲に、大阪と福岡の営業所も書かれているので、名古屋営業所の外に移る可能性がある。"},{"key":"C","text":"入社した後、数年のうちに、必ず福岡営業所に異動する。","correct":false,"reason":"変更の範囲は、変わりうる場所の範囲を示すだけで、いつどこへ移るかを約束するものではない。「必ず」とは言えない。"},{"key":"D","text":"最初は名古屋営業所で働き、将来の配置転換で、大阪や福岡の営業所に移る可能性がある。","correct":true,"reason":"雇い入れ直後の場所（名古屋営業所）と、将来変わりうる範囲（名古屋、大阪、福岡の各営業所）の両方を、正しく読んでいる。"}],"steps":[{"title":"二つの欄の意味を分ける","formula":"雇い入れ直後：入社した直後に働く場所\n変更の範囲：将来の配置転換などで、変わりうる場所の範囲","body":"2024年4月から、求人では、雇い入れ直後と変更の範囲の両方を示すことになりました。"},{"title":"選択肢を二つの欄と照らす","formula":"A：直後から3か所を回る → 直後は名古屋営業所なので合わない\nB：名古屋の外はない → 変更の範囲と合わない\nC：必ず福岡へ → 範囲は約束ではない\nD：最初は名古屋、将来は範囲の中で移りうる → 合う","body":"答えはDです。転勤を避けたいときは、変更の範囲の欄が、自分の条件と合うかを確かめます。"}]}]},"sources":[{"title":"厚生労働省：募集情報等提供と職業紹介の区分","url":"https://www.mhlw.go.jp/stf/shoukaibosyuukubun.html","checked_at":"2026-10-16"},{"title":"厚生労働省：職業紹介事業の手数料（求職者からの手数料の徴収の原則禁止と例外）","url":"https://www.mhlw.go.jp/general/seido/anteikyoku/jukyu/syoukai/dl/06.pdf","checked_at":"2026-10-16"},{"title":"栃木労働局：企業から受ける労働条件明示のルールが変わります（2024年4月。業務と就業場所の変更の範囲）","url":"https://jsite.mhlw.go.jp/tochigi-roudoukyoku/content/contents/001753324.pdf","checked_at":"2026-10-16"}]},"ten-taishoku":{"id":"ten-taishoku","name":"内定から入社までの手続き","type":"do","goal":"内定の労働条件を書面で確かめてから承諾し、退職の申し出、引き継ぎ、退職時の書類の受け取りを、入社日に間に合う順に進められる。","part_of":"tenshoku","status":"verified","scope_note":"期間の定めのない雇用（正社員など）で働いている人が、内定を受けてから、今の会社を辞めて新しい会社に入るまでの手続きを扱います。法律の決まり（民法、労働基準法、所得税法）と、職場の慣習（上司への申し出の仕方、引き継ぎ）を分けて書きます。法律の決まりは、厚生労働省、労働局、国税庁の資料で確かめています。期間の定めのある雇用（契約社員など）の途中での退職、退職金、社会保険の切り替えの細かな手続きは扱いません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を公的な資料と照合し、法律の決まりと慣習の書き分け、練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"内定が出たら、承諾する前に、労働条件を書面で確かめます。労働基準法により、会社は、雇うときに労働条件を示さなければならず、契約期間、就業場所と業務（変更の範囲を含む）、始業と終業の時刻や休日、賃金の決め方と支払いの時期、退職に関することなどは、原則として書面で示します。働く人が望めば、電子メールなどで示すこともできます。条件を確かめて承諾し、入社日が決まったら、今の会社に退職を申し出ます。法律（民法）では、期間の定めのない雇用は、働く人が解約を申し入れてから2週間がたつと終わり、会社の承諾は要りません。一方、就業規則で「退職の1か月前までに申し出る」のように定めている会社も多く、労働局の資料は、その期間がとても長いものでない限り、トラブルを避けるために会社の定めた期限を守って伝えることを勧めています。申し出は、まず直属の上司に口頭で伝え、そのあと会社の決まった形で退職届などを出すのが一般的な慣習です。退職日までに、担当の業務を後任に引き継ぎます。","example":"法律の決まり：雇うときに労働条件を書面などで示す（労働基準法）\n法律の決まり：期間の定めのない雇用は、申し入れから2週間で終わる（民法）\n会社のきまり：就業規則の申し出の期限（例：退職の1か月前まで）\n慣習：上司に口頭で伝える → 退職届 → 引き継ぎの書類を作る","note":"年の途中で転職したときは、前の会社の源泉徴収票を新しい会社に出します。新しい会社の年末調整で、その年の給与と税を合わせて精算するためです。源泉徴収票を出せないときは、本人が確定申告をします（国税庁の資料による）。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。2026-10-18に木を活動の順の一本道に組み直し、この単元は内定の後の段階として到達点から related でつないだ。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"ten-search","level":"helps"},{"id":"ten-interview","level":"related"}],"assessment":{"question":"内定を受けたとき、承諾する前にしておくこととして、最も適切なものはどれでしょうか。","options":["労働条件を書面で受け取り、賃金や就業場所などを確かめる","今の会社に退職届を出して、退職日を決めておく","新しい会社の社員に、職場の評判を聞いて回る"],"answer":0,"explanation":"労働条件は、会社が原則として書面で示すもので、承諾する前に中身を確かめます。退職を先に申し出ると、条件が合わなかったときに戻れなくなります。評判を聞くことは手がかりにはなりますが、条件を確かめる代わりにはなりません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢と並びを実際に試して正答が一つに決まるかを確認。選択肢ごとの理由、全段階の説明、書き方の型と制度の記述を公的な資料（厚生労働省、労働局、ハローワーク、国税庁、e-Gov法令検索）と照合し、指摘を反映した後に再検証。","title":"法律の決まりと慣習を分け、手続きを順に進める","lead":"書面で条件を確かめてから承諾する。退職の申し出は、法律の決まりと就業規則の両方を知ったうえで、就業規則に沿って伝える。","original":true,"problems":[{"label":"退職の申し出の決まりを選ぶ","question":"期間の定めのない雇用で働くBさんの会社の就業規則には、「退職は1か月前までに申し出ること」とあります。Bさんが退職を申し出ることについて、正しいものはどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"会社が承諾しない限り、Bさんは退職できない。","correct":false,"reason":"民法では、期間の定めのない雇用の解約の申し入れに、会社の承諾は要らない。"},{"key":"B","text":"法律では、退職の3か月前までに申し出なければならない。","correct":false,"reason":"民法が定めるのは、申し入れから2週間で雇用が終わるという決まりで、3か月前という定めはない。"},{"key":"C","text":"法律上は、申し入れから2週間がたてば雇用は終わるが、1か月前という就業規則の定めは著しく長くはないので、まず就業規則に沿って申し出るのが望ましい。","correct":true,"reason":"民法の原則（2週間）と、就業規則の期間が著しく長くなければそれに沿うのが望ましいという労働局の説明の両方に合っている。"},{"key":"D","text":"就業規則は社内のきまりなので、確かめる必要はなく、2週間前に伝えればよい。","correct":false,"reason":"法律上は申し入れから2週間で雇用は終わるが、労働局は、トラブルを防ぐため、まず就業規則に沿って申し出るのが望ましいとしている。就業規則を確かめなくてよいとは言えない。"}],"steps":[{"title":"法律の決まりを確かめる","formula":"民法：期間の定めのない雇用は、解約の申し入れから2週間で終わる\n会社の承諾：要らない","body":"これでAとBが外れます。Aは承諾を要件にしていて、Bは法律にない期間を挙げています。"},{"title":"就業規則の扱いを確かめる","formula":"就業規則の期間が著しく長くない（例：1か月前）→ まず就業規則に沿って申し出るのが望ましい","body":"Dは、就業規則を確かめなくてよいとしている点が、労働局の説明と合いません。"},{"title":"両方に合う選択肢を選ぶ","formula":"C：法律の原則 ＋ 就業規則に沿う申し出","body":"法律の決まりと、職場のきまりの扱いの両方に合っているのはCだけです。答えはCです。"}]},{"label":"書面で示される労働条件を選ぶ","question":"内定の後に受け取る労働条件の書面について、労働基準法により、会社が原則として書面で示さなければならない事項に当たるものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"賃金の決め方と、支払いの時期","correct":true,"reason":"原則として書面で示す事項（契約期間、就業場所と業務、始業と終業の時刻や休日、賃金の決め方と支払いの時期、退職に関することなど）に入っている。"},{"key":"B","text":"配属される部署の上司の名前","correct":false,"reason":"書面で示す労働条件の事項に入っていない。"},{"key":"C","text":"同じ時期に入社する人の人数","correct":false,"reason":"本人の労働条件ではなく、書面で示す事項に入っていない。"},{"key":"D","text":"会社の前の年度の売上高","correct":false,"reason":"会社の業績の情報で、本人の労働条件ではない。"}],"steps":[{"title":"書面で示す事項を並べる","formula":"契約期間\n就業場所と業務（変更の範囲を含む）\n始業と終業の時刻、休憩、休日\n賃金の決め方、支払いの時期\n退職に関すること","body":"どれも、本人がどんな条件で働くかを決める事項です。"},{"title":"選択肢を照らす","formula":"A：賃金の決め方と支払いの時期 → 入っている\nB：上司の名前、C：同期の人数、D：売上高 → 入っていない","body":"答えはAです。賃金の欄では、基本給と手当の内訳や、残業代の扱いも確かめておきます。"}]},{"label":"内定から入社までの手続きを、順に並べる","question":"内定を受けてから入社するまでの手続きア〜エを、適切な順に並べてください。\nア　今の会社の直属の上司に、退職したいことと退職の希望日を伝える。\nイ　労働条件の書面を受け取って中身を確かめ、内定を承諾して入社日を決める。\nウ　退職の後、前の会社から源泉徴収票を受け取り、新しい会社に出す。\nエ　担当の業務の手順を書類にまとめ、後任に引き継ぐ。","answer":"イ → ア → エ → ウ","kind":"order","alternatives":[{"try":"ア → イ → エ → ウ","why_not":"条件を確かめて承諾する前に退職を申し出ると、条件が合わなかったときに、今の会社に戻れなくなる。退職の希望日も、入社日が決まっていないと決められない。"},{"try":"イ → エ → ア → ウ","why_not":"退職することを上司に伝える前に引き継ぎを始めると、後任が決まらず、会社も引き継ぎの段取りを組めない。引き継ぎは、申し出て退職日が決まってから進める。"},{"try":"イ → ア → ウ → エ","why_not":"源泉徴収票は退職の後に受け取るもので、引き継ぎは退職日までに済ませるもの。ウをエより前には置けない。"}],"steps":[{"title":"それぞれの手続きが、何を前提にしているかを書き出す","formula":"イ：内定（最初にできる）\nア：入社日が決まっている → イが要る\nエ：退職日と後任が決まっている → アが要る\nウ：退職している → エ（退職日までの引き継ぎ）の後","body":"前の手続きで決まったことを使う関係を、手続きごとに確かめます。"},{"title":"前提のつながりをたどって並べる","formula":"イ → ア → エ → ウ","body":"条件を確かめて入社日を決め（イ）、それに合わせて退職を申し出て（ア）、退職日までに引き継ぎ（エ）、退職の後に源泉徴収票を受け取って新しい会社に出します（ウ）。"}]},{"label":"源泉徴収票を出す理由を選ぶ","question":"年の途中で転職したCさんは、前の会社の源泉徴収票を、新しい会社に出すように言われました。その理由として、正しいものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"新しい会社が、Cさんの給与の額を、前の会社と同じにするため","correct":false,"reason":"源泉徴収票は、前の会社で支払われた給与と差し引かれた所得税などの額を示す書類で、新しい会社の給与を決めるためのものではない。"},{"key":"B","text":"1年間に二つの会社から受け取る給与を通算して、所得税の過不足を新しい会社が年末に調整するため","correct":true,"reason":"年の途中で就職した人の年末調整は、前の会社の給与を含めて行い、その額は前の会社の源泉徴収票で確かめる（国税庁の資料による）。"},{"key":"C","text":"新しい会社が、前の会社でのCさんの仕事ぶりの評価を知るため","correct":false,"reason":"源泉徴収票に、仕事の評価は書かれていない。給与と税などの額の書類。"},{"key":"D","text":"出さないと、新しい会社で働き始めることができないため","correct":false,"reason":"出せないときは、新しい会社では年末調整ができず、本人が確定申告で精算する。働き始められなくなるわけではない。"}],"steps":[{"title":"源泉徴収票に何が書かれているかを確かめる","formula":"源泉徴収票：その年に支払われた給与と、差し引かれた所得税などの額","body":"仕事の評価（C）は書かれていません。新しい会社の給与を決める書類（A）でもありません。"},{"title":"年末調整との関係を確かめる","formula":"年の途中で就職 → 前の会社の給与も含めて年末調整\n確かめる書類 → 前の会社の源泉徴収票\n確かめられない → 本人が確定申告で精算","body":"出せなくても働けなくなるわけではないので、Dは外れます。答えはBです。"}]}]},"sources":[{"title":"茨城労働局：よくあるご質問（会社を辞めたいのですが。民法627条、就業規則の申出期間）","url":"https://jsite.mhlw.go.jp/ibaraki-roudoukyoku/yokuaru_goshitsumon/shurouchu/worker_d/qa_wyametai.html","checked_at":"2026-10-16"},{"title":"e-Gov法令検索：民法（第627条 期間の定めのない雇用の解約の申入れ）","url":"https://laws.e-gov.go.jp/law/129AC0000000089","checked_at":"2026-10-16"},{"title":"厚生労働省：労働基準法の基礎知識（労働条件の明示。原則として書面で交付する事項）","url":"https://www.mhlw.go.jp/content/11200000/001604439.pdf","checked_at":"2026-10-16"},{"title":"国税庁 タックスアンサー No.2674 中途就職者の年末調整","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2674.htm","checked_at":"2026-10-16"}]},"tgweb-classic":{"id":"tgweb-classic","name":"TG-WEB 従来型","type":"target","goal":"TG-WEB従来型の計数（暗号、推論、数列など）と言語（空欄補充、語句や文の並べ替え、長文読解）の解き方を学び、時間を計った演習を始める。","part_of":"tgweb","status":"draft","scope_note":"TG-WEBの二つの型の一つです。計数の図形の問題（展開図、立方体やサイコロ、積木、立体の切り口、多面体の辺や頂点の数、平行四辺形や直方体の数、タイルの敷き詰め、経路問題、折り紙、一筆書き、図形の軌跡など）、推論のうちじゃんけんの問題、数列のうち群数列と表の形に並んだ数、英語は未収録です。最小の手順を問う推論は、公務員の「操作の手順」の単元を「あると楽」でつないでいます。分野は、就職情報サイトが挙げる出題内容と例題から選び、公式の資料では確かめていません。推論は、順位や順序を決める問題（SPIの推論）と、うそをついている人を見つける問題（発言の真偽）に分けています。公務員の判断推理の単元（暗号、発言の真偽、命題と対偶、数列の規則）を使い回しているので、練習は公務員試験に合わせた問題です。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"型と科目、問題数と制限時間、出題分野、受検画面の手がかりを、就職情報サイト4つの記述と照合（公式の資料は取得できなかった）。資料で食い違う点は食い違うと書いた。指摘を反映した後に2回再検証。","text":"TG-WEBの従来型は、少ない問題数を、一問に時間をかけて解く形です。計数では、暗号、推論（順位の決め方、うそをついている人の見つけ方）、命題、集合、場合の数、数列、図形などが出るとされます。パズルに近い問題が多く、解き方を知らないと手が止まります。言語では、空欄補充（熟語や接続語）、語句や文の並べ替え、長文読解（筆者の主張や要旨）が出るとされます。選択肢から答えを選ぶ形です。","example":"計数：暗号、推論、命題、集合、場合の数、数列、図形（展開図など）\n言語：空欄補充、語句や文の並べ替え、長文読解\n例　計数は、就職情報サイトでは9問を18分とされる","note":"一問に2分ほどかけられる一方、解き方の見当がつかない問題に時間を使いすぎると、ほかの問題に届きません。見当がつかない問題は後回しにします。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"kmn-cipher","level":"must"},{"id":"spi-inference","level":"must"},{"id":"kmn-truth","level":"must"},{"id":"kmn-proposition","level":"must"},{"id":"spi-sets","level":"must"},{"id":"spi-counting","level":"must"},{"id":"kmn-sequence","level":"must"},{"id":"kmn-procedure","level":"helps"},{"id":"spi-blank","level":"must"},{"id":"spi-sentence-order","level":"must"},{"id":"spi-reading","level":"must"}],"sources":[{"title":"就活の教科書：TG-WEBの例題（従来型の計数は暗号、命題、推論、集合、組み合わせ、数列、展開図など。言語は並べ替え、空欄補充、長文読解）","url":"https://reashu.com/tgweb-reidai-jyuurai/","checked_at":"2026-10-16"},{"title":"unistyle：TG-WEB従来型の例題（数列、暗号、論理、推論、集合、場合の数など）","url":"https://unistyleinc.com/techniques/1103","checked_at":"2026-10-16"},{"title":"CREX：TG-WEBの対策（従来型の計数に図形、暗号、推論、数列）","url":"https://crexgroup.com/ja/shukatsu/?p=207","checked_at":"2026-10-16"}]},"tgweb-new":{"id":"tgweb-new","name":"TG-WEB 新型","type":"target","goal":"TG-WEB新型の計数（四則逆算、図表の読み取り）の解き方を学び、短い時間で多くの問題を解く演習を始める。","part_of":"tgweb","status":"draft","scope_note":"TG-WEBの二つの型の一つです。言語の中心とされる同義語・対義語、ことわざ・慣用句と、英語は未収録です。言語への線は「あると楽」だけで、対義語の準備としての二語関係（意味が反対の関係）、就職情報サイトの一つが挙げる熟語の成り立ちと語句の用法、別のサイトが挙げる長文読解につないでいます。計数に方程式や割合の計算、確率を挙げるサイトもあります（その単元への線は引いていません）。言語では長文は出ないとするサイトもあります。分野は就職情報サイトの記述によるもので、公式の資料では確かめていません。四則逆算と図表の読み取りは、出題の形が近いとされる玉手箱の単元を使い回しています。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"型と科目、問題数と制限時間、出題分野、受検画面の手がかりを、就職情報サイト4つの記述と照合（公式の資料は取得できなかった）。資料で食い違う点は食い違うと書いた。指摘を反映した後に2回再検証。","text":"TG-WEBの新型は、短い時間に多くの問題を解く形です。計数では、□に入る数を求める四則逆算と、表やグラフから数を求める図表の読み取りが出るとされ、玉手箱の計数に近い形です。言語は、同義語、対義語、ことわざ、慣用句など、語句の知識を問う問題が中心とされ、長文読解を挙げるサイトもあります。一問に十数秒しかかけられないので、解き方を知ったうえで、時間を計って慣れることが大切です。","example":"計数：四則逆算、図表の読み取り\n言語：同義語、対義語、ことわざ、慣用句など\n例　計数は、就職情報サイトでは36問を8分とされる","note":"語句の知識の問題は、考えてもわからないものは時間をかけずに次に進みます。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"tama-reverse","level":"must"},{"id":"tama-charts","level":"must"},{"id":"spi-word-relations","level":"helps"},{"id":"spi-reading","level":"helps"},{"id":"spi-idioms","level":"helps"},{"id":"spi-word-usage","level":"helps"}],"sources":[{"title":"就活の教科書：TG-WEBの問題と対策（新型の計数は図表の読み取りと四則逆算、言語は同義語、対義語、ことわざなど）","url":"https://reashu.com/tg-web/","checked_at":"2026-10-16"},{"title":"unistyle：TG-WEBの対策（新型の言語は語彙の知識の問題が中心）","url":"https://unistyleinc.com/techniques/963","checked_at":"2026-10-16"},{"title":"CREX：TG-WEBの対策（新型の言語に熟語の成り立ち、語句の用法）","url":"https://crexgroup.com/ja/shukatsu/?p=207","checked_at":"2026-10-16"}]},"tgweb":{"id":"tgweb","name":"TG-WEB","type":"target","goal":"受検するTG-WEBが従来型か新型かを見分け、その型の計数と言語の分野を学んで、時間を計った演習を始める。","part_of":"tgweb","status":"draft","featured":true,"scope_note":"計数と言語の代表的な分野への学習経路です。英語と性格検査は未収録です。英語が従来型だけにあるのか、新型にもあるのかは、就職情報サイトの間で書き方が食い違います。従来型の計数の図形の問題（展開図、立方体やサイコロ、積木、立体の切り口、多面体の辺や頂点の数、平行四辺形や直方体の数、タイルの敷き詰め、経路問題、折り紙、一筆書き、図形の軌跡など）も未収録です。新型の言語の同義語・対義語、ことわざ・慣用句の単元はまだありません。出題分野、問題数、制限時間は、公式の資料ではなく、就職情報サイトの記述によります（公式の資料は取得できませんでした）。どちらの型が出るかは企業が決め、受検の画面に型の名前は出ないとされます。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"型と科目、問題数と制限時間、出題分野、受検画面の手がかりを、就職情報サイト4つの記述と照合（公式の資料は取得できなかった）。資料で食い違う点は食い違うと書いた。指摘を反映した後に2回再検証。","text":"TG-WEBは、ヒューマネージの適性検査で、企業の採用選考で自宅のパソコンやテストセンターで受けるWebテストとして使われています。能力検査には、従来型と新型の二つの型があり、どちらも計数と言語（企業によっては英語）からなります。従来型は、暗号、推論、数列、図形などの、SPIではあまり見ない問題が少ない問題数で出て、一問に時間をかけて解く形です。新型は、四則逆算や図表の読み取り、語句の知識の問題が、短い時間にたくさん出る形で、玉手箱やSPIに近いとされます。同じTG-WEBでも、型によって必要な準備がまったく違います。","example":"従来型：計数9問を18分、言語12問を12分\n新型：計数36問を8分、言語34問を7分\n（どれも就職情報サイトの記述）","note":"型は、計数の問題数と制限時間で見分けられるとされます。前の年に同じ企業を受けた人の体験談などで、型の見当をつける人もいます。電卓を使えるかは、受ける場所（自宅かテストセンターか）で違うとされ、資料によって書き方が食い違います。企業の受検案内で確かめてください。"},"cost":{"hours":0,"yen":0},"requires":[{"id":"tgweb-classic","level":"must","group":"型","note":"暗号、推論、数列など。少ない問題を時間をかけて解く"},{"id":"tgweb-new","level":"must","group":"型","note":"四則逆算、図表の読み取り、語句。短い時間に多くの問題"}],"sources":[{"title":"就活の教科書：TG-WEBの問題と対策（従来型と新型の科目、出題内容、問題数と制限時間）","url":"https://reashu.com/tg-web/","checked_at":"2026-10-16"},{"title":"unistyle：TG-WEBの対策（従来型と新型の違い、型の見分け方、電卓の扱い）","url":"https://unistyleinc.com/techniques/963","checked_at":"2026-10-16"},{"title":"CREX：TG-WEBの対策（従来型と新型の出題分野）","url":"https://crexgroup.com/ja/shukatsu/?p=207","checked_at":"2026-10-16"}]}},"tune":{"kmn-suuteki|course":{"wrong":200,"step":12,"finish":"up","detour":0.002},"spi-nonverbal|course":{"wrong":200,"step":12,"finish":"both","detour":0.002},"tgweb|course":{"wrong":200,"step":12,"finish":"up","detour":0.01},"kmn-suuteki|field":{"wrong":200,"step":12,"finish":"up","detour":0.01},"spi|none":{"wrong":200,"step":12,"finish":"both","detour":0.002},"tgweb|none":{"wrong":600,"step":12,"finish":"both","detour":0.002}}};

<script>
(function () {
  'use strict';

  var DATA = window.HOWTREE_DATA;
  var N = DATA.nodes;
  var CFG = DATA.config;
  var app = document.getElementById('app');

  // ---- 端末内の保存 ----
  var KNOWN_KEY = 'howtree.known.v2';
  var REPORT_KEY = 'howtree.reports.v1';
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できなくても動かす */ }
  }
  var known = {};
  list(KNOWN_KEY).forEach(function (id) { if (N[id]) known[id] = 1; });
  function persist() { save(KNOWN_KEY, Object.keys(known)); }


  var EVENT_KEY = 'howtree.events.v1', CONSENT_KEY = 'howtree.measure.v1', START_KEY = 'howtree.started.v1';
  function list(key) { var x = load(key); return Array.isArray(x) ? x : []; }
  function track(kind, node, value) {
    if (load(CONSENT_KEY) !== true) return;
    var events = list(EVENT_KEY);
    events.push({kind: kind, node: node || null, value: value || null, at: new Date().toISOString()});
    save(EVENT_KEY, events.slice(-1000));
  }
  function exportRecords() {
    var data = {version: 1, exported_at: new Date().toISOString(), known: Object.keys(known), events: list(EVENT_KEY), reports: list(REPORT_KEY)};
    var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    var a = document.createElement('a'); a.href=url; a.download='howtree-feedback.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function viewRecords() {
    app.innerHTML='<div class="wrap narrow">'+header()+'<div class="card"><h1>学習の記録</h1>'+
      '<p>習得済みと学習中の単元は、このブラウザに保存します。操作履歴は協力を選んだ場合だけ記録します。自動送信はしません。</p>'+
      '<p>書き出すファイルには単元名に対応するID、操作日時、教材を開いた履歴、報告、習得済みが入ります。内容を確認してから、試用を依頼した人に任意で渡してください。</p>'+
      '<p>操作履歴 '+list(EVENT_KEY).length+'件 / 報告 '+list(REPORT_KEY).length+'件。最大1,000件を端末に保存します。</p>'+
      '<div class="btns"><button class="btn" data-act="measure">'+(load(CONSENT_KEY)===true?'操作履歴の記録を止める':'試用に協力：操作履歴を記録する')+'</button>'+
      '<button class="btn" data-act="export">記録を書き出す</button><button class="btn" data-act="erase">操作履歴と報告を削除</button></div><p class="note">習得済みの記録は削除しません。書き出しは購入や広告への同意ではありません。</p></div>'+footer()+'</div>';
  }
  // 概念の説明と具体例。単元の詳細と練習ページの上に出す。
  function conceptHtml(n) {
    var c = n.concept;
    if (!c) return '';
    return '<div class="blk concept"><div class="sub">' + (n.type === 'target' ? 'これは何か' : esc(n.name) + 'とは') + '</div><p>' + esc(c.text) + '</p>' +
      (c.example ? '<pre class="step-formula">' + esc(c.example) + '</pre>' : '') +
      (c.note ? '<p class="note">' + esc(c.note) + '</p>' : '') + '</div>';
  }
  function miniLesson(n) {
    if(n.practice) return '<div class="blk"><div class="sub">問題で学ぶ</div><a class="btn red" href="#/practice/'+encodeURIComponent(n.id)+'">'+n.practice.problems.length+'問の例題を開く</a></div>';
    if (!n.assessment) return '';
    var a=n.assessment;
    return '<div class="blk"><div class="sub">無料で一問試す（独自作成）</div><p>'+esc(a.question)+'</p><details><summary>答えと考え方</summary><p>'+esc(a.explanation)+'</p></details><p class="note">一問は理解の手がかりです。単元全体の習得は到達条件でも確認してください。</p></div>';
  }

  var practiceNode=null, practiceIndex=0;
  // 表。1行目と1列目を見出しにする。対応表(kind = "match")は欄を中央にそろえる。
  function tableHtml(t) {
    return '<figure class="ptable' + (t.kind === 'match' ? ' match' : '') + '">' + (t.caption ? '<figcaption>' + esc(t.caption) + '</figcaption>' : '') + '<table>' + t.rows.map(function (row, i) {
      return '<tr>' + row.map(function (c, j) { return (i && j ? '<td>' : '<th>') + esc(c) + (i && j ? '</td>' : '</th>'); }).join('') + '</tr>';
    }).join('') + '</table></figure>';
  }
  function tableText(t) { return (t.caption ? t.caption + '\n' : '') + t.rows.map(function (row) { return row.join(' | '); }).join('\n'); }
  function stepText(s) { return [s.table ? tableText(s.table) : '', s.formula || ''].filter(Boolean).join('\n'); }
  function practicePrompt(index) {
    var a=N[practiceNode].practice.problems[practiceIndex], step=a.steps[index];
    var previous=index ? a.steps.slice(0,index).map(stepText).join('\n\n') : '問題文を整理するところです。';
    var tables=(a.tables||[]).map(function(t){return '\n\n'+tableText(t);}).join('');

  // ---- グラフ ----
  var FLOW = ['must', 'helps'];
  function reqs(id, levels) {
    return (N[id].requires || []).filter(function (r) { return levels.indexOf(r.level) >= 0; }).map(function (r) { return r.id; });
  }
  function closure(id, levels) {
    var seen = {};
    (function go(k) {
      reqs(k, levels).forEach(function (p) { if (!seen[p]) { seen[p] = 1; go(p); } });
    })(id);
    return seen;
  }
  // 「どちらか」の分岐: 必須の前提のうち同じ group を持つものは、どれか一つを通ればよい。
  // 選んだ道は端末に保存する。選んでいなければ、目標までの残りの時間がいちばん少ない道を使う。
  var CHOICE_KEY = 'howtree.choice.v1';
  var choice = load(CHOICE_KEY) || {};
  function groupsOf(id) {
    var g = {};
    (N[id].requires || []).forEach(function (r) { if (r.level === 'must' && r.group) (g[r.group] = g[r.group] || []).push(r.id); });
    return g;
  }
  function pick(id, name, alts) {
    var c = choice[id + '|' + name];
    if (alts.indexOf(c) >= 0) return c;
    // 道どうしが前提を共有していても、その道だけの時間で比べる(目標ごとに選び直さないため)
    return alts.slice().sort(function (a, b) { return restHours(a) - restHours(b) || (a < b ? -1 : 1); })[0];
  }
  function mustReqs(id) {
    var g = groupsOf(id);
    return (N[id].requires || []).filter(function (r) { return r.level === 'must' && !r.group; }).map(function (r) { return r.id; })
      .concat(Object.keys(g).map(function (name) { return pick(id, name, g[name]); }));
  }
  function mustAnc(id) {
    var seen = {};
    (function go(k) { mustReqs(k).forEach(function (p) { if (!seen[p]) { seen[p] = 1; go(p); } }); })(id);

  }

    var all = mustAnc(id); all[id] = 1;

  }
  var depthMemo = {};
  function depth(id) {

  function plan(goal) {
    var all = mustAnc(goal);

    rest.forEach(function (k) { restSet[k] = 1; });
    return {
      all: Object.keys(all).sort(byDepth),
      rest: rest,
      restSet: restSet,

      yen: rest.reduce(function (s, k) { return s + yen(k); }, 0)
    };
  }

  function textWidth(s) { return Array.prototype.reduce.call(String(s), function (w, ch) { return w + (ch.charCodeAt(0) < 0x2000 ? 0.55 : 1); }, 0); }
  // 箱の名前を2行に分ける位置。両方の行が箱に収まる位置のうち、「と」「・」の後ろ、次に「の」の後ろを選び、
  // 同じなら、名前を半分に近く分けるほうを選ぶ(番号の幅は入れない。入れると「個人資／産相談業務」のように語の途中で切れる)。
  // lead は1行目の頭に付く番号の幅。収まる位置がなければ null。
  function splitName(name, lead) {
    var best = null, MAX = 8;
    for (var i = 2; i <= name.length - 2; i++) {
      var a = name.slice(0, i), b = name.slice(i);
      if (textWidth(a) + lead > MAX || textWidth(b) > MAX) continue;
      var prev = name.charAt(i - 1), rank = 'と・'.indexOf(prev) >= 0 ? 0 : prev === 'の' ? 1 : 2;
      // 漢字が続く語(保険顧客資産…)は2字ずつの語でできていることが多いので、並びの途中では偶数文字目で切る
      var run = 0;
      while (run < i && /[一-鿿]/.test(name.charAt(i - 1 - run))) run++;
      if (rank === 2 && run > 0 && run < i + 1 && /[一-鿿]/.test(name.charAt(i)) && run % 2) rank = 3;
      var score = rank * 100 + Math.abs(textWidth(a) - textWidth(b));
