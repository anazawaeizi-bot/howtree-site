30/40\n30/40 = 3/4","body":"答えに割る数の 5/8 をかけると、もとの 3/4 に戻ります。"}]},{"label":"小数と分数が混じった計算","question":"0.6 + 3/4 を計算して、答えを小数と分数の両方で表してください。","answer":"小数では1.35、分数では27/20（1と7/20）","steps":[{"title":"どちらかの形にそろえる方針を置く","formula":"0.6：小数\n3/4：分数","body":"形が違うままでは足しにくいので、どちらかにそろえます。まず小数にそろえて計算し、次に分数にそろえて確かめます。"},{"title":"3/4 を小数に直す","formula":"3 ÷ 4 = 0.75","body":"分数を小数に直すには、分子を分母で割ります。"},{"title":"小数どうしで足す","formula":"0.6 + 0.75 = 1.35","body":"小数点の位置をそろえて足します。0.6 は 0.60 と考えます。"},{"title":"0.6 を分数に直す","formula":"0.6 = 6/10\n6/10 = 3/5","body":"0.6 は 0.1 が6個なので 6/10 です。分母と分子を2で割って約分します。"},{"title":"分数どうしで足す","formula":"3/5 = 12/20\n3/4 = 15/20\n12/20 + 15/20 = 27/20","body":"分母を20にそろえて、分子を足します。"},{"title":"二つの答えが同じ数か確かめる","formula":"27 ÷ 20 = 1.35","body":"27/20 を小数に直すと1.35で、小数で計算した答えと合います。27/20 は、1と7/20 とも書けます。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-letters":{"id":"math-letters","name":"文字と式","type":"learn","goal":"数量を文字を使った式で表し、かっこをはずして整理し、文字に数や式を代入して計算できる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、用語と書き方の決まりを資料と照合し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文字を使うと、まだ決まっていない数量や、いろいろな値をとる数量を、一つの式で表せます。文字を使った式には、書き方の決まりがあります。かけ算の答えを積といい、文字を使った積では記号 × を省きます。かけ算は、かける順番を変えても積が同じです。数と文字の積では数を先に書き（a × 3 は 3a）、文字どうしの積は、ふつうアルファベット順に並べます（b × a は ab）。1 × a は a、−1 × a は −a と書きます。わり算は、分数の形で書きます。\n式を足し算の形で見たとき、+ で結ばれた一つ一つを項といいます。引き算は、負の項を足すと考えます（3a − 2b の項は、3a と −2b）。文字を含む項の、数の部分を係数といいます（3a の係数は 3、−2b の係数は −2、a の係数は 1、−b の係数は −1）。項に数をかけたり、項を数で割ったりするときは、係数にその計算をします（3 × 2a = 6a、6a ÷ 2 = 3a）。文字の部分が同じ項を同類項といい、係数どうしを足し引きして一つにまとめられます（3a + 2a = 5a）。係数が 0 になった項は消えます。文字の項と、数だけの項は、別々にまとめます。\nかっこの外の数や文字は、かっこの中のすべての項にかけます（分配法則）。数のついていないかっこは、前が + ならそのままはずし、前が − なら中のすべての項の符号を変えてはずします。\n二つの式を等号 = で結んだものを等式といい、= の左を左辺、右を右辺、合わせて両辺といいます。式の中の文字を数に置きかえることを代入といい、代入して計算した結果を式の値といいます。数のかわりに式を代入することもできます。足し算や引き算でできた式を代入するときは、かっこをつけます。数を代入したあとは、数だけの式と同じ順（かっこの中、かけ算とわり算、足し算と引き算）で計算します。","example":"書き方：a × 3 = 3a、b × a = ab、a ÷ 4 = a/4\n同類項をまとめる：3a + 2a = 5a、6y − 6y = 0、3x + 2 + 2x + 5 = 5x + 7\n分配法則：2(a + 3) = 2a + 6、a(b + c) = ab + ac\nかっこをはずす：−(a − b) = −a + b\n数を代入する：a が 4 のとき、3a + 2 は 3 × 4 + 2 = 14\n式を代入する：y = 2x のとき、5y は 5 × 2x = 10x","note":"3a は「3 × a」のことです。3 と a を並べた数（a が 4 なら 34）でも、3 + a でもありません。代入するときは、省かれていた × を書き戻します。この単元は、中学1年の「文字と式」と、中学2年の「式の計算」の一部にあたります。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-negative","level":"must"}],"assessment":{"question":"a が 5 のとき、2a + 3 の値は？","options":["13","28","10"],"answer":0,"explanation":"2a は 2 × a のこと。2 × 5 + 3 = 13。28は「2a」を二十五と読んで3を足した数、10は 2 + 5 + 3 と足してしまった数。"},"practice":{"title":"文字で表し、かっこをはずし、数や式を代入する","lead":"省かれた × を、書き戻して考える。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、図と問題文の一致、前提の範囲、下流の単元から見た不足、説明・確認問題との整合を確認。一度検証を通らず、作り直した後に全手順で再検証。","problems":[{"label":"数量を式で表す","question":"1個 a 円の品物を5個買い、5個まとめて、b 円の箱1つに入れてもらいました。代金の合計を、文字を使った式で表してください。","answer":"5a + b（円）","alternatives":[{"try":"5(a + b)","why_not":"箱は1つだけ。この式だと、箱の代金も5倍することになる。"},{"try":"5ab","why_not":"品物の代金と箱の代金は、足して合計にする。かけ合わせるのではない。"},{"try":"a5 + b","why_not":"表している量は同じだが、数と文字の積では、数を先に書く決まり。5a と書く。"}],"steps":[{"title":"言葉の式を作る","formula":"代金の合計 = 品物1個の値段 × 個数 + 箱の値段","body":"いきなり文字で書かず、まず言葉で関係を書きます。"},{"title":"言葉を、文字と数に置きかえる","formula":"a × 5 + b","body":"品物1個の値段は a、個数は5、箱の値段は b です。"},{"title":"書き方の決まりに合わせる","formula":"5a + b","body":"× を省き、数を文字の前に書きます。5a と b は文字の部分が違うので、これ以上まとめられません。"},{"title":"数を入れて確かめる","formula":"a が 100、b が 50 のとき\n100 × 5 + 50 = 550","body":"1個100円の品物5個で500円、箱が50円で、合計550円です。式に数を入れた結果と合います。"}]},{"label":"負の数を代入する","question":"a = 3、b = −2 のとき、2a − 3b の値を求めてください。","answer":"12","alternatives":[{"try":"6 − 6 = 0","why_not":"3b は 3 × (−2) で −6。引くのは −6 なので、6 − (−6) となり、足すことになる。"},{"try":"2 × 3 − 3 − 2 = 1","why_not":"かっこをつけずに代入して、b の符号の − を引き算の記号として読んでいる。3b は 3 × (−2) で、かけ算。"}],"steps":[{"title":"省かれている × を書き戻す","formula":"2a − 3b\n= 2 × a − 3 × b","body":"代入する前に、かけ算の記号を書き戻します。"},{"title":"文字を数に置きかえる","formula":"2 × 3 − 3 × (−2)","body":"負の数を代入するときは、かっこをつけます。かっこがないと、× と − が並んで、符号なのか引き算なのか見分けにくくなります。"},{"title":"かけ算を先に計算する","formula":"2 × 3 = 6\n3 × (−2) = −6","body":"正の数と負の数をかけると、答えは負になります。"},{"title":"引き算をする","formula":"6 − (−6) = 6 + 6 = 12","body":"負の数を引くことは、その数の符号を変えて足すことと同じです。"}]},{"label":"数のついたかっこをはずす","question":"3(2a + b) − 2(a − b) を、かっこをはずして簡単にしてください。","answer":"4a + 5b","alternatives":[{"try":"6a + 3b − 2a − 2b = 4a + b","why_not":"後ろのかっこにかけるのは −2。−2 × (−b) は +2b になる。符号を変え忘れている。"},{"try":"6a + 3b + 2a − 2b = 8a + b","why_not":"−2 を a にかけると −2a、−b にかけると +2b。二つとも符号を取り違えている。"},{"try":"6a + b − 2a − b = 4a","why_not":"かっこの外の数は、かっこの中のすべての項にかける。b と −b にかけ忘れている。"}],"steps":[{"title":"前のかっこをはずす","formula":"3(2a + b)\n= 3 × 2a + 3 × b\n= 6a + 3b","body":"かっこの外の3を、中の 2a と b の両方にかけます（分配法則）。3 × 2a は、係数の2に3をかけて 6a です。"},{"title":"後ろのかっこをはずす","formula":"−2(a − b)\n= (−2) × a + (−2) × (−b)\n= −2a + 2b","body":"a − b は a + (−b) と同じなので、かっこの中の項は a と −b です。かけるのは2ではなく −2 です。負の数どうしをかけると正になるので、−b の項は +2b になります。"},{"title":"同類項をまとめる","formula":"6a + 3b − 2a + 2b\n= (6 − 2)a + (3 + 2)b\n= 4a + 5b","body":"a の項どうし、b の項どうしで、係数を足し引きします。a の項と b の項は、まとめられません。"},{"title":"数を入れて、もとの式と同じ値になるか確かめる","formula":"a が 2、b が 1 のとき\nもとの式：3 × (2 × 2 + 1) − 2 × (2 − 1) = 13\n答えの式：4 × 2 + 5 × 1 = 13","body":"もとの式でも答えの式でも13になります。一組の数で合っただけでは正しいと言い切れませんが、合わなければ必ずどこかが間違っています。確かめる数は、かっこの中が0にならないものを選びます。"}]},{"label":"数のついていないかっこをはずす","question":"(5x + 3) − (2x − 4) を、かっこをはずして簡単にしてください。","answer":"3x + 7","alternatives":[{"try":"5x + 3 − 2x − 4 = 3x − 1","why_not":"前が − のかっこは、中のすべての項の符号を変える。−4 は +4 になる。"},{"try":"5x + 3 − 2x + 4 = 10x","why_not":"文字の項と数だけの項は、別々にまとめる。3x と 7 は、一つにまとめられない。"}],"steps":[{"title":"前のかっこをはずす","formula":"(5x + 3) = 5x + 3","body":"前に何もついていないかっこ（前が + と同じ）は、そのままはずせます。"},{"title":"後ろのかっこをはずす","formula":"−(2x − 4)\n= −2x + 4","body":"前が − のかっこは、中のすべての項の符号を変えてはずします。2x は −2x に、−4 は +4 になります。−1 をかっこの中の全部にかけるのと同じです。"},{"title":"文字の項と、数だけの項を、別々にまとめる","formula":"5x + 3 − 2x + 4\n= (5 − 2)x + (3 + 4)\n= 3x + 7","body":"x の項どうし、数だけの項どうしで計算します。3x と 7 は種類が違うので、これ以上まとめられません。"},{"title":"数を入れて、もとの式と同じ値になるか確かめる","formula":"x が 3 のとき\nもとの式：(5 × 3 + 3) − (2 × 3 − 4) = 16\n答えの式：3 × 3 + 7 = 16","body":"もとの式は 18 − 2 で16、答えの式も16です。"}]},{"label":"式に式を代入する","question":"y = x + 2 という関係があります。3y − x を、x だけを使った式で表し、かっこをはずして簡単にしてください。","answer":"2x + 6","alternatives":[{"try":"3x + 2 − x = 2x + 2","why_not":"かっこをつけずに代入している。3 は y の全体、つまり x + 2 の全体にかかるので、3(x + 2) とする。"},{"try":"3(x + 2) − x = 3x + 6 − x = 4x + 6","why_not":"3x − x は、係数を 3 − 1 と引いて 2x。足してしまっている。"}],"steps":[{"title":"省かれている × を書き戻す","formula":"3y − x\n= 3 × y − x","body":"y のところに、別の式を入れられる形にします。"},{"title":"y を、x + 2 に置きかえる","formula":"3 × (x + 2) − x\n= 3(x + 2) − x","body":"等式 y = x + 2 は、y と x + 2 が同じ量であることを表しています。入れる式が足し算でできているので、かっこをつけます。"},{"title":"かっこをはずす","formula":"3(x + 2) − x\n= 3x + 6 − x","body":"かっこの外の3を、中の x と 2 の両方にかけます。"},{"title":"同類項をまとめる","formula":"3x − x + 6\n= (3 − 1)x + 6\n= 2x + 6","body":"同類項がとなりに来るように、項の順を入れかえます。x の係数は1なので、3x − x は 2x です。"},{"title":"数を入れて確かめる","formula":"x が 1 のとき\ny：1 + 2 = 3\nもとの式：3 × 3 − 1 = 8\n答えの式：2 × 1 + 6 = 8","body":"先に y を求めてからもとの式に入れた値と、答えの式に x を入れた値が、どちらも8になります。"}]}]}},"math-linear-eq":{"id":"math-linear-eq","name":"方程式","type":"learn","goal":"一次方程式を解き、文章題に使える。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","featured":true,"trunk":5,"check":"3x + 5 = 20 のとき、x を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"方程式は、まだわかっていない数を文字 x で表し、等号（=）で結んだ式です。式を成り立たせる x の値を「解」といい、解を求めることを「方程式を解く」といいます。等式は、両辺に同じ数を足しても、引いても、かけても、0でない同じ数で割っても成り立ちます。x も数を表すので、x を含む項を両辺から足したり引いたりしてもかまいません。この性質を使って、x だけが左辺に残る形に変えていきます。文章題では、求めたい数を x と置いて、問題文の関係を方程式に表します。","example":"2x + 7 = 15\n2x = 15 − 7\n2x = 8\nx = 4","note":"2行目では、左辺の +7 を符号を変えて右辺に移しています（移項）。x = 4 を元の式に入れると 2 × 4 + 7 = 15 で、成り立ちます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-letters","level":"must"}],"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別解で試して確認。文字を含む等式は数を二組入れて照合。前提の範囲（負の数、文字式、原点）と下流（平方根、一次関数）を確認し、指摘を反映した後に再検証。","title":"x の項を左に、数を右に集めて解く","lead":"文章題は、何を x と置くかを先に書く。","original":true,"problems":[{"label":"両辺に x がある方程式","question":"方程式 5x − 7 = 2x + 11 を解いてください。","answer":"x = 6","alternatives":[{"try":"x = 4/3","why_not":"5x − 2x = 11 − 7 としている。左辺の −7 を右辺に移すと、符号が変わって +7 になる。"},{"try":"x = 4/7","why_not":"5x + 2x = 11 − 7 としている。右辺の 2x を左辺に移すと −2x になり、左辺の −7 は右辺で +7 になる。移項した項は、どちらも符号を変える。"}],"steps":[{"title":"x の項を左辺に、数の項を右辺に移す","formula":"5x − 7 = 2x + 11\n5x − 2x = 11 + 7","body":"右辺の 2x を左辺に移すと −2x、左辺の −7 を右辺に移すと +7 になります。両辺から 2x を引き、両辺に7を足したのと同じです（移項）。"},{"title":"両辺をそれぞれまとめる","formula":"3x = 18","body":"左辺は x の係数どうしで 5 − 2 = 3、右辺は 11 + 7 = 18 です。"},{"title":"x の係数で両辺をわる","formula":"x = 18 ÷ 3\nx = 6","body":"両辺を3でわると、左辺は x だけになります。"},{"title":"もとの式に入れて確かめる","formula":"左辺：5 × 6 − 7 = 23\n右辺：2 × 6 + 11 = 23","body":"左辺と右辺がどちらも23になるので、x = 6 は解です。"}]},{"label":"かっこがあり、解が負の数になる方程式","question":"方程式 4(x + 3) = x − 6 を解いてください。","answer":"x = −6","alternatives":[{"try":"x = −3","why_not":"かっこをはずすときに、4 を 3 にかけ忘れて 4x + 3 = x − 6 としている。かっこの外の数は、中のすべての項にかける。"},{"try":"x = 6","why_not":"3x = −18 の両辺を3でわるときに、符号を落としている。負の数を正の数でわると、答えは負になる。"}],"steps":[{"title":"かっこをはずす","formula":"4(x + 3) = x − 6\n4x + 12 = x − 6","body":"かっこの外の4を、中の x と 3 の両方にかけます（分配法則）。"},{"title":"x の項を左辺に、数の項を右辺に移す","formula":"4x − x = −6 − 12","body":"右辺の x を左辺に移すと −x、左辺の +12 を右辺に移すと −12 になります。"},{"title":"両辺をそれぞれまとめる","formula":"3x = −18","body":"左辺は 4x − x = 3x です。右辺は (−6) − 12 で、負の数どうしの和と同じなので −18 です。"},{"title":"x の係数で両辺をわる","formula":"x = (−18) ÷ 3\nx = −6","body":"負の数を正の数でわるので、答えは負です。解が負の数になっても、方程式の解としては正しい答えです。"},{"title":"もとの式に入れて確かめる","formula":"左辺：4 × (−6 + 3) = −12\n右辺：−6 − 6 = −12","body":"負の数を代入するときは、かっこの中で先に計算します。−6 + 3 = −3 なので、左辺は 4 × (−3) で −12、右辺も −12 になり、成り立ちます。"}]},{"label":"配り方の違いから、人数を求める（過不足算）","question":"何人かの子どもに、みかんを配ります。1人に4個ずつ配ると7個余り、1人に6個ずつ配ると5個足りません。子どもの人数と、みかんの数を求めてください。","answer":"子どもは6人、みかんは31個","alternatives":[{"try":"4x − 7 = 6x + 5 として、x = −6","why_not":"余りと不足の符号を逆にしている。余るときは、配った数より7個多いので +7、足りないときは、配りたい数より5個少ないので −5。人数が負の数になったら、式の立て方を見直す。"},{"try":"子どもは6人、みかんは36個","why_not":"6人に6個ずつの 6 × 6 = 36 を、みかんの数にしている。6個ずつでは5個足りないので、みかんは 36 − 5 = 31 個。"}],"steps":[{"title":"求めたい数を x と置く","formula":"x：子どもの人数","body":"わからない数は人数とみかんの数の二つですが、人数がわかれば、みかんの数は計算で出せます。そこで、人数を x と置きます。"},{"title":"みかんの数を、二通りの式で表す","formula":"4個ずつ配るとき：4x + 7\n6個ずつ配るとき：6x − 5","body":"4個ずつ配ると、配った 4x 個より7個多くあるので 4x + 7 です。6個ずつ配るには 6x 個要りますが、5個足りないので、みかんは 6x − 5 個です。"},{"title":"みかんの数は同じなので、等号で結ぶ","formula":"4x + 7 = 6x − 5","body":"どちらの配り方でも、みかんの数そのものは変わりません。二つの式が同じ数を表しているので、方程式になります。"},{"title":"方程式を解く","formula":"4x − 6x = −5 − 7\n−2x = −12\nx = 6","body":"x の項を左辺に、数の項を右辺に移します。−2x = −12 の両辺を −2 でわると、負の数どうしのわり算なので答えは正で、x = 6 です。"},{"title":"みかんの数を求める","formula":"4 × 6 + 7 = 31","body":"4個ずつ配ったときの式 4x + 7 に、x = 6 を入れます。"},{"title":"もう一方の配り方でも確かめる","formula":"6 × 6 − 5 = 31","body":"6個ずつ配ったときの式でも31個になり、二つの条件の両方に合います。人数が1以上の整数になっていることも確かめます。"}]},{"label":"速さの違いから、道のりを求める","question":"家から駅まで歩きます。分速60mで歩くと、分速80mで歩くより5分多くかかります。家から駅までの道のりは何mでしょうか。","answer":"1,200m","alternatives":[{"try":"15m","why_not":"x と置いたのは、分速80mで歩くときにかかる時間（15分）。求めるのは道のりなので、速さ×時間で m に直す。"},{"try":"80(x + 5) = 60x として、x = −20","why_not":"5分多く時間がかかるのを、分速80mのほうにしている。遅いほうがかかる時間は長い。時間が負になったら、式の立て方を見直す。"},{"try":"60 × 15 = 900 として、900m","why_not":"分速60mで歩く時間は、分速80mのときより5分多い 15 + 5 = 20 分。60 × 20 = 1,200 で、80 × 15 と同じになる。"}],"steps":[{"title":"求めたい数の手がかりになる量を x と置く","formula":"x：分速80mで歩くときにかかる時間（分）","body":"道のりそのものを x と置くこともできますが、時間を x と置くと、かっこはあっても分数のない方程式になります。分速80mとは、1分間に80m進む速さです。"},{"title":"道のりを、二通りの式で表す","formula":"分速80mのとき：80x\n分速60mのとき：60(x + 5)","body":"1分間に進む道のりに、かかった時間をかけると、全体の道のりになります。分速60mで歩くと5分多くかかるので、時間は x + 5 分です。"},{"title":"道のりは同じなので、等号で結ぶ","formula":"60(x + 5) = 80x","body":"どちらの速さで歩いても、家から駅までの道のりは同じです。"},{"title":"かっこをはずして、方程式を解く","formula":"60x + 300 = 80x\n60x − 80x = −300\n−20x = −300\nx = 15","body":"かっこの外の60を、x と 5 の両方にかけます。x の項を左辺に、数の項を右辺に移し、両辺を −20 でわります。"},{"title":"時間から、道のりを求める","formula":"80 × 15 = 1,200","body":"x = 15 は時間（分）なので、答えではありません。分速80mで15分歩いた道のりを求めます。"},{"title":"分速60mのほうでも確かめる","formula":"60 × (15 + 5) = 1,200","body":"分速60mでは20分かかり、道のりは同じ1,200mになります。20分は15分より5分多く、問題の条件に合います。"}]}]}},"math-linear-fn":{"id":"math-linear-fn","name":"一次関数","type":"learn","goal":"2点や表から傾きと切片を求めて式を作り、グラフを書ける。","part_of":"math-school","tags":["jhmath","func"],"status":"verified","trunk":6,"check":"2点 (0, 1) と (2, 5) を通る直線の式を求める","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・練習問題・前提の範囲と照合。指摘を反映した後に再検証。","text":"y が x の一次式 y = ax + b で表されるとき、y は x の一次関数であるといいます。a は「傾き」で、x が1増えたときに y がどれだけ増えるかを表します。b は「切片」で、x = 0 のときの y の値です。グラフは直線になり、点（0, b）を通って、右へ1進むごとに上へ a 進みます（a が負のときは、下へ進みます。たとえば a = −4 なら下へ4）。x の増加量に対する y の増加量の割合を「変化の割合」といい、一次関数では傾き a に等しくなります。比例 y = ax は、b = 0 の特別な場合です。","example":"y = 2x + 3\nx = 0 のとき y = 3\nx = 1 のとき y = 5\nx = 2 のとき y = 7","note":"傾きは2、切片は3です。x が1増えるごとに、y は2ずつ増えています。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。確認問題を足した後に再検証。学習時間は同じまとまりの単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-proportion","level":"must"}],"assessment":{"question":"傾きが −2、切片が 4 の一次関数の式は？","options":["y = 4x − 2","y = −2x + 4","y = −2x − 4"],"answer":1,"explanation":"y = ax + b の a が傾き、b が切片なので、a = −2、b = 4 を入れて y = −2x + 4。1つ目は傾きと切片が入れ替わっている。3つ目は切片の符号が逆。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と図表だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の読み方を実際に試して確認。選択肢・別解ごとの理由、全段階の計算、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","title":"傾きと切片を求めて、式で表す","lead":"傾きは、x の増え方で y の増え方をわって求める。","original":true,"problems":[{"label":"2点を通る直線の式を求める","question":"y は x の一次関数で、グラフは点（2, 1）と点（5, 10）を通ります。y を x の式で表してください。また、グラフが y 軸と交わる点を答えてください。","answer":"y = 3x − 5、点（0, −5）","alternatives":[{"try":"y = 3x + 1","why_not":"x = 2 のときの y の値1を、切片にしている。切片は x = 0 のときの y の値で、(2, 1) から左へ2戻った所の値を求める。"},{"try":"y = (1/3)x + 1/3","why_not":"傾きを、x の増え方 ÷ y の増え方（3 ÷ 9）で求めている。傾きは、x が1増えたときの y の増え方なので、y の増え方 ÷ x の増え方（9 ÷ 3）。"}],"steps":[{"title":"x と y が、それぞれどれだけ増えたかを見る","formula":"x：2 から 5 へ、5 − 2 = 3 増える\ny：1 から 10 へ、10 − 1 = 9 増える","body":"グラフ上の2点を、左の点から右の点へたどります。"},{"title":"x が1増えたときの y の増え方（傾き）を求める","formula":"9 ÷ 3 = 3","body":"x が3増えると y は9増えるので、x が1増えるごとに y は3ずつ増えます。傾きは3で、式は y = 3x + b の形になります。"},{"title":"通る点の値を入れて、切片 b を求める","formula":"1 = 3 × 2 + b\n1 = 6 + b\nb = −5","body":"グラフは点（2, 1）を通るので、x = 2 のとき y = 1 です。y = 3x + b に入れると、b についての方程式になります。"},{"title":"式を書き、もう一つの点で確かめる","formula":"y = 3x − 5\n3 × 5 − 5 = 10","body":"x = 5 を入れると y = 10 になり、点（5, 10）も通ります。"},{"title":"グラフのかき方を言葉で確かめる","formula":"点（0, −5）から、右へ1進むごとに上へ3進む直線","body":"切片が −5 なので、グラフは y 軸と点（0, −5）で交わります。そこから右へ1、上へ3ずつ進むと、点（1, −2）、点（2, 1）を通ります。2点がわかれば、定規で結んで直線をかけます。"}]},{"label":"表の空欄を、一次関数の式から求める","question":"表1は、y が x の一次関数であるときの、x と y の値の一部です。ア、イに入る数を求めてください。","answer":"ア = −1、イ = 7","tables":[{"caption":"表1　x と y の値","rows":[["x","1","3","6","イ"],["y","9","5","ア","−3"]]}],"alternatives":[{"try":"ア = 1","why_not":"表の列ごとに、y が4ずつ減ると考えている。x は1から3へは2増えるが、3から6へは3増える。列の間隔が違うので、x が1増えたときの y の増え方で考える。"},{"try":"ア = 19","why_not":"傾きを 2 としている。x が増えると y は減っているので、傾きは負の数 −2。y = 2x + 7 では、x = 3 のとき y = 13 になり、表と合わない。"}],"steps":[{"title":"埋まっている2列から、傾きを求める","formula":"x：1 から 3 へ、2 増える\ny：9 から 5 へ、4 減る\n(−4) ÷ 2 = −2","body":"y が減っているので、y の増え方は −4 です。x が1増えるごとに、y は2ずつ減ります。傾きは −2 です。"},{"title":"切片を求めて、式を書く","formula":"9 = −2 × 1 + b\nb = 11\ny = −2x + 11","body":"x = 1 のとき y = 9 を、y = −2x + b に入れます。x = 3 を入れると −6 + 11 = 5 で、表と合います。"},{"title":"x = 6 を入れて、アを求める","formula":"−2 × 6 + 11 = −1","body":"x が3から6へ3増えるので、y は5から 2 × 3 = 6 減って −1 になる、と考えても同じです。"},{"title":"y = −3 となる x を、方程式で求める","formula":"−3 = −2x + 11\n2x = 14\nx = 7","body":"イは x の値なので、式の y に −3 を入れて、x についての方程式を解きます。x = 7 のとき −14 + 11 = −3 で、合っています。"}]},{"label":"料金のプランを比べる","question":"ある携帯電話の通話料金に、二つのプランがあります。プランAは基本料金が月1,200円で、通話1分ごとに20円かかります。プランBは基本料金が月3,000円で、通話1分ごとに8円かかります。1か月の料金が二つのプランで等しくなるのは、通話時間が何分のときでしょうか。また、それより長く通話するとき、料金が安いのはどちらのプランでしょうか。","answer":"150分のとき等しくなり、それより長いときはプランBが安い","alternatives":[{"try":"90分","why_not":"基本料金の差 1,800円 を、プランAの1分あたりの20円だけでわっている。通話が1分増えるごとに、二つのプランの料金の差は 20 − 8 = 12 円ずつ縮まるので、12でわる。"},{"try":"150分のとき等しくなり、それより長いときはプランAが安い","why_not":"基本料金が安いほうが、いつも安いと考えている。プランAは1分ごとの料金が高いので、通話が長くなるほど料金が早く増える。200分では、プランAが5,200円、プランBが4,600円。"}],"steps":[{"title":"通話時間を x 分として、料金を式で表す","formula":"プランA：y = 20x + 1200\nプランB：y = 8x + 3000","body":"料金 y 円は、基本料金に、1分ごとの料金 × 通話時間を足したものです。どちらも y は x の一次関数で、1分ごとの料金が傾き、基本料金が切片です。"},{"title":"料金が等しくなる x を、方程式で求める","formula":"20x + 1200 = 8x + 3000\n20x − 8x = 3000 − 1200\n12x = 1800\nx = 150","body":"二つの式の y が同じになる x を求めます。"},{"title":"150分のときの料金で確かめる","formula":"プランA：20 × 150 + 1200 = 4200\nプランB：8 × 150 + 3000 = 4200","body":"どちらも4,200円で、等しくなっています。"},{"title":"それより長いときに、どちらが安いかを傾きで比べる","formula":"通話が1分増えるごとに\nプランA：20円増える\nプランB：8円増える","body":"150分で料金が並んだあとは、傾きの小さいプランBのほうが、増え方がゆるやかです。150分より長いと、プランBが安くなります。たとえば200分では、プランAが 20 × 200 + 1200 = 5200 円、プランBが 8 × 200 + 3000 = 4600 円です。反対に150分より短いときは、基本料金の安いプランAが安くなります。"}]},{"label":"一次関数の性質を、言葉で見分ける","question":"一次関数 y = −3x + 6 について、正しいものを次のア〜エから一つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"x が1増えると、y は3増える","correct":false,"reason":"傾きは −3 なので、x が1増えると y は3減る。グラフは右下がりの直線になる。"},{"key":"イ","text":"グラフは y 軸と点（0, 6）で交わる","correct":true,"reason":"x = 0 を入れると y = 6 で、切片は6。グラフは y 軸上の点（0, 6）を通る。"},{"key":"ウ","text":"グラフは点（1, 9）を通る","correct":false,"reason":"x = 1 を入れると −3 + 6 = 3 なので、通るのは点（1, 3）。9 は、傾きを +3 と取りちがえたときの値。"},{"key":"エ","text":"x が2から4まで増えると、y は3減る","correct":false,"reason":"x が2増えているので、y は 3 × 2 = 6 減る。x = 2 のとき y = 0、x = 4 のとき y = −6 で、確かめられる。"}],"steps":[{"title":"傾きと切片を読む","formula":"y = −3x + 6\n傾き：−3　切片：6","body":"y = ax + b の a が傾き、b が切片です。x が1増えるごとに、y は3ずつ減ります。"},{"title":"選択肢の点に、x の値を入れて確かめる","formula":"x = 0 のとき y = 6\nx = 1 のとき y = 3\nx = 2 のとき y = 0\nx = 4 のとき y = −6","body":"アは、増え方の向きが逆です。ウは、x = 1 のとき y = 3 なので通りません。エは、y が0から −6 へ6減っています。正しいのはイだけです。"}]}]}},"math-muldiv":{"id":"math-muldiv","name":"かけ算わり算","type":"learn","goal":"九九を使って、筆算のかけ算とわり算ができる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":2,"check":"36 × 24 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"かけ算は、同じ数を何回も足す計算をまとめたものです。わり算はその逆で、ある数を同じ数ずつに分けると何個分になるか、または何個かに等しく分けると1個分がいくつになるかを求めます。1けたどうしのかけ算（九九）を覚えておくと、けた数の多い計算も位ごとに分けて筆算でできます。","example":"24 × 3 = 72\n72 ÷ 3 = 24\n17 ÷ 5 = 3 あまり 2","note":"かけ算の答えをかけた数で割ると、もとの数に戻ります。割り切れないときは、あまりが出ます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"72 ÷ 8 は？","options":["8","9","12"],"answer":1,"explanation":"8 × 9 = 72 なので、72 ÷ 8 = 9。"},"practice":{"title":"位ごとに分けて、かけ算とわり算をする","lead":"九九で求められる形に、分けてから計算する。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"2けた×1けたのかけ算","question":"37 × 6 を計算してください。","answer":"222","steps":[{"title":"かけられる数を、十の位と一の位に分ける","formula":"37 = 30 + 7","body":"37 × 6 は、30 × 6 と 7 × 6 を合わせたものです。分けると、九九をもとに計算できます。"},{"title":"一の位にかける","formula":"7 × 6 = 42","body":"九九の「七六 42」です。"},{"title":"十の位にかける","formula":"30 × 6 = 180","body":"十が3つの6倍なので、十が18個、つまり180です。九九の「三六 18」に0を一つ付けます。"},{"title":"二つの答えを足す","formula":"180 = 100 + 80\n80 + 42 = 122\n100 + 122 = 222","body":"180を100と80に分け、80と42を先に足します。けたが増えても、位ごとに足してくり上げるやり方は2けたのときと同じです。筆算では、42の「4」を十の位にくり上げて書きますが、していることは同じです。"},{"title":"わり算で、もとの数に戻るか確かめる","formula":"222 ÷ 6 = 37","body":"答えをかけた数で割ると、もとの37に戻ります（わり算の進め方は、3問目で扱います）。"}]},{"label":"2けた×2けたのかけ算","question":"43 × 25 を計算してください。","answer":"1,075","steps":[{"title":"かける数を、十の位と一の位に分ける","formula":"25 = 20 + 5","body":"43 × 25 は、43 × 5 と 43 × 20 を合わせたものです。筆算の1段目と2段目に当たります。"},{"title":"一の位の5をかける（筆算の1段目）","formula":"3 × 5 = 15\n40 × 5 = 200\n200 + 15 = 215","body":"43を40と3に分けて、それぞれに5をかけて足します。"},{"title":"十の位の20をかける（筆算の2段目）","formula":"43 × 2 = 86\n43 × 20 = 860","body":"20倍は、2倍してから10倍することと同じです。筆算で2段目を左に一つずらして書くのは、この10倍のためです。"},{"title":"1段目と2段目を足す","formula":"215 + 860 = 1,075","body":"5倍した分と20倍した分を合わせると、25倍になります。百の位は 200 + 800 = 1,000、十の位と一の位は 15 + 60 = 75 です。"},{"title":"分け方を変えて確かめる","formula":"4 × 25 = 100\n40 × 25 = 1,000\n3 × 25 = 75\n1,000 + 75 = 1,075","body":"今度は43の方を40と3に分けました。40倍は、4倍してから10倍します。4 × 25 は、25を4回足すと100です。同じ1,075になります。"}]},{"label":"あまりのあるわり算","question":"りんごが92個あります。1箱に6個ずつ入れると、箱は何箱できて、りんごは何個あまるでしょうか。","answer":"15箱できて、2個あまる","steps":[{"title":"場面を式で置く","formula":"92 ÷ 6","body":"92個を6個ずつに分けると何個分になるかを求めるので、わり算です。"},{"title":"十の位から割る","formula":"6 × 10 = 60\n92 − 60 = 32","body":"92の十の位は9です。9の中に6は1回入るので、まず10箱できます。10箱で60個を使い、32個が残ります。"},{"title":"残りを割る","formula":"6 × 5 = 30\n32 − 30 = 2","body":"32の中に6は5回入ります（六五 30）。6回だと36で、32を超えてしまいます。さらに5箱できて、2個が残ります。"},{"title":"箱の数とあまりをまとめる","formula":"10 + 5 = 15\n92 ÷ 6 = 15 あまり 2","body":"箱は合わせて15箱です。残りの2個は6個に足りないので、もう1箱は作れません。あまりは、いつも割る数より小さくなります。"},{"title":"かけ算とたし算で、もとの数に戻るか確かめる","formula":"6 × 15 = 90\n90 + 2 = 92","body":"箱に入れた分とあまりを合わせると、はじめの92個になります。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-negative":{"id":"math-negative","name":"正負の数","type":"learn","goal":"負の数を含む四則計算ができる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","trunk":4,"check":"(−3) × 4 − (−6) を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"0より小さい数を負の数といい、−3のように「−」をつけて表します。0より大きい数は正の数です。数直線では0を境に右が正、左が負で、右にある数ほど大きくなります。負の数を足すことは引くことと同じで、負の数を引くことは足すことと同じです。かけ算とわり算では、符号が同じ二つの数なら答えは正、違えば負になります。同じ数を2回かけることを2乗といい、(−3)² = (−3) × (−3) = 9 です。−3² は 3² に − をつけた −9 です。","example":"3 + (−5) = −2\n3 − (−5) = 8\n(−4) × (−2) = 8\n(−12) ÷ 4 = −3","note":"負の数は、かっこをつけて書くと、符号と計算の記号を見分けやすくなります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別解で試して確認。文字を含む等式は数を二組入れて照合。前提の範囲（負の数、文字式、原点）と下流（平方根、一次関数）を確認し、指摘を反映した後に再検証。","title":"符号を先に決めて、負の数を計算する","lead":"引き算は足し算に直し、かけ算とわり算は符号から決める。","original":true,"problems":[{"label":"足し算と引き算がまじった計算","question":"(−8) − (−3) + 6 − 11 を計算してください。","answer":"−10","alternatives":[{"try":"−8 − 3 + 6 − 11 = −16","why_not":"(−3) を引くことは、3 を足すことと同じ。− (−3) を − 3 としてしまうと、符号が逆になる。"},{"try":"10","why_not":"大きさの10は合っているが、負の数の合計（−19）の大きさが、正の数の合計（9）より大きいので、答えは負になる。"}],"steps":[{"title":"引き算を、足し算に直す","formula":"(−8) − (−3) + 6 − 11\n= (−8) + 3 + 6 + (−11)","body":"負の数を引くことは、その数の符号を変えて足すことと同じなので、− (−3) は + 3 です。正の数を引くことは、負の数を足すことと同じなので、− 11 は + (−11) です。これで、全部が足し算になります。"},{"title":"正の数どうし、負の数どうしをまとめる","formula":"正の数：3 + 6 = 9\n負の数：(−8) + (−11) = −19","body":"足し算だけの式は、順番を入れかえて足しても答えは変わりません。正の数と負の数に分けて、それぞれ合計します。負の数どうしの和は、大きさを足して − をつけます。"},{"title":"正の数の合計と、負の数の合計を足す","formula":"9 + (−19) = −10","body":"符号が違う二つの数の和は、大きさの差（19 − 9 = 10）に、大きさが大きい方の符号をつけます。−19 の方が大きさが大きいので、答えは負です。"},{"title":"左から順に計算して、同じ答えになるか確かめる","formula":"(−8) + 3 = −5\n(−5) + 6 = 1\n1 + (−11) = −10","body":"まとめ方を変えても、同じ −10 になります。"}]},{"label":"かけ算・わり算と、引き算がまじった計算","question":"18 ÷ (−3) − (−2) × (−5) を計算してください。","answer":"−16","alternatives":[{"try":"20","why_not":"左から順に、18 ÷ (−3) = −6、(−6) − (−2) = −4、(−4) × (−5) = 20 と計算している。かけ算とわり算は、引き算より先に計算する。"},{"try":"4","why_not":"(−2) × (−5) を −10 として、(−6) − (−10) = 4 としている。符号が同じ二つの数の積は正なので、10 になる。"}],"steps":[{"title":"先に計算するところを決める","formula":"18 ÷ (−3)　と　(−2) × (−5)","body":"式の中にかけ算・わり算と、足し算・引き算がまじっているときは、かけ算とわり算を先に計算します。この式では、18 ÷ (−3) と (−2) × (−5) の二か所です。"},{"title":"わり算をする","formula":"18 ÷ (−3) = −6","body":"正の数を負の数でわるので、符号が違い、答えは負です。大きさは 18 ÷ 3 で6です。"},{"title":"かけ算をする","formula":"(−2) × (−5) = 10","body":"負の数どうしのかけ算なので、符号が同じで、答えは正です。大きさは 2 × 5 で10です。"},{"title":"残った引き算をする","formula":"(−6) − 10 = (−6) + (−10) = −16","body":"10 を引くことは、−10 を足すことと同じです。負の数どうしの和なので、大きさの 6 + 10 = 16 に − をつけます。"}]},{"label":"分数をふくむわり算","question":"(−4/9) ÷ (2/3) を計算してください。答えは、それ以上約分できない分数で答えてください。","answer":"−2/3","alternatives":[{"try":"−8/27","why_not":"わる数の 2/3 の分母と分子を入れかえずに、そのままかけている。分数でわるときは、わる数の分母と分子を入れかえてかける。"},{"try":"2/3","why_not":"大きさは合っているが、負の数を正の数でわっているので、答えは負になる。"}],"steps":[{"title":"答えの符号を先に決める","formula":"（負の数）÷（正の数）→ 負","body":"わられる数は負、わる数は正で、符号が違うので、答えは負になります。ここから先は、大きさだけを計算します。"},{"title":"わる数の分母と分子を入れかえて、かける形にする","formula":"(4/9) ÷ (2/3) = (4/9) × (3/2)","body":"分数でわることは、わる数の分母と分子を入れかえた数（逆数）をかけることと同じです。"},{"title":"かけ算をして、約分する","formula":"(4/9) × (3/2) = 12/18 = 2/3","body":"分子どうし、分母どうしをかけて 12/18 です。分子と分母を6でわって 2/3 になります。"},{"title":"先に決めた符号をつける","formula":"(−4/9) ÷ (2/3) = −2/3","body":"大きさは 2/3 で、符号は負なので、−2/3 です。"}]},{"label":"基準との差から、平均を求める","question":"Aさん、Bさん、Cさん、Dさん、Eさんの5人が、同じテストを受けました。それぞれの点数を、60点を基準にして、基準より高い分を正の数、低い分を負の数で表すと、次のようになりました。\nA：+4　B：−6　C：+3　D：−9　E：+3\n5人の平均点は何点でしょうか。","answer":"59点","alternatives":[{"try":"61点","why_not":"差の平均 −1 を、+1 として60に足している。差の合計が負なので、平均は基準の60点より低くなる。"},{"try":"55点","why_not":"差の合計 −5 を、そのまま60に足している。−5 は5人分の合計なので、人数の5でわってから基準に足す。"}],"steps":[{"title":"平均の求め方と、基準を確かめる","formula":"平均 = 合計 ÷ 人数\n基準：60点\n人数：5人","body":"平均は、全員の点数の合計を人数でわった値です。それぞれの点数を全部出さなくても、基準との差だけを使って求められます。"},{"title":"基準との差を、全部足す","formula":"4 + (−6) + 3 + (−9) + 3\n正の数：4 + 3 + 3 = 10\n負の数：(−6) + (−9) = −15\n10 + (−15) = −5","body":"正の数どうし、負の数どうしをまとめて足します。差の合計が −5 なので、5人の点数の合計は、全員が60点だった場合より5点少ないということです。"},{"title":"差の合計を人数でわって、差の平均を出す","formula":"(−5) ÷ 5 = −1","body":"負の数を正の数でわるので、答えは負です。平均すると、基準より1点低いということです。"},{"title":"基準に、差の平均を足す","formula":"60 + (−1) = 59","body":"平均点は、基準の60点に差の平均を足して求めます。"},{"title":"点数を全部出して確かめる","formula":"A：60 + 4 = 64\nB：60 − 6 = 54\nC：60 + 3 = 63\nD：60 − 9 = 51\nE：60 + 3 = 63\n(64 + 54 + 63 + 51 + 63) ÷ 5 = 59","body":"点数の合計は295点で、5人でわると59点です。基準との差を使った答えと合います。基準との差を使うと、大きな数を5つ足すかわりに、小さな数を足すだけで済みます。"}]}]}},"math-probability":{"id":"math-probability","name":"確率","type":"learn","goal":"樹形図を書いて、場合の数と確率を求められる。","part_of":"math-school","tags":["jhmath","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"確率は、あることがらの起こりやすさを0から1までの数で表したものです。どの結果も同じ程度に起こると考えられるとき、「そのことがらが起こる場合の数 ÷ 起こり得るすべての場合の数」で求めます。すべての場合を漏れなく重なりなく数えるために、枝分かれの図（樹形図）や表を使います。必ず起こることの確率は1、決して起こらないことの確率は0です。","example":"さいころを1回投げて3の倍数の目が出る確率：2 ÷ 6 = 1/3\n硬貨を2回投げたときの出方：表表、表裏、裏表、裏裏 の4通り\n2回とも表が出る確率：1 ÷ 4 = 1/4","note":"3の倍数の目は3、6の2通り、すべての目は6通りです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"公平な6面サイコロで偶数が出る確率は？","options":["1/6","1/3","1/2"],"answer":2,"explanation":"同じ確からしさの6通りのうち、2・4・6の3通り。3/6 = 1/2。"},"practice":{"title":"すべての場合を書き出して、確率を求める","lead":"漏れなく、重なりなく数える。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"硬貨を3回投げる","question":"1枚の硬貨を3回投げます。表がちょうど2回出る確率を求めてください。表と裏の出やすさは同じとします。","answer":"3/8","steps":[{"title":"樹形図をかいて、すべての出方を書き出す","formula":"1回目が表：表表表、表表裏、表裏表、表裏裏\n1回目が裏：裏表表、裏表裏、裏裏表、裏裏裏","body":"1回目の表・裏からそれぞれ2本の枝を出し、2回目、3回目も同じように枝分かれさせます。枝を1回目から3回目までたどると、出方が一つ決まります。枝の先を上から順に書き出します。"},{"title":"すべての場合の数を数える","formula":"2 × 2 × 2 = 8","body":"1回ごとに2通りに枝分かれするので、枝の先は8本です。書き出した数とも合います。この8通りは、どれも同じ程度に起こります。"},{"title":"表がちょうど2回の出方を選ぶ","formula":"表表裏、表裏表、裏表表 → 3通り","body":"表表表は表が3回なので、「ちょうど2回」には入りません。"},{"title":"場合の数どうしを割って、確率を求める","formula":"3 ÷ 8 = 3/8","body":"確率は、そのことがらが起こる場合の数÷すべての場合の数です。"},{"title":"表の回数ごとに分けて、合計が8通りになるか確かめる","formula":"表が3回：1通り\n表が2回：3通り\n表が1回：3通り\n表が0回：1通り\n1 + 3 + 3 + 1 = 8","body":"表の回数で分けると、8通りがどれか一つに必ず入ります。合計が8になり、樹形図で書き出した数と合います。"}]},{"label":"さいころを2個投げる","question":"大小二つのさいころを同時に投げます。出た目の和が8になる確率を求めてください。どの目の出やすさも同じとします。","answer":"5/36","steps":[{"title":"すべての場合の数を数える","formula":"6 × 6 = 36","body":"大きいさいころの目6通りのそれぞれに、小さいさいころの目が6通りあります。縦6行、横6列の表にすると、ます目は36個です。"},{"title":"和が8になる組を、大きいさいころの目の順に書き出す","formula":"（大、小）＝（2、6）、（3、5）、（4、4）、（5、3）、（6、2）","body":"大きいさいころが1のとき、小さいさいころは7が必要ですが、7の目はありません。2から6までは、それぞれ1通りずつあります。"},{"title":"和が8になる場合の数を数える","formula":"和が8になる組：5通り","body":"（3、5）と（5、3）は、どちらのさいころがどの目かが違うので、別の場合として数えます。（4、4）は1通りだけです。"},{"title":"場合の数どうしを割って、確率を求める","formula":"5 ÷ 36 = 5/36","body":"5と36の両方を割り切る数は1しかないので、これ以上約分できません。"},{"title":"書き出した組の和を、一つずつ確かめる","formula":"2 + 6 = 8\n3 + 5 = 8\n4 + 4 = 8\n5 + 3 = 8\n6 + 2 = 8","body":"五つの組は、どれも和が8になっています。"}]},{"label":"袋から玉を2個取り出す","question":"袋の中に、赤い玉が2個、白い玉が3個入っています。この中から同時に2個を取り出すとき、2個とも白い玉である確率を求めてください。どの玉の取り出しやすさも同じとします。","answer":"3/10","steps":[{"title":"同じ色の玉にも、名前を付けて区別する","formula":"赤い玉：赤1、赤2\n白い玉：白1、白2、白3","body":"同じ色でも、別々の玉です。区別しないで数えると、どの場合も同じ程度に起こるとは言えなくなります。"},{"title":"2個の組を、樹形図で書き出す","formula":"赤1と組む：赤2、白1、白2、白3\n赤2と組む：白1、白2、白3\n白1と組む：白2、白3\n白2と組む：白3","body":"同時に取り出すので、「赤1と白1」と「白1と赤1」は同じ組です。すでに書いた組をもう一度書かないよう、後ろの玉とだけ組ませます。"},{"title":"すべての場合の数を数える","formula":"4 + 3 + 2 + 1 = 10","body":"2個の組は、全部で10通りです。"},{"title":"2個とも白い組を選ぶ","formula":"白1と白2、白1と白3、白2と白3 → 3通り","body":"書き出した10通りのうち、赤い玉を含まない組です。"},{"title":"場合の数どうしを割って、確率を求める","formula":"3 ÷ 10 = 3/10","body":"小数で表すと0.3です。"},{"title":"色の組み合わせごとに分けて、合計が10通りになるか確かめる","formula":"2個とも赤：1通り\n赤と白が1個ずつ：2 × 3 = 6\n2個とも白：3通り\n1 + 6 + 3 = 10","body":"赤と白が1個ずつの組は、赤2個のそれぞれに白3個を組ませるので6通りです。三つの場合を足すと10通りになり、書き出した数と合います。"}]}]}},"math-proportion":{"id":"math-proportion","name":"比例と反比例","type":"learn","goal":"比例と反比例を、式とグラフで表せる。","part_of":"math-school","tags":["jhmath","func"],"also_tags":["sansu"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"ともなって変わる二つの量 x と y があり、x が2倍、3倍になると y も2倍、3倍になる関係を比例といい、式は y = ax で表せます。ax は a × x を表します。反対に、x が2倍、3倍になると y が1/2、1/3になる関係を反比例といい、式は y = a/x で表せます。a は決まった数で、比例定数といいます。グラフでは、横の軸を x 軸、縦の軸を y 軸といい、二つが交わる点(0, 0)を原点といいます。比例のグラフは原点を通る直線、反比例のグラフは双曲線というなめらかな曲線になります。x が負の数のときも y = a/x のグラフはあり、もう一本の曲線になります（a が正なら右上と左下）。","example":"比例の例：y = 3x\n　x = 2 のとき y = 6、x = 4 のとき y = 12\n反比例の例：y = 12/x\n　x = 2 のとき y = 6、x = 4 のとき y = 3","note":"比例では x が0でないとき y ÷ x が、反比例では x × y が、いつも同じ値（比例定数）になります。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-ratio","level":"must"},{"id":"math-letters","level":"must"}],"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別解で試して確認。文字を含む等式は数を二組入れて照合。前提の範囲（負の数、文字式、原点）と下流（平方根、一次関数）を確認し、指摘を反映した後に再検証。","title":"比例定数を求めて、式とグラフで表す","lead":"比例は y ÷ x、反比例は x × y が一定になることを使う。","original":true,"problems":[{"label":"比例の式を求める","question":"y は x に比例し、x = 3 のとき y = 12 です。y を x の式で表し、x = 7 のときの y の値を求めてください。","answer":"y = 4x、x = 7 のとき y = 28","alternatives":[{"try":"x = 7 のとき y = 16","why_not":"x = 3 から x = 7 へ4増えたので、y も4増えて 12 + 4 = 16 としている。比例では、x が何倍になったかで y が決まる。y = 4x に x = 7 を入れると 28。"},{"try":"y = (1/4)x","why_not":"比例定数を x ÷ y（3 ÷ 12）で求めている。比例定数は y ÷ x で、12 ÷ 3 = 4。"}],"steps":[{"title":"比例の式の形を書く","formula":"y = ax","body":"y が x に比例するとき、式は y = ax の形で表せます。a は比例定数で、これから求めます。"},{"title":"わかっている x と y の組から、比例定数を求める","formula":"a = y ÷ x\n12 ÷ 3 = 4","body":"比例では、y ÷ x がいつも比例定数になります。x = 3、y = 12 を使うと、比例定数は4です。"},{"title":"式を書く","formula":"y = 4x","body":"y = ax の a に4を入れます。"},{"title":"x = 7 を入れて、y を求める","formula":"4 × 7 = 28","body":"y = 4x の x に7を入れると、y = 28 です。"},{"title":"グラフをかく点を決める","formula":"原点（0, 0）と、点（1, 4）を通る直線","body":"比例のグラフは原点を通る直線なので、原点ともう一つの点がわかればかけます。x = 1 のとき y = 4 なので、点（1, 4）を通ります。（1, 4）は、x の値が1、y の値が4の点という意味です。点（3, 12）と点（7, 28）も、この直線の上にあります。"}]},{"label":"反比例の式を求める","question":"y は x に反比例し、x = 5 のとき y = 8 です。y を x の式で表し、x = 10 のときの y の値を求めてください。","answer":"y = 40/x、x = 10 のとき y = 4","alternatives":[{"try":"y = 40/x、x = 10 のとき y = 16","why_not":"x が2倍になったので y も2倍になる、と比例の関係で考えている。反比例では、x が2倍になると y は1/2になる。"},{"try":"y = (8/5)x","why_not":"y ÷ x を求めて、比例の式にしている。反比例では x × y がいつも同じ値になり、それが比例定数。"}],"steps":[{"title":"反比例の式の形を書く","formula":"y = a/x","body":"y が x に反比例するとき、式は y = a/x の形で表せます。"},{"title":"わかっている x と y の組から、比例定数を求める","formula":"a = x × y\n5 × 8 = 40","body":"反比例では、x × y がいつも比例定数になります。x = 5、y = 8 を使うと、比例定数は40です。"},{"title":"式を書く","formula":"y = 40/x","body":"y = a/x の a に40を入れます。"},{"title":"x = 10 を入れて、y を求める","formula":"40 ÷ 10 = 4","body":"y = 40/x の x に10を入れると、y = 4 です。x が5から10へ2倍になり、y は8から4へ1/2になっているので、反比例の関係に合います。"},{"title":"グラフの形を確かめる","formula":"点（5, 8）、点（8, 5）、点（10, 4）を通る曲線","body":"x と y をかけるといつも40になる点を、なめらかな曲線で結びます。反比例のグラフは直線にならず、x が大きくなるほど y は0に近づきます。"}]},{"label":"グラフが原点を通る直線になるものを選ぶ","question":"次のア〜エで、y を x の式で表したとき、グラフが原点を通る直線になるものを一つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"1本60円の鉛筆を x 本買ったときの代金 y 円","correct":true,"reason":"式は y = 60x で、y は x に比例する。比例のグラフは原点を通る直線になる。"},{"key":"イ","text":"面積が24cm²の長方形の、縦の長さ x cm と横の長さ y cm","correct":false,"reason":"縦 × 横 = 24 なので、式は y = 24/x で、y は x に反比例する。グラフは直線ではなく、なめらかな曲線になる。"},{"key":"ウ","text":"全部で100ページの本を x ページ読んだときの、残りのページ数 y","correct":false,"reason":"式は y = 100 − x。x が増えると y は減るが、x が2倍になっても y は1/2にならないので、比例でも反比例でもない。x = 0 のとき y = 100 なので、グラフは原点を通らない。"},{"key":"エ","text":"1辺が x cm の正方形の面積 y cm²","correct":false,"reason":"式は y = x × x。x が2倍になると y は4倍になるので、比例ではない。x = 1 のとき y = 1、x = 2 のとき y = 4、x = 3 のとき y = 9 で、点を結んでも一本の直線にはならない。"}],"steps":[{"title":"それぞれ、y を x の式で表す","formula":"ア：y = 60x\nイ：y = 24/x\nウ：y = 100 − x\nエ：y = x × x","body":"代金 = 1本の値段 × 本数、横 = 面積 ÷ 縦、残り = 全体 − 読んだ分、正方形の面積 = 1辺 × 1辺 です。"},{"title":"y = ax の形になっているものを探す","formula":"y = ax の形：ア（a = 60）","body":"グラフが原点を通る直線になるのは、比例 y = ax のときです。イは y = a/x の形で、反比例です。ウとエは、どちらの形でもありません。"},{"title":"x が2倍になったときの y で確かめる","formula":"ア：x が1から2で、y は60から120（2倍）\nイ：x が2から4で、y は12から6（1/2）\nウ：x が10から20で、y は90から80\nエ：x が1から2で、y は1から4（4倍）","body":"x が2倍になると y も2倍になるのは、アだけです。答えはアです。"}]},{"label":"かみ合う歯車の回転数を求める","question":"歯の数が24の歯車Aと、歯の数が36の歯車Bが、かみ合って回っています。Aが1分間に15回転するとき、Bは1分間に何回転するでしょうか。","answer":"10回転","alternatives":[{"try":"22.5回転","why_not":"15 × 36 ÷ 24 と、歯の数が多いほど回転数も多くなる（比例）と考えている。歯の数が多い歯車は、1回転で多くの歯を送るので、回転数は少なくなる。"},{"try":"360回転","why_not":"1分間にかみ合う歯の数（24 × 15 = 360）を、そのまま回転数にしている。Bの回転数は、360をBの歯の数36でわる。"}],"steps":[{"title":"1分間にかみ合う歯の数を求める","formula":"24 × 15 = 360","body":"Aは1回転で24個の歯を送り出します。1分間に15回転するので、1分間に送り出す歯は360個です。"},{"title":"Bでも、1分間にかみ合う歯の数は同じになる","formula":"Bの歯の数 × Bの回転数 = 360","body":"かみ合っている歯車は、Aの歯が1つ進むと、Bの歯も1つ進みます。そのため、1分間に進む歯の数は、AとBで同じ360個です。"},{"title":"歯の数と回転数が、反比例になっていることを確かめる","formula":"歯の数 x、1分間の回転数 y\ny = 360/x","body":"x × y がいつも360なので、Aとかみ合う歯車の回転数 y は、その歯車の歯の数 x に反比例します。歯の数が2倍の歯車なら、回転数は1/2になります。"},{"title":"Bの歯の数を入れて、回転数を求める","formula":"360 ÷ 36 = 10","body":"y = 360/x の x に36を入れると、y = 10 です。"},{"title":"かみ合う歯の数で確かめる","formula":"36 × 10 = 360","body":"Bが1分間に10回転すると、送る歯は360個で、Aと同じです。歯の数が多いBのほうが、回転数は少なくなっています。"}]}]}},"math-pythagoras":{"id":"math-pythagoras","name":"三平方の定理","type":"learn","goal":"直角三角形の辺の長さを求められる。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形で、直角をはさむ二辺の長さを a、b、直角の向かいにあるいちばん長い辺（斜辺）の長さを c とすると、a² + b² = c² が成り立ちます。これを三平方の定理といいます。二辺の長さがわかれば、残りの一辺の長さを求められます。逆に、三辺の長さがこの式を満たす三角形は、直角三角形です。","example":"a = 3、b = 4 のとき\n3² + 4² = 9 + 16 = 25\nc² = 25 なので c = 5","note":"辺の長さが3、4、5の三角形は、直角三角形です。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-congruence","level":"helps"}]},"math-quadratic-eq":{"id":"math-quadratic-eq","name":"二次方程式","type":"learn","goal":"因数分解と解の公式で、二次方程式を解ける。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"移項して整理すると ax² + bx + c = 0（a は0でない）の形になる方程式を、二次方程式といいます。x の2乗の項があるのが特徴で、解はふつう二つあります。左辺を因数分解できるときは、「二つの数をかけて0になるなら、どちらかは0」という性質を使って解きます。因数分解できないときは、解の公式に a、b、c の値を当てはめて求めます。","example":"x² − 5x + 6 = 0\n(x − 2)(x − 3) = 0\nx = 2、x = 3\n解の公式：x = (−b ± √(b² − 4ac)) ÷ (2a)","note":"x = 2 のとき 4 − 10 + 6 = 0、x = 3 のとき 9 − 15 + 6 = 0 となり、どちらも式を成り立たせます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-sqrt","level":"must"}]},"math-quadratic-fn":{"id":"math-quadratic-fn","name":"二次関数","type":"learn","goal":"放物線のグラフを書き、変化の割合を求められる。","part_of":"math-school","tags":["jhmath","func"],"status":"draft","featured":true,"trunk":7,"check":"y = 2x² で、x が 1 から 3 まで増えるときの変化の割合を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"y が x の2乗に比例し、y = ax² の形で表される関数です。グラフは原点を頂点とし、y 軸について左右対称な「放物線」というなめらかな曲線になります。a が正なら上に開き、a が負なら下に開きます。一次関数と違い、x が1増えたときの y の増え方は一定ではありません。x の増加量に対する y の増加量の割合を「変化の割合」といい、区間ごとに計算します。","example":"y = 3x²\nx = 1 のとき y = 3\nx = 2 のとき y = 12\nx = 3 のとき y = 27\nx が1から3まで増えるときの変化の割合：(27 − 3) ÷ (3 − 1) = 12","note":"x が1から2では y は9増え、2から3では15増えます。増え方が一定でないことがわかります。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-fn","level":"must"},{"id":"math-quadratic-eq","level":"helps"}]},"math-ratio":{"id":"math-ratio","name":"割合と比","type":"learn","goal":"百分率と比を使って、もとの量や比べる量を求められる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"割合は、ある量が基準の量の何倍にあたるかを表す数です。「比べる量 ÷ 基準の量」で求め、0.25を25%（百分率）のように表します。比は、二つの量の大きさの関係を「3：2」のように並べて表したものです。どちらも、何を基準にしているかを先に確かめることが大切です。","example":"割合を求める：30 ÷ 120 = 0.25\n比べる量を求める：120 × 0.25 = 30\n基準の量を求める：30 ÷ 0.25 = 120\n比を簡単にする：6：4 は 3：2 と同じ","note":"上の三つの式は、「120人のうちの30人は25%」という同じ関係を表しています。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"800円の15%はいくら？","options":["120円","150円","680円"],"answer":0,"explanation":"15% = 0.15。800 × 0.15 = 120円。"},"practice":{"title":"基準を確かめて、割合と比で求める","lead":"何を1（100%）とするかを、先に決める。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"比べる量を求める","question":"定員240人の会場に、定員の85%にあたる人が入場しました。入場したのは何人でしょうか。","answer":"204人","steps":[{"title":"基準の量と割合を置く","formula":"基準の量：240人（定員）\n割合：85%\n求めるもの：比べる量（入場した人数）","body":"「定員の85%」なので、基準（100%）は定員の240人です。"},{"title":"百分率を小数に直す","formula":"85 ÷ 100 = 0.85","body":"百分率は、基準の量を100としたときに、比べる量がいくつにあたるかを表す数です。計算に使うときは、100で割って小数に直します。"},{"title":"基準の量に割合をかける","formula":"240 × 0.85 = 204","body":"比べる量は、基準の量×割合で求めます。"},{"title":"求めた人数が、定員の85%になっているか確かめる","formula":"204 ÷ 240 = 0.85","body":"入場した人数を定員で割ると0.85で、85%です。100%より小さい割合なので、答えが定員より少ないことも合っています。"}]},{"label":"基準の量を求める","question":"ある本を72ページ読みました。これは、本全体のページ数の40%にあたります。本全体は何ページでしょうか。","answer":"180ページ","steps":[{"title":"わかっている量と割合を置く","formula":"比べる量：72ページ（読んだ分）\n割合：40%\n求めるもの：基準の量（全体のページ数）","body":"「全体の40%」なので、基準は全体のページ数です。今回は、その基準の方がわかっていません。"},{"title":"関係を、言葉の式で表す","formula":"全体 × 0.4 = 72","body":"40%は小数で0.4です。全体に0.4をかけると、読んだ72ページになります。"},{"title":"比べる量を割合で割って、全体を求める","formula":"72 ÷ 0.4 = 180","body":"かけ算の逆なので、72を0.4で割ります。72 × 0.4 としてしまうと、72ページより少なくなり、全体のページ数になりません。"},{"title":"全体の40%が、72ページになるか確かめる","formula":"180 × 0.4 = 72","body":"180ページの40%は72ページで、問題の条件に合います。"}]},{"label":"比で分ける","question":"赤いリボンと白いリボンの長さの比は 3：5 で、合わせると120cmです。赤いリボンは何cmでしょうか。","answer":"45cm","steps":[{"title":"比と、合計の長さを置く","formula":"赤：白 = 3：5\n合計の長さ：120cm","body":"比の 3：5 は、赤を3つ分とすると白が5つ分になる、という関係です。1つ分の長さはまだわかりません。"},{"title":"合計が、いくつ分にあたるかを求める","formula":"3 + 5 = 8","body":"赤の3つ分と白の5つ分を合わせると、全体は8つ分です。"},{"title":"1つ分の長さを求める","formula":"120 ÷ 8 = 15","body":"8つ分が120cmなので、1つ分は15cmです。"},{"title":"赤いリボンの長さを求める","formula":"15 × 3 = 45","body":"赤は3つ分です。"},{"title":"白の長さも求めて、合計と比を確かめる","formula":"15 × 5 = 75\n45 + 75 = 120","body":"赤45cmと白75cmで、合わせて120cmです。45と75をどちらも15で割ると3と5になり、比も 3：5 に合います。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-fractions-decimals","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-shapes":{"id":"math-shapes","name":"形と長さ","type":"learn","goal":"基本の図形を見分け、ものさしで長さを測れる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"身の回りの形は、辺（まっすぐな線）と頂点（かど）の数で見分けられます。三角形は辺が3本、四角形は辺が4本です。四つのかどがすべて直角の四角形を長方形、さらに辺の長さがすべて等しいものを正方形といいます。長さは、ものさしの目盛りを使って、cm（センチメートル）やmm（ミリメートル）の単位で測ります。","example":"三角形：辺3本、頂点3個\n四角形：辺4本、頂点4個\n1cm = 10mm\n1m = 100cm","note":"単位をそろえると、長さどうしを比べたり足したりできます。"},"cost":{"hours":8,"yen":0}},"math-similarity":{"id":"math-similarity","name":"相似","type":"learn","goal":"相似条件を使って、辺の長さの比を求められる。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"一方の図形を、形を変えずに拡大または縮小するともう一方とぴったり重なるとき、二つの図形は相似であるといい、記号 ∽ で表します。相似な図形では、対応する辺の長さの比がすべて等しく、対応する角の大きさはそれぞれ等しくなります。対応する辺の長さの比を相似比といいます。三角形は、次のどれか一つが成り立てば相似だと言えます。三組の辺の比がすべて等しい。二組の辺の比とその間の角がそれぞれ等しい。二組の角がそれぞれ等しい。","example":"△ABC ∽ △DEF、相似比 1：2\nAB = 3 のとき DE = 6\nBC = 4 のとき EF = 8","note":"相似比が1：2なら、△DEF の辺は、対応する △ABC の辺のどれも2倍の長さです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-congruence","level":"must"}]},"math-simultaneous":{"id":"math-simultaneous","name":"連立方程式","type":"learn","goal":"加減法と代入法で、連立方程式を解ける。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの文字 x と y を含む方程式を二つ組にしたものを、連立方程式といいます。方程式が一つだけでは x と y の組は一つに決まりませんが、二つの式を同時に成り立たせる組は、ふつう一つに決まります。その組を連立方程式の解といいます。解くときは、二つの式を足したり引いたりして文字を一つ消す加減法か、一方の式をもう一方に代入して文字を一つ消す代入法を使います。","example":"x + y = 5　…①\nx − y = 1　…②\n①と②を足すと 2x = 6 なので x = 3\n①に x = 3 を代入すると 3 + y = 5 なので y = 2","note":"x = 3、y = 2 は、①と②の両方を成り立たせます。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"}],"practice":{"title":"二つの式から、二つの数を求める","lead":"文字を一つ消してから、一つずつ求める。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"代入法で解く","question":"次の連立方程式を解いてください。\ny = 2x + 1　…①\n3x + y = 16　…②","answer":"x = 3、y = 7","steps":[{"title":"二つの式の形を見て、解き方を決める","formula":"y = 2x + 1　…①\n3x + y = 16　…②","body":"①は「y =」の形になっています。②の y を①の右辺で置きかえれば、y が消えて x だけの式になります。この方法が代入法です。"},{"title":"①を②に代入する","formula":"3x + (2x + 1) = 16","body":"②の y のところに、①の右辺 2x + 1 をかっこをつけて入れます。"},{"title":"x だけの方程式を解く","formula":"5x + 1 = 16\n5x = 15\nx = 3","body":"x の項どうしをまとめます（3x + 2x = 5x）。+1 を右辺に移項し、両辺を5で割ります。"},{"title":"x = 3 を①に戻して、y を求める","formula":"y = 2 × 3 + 1\ny = 7","body":"①は y を求める形になっているので、①に入れるのが簡単です。"},{"title":"求めた組が、②も成り立たせるか確かめる","formula":"3 × 3 + 7 = 16","body":"y は①から求めたので、①は成り立っています。②に入れても成り立つので、x = 3、y = 7 が解です。"}]},{"label":"加減法で解く","question":"次の連立方程式を解いてください。\n2x + 3y = 12　…①\n3x − 2y = 5　…②","answer":"x = 3、y = 2","steps":[{"title":"二つの式の形を見て、解き方を決める","formula":"2x + 3y = 12　…①\n3x − 2y = 5　…②","body":"どちらの式も「x =」「y =」の形ではないので、式どうしを足し引きして文字を消す加減法を使います。そのままでは x も y も係数がそろっていません。"},{"title":"y の係数をそろえるため、①を2倍、②を3倍する","formula":"4x + 6y = 24　…①×2\n9x − 6y = 15　…②×3","body":"等式の両辺に同じ数をかけても、等式は成り立ちます。右辺にもかけ忘れないようにします。y の係数が +6 と −6 になり、符号だけが逆なので、足すと消えます。"},{"title":"二つの式を足して、x を求める","formula":"(4x + 6y) + (9x − 6y) = 24 + 15\n13x = 39\nx = 3","body":"左辺どうし、右辺どうしを足します。x の項どうしをまとめると 4x + 9x = 13x、6y と −6y は打ち消し合い、x だけの式になります。"},{"title":"x = 3 を①に戻して、y を求める","formula":"2 × 3 + 3y = 12\n3y = 6\ny = 2","body":"もとの式のどちらに入れてもかまいません。ここでは①に入れます。"},{"title":"求めた組が、二つの式を成り立たせるか確かめる","formula":"2 × 3 + 3 × 2 = 12\n3 × 3 − 2 × 2 = 5","body":"①と②の両方が成り立つので、x = 3、y = 2 が解です。"}]},{"label":"文章から式を二つ立てる","question":"1個120円のりんごと1個80円のみかんを、合わせて15個買いました。代金の合計は1,440円でした。りんごとみかんを、それぞれ何個買ったでしょうか。","answer":"りんごは6個、みかんは9個","steps":[{"title":"求めたい二つの数を x、y と置く","formula":"x：りんごの個数\ny：みかんの個数","body":"わからない数が二つあるので、文字を二つ使います。"},{"title":"個数の関係と、代金の関係を式にする","formula":"x + y = 15　…①\n120x + 80y = 1,440　…②","body":"問題文には、個数の合計と代金の合計の二つの条件があります。条件一つにつき、式を一つ立てます。"},{"title":"y の係数をそろえるため、①を80倍する","formula":"80x + 80y = 1,200　…①×80","body":"②の y の係数は80です。①の両辺を80倍すると、y の係数がそろいます。"},{"title":"②から、80倍した①を引いて、x を求める","formula":"(120x + 80y) − (80x + 80y) = 1,440 − 1,200\n40x = 240\nx = 6","body":"左辺どうし、右辺どうしを引きます。120x − 80x = 40x、80y − 80y = 0 となり、x だけの式になります。式どうしを引くので、加減法です。"},{"title":"x = 6 を①に戻して、y を求める","formula":"6 + y = 15\ny = 9","body":"係数の小さい①に入れると、計算が簡単です。"},{"title":"個数と代金の両方で確かめる","formula":"6 + 9 = 15\n120 × 6 + 80 × 9 = 1,440","body":"合わせて15個、代金は1,440円で、どちらの条件にも合います。個数として0以上の整数になっていることも確かめます。"}]}]}},"math-sqrt":{"id":"math-sqrt","name":"平方根","type":"learn","goal":"根号を含む式の計算ができる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"2乗すると a になる数を、a の平方根といいます。正の数の平方根は正と負の二つあり、9の平方根は3と−3です。a の平方根のうち正のほうを、記号 √（ルート）を使って √a と書き、負のほうは −√a と書きます。たとえば √9 = 3 です。2の平方根は整数や分数で表せないので、√2 と −√2 のまま書きます。√2 は約1.414で、小数がどこまでも続く数です。√ の中の数に、ある数の2乗がかけ算の形で含まれていれば、その数を √ の外に出して簡単にできます。","example":"√9 = 3\n√12 = √(4 × 3) = 2√3\n√2 × √3 = √6\n3√2 + 2√2 = 5√2","note":"√12 の中の4は2の2乗なので、2として外に出せます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-negative","level":"must"}]},"math-table":{"id":"math-table","name":"表とグラフ","type":"learn","goal":"表にまとめ、棒グラフと折れ線グラフを読める。","part_of":"math-school","tags":["sansu","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表は、調べたことを項目ごとに整理して数を並べたものです。棒グラフは棒の長さで数量の大小を比べるのに向いています。折れ線グラフは点を線で結んだもので、時間とともに変わる様子を見るのに向いています。どちらのグラフも、縦の軸の1目盛りがいくつを表すかを最初に確かめてから読みます。","example":"月：4月、5月、6月\n来客数：120人、150人、135人\n4月から5月：150 − 120 = 30（30人増えた）\n5月から6月：150 − 135 = 15（15人減った）","note":"折れ線グラフにすると、5月が山になる形になります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-addsub","level":"must"},{"id":"math-muldiv","level":"helps"}],"assessment":{"question":"販売数は月曜12個、火曜18個、水曜15個。最も多い曜日は？","options":["月曜","火曜","水曜"],"answer":1,"explanation":"同じ単位の値を比較する。18個の火曜が最大。"},"practice":{"title":"表にまとめ、グラフから数を読み取る","lead":"見出しと1目盛りの大きさを、先に確かめる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"調べた結果を表にまとめる","question":"12人に好きな果物を一つずつたずねたところ、答えは順に次のとおりでした。\nりんご、みかん、りんご、ぶどう、みかん、りんご、りんご、ぶどう、みかん、りんご、みかん、りんご\n果物ごとの人数を表にまとめてください。いちばん多いのはどの果物で、何人でしょうか。","answer":"りんごが6人でいちばん多い（みかん4人、ぶどう2人）","steps":[{"title":"表の項目を決める","formula":"項目：りんご、みかん、ぶどう\n数えるもの：人数","body":"答えに出てくる果物は3種類です。果物を行の見出しにして、人数を書く列を作ります。"},{"title":"答えを前から一つずつ見て、数える","formula":"りんご：1、3、6、7、10、12番目 → 6人\nみかん：2、5、9、11番目 → 4人\nぶどう：4、8番目 → 2人","body":"前から順に見て、果物ごとに何番目の答えかを書き出します。数え終わった答えに印を付けていくと、数え落としや二重に数えることを防げます。"},{"title":"表に書き、合計がたずねた人数と合うか確かめる","formula":"果物 | 人数\nりんご | 6\nみかん | 4\nぶどう | 2\n合計 | 12\n6 + 4 + 2 = 12","body":"数えた人数を表に書き、いちばん下に合計の行を付け加えます。3種類の人数を足すと12人で、たずねた人数と同じです。合わなければ、どこかで数え間違えています。"},{"title":"表から、いちばん多い果物を読み取る","formula":"6人、4人、2人のうち、いちばん大きい数：6人","body":"表にまとめると、人数を見比べるだけで答えられます。いちばん多いのは、りんごの6人です。"}]},{"label":"棒グラフの目盛りを読む","question":"ある店で売れたパンの数を、曜日ごとに表した棒グラフがあります。縦の軸は1目盛りが10個を表しています。月曜の棒は目盛り7つ分、火曜の棒は目盛り4つ分の高さです。月曜と火曜に売れた数は、それぞれ何個でしょうか。また、どちらが何個多いでしょうか。","answer":"月曜は70個、火曜は40個で、月曜が30個多い","steps":[{"title":"縦の軸の1目盛りが、いくつを表すか確かめる","formula":"1目盛り：10個","body":"棒グラフを読むときは、最初に1目盛りの大きさを確かめます。1目盛りが1個とは限りません。"},{"title":"月曜の棒の高さを、個数に直す","formula":"目盛り7つ分 → 10が7つで、70個","body":"1目盛りが10個なので、目盛り7つ分は70個です。7個と読み間違えないようにします。"},{"title":"火曜の棒の高さを、個数に直す","formula":"目盛り4つ分 → 10が4つで、40個","body":"同じように、目盛り4つ分は40個です。"},{"title":"二つの数を比べて、差を求める","formula":"70 − 40 = 30","body":"棒が高い月曜の方が多く売れています。差は30個です。"},{"title":"目盛りの数の差からも確かめる","formula":"7 − 4 = 3\n目盛り3つ分 → 10が3つで、30個","body":"棒の高さの差は目盛り3つ分で、30個です。先に求めた差と合います。"}]},{"label":"折れ線グラフの変化を読む","question":"ある図書室の、月ごとの貸し出し冊数を表した折れ線グラフがあります。グラフから読み取った数は表のとおりです。前の月と比べて、冊数がいちばん大きく増えたのは何月で、何冊増えたでしょうか。","answer":"7月で、6月から23冊増えた","tables":[{"caption":"折れ線グラフから読み取った貸し出し冊数（冊）","rows":[["月","4月","5月","6月","7月","8月"],["冊数","42","55","48","71","64"]]}],"steps":[{"title":"となり合う月どうしを比べると決める","formula":"比べる組：4月と5月、5月と6月、6月と7月、7月と8月","body":"「前の月と比べて」の増え方をたずねているので、となり合う月どうしを比べます。折れ線グラフでは、線が右上がりなら増え、右下がりなら減っています。傾きが急なほど、変化が大きくなります。"},{"title":"増えたか減ったかを、組ごとに見分ける","formula":"4月から5月：42 → 55（増えた）\n5月から6月：55 → 48（減った）\n6月から7月：48 → 71（増えた）\n7月から8月：71 → 64（減った）","body":"増えたのは、5月と7月の二回です。"},{"title":"増えた二回について、増えた冊数を求める","formula":"55 − 42 = 13\n71 − 48 = 23","body":"後の月の冊数から、前の月の冊数を引きます。"},{"title":"増えた冊数を比べる","formula":"13冊と23冊のうち、大きい方：23冊","body":"いちばん大きく増えたのは、6月から7月にかけての23冊です。"},{"title":"増減を順にたどって、8月の冊数になるか確かめる","formula":"55 − 48 = 7\n71 − 64 = 7\n42 + 13 − 7 + 23 − 7 = 64","body":"減った分は、前の月の冊数から後の月の冊数を引いて求めます。減った二回は、どちらも7冊です。4月の42冊から増減を順にたどると、表の8月の64冊と合います。"}]}]}},"shu-company":{"id":"shu-company","name":"企業研究","type":"do","goal":"業界と企業を調べ、事業、働き方、待遇などの比べる軸で、複数の企業を表に整理して比べられる。","part_of":"shukatsu","status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省（ジョブ・カード、若者雇用促進法）、ハローワーク、就職情報サイトの記述と照合。指摘を反映した後に再検証。","text":"企業研究は、応募する企業を選び、志望する理由を言えるようにするために、業界と企業を調べて比べる作業です。最初に業界を調べて、その業界がだれに何を売って利益を上げているか、どんな会社が並んでいるかをつかみます。次に、気になる企業を同じ業界の別の会社と並べて、同じ軸で比べます。軸には、事業（何を、だれに売っているか）、働き方（勤務地や転勤、残業、休日）、待遇（初任給、手当）、育成（研修）などがあります。一社ずつばらばらに調べると、どこが違うのかが見えません。表の行に軸、列に企業を置いて埋めると、違いと、まだ調べていない欄がわかります。情報は、企業の採用ページや会社説明会、上場企業なら投資家向けの資料（有価証券報告書など）、学校のキャリアセンター、就職情報サイトから集めます。","example":"比べる表の形（行が軸、列が企業）\n軸：事業の中身、主な顧客、勤務地と転勤、年間休日、初任給、研修\n空いた欄：説明会の質問や、OB・OG訪問で確かめる","note":"新卒者を募集する企業は、若者雇用促進法により、応募者や応募しようとする人から求められたときは、「募集・採用に関する状況」「職業能力の開発・向上に関する取組の実施状況」「職場への定着の促進に関する取組の実施状況」の三つの類型について、それぞれ一つ以上の情報を提供しなければなりません（厚生労働省の資料による）。学習時間は、調べ方を身につけて、最初の数社を表にまとめるまでの目安です。応募する企業が増えれば、そのぶん時間がかかります。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":15,"yen":0},"assessment":{"question":"企業研究で、複数の企業を比べる表を作るときの置き方として、違いがいちばん見えやすいのはどれでしょうか。","options":["すべての企業を、同じ軸（事業、働き方、待遇など）で埋める","企業ごとに、その会社の採用ページで強調されている点だけを書き写す","いちばん志望度の高い企業だけを詳しく書き、ほかの企業は社名だけにする"],"answer":0,"explanation":"同じ軸で埋めると、軸ごとに企業を横に見比べられ、空いた欄で調べ残しもわかります。採用ページの強調点は会社ごとに違うので、書き写すだけでは同じ物差しで比べられません。一社だけ詳しく書いても、ほかと比べられないので違いは見えません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、好みや流派で答えが割れないかを、就職情報サイトとハローワーク・厚生労働省の資料の記述と照らして確認。制度（若者雇用促進法の職場情報）は厚生労働省の資料で確認。指摘を反映した後に再検証。","title":"比べる軸で情報を整理し、表から言えることを読み取る","lead":"一社ずつ調べず、同じ軸で並べる。表から言えることと、表だけでは言えないことを分ける。","original":true,"problems":[{"label":"情報を、比べる軸に振り分ける","question":"企業研究で集めた次の情報のうち、「働き方」の軸に入るものはどれでしょうか。軸は、事業（何を、だれに売っているか）、働き方（勤務地や転勤、残業、休日）、待遇（初任給、手当）の三つとします。","answer":"B","kind":"choice","options":[{"key":"A","text":"主な取引先は、国内の自動車メーカーである。","correct":false,"reason":"だれに売っているかの情報なので、事業の軸に入る。"},{"key":"B","text":"前の年度の、月平均の残業時間は約20時間だった。","correct":true,"reason":"残業は、働き方の軸に挙げた項目に当たる。"},{"key":"C","text":"大学卒の初任給は、月額24万円である。","correct":false,"reason":"初任給は、待遇の軸に挙げた項目に当たる。"},{"key":"D","text":"売上高の6割を、海外向けの部品が占めている。","correct":false,"reason":"何をどこに売って稼いでいるかの情報なので、事業の軸に入る。"}],"steps":[{"title":"軸ごとの項目を確かめる","formula":"事業：何を、だれに売っているか\n働き方：勤務地や転勤、残業、休日\n待遇：初任給、手当","body":"問題文で決めた軸の中身を、先に並べておきます。"},{"title":"情報を一つずつ振り分ける","formula":"A：取引先 → 事業\nB：残業時間 → 働き方\nC：初任給 → 待遇\nD：売上高の内訳 → 事業","body":"働き方の軸に入るのは、残業時間を述べたBだけです。答えはBです。"}]},{"label":"比べた表から、言えることを選ぶ","question":"同じ業界のX社とY社を、表のように整理しました。この表だけから正しく言えるものはどれでしょうか。","answer":"A","kind":"choice","tables":[{"caption":"X社とY社の比較（架空の会社）","rows":[["軸","X社","Y社"],["主な顧客","企業（部品を納める）","個人（家電を売る）"],["勤務地","全国に転勤あり","本社のみ"],["初任給（月額）","24万円","23万円"],["年間休日","125日","120日"],["月平均の残業時間","25時間","15時間"]]}],"options":[{"key":"A","text":"X社は、Y社より、初任給も年間休日も多い。","correct":true,"reason":"初任給は24万円と23万円、年間休日は125日と120日で、どちらもX社が多い。"},{"key":"B","text":"Y社は、転勤がなく、残業はX社より多い。","correct":false,"reason":"転勤がないのは正しいが、残業はY社が15時間、X社が25時間で、Y社の方が少ない。"},{"key":"C","text":"X社は、初任給が高いので、残業代を含めた毎月の給料もY社より必ず高い。","correct":false,"reason":"表には残業代の計算のしかたや手当がなく、毎月の給料の総額は表だけでは比べられない。「必ず」とは言えない。"},{"key":"D","text":"Y社は、主に企業に向けて部品を売っている。","correct":false,"reason":"主な顧客は、Y社が個人（家電）で、企業に部品を納めているのはX社。"}],"steps":[{"title":"選択肢が、どの行を使っているかを確かめる","formula":"A：初任給、年間休日\nB：勤務地、残業時間\nC：初任給（と、表にない毎月の給料）\nD：主な顧客","body":"選択肢ごとに、表のどの行と照らし合わせればよいかを決めます。表にない情報を使っている選択肢は、表だけでは正しいと言えません。"},{"title":"表の行と照らし合わせる","table":{"rows":[["選択肢","表の値","判定"],["A","初任給 24万円と23万円、休日 125日と120日","どちらもXが多い"],["B","残業 Y社15時間、X社25時間","Yの方が少ない"],["C","毎月の給料の総額は表にない","言えない"],["D","Y社の主な顧客は個人","合わない"]]},"body":"表と合っているのはAだけです。Bは前半は合っていますが、後半の残業の多い少ないが逆です。"},{"title":"表にない情報に気づく","formula":"C：残業代を含めた毎月の給料 → 表に行がない","body":"初任給に手当や固定残業代が含まれるかは会社によって違い、残業代は別に計算されることが多くあります。表だけでは、毎月の給料の総額は比べられません。表にない行の内容は、説明会で質問するなどして確かめる欄になります。答えはAです。"}]},{"label":"企業に求められる情報を選ぶ","question":"新卒の応募者が、若者雇用促進法にもとづいて、応募先の企業に提供を求められる職場の情報に当たるものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"過去3年間の、新卒者の採用者数と離職者数","correct":true,"reason":"「募集・採用に関する状況」の類型の項目で、求められれば提供することが望ましいとされる情報。企業は、求められたとき、類型ごとに一つ以上の情報を提供する義務がある。"},{"key":"B","text":"取引先の会社と結んでいる契約の条件","correct":false,"reason":"取引先との契約は、法律が定める三つの類型（募集・採用、能力の開発・向上、職場への定着）のどれにも入らない。"},{"key":"C","text":"社員一人ひとりの給与の金額","correct":false,"reason":"個人ごとの給与は、法律が定める三つの類型に入らない。個人の情報でもある。"},{"key":"D","text":"次の採用面接で聞く予定の質問","correct":false,"reason":"選考の中身そのもので、職場の情報の類型に入らない。"}],"steps":[{"title":"法律が定める三つの類型を確かめる","formula":"募集・採用に関する状況\n職業能力の開発・向上に関する取組の実施状況\n職場への定着の促進に関する取組の実施状況","body":"応募者から求められたとき、企業はこの三つの類型について、それぞれ一つ以上の情報を提供します。"},{"title":"選択肢を類型に当てはめる","formula":"A：新卒者の採用者数と離職者数 → 募集・採用に関する状況\nB：取引先との契約 → どれにも入らない\nC：一人ひとりの給与 → どれにも入らない\nD：面接の質問 → どれにも入らない","body":"類型に当てはまるのはAだけです。答えはAです。"}]}]},"resources":[{"kind":"service","title":"キミスカ","publisher":"株式会社グローアップ","url":"https://px.a8.net/svt/ejp?a8mat=4BEPQ1+ERO3ZM+24ZO+I47XT","for_whom":"自分で探すだけでなく、プロフィール（写真と自己PR）を見た企業からスカウトを受けて、知らなかった企業にも出会いたい人。学生は無料","sponsored":true,"checked_at":"2026-10-27"}],"sources":[{"title":"厚生労働省：青少年の雇用の促進等に関する法律（若者雇用促進法）の概要（職場情報の三つの類型）","url":"https://www.mhlw.go.jp/content/11600000/000726872.pdf","checked_at":"2026-10-16"},{"title":"栃木労働局：青少年雇用情報シート（三つの類型ごとの項目。過去3年間の新卒採用者数・離職者数など）","url":"https://jsite.mhlw.go.jp/tochigi-roudoukyoku/library/tochigi-roudoukyoku/topics/antei/seisyounen-koyoujouhou.pdf","checked_at":"2026-10-16"},{"title":"札幌新卒応援ハローワーク：志望動機書き方講座（志望動機を書くには企業研究が必須）","url":"https://jsite.mhlw.go.jp/hokkaido-hellowork/list/sapporo/shisetsu/shinsotsu/seminar-motivation.html","checked_at":"2026-10-16"}]},"shu-es":{"id":"shu-es","name":"エントリーシート","type":"do","goal":"ガクチカ、自己PR、志望動機を、結論、根拠のエピソード、学びや入社後の貢献の順で、決められた字数に収めて書ける。","part_of":"shukatsu","status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省（ジョブ・カード、若者雇用促進法）、ハローワーク、就職情報サイトの記述と照合。指摘を反映した後に再検証。","text":"エントリーシート（ES）は、応募するときに企業に出す書類で、書類選考や面接の質問の材料に使われます。よく出る設問は三つです。学生時代に力を入れたこと（ガクチカ）は、経験の中で何を考え、どう動いたかという過程を伝えます。自己PRは、自分の強みを端的に伝え、それをエピソードで裏づけます。志望動機は、なぜその業界のその会社なのかと、入社して何をしたいかを伝えます。どの設問も、最初の一文で問いに答え（結論）、次にそれを裏づける具体的なエピソード（そのときの状況や課題、自分の行動、結果）を書き、最後に、そこから得たことや入社後にどう生かすかで締めます。読み手は多くのESを短い時間で読むので、結論が先にあると、何の話かがすぐ伝わります。設問ごとに字数の上限があるので、上限に収まらないときは、問いと関係の薄い部分から削ります。","example":"設問：あなたの強みを教えてください（200字以内）\n結論：問いにそのまま答える一文（私の強みは〜です）\n根拠：その強みが出た場面の状況、行動、結果\n締め：その強みを入社後にどう生かすか","note":"結論を先に書く構成は、ハローワークの資料と就職情報サイトの記述によります。構成の細かな分け方（課題の前に動機を書くかなど）は資料によって違い、公式の決まりではありません。締め（入社後の展望）は、字数が足りなければ削ってよいとする資料もあります。志望動機は、自己分析で言葉にした強みや価値観と、企業研究で見つけたその会社の特徴を結びつけて書きます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"shu-self","level":"must"},{"id":"shu-company","level":"must"}],"assessment":{"question":"ESの設問「学生時代に力を入れたことを教えてください」の最初の一文として、最もふさわしいものはどれでしょうか。","options":["私が学生時代に力を入れたのは、ゼミの共同研究で、班の発表の準備を取りまとめたことです。","私は大学に入学したとき、何か新しいことに挑戦したいと考えていました。","ゼミは、先輩から評判を聞き、楽しそうだという理由で選びました。"],"answer":0,"explanation":"最初の一文で、問いに直接答えて、何に力を入れたかを示します。二つ目は前置きで、何に力を入れたかがまだわかりません。三つ目はゼミを選んだきっかけで、力を入れたことそのものではありません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、好みや流派で答えが割れないかを、就職情報サイトとハローワーク・厚生労働省の資料の記述と照らして確認。制度（若者雇用促進法の職場情報）は厚生労働省の資料で確認。指摘を反映した後に再検証。","title":"結論から書き、字数に収め、設問に合わせて書き分ける","lead":"最初の一文で問いに答える。エピソードで裏づけ、学びや入社後の貢献で締める。字数を超えたら、問いと関係の薄いところから削る。","original":true,"problems":[{"label":"ガクチカの文を、結論から始まる順に並べる","question":"次のア〜オは、ESの設問「学生時代に力を入れたこと」に答える文章を、文ごとにばらばらにしたものです。結論、状況、行動、結果、学びの順になるように並べてください。\nア　この経験から、原因を数字で確かめてから手を打つことの大切さを学び、入社後も仕事の改善に生かしたいと考えています。\nイ　私が学生時代に力を入れたのは、塾講師のアルバイトで、生徒の宿題の提出率を上げたことです。\nウ　そこで、提出の記録を3か月分集計し、部活のある曜日に宿題が重なると出さない生徒が多いことを突き止めて、曜日ごとに宿題の量を変える案を教室長に出し、実行しました。\nエ　担当した教室では、宿題の提出率が6割ほどにとどまり、講師の間でも原因がわからないままでした。\nオ　その結果、半年で提出率は9割に上がりました。","answer":"イ → エ → ウ → オ → ア","kind":"order","alternatives":[{"try":"エ → イ → ウ → オ → ア","why_not":"状況から書き始めていて、何に力を入れたかという問いへの答え（イ）が二文目に下がる。問われた順の「結論が最初」にならない。"},{"try":"イ → ウ → エ → オ → ア","why_not":"ウの「そこで」は、前の文の困りごとを受けて、次に何をしたかを述べる言葉。困りごとを述べたエより前に置くと、「そこで」が受ける内容がない。"},{"try":"イ → エ → ウ → ア → オ","why_not":"アの「この経験から」は、結果まで含めた経験全体を受ける。結果のオが学びの後に来ると、「その結果」が学びを受けることになり、つながらない。"}],"steps":[{"title":"文ごとの役割を決める","formula":"イ：何に力を入れたか → 結論\nエ：取り組む前の困りごと → 状況\nウ：集計し、原因を突き止め、案を出した → 行動\nオ：提出率が9割に上がった → 結果\nア：得たことと、入社後の生かし方 → 学び","body":"問いへの直接の答えになっているのはイだけです。ほかの文は、それを裏づけるエピソードと、締めの学びです。"},{"title":"つなぎの言葉で、前後を確かめる","formula":"ウ：そこで → 前に困りごと（エ）が要る\nオ：その結果 → 前に行動（ウ）が要る\nア：この経験から → 前に経験の全体（エ・ウ・オ）が要る","body":"「そこで」「その結果」「この経験から」は、どれも前の文を受ける言葉です。受ける相手が、それぞれの文より前にあるかを確かめます。"},{"title":"問われた順に並べて、読み通す","formula":"イ → エ → ウ → オ → ア","body":"結論（イ）で何の話かを示し、状況（エ）、行動（ウ）、結果（オ）で裏づけ、学び（ア）で締めます。つなぎの言葉も、すべて前の文を受けています。"}]},{"label":"字数を超えた文章から、削る部分を選ぶ","question":"400字以内の設問「学生時代に力を入れたこと」に、次の四つの部分からなる文章を書いたところ（ここでは、各部分の要点だけを示します）、450字になりました。どれか一つを丸ごと削って400字以内に収めるとき、最も適切なのはどれでしょうか。どの部分を削っても400字以内に収まるものとします。\nA　結論：私が力を入れたのは、塾講師のアルバイトで宿題の提出率を上げたことです。\nB　前置き：私は小学生のころから、人に何かを教えるのが好きでした。中学生のときには、友人によく勉強を教えていました。\nC　行動：提出の記録を3か月分集計し、部活のある曜日に宿題が重なると出さない生徒が多いことを突き止め、曜日ごとに宿題の量を変えました。\nD　結果：半年で、提出率は6割から9割に上がりました。","answer":"B","kind":"choice","options":[{"key":"A","text":"A（結論）","correct":false,"reason":"問いへの直接の答えなので、削ると何に力を入れたかがわからなくなる。"},{"key":"B","text":"B（前置き）","correct":true,"reason":"問いの「力を入れた取り組み」ではなく、それ以前の話で、問いに直接答えていない。削っても、結論、行動、結果のつながりは崩れない。"},{"key":"C","text":"C（行動）","correct":false,"reason":"何を考え、どう動いたかは、ガクチカの中心。削ると、結果がなぜ出たのかがわからなくなる。"},{"key":"D","text":"D（結果）","correct":false,"reason":"取り組みでどう変わったかを数字で示す部分で、削ると行動の成果が伝わらない。"}],"steps":[{"title":"部分ごとに、問いとの関係を確かめる","formula":"A：何に力を入れたか → 問いへの答え\nB：小学生と中学生のころの話 → 問いの「学生時代に力を入れたこと」に直接答えていない\nC：何をしたか → 答えの中身\nD：どう変わったか → 答えの成果","body":"問いと関係の薄い部分から削るのが基本です。A・C・Dは、どれも力を入れたことそのものを述べています。"},{"title":"削った後に、つながりが残るか確かめる","formula":"A → C → D\n力を入れたこと → 何をしたか → どう変わったか","body":"Bを削っても、結論、行動、結果がそろっていて、話は通じます。答えはBです。"}]},{"label":"志望動機の問題点を見つける","question":"ある人が、食品メーカーのESに次の志望動機を書きました。この志望動機の問題点として、最も適切なものはどれでしょうか。\n「貴社は業界でも売上高が大きく、経営が安定しているので志望しました。また、研修制度が充実しており、社会人として成長できる環境だと感じました。」","answer":"C","kind":"choice","options":[{"key":"A","text":"書類の中で、相手の会社を「貴社」と書いている。","correct":false,"reason":"書類では「貴社」、話し言葉では「御社」と使い分けるのが一般的で、ESでは「貴社」で問題ない。"},{"key":"B","text":"応募する会社の売上高に触れている。","correct":false,"reason":"売上高に触れること自体は問題ではない。企業研究で調べた数字を使うのは、むしろよいこと。"},{"key":"C","text":"同じ業界の大手ならどの会社にも当てはまる理由で、自分の強みや入社して何をしたいかが書かれていない。","correct":true,"reason":"売上高の大きさや研修制度は、ほかの大手にも当てはまる。会社から受け取るもの（安定、研修）だけで、自分の経験や強みと結びつけた、入社してからの貢献がない。"},{"key":"D","text":"二文しかなく、短すぎる。","correct":false,"reason":"長さは設問の字数で決まり、二文であること自体は問題点ではない。中身を直さずに文を足しても、よくならない。"}],"steps":[{"title":"志望動機に要る要素を並べる","formula":"なぜこの業界か\nなぜ同じ業界の中でこの会社か\n自分の強みや経験とのつながり\n入社して何をしたいか（貢献）","body":"志望動機は、自己分析と企業研究を結びつけて書くものです。この四つが入っているかを確かめます。"},{"title":"書かれている理由を、四つに当てはめる","formula":"売上高が大きく安定 → 同じ業界の大手ならどこでも言える\n研修制度が充実 → 会社から受け取るもの\n自分の強みや経験 → なし\n入社して何をしたいか → なし","body":"書かれた二つの理由は、どちらもこの会社だけの特徴ではなく、自分が会社に何をするかも書かれていません。"},{"title":"ほかの選択肢が問題点でないことを確かめる","formula":"A：書類では「貴社」\nB：調べた数字を使うのはよい\nD：長さは設問の字数で決まる","body":"形式の点（A・D）や、数字に触れること（B）は問題ではありません。答えはCです。"}]},{"label":"設問に合った書き出しを選ぶ","question":"ESの設問が「あなたの強みと、それを表すエピソードを教えてください（自己PR）」のとき、最初の一文として最もふさわしいものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"私の強みは、原因を数字で確かめてから手を打てることです。","correct":true,"reason":"問われた強みを、最初の一文で端的に答えている。この後に、強みが出たエピソードを続ければよい。"},{"key":"B","text":"私が学生時代に力を入れたのは、塾講師のアルバイトです。","correct":false,"reason":"ガクチカの書き出しで、強みが何かに答えていない。"},{"key":"C","text":"貴社を志望するのは、食を通じて人の健康を支えたいからです。","correct":false,"reason":"志望動機の書き出しで、問われた強みに答えていない。"},{"key":"D","text":"私は塾講師のアルバイトで、宿題の提出率を6割から9割に上げました。","correct":false,"reason":"エピソードの結果から書き始めていて、そこから何が強みなのかを読み手が推し量ることになる。問われた強みを先に言葉で示していない。"}],"steps":[{"title":"設問が何を問うているかを確かめる","formula":"問い：あなたの強み（と、それを表すエピソード）","body":"最初の一文では、問いの中心である「強みは何か」に答えます。エピソードはその後に続けます。"},{"title":"選択肢ごとに、何に答えているかを見る","formula":"A：強みは何か\nB：何に力を入れたか（ガクチカ）\nC：なぜ志望するか（志望動機）\nD：エピソードの結果","body":"問いの中心に最初の一文で答えているのはAだけです。Dはよいエピソードですが、強みを言葉にしないまま結果から始めています。答えはAです。"}]}]},"sources":[{"title":"札幌新卒応援ハローワーク：ガクチカの書き方と例文（結論、課題、思考、行動、成果・学び、展望の順）","url":"https://jsite.mhlw.go.jp/hokkaido-hellowork/shinsotsu-column2.html","checked_at":"2026-10-16"},{"title":"リクナビ：ガクチカとは？人事が評価する書き方・構成（ガクチカと自己PRの違い、字数を超えるとき）","url":"https://job.rikunabi.com/contents/howto/18900/","checked_at":"2026-10-16"},{"title":"札幌新卒応援ハローワーク：志望動機書き方講座（自己分析と企業研究から志望動機を書く）","url":"https://jsite.mhlw.go.jp/hokkaido-hellowork/list/sapporo/shisetsu/shinsotsu/seminar-motivation.html","checked_at":"2026-10-16"}]},"shu-gd":{"id":"shu-gd","name":"グループディスカッション","type":"do","goal":"グループディスカッションで、役割と時間配分を決め、前提をそろえて論点を整理し、結論までまとめる進め方を説明でき、議論の場面に合う発言を選べる。","part_of":"shukatsu","status":"verified","scope_note":"課題について話し合い、結論を発表する形のグループディスカッションを扱います。進め方と時間配分の例は、就職情報サイトの記述によります（下の資料）。ディベート型や、資料を読み込む型の細かい進め方、オンラインでの話し方は扱いません。テーマごとの答えの中身ではなく、議論の進め方を練習します。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ出典と照合し、単元の到達条件・確認問題・練習問題と整合するかを確認。指摘を反映した後に再検証。","text":"グループディスカッションは、初めて会う数人で、決められた時間の中で課題について話し合い、グループの結論を出す選考です。始まったらすぐに、司会、書記、タイムキーパーなどの役割と、どの段階に何分使うかを決めます。次に、課題の言葉の意味や前提を全員でそろえます。そろえないまま意見を出すと、同じ言葉で別のものを思い浮かべていて、話がかみ合いません。そのあと意見を出し合い、出た意見を、何を重く見るかの基準に照らして整理し、絞り込みます。最後に結論をまとめ、発表の準備をします。結論を出すことは必須とされるので、まとめと発表準備の時間は、はじめから残しておきます。発言は、自分の案を言うことだけでなく、議論を前に進めるための提案（前提の確認、整理、時間の知らせ）も評価の対象になります。","example":"課題：「大学の図書館の利用者を増やすには」\n前提をそろえる発言：「ここでの『利用者』は、本を借りる人だけですか、自習で席を使う人も入れますか」\n絞り込む発言：「出た案を、費用がかからないことと、すぐ始められることの二つで比べませんか」","note":"役割に就かなくても、議論の進め方に沿った発言をすれば、全員が進行を支えられます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":8,"yen":0},"assessment":{"question":"グループディスカッションで、タイムキーパーの主な仕事は？","options":["決めた時間配分に沿って、経過時間や残り時間をメンバーに伝え、段階の切りかえを促す","出た意見の要点を書き取り、メンバーと共有する","議論の結論を一人で決め、発表する"],"answer":0,"explanation":"タイムキーパーは、時間の区切りに沿って議論を進めるために、経過時間を伝える役割で、自分も議論に参加する。意見の要点を書き取るのは書記の仕事。結論はグループで出すもので、一人で決めるものではない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。正答が一つに決まるかを別の答えを実際に試して確認し、選択肢ごとの理由、全段階の説明、出典との一致、前提の範囲、説明・確認問題との整合を確認。指摘を反映した後に再検証。","title":"進め方に沿って、場面に合う発言を選ぶ","lead":"今どの段階にいて、次に何を済ませるべきかを考えてから、発言を選ぶ。","original":true,"problems":[{"label":"時間配分を決める","question":"制限時間30分（最後の1分は発表）のグループディスカッションが始まりました。最初に決める時間配分として、最も適切なものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"役割と時間配分3分 → 前提の確認2分 → 意見出し10分 → 整理と絞り込み8分 → 結論と発表準備6分 → 発表1分","correct":true,"reason":"すべての段階があり、順番も進め方どおりで、合計がちょうど30分です。"},{"key":"B","text":"役割と時間配分2分 → 意見出し27分 → 発表1分","correct":false,"reason":"合計は30分ですが、前提の確認、整理と絞り込み、結論と発表準備の時間がありません。意見を出したまま結論をまとめずに発表することになります。"},{"key":"C","text":"役割と時間配分2分 → 前提の確認3分 → 意見出し10分 → 整理と絞り込み10分 → 結論と発表準備8分 → 発表1分","correct":false,"reason":"段階と順番はよいものの、合計が34分になり、30分を超えます。"},{"key":"D","text":"意見出し15分 → 役割と時間配分3分 → 整理と絞り込み5分 → 結論と発表準備6分 → 発表1分","correct":false,"reason":"順番が違います。役割と時間配分を意見出しの後に決めていて、意見出しのあいだは時間を管理する人がいません。また、前提の確認の段階もありません。"}],"steps":[{"title":"必要な段階と順番を書き出す","formula":"役割と時間配分 → 前提の確認 → 意見出し → 整理と絞り込み → 結論と発表準備 → 発表","body":"役割と時間配分は、始まってすぐに決めます。前提をそろえてから意見を出し、基準で絞り込んでから結論をまとめます。"},{"title":"段階が欠けている案を外す","formula":"B：前提の確認、整理と絞り込み、結論と発表準備がない\nD：前提の確認がない","body":"Bは、意見を出したまま発表することになります。Dは、前提の確認もありません。"},{"title":"順番が違う案を外す","formula":"D：意見出し（15分）の後に、役割と時間配分","body":"役割と時間配分を後に回すと、最初の15分は、だれも時間を管理しないまま進みます。"},{"title":"合計の時間を確かめる","formula":"A：3 + 2 + 10 + 8 + 6 + 1 = 30\nC：2 + 3 + 10 + 10 + 8 + 1 = 34","body":"Cは、すべての段階を正しい順に含みますが、30分を4分超えています。条件を満たすのはAだけです。"}]},{"label":"話がかみ合わないときの発言","question":"課題は「若者に選ばれる商店街にするには」です。意見出しが始まってすぐ、Aさんは高校生向けの案を、Bさんは20代の社会人向けの案を出し、互いに相手の案を「若者には合わない」と言って、話がかみ合いません。前提の確認はしていませんでした。次の発言として、最も適切なものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"「この議論での『若者』を、何歳くらいの、どんな人とするか、先に決めませんか」","correct":true,"reason":"かみ合わない原因は、二人が「若者」で別の人を思い浮かべていることです。前提をそろえれば、どちらの案も同じ物差しで比べられます。"},{"key":"B","text":"「私は、高校生向けの案のほうがよいと思います。理由は〜です」","correct":false,"reason":"片方の案に賛成を足すだけで、「若者」の食い違いは残ります。Bさんとの話は、かみ合わないままです。"},{"key":"C","text":"「時間がもったいないので、多数決でどちらかの案に決めましょう」","correct":false,"reason":"意見出しが始まったばかりで、案が二つしか出ていません。前提がずれたまま数で決めても、かみ合わない原因は解消されません。"},{"key":"D","text":"「どちらもよい案ですね。ほかに案がある人はいますか」","correct":false,"reason":"前提がずれたまま案を増やすと、後で整理するときに、別々の人に向けた案を比べることになります。"}],"steps":[{"title":"今の段階を確かめる","formula":"済んだ段階：役割と時間配分\n済んでいない段階：前提の確認\n今：意見出しの始め","body":"問題文に、前提の確認をしていなかったとあります。進め方の一段階を飛ばしています。"},{"title":"かみ合わない原因を見つける","formula":"Aさん：若者 → 高校生\nBさん：若者 → 20代の社会人","body":"二人とも「若者」と言っていますが、思い浮かべている人が違います。案の良し悪しではなく、言葉の意味がずれています。"},{"title":"原因に効く発言を選ぶ","formula":"原因：「若者」の意味のずれ → 必要な発言：「若者」の範囲を決める提案","body":"Aの発言だけが、言葉の意味をそろえる提案です。B・C・Dは、ずれを残したまま先へ進みます。"}]},{"label":"残り時間が少ないときの発言","question":"制限時間30分のグループディスカッションで、残りが7分になりました（発表は、この時間が終わった後に別に行います）。案は五つ出ていますが、まだ一つに絞れていません。発表の準備には5分ほどかかると決めていました。次の発言として、最も適切なものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"「残り7分です。費用と効果の二つの基準で五つの案を比べて、1つに絞りませんか」","correct":true,"reason":"残り時間を知らせたうえで、絞り込む基準を示しています。絞り込みを短く済ませれば、発表の準備に移れます。"},{"key":"B","text":"「まだ案が足りない気がするので、もう少しアイデアを出しましょう」","correct":false,"reason":"残り7分のうち5分は発表の準備に使う予定で、意見出しに戻る時間はありません。結論が出ないまま終わるおそれがあります。"},{"key":"C","text":"「どれもよい案なので、五つとも結論として発表しましょう」","correct":false,"reason":"五つを並べるだけでは、グループとしての結論になりません。結論を出すことは必須とされます。"},{"key":"D","text":"「基準を決める時間はないので、司会の人が好きな案に決めてください」","correct":false,"reason":"結論をグループで出していません。理由のない決め方では、発表で選んだ理由も説明できません。"}],"steps":[{"title":"残り時間の使い道を確かめる","formula":"残り7分 → 発表準備に約5分 → 絞り込みに使えるのは約2分","body":"発表の準備に5分ほどかかると決めていたので、絞り込みに使えるのは2分ほどです。新しい意見を出す時間は残っていません。"},{"title":"結論になる形を確かめる","formula":"結論：グループとして選んだ一つの案と、選んだ理由","body":"五つを並べる（C）のも、理由なく一人が選ぶ（D）のも、グループの結論になりません。"},{"title":"短い時間で絞る方法を選ぶ","formula":"基準を示す（費用、効果）→ 五つの案を同じ基準で比べる → 一つに絞る","body":"基準があれば、短い時間でも五つの案を比べられ、発表で選んだ理由も言えます。Aがこの段階に合う発言です。"}]}]},"sources":[{"title":"マイナビ2027：グループディスカッションの進め方（30分の時間配分の例、役割）","url":"https://job.mynavi.jp/conts/2027/discussion/index02.html","checked_at":"2026-10-16"},{"title":"ONE CAREER：グループディスカッションの進め方（前提の定義、時間配分、結論を必ず出す）","url":"https://www.onecareer.jp/articles/269","checked_at":"2026-10-16"}]},"shu-interview":{"id":"shu-interview","name":"面接","type":"do","goal":"面接でよく聞かれる質問（自己紹介、ガクチカ、志望動機、逆質問）の意図をつかみ、結論から1分程度で答えられる。","part_of":"shukatsu","status":"verified","scope_note":"新卒の採用面接で、よく聞かれる質問への答え方を扱います。答える中身（自分の経験や、企業を選ぶ理由）は、自己分析とESで用意したものを使います。話す量の目安や質問の意図は、就職情報サイトなどの記述によります（下の資料）。面接の形（個人、集団、オンライン）や業界ごとの違い、圧迫面接への対応は扱いません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ出典と照合し、単元の到達条件・確認問題・練習問題と整合するかを確認。指摘を反映した後に再検証。","text":"面接の質問には、それぞれ面接官が知りたいことがあります。答える前に「この質問で何を知りたいのか」を考え、それに合う中身を選びます。たとえば志望動機では、なぜこの業界で、なぜほかの会社ではなくこの会社なのかが問われます。話す順番は、結論を最初に言い、その後に理由や具体的な出来事を続け、最後に、経験から学んだことや入社後とのつながりで締めます。結論が先にあると、面接官は何の話かをつかんだうえで続きを聞けます。長さは「1分程度で」と言われることが多く、話す量の目安を文字数で決めて原稿を作り、声に出して時間を計ります。原稿を覚えて読み上げるのではなく、要点の順番を覚えて、自分の言葉で話せるようにします。","example":"質問：「当社を志望する理由を教えてください」\n知りたいこと：この会社を選ぶ理由と、入社後に何をしたいか\n結論：「人の暮らしを支える物流を、仕組みから良くする仕事がしたいからです。」\n続き：そう考えたきっかけの経験 → ほかの会社ではなく、この会社を選ぶ理由 → 入社後にしたいこと","note":"結論から話すと、深掘りの質問（「なぜそう考えたのですか」など）が来やすくなります。想定される深掘りにも、同じ順番で答えられるようにしておきます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"shu-self","level":"must"},{"id":"shu-es","level":"helps"},{"id":"shu-company","level":"helps"}],"assessment":{"question":"面接の最初に「1分で自己紹介をしてください」と言われた。話し始めとして最も適切なのは？","options":["「〇〇大学経済学部の山田です。大学では、〜に力を入れてきました。」と、名乗ってから要点を言う","名乗らずに、高校時代から順に、経験を時系列で話し始める","「何について話せばよいでしょうか」と、話す内容を面接官に尋ねる"],"answer":0,"explanation":"自己紹介は、だれが何者かを伝える質問なので、まず大学名と名前を名乗り、続けて一番伝えたい要点を一文で言う。名乗らずに時系列で話すと、名前が伝わらないうえに、要点が最後まで出てこない。内容を尋ね返すのは、「1分で自己紹介」という指示にすでに答え方が示されているので、準備不足に見える。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。正答が一つに決まるかを別の答えを実際に試して確認し、選択肢ごとの理由、全段階の説明、出典との一致、前提の範囲、説明・確認問題との整合を確認。指摘を反映した後に再検証。","title":"質問の意図をつかみ、結論から1分程度で答える","lead":"面接官が何を知りたいかを先に考え、結論、理由や出来事、締めの順に組み立てる。","original":true,"problems":[{"label":"ガクチカの質問の意図をつかむ","question":"面接で「学生時代に力を入れたこと（ガクチカ）を教えてください」と聞かれました。企業がこの質問をする主な意図として、最も適切なものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"大会の順位や受賞歴のような、成果の大きさをほかの学生と比べるため","correct":false,"reason":"企業が見たいのは成果の華やかさより、そこに至る考え方や行動だとされます。成果が小さくても、過程が伝われば答えになります。"},{"key":"B","text":"どう考え、どう行動したかから、人柄や、仕事への取り組み方を知るため","correct":true,"reason":"学歴や資格からはわからない考え方や行動の傾向を、具体的な経験から知るための質問だとされます。入社後も同じように取り組めるかを見ています。"},{"key":"C","text":"学業の成績が、採用の基準に達しているかを確かめるため","correct":false,"reason":"成績は成績証明書でわかります。ガクチカは学業に限らず、サークルやアルバイトなどの経験でも答えられる質問です。"},{"key":"D","text":"入社後に配属を希望する部署を聞くため","correct":false,"reason":"配属の希望は、希望する職種や部署を尋ねる別の質問で聞かれます。ガクチカは、過去の経験について尋ねる質問です。"}],"steps":[{"title":"質問が何について尋ねているかを確かめる","formula":"学生時代に力を入れたこと → 過去の経験について","body":"この質問は、学生時代の経験を尋ねています。将来の希望（D）や、書類でわかる数字（C）を尋ねる質問ではありません。"},{"title":"経験から、何がわかるかを考える","formula":"経験の中身：何をしたか、なぜそうしたか、どのようにしたか\n→ わかること：考え方と行動の傾向","body":"経験を聞くと、その人が課題をどう考え、どう動くかがわかります。何をしたかの大きさ（A）は、人によって機会の差が大きく、取り組み方そのものは示しません。"},{"title":"答え方に生かす","formula":"伝える中心：なぜそうしたか、どのようにしたか","body":"意図が取り組み方を知ることなので、答えでは、成果の数字だけでなく、そう考えた理由と工夫した行動を中心に話します。"}]},{"label":"ガクチカの答えを、結論から並べる","question":"「学生時代に力を入れたことを、1分程度で教えてください」への答えとして、次のア〜オの文を用意しました。結論から話す順に並べ替えてください。\nア　その結果、その年の新入部員は、前の年の8人から15人に増えました。\nイ　私が学生時代に力を入れたのは、写真サークルで新入部員を増やす取り組みです。\nウ　そこで、部員の作品を毎週SNSで紹介し、見学に来た人がその場で撮影を体験できる日を設けました。\nエ　当時は新入部員が減り続けていて、新入生に聞くと、掲示を見ても活動の様子がわからないという声が多くありました。\nオ　この経験から、原因を確かめてから手を打つことの大切さを学びました。","answer":"イ → エ → ウ → ア → オ","kind":"order","alternatives":[{"try":"エ → イ → ウ → ア → オ","why_not":"当時の状況から話し始めると、何の話かが最後までわからないまま聞くことになる。結論から話すという条件に合わない。"},{"try":"イ → ウ → エ → ア → オ","why_not":"ウの「そこで」は、前に行動の理由が必要。理由に当たるのは、活動の様子がわからないという声を述べたエなので、エはウより前に来る。"},{"try":"イ → エ → ウ → オ → ア","why_not":"オの「この経験」は、取り組みとその結果までを受ける言葉。結果のアより前に置くと、学びを述べた後に結果が出てくることになる。"}],"steps":[{"title":"最初の文を決める","formula":"結論：イ（力を入れたのは、新入部員を増やす取り組み）","body":"質問への答えそのものは、何に力を入れたかです。それを述べているのはイだけで、イには前の文を受ける言葉もありません。結論から話すので、イが最初です。"},{"title":"前の文を受ける言葉を書き出す","formula":"ア：その結果\nウ：そこで\nエ：当時は（受ける言葉なし。状況の説明）\nオ：この経験から","body":"「その結果」「そこで」「この経験から」は、どれも前に受ける内容が必要です。エは、取り組みを始めたときの状況を述べる文です。"},{"title":"理由と行動を並べる","formula":"エ：活動の様子がわからないという声\n→ ウ：そこで、作品を紹介し、体験の日を設けた","body":"ウの行動は、エで確かめた原因に合わせた手です。「そこで」がエの内容を受けているので、エ → ウ の順です。"},{"title":"結果と学びで締める","formula":"ウ（行動）→ ア：その結果、8人から15人に増えた\n→ オ：この経験から学んだこと","body":"行動の後に結果を述べ、最後に、経験全体から学んだことで締めます。順番は イ → エ → ウ → ア → オ です。"}]},{"label":"1分程度で話す量を決める","question":"面接で「1分程度で」答えるように言われたときに備えて、原稿を作ります。就職情報サイトの記述によると、原稿の長さの目安として最も近いものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"約100字","correct":false,"reason":"聞き取りやすい速さで話すと、20秒ほどで終わる量です。1分には足りず、理由や出来事を話す余地がありません。"},{"key":"B","text":"約300字","correct":true,"reason":"ニュースを読む速さは1分に約300字とされ、就職情報サイトの目安も250〜400字ほどの幅で示されます。約300字は、どの目安にも入ります。"},{"key":"C","text":"約800字","correct":false,"reason":"1分で話すには、ニュースを読む速さ（1分に約300字）の2倍以上の速さが必要になり、聞き取りにくくなります。"},{"key":"D","text":"約1,500字","correct":false,"reason":"聞き取りやすい速さでは、5分ほどかかる量です。"}],"steps":[{"title":"話す速さの目安を確かめる","formula":"ニュースを読む速さ：1分に約300字（約350字とする記述もある）","body":"ニュースを読むアナウンサーの速さが、聞き取りやすい速さの目安とされます。"},{"title":"1分で話せる量に直す","formula":"聞き取りやすい速さで1分 → 約250〜400字の幅（就職情報サイトの目安）","body":"少しゆっくり話す人も、少し速く話す人もいるので、目安には幅があります。この幅に入る選択肢はBだけです。どの記述の目安をとっても、約300字は幅の中に入ります。"},{"title":"原稿を声に出して確かめる","formula":"原稿を書く → 声に出して時間を計る → 長ければ出来事の説明を削る","body":"文字数は目安なので、実際に声に出して計ります。削るときは、結論と締めは残し、出来事の細かい説明から削ります。"}]},{"label":"逆質問を選ぶ","question":"面接の最後に「何か質問はありますか」と聞かれました。企業について調べたうえでの関心を示す逆質問として、最も適切なものはどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"「御社が創業したのは何年ですか」","correct":false,"reason":"会社のホームページに載っている基本的な情報です。調べればわかることを尋ねると、企業研究ができていないと受け取られます。"},{"key":"B","text":"「特にありません」","correct":false,"reason":"質問がないと、関心が低いと受け取られるおそれがあります。調べたうえでの関心も示せません。"},{"key":"C","text":"「説明会で、入社1年目は先輩と組んでお客様を担当すると伺いました。その期間に、特に身につけてほしいと考えていることは何でしょうか」","correct":true,"reason":"説明会で聞いたことをもう一度尋ねるのではなく、それを前提にして、その先の、入社後に自分が働く姿に関わることを尋ねています。調べたことと、入社後への関心の両方が伝わります。"}],"steps":[{"title":"逆質問の意図を確かめる","formula":"逆質問からわかること：どれだけ調べたか、どれだけ関心があるか","body":"逆質問は、学生が質問する場ですが、面接官は質問の中身から、企業をどれだけ調べ、どれだけ関心を持っているかを見ています。"},{"title":"調べればわかる質問を外す","formula":"A：ホームページに載っている → 調べていないと受け取られる\nB：質問がない → 関心が伝わらない","body":"AとBは、どちらも調べたうえでの関心を示せません。"},{"title":"残った質問が意図に合うかを確かめる","formula":"C：説明会で聞いたこと（調べたこと）＋ 入社後の働き方（関心）","body":"Cは、すでに知っていることを前置きにして、その先を尋ねています。調べたことと関心の両方が伝わるので、Cが最も適切です。"}]}]},"sources":[{"title":"ジョブ・カード制度総合サイト（厚生労働省）：ガクチカの書き方（企業が聞く意図）","url":"https://www.job-card.mhlw.go.jp/column/student/howto-gakuchika","checked_at":"2026-10-16"},{"title":"就活の教科書：1分間の自己PRの文字数と話し方","url":"https://reashu.com/jikopr-1minutes","checked_at":"2026-10-16"},{"title":"インターンシップガイド：逆質問の意図と、避けるべき逆質問","url":"https://internshipguide.jp/columns/view/reverse-question-example","checked_at":"2026-10-16"}]},"shu-naitei":{"id":"shu-naitei","name":"内定","type":"target","goal":"自己分析と企業研究をもとにエントリーシートを書き、Webテストと面接を経て、選考を最後まで進めて内定を得られる。","part_of":"shukatsu","status":"draft","featured":true,"scope_note":"大学生などの新卒の就職活動で、一般的な選考の流れ（エントリーシート、Webテスト、面接）への学習経路です。転職、公務員の採用試験、教員などの採用試験は扱っていません（転職は、別の木「転職の内定」があります）。選考の段階と順番は企業によって違い、グループディスカッション、インターンシップを経た選考、適性検査を行わない企業などもあります。Webテストは、どの種類を課すかを企業が決めます。受ける企業の種類がわからないときは、よく使われるものから順に学んでおくのが安全です。複数の企業を受けると、複数の種類が必要になることが多くあります。自己分析、企業研究、エントリーシートには一つに決まる答えがなく、この木の練習で確かめるのは、考え方と書き方の型だけです。結論から書く構成などの書き方は、ハローワークの資料と就職情報サイトの記述によります。就職・採用活動の日程は、政府が経済団体などに出している要請で、法律の決まりではありません。線はこの経路での準備の順序を表します。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"選考の流れと日程を、内閣官房の就職・採用活動に関する要請、東京都と就職情報サイトの資料と照合。Webテストの分岐の道ごとの一言を、各到達点の説明と照合。指摘を反映した後に再検証。","text":"新卒の就職活動は、企業の採用情報が公開されて応募（エントリー）が始まり、書類選考、筆記試験や適性検査、面接を経て、内定に至るのが一般的な流れです。準備として、自分の経験を振り返る自己分析と、業界や企業を調べる企業研究を先に進めておきます。その結果をもとに、エントリーシート（ES）に学生時代に力を入れたこと、自己PR、志望動機を書きます。適性検査は、自宅のパソコンなどで受けるWebテストが多く、SPI、玉手箱、GAB、TG-WEBなど、企業がどの種類を使うかを決めます。面接は、一次面接から最終面接まで複数回行われることが多いとされます。政府は、卒業・修了年度に入る直前の3月1日以降に広報活動を、卒業・修了年度の6月1日以降に採用選考活動を始め、正式な内定日を卒業・修了年度の10月1日以降とするよう、経済団体などに要請しています。","example":"準備：自己分析、企業研究（インターンシップに参加する人も多い）\n卒業前の年度の3月1日以降：採用情報の公開、エントリー、会社説明会\n卒業の年度の6月1日以降：採用選考（面接など）\n卒業の年度の10月1日以降：正式な内定\nES と Webテストは、面接の前に行う企業が多い","note":"日程は政府の要請で、外資系企業や、専門性の高い人材の採用など、早く選考を進める企業もあります。内定までに必要なのは、学ぶ時間よりも、応募して選考を受ける期間（月の単位）です。この木の時間は、各段階の準備にかかる学習時間だけを数えています。"},"cost":{"hours":0,"yen":0},"requires":[{"id":"shu-es","level":"must"},{"id":"shu-interview","level":"must"},{"id":"shu-gd","level":"related"},{"id":"shu-webtest-kind","level":"helps"},{"id":"spi","level":"must","group":"Webテスト","note":"よく使われるWebテスト。言語と非言語の両方を学ぶ"},{"id":"tamatebako","level":"must","group":"Webテスト","note":"計数・言語ともに形式が複数あり、どれが出るかを企業が決める"},{"id":"gab","level":"must","group":"Webテスト","note":"玉手箱と同じ会社の検査。総合職の採用で使われることが多いとされる"},{"id":"tgweb","level":"must","group":"Webテスト","note":"従来型は暗号などパズルに近い問題、新型は玉手箱に近い形式。型を見分けてから学ぶ"},{"id":"cab","level":"must","group":"Webテスト","note":"IT職の採用で使われるとされる。この木は計算の科目だけ"}],"sources":[{"title":"内閣官房：就職・採用活動に関する要請（2027年度卒業・修了予定者の日程）","url":"https://www.cas.go.jp/jp/seisaku/shushoku_katsudou_yousei/2027nendosotu/index.html","checked_at":"2026-10-16"},{"title":"東京都 TOKYOはたらくネット：就職活動の流れ（求人情報の公開から応募、採用試験、面接、内定まで）","url":"https://www.hataraku.metro.tokyo.lg.jp/shiryo/1-1_syukatunonagare.pdf","checked_at":"2026-10-16"},{"title":"マイナビ2028：選考フローと、必要な対策・準備（ES、適性検査、複数回の面接）","url":"https://job.mynavi.jp/conts/2028/susumekata/03.html","checked_at":"2026-10-16"}]},"shu-self":{"id":"shu-self","name":"自己分析","type":"do","goal":"これまでの経験を書き出し、自分の強みと価値観を言葉にして、具体的なエピソードで裏づけられる。","part_of":"shukatsu","status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省（ジョブ・カード、若者雇用促進法）、ハローワーク、就職情報サイトの記述と照合。指摘を反映した後に再検証。","text":"自己分析は、これまでの経験を書き出して、そこから自分の強み（得意な行動や、できること）と価値観（何を大事にして選ぶか）を言葉にする作業です。エントリーシートや面接で話す内容の材料になり、応募する企業を選ぶ基準にもなります。進め方は、まず学校、部活、アルバイト、趣味などの経験を、時期ごとに書き出します。次に、一つ一つの経験について、何をしたか、なぜそうしたか、どう感じたかを問い直して掘り下げます。いくつもの経験に繰り返し出てくる行動の傾向が、強みの候補です。そうしたい理由として繰り返し出てくるものが、価値観の候補です。強みは「責任感」「協調性」のような一語だけでは伝わりません。その強みが出た場面の、具体的な行動と結果を一つ選んで、裏づけにします。","example":"書き出した経験：高校の文化祭の会計係、大学のゼミの発表、飲食店のアルバイト\n掘り下げ：三つとも、始める前に手順を表にまとめていた\n強みの候補：準備を表にして、抜けを防ぐこと\n裏づけ：文化祭の会計で、支出の記録表を作り、締めの日に残金が帳簿と一円も違わなかった","note":"厚生労働省のキャリア形成の事業の資料では、「興味・関心」「こだわり・価値観」「強み・能力」の三つが重なるところに、目指す方向のヒントがあるとしています。自己分析の答えは人によって違います。この単元の練習で確かめるのは、強みとエピソードの結びつけ方や、強みと価値観の区別のような
