<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Howtree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root {
  --ground: #F5F6F8;
  --ink: #1B1D22;
  --gray: #5A6070;
  --line: #C9CED6;
  --off: #D3D8E0;
  --red: #C9252D;
  --latin: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  font-size: 15px;
  line-height: 1.7;
}
a { color: var(--ink); }
a:hover { color: var(--gray); }
button, input { font-family: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 40px; }
.narrow { max-width: 1120px; }

/* 見出しまわり */
.hd { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 28px; }
.brand { display: inline-flex; align-items: center; gap: 16px; text-decoration: none; color: var(--ink); }
.logo { position: relative; width: 74px; height: 44px; flex: none; display: block; }
.logo i { position: absolute; display: block; background: var(--red); }
.logo .b1 { left: 10px; top: 13px; width: 34px; height: 5px; transform-origin: 0 50%; transform: rotate(14deg); }
.logo .b2 { left: 42px; top: 22px; width: 22px; height: 5px; transform-origin: 0 50%; transform: rotate(-38deg); }
.logo .c1 { left: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%; }
.logo .c2 { left: 32px; top: 13px; width: 22px; height: 22px; border-radius: 50%; }
.logo .c3 { left: 56px; top: 2px; width: 16px; height: 16px; border-radius: 50%; }
.word { font-family: var(--latin); line-height: 1.05; }
.word small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
.word b { display: block; font-size: 24px; font-weight: 700; }
.hd .right { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.link { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
.rule { width: 28px; height: 3px; background: var(--red); margin-bottom: 6px; }
h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
.sub { font-size: 13px; font-weight: 700; color: var(--gray); }
.muted { color: var(--gray); }
.foot { margin-top: 48px; padding: 10px 0 28px; border-top: 1px solid var(--line); font-family: var(--latin); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--gray); }

.band { margin-top: 24px; background: var(--red); color: #fff; padding: 28px 36px; display: flex; align-items: flex-end; gap: 24px 32px; flex-wrap: wrap; }
.band .main { flex: 999 1 380px; min-width: 0; }
.band .tag { display: inline-block; border: 1.5px solid #fff; border-radius: 3px; padding: 1px 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
.band h1 { margin: 10px 0 0; font-size: 44px; line-height: 1.2; font-weight: 900; letter-spacing: 0.04em; }
.band p { margin: 6px 0 0; font-weight: 500; }
.stats { display: flex; gap: 36px; flex-wrap: wrap; }
.stat .k { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
.stat .v { font-family: var(--latin); font-size: 56px; font-weight: 700; line-height: 1; }
.stat .v span { font-family: inherit; font-size: 16px; font-weight: 700; margin-left: 4px; }
.stat .v span.jp { font-family: 'Zen Kaku Gothic New', sans-serif; }
.badge { display: inline-block; border: 1px solid var(--ink); padding: 0 10px; font-size: 13px; font-weight: 700; }
.badge.fill { background: var(--ink); color: #fff; }

/* ボタンと札 */
.btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn:hover { background: #ECEEF2; color: var(--ink); }
.btn.fill { background: var(--ink); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.big { min-height: 60px; font-size: 18px; flex: 1 1 200px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }
.chip.known { background: var(--ink); color: #fff; }
.chip.helps { border-style: dashed; font-weight: 500; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; font-weight: 500; color: var(--gray); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: block; width: 18px; height: 12px; }

/* トップ */
.hero { padding-top: 72px; }
.hero form { display: flex; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.hero label { font-family: var(--latin); font-size: 96px; font-weight: 700; line-height: 0.9; }
.hero .field { flex: 999 1 360px; min-width: 0; display: flex; flex-wrap: wrap; }
.hero input { flex: 999 1 240px; min-width: 0; height: 64px; padding: 0 20px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 22px; font-weight: 700; }
.hero .go { flex: 1 0 auto; height: 64px; padding: 0 32px; border: 0; background: var(--red); color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer; }
.hero .lead { margin-top: 20px; font-size: 16px; font-weight: 500; color: var(--gray); }
.sec { padding-top: 56px; }
.sechead { display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.sechead .right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.goals { margin-top: 16px; border-top: 1px solid var(--ink); }
.goal { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; min-height: 64px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.goal:hover { background: #ECEEF2; color: var(--ink); }
.goal .t { flex: 1 1 200px; min-width: 0; font-size: 18px; font-weight: 700; }
.goal .g { display: block; font-size: 13px; font-weight: 500; color: var(--gray); }
.sqs { display: inline-flex; gap: 3px; flex: 0 1 260px; flex-wrap: wrap; }
.sqs i { display: block; width: 14px; height: 14px; border: 1.5px solid var(--red); background: #fff; }
.sqs i.k { border-color: var(--ink); background: var(--ink); }
.goal .n { flex: 0 0 100px; font-size: 14px; font-weight: 500; color: var(--gray); }
.goal .n b, .goal .h { font-family: var(--latin); font-weight: 700; color: var(--ink); }
.goal .n b { font-size: 22px; }
.goal .h { flex: 0 0 96px; text-align: right; font-size: 26px; line-height: 1; }
.goal .h span { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--gray); margin-left: 4px; }

/* ツリー */
.treebox { overflow-x: auto; margin-top: 8px; }
.tree { position: relative; margin: 0 auto; }
.tree svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.tree path { fill: none; stroke: var(--off); }
.tree path.must { stroke-width: 6; }
.tree path.helps { stroke-width: 2; }
.tree path.known { stroke: var(--ink); }
.tree path.path { stroke: var(--red); }
.nd { position: absolute; width: 116px; height: 46px; padding: 0 4px; border: 1px solid var(--ink); border-radius: 0; background: var(--ground); color: var(--ink); cursor: pointer; text-align: center; line-height: 1; }
.nd .t { display: block; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.nd .t b { font-family: var(--latin); font-size: 16px; color: var(--red); margin-right: 4px; }
.nd .c { display: block; font-family: var(--latin); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--gray); }
.nd.rest { background: #fff; border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.nd.known { background: var(--ink); color: #fff; }
.nd.known .c { color: #fff; }
.nd.goalnode { background: var(--red); border-color: var(--red); color: #fff; }
.nd.goalnode .c, .nd.goalnode .t b { color: #fff; }
.nd.stub { border-style: dashed; }
.nd.stub .t { font-weight: 500; }
.nd.sel { outline: 2px solid var(--ink); outline-offset: 3px; }

.region-switch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.region { position: absolute; border: 1px solid var(--gray); background: rgba(255, 255, 255, 0.6); pointer-events: none; }
.region-name { position: absolute; padding: 0 6px; background: var(--ground); color: var(--gray); font-size: 12px; font-weight: 700; line-height: 20px; letter-spacing: 0.06em; pointer-events: none; }

/* 下段 */
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px 48px; padding-top: 24px; }
.cols > div { min-width: 0; }
.steps { margin-top: 12px; border-top: 1px solid var(--ink); }
.step { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font-size: 15px; text-align: left; cursor: pointer; }
.step:hover { background: #ECEEF2; }
.step .no { width: 30px; height: 30px; flex: none; background: var(--red); color: #fff; text-align: center; font-family: var(--latin); font-size: 16px; font-weight: 700; line-height: 30px; }
.step .t { flex: 1; min-width: 0; font-weight: 700; }
.step .h { font-family: var(--latin); font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: var(--gray); }
.detail h3 { margin: 12px 0 0; font-size: 26px; line-height: 1.3; font-weight: 900; letter-spacing: 0.04em; }
.detail .meta { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.detail .blk { margin-top: 16px; }
.detail .blk .btns, .detail .blk p { margin: 6px 0 0; }
.note { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--gray); }
.res { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.res .a { font-size: 13px; color: var(--gray); }
.book { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.book .cover { flex: none; width: 96px; height: 136px; border: 1px solid var(--ink); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; text-decoration: none; }
.book .cover img { width: 100%; height: 100%; object-fit: contain; }
.book .cover span { padding: 8px; font-size: 11px; font-weight: 700; line-height: 1.5; color: var(--ink); border-top: 3px solid var(--red); }
.book .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.book .info .meta { margin: 0; }
.book .t { font-size: 16px; font-weight: 700; }
.book .a { font-size: 13px; color: var(--gray); }
.book .btns { margin-top: 8px; align-items: center; gap: 16px; }

/* 診断 */
.card { border: 1px solid var(--ink); background: #fff; padding: 40px 36px; margin-top: 36px; }
.card .q { margin-top: 8px; font-size: 30px; line-height: 1.5; font-weight: 700; }
.card .btns { margin-top: 28px; gap: 12px; }
.strip { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.strip span { flex: 1 1 120px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; border: 1px solid var(--ink); font-size: 14px; font-weight: 700; text-align: center; }
.strip .ok { background: var(--ink); color: #fff; }
.strip .cur { background: #fff; border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.strip .far { border-color: #A9AFBA; color: #676D7A; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .band { padding: 20px; }
  .band h1 { font-size: 32px; }
  .stat .v { font-size: 40px; }
  .hero { padding-top: 40px; }
  .hero label { font-size: 64px; }
  .card { padding: 24px 20px; }
  .card .q { font-size: 22px; }
}

.review-row{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.review-row span{display:block;color:var(--gray);font-size:13px;margin-left:24px}
.review-row input{width:18px;height:18px;accent-color:var(--red)}
summary{cursor:pointer;min-height:44px;padding-top:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.mobile-hint{display:none}
@media(max-width:640px){.treebox{max-height:360px;overflow:auto}.mobile-hint{display:block}}

.practice{max-width:960px}
.practice-heading{margin:56px 0 28px}.practice-heading h1{font-size:38px;margin:6px 0}.practice-heading p{margin:6px 0}
.concept .step-formula{font-size:17px;line-height:1.8}.practice .concept{background:#fff;border:1px solid var(--line);padding:20px 24px;margin:0 0 28px}.practice .concept p{margin:6px 0}.copied:empty{display:none}.copied{margin:6px 0 0}
.practice-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.exercise{background:#fff;border:1px solid var(--ink);padding:32px}
.exercise h2{white-space:pre-line;font-size:23px;line-height:1.7;letter-spacing:0;margin:12px 0 24px}
.ptable{margin:0 0 24px;overflow-x:auto}.ptable figcaption{font-size:13px;font-weight:700;color:var(--gray);margin-bottom:6px}.ptable table{border-collapse:collapse;font-size:15px}.ptable th,.ptable td{border:1px solid var(--ink);padding:6px 16px;text-align:right;white-space:nowrap}.ptable th{background:var(--ground);font-weight:700;text-align:center}
.exercise-answer{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}.exercise-answer p{font-size:24px;font-weight:700;margin:12px 0}
.walkthrough{margin-top:32px}.walkthrough h3{font-size:16px;margin-bottom:16px}
.explain-step{border-top:1px solid var(--line);padding:8px 0}.explain-step:last-child{border-bottom:1px solid var(--line)}
.step-number{font-family:var(--latin);color:var(--red);font-size:20px;font-weight:700;margin-right:8px}.step-body{padding:0 24px 12px}.step-body p{font-size:18px;line-height:1.9;margin:10px 0}.step-body .link{font-size:13px;color:var(--gray)}
#prompt-panel{margin-top:20px;padding:20px;background:var(--ground);border-left:3px solid var(--red)}
#prompt-panel label{display:block;font-size:14px;font-weight:700}#practice-prompt{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid var(--line);font:inherit;resize:vertical}#copy-status{font-size:13px;margin-bottom:0}
.exercise-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px}
@media(max-width:640px){.practice-heading{margin-top:32px}.exercise{padding:20px}.exercise h2{font-size:20px}.step-body{padding-left:12px;padding-right:8px}}

.step-formula{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Georgia,"Yu Mincho",serif;font-size:21px;line-height:1.8;background:var(--ground);border-left:3px solid var(--line);padding:14px 18px;margin:12px 0}.exercise-source{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}.step-body p{font-size:15px}.practice-heading h1{font-size:32px}@media(max-width:640px){.step-formula{font-size:17px;padding:12px}.practice-heading h1{font-size:27px}}

@media (max-width: 800px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

</style>
</head>

<div id="app"></div>
<script>
window.HOWTREE_DATA = {"config":{"name":"Howtree","amazon_tag":"","systems":[{"id":"course","name":"学年・科目","tags":[{"id":"elem","name":"小学校"},{"id":"jh1","name":"中1"},{"id":"jh2","name":"中2"},{"id":"jh3","name":"中3"},{"id":"math1","name":"数I"},{"id":"matha","name":"数A"},{"id":"math2","name":"数II"},{"id":"mathb","name":"数B"},{"id":"math3","name":"数III"},{"id":"mathc","name":"数C"}]},{"id":"field","name":"分野","tags":[{"id":"num","name":"数と式"},{"id":"geo","name":"図形"},{"id":"func","name":"関数"},{"id":"data","name":"データ"},{"id":"logic","name":"論理"}]}],"groups":{"math-school":"中学までの数学","spi":"SPI対策","hs-math":"高校1年の数学","hs-math-2":"高校数学（数II・数B）","hs-math-3":"高校数学（数III・数C）"}},"nodes":{"hs-data":{"id":"hs-data","name":"データの分析","type":"learn","goal":"四分位数、分散、相関を求めて、データの傾向を説明できる。","part_of":"hs-math","tags":["math1","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たくさんの数値からなるデータの特徴を、いくつかの数で要約する方法を学びます。四分位数は、データを小さい順に並べて4等分する位置の値で、散らばりの様子を箱ひげ図で表すのに使います。分散は、各値と平均値との差を2乗して平均した値で、その正の平方根を標準偏差といいます。どちらも、値が大きいほど散らばりが大きいことを表します。相関は、二つのデータの間に「一方が大きいほど他方も大きい（または小さい）」という傾向があるかどうかを表します。","example":"データ：2、4、4、6、9\n平均値：(2 + 4 + 4 + 6 + 9) ÷ 5 = 5\n平均値との差の2乗：9、1、1、1、16\n分散：(9 + 1 + 1 + 1 + 16) ÷ 5 = 5.6\n標準偏差：√5.6（約2.4）\n第1四分位数：(2 + 4) ÷ 2 = 3\n第3四分位数：(6 + 9) ÷ 2 = 7.5","note":"中央値（第2四分位数）は真ん中の4です。その前半2、4と後半6、9のそれぞれの中央値が、第1・第3四分位数です。相関は、散布図にかくと傾向を目で確かめられます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-average","level":"must"}]},"hs-expressions":{"id":"hs-expressions","name":"数と式","type":"learn","goal":"式の展開と因数分解、一次不等式ができる。","part_of":"hs-math","tags":["math1","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文字を含む式を、計算の規則に従って別の形に書き直すことを学びます。展開は、かっこのついた積の形をばらして和の形にすることです。因数分解はその逆で、和の形をいくつかの式の積の形にまとめることです。不等式は、二つの式の大小を不等号（＞、＜、≧、≦）で表した式で、方程式と同じように変形して解きます。ただし、両辺に負の数をかけたり、負の数で割ったりすると、不等号の向きが逆になります。","example":"展開：(x + 2)(x + 3) = x² + 5x + 6\n因数分解：x² + 5x + 6 = (x + 2)(x + 3)\n一次不等式：−2x + 1 ＞ 7\n　−2x ＞ 6\n　x ＜ −3","note":"最後の行では両辺を−2で割ったので、不等号の向きが逆になっています。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-linear-eq","level":"must"}]},"hs-quadratic":{"id":"hs-quadratic","name":"二次関数の応用","type":"learn","goal":"二次関数の最大と最小を求め、二次不等式を解ける。","part_of":"hs-math","tags":["math1","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二次関数 y = ax² + bx + c は、y = a(x − p)² + q の形に変形（平方完成）すると、グラフの頂点が点（p, q）にある放物線だとわかります。a が正なら頂点で y は最小になり、a が負なら頂点で最大になります。x の範囲が限られているときは、範囲の両端での値と、頂点が範囲の中にあれば頂点での値を比べて、最大と最小を決めます。二次不等式は、グラフが x 軸より上にあるか下にあるかを読み取って解きます。","example":"y = x² − 4x + 3 = (x − 2)² − 1\n頂点は点（2, −1）、最小値は −1（x = 2 のとき）\n二次不等式：x² − 4x + 3 ＜ 0\n　(x − 1)(x − 3) ＜ 0\n　1 ＜ x ＜ 3","note":"グラフが x 軸より下にあるのは、x 軸と交わる1と3の間です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-quadratic-fn","level":"must"},{"id":"hs-expressions","level":"must"}]},"hs-trig":{"id":"hs-trig","name":"三角比","type":"learn","goal":"正弦、余弦、正接を使って、辺の長さや面積を求められる。","part_of":"hs-math","tags":["math1","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形では、直角以外の一つの角 θ の大きさが決まると、三角形の大きさに関係なく、辺の長さの比が決まります。この比を三角比といいます。斜辺に対する「θ の向かいの辺」の比を sin θ（サイン、正弦）、斜辺に対する「θ のとなりの辺」の比を cos θ（コサイン、余弦）、となりの辺に対する向かいの辺の比を tan θ（タンジェント、正接）といいます。角と一辺の長さがわかれば、ほかの辺の長さを求められます。また、二辺の長さとその間の角がわかれば、三角形の面積を「1/2 × 二辺の積 × sin（間の角）」で求められます。数Iでは、三角比を90°より大きく180°までの角にも広げます。","example":"斜辺5、向かいの辺3、となりの辺4 の直角三角形\nsin θ = 3/5\ncos θ = 4/5\ntan θ = 3/4\n30°の三角比：sin 30° = 1/2、cos 30° = √3/2、tan 30° = 1/√3\n二辺が4と6、その間の角が30°の三角形の面積：1/2 × 4 × 6 × sin 30° = 6","note":"斜辺が10で θ が30°なら、向かいの辺は 10 × 1/2 = 5 です。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-similarity","level":"must"},{"id":"math-pythagoras","level":"must"}]},"hs2-calculus":{"id":"hs2-calculus","name":"微分・積分の考え","type":"learn","goal":"三次までの関数を微分して増減を調べ、二次までの関数を積分して面積を求められる。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"関数の値の変わり方を調べる「微分」と、その逆の計算である「積分」の基本を学ぶ単元です。関数 f(x) のグラフ上のある点での接線の傾きを、その点での微分係数といいます。x の各値に微分係数を対応させた関数を導関数といい、f′(x) と書きます。導関数の符号から、関数が増えているか減っているかがわかり、最大・最小を調べられます。積分は微分の逆の計算で、グラフと x 軸で囲まれた部分の面積を求めるのに使います。数IIでは、微分は3次まで、積分は2次までの多項式で表される関数を中心に扱います。","example":"f(x) = x² のとき f′(x) = 2x\nf(x) = x³ − 3x のとき f′(x) = 3x² − 3\n∫ 2x dx = x² + C（C は積分定数）\ny = x² と x 軸、直線 x = 3 で囲まれた部分の面積：9","note":"f(x) = x² のグラフの、x = 1 の点での接線の傾きは f′(1) = 2 です。面積の9は、x³/3 に x = 3 を入れた 27/3 = 9 から、x = 0 を入れた 0 を引いて求められます。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs-quadratic","level":"must"},{"id":"hs2-expressions","level":"must"}]},"hs2-coordinates":{"id":"hs2-coordinates","name":"図形と方程式","type":"learn","goal":"直線や円を式で表し、位置関係を調べられる。","part_of":"hs-math-2","tags":["math2","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"図形を座標平面の上に置き、式を使って調べる単元です。2点間の距離や、線分を決まった比に分ける点の座標を、座標から計算で求めます。直線は y = mx + n（y 軸に平行な直線は x = k）、円は中心（a, b）と半径 r を使って (x − a)² + (y − b)² = r² という方程式で表せます。方程式を連立して解くと、直線と円の交点や、接するかどうかがわかります。不等式が表す領域も扱います。","example":"2点 (1, 2)、(4, 6) の間の距離：√(3² + 4²) = √25 = 5\n中心 (0, 0)、半径 5 の円：x² + y² = 25\nこの円と直線 x = 3 の交点：(3, 4)、(3, −4)","note":"x = 3 を円の式に入れると 9 + y² = 25 なので、y = 4 または y = −4 です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-quadratic","level":"must"}]},"hs2-explog":{"id":"hs2-explog","name":"指数関数・対数関数","type":"learn","goal":"指数と対数の計算ができ、グラフをかける。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"同じ数を何回もかける「累乗」の考えを、指数が0や負の数、分数の場合にも広げ、y = aˣ の形の関数（指数関数）を扱います。また、「a を何乗すると M になるか」を表す数を logₐ M と書き、対数といいます（a は1でない正の数、M は正の数）。対数は指数を逆から見たもので、y = logₐ x を対数関数といいます。対数を使うと、かけ算を足し算に直して考えられます。","example":"2³ = 8、2⁰ = 1、2⁻¹ = 1/2\nlog₂ 8 = 3（2を3乗すると8になるから）\nlog₂ 4 + log₂ 8 = log₂ 32\n左辺は 2 + 3、右辺は 5","note":"最後の2行は、4 × 8 = 32 というかけ算が、対数では 2 + 3 = 5 という足し算になることを表しています。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hs2-expressions":{"id":"hs2-expressions","name":"いろいろな式","type":"learn","goal":"式の割り算、二項定理、複素数、高次方程式の計算ができる。","part_of":"hs-math-2","tags":["math2","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数Iで学んだ式の計算を広げる単元です。3乗の展開や二項定理、整式を整式で割る計算、分数式を扱います。また、2乗すると −1 になる数 i（虚数単位）を導入し、a + bi の形の数（複素数）まで数の範囲を広げます。これにより、実数の範囲では解がなかった二次方程式も解けるようになります。3次以上の方程式は、因数定理を使って因数分解して解きます。","example":"(a + b)³ = a³ + 3a²b + 3ab² + b³\ni² = −1\nx² + 1 = 0 の解：x = i、x = −i\nx³ − 1 = (x − 1)(x² + x + 1)","note":"x³ − 1 に x = 1 を代入すると0になるので、x − 1 を因数にもちます（因数定理）。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hs2-trig":{"id":"hs2-trig","name":"三角関数","type":"learn","goal":"一般角の三角関数と加法定理を使える。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数Iの三角比を、180°より大きい角や負の角にも広げて、角の大きさ θ の関数として扱う単元です。原点を中心とする半径1の円（単位円）の上の点の座標を使って、sin θ と cos θ を決めます。角の大きさは、度のほかに、弧の長さで測る「弧度法（ラジアン）」でも表し、180° が π ラジアンです。sin と cos のグラフは同じ形の波を繰り返し、360°（2π）ごとに元に戻ります。二つの角の和の三角関数を求める加法定理も学びます。","example":"180° = π ラジアン、90° = π/2 ラジアン\nsin 90° = 1、cos 180° = −1\nsin²θ + cos²θ = 1\n加法定理：sin(α + β) = sin α cos β + cos α sin β","note":"sin 75° は、45° と 30° の和として加法定理で求められます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-trig","level":"must"}]},"hs3-differential":{"id":"hs3-differential","name":"微分法","type":"learn","goal":"いろいろな関数を微分し、グラフの形を調べられる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数IIの微分を、分数の形の関数、無理関数、三角関数、指数関数、対数関数にまで広げる単元です。二つの関数の積や商を微分する公式、関数の中に別の関数が入った合成関数を微分する公式を学びます。導関数をもう一度微分した第二次導関数を使うと、グラフのへこみ方（凹凸）までわかり、いろいろな関数のグラフの形をくわしく調べられます。速度や加速度、近似値の計算にも使います。","example":"(sin x)′ = cos x\n(eˣ)′ = eˣ\n(log x)′ = 1/x\n積の微分：(x sin x)′ = sin x + x cos x\n合成関数の微分：(sin 2x)′ = 2 cos 2x","note":"e は約2.718の数で、eˣ は微分しても形が変わらない指数関数です。log x は e を底とする対数（自然対数）です。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs3-limit","level":"must"},{"id":"hs2-calculus","level":"must"}]},"hs3-integral":{"id":"hs3-integral","name":"積分法","type":"learn","goal":"いろいろな関数を積分し、面積や体積を求められる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数IIの積分を、三角関数、指数関数、分数の形の関数などに広げる単元です。そのままでは積分しにくい関数を、文字を置き換えて積分する置換積分法や、積の形の関数を積分する部分積分法を学びます。定積分を使って、曲線で囲まれた図形の面積、立体の体積、曲線の長さを求めます。","example":"∫ cos x dx = sin x + C\n∫ eˣ dx = eˣ + C\n∫ 1/x dx = log|x| + C\ny = sin x（0 ≦ x ≦ π）と x 軸で囲まれた部分の面積：2","note":"C は積分定数です。面積の2は、−cos x に x = π と x = 0 を入れた差 1 − (−1) から求められます。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs3-differential","level":"must"}]},"hs3-limit":{"id":"hs3-limit","name":"極限","type":"learn","goal":"数列と関数の極限を求められる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数列や関数の値が、ある値に限りなく近づいていく様子を調べる単元です。n を限りなく大きくしたとき、数列の項が一つの値 α に限りなく近づくなら、その数列は α に収束するといい、α を極限値といいます。収束しないときは、発散するといいます。無限に続く数列の項をすべて足した和（無限級数）や、x がある値に近づくときの関数の極限も扱います。極限の考えは、数IIIの微分と積分の土台になります。","example":"n が限りなく大きくなるとき、1/n は 0 に近づく\n無限等比級数：1/2 + 1/4 + 1/8 + … の和は 1\nx が 0 に近づくとき、(sin x) ÷ x は 1 に近づく（x はラジアン）","note":"無限等比級数は、公比の絶対値が1より小さいときに収束し、和は「初項 ÷ (1 − 公比)」です。上の例では 1/2 ÷ (1 − 1/2) = 1 です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hsb-sequence","level":"must"},{"id":"hs2-explog","level":"must"},{"id":"hs2-trig","level":"must"}]},"hsa-activity":{"id":"hsa-activity","name":"数学と人間の活動","type":"learn","goal":"約数と倍数などの整数の性質を使って、問題を解ける。","part_of":"hs-math","tags":["matha","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数学が人間の活動の中でどう生まれ、使われてきたかを題材に、整数の性質などを学ぶ単元です。二つの整数に共通する約数のうち最大のものを最大公約数、共通する倍数のうち最小の正の数を最小公倍数といいます。大きな数の最大公約数は、割り算の余りを繰り返し使う「ユークリッドの互除法」で求められます。また、0と1だけで数を表す二進法のように、10以外の数を位取りの基準にした数の表し方も扱います。","example":"12と18の最大公約数：6\n12と18の最小公倍数：36\n互除法：18 ÷ 12 は 1 あまり 6、12 ÷ 6 は 2 あまり 0 なので、最大公約数は6\n二進法の 1101 は、十進法で 8 + 4 + 0 + 1 より 13","note":"最大公約数と最小公倍数の積 6 × 36 = 216 は、もとの二つの数の積 12 × 18 = 216 と等しくなります。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}]},"hsa-geometry":{"id":"hsa-geometry","name":"図形の性質","type":"learn","goal":"三角形や円の性質を使って、角の大きさや長さを求められる。","part_of":"hs-math","tags":["matha","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"三角形と円がもつ性質を、証明をもとに整理して使う単元です。三角形には、重心・外心・内心という特別な点があります。重心は三本の中線の交点、外心は三辺の垂直二等分線の交点、内心は三つの角の二等分線の交点です。円については、同じ弧に対する円周角は等しく、中心角の半分になること（円周角の定理）や、円に内接する四角形の向かい合う角の和が180°になることなどを使います。作図や、空間図形の性質も扱います。","example":"円周角の定理：中心角が100°の弧に対する円周角は 100° ÷ 2 = 50°\n円に内接する四角形：向かい合う角の一方が70°なら、もう一方は 180° − 70° = 110°\n重心：各中線を、頂点の側から 2：1 に分ける","note":"円周角の定理は中学3年で学びます。この単元では、それをもとに円の新しい性質を証明し、応用します。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-similarity","level":"must"}]},"hsa-probability":{"id":"hsa-probability","name":"場合の数と確率","type":"learn","goal":"順列と組合せを使って場合の数を数え、確率を求められる。","part_of":"hs-math","tags":["matha","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"ことがらの起こり方が何通りあるかを、順列と組合せを使って数え、それをもとに確率を求める単元です。異なる n 個から r 個を選んで一列に並べる並べ方を順列といい、ₙPᵣ で表します。並べる順番を区別せずに r 個を選ぶ選び方を組合せといい、ₙCᵣ で表します。確率では、同時には起こらない二つのことがらの確率を足す場合、互いに影響しない試行を続けるときに確率をかける場合、ある条件のもとでの確率（条件付き確率）を扱います。また、得られる値とその確率をかけて足し合わせた期待値も扱います。","example":"₅P₂ = 5 × 4 = 20\n₅C₂ = (5 × 4) ÷ (2 × 1) = 10\nさいころを2回投げて2回とも1の目が出る確率：1/6 × 1/6 = 1/36\n期待値：10本中1本だけ100円が当たるくじを1本引くとき、100 × 1/10 + 0 × 9/10 = 10（円）","note":"₅P₂ は「5個から2個を選んで並べる」、₅C₂ は「5個から2個を選ぶ」の意味で、数字は P や C の左下と右下に小さく書きます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-probability","level":"must"}]},"hsb-sequence":{"id":"hsb-sequence","name":"数列","type":"learn","goal":"等差数列と等比数列の一般項と和を求め、漸化式を扱える。","part_of":"hs-math-2","tags":["mathb","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数を一列に並べたものを数列といい、その並び方の規則を式で表す単元です。となり合う項の差が一定の数列を等差数列、となり合う項の比が一定の数列を等比数列といいます。n 番目の項を n の式で表したものを一般項といいます。はじめの項から n 番目までの和を求める公式や、和を表す記号 Σ（シグマ）を学びます。また、前の項から次の項を決める規則（漸化式）で数列を定めることや、自然数についての命題を証明する数学的帰納法も扱います。","example":"等差数列 2、5、8、11、…：一般項は 3n − 1\n等比数列 3、6、12、24、…：一般項は 3 × 2ⁿ⁻¹\n1 から 100 までの整数の和：100 × 101 ÷ 2 = 5,050","note":"等差数列の和は、(はじめの項 + 終わりの項) × 項の数 ÷ 2 で求められます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hsb-society":{"id":"hsb-society","name":"数学と社会生活","type":"learn","goal":"身の回りの事象を数学で表し、データをもとに判断できる。","part_of":"hs-math-2","tags":["mathb","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"身の回りや社会の問題を、数学の言葉に直して考える進め方を学ぶ単元です。現実の問題から大事な条件だけを取り出して式やグラフで表したものを、数理モデルといいます。モデルを使って計算し、結果を現実に当てはめて確かめ、合わなければ条件を見直します。データに合う直線や曲線を求めて、先の値を予測することも扱います。","example":"問題：プランAは基本料2,000円と1分10円、プランBは基本料なしで1分30円。どちらが安いか\nモデル：Aの料金は 2,000 + 10x、Bの料金は 30x（x は通話の分数）\n二つが等しくなるとき：2,000 + 10x = 30x より x = 100\n結論：月に100分より多く話すなら、Aが安い","note":"実際には通話時間が月によって変わるので、何か月分かのデータで確かめます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"hs-data","level":"must"}]},"hsb-statistics":{"id":"hsb-statistics","name":"統計的な推測","type":"learn","goal":"確率分布と正規分布を使って、推定と検定ができる。","part_of":"hs-math-2","tags":["mathb","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"一部のデータ（標本）から、全体（母集団）の様子を確率を使って推し量る方法を学ぶ単元です。とり得る値とその確率の対応を確率分布といい、その平均（期待値）と散らばり（分散、標準偏差）を計算します。平均を中心に左右対称な山の形をした分布を「正規分布」といい、身長や測定の誤差など、これに近い分布になるデータがあります。標本の平均から母集団の平均がどの範囲にあるかを見積もる「推定」と、ある仮説のもとで、得られた結果がどのくらい起こりにくいかを確率で調べ、仮説を捨てるかどうかを判断する「仮説検定」を扱います。","example":"さいころを1回投げたときの出る目の期待値：(1 + 2 + 3 + 4 + 5 + 6) ÷ 6 = 3.5\n正規分布では、平均 ± 1.96 × 標準偏差 の範囲に、全体の約95%が入る\n母平均に対する信頼度95%の信頼区間：標本平均 ± 1.96 × 母集団の標準偏差 ÷ √(標本の大きさ)","note":"1.96 という数は、正規分布の表から得られます。母集団の標準偏差がわからないときは、標本が十分大きければ、標本の標準偏差で代用します。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-data","level":"must"},{"id":"hsa-probability","level":"must"}]},"hsc-curves":{"id":"hsc-curves","name":"平面上の曲線と複素数平面","type":"learn","goal":"二次曲線と媒介変数表示、複素数平面を扱える。","part_of":"hs-math-3","tags":["mathc","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"平面上の曲線を式で表す方法と、複素数を平面上の点として表す方法を学ぶ単元です。放物線、楕円、双曲線は、どれも x と y の二次式で表される曲線で、まとめて二次曲線といいます。曲線は、x と y をそれぞれ別の文字 t の式で表す媒介変数表示や、原点からの距離と角で表す極座標でも表せます。複素数 a + bi は、座標平面の点（a, b）に対応させて考えることができ、この平面を複素数平面といいます。複素数のかけ算は、平面上での回転と拡大・縮小に対応します。","example":"楕円：x²/9 + y²/4 = 1（原点を中心に、x 軸方向に ±3、y 軸方向に ±2 まで広がる）\n原点を中心とする半径1の円の媒介変数表示：x = cos t、y = sin t\n複素数 3 + 4i は点 (3, 4)、絶対値は √(3² + 4²) = 5\ni をかけると原点のまわりに反時計回りに90°回転する：(3 + 4i) × i = 3i + 4i² = −4 + 3i","note":"点 (3, 4) を原点のまわりに反時計回りに90°回転すると、点 (−4, 3) になります。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs2-coordinates","level":"must"},{"id":"hs2-trig","level":"must"},{"id":"hs2-expressions","level":"must"}]},"hsc-expression":{"id":"hsc-expression","name":"数学的な表現の工夫","type":"learn","goal":"行列や図を使って、事象を整理して表せる。","part_of":"hs-math-3","tags":["mathc","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"日常や社会のことがらを、図、表、統計グラフ、行列、離散グラフなどを使って整理し、わかりやすく表す工夫を学ぶ単元です。数を縦と横に長方形の形に並べたものを行列といい、たくさんの数をまとめて扱えます。点と、点を結ぶ線だけで関係を表した図を離散グラフといい、路線図や人のつながりを表すのに使います。目的に合った表し方を選ぶことで、問題の構造が見えやすくなります。","example":"2行2列の行列の例：[1 2 ; 3 4]（1行目が 1 2、2行目が 3 4）\n行列の和：[1 2 ; 3 4] + [5 6 ; 7 8] = [6 8 ; 10 12]\n離散グラフの例：三つの駅 A、B、C と、AとB、BとC を結ぶ2本の路線","note":"行列の和は、同じ位置にある数どうしを足します。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"hs-data","level":"must"}]},"hsc-vector":{"id":"hsc-vector","name":"ベクトル","type":"learn","goal":"ベクトルの演算と内積を使って、図形の問題を解ける。","part_of":"hs-math-3","tags":["mathc","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"向きと大きさをもつ量をベクトルといい、矢印で表します。ベクトルは、成分（x 方向と y 方向にどれだけ進むか）を使って数の組で表せます。ベクトルどうしは成分ごとに足すことができ、ベクトルに実数をかけることもできます。二つのベクトルのなす角を使って決める「内積」を計算すると、二つのベクトルが垂直かどうかや、なす角の大きさがわかります。平面だけでなく、空間のベクトルも扱います。","example":"a = (3, 4) の大きさ：√(3² + 4²) = 5\na = (3, 4)、b = (1, 2) のとき a + b = (4, 6)\n内積：a・b = 3 × 1 + 4 × 2 = 11\n(2, 1) と (−1, 2) の内積：2 × (−1) + 1 × 2 = 0","note":"内積は「二つのベクトルの大きさの積 × cos（なす角）」で決めた数で、成分では「x 成分どうしの積 + y 成分どうしの積」で計算できます。0でない二つのベクトルの内積が0になるとき、その二つは垂直です。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs-trig","level":"must"}]},"kounin-math":{"id":"kounin-math","name":"高卒認定の数学","type":"target","goal":"高卒認定試験の数学で、合格点を取れる。","part_of":"hs-math","status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"高等学校卒業程度認定試験（高卒認定試験）は、高校を卒業していない人などが、高校を卒業した人と同等以上の学力があるかどうかを認定する国の試験です。合格すると、大学入学資格（大学を受験する資格）が得られます。この試験に合格するには、数学だけでなく、各教科の必修の科目すべてに合格する必要があります。数学は必修の科目です。","example":"この木で前提にしている単元：数と式、二次関数の応用、三角比、データの分析","note":"出題範囲の根拠資料は、まだ確認していません。受験の前に、文部科学省の案内で最新の科目と範囲を確かめてください。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"hs-expressions","level":"must"},{"id":"hs-quadratic","level":"must"},{"id":"hs-trig","level":"must"},{"id":"hs-data","level":"must"}]},"math-addsub":{"id":"math-addsub","name":"たし算ひき算","type":"learn","goal":"2けたのたし算とひき算を、暗算か筆算でできる。","part_of":"math-school","tags":["elem","num"],"status":"draft","trunk":1,"check":"48 + 37 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たし算は二つの数を合わせた数を求める計算、ひき算は一方からもう一方を取り除いた残りや、二つの数の差を求める計算です。2けたの数では、十の位と一の位に分けて考えます。一の位どうしを足して10以上になったら十の位に1くり上げ、一の位どうしで引けないときは十の位から1くり下げます。","example":"35 + 49 = 84\n84 − 49 = 35","note":"たし算の答えから足した数を引くと、もとの数に戻ります。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"46 + 27 は？","options":["63","73","83"],"answer":1,"explanation":"40 + 20 と 6 + 7 に分けると、60 + 13 = 73。"},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-angle":{"id":"math-angle","name":"角度と三角形","type":"learn","goal":"分度器で角度を測り、三角形の角の和を使える。","part_of":"math-school","tags":["elem","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"角度は、一つの点から出る二本の直線の開き具合を表す量で、単位は度（°）です。一回転が360°、一直線が180°、直角が90°です。分度器の中心を角の頂点に合わせ、一方の辺を0°の線に重ねると、もう一方の辺が指す目盛りが角度になります。どんな三角形でも、三つの角を足すと180°になります。","example":"三角形の三つの角：60° + 70° + 50° = 180°\n残りの角を求める：180° − 60° − 70° = 50°","note":"二つの角がわかれば、残りの角は計算で求められます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-shapes","level":"must"}]},"math-area":{"id":"math-area","name":"面積と体積","type":"learn","goal":"基本の図形の面積と、直方体の体積を求められる。","part_of":"math-school","tags":["elem","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"面積は平らな形の広さを表す量で、1辺が1cmの正方形がいくつ分かで数え、単位はcm²です。体積は立体のかさを表す量で、1辺が1cmの立方体がいくつ分かで数え、単位はcm³です。長方形の面積は「たて × 横」、三角形の面積は「底辺 × 高さ ÷ 2」、直方体の体積は「たて × 横 × 高さ」で求めます。","example":"長方形（たて4cm、横6cm）の面積：4 × 6 = 24\n三角形（底辺6cm、高さ4cm）の面積：6 × 4 ÷ 2 = 12\n直方体（たて4cm、横6cm、高さ5cm）の体積：4 × 6 × 5 = 120","note":"面積の単位はcm²、体積の単位はcm³です。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-muldiv","level":"must"},{"id":"math-shapes","level":"must"}]},"math-average":{"id":"math-average","name":"平均とデータ","type":"learn","goal":"平均値と中央値を求め、散らばりを説明できる。","part_of":"math-school","tags":["elem","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"平均値は、データの値をすべて足して個数で割った値で、全体をならしたときの大きさを表します。中央値は、データを小さい順に並べたときに真ん中にくる値です。データが偶数個のときは、真ん中の二つの値の平均を中央値とします。極端に大きい値や小さい値があると平均値は大きく動きますが、中央値はあまり動きません。最大の値と最小の値の差（範囲）を見ると、散らばりの大きさがわかります。","example":"データ：2、3、4、5、16\n平均値：(2 + 3 + 4 + 5 + 16) ÷ 5 = 6\n中央値：4\n範囲：16 − 2 = 14","note":"16という大きな値があるため、平均値の6は中央値の4より大きくなっています。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-table","level":"helps"}]},"math-circle":{"id":"math-circle","name":"円と円周率","type":"learn","goal":"円周の長さと円の面積を求められる。","part_of":"math-school","tags":["elem","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"円は、中心から同じ距離にある点が集まってできる形です。中心から円周までの長さを半径、中心を通って円周から円周までの長さを直径といい、直径は半径の2倍です。円周の長さは直径の約3.14倍で、この倍率を円周率といいます。円周は「直径 × 3.14」、面積は「半径 × 半径 × 3.14」で求めます。","example":"半径5cmの円の直径：5 × 2 = 10\n半径5cmの円の円周：10 × 3.14 = 31.4\n半径5cmの円の面積：5 × 5 × 3.14 = 78.5","note":"円周率は、中学からは文字 π（パイ）で表します。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-area","level":"must"}]},"math-congruence":{"id":"math-congruence","name":"合同と証明","type":"learn","goal":"三角形の合同条件を使って、証明を書ける。","part_of":"math-school","tags":["jh2","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの図形が、形も大きさも同じでぴったり重なるとき、合同であるといい、記号 ≡ で表します。三角形は、次のどれか一つが成り立てば合同だと言えます。三組の辺がそれぞれ等しい。二組の辺とその間の角がそれぞれ等しい。一組の辺とその両端の角がそれぞれ等しい。証明とは、わかっていること（仮定）から出発し、すでに正しいと認められたことだけを根拠にして、示したいこと（結論）を筋道立てて説明することです。","example":"仮定：AB = DE、BC = EF、∠B = ∠E\n根拠：二組の辺とその間の角がそれぞれ等しい\n結論：△ABC ≡ △DEF","note":"合同な図形では、対応する辺の長さと角の大きさがすべて等しくなります。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-angle","level":"must"}]},"math-fraction":{"id":"math-fraction","name":"小数と分数","type":"learn","goal":"小数と分数の四則計算ができ、互いに変換できる。","part_of":"math-school","tags":["elem","num"],"status":"draft","trunk":3,"check":"2/3 ÷ 4/5 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"小数と分数は、どちらも1より小さい量や、整数と整数の間の量を表す数です。小数は0.1や0.01のように位を10分の1ずつ細かくして表します。分数は、全体をいくつかに等しく分けたうちの何個分かを「分子/分母」の形で表します。同じ量を小数でも分数でも書けるので、計算しやすい方に直して使います。","example":"1/2 = 0.5\n3/4 = 0.75\n1/2 + 1/4 = 2/4 + 1/4 = 3/4\n0.5 × 0.6 = 0.3","note":"分数どうしを足すときは、分母をそろえます。"},"cost":{"hours":40,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"2/3 ÷ 4/5 は？","options":["8/15","6/5","5/6"],"answer":2,"explanation":"割る数の逆数を掛ける。2/3 × 5/4 = 10/12 = 5/6。"},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-linear-eq":{"id":"math-linear-eq","name":"方程式","type":"learn","goal":"一次方程式を解き、文章題に使える。","part_of":"math-school","tags":["jh1","num"],"status":"draft","featured":true,"trunk":5,"check":"3x + 5 = 20 のとき、x を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"方程式は、まだわかっていない数を文字 x で表し、等号（=）で結んだ式です。式を成り立たせる x の値を「解」といい、解を求めることを「方程式を解く」といいます。等式は、両辺に同じ数を足しても、引いても、かけても、0でない同じ数で割っても成り立ちます。この性質を使って、x だけが左辺に残る形に変えていきます。文章題では、求めたい数を x と置いて、問題文の関係を方程式に表します。","example":"2x + 7 = 15\n2x = 15 − 7\n2x = 8\nx = 4","note":"2行目では、左辺の +7 を符号を変えて右辺に移しています（移項）。x = 4 を元の式に入れると 2 × 4 + 7 = 15 で、成り立ちます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-negative","level":"must"}]},"math-linear-fn":{"id":"math-linear-fn","name":"一次関数","type":"learn","goal":"傾きと切片から式を作り、グラフを書ける。","part_of":"math-school","tags":["jh2","func"],"status":"draft","trunk":6,"check":"2点 (0, 1) と (2, 5) を通る直線の式を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"y が x の一次式 y = ax + b で表されるとき、y は x の一次関数であるといいます。a は「傾き」で、x が1増えたときに y がどれだけ増えるかを表します。b は「切片」で、x = 0 のときの y の値です。グラフは直線になり、点（0, b）を通って、右へ1進むごとに上へ a 進みます（a が負のときは下へ進みます）。比例 y = ax は、b = 0 の特別な場合です。","example":"y = 2x + 3\nx = 0 のとき y = 3\nx = 1 のとき y = 5\nx = 2 のとき y = 7","note":"傾きは2、切片は3です。x が1増えるごとに、y は2ずつ増えています。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-proportion","level":"helps"}]},"math-muldiv":{"id":"math-muldiv","name":"かけ算わり算","type":"learn","goal":"九九を使って、筆算のかけ算とわり算ができる。","part_of":"math-school","tags":["elem","num"],"status":"draft","trunk":2,"check":"36 × 24 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"かけ算は、同じ数を何回も足す計算をまとめたものです。わり算はその逆で、ある数を同じ数ずつに分けると何個分になるか、または何個かに等しく分けると1個分がいくつになるかを求めます。1けたどうしのかけ算（九九）を覚えておくと、けた数の多い計算も位ごとに分けて筆算でできます。","example":"24 × 3 = 72\n72 ÷ 3 = 24\n17 ÷ 5 = 3 あまり 2","note":"かけ算の答えをかけた数で割ると、もとの数に戻ります。割り切れないときは、あまりが出ます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"72 ÷ 8 は？","options":["8","9","12"],"answer":1,"explanation":"8 × 9 = 72 なので、72 ÷ 8 = 9。"},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-negative":{"id":"math-negative","name":"正負の数","type":"learn","goal":"負の数を含む四則計算ができる。","part_of":"math-school","tags":["jh1","num"],"status":"draft","trunk":4,"check":"(−3) × 4 − (−6) を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"0より小さい数を負の数といい、−3のように「−」をつけて表します。0より大きい数は正の数です。数直線では0を境に右が正、左が負で、右にある数ほど大きくなります。負の数を足すことは引くことと同じで、負の数を引くことは足すことと同じです。かけ算とわり算では、符号が同じ二つの数なら答えは正、違えば負になります。","example":"3 + (−5) = −2\n3 − (−5) = 8\n(−4) × (−2) = 8\n(−12) ÷ 4 = −3","note":"負の数は、かっこをつけて書くと、符号と計算の記号を見分けやすくなります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"}]},"math-probability":{"id":"math-probability","name":"確率","type":"learn","goal":"樹形図を書いて、場合の数と確率を求められる。","part_of":"math-school","tags":["jh2","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"確率は、あることがらの起こりやすさを0から1までの数で表したものです。どの結果も同じ程度に起こると考えられるとき、「そのことがらが起こる場合の数 ÷ 起こり得るすべての場合の数」で求めます。すべての場合を漏れなく重なりなく数えるために、枝分かれの図（樹形図）や表を使います。必ず起こることの確率は1、決して起こらないことの確率は0です。","example":"さいころを1回投げて3の倍数の目が出る確率：2 ÷ 6 = 1/3\n硬貨を2回投げたときの出方：表表、表裏、裏表、裏裏 の4通り\n2回とも表が出る確率：1 ÷ 4 = 1/4","note":"3の倍数の目は3、6の2通り、すべての目は6通りです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"公平な6面サイコロで偶数が出る確率は？","options":["1/6","1/3","1/2"],"answer":2,"explanation":"同じ確からしさの6通りのうち、2・4・6の3通り。3/6 = 1/2。"}},"math-proportion":{"id":"math-proportion","name":"比例と反比例","type":"learn","goal":"比例と反比例を、式とグラフで表せる。","part_of":"math-school","tags":["jh1","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"ともなって変わる二つの量 x と y があり、x が2倍、3倍になると y も2倍、3倍になる関係を比例といい、式は y = ax で表せます。反対に、x が2倍、3倍になると y が1/2、1/3になる関係を反比例といい、式は y = a/x で表せます。a は決まった数で、比例定数といいます。比例のグラフは原点を通る直線、反比例のグラフは双曲線という二本のなめらかな曲線になります。","example":"比例の例：y = 3x\n　x = 2 のとき y = 6、x = 4 のとき y = 12\n反比例の例：y = 12/x\n　x = 2 のとき y = 6、x = 4 のとき y = 3","note":"比例では y ÷ x が、反比例では x × y が、いつも同じ値（比例定数）になります。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-ratio","level":"must"}]},"math-pythagoras":{"id":"math-pythagoras","name":"三平方の定理","type":"learn","goal":"直角三角形の辺の長さを求められる。","part_of":"math-school","tags":["jh3","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形で、直角をはさむ二辺の長さを a、b、直角の向かいにあるいちばん長い辺（斜辺）の長さを c とすると、a² + b² = c² が成り立ちます。これを三平方の定理といいます。二辺の長さがわかれば、残りの一辺の長さを求められます。逆に、三辺の長さがこの式を満たす三角形は、直角三角形です。","example":"a = 3、b = 4 のとき\n3² + 4² = 9 + 16 = 25\nc² = 25 なので c = 5","note":"辺の長さが3、4、5の三角形は、直角三角形です。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-congruence","level":"helps"}]},"math-quadratic-eq":{"id":"math-quadratic-eq","name":"二次方程式","type":"learn","goal":"因数分解と解の公式で、二次方程式を解ける。","part_of":"math-school","tags":["jh3","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"移項して整理すると ax² + bx + c = 0（a は0でない）の形になる方程式を、二次方程式といいます。x の2乗の項があるのが特徴で、解はふつう二つあります。左辺を因数分解できるときは、「二つの数をかけて0になるなら、どちらかは0」という性質を使って解きます。因数分解できないときは、解の公式に a、b、c の値を当てはめて求めます。","example":"x² − 5x + 6 = 0\n(x − 2)(x − 3) = 0\nx = 2、x = 3\n解の公式：x = (−b ± √(b² − 4ac)) ÷ (2a)","note":"x = 2 のとき 4 − 10 + 6 = 0、x = 3 のとき 9 − 15 + 6 = 0 となり、どちらも式を成り立たせます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-sqrt","level":"must"}]},"math-quadratic-fn":{"id":"math-quadratic-fn","name":"二次関数","type":"learn","goal":"放物線のグラフを書き、変化の割合を求められる。","part_of":"math-school","tags":["jh3","func"],"status":"draft","featured":true,"trunk":7,"check":"y = 2x² で、x が 1 から 3 まで増えるときの変化の割合を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"y が x の2乗に比例し、y = ax² の形で表される関数です。グラフは原点を頂点とし、y 軸について左右対称な「放物線」というなめらかな曲線になります。a が正なら上に開き、a が負なら下に開きます。一次関数と違い、x が1増えたときの y の増え方は一定ではありません。x の増加量に対する y の増加量の割合を「変化の割合」といい、区間ごとに計算します。","example":"y = 3x²\nx = 1 のとき y = 3\nx = 2 のとき y = 12\nx = 3 のとき y = 27\nx が1から3まで増えるときの変化の割合：(27 − 3) ÷ (3 − 1) = 12","note":"x が1から2では y は9増え、2から3では15増えます。増え方が一定でないことがわかります。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-fn","level":"must"},{"id":"math-quadratic-eq","level":"helps"}]},"math-ratio":{"id":"math-ratio","name":"割合と比","type":"learn","goal":"百分率と比を使って、もとの量や比べる量を求められる。","part_of":"math-school","tags":["elem","num"],"status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"割合は、ある量が基準の量の何倍にあたるかを表す数です。「比べる量 ÷ 基準の量」で求め、0.25を25%（百分率）のように表します。比は、二つの量の大きさの関係を「3：2」のように並べて表したものです。どちらも、何を基準にしているかを先に確かめることが大切です。","example":"割合を求める：30 ÷ 120 = 0.25\n比べる量を求める：120 × 0.25 = 30\n基準の量を求める：30 ÷ 0.25 = 120\n比を簡単にする：6：4 は 3：2 と同じ","note":"上の三つの式は、「120人のうちの30人は25%」という同じ関係を表しています。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"800円の15%はいくら？","options":["120円","150円","680円"],"answer":0,"explanation":"15% = 0.15。800 × 0.15 = 120円。"},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-fractions-decimals","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-shapes":{"id":"math-shapes","name":"形と長さ","type":"learn","goal":"基本の図形を見分け、ものさしで長さを測れる。","part_of":"math-school","tags":["elem","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"身の回りの形は、辺（まっすぐな線）と頂点（かど）の数で見分けられます。三角形は辺が3本、四角形は辺が4本です。四つのかどがすべて直角の四角形を長方形、さらに辺の長さがすべて等しいものを正方形といいます。長さは、ものさしの目盛りを使って、cm（センチメートル）やmm（ミリメートル）の単位で測ります。","example":"三角形：辺3本、頂点3個\n四角形：辺4本、頂点4個\n1cm = 10mm\n1m = 100cm","note":"単位をそろえると、長さどうしを比べたり足したりできます。"},"cost":{"hours":8,"yen":0}},"math-similarity":{"id":"math-similarity","name":"相似","type":"learn","goal":"相似条件を使って、辺の長さの比を求められる。","part_of":"math-school","tags":["jh3","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"一方の図形を、形を変えずに拡大または縮小するともう一方とぴったり重なるとき、二つの図形は相似であるといい、記号 ∽ で表します。相似な図形では、対応する辺の長さの比がすべて等しく、対応する角の大きさはそれぞれ等しくなります。対応する辺の長さの比を相似比といいます。三角形は、次のどれか一つが成り立てば相似だと言えます。三組の辺の比がすべて等しい。二組の辺の比とその間の角がそれぞれ等しい。二組の角がそれぞれ等しい。","example":"△ABC ∽ △DEF、相似比 1：2\nAB = 3 のとき DE = 6\nBC = 4 のとき EF = 8","note":"相似比が1：2なら、△DEF の辺は、対応する △ABC の辺のどれも2倍の長さです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-congruence","level":"must"}]},"math-simultaneous":{"id":"math-simultaneous","name":"連立方程式","type":"learn","goal":"加減法と代入法で、連立方程式を解ける。","part_of":"math-school","tags":["jh2","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの文字 x と y を含む方程式を二つ組にしたものを、連立方程式といいます。方程式が一つだけでは x と y の組は一つに決まりませんが、二つの式を同時に成り立たせる組は、ふつう一つに決まります。その組を連立方程式の解といいます。解くときは、二つの式を足したり引いたりして文字を一つ消す加減法か、一方の式をもう一方に代入して文字を一つ消す代入法を使います。","example":"x + y = 5　…①\nx − y = 1　…②\n①と②を足すと 2x = 6 なので x = 3\n①に x = 3 を代入すると 3 + y = 5 なので y = 2","note":"x = 3、y = 2 は、①と②の両方を成り立たせます。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"}],"practice":{"title":"二つの条件から、答えを求める","lead":"式を立てるところから、一つずつたどる。","source_title":"Kiersten Purves, Mathematics LibreTexts, 4.3.H: Homework","source_url":"https://math.libretexts.org/Courses/Waukesha_County_Technical_College/College_Technical_Math/04%3A_Systems_of_Linear_Equations/4.03%3A_Systems_of__Equations-_Two_Equations_Two_Unknowns/4.3.H%3A_Homework","license":"CC BY 4.0","license_url":"https://creativecommons.org/licenses/by/4.0/","changes":"問題を日本語訳し（人名は省略、一部意訳）、解説を段階化しています。","reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現を確認し、出典ページの原文・著者・ライセンス表記と照合。指摘を反映した後に再検証。","problems":[{"label":"二社の歩合給","source":"Question 20","question":"ある人に、ケーブルテレビ会社二社から販売職の提示がありました。A社は基本給14,000ドルに、契約1件につき100ドルの歩合を支給します。B社は基本給20,000ドルに、契約1件につき25ドルの歩合を支給します。支給額の合計が同じになるのは、契約を何件取ったときでしょうか。","answer":"80件","steps":[{"title":"契約数を x、支給額の合計を y と置く","formula":"x：取った契約の件数\ny：支給額の合計（ドル）","body":"どちらの会社でも同じ件数の契約を取った場合で比べるので、契約数は共通の x で表します。"},{"title":"各社の支給額を、契約数 x の式で表す","formula":"A社：y = 14,000 + 100x\nB社：y = 20,000 + 25x","body":"基本給に、1件ごとの歩合×契約数を足します。"},{"title":"支給額が同じという条件を、一つの方程式で表す","formula":"14,000 + 100x = 20,000 + 25x","body":"同じ契約数で支給額が等しくなる場合を求めるので、A社の式の y と B社の式の y を等しいと置きます。一方の式の y をもう一方に入れるので、代入法です。"},{"title":"x を片側に集めて、契約数を求める","formula":"100x − 25x = 20,000 − 14,000\n75x = 6,000\nx = 80","body":"右辺の25xを左辺に、左辺の14,000を右辺に移項して整理します。最後に両辺を75で割ります。"},{"title":"80件で本当に同額になるか確かめる","formula":"A社：14,000 + 100 × 80 = 22,000\nB社：20,000 + 25 × 80 = 22,000","body":"どちらも22,000ドルです。契約数としても0以上の整数なので条件に合います。"}]},{"label":"紙とホッチキスの値段","source":"Question 21","question":"紙のパック3個とホッチキス4個を買うと40ドル、紙のパック5個とホッチキス6個を買うと62ドルです。紙のパック1個とホッチキス1個の値段をそれぞれ求めてください。","answer":"紙のパックは4ドル、ホッチキスは7ドル","steps":[{"title":"二つの品物の値段を p、s と置く","formula":"p：紙のパック1個の値段（ドル）\ns：ホッチキス1個の値段（ドル）","body":"個数ではなく、1個あたりの値段を未知数にします。"},{"title":"二通りの買い物を、それぞれ式にする","formula":"3p + 4s = 40  …①\n5p + 6s = 62  …②","body":"各品物の値段×個数を足すと、その買い物の合計金額になります。"},{"title":"s の係数をそろえるため、①を3倍、②を2倍する","formula":"9p + 12s = 120  …① × 3\n10p + 12s = 124  …② × 2","body":"等式の両辺に同じ数をかけても、等式は成り立ちます。①の両辺を3倍、②の両辺を2倍すると、s の係数がどちらも12になり、引き算で消せます。"},{"title":"係数をそろえた二つの式を引き算し、p を求める","formula":"(10p + 12s) − (9p + 12s) = 124 − 120\np = 4","body":"②を2倍した式から①を3倍した式を引きます。ホッチキスの項が消えます。式どうしを足し引きして文字を消すので、加減法です。"},{"title":"p = 4 を①に戻し、s を求める","formula":"3 × 4 + 4s = 40\n4s = 28\ns = 7","body":"紙のパックの値段を①に代入して、ホッチキスの値段を計算します。"},{"title":"両方の買い物で合計金額を確かめる","formula":"3 × 4 + 4 × 7 = 40\n5 × 4 + 6 × 7 = 62","body":"どちらの条件にも一致するため、答えは紙のパック4ドル、ホッチキス7ドルです。"}]}]}},"math-sqrt":{"id":"math-sqrt","name":"平方根","type":"learn","goal":"根号を含む式の計算ができる。","part_of":"math-school","tags":["jh3","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"2乗すると a になる数を、a の平方根といいます。正の数の平方根は正と負の二つあり、9の平方根は3と−3です。a の平方根のうち正のほうを、記号 √（ルート）を使って √a と書き、負のほうは −√a と書きます。たとえば √9 = 3 です。2の平方根は整数や分数で表せないので、√2 と −√2 のまま書きます。√2 は約1.414で、小数がどこまでも続く数です。√ の中の数に、ある数の2乗がかけ算の形で含まれていれば、その数を √ の外に出して簡単にできます。","example":"√9 = 3\n√12 = √(4 × 3) = 2√3\n√2 × √3 = √6\n3√2 + 2√2 = 5√2","note":"√12 の中の4は2の2乗なので、2として外に出せます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-negative","level":"must"}]},"math-table":{"id":"math-table","name":"表とグラフ","type":"learn","goal":"表にまとめ、棒グラフと折れ線グラフを読める。","part_of":"math-school","tags":["elem","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表は、調べたことを項目ごとに整理して数を並べたものです。棒グラフは棒の長さで数量の大小を比べるのに向いています。折れ線グラフは点を線で結んだもので、時間とともに変わる様子を見るのに向いています。どちらのグラフも、縦の軸の1目盛りがいくつを表すかを最初に確かめてから読みます。","example":"月：4月、5月、6月\n来客数：120人、150人、135人\n4月から5月：150 − 120 = 30（30人増えた）\n5月から6月：150 − 135 = 15（15人減った）","note":"折れ線グラフにすると、5月が山になる形になります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-muldiv","level":"helps"}],"assessment":{"question":"販売数は月曜12個、火曜18個、水曜15個。最も多い曜日は？","options":["月曜","火曜","水曜"],"answer":1,"explanation":"同じ単位の値を比較する。18個の火曜が最大。"}},"spi-counting":{"id":"spi-counting","name":"順列と組合せ","type":"learn","goal":"並べ方と選び方の数を、式で求められる。","part_of":"spi","tags":["matha","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"場合の数は、あることがらの起こり方が全部で何通りあるかを数えたものです。選んだものを一列に並べたり、役割を区別したりするときは「順列」で、選ぶ順番が違えば別のものとして数えます。順番や役割を区別せず、選ばれた顔ぶれだけを考えるときは「組合せ」で、同じ顔ぶれを何回も数えた分を割って取り除きます。二つのことを続けて行うときは、それぞれの場合の数をかけます。","example":"7人から2人を選んで順に並べる（順列）：7 × 6 = 42\n7人から2人を選ぶ（組合せ）：7 × 6 ÷ 2 = 21","note":"組合せでは、同じ2人を順番違いで2回数えているので、2で割ります。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"6人の中から、当番を2人選びます。選び方は何通りあるでしょうか。","options":["15通り","30通り","36通り"],"answer":0,"explanation":"順番を区別すると6 × 5 = 30通り。同じ2人を2回ずつ数えているので、30 ÷ 2 = 15通り。"},"practice":{"title":"並べ方と選び方の数を、式で求める","lead":"順番を区別するかどうかを、先に決める。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"役を区別して選ぶ","question":"5人の中から、委員長と副委員長を1人ずつ選びます。同じ人が両方を兼ねることはできません。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ役を置き、順番を区別するか決める","formula":"人数：5人\n選ぶ役：委員長1人、副委員長1人","body":"同じ2人を選んでも、どちらが委員長かが入れ替われば別の選び方です。順番（役）を区別して数えます。"},{"title":"委員長の選び方を数える","formula":"委員長の選び方：5通り","body":"5人のだれでも委員長になれます。"},{"title":"副委員長の選び方を数える","formula":"副委員長の選び方：5 − 1 = 4","body":"委員長になった人は副委員長になれないので、残りの4人から選びます。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"5 × 4 = 20","body":"委員長の5通りのそれぞれに、副委員長の4通りがあります。「それぞれに」なので、かけ算です。"},{"title":"人数を3人に減らして、書き出した数と式を比べる","formula":"A、B、Cの3人の場合：AB、AC、BA、BC、CA、CB\n3 × 2 = 6","body":"左を委員長、右を副委員長として書き出すと6通りで、式の3 × 2と一致します。同じ考え方で、5人なら5 × 4になります。"}]},{"label":"役を区別せずに選ぶ","question":"6人の中から、掃除当番を3人選びます。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ人数を置き、順番を区別するか決める","formula":"人数：6人\n選ぶ人数：3人（役の区別なし）","body":"3人の当番に役の違いはありません。選ぶ順番が違っても、同じ3人なら1通りと数えます。"},{"title":"いったん、順番を区別して数える","formula":"6 × 5 × 4 = 120","body":"1人目は6通り、2人目は残りの5通り、3人目は残りの4通りです。"},{"title":"同じ3人が、何回数えられているかを求める","formula":"3 × 2 × 1 = 6","body":"3人を並べる順番は、1人目が3通り、2人目が残りの2通り、3人目が残りの1通りです。たとえばA、B、Cの3人は、ABC、ACB、BAC、BCA、CAB、CBAの6通りの順番で数えられています。"},{"title":"重なって数えた分で割って、選び方を求める","formula":"120 ÷ 6 = 20","body":"どの3人の組も6回ずつ数えているので、6で割ると組の数になります。"},{"title":"4人から3人を選ぶ場合で、考え方を確かめる","formula":"4 × 3 × 2 = 24\n24 ÷ 6 = 4","body":"4人から3人を選ぶのは、選ばない1人を決めるのと同じなので4通りです。式でも4通りになります。"}]},{"label":"二つのグループから選ぶ","question":"男子4人、女子3人の中から、男子2人と女子1人を選びます。選び方は何通りあるでしょうか。","answer":"18通り","steps":[{"title":"人数と選ぶ人数を置く","formula":"男子：4人から2人を選ぶ\n女子：3人から1人を選ぶ","body":"男子の選び方と女子の選び方を、別々に数えてから組み合わせます。選ばれる人に役の区別はありません。"},{"title":"男子2人の選び方を数える","formula":"4 × 3 = 12\n12 ÷ 2 = 6","body":"順番を区別すると12通りです。同じ2人を2回ずつ数えているので、2で割って6通りです。"},{"title":"女子1人の選び方を数える","formula":"女子の選び方：3通り","body":"3人のうちのだれか1人です。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"6 × 3 = 18","body":"男子の6通りのそれぞれに、女子の3通りがあります。"},{"title":"足し算にしてはいけないことを確かめる","formula":"誤り：6 + 3 = 9\n正しい：6 × 3 = 18","body":"足し算の9通りは、「男子2人を選ぶ」か「女子1人を選ぶ」のどちらか一方だけをする場合の数です。今回は両方を同時に行うので、かけ算の18通りになります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-discount":{"id":"spi-discount","name":"料金の割引","type":"learn","goal":"団体割引など、条件つきの料金の合計を求められる。","part_of":"spi","tags":["num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"料金の割引は、人数や個数などの条件によって割引が変わるときの、料金の合計を求める問題です。「20人以上は全員が2割引」のように全員に割引がかかる型と、「30人を超えた分だけ1割引」のように一部にだけかかる型があります。どの人に、どの料金がかかるかを先に分けてから計算します。","example":"全員が割引：通常料金 × (1 − 割引の割合) × 人数\n超えた分だけ割引：通常料金 × 基準の人数 + 割引料金 × 超えた人数\n例　1人1,000円、10人を超えた分は2割引、12人の合計：1,000 × 10 + 800 × 2 = 11,600","note":"同じ「2割引」でも、だれの分にかかるかで合計が変わります。"},"cost":{"hours":4,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"入場料は1人500円。10人を超えた分は1人につき2割引になる。15人の合計は？","options":["6,000円","7,000円","7,500円"],"answer":1,"explanation":"割引になるのは10人を超えた5人だけ。2割引の1人分は 500 × 0.8 = 400円。500 × 10 + 400 × 5 = 7,000円。全員を割引すると6,000円、誰も割引しないと7,500円になり、どちらも誤り。"},"practice":{"title":"条件つきの割引で、料金の合計を求める","lead":"割引になるのは誰の分かを、先に確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全員が割引になる団体料金","question":"入場料は1人1,200円です。20人以上の団体は、全員が2割引になります。25人で入場すると、料金の合計はいくらでしょうか。","answer":"24,000円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人1,200円\n割引：20人以上で全員2割引\n人数：25人","body":"25人は20人以上なので、団体の条件に当てはまります。25人全員が割引の対象です。"},{"title":"割引後の1人分の料金を求める","formula":"1,200 × (1 − 0.2) = 1,200 × 0.8 = 960","body":"2割は20%、小数では0.2です。2割引は、通常料金の8割を払うということなので、通常料金を0.8倍します。"},{"title":"1人分に人数をかけて、合計を求める","formula":"960 × 25 = 24,000","body":"全員が同じ960円なので、人数の25をかけます。"},{"title":"通常料金の合計から割引額を引く方法で確かめる","formula":"通常料金の合計：1,200 × 25 = 30,000\n割引額：30,000 × 0.2 = 6,000\n30,000 − 6,000 = 24,000","body":"先に合計を出してから2割を引いても、同じ24,000円になります。"}]},{"label":"超えた分だけが割引になる料金","question":"入場料は1人800円です。30人を超えた分は、1人につき25%引きになります。42人で入場すると、料金の合計はいくらでしょうか。","answer":"31,200円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人800円\n割引：30人を超えた分だけ25%引き\n人数：42人","body":"割引になるのは全員ではありません。30人を超えた人の分だけです。"},{"title":"通常料金の人と、割引料金の人に分ける","formula":"通常料金の人数：30人\n割引料金の人数：42 − 30 = 12","body":"30人目までは通常料金です。31人目から42人目までの12人が割引料金になります。"},{"title":"通常料金の30人分を求める","formula":"800 × 30 = 24,000","body":"割引のない30人分の合計です。"},{"title":"割引後の1人分の料金を求める","formula":"800 × (1 − 0.25) = 800 × 0.75 = 600","body":"25%引きは、通常料金の75%を払うということです。"},{"title":"割引料金の12人分を求める","formula":"600 × 12 = 7,200","body":"割引後の600円に、割引になる人数の12をかけます。"},{"title":"二つを足して、合計を求める","formula":"24,000 + 7,200 = 31,200","body":"通常料金の30人分と、割引料金の12人分を足します。"},{"title":"全員を割引してはいけないことを確かめる","formula":"全員を割引した場合：600 × 42 = 25,200\n差：31,200 − 25,200 = 6,000","body":"42人全員を600円で計算すると、6,000円少なくなってしまいます。これは、通常料金のはずの30人まで200円ずつ引いた分です。"}]},{"label":"人数を多く数えた方が安くなる場合","question":"入場料は1人1,500円です。20人以上の団体は、全員が3割引になります。18人で行くとき、18人分を通常料金で払う場合と、20人分を団体料金で払う場合とでは、どちらがいくら安いでしょうか。","answer":"20人分を団体料金で払う方が、6,000円安い","steps":[{"title":"料金と割引の条件、比べる二つの払い方を置く","formula":"通常料金：1人1,500円\n団体料金：20人以上で全員3割引\n払い方A：18人分を通常料金で払う\n払い方B：20人分を団体料金で払う","body":"18人は20人に届かないので、そのままでは割引になりません。2人分を多く払って団体の条件を満たす払い方と比べます。"},{"title":"払い方Aの合計を求める","formula":"1,500 × 18 = 27,000","body":"割引なしの通常料金に、実際の人数の18をかけます。"},{"title":"団体料金の1人分を求める","formula":"1,500 × (1 − 0.3) = 1,500 × 0.7 = 1,050","body":"3割は30%、小数では0.3です。3割引は、通常料金の7割を払うということです。"},{"title":"払い方Bの合計を求める","formula":"1,050 × 20 = 21,000","body":"団体料金は20人分を払う必要があるので、18ではなく20をかけます。"},{"title":"二つの合計を比べる","formula":"払い方A：27,000\n払い方B：21,000\n27,000 − 21,000 = 6,000","body":"払う人数を2人分増やしても、20人分の団体料金の方が6,000円安くなります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-inference":{"id":"spi-inference","name":"推論","type":"learn","goal":"与えられた条件から、順位や内訳について必ず言えることを判断できる。","part_of":"spi","tags":["logic"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"推論は、与えられた条件を整理して、そこから確実に言えることを判断する問題です。計算よりも、条件を図や表にまとめる力を使います。あり得る場合をすべて書き出し、そのすべてで成り立つことだけが「必ず正しい」と言えます。一つの場合でも成り立たなければ「正しいとは限らない」、どの場合でも成り立たなければ「必ず誤り」です。","example":"条件：XはYより背が高い。YはZより背が高い。\n整理：X ＞ Y ＞ Z\n必ず正しい：XはZより背が高い\n\n条件：XはYより背が高い。XはZより背が高い。\n整理：X ＞ Y、X ＞ Z（YとZの順は決まらない）\n正しいとは限らない：YはZより背が高い","note":"二つ目の例では、YとZのどちらが高い場合もあり得ます。"},"cost":{"hours":12,"yen":0},"assessment":{"question":"AはBより前、BはCより前に到着した。必ず正しいのは？","options":["CはAより前","AはCより前","Bは最後"],"answer":1,"explanation":"条件を A → B → C と並べる。AはCより前。最後はCなので「Bは最後」は誤り。"},"practice":{"title":"条件を整理して、必ず言えることを判断する","lead":"決まることと、決まらないことを分ける。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"順位の条件を整理する","question":"A、B、C、Dの4人が競走をしました。同着はなく、次の三つのことがわかっています。\n① AはBより先にゴールした。\n② CはAより先にゴールした。\n③ DはCより後にゴールした。\nこのとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Cは1位である\nイ　Dは4位である\nウ　AはDより先にゴールした","answer":"アだけ","steps":[{"title":"三つの条件を、矢印で置く","formula":"① A → B\n② C → A\n③ C → D\n（矢印の左が、先にゴールした人）","body":"文のままでは比べにくいので、先にゴールした人を左にして、同じ形にそろえます。"},{"title":"つながる条件を、一本につなぐ","formula":"②と①：C → A → B\n③：C → D","body":"②の右と①の左がどちらもAなので、つなげられます。Dは、Cより後ということしかわかっていません。"},{"title":"Cの順位が決まるか調べる","formula":"CはAより先\nCはBより先（C → A → B から）\nCはDより先","body":"Cは、ほかの3人全員より先にゴールしています。Cは1位に決まります。"},{"title":"Dの入る場所を、すべて書き出す","formula":"C D A B\nC A D B\nC A B D","body":"A → B の順は決まっています。DはCより後ならどこでもよいので、並び方は3通りあります。"},{"title":"三つの文を、3通りすべてで調べる","formula":"ア：3通りすべてでCは1位 → 必ず正しい\nイ：Dが4位なのは C A B D だけ → 正しいとは限らない\nウ：C D A B ではDがAより先 → 正しいとは限らない","body":"「必ず正しい」と言えるのは、あり得る並び方のすべてで成り立つ文だけです。1通りでも成り立たなければ、必ず正しいとは言えません。"}]},{"label":"個数の内訳を場合分けする","question":"赤、青、白の玉が合わせて10個あります。どの色も1個以上あり、赤は青より多く、青は白より多いことがわかっています。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　白は1個である\nイ　青は3個以上である\nウ　赤は5個以上である","answer":"ウだけ","steps":[{"title":"条件を置く","formula":"合計：10個\nどの色も1個以上\n赤 ＞ 青 ＞ 白","body":"いちばん少ないのは白です。白の個数を小さい順に決めて、あり得る内訳をすべて書き出します。"},{"title":"白が1個の場合を書き出す","formula":"青と赤の合計：10 − 1 = 9\n白1・青2・赤7\n白1・青3・赤6\n白1・青4・赤5","body":"青は白より多いので2個以上です。青が5個だと赤は4個になり、赤が青より多いという条件に合いません。青がそれより多くても同じです。"},{"title":"白が2個の場合を書き出す","formula":"青と赤の合計：10 − 2 = 8\n白2・青3・赤5","body":"青は3個以上です。青が4個だと赤も4個になり、条件に合いません。青がそれより多くても同じです。"},{"title":"白が3個以上の場合がないことを確かめる","formula":"3 + 4 + 5 = 12","body":"白が3個以上なら、青は4個以上、赤は5個以上が必要です。いちばん少なくても12個になり、10個を超えます。"},{"title":"あり得る内訳をまとめ、合計を確かめる","formula":"1 + 2 + 7 = 10\n1 + 3 + 6 = 10\n1 + 4 + 5 = 10\n2 + 3 + 5 = 10","body":"白・青・赤の内訳は、この4通りだけです。"},{"title":"三つの文を、4通りすべてで調べる","formula":"ア：白2・青3・赤5 では白は2個 → 正しいとは限らない\nイ：白1・青2・赤7 では青は2個 → 正しいとは限らない\nウ：赤は7、6、5、5個で、すべて5個以上 → 必ず正しい","body":"4通りのすべてで成り立つのは、ウだけです。"}]},{"label":"位置の条件を場合分けする","question":"5階建ての建物の1階から5階に、P、Q、R、S、Tの5人が1人ずつ住んでいます。PはQより2つ上の階に住み、RはSのすぐ下の階に住んでいます。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Pは5階に住んでいる\nイ　Tは2階か4階に住んでいる\nウ　SはQより上の階に住んでいる","answer":"イだけ","steps":[{"title":"条件を置く","formula":"階：1階から5階に1人ずつ\n条件1：PはQの2つ上の階\n条件2：RはSのすぐ下の階","body":"あり得る場合が少ない条件から先に使います。条件1は、PとQの階の組が3通りしかありません。"},{"title":"条件1に合うPとQの階を書き出す","formula":"Q1階・P3階\nQ2階・P4階\nQ3階・P5階","body":"Qが4階だとPは6階になり、建物にありません。"},{"title":"それぞれの場合で、残っている階を書き出す","formula":"Q1階・P3階 → 残りは2階、4階、5階\nQ2階・P4階 → 残りは1階、3階、5階\nQ3階・P5階 → 残りは1階、2階、4階","body":"残りの三つの階に、R、S、Tが入ります。"},{"title":"条件2に合う入り方があるか、場合ごとに調べる","formula":"2階、4階、5階 → R4階・S5階、Tは2階\n1階、3階、5階 → 上下に続いた階がないので、あり得ない\n1階、2階、4階 → R1階・S2階、Tは4階","body":"RとSは、上下に続いた二つの階に、Rが下、Sが上になるように入る必要があります。残ったTの階も、これで決まります。"},{"title":"あり得る住み方をまとめる","formula":"住み方1（1階から順に）：Q、T、P、R、S\n住み方2（1階から順に）：R、S、Q、T、P","body":"条件に合う住み方は、この2通りだけです。"},{"title":"三つの文を、2通りの両方で調べる","formula":"ア：住み方1ではPは3階 → 正しいとは限らない\nイ：Tは住み方1で2階、住み方2で4階 → 必ず正しい\nウ：住み方2ではSは2階、Qは3階 → 正しいとは限らない","body":"2通りの両方で成り立つのは、イだけです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-nonverbal":{"id":"spi-nonverbal","name":"SPI非言語","type":"target","goal":"代表的な非言語問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","featured":true,"scope_note":"代表分野への学習経路です。SPI全範囲や通過を保証するものではありません。分割払い・精算・領域など未収録の項目があります。企業の受検案内で方式を確認してください。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。非言語は能力検査のうち、数を使った処理と論理的な思考を測る分野です。出題される内容や形式は、受検方式によって異なります。ここでは代表的な分野を単元として並べています。","example":"この木に入れている分野：損益算、料金の割引、速さと時間、仕事算、集合、順列と組合せ、確率、表の読み取り、推論","note":"全範囲を網羅したものではありません。受検方式は、企業からの受検案内で確かめてください。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"spi-profit","level":"must"},{"id":"spi-discount","level":"must"},{"id":"spi-speed","level":"must"},{"id":"spi-work","level":"must"},{"id":"spi-sets","level":"must"},{"id":"spi-counting","level":"must"},{"id":"math-probability","level":"must"},{"id":"spi-tables","level":"must"},{"id":"spi-inference","level":"must"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/"},{"title":"実務教育出版：SPIの基礎知識（方式別に出題が異なる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf"}],"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-profit":{"id":"spi-profit","name":"損益算","type":"learn","goal":"原価、定価、利益の関係から、売値や利益率を求められる。","part_of":"spi","tags":["num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"損益算は、商品の仕入れと販売で生じる利益や損失を、割合を使って計算する問題です。仕入れた値段を原価、利益を見込んでつけた値段を定価、実際に売った値段を売値といいます。利益は「売値 − 原価」で、マイナスなら損失です。「原価の何%の利益」「定価の何%引き」のように、割合の基準が原価か定価かで計算が変わるので、基準を先に確かめます。","example":"定価 = 原価 × (1 + 見込む利益の割合)\n売値 = 定価 × (1 − 割引の割合)\n利益 = 売値 − 原価\n利益率（原価に対する）= 利益 ÷ 原価\n例　原価1,000円に2割の利益を見込んだ定価：1,000 × 1.2 = 1,200","note":"言葉の式に、問題文の数を当てはめて解きます。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"原価600円の商品を750円で売った。原価に対する利益率は？","options":["20%","25%","125%"],"answer":1,"explanation":"利益は150円。利益率は150 ÷ 600 = 0.25 = 25%。売値ではなく原価で割る。"},"practice":{"title":"原価・定価・売値の関係から求める","lead":"何に対する割合かを、一つずつ確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現を確認し、指摘を反映した後に再検証。","problems":[{"label":"利益を見込んで定価をつける","question":"原価800円の商品に、原価の25%の利益を見込んで定価をつけました。定価はいくらでしょうか。","answer":"1,000円","steps":[{"title":"わかっている数と、割合の基準を置く","formula":"原価：800円\n見込む利益：原価の25%","body":"「原価の25%」と書いてあるので、25%は原価800円に対する割合です。"},{"title":"見込む利益を、金額で求める","formula":"800 × 0.25 = 200","body":"25%は小数で0.25です。基準の原価にかけると、利益の金額になります。"},{"title":"原価に利益を足して、定価を求める","formula":"800 + 200 = 1,000","body":"定価は、原価に見込んだ利益を上乗せした値段です。"},{"title":"同じ計算を、一つの式にまとめる","formula":"800 × (1 + 0.25) = 800 × 1.25 = 1,000","body":"原価の1倍に0.25倍を足すので、原価を1.25倍すれば一度で定価が出ます。"},{"title":"定価1,000円で、利益が原価の25%になるか確かめる","formula":"1,000 − 800 = 200\n200 ÷ 800 = 0.25","body":"利益200円は原価800円の25%です。問題の条件に合います。"}]},{"label":"定価から割り引いて売る","question":"原価1,200円の商品に、原価の30%の利益を見込んで定価をつけました。売れないので、定価の10%引きで売りました。利益は何円でしょうか。また、それは原価の何%でしょうか。","answer":"利益は204円、原価の17%","steps":[{"title":"三つの値段と、それぞれの割合の基準を置く","formula":"原価：1,200円\n定価：原価の30%増し\n売値：定価の10%引き","body":"原価の30%の利益を見込むので、定価は原価の30%増しです。30%は原価に対する割合、10%は定価に対する割合で、途中で基準が変わります。"},{"title":"原価から定価を求める","formula":"1,200 × 1.3 = 1,560","body":"原価の30%増しなので、原価を1.3倍します。"},{"title":"定価から売値を求める","formula":"1,560 × 0.9 = 1,404","body":"10%引きは、定価の90%で売るということです。定価を0.9倍します。"},{"title":"売値から原価を引いて、利益を求める","formula":"1,404 − 1,200 = 204","body":"利益は、実際に売った値段と原価の差です。定価との差ではありません。"},{"title":"利益が原価の何%かを求める","formula":"204 ÷ 1,200 = 0.17","body":"「原価の何%か」なので、原価で割ります。0.17は17%です。"},{"title":"30% − 10% = 20% としてはいけない理由を確かめる","formula":"見込んだ利益：1,200 × 0.3 = 360\n値引き：1,560 × 0.1 = 156\n360 − 156 = 204","body":"10%引きは定価1,560円に対する156円です。原価の10%（120円）ではないので、利益は原価の20%（240円）になりません。"}]},{"label":"利益から原価をさかのぼる","question":"ある商品に、原価の40%の利益を見込んで定価をつけました。定価の20%引きで売ったところ、利益は180円でした。原価はいくらでしょうか。","answer":"1,500円","steps":[{"title":"わからない原価を 1 と置く","formula":"原価：1\n定価：原価の40%増し\n売値：定価の20%引き\n利益：180円","body":"原価の金額がわからないので、原価を1として、ほかの値段を原価の何倍かで表します。原価の40%の利益を見込むので、定価は原価の40%増しです。"},{"title":"定価が原価の何倍かを求める","formula":"1 × 1.4 = 1.4","body":"原価の40%増しなので、定価は原価の1.4倍です。"},{"title":"売値が原価の何倍かを求める","formula":"1.4 × 0.8 = 1.12","body":"20%引きは定価の80%です。売値は原価の1.12倍になります。"},{"title":"利益が原価の何倍かを求める","formula":"1.12 − 1 = 0.12","body":"売値から原価を引いた残りが利益です。利益は原価の0.12倍、つまり12%です。"},{"title":"利益180円から、原価を求める","formula":"原価の0.12倍 = 180\n原価 = 180 ÷ 0.12 = 1,500","body":"原価の0.12倍が180円なので、180を0.12で割ると原価に戻ります。"},{"title":"原価1,500円で、利益が180円になるか確かめる","formula":"定価：1,500 × 1.4 = 2,100\n売値：2,100 × 0.8 = 1,680\n利益：1,680 − 1,500 = 180","body":"利益は180円で、問題の条件に合います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-sets":{"id":"spi-sets","name":"集合","type":"learn","goal":"ベン図を書いて、重なりのある人数を求められる。","part_of":"spi","tags":["matha","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"集合の問題は、ある条件に当てはまる人や物の数を、重なりに注意して数える問題です。二つの条件AとBがあるとき、全体は「Aだけ」「Bだけ」「AとBの両方」「どちらでもない」の四つに分かれます。Aの人数とBの人数をそのまま足すと、両方に当てはまる人を2回数えてしまうので、1回分を引きます。重なり合う二つの円の図（ベン図）をかくと整理しやすくなります。","example":"少なくとも一方 = Aの人数 + Bの人数 − 両方の人数\nどちらでもない = 全体 − 少なくとも一方\n例　全体30人、Aが18人、Bが15人、両方が8人のとき\n　少なくとも一方：18 + 15 − 8 = 25\n　どちらでもない：30 − 25 = 5","note":"Aだけは 18 − 8 で10人、Bだけは 15 − 8 で7人です。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"20人中、犬好き12人、猫好き9人、両方好き5人。少なくとも一方が好きな人数は？","options":["16人","20人","21人"],"answer":0,"explanation":"12 + 9 は両方の5人を二重に数えている。12 + 9 − 5 = 16人。"},"practice":{"title":"重なりのある人数を、ベン図で整理する","lead":"二重に数えた分を、一度だけ引く。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"両方に当てはまる人数を求める","question":"40人のクラスで、英語が得意な人は28人、数学が得意な人は19人、どちらも得意でない人は5人でした。英語と数学の両方が得意な人は何人でしょうか。","answer":"12人","steps":[{"title":"わかっている人数を置き、ベン図を思い浮かべる","formula":"全体：40人\n英語が得意：28人\n数学が得意：19人\nどちらも得意でない：5人","body":"全体の40人を表す四角の中に、英語が得意な人の円と、数学が得意な人の円を、一部が重なるようにかきます。円の重なった部分が「両方が得意な人」、二つの円の外側が「どちらも得意でない人」です。"},{"title":"少なくとも一方が得意な人数を求める","formula":"40 − 5 = 35","body":"全体から、どちらも得意でない5人を除くと、二つの円のどこかに入る人数になります。"},{"title":"英語と数学の人数を、そのまま足す","formula":"28 + 19 = 47","body":"この47人は、両方が得意な人を英語と数学で2回数えています。"},{"title":"数えすぎた分が、両方が得意な人数になる","formula":"47 − 35 = 12","body":"重なりの人を2回数えた47人と、少なくとも一方が得意な35人との差が、重なりの人数です。"},{"title":"四つの部分を足して、全体になるか確かめる","formula":"英語だけ：28 − 12 = 16\n数学だけ：19 − 12 = 7\n16 + 12 + 7 + 5 = 40","body":"英語だけ、両方、数学だけ、どちらでもない、の四つを足すと40人になります。"}]},{"label":"片方だけの人数と、どちらでもない人数を求める","question":"60人に通勤の方法をたずねました。電車を使う人は38人、バスを使う人は27人、両方を使う人は14人でした。電車だけを使う人と、どちらも使わない人は、それぞれ何人でしょうか。","answer":"電車だけを使う人は24人、どちらも使わない人は9人","steps":[{"title":"わかっている人数を置く","formula":"全体：60人\n電車を使う：38人\nバスを使う：27人\n両方を使う：14人","body":"「電車を使う38人」には、バスも使う14人が含まれています。「電車だけ」とは別の数です。"},{"title":"電車だけを使う人数を求める","formula":"38 − 14 = 24","body":"電車を使う人の円と、バスを使う人の円を重ねてかきます。電車の円から、重なりの部分を除きます。"},{"title":"バスだけを使う人数を求める","formula":"27 − 14 = 13","body":"バスの円からも、同じように重なりの部分を除きます。"},{"title":"少なくとも一方を使う人数を求める","formula":"24 + 14 + 13 = 51","body":"電車だけ、両方、バスだけの三つの部分を足します。"},{"title":"全体から引いて、どちらも使わない人数を求める","formula":"60 − 51 = 9","body":"二つの円の外側にいる人数です。"},{"title":"別の求め方で、少なくとも一方の人数を確かめる","formula":"38 + 27 − 14 = 51","body":"二つをそのまま足して、2回数えた重なりを1回引いても、同じ51人になります。"}]},{"label":"重なりの人数の範囲を求める","question":"50人のうち、朝食を食べた人は36人、運動をした人は22人でした。朝食を食べて運動もした人は、最も少なくて何人、最も多くて何人でしょうか。","answer":"最も少なくて8人、最も多くて22人","steps":[{"title":"わかっている人数と、求めるものを置く","formula":"全体：50人\n朝食を食べた：36人\n運動をした：22人\n求めるもの：両方に当てはまる人数の範囲","body":"「どちらもしていない人」の数が書かれていないので、両方に当てはまる人数は一つに決まりません。あり得る範囲を求めます。"},{"title":"最も多い場合を考える","formula":"36人と22人のうち、少ない方：22人","body":"運動をした22人が全員、朝食も食べていた場合が最も多くなります。重なりは、少ない方の22人を超えられません。"},{"title":"最も少ない場合のために、二つの人数を足す","formula":"36 + 22 = 58","body":"重なりをできるだけ少なくしたいので、まず重なりがないものとして足してみます。"},{"title":"全体を超えた分が、必ず重なる人数になる","formula":"58 − 50 = 8","body":"58人は全体の50人より8人多いので、どう分けても8人は両方に当てはまります。"},{"title":"最も少ない場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 8 = 28\n運動だけ：22 − 8 = 14\n28 + 8 + 14 = 50","body":"このとき、どちらもしていない人は0人です。"},{"title":"最も多い場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 22 = 14\n少なくとも一方：14 + 22 = 36\nどちらもしていない：50 − 36 = 14\n14 + 22 + 0 + 14 = 50","body":"このとき、運動だけの人は0人で、どちらもしていない人が14人います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-speed":{"id":"spi-speed","name":"速さと時間","type":"learn","goal":"速さ、時間、距離の関係を使って、出会いや追いつきの問題を解ける。","part_of":"spi","tags":["num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"速さは、決まった時間に進む距離のことです。時速は1時間、分速は1分間、秒速は1秒間に進む距離を表します。速さ・時間・距離のうち二つがわかれば、残りの一つを求められます。計算の前に、時間と距離の単位を速さの単位にそろえます。二人が向かい合って進むときは速さの和、同じ向きに進むときは速さの差の分だけ、二人の間の距離が変わります。","example":"距離 = 速さ × 時間\n速さ = 距離 ÷ 時間\n時間 = 距離 ÷ 速さ\n例　分速80mで15分歩いた距離：80 × 15 = 1,200","note":"三つの式は、同じ関係を求めたいものに合わせて書き直したものです。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-linear-eq","level":"helps"}],"assessment":{"question":"時速60kmで30分進んだ距離は？","options":["2km","30km","120km"],"answer":1,"explanation":"時間の単位をそろえる。30分 = 0.5時間。60 × 0.5 = 30km。"},"practice":{"title":"速さ・時間・距離の関係から求める","lead":"単位をそろえ、二人の間の距離が1分でどれだけ変わるかを見る。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"単位をそろえて距離を求める","question":"時速4.8kmで25分歩きました。歩いた距離は何kmでしょうか。","answer":"2km","steps":[{"title":"速さと時間、求めるものを置く","formula":"速さ：時速4.8km\n時間：25分\n求めるもの：距離（km）","body":"速さは「1時間あたり」なのに、時間は「分」で書かれています。このままではかけ算できないので、単位をそろえます。"},{"title":"25分を、時間の単位に直す","formula":"25 ÷ 60 = 25/60 = 5/12","body":"1時間は60分なので、25分は5/12時間です。"},{"title":"速さに時間をかけて、距離を求める","formula":"4.8 × 5/12 = 4.8 ÷ 12 × 5 = 0.4 × 5 = 2","body":"距離は、速さ×時間です。時速と時間（時）をかけるので、答えはkmになります。"},{"title":"分速に直す方法で確かめる","formula":"分速：4,800 ÷ 60 = 80\n80 × 25 = 2,000","body":"時速4.8kmは1時間に4,800mなので、分速80mです。25分で2,000m、つまり2kmになり、同じ答えです。"}]},{"label":"向かい合って進み、出会う","question":"2.7km離れた二つの地点から、兄は分速80m、弟は分速55mで、向かい合って同時に出発しました。二人が出会うのは、出発してから何分後でしょうか。","answer":"20分後","steps":[{"title":"二人の間の距離と、それぞれの速さを置く","formula":"二人の間の距離：2.7km = 2,700m\n兄：分速80m\n弟：分速55m","body":"速さが分速（m）なので、距離もmに直します。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"80 + 55 = 135","body":"向かい合って進むので、二人の間は、1分ごとに二人が進んだ分を合わせた長さだけ縮まります。"},{"title":"はじめの距離を、1分で縮まる距離で割る","formula":"2,700 ÷ 135 = 20","body":"2,700mが、1分に135mずつ縮まります。0mになったときが出会うときなので、20分後です。"},{"title":"20分で二人が進んだ距離を足して確かめる","formula":"兄：80 × 20 = 1,600\n弟：55 × 20 = 1,100\n1,600 + 1,100 = 2,700","body":"二人が進んだ距離の合計が、はじめの2,700mと同じになります。"}]},{"label":"後から出発して、追いつく","question":"弟が分速60mで家を出ました。その8分後に、兄が分速100mで同じ道を追いかけました。兄が弟に追いつくのは、兄が家を出てから何分後でしょうか。","answer":"12分後","steps":[{"title":"二人の速さと、出発のずれを置く","formula":"弟：分速60m、先に出発\n兄：分速100m、8分後に出発\n求めるもの：兄が出発してから追いつくまでの時間","body":"数えはじめるのは、兄が出発したときです。そのとき、弟はすでに先へ進んでいます。"},{"title":"兄が出発するとき、弟が何m先にいるかを求める","formula":"60 × 8 = 480","body":"弟は分速60mで8分進んでいるので、兄より480m先にいます。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"100 − 60 = 40","body":"同じ向きに進むので、二人の間は、速さの差の分だけ縮まります。向かい合うときと違い、足すのではなく引きます。"},{"title":"先にいる距離を、1分で縮まる距離で割る","formula":"480 ÷ 40 = 12","body":"480mの差が、1分に40mずつ縮まります。差が0mになるのは、兄が出発してから12分後です。"},{"title":"追いついたとき、二人の進んだ距離が同じか確かめる","formula":"兄：100 × 12 = 1,200\n弟：60 × (8 + 12) = 1,200","body":"兄は12分、弟は8分と12分を合わせた20分進んでいます。どちらも家から1,200mで、同じ場所にいます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-tables":{"id":"spi-tables","name":"表の読み取り","type":"learn","goal":"複数の表から必要な数値を拾い、割合や増減を計算できる。","part_of":"spi","tags":["data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus
