window.HOWTREE_DATA = {"config":{"name":"Howtree","tagline":"資格・試験の勉強の順番と時間がわかる木","amazon_tag":"","publish":{"base_url":"https://howtree.pages.dev","indexable":true,"operator":"eizi","contact":"https://forms.gle/hHZHdEaRx3KDuDco6","google_site_verification":"v7h6caudfjUvA7RgGTMMuPVJxstgAhJ7QoqHrZnnZcw"},"ads":{"adsense_client":"","adsense_slot":""},"systems":[{"id":"course","name":"科目","ordered":true,"tags":[{"id":"sansu","name":"算数"},{"id":"jhmath","name":"中学数学"},{"id":"math1","name":"数I"},{"id":"matha","name":"数A"},{"id":"math2","name":"数II"},{"id":"mathb","name":"数B"},{"id":"math3","name":"数III"},{"id":"mathc","name":"数C"},{"id":"kokugo","name":"国語"},{"id":"eigo","name":"英語"}]},{"id":"field","name":"分野","tags":[{"id":"num","name":"数と式"},{"id":"geo","name":"図形"},{"id":"func","name":"関数"},{"id":"data","name":"データ"},{"id":"logic","name":"論理"},{"id":"vocab","name":"語彙"},{"id":"reading","name":"読解"},{"id":"fp-life","name":"ライフプランニングと資金計画"},{"id":"fp-risk","name":"リスク管理"},{"id":"fp-invest","name":"金融資産運用"},{"id":"fp-tax","name":"タックスプランニング"},{"id":"fp-estate","name":"不動産"},{"id":"fp-inherit","name":"相続・事業承継"},{"id":"ip-strategy","name":"ストラテジ系"},{"id":"ip-management","name":"マネジメント系"},{"id":"ip-technology","name":"テクノロジ系"}]}],"groups":{"math-school":"中学までの数学","jp-school":"国語の基礎","en-school":"英語の基礎","spi":"SPI対策","hs-math":"高校1年の数学","hs-math-2":"高校数学（数II・数B）","hs-math-3":"高校数学（数III・数C）","koumuin":"公務員試験の数的処理","fp3":"FP3級","tamatebako":"玉手箱・GAB・CAB","tgweb":"TG-WEB","shukatsu":"就活（内定まで）","tenshoku":"転職（内定まで）","itpass":"ITパスポート"}},"nodes":{"cab-mental":{"id":"cab-mental","name":"暗算（CAB）","type":"learn","goal":"四則の式の答えを、計算の工夫と概算で、短い時間に選択肢から選べる。","part_of":"tamatebako","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例、範囲の断りを就職情報サイトの記述と照合し、練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"紙で受けるCABの科目の一つに、暗算があります。四則の式の答えを、選択肢から選びます（5択のほか、「この中にない」を含む6択の例もあります）。就職情報サイトでは50問を10分とされ、1問にかけられるのは12秒ほどです。筆算をていねいにする時間はないので、二つの道具を使います。一つは、計算の順序を入れかえて、きりのよい数を作る工夫です。足し算と引き算だけの式は、引く数に「−」を付けたまま、順序を入れかえても答えは変わりません。かけ算では、25 × 4 = 100 のように、かけると切りのよい数になる組を探します。もう一つは、選択肢をしぼる見方です。答えの一の位だけを先に計算する、数を四捨五入などで丸めて、およその大きさを出す、の二つで、選択肢が一つに決まることがあります。","example":"足し算と引き算の順序を入れかえる　a + b − c = a − c + b\n25をかける　a × 25 = a × 100 ÷ 4\n例　16 × 25 = 1,600 ÷ 4\n1,600 ÷ 4 = 400\n99をかける　a × 99 = a × 100 − a\n小数で割る　割る数と割られる数に同じ数をかけても、答えは変わらない\n例　3.6 ÷ 0.4 = 36 ÷ 4\n36 ÷ 4 = 9","note":"a は、問題に出てくる数を表します。一の位だけの計算や丸めた計算は、選択肢をしぼるためのもので、答えそのものではありません。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提（分数と小数）の到達条件に収まるか、必須の前提が実際に使われているか、下流（CABの到達点）の扱いを照合。学習時間は同じ形の四則逆算との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"0.6 × 50 の答えは？","options":["3","30","300"],"answer":1,"explanation":"0.6 × 50 = 6 × 50 ÷ 10 = 300 ÷ 10 = 30。3は小数点を一つ左に、300は一つ右にずらしすぎている。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢を実際に試して正答が一つに決まるかを確認。誤答ごとの理由、全段階の計算と工夫、試験の形（就職情報サイトの記述）との適合を確認し、指摘を反映した後に再検証。","title":"工夫と概算で、選択肢から選ぶ","lead":"紙のCABの暗算と同じく、選択肢から選ぶ。答えを最後まで計算する前に、一の位とおよその大きさで選択肢をしぼれないかを先に見る。","original":true,"problems":[{"label":"足し算と引き算がまじる式","question":"57 + 196 − 38 + 204 の答えは、次のうちどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"319","correct":false,"reason":"196 + 204 を、繰り上がりを落として300とした数です。一の位は正答と同じ9なので、一の位だけではしぼれません。およその大きさで外します。"},{"key":"B","text":"381","correct":false,"reason":"38を二回引いた数です。一の位が9にならないので、一の位を見た時点で外せます。"},{"key":"C","text":"419","correct":true,"reason":"57 − 38 = 19、196 + 204 = 400 で、19 + 400 = 419 です。"},{"key":"D","text":"421","correct":false,"reason":"57 − 38 を、一の位で 8 − 7 と逆に引いて21とした数です。一の位が9にならないので外せます。"},{"key":"E","text":"495","correct":false,"reason":"引く38を足してしまった数です。一の位が9にならないので外せます。"}],"steps":[{"title":"答えの一の位だけを、先に計算する","formula":"一の位：7 + 6 − 8 + 4 = 9","body":"どの数も一の位だけを取り出して、同じ順に計算します。答えの一の位は9です。選択肢のうち一の位が9なのは、A の319と C の419だけです。"},{"title":"一の位を四捨五入して、十の位までの数でおよその大きさを出す","formula":"60 + 200 − 40 + 200 = 420","body":"57を60、196を200、38を40、204を200と丸めます。答えはおよそ420なので、319ではなく419のほうです。ここで C に決まります。"},{"title":"順序を入れかえて、正確に計算する","formula":"57 + 196 − 38 + 204 = 57 − 38 + 196 + 204\n57 − 38 = 19\n196 + 204 = 400\n19 + 400 = 419","body":"時間があれば、正確な値でも確かめます。引く38を57のすぐ後に動かし、196と204を組にすると、足して切りのよい400になります。"}],"alternatives":[{"try":"60 + 200 − 40 + 200 = 420 なので、420に近い421を選ぶ","why_not":"丸めた計算は、およその大きさしか出しません。421は一の位が9でないので、一の位の計算と合いません。およその大きさと一の位の両方に合う選択肢を選びます。"}]},{"label":"25をかける","question":"4.8 × 25 の答えは、次のうちどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"12","correct":false,"reason":"小数点の位置を一つ左にずらしすぎた数です。4.8は5に近いので、答えは5 × 25 = 125 に近い大きさになるはずです。"},{"key":"B","text":"100","correct":false,"reason":"4 × 25 だけを計算し、0.8 × 25 = 20 を足し忘れた数です。"},{"key":"C","text":"120","correct":true,"reason":"4.8 × 100 = 480 を4で割って120です。"},{"key":"D","text":"125","correct":false,"reason":"4.8を5に丸めて計算した数です。丸めた計算は大きさの見当にしか使えません。4.8は5より小さいので、答えは125より小さくなります。"},{"key":"E","text":"1,200","correct":false,"reason":"小数点の位置を一つ右にずらしすぎた数です。48 × 25 の答えになっています。"}],"steps":[{"title":"25をかけることを、100をかけて4で割ることに直す","formula":"4.8 × 25 = 4.8 × 100 ÷ 4\n4.8 × 100 = 480\n480 ÷ 4 = 120","body":"25は100の4分の1です。100をかけるのは小数点を二つ右に動かすだけなので、残りは4で割る計算だけになります。"},{"title":"およその大きさで確かめる","formula":"5 × 25 = 125","body":"4.8を5と見ると、答えは125に近く、それより少し小さいはずです。120はこれに合います。"}]},{"label":"小数で割る","question":"7.2 ÷ 0.08 の答えは、次のうちどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"0.9","correct":false,"reason":"0.08の小数点を見落として、7.2 ÷ 8 とした数です。0.9 × 0.08 = 0.072 で、7.2になりません。"},{"key":"B","text":"9","correct":false,"reason":"割る数には100、割られる数には10をかけて、72 ÷ 8 とした数です。かける数がそろっていません。9 × 0.08 = 0.72 で、7.2になりません。"},{"key":"C","text":"90","correct":true,"reason":"両方に100をかけて 720 ÷ 8 = 90 です。90 × 0.08 = 7.2 になります。"},{"key":"D","text":"900","correct":false,"reason":"割られる数には1,000、割る数には100をかけて、7,200 ÷ 8 とした数です。かける数がそろっていません。900 × 0.08 = 72 で、7.2になりません。"},{"key":"E","text":"0.576","correct":false,"reason":"割らずにかけた数です。7.2 × 0.08 = 0.576 です。"}],"steps":[{"title":"割る数が整数になるように、両方に同じ数をかける","formula":"7.2 ÷ 0.08 = 720 ÷ 8","body":"割る数の0.08を整数にするには100をかけます。割られる数の7.2にも同じ100をかけると720です。両方に同じ数をかけても、答えは変わりません。"},{"title":"整数どうしで割る","formula":"720 ÷ 8 = 90","body":"72 ÷ 8 = 9 なので、720 ÷ 8 はその10倍です。"},{"title":"かけて戻して確かめる","formula":"90 × 0.08 = 7.2","body":"答えに割る数をかけると、割られる数に戻ります。"}]},{"label":"99をかける","question":"46 × 99 の答えは、次のうちどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"4,454","correct":false,"reason":"4,600 − 46 の引き算で、百の位まで余分に1を引いた数です。4,454 + 46 = 4,500 で、4,600に戻りません。"},{"key":"B","text":"4,554","correct":true,"reason":"46 × 100 = 4,600 から、46を一つ分引いて4,554です。"},{"key":"C","text":"4,501","correct":false,"reason":"4,600から、46ではなく99を引いた数です。99を100と見て一つ多くかけたのは46なので、引くのは46です。"},{"key":"D","text":"4,600","correct":false,"reason":"46 × 100 のままで、多くかけた46を引いていない数です。"},{"key":"E","text":"4,646","correct":false,"reason":"多くかけた46を、引かずに足した数です。46 × 101 の答えになっています。"}],"steps":[{"title":"99を、100より1小さい数と見る","formula":"46 × 99 = 46 × 100 − 46","body":"99は100より1小さいので、46を100個集めてから、46を1個分引けば、99個分になります。"},{"title":"切りのよい計算を二つする","formula":"46 × 100 = 4,600\n4,600 − 46 = 4,554","body":"100をかけるのは0を二つ付けるだけです。そこから46を引きます。"},{"title":"一の位で確かめる","formula":"一の位：6 × 9 = 54","body":"46 × 99 の一の位は、6 × 9 の一の位と同じ4です。選択肢のうち一の位が4なのは A と B で、およその大きさは 46 × 100 − 50 ≒ 4,550 なので、4,454 の A は外れ、B に決まります。"}]}]},"sources":[{"title":"就活の教科書：CAB/Web-CABの練習問題と対策（科目、問題数と制限時間、暗算の選択肢の形）","url":"https://reashu.com/cab/","checked_at":"2026-10-16"}]},"cab":{"id":"cab","name":"CAB","type":"target","goal":"受検するCABの方式に合う計算の形式を学び、図形の科目は問題集で時間を計った演習を始める。","part_of":"tamatebako","status":"draft","featured":true,"scope_note":"CABの四つの科目のうち、計算の科目（紙のCABの暗算と、Web-CABの四則逆算）への学習経路です。法則性、命令表、暗号の三つは未収録です。どれも図形の並びや図形の変化を見て答える科目で、問題も選択肢も図形の絵になっており、この木の問題では図形の絵を描けないためです。命令表は、命令の全種類を文章の資料で確かめられなかったことも理由です。三つの科目は、問題集で図形の問題を解いて対策してください。性格検査も未収録です。問題数と制限時間は、公式の資料ではなく、就職情報サイトの記述によります。同じサイトの中やサイトどうしで、問題数や合計の時間が食い違う記述があります。Web-CABの計算の科目を、□を求める四則逆算とするサイトと、式の答えを選ぶ形の例題を載せるサイトがあります。Web-CABを受ける人も、暗算の単元の工夫と概算は役に立ちます。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例、範囲の断りを就職情報サイトの記述と照合し、練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"CABは、日本エス・エイチ・エルの適性検査で、SEやプログラマーなど、コンピュータに関わる職種の採用選考で使われるとされます。能力検査は、暗算、法則性、命令表、暗号の四つの科目からなり、性格検査もあります。会場で紙で受けるCABと、自宅のパソコンで受けるWeb-CABがあり、科目の構成はほぼ同じで、問題数と制限時間が違うとされます。計算の科目は、紙のCABでは式の答えを選ぶ暗算で、Web-CABでは同じ会社の玉手箱と同じ四則逆算（□に入る数を求める形）とされます。Web-CABは電卓を使えるとされます。法則性は図形の並びの規則、命令表は命令の記号に従った図形の変化、暗号は図形の変化から記号の働きを読み取る科目です。どの科目も1問にかけられる時間が短いので、解き方を知ったうえで、時間を計って慣れることが大切です。","example":"紙のCAB：暗算、法則性、命令表、暗号\nWeb-CAB：四則逆算、法則性、命令表、暗号\n例　計算の科目は、就職情報サイトでは、紙が50問を10分、Webが50問を9分とされる","note":"受検の案内で、紙かWebかを確かめてから、計算の科目のどちらの単元から始めるかを決めます。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"cab-mental","level":"must","group":"計算の科目","note":"紙のCAB。式の答えを選択肢から選ぶ。工夫と概算で速く解く"},{"id":"tama-reverse","level":"must","group":"計算の科目","note":"Web-CAB。玉手箱と同じ形の四則逆算とされる。□に入る数を求める"}],"sources":[{"title":"就活の教科書：CAB/Web-CABの練習問題と対策（科目、紙とWebの問題数と制限時間、選択肢の形）","url":"https://reashu.com/cab/","checked_at":"2026-10-16"},{"title":"ワンキャリア：CABの対策（科目、紙とWebの問題数と制限時間、命令表の形）","url":"https://onecareer.jp/articles/819","checked_at":"2026-10-16"},{"title":"paiza：Web-CABの練習問題（四則逆算の□の形、電卓を使えること、命令表の命令の例）","url":"https://paiza.jp/works/knowledge/article-at-webcab-practice-kn","checked_at":"2026-10-16"}]},"eng-reading":{"id":"eng-reading","name":"英文読解の基礎","type":"learn","goal":"英文の段落を読み、代名詞の指す内容と、つなぎの語が示す文どうしの関係をつかみ、書き手の主張を述べた文を見分けられる。","part_of":"en-school","tags":["eigo","reading"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を就職情報サイトの記述と照合し、具体例が練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"英文の段落を読むときは、日本語の説明文と同じく、文と文のつながりを示す二つの手がかりに注目します。一つは it、they、this、them のような代名詞で、ふつうは前に出てきた名詞や内容を指します。指すものの候補を実際に当てはめ、意味が通るかと、単数か複数かで確かめます。もう一つはつなぎの語で、however は前と逆の内容、therefore や as a result は前から導かれる結果や結論、because は理由、for example は例、in other words は言いかえ、in addition は付け加えを示します。また、should、need to、it is important to のような言葉のある文や、I believe のように書き手が自分の考えを述べる文は、事実や例を述べる文と区別して読みます。この単元は、高校までに学ぶ単語と文法で読める英文を前提にしていて、単語や文法そのものは扱いません。","example":"Ken lent me two books. I returned them yesterday.\n them が指すもの：two books（複数で、返せるもの）\n\nThe train was late. However, we arrived on time.\n However が示す関係：前の文から予想されることと、逆の内容が後に続く\n（電車は遅れた。しかし、私たちは時間どおりに着いた。）","note":"代名詞を指すものに置きかえて読み、意味が通れば読み取りは合っています。主張の文は、段落の最初か最後に置かれることが多いです。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件（と、範囲の断りに書いた高校までの単語と文法）に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。学習時間は国語の同じ形式の単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"jp-reading","level":"related"}],"assessment":{"question":"英文「My sister bought a new bike. She rides it to school every day.」の it が指すのは？","options":["My sister","a new bike","school"],"answer":1,"explanation":"it に当てはめて意味が通るのは「She rides a new bike to school（新しい自転車に乗って学校へ行く）」。My sister（姉か妹）は人で、乗るものではなく、文の主語 She が指している。school（学校）は to school と、行き先としてすでに文に出ていて、それに乗ることもできない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。本文と問題文だけから独立に解いて正答を照合し、TRUE／UNTRUE／CANNOT SAY の境目や5択のほかの選択肢を実際に試して正答が一つに決まるかを確認。英文の文法、和訳、選択肢ごとの理由、全段階の説明、試験の形（就職情報サイトの記述）との適合を確認し、指摘を反映した後に再検証。","title":"代名詞、つなぎの語、主張の文を読み取る","lead":"代名詞は候補を当てはめて確かめ、つなぎの語は前後の文の関係を言葉にしてみる。","original":true,"passage":"Many towns are trying to reduce the amount of food that is thrown away. One common approach is to ask restaurants to serve smaller portions. This helps, but it does not solve the problem, because a large share of food waste comes from homes, not restaurants. In one town, the local government gave families a simple notebook to record the food they threw away each week. After three months, the families who kept the notebook threw away about 20 percent less food than before. Writing things down made them notice how often they bought more than they needed. Therefore, towns that want real results should pay attention to what happens in people's kitchens, not only in restaurants.","problems":[{"label":"代名詞 This の指す内容をつかむ","question":"本文の3つ目の文の This が指すものは、どれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"飲食店に、料理の量を減らして出してもらうよう頼むこと","correct":true,"reason":"直前の文の「One common approach is to ask restaurants to serve smaller portions（よくあるやり方の一つは、飲食店に量を減らして出してもらうよう頼むことだ）」を指します。当てはめると「そのやり方は役に立つが、問題を解決はしない」となり、意味が通ります。"},{"key":"B","text":"家庭から出る食品ごみ","correct":false,"reason":"家庭の食品ごみは、This より後の because 以下で初めて出てきます。また、「家庭の食品ごみは役に立つ」では意味が通りません。"},{"key":"C","text":"家族に配られた記録帳","correct":false,"reason":"記録帳（notebook）は、This より後の4つ目の文で初めて出てきます。代名詞は、ふつう前に出てきたものを指します。"}],"steps":[{"title":"This を含む文を訳し、何が入れば意味が通るかを考える","formula":"This helps, but it does not solve the problem\nThis は役に立つが、問題を解決はしない","body":"This は「役に立つが、解決はしない」ものです。食品ごみを減らすための、何かの取り組みが入りそうだと見当をつけます。"},{"title":"直前の文から、指すものの候補を探す","formula":"One common approach is to ask restaurants to serve smaller portions.\nよくあるやり方の一つは、飲食店に量を減らして出してもらうよう頼むことだ","body":"直前の文に、取り組み（approach）が一つ書かれています。"},{"title":"候補を This に当てはめて確かめる","formula":"飲食店に量を減らして出してもらうよう頼むことは役に立つが、問題を解決はしない\n→ 意味が通る\n判定：A","body":"続く because 以下の「食品ごみの多くは飲食店ではなく家庭から出る」とも、解決しない理由としてつながります。A です。"}]},{"label":"Therefore が示す関係をつかむ","question":"本文の最後の文は Therefore で始まります。最後の文は、その前の内容に対してどんな関係にありますか。","answer":"C","kind":"choice","options":[{"key":"A","text":"前の内容と逆のことを述べている","correct":false,"reason":"逆の内容を示すのは however などです。最後の文の「家庭で起きていることに目を向けるべきだ」は、前の内容と反対ではありません。"},{"key":"B","text":"前の内容の具体例を挙げている","correct":false,"reason":"例を示すのは for example などです。最後の文は、ある町の例を受けて考えを述べていて、それ自体は例ではありません。"},{"key":"C","text":"前の内容から導いた結論を述べている","correct":true,"reason":"Therefore は「だから、したがって」の意味で、前の内容から導かれる結論を示します。家庭の記録で食品ごみが減った例から、家庭に目を向けるべきだと結んでいます。"}],"steps":[{"title":"つなぎの語の意味を確かめる","formula":"Therefore：だから、したがって（前から導かれる結果や結論）","body":"つなぎの語が示す関係を、まず言葉にしておきます。"},{"title":"前の内容と最後の文を訳して並べる","formula":"前：家庭の記録帳で、捨てる食品が約2割減った\n最後：本当の成果を求める町は、飲食店だけでなく、人々の台所で起きていることに目を向けるべきだ","body":"前の内容は、家庭での取り組みが効いたという例です。"},{"title":"二つの関係を判定する","formula":"家庭での取り組みが効いた → だから、家庭に目を向けるべきだ\n判定：C","body":"前の内容を根拠に、筆者の結論を述べています。C です。"}]},{"label":"書き手の主張を述べた文を見分ける","question":"本文の中で、書き手の主張を述べている文はどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"One common approach is to ask restaurants to serve smaller portions.","correct":false,"reason":"多くの町がとっているやり方を紹介した、事実の文です。書き手がそうすべきだと言っているわけではありません。"},{"key":"B","text":"Therefore, towns that want real results should pay attention to what happens in people's kitchens, not only in restaurants.","correct":true,"reason":"should（〜すべきだ）があり、前の内容から導いた書き手の考えを述べています。段落の最後に置かれた結論です。"},{"key":"C","text":"After three months, the families who kept the notebook threw away about 20 percent less food than before.","correct":false,"reason":"ある町で起きた結果を述べた、事実の文です。主張を支える例として置かれています。"}],"steps":[{"title":"主張を示す言葉を探す","formula":"A：is（事実の紹介）\nB：should（〜すべきだ）\nC：threw away（起きたことの報告）","body":"should、need to、I believe のような言葉は、書き手の考えを示す目印です。"},{"title":"段落の中での役割を確かめる","formula":"A：よくあるやり方の紹介\nC：ある町の例の結果\nB：Therefore で始まり、例から導いた結論","body":"A と C は、B の結論を導くために置かれています。"},{"title":"判定する","formula":"考えを示す言葉がある：B\n例から導いた結論：B\n判定：B","body":"B です。"}]},{"label":"代名詞 them の指す内容をつかむ","question":"本文の6つ目の文「Writing things down made them notice how often they bought more than they needed.」の them が指すものは、どれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"飲食店","correct":false,"reason":"飲食店は、記録帳をつけていません。「書きとめることで、飲食店は自分たちが必要以上に買っていることに気づいた」では、前の文とつながりません。"},{"key":"B","text":"記録帳をつけた家族","correct":true,"reason":"直前の文の the families who kept the notebook（記録帳をつけた家族）を指します。書きとめたのはこの家族で、意味が通ります。"},{"key":"C","text":"捨てられた食品","correct":false,"reason":"「食品が、必要以上に買っていたことに気づいた」では意味が通りません。気づくのは人です。また、food は数えない名詞として it で受けるのがふつうです。"}],"steps":[{"title":"them を含む文を訳す","formula":"Writing things down made them notice how often they bought more than they needed.\n書きとめることで、them は、自分たちがどれほどよく必要以上に買っていたかに気づいた","body":"them は複数で、「気づく」ことができ、「書きとめる」ことをした人たちです。"},{"title":"直前の文から、当てはまる候補を探す","formula":"the families who kept the notebook\n記録帳をつけた家族","body":"書きとめた（記録帳をつけた）のは、この家族です。"},{"title":"当てはめて確かめる","formula":"書きとめることで、記録帳をつけた家族は、必要以上に買っていたことに気づいた\n→ 意味が通る\n判定：B","body":"B です。"}]}]}},"fp3-deduction":{"id":"fp3-deduction","name":"所得控除と損益通算","type":"learn","goal":"主な所得控除の目的を説明でき、損失をほかの所得から差し引ける所得と、差し引けない所得を区別できる。","part_of":"fp3","tags":["fp-tax"],"status":"verified","concept":{"reviewed_at":"2026-10-15","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省、日本年金機構、金融庁、国税庁、e-Gov法令検索などの公的な資料と照合。確認問題は独立に解き、正答が一つに決まるかを別の読みで試した。指摘を反映した後に再検証。","text":"所得税は、所得からそのまま計算するのではなく、所得控除を引いた残り（課税所得金額）に税率をかけます。所得控除は、その人の事情に合わせて税を軽くするしくみで、16種類あります。多くの人が受けられる基礎控除（所得が一定の額を超えると受けられない）、家族を養っている人の配偶者控除や扶養控除、払った社会保険料の全額を引ける社会保険料控除、一定の額を超えて医療費を払ったときの医療費控除、生命保険料控除などです。また、ある所得で損失（赤字）が出たとき、その損失をほかの所得から差し引くことを損益通算といいます。損益通算できるのは、不動産所得、事業所得、山林所得、譲渡所得の損失だけです。ただし、この4つにも、損益通算できない損失があります。","example":"損益通算できる損失を生む所得：不動産所得、事業所得、山林所得、譲渡所得\n例　事業所得が200万円の損失、給与所得が500万円のとき、損益通算した後の所得：500 − 200 = 300","note":"例の答えの単位は万円です。各控除の金額は改正で変わるので、ここでは扱いません。所得控除は、2025年分から特定親族特別控除が加わって16種類になりました。損益通算できない損失の例には、不動産所得のうち土地を買うための借入金の利子にあたる部分や、ゴルフ会員権など生活に通常必要でない資産を売った損失があります。土地・建物や株式を売った損失も、一部の特例を除いて、ほかの所得と損益通算できません。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明と確認問題で使う知識を洗い出し、この単元の説明か前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の学科試験の到達点が範囲を超えて使っていないかを照合。学習時間は、FP3級の単元どうしの釣り合いとの比較だけで、実測ではない。練習ページは2026-10-16に作り、別の実行で検証した。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"fp3-tax","level":"must"}],"assessment":{"question":"次の所得のうち、損失が出たときに、ほかの所得と損益通算できるものはどれでしょうか。","options":["事業所得","一時所得","雑所得"],"answer":0,"explanation":"事業所得の損失は損益通算できます。一時所得と雑所得の損失は、ほかの所得から差し引くことができません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の読み・別の選択肢で試して確認。制度は国税庁・日本年金機構・金融庁などの公的な資料で、2026年の現行制度として確認。試験の形（日本FP協会の公表問題）との適合も確認し、軽微の指摘を反映。","title":"損益通算できる損失を選び、所得控除を計算する","lead":"損失は、まず通算できるかどうかを分けてから引く。本試験は○×式と三答択一式です。ここでは解き方を身につけるために、金額を直接答える問題もあります。","original":true,"problems":[{"label":"社会保険料控除の額を判断する（○×）","question":"次の文が正しければ○、誤っていれば×を選んでください。「社会保険料控除では、その年に払った社会保険料のうち、一定の上限額までしか所得から差し引くことができない。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"社会保険料控除には上限がない。上限があるのは、生命保険料控除などほかの控除。"},{"key":"×","text":"誤っている","correct":true,"reason":"社会保険料控除は、その年に払った社会保険料の全額を差し引ける。"}],"steps":[{"title":"控除の額の決まり方を思い出す","formula":"社会保険料控除：払った社会保険料の全額\n医療費控除：一定の額を超えて払った部分","body":"所得控除には、払った全額を引けるものと、一部だけを引けるものがあります。社会保険料控除は全額を引けるほうです。"},{"title":"文と照らし合わせる","formula":"文：上限額までしか引けない\n決まり：全額を引ける","body":"文は決まりと合わないので、×です。"}]},{"label":"損益通算した後の所得を求める","question":"会社員のDさんの、ある年の所得は次のとおりです。給与所得600万円、不動産所得150万円の損失（このうち40万円は、アパートの土地を買うための借入金の利子にあたる部分）、雑所得20万円の損失（雑所得はこの1つだけ）。損益通算した後の所得の合計はいくらでしょうか。","answer":"490万円","alternatives":[{"try":"430万円（損失をすべて給与所得から引く：600 − 150 − 20）","why_not":"雑所得の損失は、ほかの所得と損益通算できません。また、不動産所得の損失のうち、土地を買うための借入金の利子にあたる部分も、損益通算できません。"},{"try":"470万円（600 − 110 − 20。雑所得の損失も引いた）","why_not":"不動産所得の損失から、土地を買うための借入金の利子の40万円を除いたところまでは合っています。ただ、雑所得の損失は、ほかの所得と損益通算できないので、給与所得から引けません。"},{"try":"450万円（不動産所得の損失150万円を全部引き、雑所得の損失だけを除く）","why_not":"不動産所得の損失のうち、土地を買うための借入金の利子にあたる40万円は、なかったものとされます。引けるのは残りの110万円だけです。"}],"steps":[{"title":"損失を出している所得が、損益通算できる種類かを分ける","formula":"不動産所得の損失：損益通算できる4つの所得の1つ\n雑所得の損失：損益通算できない","body":"損益通算できるのは、不動産所得、事業所得、山林所得、譲渡所得の損失だけです。雑所得の損失は、ここで除きます。"},{"title":"不動産所得の損失から、損益通算できない部分を除く","formula":"1500000 − 400000 = 1100000","body":"土地を買うための借入金の利子にあたる40万円は、損益通算できません。給与所得から引けるのは110万円です。"},{"title":"給与所得から、損益通算できる損失を引く","formula":"6000000 − 1100000 = 4900000","body":"損益通算した後の所得の合計は、490万円です。"}]},{"label":"不動産所得の損失のうち、損益通算できる部分を選ぶ","question":"次のア〜ウのうち、給与所得と損益通算できる損失を1つ選んでください。","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"趣味で持っていたゴルフ会員権を売って生じた、譲渡所得の損失","correct":false,"reason":"ゴルフ会員権は、生活に通常必要でない資産。これを売った損失は、ほかの所得と損益通算できない。"},{"key":"イ","text":"アパートの不動産所得の損失のうち、敷地の土地を買うための借入金の利子にあたる部分","correct":false,"reason":"不動産所得の損失のうち、土地を買うための借入金の利子にあたる部分は、損益通算できない。"},{"key":"ウ","text":"アパートの不動産所得の損失のうち、建物を建てるための借入金の利子にあたる部分","correct":true,"reason":"損益通算から除かれるのは、土地を買うための借入金の利子にあたる部分だけ。建物のための借入金の利子にあたる部分の損失は、損益通算できる。"}],"steps":[{"title":"損失が出た所得の種類を確かめる","formula":"ア：譲渡所得の損失\nイ：不動産所得の損失\nウ：不動産所得の損失","body":"三つとも、損益通算できる4つの所得のどれかです。種類だけでは決まらないので、例外に当たるかを見ます。"},{"title":"損益通算できない例外に当たるかを見る","formula":"ア：生活に通常必要でない資産の損失 → できない\nイ：土地を買うための借入金の利子の部分 → できない\nウ：建物のための借入金の利子の部分 → 例外に当たらない","body":"例外に当たらないのはウだけなので、正しいのはウです。"}]},{"label":"医療費控除の額を求める","question":"総所得金額等（所得の合計にあたる額）が500万円のEさんは、ある年に医療費を32万円払い、そのうち6万円が保険金で補てんされました。総所得金額等が200万円以上の人の医療費控除の額は、（払った医療費 − 保険金などで補てんされた額）− 10万円 で求めます（上限200万円）。Eさんの医療費控除の額はいくらでしょうか。","answer":"16万円","alternatives":[{"try":"22万円（保険金で補てんされた6万円を引かない）","why_not":"保険金で戻ってきた分は、自分で負担した医療費ではありません。先に、払った医療費から引きます。"},{"try":"26万円（10万円を引かない）","why_not":"医療費控除は、一定の額を超えて払った部分だけを引くしくみです。総所得金額等が200万円以上なので、10万円を超えた部分が控除の額になります。"}],"steps":[{"title":"自分で負担した医療費を求める","formula":"320000 − 60000 = 260000","body":"払った医療費から、保険金で補てんされた額を引きます。"},{"title":"10万円を引く","formula":"260000 − 100000 = 160000","body":"総所得金額等が200万円以上なので、10万円を引きます。16万円は上限の200万円以下なので、医療費控除の額は16万円です。"}]}]},"sources":[{"title":"国税庁 タックスアンサー No.2250 損益通算","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2250.htm","checked_at":"2026-10-16"},{"title":"国税庁 タックスアンサー No.1120 医療費を支払ったとき（医療費控除）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1120.htm","checked_at":"2026-10-16"}]},"fp3-funds":{"id":"fp3-funds","name":"投資信託とNISA","type":"learn","goal":"投資信託の仕組みとかかる費用、NISAで利益に税金がかからない仕組みを説明できる。","part_of":"fp3","tags":["fp-invest"],"status":"verified","concept":{"reviewed_at":"2026-10-15","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省、日本年金機構、金融庁、国税庁、e-Gov法令検索などの公的な資料と照合。確認問題は独立に解き、正答が一つに決まるかを別の読みで試した。指摘を反映した後に再検証。","text":"投資信託は、多くの投資家から集めたお金を一つにまとめ、運用の専門家が株式や債券などに投資する商品です。運用の成果に応じて、投資信託の値段（基準価額）が上がったり下がったりし、元本は保証されません。日経平均株価などの指数と同じ動きを目指すものをインデックス型、指数を上回る成果を目指すものをアクティブ型といいます。費用には、買うときの購入時手数料、持っている間ずっとかかる信託報酬（運用管理費用）、売るときにかかることがある信託財産留保額があります。NISA（少額投資非課税制度）は、決められた枠の中で買った株式や投資信託の利益（値上がり益や配当）に、税金がかからない制度です。2024年からの制度では、つみたて投資枠と成長投資枠があり、非課税で持てる期間に期限はありません。","example":"NISA（2024年から）\nつみたて投資枠：年120万円まで\n成長投資枠：年240万円まで\n合わせて持てる上限：買った金額で1,800万円まで（うち成長投資枠は1,200万円まで）","note":"つみたて投資枠で買えるのは、一定の条件を満たす投資信託などだけです。株式の配当が非課税になるのは、配当を証券口座で受け取る方式（株式数比例配分方式）を選んだ場合です。NISAの枠の金額は、2024年からの制度のものです。制度は改正されることがあるので、利用の前に最新の内容を確かめてください。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明と確認問題で使う知識を洗い出し、この単元の説明か前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の学科試験の到達点が範囲を超えて使っていないかを照合。学習時間は、FP3級の単元どうしの釣り合いとの比較だけで、実測ではない。練習ページは2026-10-16に作り、別の実行で検証した。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"fp3-investment","level":"helps"}],"assessment":{"question":"投資信託の費用のうち、持っている間ずっとかかるものはどれでしょうか。","options":["信託報酬","購入時手数料","信託財産留保額"],"answer":0,"explanation":"持っている間、運用の費用として毎日差し引かれるのは信託報酬です。購入時手数料はかかる場合は買うときに一度だけ、信託財産留保額は売るときにかかることがある費用です。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の読み・別の選択肢で試して確認。制度は国税庁・日本年金機構・金融庁などの公的な資料で、2026年の現行制度として確認。試験の形（日本FP協会の公表問題）との適合も確認し、軽微の指摘を反映。","title":"投資信託の費用とNISAの枠を計算し、仕組みの正誤を判断する","lead":"いつ、何に対してかかる費用か、どの枠の上限かを先に決める。本試験の学科は○×式と三答択一式です。ここでも同じ形で問い、計算の問題だけは解き方を身につけるために金額や年数を直接答えます。NISAの枠は2024年からの制度のものです。","original":true,"problems":[{"label":"1年分の信託報酬を求める","question":"信託報酬が年0.5%の投資信託を、1年間、平均して200万円分持っていました。この1年に差し引かれた信託報酬は、およそいくらでしょうか。税金は考えません。","answer":"約1万円","alternatives":[{"try":"0円（売っていないので、費用はかからない）","why_not":"信託報酬は、売るときではなく、持っている間ずっとかかる費用です。"},{"try":"10万円（0.5%を0.05として計算する）","why_not":"0.5%は、百分の0.5で0.005です。0.05は5%です。"}],"steps":[{"title":"年率を小数にする","formula":"0.5 ÷ 100 = 0.005","body":"信託報酬は、持っている額に対する1年あたりの割合で決まります。"},{"title":"持っている額にかける","formula":"200 × 0.005 = 1","body":"単位は万円で、1年でおよそ1万円です。実際には毎日少しずつ差し引かれ、その分だけ基準価額が下がります。"}]},{"label":"NISAの上限に達する年を求める","question":"Dさんは、2024年からのNISAで、つみたて投資枠と成長投資枠の両方を、1年目から毎年それぞれの年間の上限まで使って買い、一度も売らずに持ち続けます。買った金額で数えて、非課税で持てる上限に達するのは何年目でしょうか。","answer":"5年目","alternatives":[{"try":"15年目（1,800万円をつみたて投資枠の年120万円で割る）","why_not":"Dさんは成長投資枠も使っています。1年に買える額は、二つの枠を合わせた額です。"},{"try":"7.5年目（1,800万円を成長投資枠の年240万円で割る）","why_not":"これも片方の枠だけで割っています。また、成長投資枠だけで使えるのは1,200万円までなので、成長投資枠だけで1,800万円に達することはありません。"}],"steps":[{"title":"1年に買える額を求める","formula":"120 + 240 = 360","body":"つみたて投資枠の年120万円と、成長投資枠の年240万円を合わせて、1年に360万円買えます。単位は万円です。"},{"title":"生涯の上限を、1年に買える額で割る","formula":"1800 ÷ 360 = 5","body":"合わせて持てる上限の1,800万円には、5年目で達します。"},{"title":"成長投資枠の上限を超えていないか確かめる","formula":"240 × 5 = 1200","body":"5年で成長投資枠に買う額は1,200万円で、成長投資枠の上限1,200万円をちょうど使い切ります。超えていないので、5年目まで毎年上限まで買えます。"}]},{"label":"○×：NISAで非課税で持てる期間","question":"次の文が正しければ○、誤っていれば×を選んでください。「2024年からのNISAで買った投資信託は、買ってから20年たつと、その後の利益に税金がかかるようになる。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"20年の期限があったのは、2023年までの制度（つみたてNISA）です。2024年からの制度には期限がありません。"},{"key":"×","text":"誤り","correct":true,"reason":"2024年からの制度では、非課税で持てる期間に期限はありません。何年持っていても、利益は非課税のままです。"}],"steps":[{"title":"どの制度の話かを確かめる","formula":"問題の文：2024年からのNISA","body":"期限の有無は、2023年までの制度と2024年からの制度で違います。"},{"title":"2024年からの制度の期間と比べる","formula":"2024年からの制度：非課税で持てる期間に期限なし","body":"20年で非課税が終わるという文は、2024年からの制度に合いません。答えは×です。"}]},{"label":"○×：インデックス型が目指すもの","question":"次の文が正しければ○、誤っていれば×を選んでください。「インデックス型の投資信託は、日経平均株価などの指数を上回る運用成果を目指して運用される。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"指数を上回る成果を目指すのは、アクティブ型です。"},{"key":"×","text":"誤り","correct":true,"reason":"インデックス型は、指数を上回るのではなく、指数と同じ動きを目指します。"}],"steps":[{"title":"二つの型の目指すものを並べる","formula":"インデックス型：指数と同じ動き\nアクティブ型：指数を上回る成果","body":"指数との関係で、二つの型を分けます。"},{"title":"文と比べる","formula":"文の内容：指数を上回る成果 → アクティブ型の説明","body":"文はアクティブ型の説明を、インデックス型のものとしています。答えは×です。"}]},{"label":"投資信託とNISAの仕組みを判断する","question":"投資信託とNISAについて、最も適切なものはどれでしょうか。次のア〜ウから1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"投資信託の基準価額は、運用の成果に応じて上がったり下がったりし、元本は保証されない。","correct":true,"reason":"投資信託は、集めたお金を株式や債券などで運用する商品で、値段（基準価額）は運用の成果で変わります。元本は保証されません。"},{"key":"イ","text":"信託報酬は、投資信託を買うときに一度だけ支払う費用である。","correct":false,"reason":"買うときに一度かかるのは購入時手数料です。信託報酬は、持っている間ずっとかかります。"},{"key":"ウ","text":"NISAの口座で買った投資信託は、元本が保証される。","correct":false,"reason":"NISAは、利益に税金がかからない制度です。値下がりして元本を割ることは、NISAの口座でも起こります。"}],"steps":[{"title":"NISAが変えるものを確かめる","formula":"NISAが変えるもの：利益にかかる税金\nNISAが変えないもの：値上がりや値下がり","body":"NISAは税金の仕組みなので、商品の値動きや元本の保証の有無は変わりません。ウは誤りです。"},{"title":"費用のかかる時期を確かめる","formula":"買うとき：購入時手数料\n持っている間：信託報酬\n売るとき：信託財産留保額（かかることがある）","body":"信託報酬は持っている間の費用なので、イは誤りです。残るアが、投資信託の仕組みのとおりで正しい答えです。"}]}]},"sources":[{"title":"金融庁 NISAを知る（NISA特設ウェブサイト）","url":"https://www.fsa.go.jp/policy/nisa2/know/index.html","checked_at":"2026-10-16"}]},"fp3-gakka":{"id":"fp3-gakka","name":"FP3級の学科試験","type":"target","goal":"3級FP技能検定の学科試験の範囲の、代表的な考え方と計算を学び、過去問で演習を始める。","part_of":"fp3","status":"draft","scope_note":"学科試験は、日本FP協会ときんざいで共通です。前提の単元は、6分野のうち代表的な内容で、試験範囲のすべてではありません。学科試験の15時間には、単元で扱っていない論点（住宅ローン、損害保険の種類、遺言と遺留分、相続財産の評価、事業承継など）を過去問で補う時間を含みます。","concept":{"text":"FP3級の学科試験は、ライフプランニングと資金計画、リスク管理、金融資産運用、タックスプランニング、不動産、相続・事業承継の6分野から出題されます。問題は、文の正誤を答える○×式と、三つの選択肢から一つを選ぶ三答択一式です。","example":"90分・60問（○×式と三答択一式）\n60点満点のうち36点以上で合格","note":"数字は、日本FP協会ときんざいの試験要綱で2026-10-14に確認しました。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"fp3-lifeplan","level":"must"},{"id":"fp3-social","level":"must"},{"id":"fp3-risk","level":"must"},{"id":"fp3-investment","level":"must"},{"id":"fp3-funds","level":"must"},{"id":"fp3-deduction","level":"must"},{"id":"fp3-retax","level":"must"},{"id":"fp3-inheritance","level":"must"},{"id":"fp3-gift","level":"must"}],"sources":[{"title":"日本FP協会：3級の試験範囲","url":"https://www.jafp.or.jp/exam/subjects_03/","checked_at":"2026-10-14"},{"title":"金融財政事情研究会：ファイナンシャル・プランニング技能検定3級 試験要綱","url":"https://www.kinzai.or.jp/ginou/fp/3kyu/index.html","checked_at":"2026-10-14"}]},"fp3-gift":{"id":"fp3-gift","name":"贈与税","type":"learn","goal":"暦年課税と相続時精算課税の違いを説明でき、暦年課税の基礎控除を使って、税率をかける金額を求められる。","part_of":"fp3","tags":["fp-inherit"],"status":"verified","concept":{"reviewed_at":"2026-10-15","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省、日本年金機構、金融庁、国税庁、e-Gov法令検索などの公的な資料と照合。確認問題は独立に解き、正答が一つに決まるかを別の読みで試した。指摘を反映した後に再検証。","text":"贈与は、財産をただであげる約束で、あげる人ともらう人の合意で成り立ちます。贈与税は、財産をもらった人が払います。課税のしかたには、暦年課税と相続時精算課税の2つがあります。暦年課税は、1月1日から12月31日までの1年間にもらった財産の合計から、基礎控除の110万円を引き、残りに税率をかけます。相続時精算課税は、60歳以上の父母や祖父母から、18歳以上の子や孫への贈与で選べるしくみです。選ぶと、毎年110万円の基礎控除と、累計2,500万円までの特別控除を引いた残りに、一律20%の税がかかります。その代わり、贈与した人が亡くなったときに、贈与された財産（毎年の110万円の基礎控除の分を除く）を相続財産に加えて、相続税を計算し直します（精算）。一度選ぶと、その人からの贈与は、暦年課税に戻せません。","example":"暦年課税で税率をかける金額 = 1年間にもらった合計 − 110万円\n例　1年間に300万円をもらったとき：300 − 110 = 190","note":"例の答えの単位は万円です。税率の表、亡くなる前の一定期間の贈与を相続財産に加える決まり（生前贈与加算）、住宅取得資金などの非課税の特例は、ここでは扱いません。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明と確認問題で使う知識を洗い出し、この単元の説明か前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の学科試験の到達点が範囲を超えて使っていないかを照合。学習時間は、FP3級の単元どうしの釣り合いとの比較だけで、実測ではない。練習ページは2026-10-16に作り、別の実行で検証した。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"fp3-inheritance","level":"helps"}],"assessment":{"question":"暦年課税で、ある年に、もらった財産の合計が100万円だけだったとき、贈与税はどうなるでしょうか。","options":["かからない","10万円にかかる","100万円の全額にかかる"],"answer":0,"explanation":"暦年課税では、1年間にもらった合計から基礎控除の110万円を引きます。100万円は110万円以下なので、贈与税はかかりません。10万円は、基礎控除と比べた差を、税のかかる額と取り違えた誤りです。基礎控除は、もらった額から引くので、全額にかかることもありません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを、単元で扱わない特例（住宅取得等資金、65歳以上の会社員）も当てて確認。制度は国税庁・日本年金機構の資料で、2026年の現行制度として確認。指摘を反映した後に再検証。","title":"贈与税で、税率をかける金額と税額を求める","lead":"暦年課税の基礎控除は、もらった人ごとに1年で110万円。本試験は○×式と三答択一式です。ここでは解き方を身につけるために、金額を直接答える問題もあります。","original":true,"problems":[{"label":"贈与税を払う人を判断する（○×）","question":"次の文が正しければ○、誤っていれば×を選んでください。「個人から財産の贈与を受けたとき、贈与税を払うのは、財産をあげた人である。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"贈与税は、財産をあげた人ではなく、もらった人にかかる。"},{"key":"×","text":"誤っている","correct":true,"reason":"贈与税を払うのは、財産をもらった人。"}],"steps":[{"title":"贈与税を払う人を思い出す","formula":"あげた人：払わない\nもらった人：払う","body":"贈与税は、財産をもらった人が、もらった財産について払います。"},{"title":"文と照らし合わせる","formula":"文：あげた人が払う\n決まり：もらった人が払う","body":"文は決まりと合わないので、×です。"}]},{"label":"複数の人からもらったときの、税率をかける金額","question":"Iさんは、ある年に、父から200万円、祖母から150万円の現金をもらいました。どちらも暦年課税で、この年にほかの贈与はありません。贈与税の税率をかける金額はいくらでしょうか。","answer":"240万円","alternatives":[{"try":"130万円（あげた人ごとに110万円を引く：90万円 + 40万円）","why_not":"基礎控除の110万円は、もらった人が1年間にもらった合計から1回だけ引きます。あげた人の数だけ引くのではありません。"}],"steps":[{"title":"1年間にもらった財産を合計する","formula":"200 + 150 = 350","body":"単位は万円です。あげた人が別でも、もらった人ごとに1年分を合計します。"},{"title":"合計から基礎控除を1回引く","formula":"350 − 110 = 240","body":"税率をかける金額は240万円です。"}]},{"label":"相続時精算課税を選べる贈与を見分ける","question":"次のア〜ウの贈与のうち、相続時精算課税を選べるものを1つ選んでください。年齢はどれも、贈与した年の1月1日の時点のものです。どれも、住宅の購入などには使わない現金の贈与です。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"62歳の父から、20歳の子への贈与","correct":true,"reason":"あげる人が60歳以上の父、もらう人が18歳以上の子なので、選べる。"},{"key":"イ","text":"58歳の母から、30歳の子への贈与","correct":false,"reason":"あげる人が60歳未満なので、選べない（住宅の購入などのための資金の贈与だけに認められる特例は除く。この問題の贈与は当てはまらない）。"},{"key":"ウ","text":"70歳の伯父から、25歳のおいへの贈与","correct":false,"reason":"あげる人が父母や祖父母ではないので、選べない。"}],"steps":[{"title":"選べる条件を整理する","formula":"あげる人：60歳以上の父母や祖父母\nもらう人：18歳以上の子や孫","body":"あげる人ともらう人の両方が条件に合うときだけ、相続時精算課税を選べます。"},{"title":"選択肢を条件と照らし合わせる","formula":"ア：父62歳、子20歳 → 両方合う\nイ：母58歳 → 60歳未満で合わない\nウ：伯父 → 父母や祖父母でなく合わない","body":"選べるのはアです。"}]},{"label":"相続時精算課税の贈与税額を求める","question":"Jさんは、父から3,000万円の贈与を受け、相続時精算課税を選びました。父からの贈与はこれが初めてで、必要な届出と申告はしているものとします。この年にJさんが払う贈与税額はいくらでしょうか。","answer":"78万円","alternatives":[{"try":"100万円（特別控除だけを引く：(3000 − 2500) × 20%）","why_not":"相続時精算課税でも、毎年110万円の基礎控除があります。基礎控除を引いてから、特別控除を引きます。"}],"steps":[{"title":"基礎控除を引く","formula":"3000 − 110 = 2890","body":"単位は万円です。相続時精算課税でも、毎年110万円の基礎控除を引きます。"},{"title":"特別控除を引く","formula":"2890 − 2500 = 390","body":"父からの贈与は初めてなので、特別控除は2,500万円を全部使えます。残りは390万円です。"},{"title":"一律20%をかける","formula":"390 × 0.2 = 78","body":"20%は0.2です。贈与税額は78万円です。特別控除を使い切ったので、翌年以降に父からもらう財産は、基礎控除の110万円を超えた分の全部に20%がかかります。"}]}]},"sources":[{"title":"国税庁 タックスアンサー No.4402 贈与税がかかる場合","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/zoyo/4402.htm","checked_at":"2026-10-16"},{"title":"国税庁 タックスアンサー No.4103 相続時精算課税の選択","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/sozoku/4103.htm","checked_at":"2026-10-16"}]},"fp3-inheritance":{"id":"fp3-inheritance","name":"法定相続と基礎控除","type":"learn","goal":"法定相続人と法定相続分を判断し、相続税の基礎控除額を求められる。","part_of":"fp3","tags":["fp-inherit"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"人が亡くなると、その人（被相続人）の財産は、民法で決められた法定相続人に引き継がれます。配偶者は常に法定相続人です。そのほかは順位が決まっていて、子がいれば子（第1順位）、子がいなければ父母などの直系尊属（第2順位）、そのどちらもいなければ兄弟姉妹（第3順位）が法定相続人になります。遺言がないときの分け方の目安が法定相続分で、組み合わせごとに決まっています。同じ順位の人が複数いるときは、その順位の分を人数で等しく分けます。ただし、父母の一方だけが同じ兄弟姉妹の相続分は、父母の両方が同じ兄弟姉妹の2分の1です。相続税は、遺産の額（借入金などの債務を引いた正味の額）が基礎控除額を超えたときにかかります。基礎控除額は、3,000万円に、600万円 × 法定相続人の数を足した額です。","example":"配偶者と子：配偶者 1/2、子 1/2\n配偶者と直系尊属：配偶者 2/3、直系尊属 1/3\n配偶者と兄弟姉妹：配偶者 3/4、兄弟姉妹 1/4\n相続税の基礎控除額 = 3,000万円 + 600万円 × 法定相続人の数\n例　法定相続人が配偶者と子1人の2人のとき：3000 + 600 × 2 = 4200","note":"例の答えの単位は万円です。相続を放棄した人や養子がいる場合の数え方、子が先に亡くなっていて孫が代わりに相続する場合（代襲相続）は、ここでは扱いません。贈与と贈与税は「贈与税」の単元で扱います。試験の分野名にある事業承継は、この木ではまだ扱っていません。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"法定相続人が配偶者と子2人の3人のとき、相続税の基礎控除額はいくらでしょうか。","options":["4,800万円","3,600万円","5,400万円"],"answer":0,"explanation":"3,000万円 + 600万円 × 3人 = 4,800万円です。3,600万円は3,000万円に600万円を1人分だけ足した額、5,400万円は人数を4人と数えた額です。"},"practice":{"title":"法定相続人と法定相続分を決め、基礎控除額を求める","lead":"先に、だれが法定相続人かを決める。本試験は選択式です。ここでは解き方を身につけるために、金額を直接答える問題もあります。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"配偶者と子で、法定相続分どおりに分ける","question":"Aさんが亡くなりました。家族は妻と子2人で、遺言はありません。遺産6,000万円を法定相続分どおりに分けると、妻と子1人あたりは、それぞれいくらになるでしょうか。","answer":"妻3,000万円、子1人あたり1,500万円","alternatives":[{"try":"3人で等しく、1人あたり2,000万円","why_not":"配偶者と子が相続するときは、配偶者が2分の1、子全体で2分の1です。子の2分の1を、子の人数で等しく分けます。"}],"steps":[{"title":"法定相続人を決める","formula":"配偶者：妻（常に相続人）\n第1順位：子2人","body":"子がいるので、第1順位の子が妻と一緒に相続します。"},{"title":"法定相続分を割り当てる","formula":"妻：1/2\n子全体：1/2\n子1人あたり：1/2 ÷ 2 = 1/4","body":"子全体の2分の1を、2人で等しく分けます。"},{"title":"遺産に法定相続分をかける","formula":"妻：6000 × 1/2 = 3000\n子1人あたり：6000 × 1/4 = 1500","body":"単位は万円です。妻3,000万円、子は1人あたり1,500万円です。"},{"title":"合計が遺産と同じか確かめる","formula":"3000 + 1500 + 1500 = 6000","body":"三人分を足すと、遺産の6,000万円になります。"}]},{"label":"相続税の基礎控除額を求める","question":"Bさんが亡くなりました。法定相続人は、妻と子3人です。相続税の基礎控除額はいくらでしょうか。","answer":"5,400万円","alternatives":[{"try":"4,800万円（子3人だけを数える）","why_not":"配偶者も法定相続人なので、人数に入れます。法定相続人は妻と子3人の4人です。"}],"steps":[{"title":"法定相続人の数を数える","formula":"妻：1人\n子：3人\n合計：1 + 3 = 4","body":"法定相続人は4人です。"},{"title":"基礎控除額の式に入れる","formula":"3000 + 600 × 4 = 5400","body":"単位は万円です。遺産の正味の額がこの5,400万円以下なら、相続税はかかりません。"}]},{"label":"子がいないときの法定相続分を判断する","question":"Cさんが亡くなりました。Cさんには子がおらず、家族は妻と、Cさんの父と母です。遺言はありません。妻の法定相続分はどれでしょうか。次のア〜ウから1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"2分の1","correct":false,"reason":"配偶者と子が相続するときの、配偶者の法定相続分。"},{"key":"イ","text":"3分の2","correct":true,"reason":"子がいないので、第2順位の直系尊属（父と母）が配偶者と一緒に相続する。このときの配偶者の法定相続分は3分の2。"},{"key":"ウ","text":"4分の3","correct":false,"reason":"配偶者と兄弟姉妹が相続するときの、配偶者の法定相続分。"}],"steps":[{"title":"法定相続人を、順位から決める","formula":"配偶者：妻（常に相続人）\n第1順位：子 → いない\n第2順位：直系尊属 → 父と母","body":"子がいないので、父と母が妻と一緒に相続します。"},{"title":"組み合わせから、法定相続分を選ぶ","formula":"配偶者と直系尊属：配偶者 2/3、直系尊属 1/3\n父と母：1/3 ÷ 2 = 1/6 ずつ","body":"妻の法定相続分は3分の2です。父と母は、残りの3分の1を等しく分けて、6分の1ずつです。"}]}]},"sources":[{"title":"e-Gov法令検索 民法（第887条〜第900条）","url":"https://laws.e-gov.go.jp/law/129AC0000000089","checked_at":"2026-10-14"},{"title":"国税庁 タックスアンサー No.4152 相続税の計算","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/sozoku/4152.htm","checked_at":"2026-10-14"}]},"fp3-investment":{"id":"fp3-investment","name":"債券・株式の指標と預金保険","type":"learn","goal":"債券の利回りと株式の投資指標を計算でき、預金保険で守られる範囲を判断できる。","part_of":"fp3","tags":["fp-invest"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"金融資産運用は、預貯金、債券、株式、投資信託などにお金を置いて増やすことについての分野です。利息を元本だけにつけるのが単利、ついた利息にも利息をつけるのが複利です。債券は、国や会社にお金を貸す証書で、決まった利息（表面利率で決まる）を受け取り、満期に額面の金額が戻ります。額面より安く買えば、満期にその差額も得られます。株式が割安かどうかの判断材料の一つに、株価が1株あたりの利益や純資産の何倍かを表す指標があります。金融機関が破綻したときは、預金保険制度で預金が守られます。利息のつく普通預金や定期預金などは、1人1金融機関あたり、合計で元本1,000万円までとその利息が守られます。利息がつかず、いつでも引き出せて、振込などに使える決済用預金は、全額が守られます。外貨預金は守られません。","example":"最終利回り（満期まで持つときの1年あたりの利回り） = (1年の利息 + (額面 − 買った価格) ÷ 残りの年数) ÷ 買った価格\nPER（株価収益率） = 株価 ÷ 1株あたりの純利益\nPBR（株価純資産倍率） = 株価 ÷ 1株あたりの純資産\n配当利回り = 1株あたりの配当 ÷ 株価\n例　株価1,500円、1株あたりの純利益50円のときのPER：1500 ÷ 50 = 30","note":"例の答えの単位は倍です。投資信託とNISAは「投資信託とNISA」の単元で扱います。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"100万円を、年利1%の単利で3年間預けました。3年間で受け取る利息の合計はいくらでしょうか。税金は考えません。","options":["3万円","3.0301万円","1万円"],"answer":0,"explanation":"単利では、利息は毎年元本の1%の1万円で、3年で3万円です。3.0301万円は、利息にも利息がつく複利で計算したときの額です。1万円は1年分だけの利息です。"},"practice":{"title":"利回りと投資指標を計算し、預金保険の範囲を判断する","lead":"何を何で割るかを、式の形で先に書く。本試験は選択式です。ここでは解き方を身につけるために、選択肢を三つにしたり、数を直接答えたりします。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"債券の利回りを求める","question":"額面100円、表面利率1.0%（1年に1.0円の利息）、満期まで5年の債券を、98円で買いました。満期まで持つときの、1年あたりの利回り（最終利回り）は何%でしょうか。小数第3位を四捨五入して答えてください。税金や手数料は考えません。","answer":"約1.43%","alternatives":[{"try":"1.0%（表面利率をそのまま答える）","why_not":"表面利率は、額面に対する利息の割合です。額面より安く買ったので、満期に戻る差額の分だけ、利回りは表面利率より高くなります。"}],"steps":[{"title":"1年あたりの差益を求める","formula":"(100 − 98) ÷ 5 = 0.4","body":"満期に額面の100円が戻るので、買った98円との差の2円が利益になります。これを5年で割って、1年あたり0.4円です。"},{"title":"1年あたりの利息と差益を合わせる","formula":"1.0 + 0.4 = 1.4","body":"1年あたり、利息1.0円と差益0.4円で、合わせて1.4円を得ます。"},{"title":"買った価格で割って、利回りにする","formula":"1.4 ÷ 98 は、約0.01429","body":"利回りは、実際に払った98円に対する割合です。百分率にすると約1.429%です。小数第3位の9は5以上なので切り上げて（四捨五入）、約1.43%です。"}]},{"label":"株式の投資指標を判定する","question":"ある会社の株価は2,000円、1株あたりの純利益は100円、1株あたりの純資産は1,600円、1株あたりの年間配当は40円です。次のア〜ウのうち、正しいものを1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"PER（株価収益率）は20倍である。","correct":true,"reason":"PERは株価 ÷ 1株あたりの純利益で、2000 ÷ 100 = 20倍。"},{"key":"イ","text":"PBR（株価純資産倍率）は0.8倍である。","correct":false,"reason":"PBRは株価 ÷ 1株あたりの純資産で、2000 ÷ 1600 = 1.25倍。0.8倍は、割る数と割られる数を逆にした値。"},{"key":"ウ","text":"配当利回りは5%である。","correct":false,"reason":"配当利回りは1株あたりの配当 ÷ 株価で、40 ÷ 2000 = 0.02 の2%。5%は、純利益の100円を株価で割った値。"}],"steps":[{"title":"三つの指標の式を書く","formula":"PER = 株価 ÷ 1株あたりの純利益\nPBR = 株価 ÷ 1株あたりの純資産\n配当利回り = 1株あたりの配当 ÷ 株価","body":"PERとPBRは「株価が何倍か」なので株価を割る側に、配当利回りは「株価に対する割合」なので株価で割ります。"},{"title":"それぞれを計算する","formula":"PER：2000 ÷ 100 = 20\nPBR：2000 ÷ 1600 = 1.25\n配当利回り：40 ÷ 2000 = 0.02","body":"PERは20倍、PBRは1.25倍、配当利回りは2%です。正しいのはアです。"}]},{"label":"預金保険で守られる範囲を判断する","question":"Bさんは、A銀行に普通預金800万円と定期預金500万円（どちらも利息のつく円の預金で、決済用預金ではなく、金額は元本）を預けています。A銀行が破綻したとき、預金保険制度で守られる元本の上限はいくらでしょうか。次のア〜ウから1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"800万円","correct":false,"reason":"普通預金だけで考えた額。守られる範囲は、同じ金融機関の利息のつく預金を合計して決まる。"},{"key":"イ","text":"1,000万円","correct":true,"reason":"決済用預金ではない円の預金（利息のつく普通預金や定期預金など）は、1人1金融機関あたり、合計で元本1,000万円までとその利息が守られる。"},{"key":"ウ","text":"1,300万円","correct":false,"reason":"預けている元本の合計。1,000万円を超える部分は、破綻した銀行の財産の状況に応じて支払われるので、全額が守られるとは限らない。"}],"steps":[{"title":"同じ金融機関の、利息のつく預金を合計する","formula":"800 + 500 = 1300","body":"普通預金も定期預金も、同じA銀行の、決済用預金ではない円の預金なので、合わせて考えます。単位は万円です。"},{"title":"上限の1,000万円と比べる","formula":"1,300万円のうち、守られる元本：1,000万円まで","body":"合計が1,000万円を超えているので、元本1,000万円までとその利息が守られます。"}]}]},"sources":[{"title":"金融庁 預金保険制度","url":"https://www.fsa.go.jp/policy/payoff/01.pdf","checked_at":"2026-10-14"}]},"fp3-jitsugi-hoken":{"id":"fp3-jitsugi-hoken","name":"保険顧客資産相談業務","type":"target","goal":"きんざいの3級実技試験（保険顧客資産相談業務）の形式で、保険顧客の資産についての事例に答えられる。","part_of":"fp3","status":"draft","scope_note":"FP3級の実技試験の一つです。実技試験は3科目から1つを選びます。試験団体が審査項目に挙げているのは、ライフプラン策定、保険商品の活用、相続・贈与、所得税等の相談です。審査項目は例示で、実技も学科の6分野の範囲から出題されるので、この木では、前提を学科試験にしています。","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"試験時間、問題数、合格基準、審査項目を試験団体の資料と照合し、前提の分野の対応づけが審査項目から無理なく導けるかを確認。指摘を反映した後に再検証。","text":"金融財政事情研究会（きんざい）が実施する3級の実技試験の一つです。保険顧客の家族構成、加入している保険、保有している金融資産などの事例をもとに、ライフプラン、保険の活用、相続・贈与、所得税についての相談に答えます。","example":"60分・事例形式・5題\n50点満点のうち30点以上で合格","note":"数字と審査項目は、きんざいの試験要綱と試験科目のページで2026-10-14に確認しました。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"fp3-gakka","level":"must"}],"sources":[{"title":"金融財政事情研究会：ファイナンシャル・プランニング技能検定 試験科目及びその範囲","url":"https://www.kinzai.or.jp/fp/fp_specifications.html","checked_at":"2026-10-14"}]},"fp3-jitsugi-kojin":{"id":"fp3-jitsugi-kojin","name":"個人資産相談業務","type":"target","goal":"きんざいの3級実技試験（個人資産相談業務）の形式で、個人顧客の資産についての事例に答えられる。","part_of":"fp3","status":"draft","scope_note":"FP3級の実技試験の一つです。実技試験は3科目から1つを選びます。試験団体が審査項目に挙げているのは、ライフプランの策定、金融資産選択、不動産の有効活用、相続・贈与税、所得税等の相談です。審査項目は例示で、実技も学科の6分野の範囲から出題されるので、この木では、前提を学科試験にしています。","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"試験時間、問題数、合格基準、審査項目を試験団体の資料と照合し、前提の分野の対応づけが審査項目から無理なく導けるかを確認。指摘を反映した後に再検証。","text":"金融財政事情研究会（きんざい）が実施する3級の実技試験の一つです。個人顧客の家族構成、保有している金融資産や不動産などの事例をもとに、ライフプラン、金融資産の選び方、不動産の活用、相続・贈与の税金、所得税についての相談に答えます。","example":"60分・事例形式・5題\n50点満点のうち30点以上で合格","note":"数字と審査項目は、きんざいの試験要綱と試験科目のページで2026-10-14に確認しました。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"fp3-gakka","level":"must"}],"sources":[{"title":"金融財政事情研究会：ファイナンシャル・プランニング技能検定 試験科目及びその範囲","url":"https://www.kinzai.or.jp/fp/fp_specifications.html","checked_at":"2026-10-14"}]},"fp3-jitsugi-kyokai":{"id":"fp3-jitsugi-kyokai","name":"資産設計提案業務","type":"target","goal":"日本FP協会の3級実技試験（資産設計提案業務）の形式で、家計や資産についての設例に答えられる。","part_of":"fp3","status":"draft","scope_note":"FP3級の実技試験の一つです。実技試験は3科目から1つを選びます。この科目は、学科試験の6分野すべてについて審査すると、日本FP協会の試験範囲のページに書かれています。この木では、前提を学科試験にしています。","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"試験時間、問題数、合格基準、審査項目を試験団体の資料と照合し、前提の分野の対応づけが審査項目から無理なく導けるかを確認。指摘を反映した後に再検証。","text":"日本FP協会が実施する3級の実技試験です。学科試験の範囲の6分野について、顧客の家計や資産の状況を分析して、提案に必要なことを答えます。試験要綱では、関連業法と職業上の倫理を踏まえたファイナンシャル・プランニング、ファイナンシャル・プランニングのプロセス、顧客のファイナンス状況の分析と評価を審査するとされています。","example":"60分・20問・多肢選択式\n100点満点のうち60点以上で合格","note":"数字は日本FP協会の試験要綱で2026-10-14に確認しました。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"fp3-gakka","level":"must"}],"sources":[{"title":"日本FP協会：3級ファイナンシャル・プランニング技能検定（資産設計提案業務）試験要綱","url":"https://www.jafp.or.jp/exam/app/howto/files/outline_3fp.pdf","checked_at":"2026-10-14"},{"title":"日本FP協会：3級の試験範囲","url":"https://www.jafp.or.jp/exam/subjects_03/","checked_at":"2026-10-14"}]},"fp3-lifeplan":{"id":"fp3-lifeplan","name":"6つの係数と資金計画","type":"learn","goal":"6つの係数から使う係数を選び、積み立てや取り崩しの金額を求められる。","part_of":"fp3","tags":["fp-life"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"ライフプランニングは、結婚、住宅の購入、子の教育、老後などの予定を立て、そのためのお金の計画を作ることです。将来の収入と支出を年ごとに並べた表をキャッシュフロー表といいます。お金を一定の利率で複利（ついた利息にも、また利息がつく増え方）で増やしたり、取り崩したりするときの計算には、6つの係数を使います。係数は、利率と期間ごとに表になっていて、金額に係数をかけるだけで答えが出ます。どの係数を使うかは、「今の一括の金額か、毎年の金額か」「将来の金額を知りたいのか、今の金額を知りたいのか」で決まります。","example":"終価係数：今の一括の金額 → 将来の金額\n現価係数：将来の金額 → 今いくらあればよいか\n年金終価係数：毎年の積立額 → 将来の金額\n減債基金係数：将来の目標額 → 毎年の積立額\n資本回収係数：今の一括の金額 → 毎年取り崩せる額\n年金現価係数：毎年受け取りたい額 → 今いくらあればよいか\n例　30万円を年利2%で10年間複利で運用（終価係数1.219）：30 × 1.219 = 36.57","note":"例の答えの単位は万円です。係数は、年利と年数が同じでも、表によって小数の桁数が違うことがあります。試験では、問題に示された係数を使います。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"10年後に一定の金額を手にするために、今いくら一括で預ければよいかを求めるときに使う係数はどれでしょうか。","options":["現価係数","終価係数","年金終価係数"],"answer":0,"explanation":"将来の金額から、今必要な金額を求めるのは現価係数です。終価係数は、今の金額から将来の金額を求めます。年金終価係数は、毎年の積立額から将来の金額を求めます。"},"practice":{"title":"6つの係数から、使う係数を選んで計算する","lead":"今か将来か、一括か毎年か、を先に決める。本試験は選択式です。ここでは解き方を身につけるために、金額を直接答えます。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"一括で運用した将来の金額を求める","question":"100万円を、年利2%で10年間、複利で運用します。表の係数を1つ選んで金額にかけると、10年後の金額はいくらになるでしょうか。税金や手数料は考えません。","answer":"121.9万円","tables":[{"caption":"年利2%・期間10年の係数（小数第3位まで）","rows":[["係数","値"],["終価係数","1.219"],["現価係数","0.820"],["年金終価係数","10.950"],["減債基金係数","0.091"],["資本回収係数","0.111"],["年金現価係数","8.983"]]}],"alternatives":[{"try":"約122.0万円（100万円を現価係数0.820で割る）","why_not":"考え方は正しく、丸める前の係数なら同じ値になります。表の係数は小数第3位で丸めてあるので、かけるか割るかで小数点以下がずれます。この問題は、係数をかけて求めるよう指定しているので、終価係数をかけた121.9万円が答えです。"},{"try":"120万円（100万円の2%を10年分足す）","why_not":"毎年2万円ずつ増えるのは単利の計算です。複利では、増えた利息にもまた利息がつくので、120万円より多くなります。"}],"steps":[{"title":"今か将来か、一括か毎年かを決める","formula":"わかっているもの：今の一括の金額（100万円）\n知りたいもの：将来（10年後）の金額","body":"今の一括の金額から将来の金額を求めるので、終価係数を使います。"},{"title":"金額に終価係数をかける","formula":"100 × 1.219 = 121.9","body":"単位は万円です。10年後には121.9万円になります。"}]},{"label":"目標額のための毎年の積立額を求める","question":"10年後に500万円を用意したいと考えています。年利2%で複利運用しながら、毎年末に同じ額を積み立てます。表の係数を1つ選んで金額にかけると、毎年の積立額はいくらになるでしょうか。税金や手数料は考えません。","answer":"45.5万円","tables":[{"caption":"年利2%・期間10年の係数（小数第3位まで）","rows":[["係数","値"],["終価係数","1.219"],["現価係数","0.820"],["年金終価係数","10.950"],["減債基金係数","0.091"],["資本回収係数","0.111"],["年金現価係数","8.983"]]}],"alternatives":[{"try":"約45.7万円（500万円を年金終価係数10.950で割る）","why_not":"考え方は正しく、丸める前の係数なら同じ値になります。表の係数は小数第3位で丸めてあるので、かけるか割るかで小数点以下がずれます。この問題は、係数をかけて求めるよう指定しているので、減債基金係数をかけた45.5万円が答えです。"},{"try":"50万円（500万円を10年で割る）","why_not":"運用しないで貯めるときの額です。積み立てたお金にも利息がつくので、毎年の積立額はそれより少なくてすみます。"}],"steps":[{"title":"今か将来か、一括か毎年かを決める","formula":"わかっているもの：将来（10年後）の目標額（500万円）\n知りたいもの：毎年の積立額","body":"将来の目標額から毎年の積立額を求めるので、減債基金係数を使います。"},{"title":"目標額に減債基金係数をかける","formula":"500 × 0.091 = 45.5","body":"単位は万円です。毎年45.5万円を積み立てます。"},{"title":"年金終価係数で、逆向きに確かめる","formula":"45.5 × 10.950 = 498.225","body":"毎年45.5万円を10年積み立てると、約498万円になります。係数を小数第3位までに丸めているので、500万円からわずかにずれます。減債基金係数と年金終価係数は、たがいに逆数の関係です。"}]},{"label":"一括の金額から毎年取り崩せる額を求める","question":"退職時の1,000万円を、年利2%で複利運用しながら、10年間、毎年末に同じ額ずつ取り崩して受け取ります。10年後にちょうど0円になるとき、表の係数を1つ選んで金額にかけると、毎年受け取れる額はいくらになるでしょうか。税金や手数料は考えません。","answer":"111万円","tables":[{"caption":"年利2%・期間10年の係数（小数第3位まで）","rows":[["係数","値"],["終価係数","1.219"],["現価係数","0.820"],["年金終価係数","10.950"],["減債基金係数","0.091"],["資本回収係数","0.111"],["年金現価係数","8.983"]]}],"alternatives":[{"try":"約111.3万円（1,000万円を年金現価係数8.983で割る）","why_not":"考え方は正しく、丸める前の係数なら同じ値になります。表の係数は小数第3位で丸めてあるので、かけるか割るかで小数点以下がずれます。この問題は、係数をかけて求めるよう指定しているので、資本回収係数をかけた111万円が答えです。"}],"steps":[{"title":"今か将来か、一括か毎年かを決める","formula":"わかっているもの：今の一括の金額（1,000万円）\n知りたいもの：毎年取り崩せる額","body":"今の一括の金額から毎年の受取額を求めるので、資本回収係数を使います。"},{"title":"金額に資本回収係数をかける","formula":"1000 × 0.111 = 111","body":"単位は万円です。毎年111万円を受け取れます。"},{"title":"受取額の合計が、元の金額より多い理由を確かめる","formula":"111 × 10 = 1110","body":"10年間の受取額の合計は1,110万円で、元の1,000万円より多くなります。取り崩している間も、残っているお金に利息がつくからです。"}]}]}},"fp3-realestate":{"id":"fp3-realestate","name":"登記と建築の制限","type":"learn","goal":"不動産登記の記録の場所を区別でき、建ぺい率と容積率から、建てられる建物の面積の上限を求められる。","part_of":"fp3","tags":["fp-estate"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"不動産の分野のうち、この単元では、登記の記録と、建てられる建物の制限を学びます。売買の決まりと税金は「不動産の取引と税金」で扱います。不動産の登記記録は、土地や建物の所在や面積を記録する表題部と、権利を記録する権利部に分かれます。権利部のうち、甲区には所有権に関すること（移転や差押えなど）、乙区には抵当権など所有権以外の権利が記録されます。建てられる建物の大きさは、建築基準法で制限されます。建ぺい率は、敷地の面積に対する建築面積（建物を真上から見た面積）の割合、容積率は、敷地の面積に対する延べ面積（各階の床面積の合計）の割合で、どちらも用途地域ごとに上限が決められています。敷地の前の道路の幅が12m未満のときは、容積率の上限は、道路の幅に法定乗数（住居系の用途地域では原則10分の4、それ以外は原則10分の6）をかけた値と、指定された容積率の、小さいほうになります。","example":"建築面積の上限 = 敷地の面積 × 建ぺい率\n延べ面積の上限 = 敷地の面積 × 容積率\n例　敷地150㎡、建ぺい率40%のときの建築面積の上限：150 × 0.4 = 60","note":"例の答えの単位は㎡です。角地などで建ぺい率が緩められる場合や、特定行政庁が法定乗数を別に定める場合は、ここでは考えません。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"敷地の面積が100㎡、建ぺい率が50%の土地に建てられる建物の、建築面積の上限はいくらでしょうか。","options":["50㎡","150㎡","200㎡"],"answer":0,"explanation":"建築面積の上限は、敷地の面積 × 建ぺい率で、100 × 0.5 = 50㎡です。150㎡は建ぺい率50%の50を㎡として足した誤り、200㎡は100を0.5で割った誤りです。"},"practice":{"title":"登記記録の場所と、建物の面積の上限を求める","lead":"何に対する割合かを決めてから、敷地の面積にかける。本試験は選択式です。ここでは解き方を身につけるために、面積を直接答える問題もあります。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"建ぺい率から建築面積の上限を求める","question":"敷地の面積が200㎡、建ぺい率が60%の土地に建物を建てます。建築面積の上限は何㎡でしょうか。角地などの緩和はないものとします。","answer":"120㎡","alternatives":[{"try":"約333㎡（200を0.6で割る）","why_not":"建ぺい率は、敷地の面積に対する割合です。上限は、敷地の面積に建ぺい率をかけて求めます。割ると敷地より大きくなり、真上から見て敷地からはみ出してしまいます。"}],"steps":[{"title":"建ぺい率を小数にする","formula":"60% → 0.6","body":"建ぺい率は、敷地の面積に対する建築面積の割合です。"},{"title":"敷地の面積に建ぺい率をかける","formula":"200 × 0.6 = 120","body":"建築面積の上限は120㎡です。"}]},{"label":"前の道路の幅で、容積率の上限を決める","question":"敷地の面積が200㎡の土地があります。用途地域は第一種住居地域（住居系）で、指定された容積率は200%です。敷地の前の道路の幅は4mです。法定乗数を10分の4とするとき、延べ面積の上限は何㎡でしょうか。","answer":"320㎡","alternatives":[{"try":"400㎡（指定された容積率200%をそのまま使う）","why_not":"前の道路の幅が12m未満なので、道路の幅から決まる容積率（160%）と、指定された容積率（200%）のうち、小さいほうが上限になります。"}],"steps":[{"title":"道路の幅から決まる容積率を求める","formula":"4 × 0.4 = 1.6","body":"道路の幅4mに法定乗数の10分の4をかけて、1.6、つまり160%です。"},{"title":"指定された容積率と比べて、小さいほうを選ぶ","formula":"道路の幅から：160%\n指定された容積率：200%\n上限に使う容積率：160%","body":"道路の幅が12m未満なので、二つのうち小さい160%が上限です。"},{"title":"敷地の面積に容積率をかける","formula":"200 × 1.6 = 320","body":"延べ面積の上限は320㎡です。"}]},{"label":"登記記録のどこに書かれるかを区別する","question":"不動産の登記記録について、次のア〜ウのうち、正しいものを1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"抵当権は、権利部の甲区に記録される。","correct":false,"reason":"抵当権は所有権以外の権利なので、権利部の乙区に記録される。"},{"key":"イ","text":"所有権は、権利部の甲区に記録される。","correct":true,"reason":"甲区は、所有権に関することを記録する場所。"},{"key":"ウ","text":"抵当権は、表題部に記録される。","correct":false,"reason":"表題部は、土地や建物の所在、面積など、物そのものの状況を記録する場所。抵当権などの権利の登記は、権利部にされる。"}],"steps":[{"title":"登記記録の区分を整理する","formula":"表題部：所在、面積など、物そのものの状況\n権利部の甲区：所有権\n権利部の乙区：抵当権など、所有権以外の権利","body":"物の状況か権利か、権利なら所有権かそれ以外か、で記録の場所が決まります。"},{"title":"選択肢を区分と照らし合わせる","formula":"ア：抵当権は乙区なので誤り\nイ：所有権は甲区なので正しい\nウ：抵当権の登記は権利部なので誤り","body":"正しいのはイです。"}]}]},"sources":[{"title":"e-Gov法令検索 建築基準法（第52条・第53条）","url":"https://laws.e-gov.go.jp/law/325AC0000000201","checked_at":"2026-10-14"},{"title":"法務省 不動産登記のABC","url":"https://www.moj.go.jp/MINJI/minji02.html","checked_at":"2026-10-14"}]},"fp3-retax":{"id":"fp3-retax","name":"不動産の取引と税金","type":"learn","goal":"不動産の売買の主な決まりを説明でき、買うとき、持っている間、売るときにかかる税金を区別できる。","part_of":"fp3","tags":["fp-estate"],"status":"verified","concept":{"reviewed_at":"2026-10-15","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省、日本年金機構、金融庁、国税庁、e-Gov法令検索などの公的な資料と照合。確認問題は独立に解き、正答が一つに決まるかを別の読みで試した。指摘を反映した後に再検証。","text":"不動産の売買は、宅地建物取引業者が仲介することが多く、契約の前に、宅地建物取引士が買主に重要事項を説明します。買主が売主に払う手付金は、ふつう解約手付とされ、相手が契約の実行に取りかかる前なら、買主は手付金を放棄して、売主は手付金の2倍の額を買主に差し出して、契約を解除できます。税金は、場面ごとに違います。買うときは、不動産取得税、登記（土地や建物の持ち主などを公の帳簿に記録すること）の登録免許税、契約書の印紙税がかかります。持っている間は、毎年、固定資産税と、地域によって都市計画税がかかります。売って利益が出たときは、譲渡所得として所得税と住民税がかかり、税率は持っていた期間で変わります。売った年の1月1日の時点で、持っていた期間が5年を超えていれば長期譲渡所得、5年以下なら短期譲渡所得です。","example":"買うとき：不動産取得税、登録免許税、印紙税\n持っている間：固定資産税、都市計画税\n売って利益が出たとき：所得税、住民税（譲渡所得）","note":"税率や軽減の特例の金額は、ここでは扱いません。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明と確認問題で使う知識を洗い出し、この単元の説明か前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の学科試験の到達点が範囲を超えて使っていないかを照合。学習時間は、FP3級の単元どうしの釣り合いとの比較だけで、実測ではない。練習ページは2026-10-16に作り、別の実行で検証した。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"fp3-realestate","level":"helps"},{"id":"fp3-tax","level":"helps"}],"assessment":{"question":"不動産を持っている間、毎年かかる税金はどれでしょうか。","options":["固定資産税","不動産取得税","登録免許税"],"answer":0,"explanation":"持っている間に毎年かかるのは固定資産税です。不動産取得税は買って取得したときに一度、登録免許税は登記をするときにかかります。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の読み・別の選択肢で試して確認。制度は国税庁・日本年金機構・金融庁などの公的な資料で、2026年の現行制度として確認。試験の形（日本FP協会の公表問題）との適合も確認し、軽微の指摘を反映。","title":"売買の決まりと、場面ごとの税金を判断する","lead":"譲渡所得の長期と短期は、売った日ではなく、売った年の1月1日で数える。本試験は○×式と三答択一式です。ここでは解き方を身につけるために、答えを直接書く問題もあります。","original":true,"problems":[{"label":"重要事項の説明の時期を判断する（○×）","question":"次の文が正しければ○、誤っていれば×を選んでください。「宅地建物取引業者が仲介する不動産の売買では、売買契約を結んだ後に、宅地建物取引士が買主に重要事項を説明する。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"契約を結んだ後では、買主は内容を知らないまま契約したことになる。説明は契約の前にする。"},{"key":"×","text":"誤っている","correct":true,"reason":"重要事項の説明は、売買契約が成立するまでの間（契約の前）にする。"}],"steps":[{"title":"重要事項の説明の決まりを整理する","formula":"だれが：宅地建物取引士\nだれに：買主\nいつ：契約の前","body":"重要事項の説明は、買主が内容を知ったうえで契約するかどうかを決められるようにするためのものです。"},{"title":"文と照らし合わせる","formula":"文：契約を結んだ後\n決まり：契約の前","body":"時期が決まりと合わないので、×です。"}]},{"label":"売主から手付で契約を解除する","question":"買主Fさんは、売主Gさんと土地の売買契約を結び、解約手付として手付金200万円を払いました。Fさんはまだ契約の実行に取りかかっていません。この時点でGさんが手付によって契約を解除するには、どうすればよいでしょうか。次のア〜ウから1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"受け取った200万円を、Fさんに返す","correct":false,"reason":"受け取った額を返すだけでは、売主は何も失わない。売主が解除するには、手付金の倍の額を差し出す。"},{"key":"イ","text":"400万円を、Fさんに差し出す","correct":true,"reason":"売主は、手付金200万円の2倍の400万円を買主に差し出して、契約を解除できる。"},{"key":"ウ","text":"受け取った200万円を放棄する","correct":false,"reason":"手付金を放棄して解除するのは、手付金を払った買主のほう。"}],"steps":[{"title":"解除する人と、相手の状況を確かめる","formula":"解除する人：売主のGさん\n相手：買主のFさん → まだ契約の実行に取りかかっていない","body":"相手が契約の実行に取りかかる前なので、手付による解除ができます。"},{"title":"売主が差し出す額を求める","formula":"2000000 × 2 = 4000000","body":"売主は手付金の2倍の額を差し出します。正しいのはイです。"}]},{"label":"長期譲渡所得か短期譲渡所得かを判定する","question":"Hさんは、2021年3月10日に買った土地を、2026年6月20日に売って利益が出ました。この利益は、長期譲渡所得と短期譲渡所得のどちらになるでしょうか。","answer":"短期譲渡所得","alternatives":[{"try":"長期譲渡所得（買った日から売った日までが、5年3か月余りある）","why_not":"持っていた期間は、売った日までではなく、売った年の1月1日の時点で数えます。2026年1月1日の時点では、4年9か月余りです。"}],"steps":[{"title":"持っていた期間を数える基準の日を決める","formula":"売った日：2026年6月20日\n基準の日：売った年の1月1日 → 2026年1月1日","body":"長期か短期かは、売った日ではなく、売った年の1月1日の時点の期間で決まります。"},{"title":"買った日から基準の日までの期間を数える","formula":"2021年3月10日 → 2026年3月10日で5年\n2026年1月1日は、その日より前","body":"5年がたつのは2026年3月10日です。2026年1月1日の時点では、まだ5年に届かず、4年9か月余りです。"},{"title":"5年を超えるかどうかで判定する","formula":"5年を超える：長期譲渡所得\n5年以下：短期譲渡所得\nHさん：4年9か月余り → 5年以下","body":"短期譲渡所得です。2027年に売っていれば、2027年1月1日の時点で5年を超えるので、長期譲渡所得になります。"}]},{"label":"場面と税金の組み合わせを選ぶ","question":"不動産の取引と税金について、場面と税金の組み合わせが正しいものを、次のア〜ウから1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"買った土地の持ち主を登記するとき：登録免許税","correct":true,"reason":"登録免許税は、登記をするときにかかる。"},{"key":"イ","text":"建物を持っている間、毎年：不動産取得税","correct":false,"reason":"不動産取得税は、不動産を取得したときに一度かかる。毎年かかるのは固定資産税（地域によって都市計画税も）。"},{"key":"ウ","text":"土地を売って利益が出たとき：固定資産税","correct":false,"reason":"売って利益が出たときは、譲渡所得として所得税と住民税がかかる。固定資産税は持っている間に毎年かかる。"}],"steps":[{"title":"場面ごとの税金を整理する","formula":"買うとき：不動産取得税、登録免許税、印紙税\n持っている間：固定資産税、都市計画税\n売って利益が出たとき：所得税、住民税","body":"税金は、買うとき、持っている間、売るときの三つの場面に分けて覚えます。"},{"title":"選択肢の場面と税金を照らし合わせる","formula":"ア：登記 → 登録免許税で正しい\nイ：毎年 → 固定資産税なので誤り\nウ：売って利益 → 所得税と住民税なので誤り","body":"正しいのはアです。"}]}]},"sources":[{"title":"e-Gov法令検索 民法（第557条）","url":"https://laws.e-gov.go.jp/law/129AC0000000089","checked_at":"2026-10-16"},{"title":"e-Gov法令検索 宅地建物取引業法（第35条）","url":"https://laws.e-gov.go.jp/law/327AC1000000176","checked_at":"2026-10-16"},{"title":"国税庁 タックスアンサー No.3202 譲渡所得の計算のしかた（分離課税）","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3202.htm","checked_at":"2026-10-16"}]},"fp3-risk":{"id":"fp3-risk","name":"保険の種類と保障額","type":"learn","goal":"保険の種類と役割を区別し、必要保障額と、損害保険の比例てん補による保険金を計算できる。","part_of":"fp3","tags":["fp-risk"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"リスク管理は、病気、事故、死亡などで生じる損失に、あらかじめ備えることです。損失への備え方には、危険な行動をやめる（回避）、損失を小さくする（軽減）、保険などで損失を他に移す（移転）、自分で負担する（保有）があります。保険は、移転の代表です。保険は大きく、人の生死に備える生命保険、物の損害に備える損害保険、病気やけがに備える医療保険などの第三分野の保険に分かれます。生命保険では、亡くなったときに家族に必要なお金（必要保障額）を見積もって、保障の大きさを決めます。","example":"定期保険：決めた期間だけ死亡を保障／終身保険：一生涯死亡を保障／養老保険：期間中の死亡か満期で同じ額を支払う\n必要保障額 = 遺族に必要な支出の総額 −（遺族の収入の見込み + 今ある貯蓄など）の総額\n比例てん補の保険金 = 損害額 × 保険金額 ÷ 保険価額\n例　保険価額1,000万円の物（住宅の火災保険ではないもの）に保険金額500万円をかけ、損害額100万円のとき：100 × 500 ÷ 1000 = 50","note":"例の単位は万円です。保険価額は、保険をかける物の値打ち、保険金額は、契約で決めた支払いの上限です。保険金額が保険価額より少ない保険を一部保険といい、損害額の一部しか支払われないことがあります。住宅の火災保険などでは、保険価額の80%を基準にする式（損害額 × 保険金額 ÷（保険価額 × 80%））が使われ、保険金額が保険価額の80%以上なら、保険金額を上限に損害額の全額が支払われます。実際の支払い方は、契約の内容によって違います。この単元の練習では、問題文に示した式で計算します。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"損失への備え方のうち、「保険に入る」はどれにあたるでしょうか。","options":["移転","回避","保有"],"answer":0,"explanation":"保険に入ると、損失を保険会社に移すことになるので、移転です。回避は、危険な行動そのものをやめることです。保有は、損失を自分で負担することです。"},"practice":{"title":"必要保障額と保険金を計算し、保険の種類を区別する","lead":"何から何を引くか、何に対する割合かを先に決める。本試験は選択式です。ここでは解き方を身につけるために、金額を直接答える問題もあります。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"必要保障額を求める","question":"会社員のAさんが今亡くなった場合、家族に必要な支出の総額は9,000万円と見積もられました。一方、遺族年金などの収入の見込みの総額は5,500万円、今ある貯蓄は1,000万円です。Aさんの必要保障額はいくらでしょうか。","answer":"2,500万円","alternatives":[{"try":"3,500万円（貯蓄を引かずに 9,000 − 5,500）","why_not":"今ある貯蓄も、家族が使えるお金です。収入の見込みに貯蓄を加えてから、支出から引きます。"}],"steps":[{"title":"家族が使えるお金の総額を求める","formula":"5500 + 1000 = 6500","body":"遺族年金などの収入の見込みと、今ある貯蓄を合わせます。単位は万円です。"},{"title":"支出の総額から、使えるお金の総額を引く","formula":"9000 − 6500 = 2500","body":"足りない2,500万円が、保険などで備えるべき必要保障額です。"}]},{"label":"一部保険の保険金を求める","question":"保険価額2,000万円の建物に、保険金額1,200万円の損害保険をかけています。火災で500万円の損害が出ました。保険金が比例てん補（損害額 × 保険金額 ÷ 保険価額）で支払われるとき、保険金はいくらでしょうか。","answer":"300万円","alternatives":[{"try":"375万円（保険価額の80%を基準にする式で、500 × 1200 ÷ (2000 × 0.8)）","why_not":"住宅の火災保険などで使われる式です。この問題は、80%を使わない比例てん補（損害額 × 保険金額 ÷ 保険価額）で支払われると指定しているので、300万円が答えです。試験では、どちらの式かを問題文や保険の種類から読み取ります。"},{"try":"500万円（損害額がそのまま支払われる）","why_not":"保険金額が保険価額より少ない一部保険なので、損害額のうち、保険金額が保険価額に占める割合だけが支払われます。"}],"steps":[{"title":"保険金額が保険価額に占める割合を求める","formula":"1200 ÷ 2000 = 0.6","body":"建物の値打ちの6割にあたる保険をかけています。"},{"title":"損害額に割合をかける","formula":"500 × 0.6 = 300","body":"単位は万円です。保険金は300万円です。"}]},{"label":"保障の続く期間で、生命保険を区別する","question":"保障が一生涯続き、亡くなったときに死亡保険金が支払われる生命保険はどれでしょうか。次のア〜ウから1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"定期保険","correct":false,"reason":"定期保険は、10年や60歳までなど、決めた期間だけ死亡を保障する保険です。期間が終わると保障はなくなります。"},{"key":"イ","text":"終身保険","correct":true,"reason":"終身保険は、死亡の保障が一生涯続く保険です。"},{"key":"ウ","text":"養老保険","correct":false,"reason":"養老保険は、決めた期間の間に亡くなれば死亡保険金、期間の終わりまで生きていれば同じ額の満期保険金が支払われる保険です。保障は一生涯ではありません。"}],"steps":[{"title":"保障がいつまで続くかで分ける","formula":"決めた期間だけ：定期保険、養老保険\n一生涯：終身保険","body":"問題文の「一生涯続く」に当てはまるのは、終身保険だけです。"},{"title":"期間のある二つの違いを確かめる","formula":"定期保険：期間の終わりまで生きていても、お金は支払われない\n養老保険：期間の終わりまで生きていれば、満期保険金が支払われる","body":"どちらも保障は期間で終わるので、問題の答えにはなりません。"}]}]},"sources":[{"title":"e-Gov法令検索 保険業法（第3条：生命保険・損害保険・第三分野の区分）","url":"https://laws.e-gov.go.jp/law/407AC0000000105","checked_at":"2026-10-15"}]},"fp3-social":{"id":"fp3-social","name":"社会保険と公的年金","type":"learn","goal":"社会保険の種類を挙げられ、公的医療保険と公的年金の仕組みを説明でき、国民年金の被保険者の種類と、公的年金の給付の種類を区別できる。","part_of":"fp3","tags":["fp-life"],"status":"verified","concept":{"reviewed_at":"2026-10-15","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と確認問題を、厚生労働省、日本年金機構、金融庁、国税庁、e-Gov法令検索などの公的な資料と照合。確認問題は独立に解き、正答が一つに決まるかを別の読みで試した。指摘を反映した後に再検証。","text":"社会保険は、病気、けが、老後、失業などに備えて、国などが運営する保険です。医療保険、介護保険、年金保険、雇用保険、労災保険（労働者災害補償保険）があります。公的医療保険は、会社員などは勤め先の健康保険、自営業者などは国民健康保険に入り、75歳以上は後期高齢者医療制度に入ります。病院の窓口で払う医療費は、70歳未満なら原則3割です。1か月の自己負担が一定の額を超えると、超えた分が払い戻される高額療養費制度があります。公的年金は、日本に住む20歳以上60歳未満の人と、会社員や公務員が入る国民年金（基礎年金）と、会社員や公務員が上乗せで入る厚生年金の、2階建ての仕組みです。保険に入っている人を被保険者、収入が少なく家族に生活を支えられていることを、扶養されているといいます。給付には、年をとったときの老齢年金、障害を負ったときの障害年金、亡くなったときに家族が受け取る遺族年金があります。老齢年金は原則65歳から受け取り、60歳から75歳までの間で、受け取り始める時期を早めたり遅らせたりできます。","example":"国民年金の被保険者\n第1号：自営業者や学生など\n第2号：会社員や公務員\n第3号：第2号に扶養されている配偶者（20歳以上60歳未満）\n公的年金の給付：老齢、障害、遺族","note":"保険料や年金の金額は年度ごとに変わるので、ここでは扱いません。受け取り始める時期を早めると年金額は減り、遅らせると増えます。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明と確認問題で使う知識を洗い出し、この単元の説明か前提の到達条件に収まるか、必須の前提が実際に使われているか、下流の学科試験の到達点が範囲を超えて使っていないかを照合。学習時間は、FP3級の単元どうしの釣り合いとの比較だけで、実測ではない。練習ページは2026-10-16に作り、別の実行で検証した。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"会社員（厚生年金の加入者）に扶養されている、20歳以上60歳未満の配偶者は、国民年金の第何号被保険者でしょうか。","options":["第3号被保険者","第1号被保険者","第2号被保険者"],"answer":0,"explanation":"会社員（第2号被保険者）に扶養されている20歳以上60歳未満の配偶者は、第3号被保険者です。第1号は自営業者や学生など、第2号は会社員や公務員本人です。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを、単元で扱わない特例（住宅取得等資金、65歳以上の会社員）も当てて確認。制度は国税庁・日本年金機構の資料で、2026年の現行制度として確認。指摘を反映した後に再検証。","title":"被保険者の種類と給付を見分け、窓口の負担と繰下げの年金額を計算する","lead":"誰が、どの制度に、どの立場で入っているかを先に決める。本試験の学科は○×式と三答択一式です。ここでも同じ形で問い、計算の問題だけは解き方を身につけるために金額を直接答えます。保険料や年金の額は年度で変わるので、問題の金額は仮のものです。","original":true,"problems":[{"label":"○×：自営業者の配偶者の種別","question":"次の文が正しければ○、誤っていれば×を選んでください。「自営業者（国民年金の第1号被保険者）に扶養されている、20歳以上60歳未満の配偶者は、国民年金の第3号被保険者である。」","answer":"×","kind":"choice","options":[{"key":"○","text":"正しい","correct":false,"reason":"第3号被保険者になるのは、第2号被保険者（会社員や公務員）に扶養されている配偶者だけです。扶養している人が自営業者なので、当てはまりません。"},{"key":"×","text":"誤り","correct":true,"reason":"自営業者に扶養されている20歳以上60歳未満の配偶者は、自営業者本人と同じ第1号被保険者です。"}],"steps":[{"title":"扶養している人の種別を確かめる","formula":"扶養している人：自営業者 → 第1号被保険者","body":"第3号かどうかは、配偶者を扶養している人が第2号（会社員や公務員）かどうかで決まります。"},{"title":"配偶者の種別を決める","formula":"第2号に扶養されている → 第3号\nそれ以外の、20歳以上60歳未満の自営業者の家族など → 第1号","body":"扶養している人が第1号なので、配偶者は第3号ではなく第1号です。文は誤りで、答えは×です。"}]},{"label":"○×：会社員と国民年金","question":"次の文が正しければ○、誤っていれば×を選んでください。「65歳未満の会社員として厚生年金に加入している人は、同時に国民年金にも加入している。」","answer":"○","kind":"choice","options":[{"key":"○","text":"正しい","correct":true,"reason":"公的年金は2階建てで、1階の国民年金（基礎年金）の上に、2階の厚生年金が乗ります。会社員は国民年金の第2号被保険者として、両方に入っています。"},{"key":"×","text":"誤り","correct":false,"reason":"厚生年金は国民年金の代わりではなく、上乗せです。会社員も1階の国民年金に入っています。"}],"steps":[{"title":"2階建ての形を思い出す","formula":"2階：厚生年金（会社員や公務員）\n1階：国民年金（20歳以上60歳未満の人と、会社員や公務員）","body":"厚生年金は、国民年金に上乗せして入る制度です。"},{"title":"会社員がどの階に入っているかを決める","formula":"会社員：1階（第2号被保険者）と2階の両方","body":"会社員は、厚生年金に入ることで、国民年金にも第2号被保険者として入っています。第2号には、20歳以上60歳未満という年齢の枠はありません（65歳以上で老齢年金を受け取る権利がある人は、第2号から外れます）。文は65歳未満の会社員の話なので正しく、答えは○です。"}]},{"label":"病院の窓口で払う額","question":"45歳の会社員Bさんが病院で診察を受け、医療費の総額は1万円でした。Bさんが病院の窓口で払う額はいくらでしょうか。次のア〜ウから1つ選んでください。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"3,000円","correct":true,"reason":"70歳未満の窓口の負担は原則3割なので、10000 × 0.3 = 3000円です。"},{"key":"イ","text":"1,000円","correct":false,"reason":"医療費の1割にあたる額です。45歳のBさんの負担は1割ではありません。"},{"key":"ウ","text":"7,000円","correct":false,"reason":"医療費のうち、Bさんが入っている健康保険から病院に支払われる7割の分です。Bさんが払う分ではありません。"}],"steps":[{"title":"負担の割合を決める","formula":"45歳（70歳未満）→ 原則3割","body":"Bさんは70歳未満なので、窓口で払うのは医療費の3割です。"},{"title":"医療費の総額にかける","formula":"10000 × 0.3 = 3000","body":"窓口で払うのは3,000円です。残りの7,000円は健康保険から支払われます。"}]},{"label":"公的年金の給付を見分ける","question":"国民年金の第1号被保険者として保険料を納めている自営業者のCさん（40歳）が、病気で、法律で決められた程度の障害の状態になりました。受け取るための保険料の条件は満たしています。Cさん本人が受け取れる公的年金の給付はどれでしょうか。次のア〜ウから1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"遺族基礎年金","correct":false,"reason":"遺族年金は、加入者などが亡くなったときに、その家族が受け取る給付です。Cさんは亡くなっていません。"},{"key":"イ","text":"障害基礎年金","correct":true,"reason":"障害の状態になったときに本人が受け取るのは障害年金です。Cさんは国民年金だけに入っているので、国民年金（基礎年金）の障害年金を受け取ります。"},{"key":"ウ","text":"老齢基礎年金","correct":false,"reason":"老齢年金は、年をとったときの給付で、原則65歳から受け取ります。40歳のCさんが障害を理由に受け取るものではありません。"}],"steps":[{"title":"何が起きたかで、給付の種類を決める","formula":"年をとった：老齢\n障害の状態になった：障害\n亡くなった：遺族","body":"Cさんに起きたのは障害なので、障害年金です。"},{"title":"どの階の給付かを決める","formula":"自営業者（第1号）→ 1階の国民年金（基礎年金）だけ","body":"Cさんは厚生年金に入っていないので、受け取るのは国民年金の障害年金、つまり障害基礎年金です。"}]},{"label":"受け取りを遅らせた年金額を求める","question":"65歳から受け取ると年80万円の老齢基礎年金を、受け取り始めを65歳から5年遅らせて、70歳から受け取ることにしました。遅らせた1か月につき0.7%増えるとき、70歳から受け取る年金額は1年あたりいくらでしょうか。年金額は1年を通して変わらないものとします。","answer":"113.6万円","alternatives":[{"try":"82.8万円（5年 × 0.7% = 3.5%増やす）","why_not":"0.7%は、1年ではなく1か月あたりの増え方です。年数ではなく、月数をかけます。"},{"try":"33.6万円（増える分だけを答える：80 × 0.42）","why_not":"33.6万円は、増える分だけです。問われているのは70歳から受け取る年金額なので、元の80万円に増える分を足します。"},{"try":"46.4万円（80万円から42%減らす）","why_not":"受け取り始めを早めると減り、遅らせると増えます。遅らせたので、増やします。"}],"steps":[{"title":"遅らせた月数を求める","formula":"5 × 12 = 60","body":"5年は60か月です。"},{"title":"増える割合を求める","formula":"60 × 0.7 = 42","body":"1か月につき0.7%なので、60か月で42%増えます。"},{"title":"65歳から受け取るときの額にかける","formula":"80 × 1.42 = 113.6","body":"元の額の100%に42%を足した142%、つまり1.42倍です。単位は万円で、1年あたり113.6万円です。"}]}]},"sources":[{"title":"日本年金機構 年金の繰下げ受給","url":"https://www.nenkin.go.jp/service/jukyu/seido/roureinenkin/kuriage-kurisage/20140421-02.html","checked_at":"2026-10-16"},{"title":"日本年金機構 国民年金の「第1号被保険者」、「第3号被保険者」とは何ですか","url":"https://www.nenkin.go.jp/section/faq/kokunen/seido/kanyu/seidosetsumei/20140602-01.html","checked_at":"2026-10-16"}]},"fp3-tax":{"id":"fp3-tax","name":"所得税の計算","type":"learn","goal":"所得の種類を区別でき、課税所得金額から所得税額を求められる。","part_of":"fp3","tags":["fp-tax"],"status":"verified","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・制度の数字・具体例を一行ずつ確認し、国税庁、e-Gov法令検索、法務省、金融庁、試験団体の資料と照合。単元の到達条件・確認問題・練習問題とも照合。指摘を反映した後に再検証。","text":"所得税は、個人が1月1日から12月31日までの1年間に得た所得にかかる国の税金です。所得は、利子、配当、不動産、事業、給与、退職、山林、譲渡、一時、雑の10種類に分けられ、種類ごとに計算のしかたが決まっています。退職所得などの一部の所得を除いて所得を合計し、所得控除（基礎控除や社会保険料控除など）を引いた残りを、課税所得金額といいます。課税所得金額に税率をかけて税額を出し、税額控除（住宅ローン控除など）を引きます。所得税の税率は、所得が多いほど高くなる超過累進税率で、高い税率がかかるのは、その段階を超えた部分だけです。速算表を使うと、課税所得金額 × 税率 − 控除額 の一回の計算で、段階ごとに計算したのと同じ税額が出ます。","example":"計算の流れ：各種の所得 → 合計 → 所得控除を引く → 課税所得金額 → 税率をかける → 税額控除を引く\n例　課税所得金額150万円の所得税（税率5%、控除額0円）：1500000 × 0.05 = 75000","note":"ここでは、所得税に上乗せされる復興特別所得税（2027年分から1.1%）と防衛特別所得税は考えません。退職所得、山林所得、一部の譲渡所得は、ほかの所得と分けて計算します。所得控除の金額は改正で変わるので、受検する回の法令基準日（試験問題の前提になる法令の日付）の内容で確かめてください。"},"review":{"checked_at":"2026-10-15","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。1回目に「名前と学習時間が試験の分野まるごとで、中身は一部だけ」と指摘され、名前と到達条件を中身に合わせて狭め、時間を下げて再検証。学習時間は、単元どうしの釣り合いと対策講座の目安(FP3級全体で80〜150時間)との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"所得税で、所得が多いほど高い税率になり、高い税率がその段階を超えた部分だけにかかる仕組みを何というでしょうか。","options":["超過累進税率","比例税率","軽減税率"],"answer":0,"explanation":"所得税の税率は超過累進税率です。比例税率は、所得の大きさにかかわらず同じ税率をかける仕組みです。軽減税率は、消費税で食料品などの税率を下げる仕組みで、所得税の仕組みではありません。"},"practice":{"title":"所得税の計算の流れをたどり、税額を求める","lead":"税率は、その段階を超えた部分だけにかかる。本試験は選択式です。ここでは解き方を身につけるために、金額を直接答える問題もあります。","original":true,"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、別解と選択肢の理由、全段階の式・説明、前提の範囲、試験の形との差、制度の事実を公的な資料で確認。指摘を反映した後に再検証。","problems":[{"label":"速算表で所得税額を求める","question":"課税所得金額が500万円の人の所得税額を、表の速算表を使って求めてください。復興特別所得税と税額控除は考えません。","answer":"572,500円","tables":[{"caption":"所得税の速算表","rows":[["課税所得金額","税率","控除額"],["195万円以下","5%","0円"],["195万円を超え330万円以下","10%","97,500円"],["330万円を超え695万円以下","20%","427,500円"],["695万円を超え900万円以下","23%","636,000円"],["900万円を超え1,800万円以下","33%","1,536,000円"],["1,800万円を超え4,000万円以下","40%","2,796,000円"],["4,000万円超","45%","4,796,000円"]]}],"alternatives":[{"try":"1,000,000円（500万円 × 20% で、控除額を引かない）","why_not":"20%がかかるのは330万円を超えた部分だけです。500万円の全部に20%をかけると、低い段階の部分まで高い税率で計算したことになります。その払いすぎの分を引くのが、控除額です。"}],"steps":[{"title":"課税所得金額が入る段階を探す","formula":"500万円は、330万円を超え695万円以下の段階\n税率：20%、控除額：427,500円","body":"速算表の行を上から見て、500万円が入る行を探します。"},{"title":"課税所得金額に税率をかけ、控除額を引く","formula":"5000000 × 0.2 − 427500 = 572500","body":"所得税額は572,500円です。"}]},{"label":"段階ごとに計算して、速算表と比べる","question":"課税所得金額が500万円の人の所得税額を、速算表を使わずに、税率の段階ごとに分けて計算してください。段階は、195万円以下が5%、195万円を超え330万円以下が10%、330万円を超え695万円以下が20%です。復興特別所得税と税額控除は考えません。","answer":"572,500円","alternatives":[{"try":"842,500円（20%の段階に入る部分を、500万円 − 195万円 = 305万円と数える）","why_not":"20%がかかるのは、330万円を超えた部分の170万円だけです。195万円を超え330万円以下の135万円は、10%の段階なので、20%の部分に重ねて数えると税額が多くなります。"}],"steps":[{"title":"500万円を、段階ごとの部分に分ける","formula":"195万円以下の部分：1950000\n195万円を超え330万円以下の部分：3300000 − 1950000 = 1350000\n330万円を超えた部分：5000000 − 3300000 = 1700000","body":"三つの部分を足すと、500万円になります。"},{"title":"部分ごとに、その段階の税率をかける","formula":"1950000 × 0.05 = 97500\n1350000 × 0.1 = 135000\n1700000 × 0.2 = 340000","body":"それぞれの部分には、その段階の税率だけをかけます。"},{"title":"部分ごとの税額を足す","formula":"97500 + 135000 + 340000 = 572500","body":"所得税額は572,500円で、速算表で計算した額と同じになります。速算表の控除額は、この段階ごとの計算を一回にまとめるための数です。"}]},{"label":"収入を所得の種類に分ける","question":"次のア〜ウのうち、収入と所得の種類の組み合わせが正しいものを1つ選んでください。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"会社員が勤め先から受け取った賞与：一時所得","correct":false,"reason":"勤め先から受け取る給料や賞与は、給与所得。"},{"key":"イ","text":"所有するアパートの家賃収入：不動産所得","correct":true,"reason":"土地や建物を貸して得る収入は、不動産所得。"},{"key":"ウ","text":"自分で保険料を払った生命保険の満期保険金を、一度にまとめて受け取ったもの：雑所得","correct":false,"reason":"保険料を払った本人が満期保険金を一時金で受け取ると、一時所得。年金の形で分けて受け取ると、雑所得になる。"}],"steps":[{"title":"収入が、何の対価かを考える","formula":"ア：働いたことの対価 → 給与所得\nイ：建物を貸したことの対価 → 不動産所得\nウ：自分で払った保険の満期金を一度に受け取る → 一時所得","body":"所得の種類は、収入の名前ではなく、何によって得たお金かで決まります。"},{"title":"選択肢の組み合わせと照らし合わせる","formula":"ア：給与所得なので、一時所得は誤り\nイ：不動産所得で、正しい\nウ：一時所得なので、雑所得は誤り","body":"正しい組み合わせはイです。"}]}]},"sources":[{"title":"国税庁 タックスアンサー No.2260 所得税の税率","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2260.htm","checked_at":"2026-10-14"},{"title":"国税庁 タックスアンサー No.1300 所得の区分のあらまし","url":"https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1300.htm","checked_at":"2026-10-14"}]},"fp3":{"id":"fp3","name":"FP3級","type":"target","goal":"3級ファイナンシャル・プランニング技能検定の学科試験と、選んだ実技試験の範囲を学び、過去問で演習を始める。","part_of":"fp3","status":"draft","featured":true,"scope_note":"6分野の代表的な考え方と計算への学習経路です。試験範囲のすべてを網羅するものではありません。税や社会保険の金額は改正で変わるので、受検する回の法令基準日の内容で確かめてください。実技試験は3科目から1つを選びます。どの実技も学科試験の範囲から出題されるので、この木では、実技の前提を学科試験にしています。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-14","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"試験時間、問題数、合格基準、実技の科目と団体、CBT方式、受検資格、一部合格の免除を、日本FP協会ときんざいの試験要綱・試験範囲のページと照合。指摘を反映した後に再検証。","text":"3級ファイナンシャル・プランニング技能検定（FP3級）は、国家検定です。日本FP協会と金融財政事情研究会（きんざい）の二つの団体が実施していて、学科試験は共通、実技試験は団体ごとに違う科目を選びます。学科試験と実技試験の両方に合格すると、3級FP技能士になります。学科試験の範囲は、ライフプランニングと資金計画、リスク管理、金融資産運用、タックスプランニング、不動産、相続・事業承継の6分野です。2024年度から、全国のテストセンターで、休止期間を除いていつでも受けられるCBT方式（コンピューターで受ける試験）になっています。","example":"学科試験：90分・60問（○×式と三答択一式）・60点満点のうち36点以上で合格\n実技試験（日本FP協会）：資産設計提案業務。60分・20問・100点満点のうち60点以上\n実技試験（きんざい）：個人資産相談業務か保険顧客資産相談業務。60分・5題・50点満点のうち30点以上","note":"受検資格は「FP業務に従事している者または従事しようとしている者」です。学科試験か実技試験の片方だけ合格した場合は、合格した試験実施日の翌々年度末まで、その試験が免除されます。数字は試験要綱で2026-10-14に確認しました。"},"cost":{"hours":0,"yen":0},"requires":[{"id":"fp3-gakka","level":"must"},{"id":"fp3-jitsugi-kyokai","level":"must","group":"実技試験","note":"日本FP協会。6分野から、20問の多肢選択式"},{"id":"fp3-jitsugi-kojin","level":"must","group":"実技試験","note":"きんざい。金融資産、不動産、相続などの事例を5題"},{"id":"fp3-jitsugi-hoken","level":"must","group":"実技試験","note":"きんざい。保険を中心にした事例を5題"}],"sources":[{"title":"日本FP協会：3級ファイナンシャル・プランニング技能検定（資産設計提案業務）試験要綱","url":"https://www.jafp.or.jp/exam/app/howto/files/outline_3fp.pdf","checked_at":"2026-10-14"},{"title":"金融財政事情研究会：ファイナンシャル・プランニング技能検定3級 試験要綱","url":"https://www.kinzai.or.jp/ginou/fp/3kyu/index.html","checked_at":"2026-10-14"},{"title":"金融財政事情研究会：ファイナンシャル・プランニング技能検定 試験科目及びその範囲","url":"https://www.kinzai.or.jp/fp/fp_specifications.html","checked_at":"2026-10-14"}]},"gab":{"id":"gab","name":"GAB","type":"target","goal":"GABの計数と言語の形式を学び、受ける方式に合う問題集で時間を計った演習を始める。","part_of":"tamatebako","status":"draft","featured":true,"scope_note":"計数と言語への学習経路です。英語と性格検査は未収録です。この木の図表の読み取りは、表と、棒グラフ・折れ線グラフの問題だけです。GABには、会場で紙で受ける方式、自宅のパソコンで受けるWeb-GAB、テストセンターで受けるC-GABがあり、出る科目や電卓を使えるかが方式で違うとされます。企業の受検案内で方式を確かめてください。問題数と制限時間は、公式の資料ではなく、就職情報サイトの記述によります。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"方式、科目、形式、問題数と制限時間、電卓の扱い、玉手箱との関係を、就職情報サイトの三つの記述と照合（公式の資料は取得できなかった）。紙のGABで電卓を使えるかは資料で食い違うので、方式で違うとだけ書いた。","text":"GABは、日本エス・エイチ・エルの適性検査で、総合職の採用選考などで使われています。能力検査は、計数と言語（方式によっては英語）からなり、性格検査もあります。計数は図表の読み取り、言語は論理的読解（本文から、設問の文が明らかに正しいか、明らかに誤りか、判断できないかを選ぶ形）で、同じ会社の玉手箱の図表の読み取り、論理的読解（GAB形式）と、内容はほぼ同じとされます。玉手箱と違い、計数と言語の形式は一つずつに決まっています。","example":"計数：図表の読み取り（表やグラフから、割合や増加率などを求めて選ぶ）\n言語：論理的読解（A・B・C の三択）\n例　Web-GABは、就職情報サイトでは計数40問を35分、言語52問を25分とされる","note":"受ける方式によって、電卓を使えるかが違うとされます。使えない方式では、概算で選択肢をしぼる練習が、より大切になります。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"tama-charts","level":"must"},{"id":"tama-logic","level":"must"}],"sources":[{"title":"就活の教科書：GAB/Web-GABの練習問題と対策（方式、科目、問題数と制限時間）","url":"https://reashu.com/gab-taisaku","checked_at":"2026-10-16"}]},"hs-data":{"id":"hs-data","name":"データの分析","type":"learn","goal":"四分位数、分散、相関を求めて、データの傾向を説明できる。","part_of":"hs-math","tags":["math1","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たくさんの数値からなるデータの特徴を、いくつかの数で要約する方法を学びます。四分位数は、データを小さい順に並べて4等分する位置の値で、散らばりの様子を箱ひげ図で表すのに使います。分散は、各値と平均値との差を2乗して平均した値で、その正の平方根を標準偏差といいます。どちらも、値が大きいほど散らばりが大きいことを表します。相関は、二つのデータの間に「一方が大きいほど他方も大きい（または小さい）」という傾向があるかどうかを表します。","example":"データ：2、4、4、6、9\n平均値：(2 + 4 + 4 + 6 + 9) ÷ 5 = 5\n平均値との差の2乗：9、1、1、1、16\n分散：(9 + 1 + 1 + 1 + 16) ÷ 5 = 5.6\n標準偏差：√5.6（約2.4）\n第1四分位数：(2 + 4) ÷ 2 = 3\n第3四分位数：(6 + 9) ÷ 2 = 7.5","note":"中央値（第2四分位数）は真ん中の4です。その前半2、4と後半6、9のそれぞれの中央値が、第1・第3四分位数です。相関は、散布図にかくと傾向を目で確かめられます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-average","level":"must"},{"id":"math-negative","level":"must"}]},"hs-expressions":{"id":"hs-expressions","name":"数と式","type":"learn","goal":"式の展開と因数分解、一次不等式ができる。","part_of":"hs-math","tags":["math1","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文字を含む式を、計算の規則に従って別の形に書き直すことを学びます。展開は、かっこのついた積の形をばらして和の形にすることです。因数分解はその逆で、和の形をいくつかの式の積の形にまとめることです。不等式は、二つの式の大小を不等号（＞、＜、≧、≦）で表した式で、方程式と同じように変形して解きます。ただし、両辺に負の数をかけたり、負の数で割ったりすると、不等号の向きが逆になります。","example":"展開：(x + 2)(x + 3) = x² + 5x + 6\n因数分解：x² + 5x + 6 = (x + 2)(x + 3)\n一次不等式：−2x + 1 ＞ 7\n　−2x ＞ 6\n　x ＜ −3","note":"最後の行では両辺を−2で割ったので、不等号の向きが逆になっています。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-linear-eq","level":"must"}]},"hs-quadratic":{"id":"hs-quadratic","name":"二次関数の応用","type":"learn","goal":"二次関数の最大と最小を求め、二次不等式を解ける。","part_of":"hs-math","tags":["math1","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二次関数 y = ax² + bx + c は、y = a(x − p)² + q の形に変形（平方完成）すると、グラフの頂点が点（p, q）にある放物線だとわかります。a が正なら頂点で y は最小になり、a が負なら頂点で最大になります。x の範囲が限られているときは、範囲の両端での値と、頂点が範囲の中にあれば頂点での値を比べて、最大と最小を決めます。二次不等式は、グラフが x 軸より上にあるか下にあるかを読み取って解きます。","example":"y = x² − 4x + 3 = (x − 2)² − 1\n頂点は点（2, −1）、最小値は −1（x = 2 のとき）\n二次不等式：x² − 4x + 3 ＜ 0\n　(x − 1)(x − 3) ＜ 0\n　1 ＜ x ＜ 3","note":"グラフが x 軸より下にあるのは、x 軸と交わる1と3の間です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-quadratic-fn","level":"must"},{"id":"hs-expressions","level":"must"}]},"hs-trig":{"id":"hs-trig","name":"三角比","type":"learn","goal":"正弦、余弦、正接を使って、辺の長さや面積を求められる。","part_of":"hs-math","tags":["math1","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形では、直角以外の一つの角 θ の大きさが決まると、三角形の大きさに関係なく、辺の長さの比が決まります。この比を三角比といいます。斜辺に対する「θ の向かいの辺」の比を sin θ（サイン、正弦）、斜辺に対する「θ のとなりの辺」の比を cos θ（コサイン、余弦）、となりの辺に対する向かいの辺の比を tan θ（タンジェント、正接）といいます。角と一辺の長さがわかれば、ほかの辺の長さを求められます。また、二辺の長さとその間の角がわかれば、三角形の面積を「1/2 × 二辺の積 × sin（間の角）」で求められます。数Iでは、三角比を90°より大きく180°までの角にも広げます。","example":"斜辺5、向かいの辺3、となりの辺4 の直角三角形\nsin θ = 3/5\ncos θ = 4/5\ntan θ = 3/4\n30°の三角比：sin 30° = 1/2、cos 30° = √3/2、tan 30° = 1/√3\n二辺が4と6、その間の角が30°の三角形の面積：1/2 × 4 × 6 × sin 30° = 6","note":"斜辺が10で θ が30°なら、向かいの辺は 10 × 1/2 = 5 です。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-similarity","level":"must"},{"id":"math-pythagoras","level":"must"}]},"hs2-calculus":{"id":"hs2-calculus","name":"微分・積分の考え","type":"learn","goal":"三次までの関数を微分して増減を調べ、二次までの関数を積分して面積を求められる。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"関数の値の変わり方を調べる「微分」と、その逆の計算である「積分」の基本を学ぶ単元です。関数 f(x) のグラフ上のある点での接線の傾きを、その点での微分係数といいます。x の各値に微分係数を対応させた関数を導関数といい、f′(x) と書きます。導関数の符号から、関数が増えているか減っているかがわかり、最大・最小を調べられます。積分は微分の逆の計算で、グラフと x 軸で囲まれた部分の面積を求めるのに使います。数IIでは、微分は3次まで、積分は2次までの多項式で表される関数を中心に扱います。","example":"f(x) = x² のとき f′(x) = 2x\nf(x) = x³ − 3x のとき f′(x) = 3x² − 3\n∫ 2x dx = x² + C（C は積分定数）\ny = x² と x 軸、直線 x = 3 で囲まれた部分の面積：9","note":"f(x) = x² のグラフの、x = 1 の点での接線の傾きは f′(1) = 2 です。面積の9は、x³/3 に x = 3 を入れた 27/3 = 9 から、x = 0 を入れた 0 を引いて求められます。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs-quadratic","level":"must
