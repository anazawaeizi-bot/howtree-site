<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Howtree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root {
  --ground: #F5F6F8;
  --ink: #1B1D22;
  --gray: #5A6070;
  --line: #C9CED6;
  --off: #D3D8E0;
  --red: #C9252D;
  --latin: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  font-size: 15px;
  line-height: 1.7;
}
a { color: var(--ink); }
a:hover { color: var(--gray); }
button, input { font-family: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 40px; }
.narrow { max-width: 1120px; }

/* 見出しまわり */
.hd { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 28px; }
.brand { display: inline-flex; align-items: center; gap: 16px; text-decoration: none; color: var(--ink); }
.logo { position: relative; width: 74px; height: 44px; flex: none; display: block; }
.logo i { position: absolute; display: block; background: var(--red); }
.logo .b1 { left: 10px; top: 13px; width: 34px; height: 5px; transform-origin: 0 50%; transform: rotate(14deg); }
.logo .b2 { left: 42px; top: 22px; width: 22px; height: 5px; transform-origin: 0 50%; transform: rotate(-38deg); }
.logo .c1 { left: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%; }
.logo .c2 { left: 32px; top: 13px; width: 22px; height: 22px; border-radius: 50%; }
.logo .c3 { left: 56px; top: 2px; width: 16px; height: 16px; border-radius: 50%; }
.word { font-family: var(--latin); line-height: 1.05; }
.word small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
.word b { display: block; font-size: 24px; font-weight: 700; }
.hd .right { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.link { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
.rule { width: 28px; height: 3px; background: var(--red); margin-bottom: 6px; }
h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
.sub { font-size: 13px; font-weight: 700; color: var(--gray); }
.muted { color: var(--gray); }
.foot { margin-top: 48px; padding: 10px 0 28px; border-top: 1px solid var(--line); font-family: var(--latin); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--gray); }

.band { margin-top: 24px; background: var(--red); color: #fff; padding: 28px 36px; display: flex; align-items: flex-end; gap: 24px 32px; flex-wrap: wrap; }
.band .main { flex: 999 1 380px; min-width: 0; }
.band .tag { display: inline-block; border: 1.5px solid #fff; border-radius: 3px; padding: 1px 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
.band h1 { margin: 10px 0 0; font-size: 44px; line-height: 1.2; font-weight: 900; letter-spacing: 0.04em; }
.band p { margin: 6px 0 0; font-weight: 500; }
.stats { display: flex; gap: 36px; flex-wrap: wrap; }
.stat .k { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
.stat .v { font-family: var(--latin); font-size: 56px; font-weight: 700; line-height: 1; }
.stat .v span { font-family: inherit; font-size: 16px; font-weight: 700; margin-left: 4px; }
.stat .v span.jp { font-family: 'Zen Kaku Gothic New', sans-serif; }
.badge { display: inline-block; border: 1px solid var(--ink); padding: 0 10px; font-size: 13px; font-weight: 700; }
.badge.fill { background: var(--ink); color: #fff; }

/* ボタンと札 */
.btn { min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn:hover { background: #ECEEF2; color: var(--ink); }
.btn.fill { background: var(--ink); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.big { min-height: 60px; font-size: 18px; flex: 1 1 200px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border: 1px solid var(--ink); background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }
.chip.known { background: var(--ink); color: #fff; }
.chip.helps { border-style: dashed; font-weight: 500; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; font-weight: 500; color: var(--gray); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: block; width: 18px; height: 12px; }

/* トップ */
.hero { padding-top: 72px; }
.hero form { display: flex; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }
.hero label { font-family: var(--latin); font-size: 96px; font-weight: 700; line-height: 0.9; }
.hero .field { flex: 999 1 360px; min-width: 0; display: flex; flex-wrap: wrap; }
.hero input { flex: 999 1 240px; min-width: 0; height: 64px; padding: 0 20px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 22px; font-weight: 700; }
.hero .go { flex: 1 0 auto; height: 64px; padding: 0 32px; border: 0; background: var(--red); color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer; }
.hero .lead { margin-top: 20px; font-size: 16px; font-weight: 500; color: var(--gray); }
.sec { padding-top: 56px; }
.sechead { display: flex; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.sechead .right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.goals { margin-top: 16px; border-top: 1px solid var(--ink); }
.goal { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; min-height: 64px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.goal:hover { background: #ECEEF2; color: var(--ink); }
.goal .t { flex: 1 1 200px; min-width: 0; font-size: 18px; font-weight: 700; }
.goal .g { display: block; font-size: 13px; font-weight: 500; color: var(--gray); }
.sqs { display: inline-flex; gap: 3px; flex: 0 1 260px; flex-wrap: wrap; }
.sqs i { display: block; width: 14px; height: 14px; border: 1.5px solid var(--red); background: #fff; }
.sqs i.k { border-color: var(--ink); background: var(--ink); }
.goal .n { flex: 0 0 100px; font-size: 14px; font-weight: 500; color: var(--gray); }
.goal .n b, .goal .h { font-family: var(--latin); font-weight: 700; color: var(--ink); }
.goal .n b { font-size: 22px; }
.goal .h { flex: 0 0 96px; text-align: right; font-size: 26px; line-height: 1; }
.goal .h span { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--gray); margin-left: 4px; }

/* ツリー */
.treebox { overflow-x: auto; margin-top: 8px; }
.tree { position: relative; margin: 0 auto; }
.tree svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.tree path { fill: none; stroke: var(--off); }
.tree path.must { stroke-width: 6; }
.tree path.helps { stroke-width: 2; }
.tree path.known { stroke: var(--ink); }
.tree path.path { stroke: var(--red); }
.nd { position: absolute; width: 116px; height: 46px; padding: 0 4px; border: 1px solid var(--ink); border-radius: 0; background: var(--ground); color: var(--ink); cursor: pointer; text-align: center; line-height: 1; }
.nd .t { display: block; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; }
.nd .t b { font-family: var(--latin); font-size: 16px; color: var(--red); margin-right: 4px; }
.nd .c { display: block; font-family: var(--latin); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; color: var(--gray); }
.nd.rest { background: #fff; border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.nd.known { background: var(--ink); color: #fff; }
.nd.known .c { color: #fff; }
.nd.goalnode { background: var(--red); border-color: var(--red); color: #fff; }
.nd.goalnode .c, .nd.goalnode .t b { color: #fff; }
.nd.stub { border-style: dashed; }
.nd.stub .t { font-weight: 500; }
.nd.sel { outline: 2px solid var(--ink); outline-offset: 3px; }

.region-switch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.region { position: absolute; border: 1px solid var(--gray); background: rgba(255, 255, 255, 0.6); pointer-events: none; }
.region-name { position: absolute; padding: 0 6px; background: var(--ground); color: var(--gray); font-size: 12px; font-weight: 700; line-height: 20px; letter-spacing: 0.06em; pointer-events: none; }

/* 下段 */
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px 48px; padding-top: 24px; }
.cols > div { min-width: 0; }
.steps { margin-top: 12px; border-top: 1px solid var(--ink); }
.step { width: 100%; display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font-size: 15px; text-align: left; cursor: pointer; }
.step:hover { background: #ECEEF2; }
.step .no { width: 30px; height: 30px; flex: none; background: var(--red); color: #fff; text-align: center; font-family: var(--latin); font-size: 16px; font-weight: 700; line-height: 30px; }
.step .t { flex: 1; min-width: 0; font-weight: 700; }
.step .h { font-family: var(--latin); font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: var(--gray); }
.detail h3 { margin: 12px 0 0; font-size: 26px; line-height: 1.3; font-weight: 900; letter-spacing: 0.04em; }
.detail .meta { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.detail .blk { margin-top: 16px; }
.detail .blk .btns, .detail .blk p { margin: 6px 0 0; }
.note { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--gray); }
.res { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.res .a { font-size: 13px; color: var(--gray); }
.book { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.book .cover { flex: none; width: 96px; height: 136px; border: 1px solid var(--ink); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; text-decoration: none; }
.book .cover img { width: 100%; height: 100%; object-fit: contain; }
.book .cover span { padding: 8px; font-size: 11px; font-weight: 700; line-height: 1.5; color: var(--ink); border-top: 3px solid var(--red); }
.book .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.book .info .meta { margin: 0; }
.book .t { font-size: 16px; font-weight: 700; }
.book .a { font-size: 13px; color: var(--gray); }
.book .btns { margin-top: 8px; align-items: center; gap: 16px; }

/* 診断 */
.card { border: 1px solid var(--ink); background: #fff; padding: 40px 36px; margin-top: 36px; }
.card .q { margin-top: 8px; font-size: 30px; line-height: 1.5; font-weight: 700; }
.card .btns { margin-top: 28px; gap: 12px; }
.strip { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.strip span { flex: 1 1 120px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 4px 6px; border: 1px solid var(--ink); font-size: 14px; font-weight: 700; text-align: center; }
.strip .ok { background: var(--ink); color: #fff; }
.strip .cur { background: #fff; border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.strip .far { border-color: #A9AFBA; color: #676D7A; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .band { padding: 20px; }
  .band h1 { font-size: 32px; }
  .stat .v { font-size: 40px; }
  .hero { padding-top: 40px; }
  .hero label { font-size: 64px; }
  .card { padding: 24px 20px; }
  .card .q { font-size: 22px; }
}

.review-row{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
.review-row span{display:block;color:var(--gray);font-size:13px;margin-left:24px}
.review-row input{width:18px;height:18px;accent-color:var(--red)}
summary{cursor:pointer;min-height:44px;padding-top:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.mobile-hint{display:none}
@media(max-width:640px){.treebox{max-height:360px;overflow:auto}.mobile-hint{display:block}}

.practice{max-width:960px}
.practice-heading{margin:56px 0 28px}.practice-heading h1{font-size:38px;margin:6px 0}.practice-heading p{margin:6px 0}
.concept .step-formula{font-size:17px;line-height:1.8}.practice .concept{background:#fff;border:1px solid var(--line);padding:20px 24px;margin:0 0 28px}.practice .concept p{margin:6px 0}.copied:empty{display:none}.copied{margin:6px 0 0}
.practice-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.exercise{background:#fff;border:1px solid var(--ink);padding:32px}
.exercise h2{white-space:pre-line;font-size:23px;line-height:1.7;letter-spacing:0;margin:12px 0 24px}
.options{list-style:none;margin:0 0 24px;padding:0;font-size:18px;line-height:1.9}.options b{display:inline-block;min-width:2em}
.verdicts{border-collapse:collapse;font-size:15px;margin:4px 0 16px}.verdicts th,.verdicts td{border-top:1px solid var(--line);padding:8px 12px 8px 0;text-align:left;vertical-align:top}.verdicts .mark{font-weight:700;white-space:nowrap}
.alts p{font-size:15px;font-weight:400;margin:8px 0}.exercise-answer .alts p{font-size:15px;font-weight:400}
.pfigure{margin:0 0 24px}.pfigure-scroll{overflow-x:auto;border:1px solid var(--line);background:#fff;padding:8px}.pfigure svg{display:block;max-width:none}.pfigure figcaption{font-size:13px;font-weight:700;color:var(--gray);margin-top:6px}
.passage{margin:0 0 24px;padding:16px 20px;border:1px solid var(--ink);background:#fff;font-size:16px;line-height:1.9;white-space:pre-line}
.ptable{margin:0 0 24px;overflow-x:auto}.ptable figcaption{font-size:13px;font-weight:700;color:var(--gray);margin-bottom:6px}.ptable table{border-collapse:collapse;font-size:15px}.ptable th,.ptable td{border:1px solid var(--ink);padding:6px 16px;text-align:right;white-space:nowrap}.ptable th{background:var(--ground);font-weight:700;text-align:center}
.exercise-answer{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}.exercise-answer p{font-size:24px;font-weight:700;margin:12px 0}
.walkthrough{margin-top:32px}.walkthrough h3{font-size:16px;margin-bottom:16px}
.explain-step{border-top:1px solid var(--line);padding:8px 0}.explain-step:last-child{border-bottom:1px solid var(--line)}
.step-number{font-family:var(--latin);color:var(--red);font-size:20px;font-weight:700;margin-right:8px}.step-body{padding:0 24px 12px}.step-body p{font-size:18px;line-height:1.9;margin:10px 0}.step-body .link{font-size:13px;color:var(--gray)}
#prompt-panel{margin-top:20px;padding:20px;background:var(--ground);border-left:3px solid var(--red)}
#prompt-panel label{display:block;font-size:14px;font-weight:700}#practice-prompt{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid var(--line);font:inherit;resize:vertical}#copy-status{font-size:13px;margin-bottom:0}
.exercise-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px}
@media(max-width:640px){.practice-heading{margin-top:32px}.exercise{padding:20px}.exercise h2{font-size:20px}.step-body{padding-left:12px;padding-right:8px}}

.step-formula{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Georgia,"Yu Mincho",serif;font-size:21px;line-height:1.8;background:var(--ground);border-left:3px solid var(--line);padding:14px 18px;margin:12px 0}.exercise-source{margin-top:24px;border-top:1px solid var(--line);padding-top:14px}.step-body p{font-size:15px}.practice-heading h1{font-size:32px}@media(max-width:640px){.step-formula{font-size:17px;padding:12px}.practice-heading h1{font-size:27px}}

@media (max-width: 800px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

</style>
</head>

<script>
window.HOWTREE_DATA = {"config":{"name":"Howtree","amazon_tag":"","systems":[{"id":"course","name":"科目","ordered":true,"tags":[{"id":"sansu","name":"算数"},{"id":"jhmath","name":"中学数学"},{"id":"math1","name":"数I"},{"id":"matha","name":"数A"},{"id":"math2","name":"数II"},{"id":"mathb","name":"数B"},{"id":"math3","name":"数III"},{"id":"mathc","name":"数C"},{"id":"kokugo","name":"国語"}]},{"id":"field","name":"分野","tags":[{"id":"num","name":"数と式"},{"id":"geo","name":"図形"},{"id":"func","name":"関数"},{"id":"data","name":"データ"},{"id":"logic","name":"論理"},{"id":"vocab","name":"語彙"},{"id":"reading","name":"読解"}]}],"groups":{"math-school":"中学までの数学","jp-school":"国語の基礎","spi":"SPI対策","hs-math":"高校1年の数学","hs-math-2":"高校数学（数II・数B）","hs-math-3":"高校数学（数III・数C）"}},"nodes":{"hs-data":{"id":"hs-data","name":"データの分析","type":"learn","goal":"四分位数、分散、相関を求めて、データの傾向を説明できる。","part_of":"hs-math","tags":["math1","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たくさんの数値からなるデータの特徴を、いくつかの数で要約する方法を学びます。四分位数は、データを小さい順に並べて4等分する位置の値で、散らばりの様子を箱ひげ図で表すのに使います。分散は、各値と平均値との差を2乗して平均した値で、その正の平方根を標準偏差といいます。どちらも、値が大きいほど散らばりが大きいことを表します。相関は、二つのデータの間に「一方が大きいほど他方も大きい（または小さい）」という傾向があるかどうかを表します。","example":"データ：2、4、4、6、9\n平均値：(2 + 4 + 4 + 6 + 9) ÷ 5 = 5\n平均値との差の2乗：9、1、1、1、16\n分散：(9 + 1 + 1 + 1 + 16) ÷ 5 = 5.6\n標準偏差：√5.6（約2.4）\n第1四分位数：(2 + 4) ÷ 2 = 3\n第3四分位数：(6 + 9) ÷ 2 = 7.5","note":"中央値（第2四分位数）は真ん中の4です。その前半2、4と後半6、9のそれぞれの中央値が、第1・第3四分位数です。相関は、散布図にかくと傾向を目で確かめられます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-average","level":"must"}]},"hs-expressions":{"id":"hs-expressions","name":"数と式","type":"learn","goal":"式の展開と因数分解、一次不等式ができる。","part_of":"hs-math","tags":["math1","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文字を含む式を、計算の規則に従って別の形に書き直すことを学びます。展開は、かっこのついた積の形をばらして和の形にすることです。因数分解はその逆で、和の形をいくつかの式の積の形にまとめることです。不等式は、二つの式の大小を不等号（＞、＜、≧、≦）で表した式で、方程式と同じように変形して解きます。ただし、両辺に負の数をかけたり、負の数で割ったりすると、不等号の向きが逆になります。","example":"展開：(x + 2)(x + 3) = x² + 5x + 6\n因数分解：x² + 5x + 6 = (x + 2)(x + 3)\n一次不等式：−2x + 1 ＞ 7\n　−2x ＞ 6\n　x ＜ −3","note":"最後の行では両辺を−2で割ったので、不等号の向きが逆になっています。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-linear-eq","level":"must"}]},"hs-quadratic":{"id":"hs-quadratic","name":"二次関数の応用","type":"learn","goal":"二次関数の最大と最小を求め、二次不等式を解ける。","part_of":"hs-math","tags":["math1","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二次関数 y = ax² + bx + c は、y = a(x − p)² + q の形に変形（平方完成）すると、グラフの頂点が点（p, q）にある放物線だとわかります。a が正なら頂点で y は最小になり、a が負なら頂点で最大になります。x の範囲が限られているときは、範囲の両端での値と、頂点が範囲の中にあれば頂点での値を比べて、最大と最小を決めます。二次不等式は、グラフが x 軸より上にあるか下にあるかを読み取って解きます。","example":"y = x² − 4x + 3 = (x − 2)² − 1\n頂点は点（2, −1）、最小値は −1（x = 2 のとき）\n二次不等式：x² − 4x + 3 ＜ 0\n　(x − 1)(x − 3) ＜ 0\n　1 ＜ x ＜ 3","note":"グラフが x 軸より下にあるのは、x 軸と交わる1と3の間です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-quadratic-fn","level":"must"},{"id":"hs-expressions","level":"must"}]},"hs-trig":{"id":"hs-trig","name":"三角比","type":"learn","goal":"正弦、余弦、正接を使って、辺の長さや面積を求められる。","part_of":"hs-math","tags":["math1","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形では、直角以外の一つの角 θ の大きさが決まると、三角形の大きさに関係なく、辺の長さの比が決まります。この比を三角比といいます。斜辺に対する「θ の向かいの辺」の比を sin θ（サイン、正弦）、斜辺に対する「θ のとなりの辺」の比を cos θ（コサイン、余弦）、となりの辺に対する向かいの辺の比を tan θ（タンジェント、正接）といいます。角と一辺の長さがわかれば、ほかの辺の長さを求められます。また、二辺の長さとその間の角がわかれば、三角形の面積を「1/2 × 二辺の積 × sin（間の角）」で求められます。数Iでは、三角比を90°より大きく180°までの角にも広げます。","example":"斜辺5、向かいの辺3、となりの辺4 の直角三角形\nsin θ = 3/5\ncos θ = 4/5\ntan θ = 3/4\n30°の三角比：sin 30° = 1/2、cos 30° = √3/2、tan 30° = 1/√3\n二辺が4と6、その間の角が30°の三角形の面積：1/2 × 4 × 6 × sin 30° = 6","note":"斜辺が10で θ が30°なら、向かいの辺は 10 × 1/2 = 5 です。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-similarity","level":"must"},{"id":"math-pythagoras","level":"must"}]},"hs2-calculus":{"id":"hs2-calculus","name":"微分・積分の考え","type":"learn","goal":"三次までの関数を微分して増減を調べ、二次までの関数を積分して面積を求められる。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"関数の値の変わり方を調べる「微分」と、その逆の計算である「積分」の基本を学ぶ単元です。関数 f(x) のグラフ上のある点での接線の傾きを、その点での微分係数といいます。x の各値に微分係数を対応させた関数を導関数といい、f′(x) と書きます。導関数の符号から、関数が増えているか減っているかがわかり、最大・最小を調べられます。積分は微分の逆の計算で、グラフと x 軸で囲まれた部分の面積を求めるのに使います。数IIでは、微分は3次まで、積分は2次までの多項式で表される関数を中心に扱います。","example":"f(x) = x² のとき f′(x) = 2x\nf(x) = x³ − 3x のとき f′(x) = 3x² − 3\n∫ 2x dx = x² + C（C は積分定数）\ny = x² と x 軸、直線 x = 3 で囲まれた部分の面積：9","note":"f(x) = x² のグラフの、x = 1 の点での接線の傾きは f′(1) = 2 です。面積の9は、x³/3 に x = 3 を入れた 27/3 = 9 から、x = 0 を入れた 0 を引いて求められます。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs-quadratic","level":"must"},{"id":"hs2-expressions","level":"must"}]},"hs2-coordinates":{"id":"hs2-coordinates","name":"図形と方程式","type":"learn","goal":"直線や円を式で表し、位置関係を調べられる。","part_of":"hs-math-2","tags":["math2","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"図形を座標平面の上に置き、式を使って調べる単元です。2点間の距離や、線分を決まった比に分ける点の座標を、座標から計算で求めます。直線は y = mx + n（y 軸に平行な直線は x = k）、円は中心（a, b）と半径 r を使って (x − a)² + (y − b)² = r² という方程式で表せます。方程式を連立して解くと、直線と円の交点や、接するかどうかがわかります。不等式が表す領域も扱います。","example":"2点 (1, 2)、(4, 6) の間の距離：√(3² + 4²) = √25 = 5\n中心 (0, 0)、半径 5 の円：x² + y² = 25\nこの円と直線 x = 3 の交点：(3, 4)、(3, −4)","note":"x = 3 を円の式に入れると 9 + y² = 25 なので、y = 4 または y = −4 です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-quadratic","level":"must"}]},"hs2-explog":{"id":"hs2-explog","name":"指数関数・対数関数","type":"learn","goal":"指数と対数の計算ができ、グラフをかける。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"同じ数を何回もかける「累乗」の考えを、指数が0や負の数、分数の場合にも広げ、y = aˣ の形の関数（指数関数）を扱います。また、「a を何乗すると M になるか」を表す数を logₐ M と書き、対数といいます（a は1でない正の数、M は正の数）。対数は指数を逆から見たもので、y = logₐ x を対数関数といいます。対数を使うと、かけ算を足し算に直して考えられます。","example":"2³ = 8、2⁰ = 1、2⁻¹ = 1/2\nlog₂ 8 = 3（2を3乗すると8になるから）\nlog₂ 4 + log₂ 8 = log₂ 32\n左辺は 2 + 3、右辺は 5","note":"最後の2行は、4 × 8 = 32 というかけ算が、対数では 2 + 3 = 5 という足し算になることを表しています。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hs2-expressions":{"id":"hs2-expressions","name":"いろいろな式","type":"learn","goal":"式の割り算、二項定理、複素数、高次方程式の計算ができる。","part_of":"hs-math-2","tags":["math2","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数Iで学んだ式の計算を広げる単元です。3乗の展開や二項定理、整式を整式で割る計算、分数式を扱います。また、2乗すると −1 になる数 i（虚数単位）を導入し、a + bi の形の数（複素数）まで数の範囲を広げます。これにより、実数の範囲では解がなかった二次方程式も解けるようになります。3次以上の方程式は、因数定理を使って因数分解して解きます。","example":"(a + b)³ = a³ + 3a²b + 3ab² + b³\ni² = −1\nx² + 1 = 0 の解：x = i、x = −i\nx³ − 1 = (x − 1)(x² + x + 1)","note":"x³ − 1 に x = 1 を代入すると0になるので、x − 1 を因数にもちます（因数定理）。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hs2-trig":{"id":"hs2-trig","name":"三角関数","type":"learn","goal":"一般角の三角関数と加法定理を使える。","part_of":"hs-math-2","tags":["math2","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数Iの三角比を、180°より大きい角や負の角にも広げて、角の大きさ θ の関数として扱う単元です。原点を中心とする半径1の円（単位円）の上の点の座標を使って、sin θ と cos θ を決めます。角の大きさは、度のほかに、弧の長さで測る「弧度法（ラジアン）」でも表し、180° が π ラジアンです。sin と cos のグラフは同じ形の波を繰り返し、360°（2π）ごとに元に戻ります。二つの角の和の三角関数を求める加法定理も学びます。","example":"180° = π ラジアン、90° = π/2 ラジアン\nsin 90° = 1、cos 180° = −1\nsin²θ + cos²θ = 1\n加法定理：sin(α + β) = sin α cos β + cos α sin β","note":"sin 75° は、45° と 30° の和として加法定理で求められます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-trig","level":"must"}]},"hs3-differential":{"id":"hs3-differential","name":"微分法","type":"learn","goal":"いろいろな関数を微分し、グラフの形を調べられる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数IIの微分を、分数の形の関数、無理関数、三角関数、指数関数、対数関数にまで広げる単元です。二つの関数の積や商を微分する公式、関数の中に別の関数が入った合成関数を微分する公式を学びます。導関数をもう一度微分した第二次導関数を使うと、グラフのへこみ方（凹凸）までわかり、いろいろな関数のグラフの形をくわしく調べられます。速度や加速度、近似値の計算にも使います。","example":"(sin x)′ = cos x\n(eˣ)′ = eˣ\n(log x)′ = 1/x\n積の微分：(x sin x)′ = sin x + x cos x\n合成関数の微分：(sin 2x)′ = 2 cos 2x","note":"e は約2.718の数で、eˣ は微分しても形が変わらない指数関数です。log x は e を底とする対数（自然対数）です。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs3-limit","level":"must"},{"id":"hs2-calculus","level":"must"}]},"hs3-integral":{"id":"hs3-integral","name":"積分法","type":"learn","goal":"いろいろな関数を積分し、面積や体積を求められる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数IIの積分を、三角関数、指数関数、分数の形の関数などに広げる単元です。そのままでは積分しにくい関数を、文字を置き換えて積分する置換積分法や、積の形の関数を積分する部分積分法を学びます。定積分を使って、曲線で囲まれた図形の面積、立体の体積、曲線の長さを求めます。","example":"∫ cos x dx = sin x + C\n∫ eˣ dx = eˣ + C\n∫ 1/x dx = log|x| + C\ny = sin x（0 ≦ x ≦ π）と x 軸で囲まれた部分の面積：2","note":"C は積分定数です。面積の2は、−cos x に x = π と x = 0 を入れた差 1 − (−1) から求められます。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs3-differential","level":"must"}]},"hs3-limit":{"id":"hs3-limit","name":"極限","type":"learn","goal":"数列と関数の極限を求められる。","part_of":"hs-math-3","tags":["math3","func"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数列や関数の値が、ある値に限りなく近づいていく様子を調べる単元です。n を限りなく大きくしたとき、数列の項が一つの値 α に限りなく近づくなら、その数列は α に収束するといい、α を極限値といいます。収束しないときは、発散するといいます。無限に続く数列の項をすべて足した和（無限級数）や、x がある値に近づくときの関数の極限も扱います。極限の考えは、数IIIの微分と積分の土台になります。","example":"n が限りなく大きくなるとき、1/n は 0 に近づく\n無限等比級数：1/2 + 1/4 + 1/8 + … の和は 1\nx が 0 に近づくとき、(sin x) ÷ x は 1 に近づく（x はラジアン）","note":"無限等比級数は、公比の絶対値が1より小さいときに収束し、和は「初項 ÷ (1 − 公比)」です。上の例では 1/2 ÷ (1 − 1/2) = 1 です。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hsb-sequence","level":"must"},{"id":"hs2-explog","level":"must"},{"id":"hs2-trig","level":"must"}]},"hsa-activity":{"id":"hsa-activity","name":"数学と人間の活動","type":"learn","goal":"約数と倍数などの整数の性質を使って、問題を解ける。","part_of":"hs-math","tags":["matha","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数学が人間の活動の中でどう生まれ、使われてきたかを題材に、整数の性質などを学ぶ単元です。二つの整数に共通する約数のうち最大のものを最大公約数、共通する倍数のうち最小の正の数を最小公倍数といいます。大きな数の最大公約数は、割り算の余りを繰り返し使う「ユークリッドの互除法」で求められます。また、0と1だけで数を表す二進法のように、10以外の数を位取りの基準にした数の表し方も扱います。","example":"12と18の最大公約数：6\n12と18の最小公倍数：36\n互除法：18 ÷ 12 は 1 あまり 6、12 ÷ 6 は 2 あまり 0 なので、最大公約数は6\n二進法の 1101 は、十進法で 8 + 4 + 0 + 1 より 13","note":"最大公約数と最小公倍数の積 6 × 36 = 216 は、もとの二つの数の積 12 × 18 = 216 と等しくなります。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}]},"hsa-geometry":{"id":"hsa-geometry","name":"図形の性質","type":"learn","goal":"三角形や円の性質を使って、角の大きさや長さを求められる。","part_of":"hs-math","tags":["matha","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"三角形と円がもつ性質を、証明をもとに整理して使う単元です。三角形には、重心・外心・内心という特別な点があります。重心は三本の中線の交点、外心は三辺の垂直二等分線の交点、内心は三つの角の二等分線の交点です。円については、同じ弧に対する円周角は等しく、中心角の半分になること（円周角の定理）や、円に内接する四角形の向かい合う角の和が180°になることなどを使います。作図や、空間図形の性質も扱います。","example":"円周角の定理：中心角が100°の弧に対する円周角は 100° ÷ 2 = 50°\n円に内接する四角形：向かい合う角の一方が70°なら、もう一方は 180° − 70° = 110°\n重心：各中線を、頂点の側から 2：1 に分ける","note":"円周角の定理は中学3年で学びます。この単元では、それをもとに円の新しい性質を証明し、応用します。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-similarity","level":"must"}]},"hsa-probability":{"id":"hsa-probability","name":"場合の数と確率","type":"learn","goal":"順列と組合せを使って場合の数を数え、確率を求められる。","part_of":"hs-math","tags":["matha","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"ことがらの起こり方が何通りあるかを、順列と組合せを使って数え、それをもとに確率を求める単元です。異なる n 個から r 個を選んで一列に並べる並べ方を順列といい、ₙPᵣ で表します。並べる順番を区別せずに r 個を選ぶ選び方を組合せといい、ₙCᵣ で表します。確率では、同時には起こらない二つのことがらの確率を足す場合、互いに影響しない試行を続けるときに確率をかける場合、ある条件のもとでの確率（条件付き確率）を扱います。また、得られる値とその確率をかけて足し合わせた期待値も扱います。","example":"₅P₂ = 5 × 4 = 20\n₅C₂ = (5 × 4) ÷ (2 × 1) = 10\nさいころを2回投げて2回とも1の目が出る確率：1/6 × 1/6 = 1/36\n期待値：10本中1本だけ100円が当たるくじを1本引くとき、100 × 1/10 + 0 × 9/10 = 10（円）","note":"₅P₂ は「5個から2個を選んで並べる」、₅C₂ は「5個から2個を選ぶ」の意味で、数字は P や C の左下と右下に小さく書きます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-probability","level":"must"}]},"hsb-sequence":{"id":"hsb-sequence","name":"数列","type":"learn","goal":"等差数列と等比数列の一般項と和を求め、漸化式を扱える。","part_of":"hs-math-2","tags":["mathb","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"数を一列に並べたものを数列といい、その並び方の規則を式で表す単元です。となり合う項の差が一定の数列を等差数列、となり合う項の比が一定の数列を等比数列といいます。n 番目の項を n の式で表したものを一般項といいます。はじめの項から n 番目までの和を求める公式や、和を表す記号 Σ（シグマ）を学びます。また、前の項から次の項を決める規則（漸化式）で数列を定めることや、自然数についての命題を証明する数学的帰納法も扱います。","example":"等差数列 2、5、8、11、…：一般項は 3n − 1\n等比数列 3、6、12、24、…：一般項は 3 × 2ⁿ⁻¹\n1 から 100 までの整数の和：100 × 101 ÷ 2 = 5,050","note":"等差数列の和は、(はじめの項 + 終わりの項) × 項の数 ÷ 2 で求められます。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-expressions","level":"must"}]},"hsb-society":{"id":"hsb-society","name":"数学と社会生活","type":"learn","goal":"身の回りの事象を数学で表し、データをもとに判断できる。","part_of":"hs-math-2","tags":["mathb","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"身の回りや社会の問題を、数学の言葉に直して考える進め方を学ぶ単元です。現実の問題から大事な条件だけを取り出して式やグラフで表したものを、数理モデルといいます。モデルを使って計算し、結果を現実に当てはめて確かめ、合わなければ条件を見直します。データに合う直線や曲線を求めて、先の値を予測することも扱います。","example":"問題：プランAは基本料2,000円と1分10円、プランBは基本料なしで1分30円。どちらが安いか\nモデル：Aの料金は 2,000 + 10x、Bの料金は 30x（x は通話の分数）\n二つが等しくなるとき：2,000 + 10x = 30x より x = 100\n結論：月に100分より多く話すなら、Aが安い","note":"実際には通話時間が月によって変わるので、何か月分かのデータで確かめます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"hs-data","level":"must"}]},"hsb-statistics":{"id":"hsb-statistics","name":"統計的な推測","type":"learn","goal":"確率分布と正規分布を使って、推定と検定ができる。","part_of":"hs-math-2","tags":["mathb","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"一部のデータ（標本）から、全体（母集団）の様子を確率を使って推し量る方法を学ぶ単元です。とり得る値とその確率の対応を確率分布といい、その平均（期待値）と散らばり（分散、標準偏差）を計算します。平均を中心に左右対称な山の形をした分布を「正規分布」といい、身長や測定の誤差など、これに近い分布になるデータがあります。標本の平均から母集団の平均がどの範囲にあるかを見積もる「推定」と、ある仮説のもとで、得られた結果がどのくらい起こりにくいかを確率で調べ、仮説を捨てるかどうかを判断する「仮説検定」を扱います。","example":"さいころを1回投げたときの出る目の期待値：(1 + 2 + 3 + 4 + 5 + 6) ÷ 6 = 3.5\n正規分布では、平均 ± 1.96 × 標準偏差 の範囲に、全体の約95%が入る\n母平均に対する信頼度95%の信頼区間：標本平均 ± 1.96 × 母集団の標準偏差 ÷ √(標本の大きさ)","note":"1.96 という数は、正規分布の表から得られます。母集団の標準偏差がわからないときは、標本が十分大きければ、標本の標準偏差で代用します。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"hs-data","level":"must"},{"id":"hsa-probability","level":"must"}]},"hsc-curves":{"id":"hsc-curves","name":"平面上の曲線と複素数平面","type":"learn","goal":"二次曲線と媒介変数表示、複素数平面を扱える。","part_of":"hs-math-3","tags":["mathc","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"平面上の曲線を式で表す方法と、複素数を平面上の点として表す方法を学ぶ単元です。放物線、楕円、双曲線は、どれも x と y の二次式で表される曲線で、まとめて二次曲線といいます。曲線は、x と y をそれぞれ別の文字 t の式で表す媒介変数表示や、原点からの距離と角で表す極座標でも表せます。複素数 a + bi は、座標平面の点（a, b）に対応させて考えることができ、この平面を複素数平面といいます。複素数のかけ算は、平面上での回転と拡大・縮小に対応します。","example":"楕円：x²/9 + y²/4 = 1（原点を中心に、x 軸方向に ±3、y 軸方向に ±2 まで広がる）\n原点を中心とする半径1の円の媒介変数表示：x = cos t、y = sin t\n複素数 3 + 4i は点 (3, 4)、絶対値は √(3² + 4²) = 5\ni をかけると原点のまわりに反時計回りに90°回転する：(3 + 4i) × i = 3i + 4i² = −4 + 3i","note":"点 (3, 4) を原点のまわりに反時計回りに90°回転すると、点 (−4, 3) になります。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs2-coordinates","level":"must"},{"id":"hs2-trig","level":"must"},{"id":"hs2-expressions","level":"must"}]},"hsc-expression":{"id":"hsc-expression","name":"数学的な表現の工夫","type":"learn","goal":"行列や図を使って、事象を整理して表せる。","part_of":"hs-math-3","tags":["mathc","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"日常や社会のことがらを、図、表、統計グラフ、行列、離散グラフなどを使って整理し、わかりやすく表す工夫を学ぶ単元です。数を縦と横に長方形の形に並べたものを行列といい、たくさんの数をまとめて扱えます。点と、点を結ぶ線だけで関係を表した図を離散グラフといい、路線図や人のつながりを表すのに使います。目的に合った表し方を選ぶことで、問題の構造が見えやすくなります。","example":"2行2列の行列の例：[1 2 ; 3 4]（1行目が 1 2、2行目が 3 4）\n行列の和：[1 2 ; 3 4] + [5 6 ; 7 8] = [6 8 ; 10 12]\n離散グラフの例：三つの駅 A、B、C と、AとB、BとC を結ぶ2本の路線","note":"行列の和は、同じ位置にある数どうしを足します。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"hs-data","level":"must"}]},"hsc-vector":{"id":"hsc-vector","name":"ベクトル","type":"learn","goal":"ベクトルの演算と内積を使って、図形の問題を解ける。","part_of":"hs-math-3","tags":["mathc","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、学習指導要領（平成30年告示）の本文と科目・項目を照合。指摘を反映した後に再検証。","text":"向きと大きさをもつ量をベクトルといい、矢印で表します。ベクトルは、成分（x 方向と y 方向にどれだけ進むか）を使って数の組で表せます。ベクトルどうしは成分ごとに足すことができ、ベクトルに実数をかけることもできます。二つのベクトルのなす角を使って決める「内積」を計算すると、二つのベクトルが垂直かどうかや、なす角の大きさがわかります。平面だけでなく、空間のベクトルも扱います。","example":"a = (3, 4) の大きさ：√(3² + 4²) = 5\na = (3, 4)、b = (1, 2) のとき a + b = (4, 6)\n内積：a・b = 3 × 1 + 4 × 2 = 11\n(2, 1) と (−1, 2) の内積：2 × (−1) + 1 × 2 = 0","note":"内積は「二つのベクトルの大きさの積 × cos（なす角）」で決めた数で、成分では「x 成分どうしの積 + y 成分どうしの積」で計算できます。0でない二つのベクトルの内積が0になるとき、その二つは垂直です。"},"cost":{"hours":30,"yen":0},"requires":[{"id":"hs-trig","level":"must"}]},"jp-reading":{"id":"jp-reading","name":"説明文の読解","type":"learn","goal":"説明文を読み、指示語の指す内容と、接続語が示す文どうしの関係をつかみ、書き手の考えを述べた文を見分けられる。","part_of":"jp-school","tags":["kokugo","reading"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"説明文は、あることがらについて、筋道を立てて説明する文章です。読むときは、まず文と文のつながりを示す二つの手がかりに注目します。一つは「これ」「その」のような指示語で、ふつうは直前に出てきた語句や内容を指します。もう一つは接続語で、前の文と後の文の関係を示します。「だから」「そのため」「その結果」は理由と結果、「しかし」は逆の内容、「たとえば」は例、「つまり」は言いかえ、「一方で」は別の面を並べる関係です。また、「私は」「と考える」「大切なのは」のような言葉のある文は書き手の考えを述べていて、事実やほかの人の見方を説明する文と区別して読みます。指示語は、指す内容を実際に当てはめて読み、意味が通るかで確かめます。","example":"机の上に辞書がある。それを取ってほしい。\n「それ」が指すもの：辞書\n当てはめる：辞書を取ってほしい。\n\n雨が降ってきた。しかし、試合は続いた。\n「しかし」が示す関係：前の文から予想されることと、逆の内容が後に続く","note":"指示語を指す内容に置きかえても文の意味が通れば、読み取りは合っています。"},"cost":{"hours":20,"yen":0},"assessment":{"question":"「駅前に新しい図書館ができた。そこは夜九時まで開いている。」の「そこ」が指すのは？","options":["駅前","新しい図書館","夜九時"],"answer":1,"explanation":"「そこ」に当てはめて意味が通るのは「新しい図書館は夜九時まで開いている」。開いている・閉まっていると言えるのは建物で、駅前という場所には当てはまらない。"}},"kounin-math":{"id":"kounin-math","name":"高卒認定の数学","type":"target","goal":"高卒認定試験の数学で、合格点を取れる。","part_of":"hs-math","status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"高等学校卒業程度認定試験（高卒認定試験）は、高校を卒業していない人などが、高校を卒業した人と同等以上の学力があるかどうかを認定する国の試験です。合格すると、大学入学資格（大学を受験する資格）が得られます。この試験に合格するには、数学だけでなく、各教科の必修の科目すべてに合格する必要があります。数学は必修の科目です。","example":"出題範囲：「数学Ⅰ」（令和4年4月以降に高校へ入学した人が使う教科書）\n試験時間：50分\n実施：年2回（8月と11月）","note":"出題範囲と試験時間は、文部科学省の案内で2026-10-07に確認しました。年度によって変わることがあります。受験の前に、最新の受験案内を確かめてください。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"hs-expressions","level":"must"},{"id":"hs-quadratic","level":"must"},{"id":"hs-trig","level":"must"},{"id":"hs-data","level":"must"}],"sources":[{"title":"文部科学省：高等学校卒業程度認定試験 試験科目・合格要件・出題範囲","url":"https://www.mext.go.jp/a_menu/koutou/shiken/01339.html"},{"title":"文部科学省：高等学校卒業程度認定試験 時間割","url":"https://www.mext.go.jp/a_menu/koutou/shiken/01339_00003.html"}]},"math-addsub":{"id":"math-addsub","name":"たし算ひき算","type":"learn","goal":"2けたのたし算とひき算を、暗算か筆算でできる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":1,"check":"48 + 37 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"たし算は二つの数を合わせた数を求める計算、ひき算は一方からもう一方を取り除いた残りや、二つの数の差を求める計算です。2けたの数では、十の位と一の位に分けて考えます。一の位どうしを足して10以上になったら十の位に1くり上げ、一の位どうしで引けないときは十の位から1くり下げます。","example":"35 + 49 = 84\n84 − 49 = 35","note":"たし算の答えから足した数を引くと、もとの数に戻ります。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"46 + 27 は？","options":["63","73","83"],"answer":1,"explanation":"40 + 20 と 6 + 7 に分けると、60 + 13 = 73。"},"practice":{"title":"位ごとに分けて、たし算とひき算をする","lead":"くり上がりとくり下がりを、一つずつ確かめる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"くり上がりのあるたし算","question":"58 + 27 を計算してください。","answer":"85","steps":[{"title":"二つの数を、十の位と一の位に分ける","formula":"58 = 50 + 8\n27 = 20 + 7","body":"2けたの数は、十がいくつ、一がいくつ、に分けて考えます。"},{"title":"一の位どうしを足す","formula":"8 + 7 = 15","body":"答えが10以上になりました。15は、十が1つと一が5つです。この十1つを十の位に送ることを、くり上がりといいます。"},{"title":"十の位どうしを足す","formula":"50 + 20 = 70","body":"十が5つと2つで、十が7つです。"},{"title":"二つの答えを合わせる","formula":"70 + 15 = 85","body":"十の位の70に、一の位の答え15を足します。くり上がった十1つが加わり、十の位は8になります。"},{"title":"ひき算で、もとの数に戻るか確かめる","formula":"85 − 27 = 58","body":"答えから足した数を引くと、もとの58に戻ります。"}]},{"label":"くり下がりのあるひき算","question":"73 − 48 を計算してください。","answer":"25","steps":[{"title":"一の位どうしで引けるか調べる","formula":"73 の一の位：3\n48 の一の位：8","body":"3から8は引けません。十の位から十を1つくり下げます（借ります）。これをくり下がりといいます。"},{"title":"73を、60と13に分け直す","formula":"73 = 60 + 13","body":"十7つのうち1つを一の位に回すと、十が6つと、一が13になります。"},{"title":"一の位を引く","formula":"13 − 8 = 5","body":"借りてきた十と合わせた13から、8を引きます。"},{"title":"十の位を引く","formula":"60 − 40 = 20","body":"十を1つ貸したので、70ではなく60から引きます。"},{"title":"二つの答えを合わせる","formula":"20 + 5 = 25","body":"十の位の20と、一の位の5を合わせます。"},{"title":"たし算で、もとの数に戻るか確かめる","formula":"25 + 48 = 73","body":"答えに引いた数を足すと、もとの73に戻ります。"}]},{"label":"減ってから増える場面","question":"図書室の棚に、本が64冊ありました。28冊が借りられ、そのあと19冊が返ってきて、棚に戻されました。棚の本は、いま何冊でしょうか。","answer":"55冊","steps":[{"title":"起きたことを、順に置く","formula":"はじめ：64冊\n借りられた：28冊（減る）\n返ってきた：19冊（増える）","body":"減るときはひき算、増えるときはたし算です。起きた順に計算します。"},{"title":"借りられたあとの冊数を求める","formula":"64 − 28 = 36","body":"一の位の4から8は引けないので、くり下げて 14 − 8 = 6、十の位は 50 − 20 = 30 です。"},{"title":"返ってきたあとの冊数を求める","formula":"36 + 19 = 55","body":"一の位は 6 + 9 = 15 でくり上がり、十の位は 30 + 10 に十1つを足して50です。"},{"title":"別の考え方で確かめる","formula":"28 − 19 = 9\n64 − 9 = 55","body":"28冊減って19冊増えたので、合わせると9冊減ったことになります。はじめの64冊から9冊を引いても、同じ55冊です。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-angle":{"id":"math-angle","name":"角度と三角形","type":"learn","goal":"分度器で角度を測り、三角形の角の和を使える。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"角度は、一つの点から出る二本の直線の開き具合を表す量で、単位は度（°）です。一回転が360°、一直線が180°、直角が90°です。分度器の中心を角の頂点に合わせ、一方の辺を0°の線に重ねると、もう一方の辺が指す目盛りが角度になります。どんな三角形でも、三つの角を足すと180°になります。","example":"三角形の三つの角：60° + 70° + 50° = 180°\n残りの角を求める：180° − 60° − 70° = 50°","note":"二つの角がわかれば、残りの角は計算で求められます。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-shapes","level":"must"}]},"math-area":{"id":"math-area","name":"面積と体積","type":"learn","goal":"基本の図形の面積と、直方体の体積を求められる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"面積は平らな形の広さを表す量で、1辺が1cmの正方形がいくつ分かで数え、単位はcm²です。体積は立体のかさを表す量で、1辺が1cmの立方体がいくつ分かで数え、単位はcm³です。長方形の面積は「たて × 横」、三角形の面積は「底辺 × 高さ ÷ 2」、直方体の体積は「たて × 横 × 高さ」で求めます。","example":"長方形（たて4cm、横6cm）の面積：4 × 6 = 24\n三角形（底辺6cm、高さ4cm）の面積：6 × 4 ÷ 2 = 12\n直方体（たて4cm、横6cm、高さ5cm）の体積：4 × 6 × 5 = 120","note":"面積の単位はcm²、体積の単位はcm³です。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-muldiv","level":"must"},{"id":"math-shapes","level":"must"}]},"math-average":{"id":"math-average","name":"平均とデータ","type":"learn","goal":"平均値と中央値を求め、散らばりを説明できる。","part_of":"math-school","tags":["sansu","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"平均値は、データの値をすべて足して個数で割った値で、全体をならしたときの大きさを表します。中央値は、データを小さい順に並べたときに真ん中にくる値です。データが偶数個のときは、真ん中の二つの値の平均を中央値とします。極端に大きい値や小さい値があると平均値は大きく動きますが、中央値はあまり動きません。最大の値と最小の値の差（範囲）を見ると、散らばりの大きさがわかります。","example":"データ：2、3、4、5、16\n平均値：(2 + 3 + 4 + 5 + 16) ÷ 5 = 6\n中央値：4\n範囲：16 − 2 = 14","note":"16という大きな値があるため、平均値の6は中央値の4より大きくなっています。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-table","level":"helps"}]},"math-circle":{"id":"math-circle","name":"円と円周率","type":"learn","goal":"円周の長さと円の面積を求められる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"円は、中心から同じ距離にある点が集まってできる形です。中心から円周までの長さを半径、中心を通って円周から円周までの長さを直径といい、直径は半径の2倍です。円周の長さは直径の約3.14倍で、この倍率を円周率といいます。円周は「直径 × 3.14」、面積は「半径 × 半径 × 3.14」で求めます。","example":"半径5cmの円の直径：5 × 2 = 10\n半径5cmの円の円周：10 × 3.14 = 31.4\n半径5cmの円の面積：5 × 5 × 3.14 = 78.5","note":"円周率は、中学からは文字 π（パイ）で表します。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-area","level":"must"}]},"math-congruence":{"id":"math-congruence","name":"合同と証明","type":"learn","goal":"三角形の合同条件を使って、証明を書ける。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの図形が、形も大きさも同じでぴったり重なるとき、合同であるといい、記号 ≡ で表します。三角形は、次のどれか一つが成り立てば合同だと言えます。三組の辺がそれぞれ等しい。二組の辺とその間の角がそれぞれ等しい。一組の辺とその両端の角がそれぞれ等しい。証明とは、わかっていること（仮定）から出発し、すでに正しいと認められたことだけを根拠にして、示したいこと（結論）を筋道立てて説明することです。","example":"仮定：AB = DE、BC = EF、∠B = ∠E\n根拠：二組の辺とその間の角がそれぞれ等しい\n結論：△ABC ≡ △DEF","note":"合同な図形では、対応する辺の長さと角の大きさがすべて等しくなります。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-angle","level":"must"}]},"math-fraction":{"id":"math-fraction","name":"小数と分数","type":"learn","goal":"小数と分数の四則計算ができ、互いに変換できる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":3,"check":"2/3 ÷ 4/5 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"小数と分数は、どちらも1より小さい量や、整数と整数の間の量を表す数です。小数は0.1や0.01のように位を10分の1ずつ細かくして表します。分数は、全体をいくつかに等しく分けたうちの何個分かを「分子/分母」の形で表します。同じ量を小数でも分数でも書けるので、計算しやすい方に直して使います。","example":"1/2 = 0.5\n3/4 = 0.75\n1/2 + 1/4 = 2/4 + 1/4 = 3/4\n0.5 × 0.6 = 0.3","note":"分数どうしを足すときは、分母をそろえます。"},"cost":{"hours":40,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"2/3 ÷ 4/5 は？","options":["8/15","6/5","5/6"],"answer":2,"explanation":"割る数の逆数を掛ける。2/3 × 5/4 = 10/12 = 5/6。"},"practice":{"title":"分数と小数を、計算しやすい形に直して計算する","lead":"分母をそろえる、逆数をかける、形をそろえる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"分母の違う分数のたし算","question":"2/3 + 1/4 を計算してください。","answer":"11/12","steps":[{"title":"分母を見て、そのまま足せるか調べる","formula":"2/3 の分母：3\n1/4 の分母：4","body":"分母が違うと、1個分の大きさが違うので、分子どうしをそのまま足せません。分母をそろえます（通分）。"},{"title":"そろえる分母を決める","formula":"3 × 4 = 12","body":"3でも4でも割り切れる数を小さい順に探すと、12が最初に見つかります。これを分母にします。今回は 3 × 4 と同じですが、分母どうしの積がいつもいちばん小さいとは限りません（分母が4と6なら、24ではなく12です）。"},{"title":"それぞれを、分母が12の分数に直す","formula":"2/3 = 8/12\n1/4 = 3/12","body":"分母と分子に同じ数をかけても、分数の大きさは変わりません。2/3 は分母と分子に4を、1/4 は3をかけます。"},{"title":"分子どうしを足す","formula":"8/12 + 3/12 = 11/12","body":"分母はそのままで、分子だけを足します。11と12の両方を割り切る数は1しかないので、これ以上約分（分母と分子を同じ数で割って簡単にすること）はできません。"},{"title":"ひき算で、もとの数に戻るか確かめる","formula":"11/12 − 3/12 = 8/12\n8/12 = 2/3","body":"答えから 1/4（= 3/12）を引くと、もとの 2/3 に戻ります。"}]},{"label":"分数のわり算","question":"3/4 ÷ 5/8 を計算してください。","answer":"6/5（1と1/5。小数では1.2）","steps":[{"title":"割る数の逆数を作る","formula":"割る数：5/8\n逆数：8/5","body":"逆数は、分母と分子を入れかえた数です。分数で割ることは、その逆数をかけることと同じです。"},{"title":"わり算を、かけ算に直す","formula":"(3/4) ÷ (5/8) = 3/4 × 8/5","body":"割られる数の 3/4 はそのままにして、割る数だけを逆数に変えます。"},{"title":"分子どうし、分母どうしをかける","formula":"3 × 8 = 24\n4 × 5 = 20\n3/4 × 8/5 = 24/20","body":"分数のかけ算は、分子どうし、分母どうしをかけます。"},{"title":"約分して、ほかの表し方も確かめる","formula":"24/20 = 6/5\n6 ÷ 5 = 1.2","body":"分母と分子を、どちらも4で割ります。6/5 は1より大きい分数で、1と1/5とも書けます。分子を分母で割って小数に直すと、1.2です。"},{"title":"割る数をかけて、もとの数に戻るか確かめる","formula":"6/5 × 5/8 = 30/40\n30/40 = 3/4","body":"答えに割る数の 5/8 をかけると、もとの 3/4 に戻ります。"}]},{"label":"小数と分数が混じった計算","question":"0.6 + 3/4 を計算して、答えを小数と分数の両方で表してください。","answer":"小数では1.35、分数では27/20（1と7/20）","steps":[{"title":"どちらかの形にそろえる方針を置く","formula":"0.6：小数\n3/4：分数","body":"形が違うままでは足しにくいので、どちらかにそろえます。まず小数にそろえて計算し、次に分数にそろえて確かめます。"},{"title":"3/4 を小数に直す","formula":"3 ÷ 4 = 0.75","body":"分数を小数に直すには、分子を分母で割ります。"},{"title":"小数どうしで足す","formula":"0.6 + 0.75 = 1.35","body":"小数点の位置をそろえて足します。0.6 は 0.60 と考えます。"},{"title":"0.6 を分数に直す","formula":"0.6 = 6/10\n6/10 = 3/5","body":"0.6 は 0.1 が6個なので 6/10 です。分母と分子を2で割って約分します。"},{"title":"分数どうしで足す","formula":"3/5 = 12/20\n3/4 = 15/20\n12/20 + 15/20 = 27/20","body":"分母を20にそろえて、分子を足します。"},{"title":"二つの答えが同じ数か確かめる","formula":"27 ÷ 20 = 1.35","body":"27/20 を小数に直すと1.35で、小数で計算した答えと合います。27/20 は、1と7/20 とも書けます。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-letters":{"id":"math-letters","name":"文字と式","type":"learn","goal":"数量を文字を使った式で表し、かっこをはずして整理し、文字に数や式を代入して計算できる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、用語と書き方の決まりを資料と照合し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文字を使うと、まだ決まっていない数量や、いろいろな値をとる数量を、一つの式で表せます。文字を使った式には、書き方の決まりがあります。かけ算の答えを積といい、文字を使った積では記号 × を省きます。かけ算は、かける順番を変えても積が同じです。数と文字の積では数を先に書き（a × 3 は 3a）、文字どうしの積は、ふつうアルファベット順に並べます（b × a は ab）。1 × a は a、−1 × a は −a と書きます。わり算は、分数の形で書きます。\n式を足し算の形で見たとき、+ で結ばれた一つ一つを項といいます。引き算は、負の項を足すと考えます（3a − 2b の項は、3a と −2b）。文字を含む項の、数の部分を係数といいます（3a の係数は 3、−2b の係数は −2、a の係数は 1、−b の係数は −1）。項に数をかけたり、項を数で割ったりするときは、係数にその計算をします（3 × 2a = 6a、6a ÷ 2 = 3a）。文字の部分が同じ項を同類項といい、係数どうしを足し引きして一つにまとめられます（3a + 2a = 5a）。係数が 0 になった項は消えます。文字の項と、数だけの項は、別々にまとめます。\nかっこの外の数や文字は、かっこの中のすべての項にかけます（分配法則）。数のついていないかっこは、前が + ならそのままはずし、前が − なら中のすべての項の符号を変えてはずします。\n二つの式を等号 = で結んだものを等式といい、= の左を左辺、右を右辺、合わせて両辺といいます。式の中の文字を数に置きかえることを代入といい、代入して計算した結果を式の値といいます。数のかわりに式を代入することもできます。足し算や引き算でできた式を代入するときは、かっこをつけます。数を代入したあとは、数だけの式と同じ順（かっこの中、かけ算とわり算、足し算と引き算）で計算します。","example":"書き方：a × 3 = 3a、b × a = ab、a ÷ 4 = a/4\n同類項をまとめる：3a + 2a = 5a、6y − 6y = 0、3x + 2 + 2x + 5 = 5x + 7\n分配法則：2(a + 3) = 2a + 6、a(b + c) = ab + ac\nかっこをはずす：−(a − b) = −a + b\n数を代入する：a が 4 のとき、3a + 2 は 3 × 4 + 2 = 14\n式を代入する：y = 2x のとき、5y は 5 × 2x = 10x","note":"3a は「3 × a」のことです。3 と a を並べた数（a が 4 なら 34）でも、3 + a でもありません。代入するときは、省かれていた × を書き戻します。この単元は、中学1年の「文字と式」と、中学2年の「式の計算」の一部にあたります。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-negative","level":"must"}],"assessment":{"question":"a が 5 のとき、2a + 3 の値は？","options":["13","28","10"],"answer":0,"explanation":"2a は 2 × a のこと。2 × 5 + 3 = 13。28は「2a」を二十五と読んで3を足した数、10は 2 + 5 + 3 と足してしまった数。"},"practice":{"title":"文字で表し、かっこをはずし、数や式を代入する","lead":"省かれた × を、書き戻して考える。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、図と問題文の一致、前提の範囲、下流の単元から見た不足、説明・確認問題との整合を確認。一度検証を通らず、作り直した後に全手順で再検証。","problems":[{"label":"数量を式で表す","question":"1個 a 円の品物を5個買い、5個まとめて、b 円の箱1つに入れてもらいました。代金の合計を、文字を使った式で表してください。","answer":"5a + b（円）","alternatives":[{"try":"5(a + b)","why_not":"箱は1つだけ。この式だと、箱の代金も5倍することになる。"},{"try":"5ab","why_not":"品物の代金と箱の代金は、足して合計にする。かけ合わせるのではない。"},{"try":"a5 + b","why_not":"表している量は同じだが、数と文字の積では、数を先に書く決まり。5a と書く。"}],"steps":[{"title":"言葉の式を作る","formula":"代金の合計 = 品物1個の値段 × 個数 + 箱の値段","body":"いきなり文字で書かず、まず言葉で関係を書きます。"},{"title":"言葉を、文字と数に置きかえる","formula":"a × 5 + b","body":"品物1個の値段は a、個数は5、箱の値段は b です。"},{"title":"書き方の決まりに合わせる","formula":"5a + b","body":"× を省き、数を文字の前に書きます。5a と b は文字の部分が違うので、これ以上まとめられません。"},{"title":"数を入れて確かめる","formula":"a が 100、b が 50 のとき\n100 × 5 + 50 = 550","body":"1個100円の品物5個で500円、箱が50円で、合計550円です。式に数を入れた結果と合います。"}]},{"label":"負の数を代入する","question":"a = 3、b = −2 のとき、2a − 3b の値を求めてください。","answer":"12","alternatives":[{"try":"6 − 6 = 0","why_not":"3b は 3 × (−2) で −6。引くのは −6 なので、6 − (−6) となり、足すことになる。"},{"try":"2 × 3 − 3 − 2 = 1","why_not":"かっこをつけずに代入して、b の符号の − を引き算の記号として読んでいる。3b は 3 × (−2) で、かけ算。"}],"steps":[{"title":"省かれている × を書き戻す","formula":"2a − 3b\n= 2 × a − 3 × b","body":"代入する前に、かけ算の記号を書き戻します。"},{"title":"文字を数に置きかえる","formula":"2 × 3 − 3 × (−2)","body":"負の数を代入するときは、かっこをつけます。かっこがないと、× と − が並んで、符号なのか引き算なのか見分けにくくなります。"},{"title":"かけ算を先に計算する","formula":"2 × 3 = 6\n3 × (−2) = −6","body":"正の数と負の数をかけると、答えは負になります。"},{"title":"引き算をする","formula":"6 − (−6) = 6 + 6 = 12","body":"負の数を引くことは、その数の符号を変えて足すことと同じです。"}]},{"label":"数のついたかっこをはずす","question":"3(2a + b) − 2(a − b) を、かっこをはずして簡単にしてください。","answer":"4a + 5b","alternatives":[{"try":"6a + 3b − 2a − 2b = 4a + b","why_not":"後ろのかっこにかけるのは −2。−2 × (−b) は +2b になる。符号を変え忘れている。"},{"try":"6a + 3b + 2a − 2b = 8a + b","why_not":"−2 を a にかけると −2a、−b にかけると +2b。二つとも符号を取り違えている。"},{"try":"6a + b − 2a − b = 4a","why_not":"かっこの外の数は、かっこの中のすべての項にかける。b と −b にかけ忘れている。"}],"steps":[{"title":"前のかっこをはずす","formula":"3(2a + b)\n= 3 × 2a + 3 × b\n= 6a + 3b","body":"かっこの外の3を、中の 2a と b の両方にかけます（分配法則）。3 × 2a は、係数の2に3をかけて 6a です。"},{"title":"後ろのかっこをはずす","formula":"−2(a − b)\n= (−2) × a + (−2) × (−b)\n= −2a + 2b","body":"a − b は a + (−b) と同じなので、かっこの中の項は a と −b です。かけるのは2ではなく −2 です。負の数どうしをかけると正になるので、−b の項は +2b になります。"},{"title":"同類項をまとめる","formula":"6a + 3b − 2a + 2b\n= (6 − 2)a + (3 + 2)b\n= 4a + 5b","body":"a の項どうし、b の項どうしで、係数を足し引きします。a の項と b の項は、まとめられません。"},{"title":"数を入れて、もとの式と同じ値になるか確かめる","formula":"a が 2、b が 1 のとき\nもとの式：3 × (2 × 2 + 1) − 2 × (2 − 1) = 13\n答えの式：4 × 2 + 5 × 1 = 13","body":"もとの式でも答えの式でも13になります。一組の数で合っただけでは正しいと言い切れませんが、合わなければ必ずどこかが間違っています。確かめる数は、かっこの中が0にならないものを選びます。"}]},{"label":"数のついていないかっこをはずす","question":"(5x + 3) − (2x − 4) を、かっこをはずして簡単にしてください。","answer":"3x + 7","alternatives":[{"try":"5x + 3 − 2x − 4 = 3x − 1","why_not":"前が − のかっこは、中のすべての項の符号を変える。−4 は +4 になる。"},{"try":"5x + 3 − 2x + 4 = 10x","why_not":"文字の項と数だけの項は、別々にまとめる。3x と 7 は、一つにまとめられない。"}],"steps":[{"title":"前のかっこをはずす","formula":"(5x + 3) = 5x + 3","body":"前に何もついていないかっこ（前が + と同じ）は、そのままはずせます。"},{"title":"後ろのかっこをはずす","formula":"−(2x − 4)\n= −2x + 4","body":"前が − のかっこは、中のすべての項の符号を変えてはずします。2x は −2x に、−4 は +4 になります。−1 をかっこの中の全部にかけるのと同じです。"},{"title":"文字の項と、数だけの項を、別々にまとめる","formula":"5x + 3 − 2x + 4\n= (5 − 2)x + (3 + 4)\n= 3x + 7","body":"x の項どうし、数だけの項どうしで計算します。3x と 7 は種類が違うので、これ以上まとめられません。"},{"title":"数を入れて、もとの式と同じ値になるか確かめる","formula":"x が 3 のとき\nもとの式：(5 × 3 + 3) − (2 × 3 − 4) = 16\n答えの式：3 × 3 + 7 = 16","body":"もとの式は 18 − 2 で16、答えの式も16です。"}]},{"label":"式に式を代入する","question":"y = x + 2 という関係があります。3y − x を、x だけを使った式で表し、かっこをはずして簡単にしてください。","answer":"2x + 6","alternatives":[{"try":"3x + 2 − x = 2x + 2","why_not":"かっこをつけずに代入している。3 は y の全体、つまり x + 2 の全体にかかるので、3(x + 2) とする。"},{"try":"3(x + 2) − x = 3x + 6 − x = 4x + 6","why_not":"3x − x は、係数を 3 − 1 と引いて 2x。足してしまっている。"}],"steps":[{"title":"省かれている × を書き戻す","formula":"3y − x\n= 3 × y − x","body":"y のところに、別の式を入れられる形にします。"},{"title":"y を、x + 2 に置きかえる","formula":"3 × (x + 2) − x\n= 3(x + 2) − x","body":"等式 y = x + 2 は、y と x + 2 が同じ量であることを表しています。入れる式が足し算でできているので、かっこをつけます。"},{"title":"かっこをはずす","formula":"3(x + 2) − x\n= 3x + 6 − x","body":"かっこの外の3を、中の x と 2 の両方にかけます。"},{"title":"同類項をまとめる","formula":"3x − x + 6\n= (3 − 1)x + 6\n= 2x + 6","body":"同類項がとなりに来るように、項の順を入れかえます。x の係数は1なので、3x − x は 2x です。"},{"title":"数を入れて確かめる","formula":"x が 1 のとき\ny：1 + 2 = 3\nもとの式：3 × 3 − 1 = 8\n答えの式：2 × 1 + 6 = 8","body":"先に y を求めてからもとの式に入れた値と、答えの式に x を入れた値が、どちらも8になります。"}]}]}},"math-linear-eq":{"id":"math-linear-eq","name":"方程式","type":"learn","goal":"一次方程式を解き、文章題に使える。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","featured":true,"trunk":5,"check":"3x + 5 = 20 のとき、x を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"方程式は、まだわかっていない数を文字 x で表し、等号（=）で結んだ式です。式を成り立たせる x の値を「解」といい、解を求めることを「方程式を解く」といいます。等式は、両辺に同じ数を足しても、引いても、かけても、0でない同じ数で割っても成り立ちます。この性質を使って、x だけが左辺に残る形に変えていきます。文章題では、求めたい数を x と置いて、問題文の関係を方程式に表します。","example":"2x + 7 = 15\n2x = 15 − 7\n2x = 8\nx = 4","note":"2行目では、左辺の +7 を符号を変えて右辺に移しています（移項）。x = 4 を元の式に入れると 2 × 4 + 7 = 15 で、成り立ちます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-letters","level":"must"}]},"math-linear-fn":{"id":"math-linear-fn","name":"一次関数","type":"learn","goal":"傾きと切片から式を作り、グラフを書ける。","part_of":"math-school","tags":["jhmath","func"],"status":"draft","trunk":6,"check":"2点 (0, 1) と (2, 5) を通る直線の式を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"y が x の一次式 y = ax + b で表されるとき、y は x の一次関数であるといいます。a は「傾き」で、x が1増えたときに y がどれだけ増えるかを表します。b は「切片」で、x = 0 のときの y の値です。グラフは直線になり、点（0, b）を通って、右へ1進むごとに上へ a 進みます（a が負のときは下へ進みます）。比例 y = ax は、b = 0 の特別な場合です。","example":"y = 2x + 3\nx = 0 のとき y = 3\nx = 1 のとき y = 5\nx = 2 のとき y = 7","note":"傾きは2、切片は3です。x が1増えるごとに、y は2ずつ増えています。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-proportion","level":"helps"}]},"math-muldiv":{"id":"math-muldiv","name":"かけ算わり算","type":"learn","goal":"九九を使って、筆算のかけ算とわり算ができる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","trunk":2,"check":"36 × 24 を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"かけ算は、同じ数を何回も足す計算をまとめたものです。わり算はその逆で、ある数を同じ数ずつに分けると何個分になるか、または何個かに等しく分けると1個分がいくつになるかを求めます。1けたどうしのかけ算（九九）を覚えておくと、けた数の多い計算も位ごとに分けて筆算でできます。","example":"24 × 3 = 72\n72 ÷ 3 = 24\n17 ÷ 5 = 3 あまり 2","note":"かけ算の答えをかけた数で割ると、もとの数に戻ります。割り切れないときは、あまりが出ます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"72 ÷ 8 は？","options":["8","9","12"],"answer":1,"explanation":"8 × 9 = 72 なので、72 ÷ 8 = 9。"},"practice":{"title":"位ごとに分けて、かけ算とわり算をする","lead":"九九で求められる形に、分けてから計算する。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"2けた×1けたのかけ算","question":"37 × 6 を計算してください。","answer":"222","steps":[{"title":"かけられる数を、十の位と一の位に分ける","formula":"37 = 30 + 7","body":"37 × 6 は、30 × 6 と 7 × 6 を合わせたものです。分けると、九九をもとに計算できます。"},{"title":"一の位にかける","formula":"7 × 6 = 42","body":"九九の「七六 42」です。"},{"title":"十の位にかける","formula":"30 × 6 = 180","body":"十が3つの6倍なので、十が18個、つまり180です。九九の「三六 18」に0を一つ付けます。"},{"title":"二つの答えを足す","formula":"180 = 100 + 80\n80 + 42 = 122\n100 + 122 = 222","body":"180を100と80に分け、80と42を先に足します。けたが増えても、位ごとに足してくり上げるやり方は2けたのときと同じです。筆算では、42の「4」を十の位にくり上げて書きますが、していることは同じです。"},{"title":"わり算で、もとの数に戻るか確かめる","formula":"222 ÷ 6 = 37","body":"答えをかけた数で割ると、もとの37に戻ります（わり算の進め方は、3問目で扱います）。"}]},{"label":"2けた×2けたのかけ算","question":"43 × 25 を計算してください。","answer":"1,075","steps":[{"title":"かける数を、十の位と一の位に分ける","formula":"25 = 20 + 5","body":"43 × 25 は、43 × 5 と 43 × 20 を合わせたものです。筆算の1段目と2段目に当たります。"},{"title":"一の位の5をかける（筆算の1段目）","formula":"3 × 5 = 15\n40 × 5 = 200\n200 + 15 = 215","body":"43を40と3に分けて、それぞれに5をかけて足します。"},{"title":"十の位の20をかける（筆算の2段目）","formula":"43 × 2 = 86\n43 × 20 = 860","body":"20倍は、2倍してから10倍することと同じです。筆算で2段目を左に一つずらして書くのは、この10倍のためです。"},{"title":"1段目と2段目を足す","formula":"215 + 860 = 1,075","body":"5倍した分と20倍した分を合わせると、25倍になります。百の位は 200 + 800 = 1,000、十の位と一の位は 15 + 60 = 75 です。"},{"title":"分け方を変えて確かめる","formula":"4 × 25 = 100\n40 × 25 = 1,000\n3 × 25 = 75\n1,000 + 75 = 1,075","body":"今度は43の方を40と3に分けました。40倍は、4倍してから10倍します。4 × 25 は、25を4回足すと100です。同じ1,075になります。"}]},{"label":"あまりのあるわり算","question":"りんごが92個あります。1箱に6個ずつ入れると、箱は何箱できて、りんごは何個あまるでしょうか。","answer":"15箱できて、2個あまる","steps":[{"title":"場面を式で置く","formula":"92 ÷ 6","body":"92個を6個ずつに分けると何個分になるかを求めるので、わり算です。"},{"title":"十の位から割る","formula":"6 × 10 = 60\n92 − 60 = 32","body":"92の十の位は9です。9の中に6は1回入るので、まず10箱できます。10箱で60個を使い、32個が残ります。"},{"title":"残りを割る","formula":"6 × 5 = 30\n32 − 30 = 2","body":"32の中に6は5回入ります（六五 30）。6回だと36で、32を超えてしまいます。さらに5箱できて、2個が残ります。"},{"title":"箱の数とあまりをまとめる","formula":"10 + 5 = 15\n92 ÷ 6 = 15 あまり 2","body":"箱は合わせて15箱です。残りの2個は6個に足りないので、もう1箱は作れません。あまりは、いつも割る数より小さくなります。"},{"title":"かけ算とたし算で、もとの数に戻るか確かめる","formula":"6 × 15 = 90\n90 + 2 = 92","body":"箱に入れた分とあまりを合わせると、はじめの92個になります。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/arithmetic","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-negative":{"id":"math-negative","name":"正負の数","type":"learn","goal":"負の数を含む四則計算ができる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","trunk":4,"check":"(−3) × 4 − (−6) を計算する","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"0より小さい数を負の数といい、−3のように「−」をつけて表します。0より大きい数は正の数です。数直線では0を境に右が正、左が負で、右にある数ほど大きくなります。負の数を足すことは引くことと同じで、負の数を引くことは足すことと同じです。かけ算とわり算では、符号が同じ二つの数なら答えは正、違えば負になります。","example":"3 + (−5) = −2\n3 − (−5) = 8\n(−4) × (−2) = 8\n(−12) ÷ 4 = −3","note":"負の数は、かっこをつけて書くと、符号と計算の記号を見分けやすくなります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"}]},"math-probability":{"id":"math-probability","name":"確率","type":"learn","goal":"樹形図を書いて、場合の数と確率を求められる。","part_of":"math-school","tags":["jhmath","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"確率は、あることがらの起こりやすさを0から1までの数で表したものです。どの結果も同じ程度に起こると考えられるとき、「そのことがらが起こる場合の数 ÷ 起こり得るすべての場合の数」で求めます。すべての場合を漏れなく重なりなく数えるために、枝分かれの図（樹形図）や表を使います。必ず起こることの確率は1、決して起こらないことの確率は0です。","example":"さいころを1回投げて3の倍数の目が出る確率：2 ÷ 6 = 1/3\n硬貨を2回投げたときの出方：表表、表裏、裏表、裏裏 の4通り\n2回とも表が出る確率：1 ÷ 4 = 1/4","note":"3の倍数の目は3、6の2通り、すべての目は6通りです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"公平な6面サイコロで偶数が出る確率は？","options":["1/6","1/3","1/2"],"answer":2,"explanation":"同じ確からしさの6通りのうち、2・4・6の3通り。3/6 = 1/2。"},"practice":{"title":"すべての場合を書き出して、確率を求める","lead":"漏れなく、重なりなく数える。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"硬貨を3回投げる","question":"1枚の硬貨を3回投げます。表がちょうど2回出る確率を求めてください。表と裏の出やすさは同じとします。","answer":"3/8","steps":[{"title":"樹形図をかいて、すべての出方を書き出す","formula":"1回目が表：表表表、表表裏、表裏表、表裏裏\n1回目が裏：裏表表、裏表裏、裏裏表、裏裏裏","body":"1回目の表・裏からそれぞれ2本の枝を出し、2回目、3回目も同じように枝分かれさせます。枝を1回目から3回目までたどると、出方が一つ決まります。枝の先を上から順に書き出します。"},{"title":"すべての場合の数を数える","formula":"2 × 2 × 2 = 8","body":"1回ごとに2通りに枝分かれするので、枝の先は8本です。書き出した数とも合います。この8通りは、どれも同じ程度に起こります。"},{"title":"表がちょうど2回の出方を選ぶ","formula":"表表裏、表裏表、裏表表 → 3通り","body":"表表表は表が3回なので、「ちょうど2回」には入りません。"},{"title":"場合の数どうしを割って、確率を求める","formula":"3 ÷ 8 = 3/8","body":"確率は、そのことがらが起こる場合の数÷すべての場合の数です。"},{"title":"表の回数ごとに分けて、合計が8通りになるか確かめる","formula":"表が3回：1通り\n表が2回：3通り\n表が1回：3通り\n表が0回：1通り\n1 + 3 + 3 + 1 = 8","body":"表の回数で分けると、8通りがどれか一つに必ず入ります。合計が8になり、樹形図で書き出した数と合います。"}]},{"label":"さいころを2個投げる","question":"大小二つのさいころを同時に投げます。出た目の和が8になる確率を求めてください。どの目の出やすさも同じとします。","answer":"5/36","steps":[{"title":"すべての場合の数を数える","formula":"6 × 6 = 36","body":"大きいさいころの目6通りのそれぞれに、小さいさいころの目が6通りあります。縦6行、横6列の表にすると、ます目は36個です。"},{"title":"和が8になる組を、大きいさいころの目の順に書き出す","formula":"（大、小）＝（2、6）、（3、5）、（4、4）、（5、3）、（6、2）","body":"大きいさいころが1のとき、小さいさいころは7が必要ですが、7の目はありません。2から6までは、それぞれ1通りずつあります。"},{"title":"和が8になる場合の数を数える","formula":"和が8になる組：5通り","body":"（3、5）と（5、3）は、どちらのさいころがどの目かが違うので、別の場合として数えます。（4、4）は1通りだけです。"},{"title":"場合の数どうしを割って、確率を求める","formula":"5 ÷ 36 = 5/36","body":"5と36の両方を割り切る数は1しかないので、これ以上約分できません。"},{"title":"書き出した組の和を、一つずつ確かめる","formula":"2 + 6 = 8\n3 + 5 = 8\n4 + 4 = 8\n5 + 3 = 8\n6 + 2 = 8","body":"五つの組は、どれも和が8になっています。"}]},{"label":"袋から玉を2個取り出す","question":"袋の中に、赤い玉が2個、白い玉が3個入っています。この中から同時に2個を取り出すとき、2個とも白い玉である確率を求めてください。どの玉の取り出しやすさも同じとします。","answer":"3/10","steps":[{"title":"同じ色の玉にも、名前を付けて区別する","formula":"赤い玉：赤1、赤2\n白い玉：白1、白2、白3","body":"同じ色でも、別々の玉です。区別しないで数えると、どの場合も同じ程度に起こるとは言えなくなります。"},{"title":"2個の組を、樹形図で書き出す","formula":"赤1と組む：赤2、白1、白2、白3\n赤2と組む：白1、白2、白3\n白1と組む：白2、白3\n白2と組む：白3","body":"同時に取り出すので、「赤1と白1」と「白1と赤1」は同じ組です。すでに書いた組をもう一度書かないよう、後ろの玉とだけ組ませます。"},{"title":"すべての場合の数を数える","formula":"4 + 3 + 2 + 1 = 10","body":"2個の組は、全部で10通りです。"},{"title":"2個とも白い組を選ぶ","formula":"白1と白2、白1と白3、白2と白3 → 3通り","body":"書き出した10通りのうち、赤い玉を含まない組です。"},{"title":"場合の数どうしを割って、確率を求める","formula":"3 ÷ 10 = 3/10","body":"小数で表すと0.3です。"},{"title":"色の組み合わせごとに分けて、合計が10通りになるか確かめる","formula":"2個とも赤：1通り\n赤と白が1個ずつ：2 × 3 = 6\n2個とも白：3通り\n1 + 6 + 3 = 10","body":"赤と白が1個ずつの組は、赤2個のそれぞれに白3個を組ませるので6通りです。三つの場合を足すと10通りになり、書き出した数と合います。"}]}]}},"math-proportion":{"id":"math-proportion","name":"比例と反比例","type":"learn","goal":"比例と反比例を、式とグラフで表せる。","part_of":"math-school","tags":["jhmath","func"],"also_tags":["sansu"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"ともなって変わる二つの量 x と y があり、x が2倍、3倍になると y も2倍、3倍になる関係を比例といい、式は y = ax で表せます。反対に、x が2倍、3倍になると y が1/2、1/3になる関係を反比例といい、式は y = a/x で表せます。a は決まった数で、比例定数といいます。比例のグラフは原点を通る直線、反比例のグラフは双曲線という二本のなめらかな曲線になります。","example":"比例の例：y = 3x\n　x = 2 のとき y = 6、x = 4 のとき y = 12\n反比例の例：y = 12/x\n　x = 2 のとき y = 6、x = 4 のとき y = 3","note":"比例では y ÷ x が、反比例では x × y が、いつも同じ値（比例定数）になります。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-ratio","level":"must"}]},"math-pythagoras":{"id":"math-pythagoras","name":"三平方の定理","type":"learn","goal":"直角三角形の辺の長さを求められる。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"直角三角形で、直角をはさむ二辺の長さを a、b、直角の向かいにあるいちばん長い辺（斜辺）の長さを c とすると、a² + b² = c² が成り立ちます。これを三平方の定理といいます。二辺の長さがわかれば、残りの一辺の長さを求められます。逆に、三辺の長さがこの式を満たす三角形は、直角三角形です。","example":"a = 3、b = 4 のとき\n3² + 4² = 9 + 16 = 25\nc² = 25 なので c = 5","note":"辺の長さが3、4、5の三角形は、直角三角形です。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-sqrt","level":"must"},{"id":"math-congruence","level":"helps"}]},"math-quadratic-eq":{"id":"math-quadratic-eq","name":"二次方程式","type":"learn","goal":"因数分解と解の公式で、二次方程式を解ける。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"移項して整理すると ax² + bx + c = 0（a は0でない）の形になる方程式を、二次方程式といいます。x の2乗の項があるのが特徴で、解はふつう二つあります。左辺を因数分解できるときは、「二つの数をかけて0になるなら、どちらかは0」という性質を使って解きます。因数分解できないときは、解の公式に a、b、c の値を当てはめて求めます。","example":"x² − 5x + 6 = 0\n(x − 2)(x − 3) = 0\nx = 2、x = 3\n解の公式：x = (−b ± √(b² − 4ac)) ÷ (2a)","note":"x = 2 のとき 4 − 10 + 6 = 0、x = 3 のとき 9 − 15 + 6 = 0 となり、どちらも式を成り立たせます。"},"cost":{"hours":20,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"},{"id":"math-sqrt","level":"must"}]},"math-quadratic-fn":{"id":"math-quadratic-fn","name":"二次関数","type":"learn","goal":"放物線のグラフを書き、変化の割合を求められる。","part_of":"math-school","tags":["jhmath","func"],"status":"draft","featured":true,"trunk":7,"check":"y = 2x² で、x が 1 から 3 まで増えるときの変化の割合を求める","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"y が x の2乗に比例し、y = ax² の形で表される関数です。グラフは原点を頂点とし、y 軸について左右対称な「放物線」というなめらかな曲線になります。a が正なら上に開き、a が負なら下に開きます。一次関数と違い、x が1増えたときの y の増え方は一定ではありません。x の増加量に対する y の増加量の割合を「変化の割合」といい、区間ごとに計算します。","example":"y = 3x²\nx = 1 のとき y = 3\nx = 2 のとき y = 12\nx = 3 のとき y = 27\nx が1から3まで増えるときの変化の割合：(27 − 3) ÷ (3 − 1) = 12","note":"x が1から2では y は9増え、2から3では15増えます。増え方が一定でないことがわかります。"},"cost":{"hours":25,"yen":0},"requires":[{"id":"math-linear-fn","level":"must"},{"id":"math-quadratic-eq","level":"helps"}]},"math-ratio":{"id":"math-ratio","name":"割合と比","type":"learn","goal":"百分率と比を使って、もとの量や比べる量を求められる。","part_of":"math-school","tags":["sansu","num"],"status":"draft","featured":true,"concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"割合は、ある量が基準の量の何倍にあたるかを表す数です。「比べる量 ÷ 基準の量」で求め、0.25を25%（百分率）のように表します。比は、二つの量の大きさの関係を「3：2」のように並べて表したものです。どちらも、何を基準にしているかを先に確かめることが大切です。","example":"割合を求める：30 ÷ 120 = 0.25\n比べる量を求める：120 × 0.25 = 30\n基準の量を求める：30 ÷ 0.25 = 120\n比を簡単にする：6：4 は 3：2 と同じ","note":"上の三つの式は、「120人のうちの30人は25%」という同じ関係を表しています。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"800円の15%はいくら？","options":["120円","150円","680円"],"answer":0,"explanation":"15% = 0.15。800 × 0.15 = 120円。"},"practice":{"title":"基準を確かめて、割合と比で求める","lead":"何を1（100%）とするかを、先に決める。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"比べる量を求める","question":"定員240人の会場に、定員の85%にあたる人が入場しました。入場したのは何人でしょうか。","answer":"204人","steps":[{"title":"基準の量と割合を置く","formula":"基準の量：240人（定員）\n割合：85%\n求めるもの：比べる量（入場した人数）","body":"「定員の85%」なので、基準（100%）は定員の240人です。"},{"title":"百分率を小数に直す","formula":"85 ÷ 100 = 0.85","body":"百分率は、基準の量を100としたときに、比べる量がいくつにあたるかを表す数です。計算に使うときは、100で割って小数に直します。"},{"title":"基準の量に割合をかける","formula":"240 × 0.85 = 204","body":"比べる量は、基準の量×割合で求めます。"},{"title":"求めた人数が、定員の85%になっているか確かめる","formula":"204 ÷ 240 = 0.85","body":"入場した人数を定員で割ると0.85で、85%です。100%より小さい割合なので、答えが定員より少ないことも合っています。"}]},{"label":"基準の量を求める","question":"ある本を72ページ読みました。これは、本全体のページ数の40%にあたります。本全体は何ページでしょうか。","answer":"180ページ","steps":[{"title":"わかっている量と割合を置く","formula":"比べる量：72ページ（読んだ分）\n割合：40%\n求めるもの：基準の量（全体のページ数）","body":"「全体の40%」なので、基準は全体のページ数です。今回は、その基準の方がわかっていません。"},{"title":"関係を、言葉の式で表す","formula":"全体 × 0.4 = 72","body":"40%は小数で0.4です。全体に0.4をかけると、読んだ72ページになります。"},{"title":"比べる量を割合で割って、全体を求める","formula":"72 ÷ 0.4 = 180","body":"かけ算の逆なので、72を0.4で割ります。72 × 0.4 としてしまうと、72ページより少なくなり、全体のページ数になりません。"},{"title":"全体の40%が、72ページになるか確かめる","formula":"180 × 0.4 = 72","body":"180ページの40%は72ページで、問題の条件に合います。"}]},{"label":"比で分ける","question":"赤いリボンと白いリボンの長さの比は 3：5 で、合わせると120cmです。赤いリボンは何cmでしょうか。","answer":"45cm","steps":[{"title":"比と、合計の長さを置く","formula":"赤：白 = 3：5\n合計の長さ：120cm","body":"比の 3：5 は、赤を3つ分とすると白が5つ分になる、という関係です。1つ分の長さはまだわかりません。"},{"title":"合計が、いくつ分にあたるかを求める","formula":"3 + 5 = 8","body":"赤の3つ分と白の5つ分を合わせると、全体は8つ分です。"},{"title":"1つ分の長さを求める","formula":"120 ÷ 8 = 15","body":"8つ分が120cmなので、1つ分は15cmです。"},{"title":"赤いリボンの長さを求める","formula":"15 × 3 = 45","body":"赤は3つ分です。"},{"title":"白の長さも求めて、合計と比を確かめる","formula":"15 × 5 = 75\n45 + 75 = 120","body":"赤45cmと白75cmで、合わせて120cmです。45と75をどちらも15で割ると3と5になり、比も 3：5 に合います。"}]}]},"resources":[{"title":"Khan Academy：計算の解説と練習（英語）","url":"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-fractions-decimals","free":true,"assumes":"英語の教材です。英語が難しければ、上の確認問題の解説から始められます。","checked_at":"2026-10-06"}]},"math-shapes":{"id":"math-shapes","name":"形と長さ","type":"learn","goal":"基本の図形を見分け、ものさしで長さを測れる。","part_of":"math-school","tags":["sansu","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"身の回りの形は、辺（まっすぐな線）と頂点（かど）の数で見分けられます。三角形は辺が3本、四角形は辺が4本です。四つのかどがすべて直角の四角形を長方形、さらに辺の長さがすべて等しいものを正方形といいます。長さは、ものさしの目盛りを使って、cm（センチメートル）やmm（ミリメートル）の単位で測ります。","example":"三角形：辺3本、頂点3個\n四角形：辺4本、頂点4個\n1cm = 10mm\n1m = 100cm","note":"単位をそろえると、長さどうしを比べたり足したりできます。"},"cost":{"hours":8,"yen":0}},"math-similarity":{"id":"math-similarity","name":"相似","type":"learn","goal":"相似条件を使って、辺の長さの比を求められる。","part_of":"math-school","tags":["jhmath","geo"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"一方の図形を、形を変えずに拡大または縮小するともう一方とぴったり重なるとき、二つの図形は相似であるといい、記号 ∽ で表します。相似な図形では、対応する辺の長さの比がすべて等しく、対応する角の大きさはそれぞれ等しくなります。対応する辺の長さの比を相似比といいます。三角形は、次のどれか一つが成り立てば相似だと言えます。三組の辺の比がすべて等しい。二組の辺の比とその間の角がそれぞれ等しい。二組の角がそれぞれ等しい。","example":"△ABC ∽ △DEF、相似比 1：2\nAB = 3 のとき DE = 6\nBC = 4 のとき EF = 8","note":"相似比が1：2なら、△DEF の辺は、対応する △ABC の辺のどれも2倍の長さです。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-congruence","level":"must"}]},"math-simultaneous":{"id":"math-simultaneous","name":"連立方程式","type":"learn","goal":"加減法と代入法で、連立方程式を解ける。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二つの文字 x と y を含む方程式を二つ組にしたものを、連立方程式といいます。方程式が一つだけでは x と y の組は一つに決まりませんが、二つの式を同時に成り立たせる組は、ふつう一つに決まります。その組を連立方程式の解といいます。解くときは、二つの式を足したり引いたりして文字を一つ消す加減法か、一方の式をもう一方に代入して文字を一つ消す代入法を使います。","example":"x + y = 5　…①\nx − y = 1　…②\n①と②を足すと 2x = 6 なので x = 3\n①に x = 3 を代入すると 3 + y = 5 なので y = 2","note":"x = 3、y = 2 は、①と②の両方を成り立たせます。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"math-linear-eq","level":"must"}],"practice":{"title":"二つの式から、二つの数を求める","lead":"文字を一つ消してから、一つずつ求める。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"代入法で解く","question":"次の連立方程式を解いてください。\ny = 2x + 1　…①\n3x + y = 16　…②","answer":"x = 3、y = 7","steps":[{"title":"二つの式の形を見て、解き方を決める","formula":"y = 2x + 1　…①\n3x + y = 16　…②","body":"①は「y =」の形になっています。②の y を①の右辺で置きかえれば、y が消えて x だけの式になります。この方法が代入法です。"},{"title":"①を②に代入する","formula":"3x + (2x + 1) = 16","body":"②の y のところに、①の右辺 2x + 1 をかっこをつけて入れます。"},{"title":"x だけの方程式を解く","formula":"5x + 1 = 16\n5x = 15\nx = 3","body":"x の項どうしをまとめます（3x + 2x = 5x）。+1 を右辺に移項し、両辺を5で割ります。"},{"title":"x = 3 を①に戻して、y を求める","formula":"y = 2 × 3 + 1\ny = 7","body":"①は y を求める形になっているので、①に入れるのが簡単です。"},{"title":"求めた組が、②も成り立たせるか確かめる","formula":"3 × 3 + 7 = 16","body":"y は①から求めたので、①は成り立っています。②に入れても成り立つので、x = 3、y = 7 が解です。"}]},{"label":"加減法で解く","question":"次の連立方程式を解いてください。\n2x + 3y = 12　…①\n3x − 2y = 5　…②","answer":"x = 3、y = 2","steps":[{"title":"二つの式の形を見て、解き方を決める","formula":"2x + 3y = 12　…①\n3x − 2y = 5　…②","body":"どちらの式も「x =」「y =」の形ではないので、式どうしを足し引きして文字を消す加減法を使います。そのままでは x も y も係数がそろっていません。"},{"title":"y の係数をそろえるため、①を2倍、②を3倍する","formula":"4x + 6y = 24　…①×2\n9x − 6y = 15　…②×3","body":"等式の両辺に同じ数をかけても、等式は成り立ちます。右辺にもかけ忘れないようにします。y の係数が +6 と −6 になり、符号だけが逆なので、足すと消えます。"},{"title":"二つの式を足して、x を求める","formula":"(4x + 6y) + (9x − 6y) = 24 + 15\n13x = 39\nx = 3","body":"左辺どうし、右辺どうしを足します。x の項どうしをまとめると 4x + 9x = 13x、6y と −6y は打ち消し合い、x だけの式になります。"},{"title":"x = 3 を①に戻して、y を求める","formula":"2 × 3 + 3y = 12\n3y = 6\ny = 2","body":"もとの式のどちらに入れてもかまいません。ここでは①に入れます。"},{"title":"求めた組が、二つの式を成り立たせるか確かめる","formula":"2 × 3 + 3 × 2 = 12\n3 × 3 − 2 × 2 = 5","body":"①と②の両方が成り立つので、x = 3、y = 2 が解です。"}]},{"label":"文章から式を二つ立てる","question":"1個120円のりんごと1個80円のみかんを、合わせて15個買いました。代金の合計は1,440円でした。りんごとみかんを、それぞれ何個買ったでしょうか。","answer":"りんごは6個、みかんは9個","steps":[{"title":"求めたい二つの数を x、y と置く","formula":"x：りんごの個数\ny：みかんの個数","body":"わからない数が二つあるので、文字を二つ使います。"},{"title":"個数の関係と、代金の関係を式にする","formula":"x + y = 15　…①\n120x + 80y = 1,440　…②","body":"問題文には、個数の合計と代金の合計の二つの条件があります。条件一つにつき、式を一つ立てます。"},{"title":"y の係数をそろえるため、①を80倍する","formula":"80x + 80y = 1,200　…①×80","body":"②の y の係数は80です。①の両辺を80倍すると、y の係数がそろいます。"},{"title":"②から、80倍した①を引いて、x を求める","formula":"(120x + 80y) − (80x + 80y) = 1,440 − 1,200\n40x = 240\nx = 6","body":"左辺どうし、右辺どうしを引きます。120x − 80x = 40x、80y − 80y = 0 となり、x だけの式になります。式どうしを引くので、加減法です。"},{"title":"x = 6 を①に戻して、y を求める","formula":"6 + y = 15\ny = 9","body":"係数の小さい①に入れると、計算が簡単です。"},{"title":"個数と代金の両方で確かめる","formula":"6 + 9 = 15\n120 × 6 + 80 × 9 = 1,440","body":"合わせて15個、代金は1,440円で、どちらの条件にも合います。個数として0以上の整数になっていることも確かめます。"}]}]}},"math-sqrt":{"id":"math-sqrt","name":"平方根","type":"learn","goal":"根号を含む式の計算ができる。","part_of":"math-school","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"2乗すると a になる数を、a の平方根といいます。正の数の平方根は正と負の二つあり、9の平方根は3と−3です。a の平方根のうち正のほうを、記号 √（ルート）を使って √a と書き、負のほうは −√a と書きます。たとえば √9 = 3 です。2の平方根は整数や分数で表せないので、√2 と −√2 のまま書きます。√2 は約1.414で、小数がどこまでも続く数です。√ の中の数に、ある数の2乗がかけ算の形で含まれていれば、その数を √ の外に出して簡単にできます。","example":"√9 = 3\n√12 = √(4 × 3) = 2√3\n√2 × √3 = √6\n3√2 + 2√2 = 5√2","note":"√12 の中の4は2の2乗なので、2として外に出せます。"},"cost":{"hours":12,"yen":0},"requires":[{"id":"math-negative","level":"must"}]},"math-table":{"id":"math-table","name":"表とグラフ","type":"learn","goal":"表にまとめ、棒グラフと折れ線グラフを読める。","part_of":"math-school","tags":["sansu","data"],"status":"draft","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表は、調べたことを項目ごとに整理して数を並べたものです。棒グラフは棒の長さで数量の大小を比べるのに向いています。折れ線グラフは点を線で結んだもので、時間とともに変わる様子を見るのに向いています。どちらのグラフも、縦の軸の1目盛りがいくつを表すかを最初に確かめてから読みます。","example":"月：4月、5月、6月\n来客数：120人、150人、135人\n4月から5月：150 − 120 = 30（30人増えた）\n5月から6月：150 − 135 = 15（15人減った）","note":"折れ線グラフにすると、5月が山になる形になります。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-addsub","level":"must"},{"id":"math-muldiv","level":"helps"}],"assessment":{"question":"販売数は月曜12個、火曜18個、水曜15個。最も多い曜日は？","options":["月曜","火曜","水曜"],"answer":1,"explanation":"同じ単位の値を比較する。18個の火曜が最大。"},"practice":{"title":"表にまとめ、グラフから数を読み取る","lead":"見出しと1目盛りの大きさを、先に確かめる。","original":true,"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"調べた結果を表にまとめる","question":"12人に好きな果物を一つずつたずねたところ、答えは順に次のとおりでした。\nりんご、みかん、りんご、ぶどう、みかん、りんご、りんご、ぶどう、みかん、りんご、みかん、りんご\n果物ごとの人数を表にまとめてください。いちばん多いのはどの果物で、何人でしょうか。","answer":"りんごが6人でいちばん多い（みかん4人、ぶどう2人）","steps":[{"title":"表の項目を決める","formula":"項目：りんご、みかん、ぶどう\n数えるもの：人数","body":"答えに出てくる果物は3種類です。果物を行の見出しにして、人数を書く列を作ります。"},{"title":"答えを前から一つずつ見て、数える","formula":"りんご：1、3、6、7、10、12番目 → 6人\nみかん：2、5、9、11番目 → 4人\nぶどう：4、8番目 → 2人","body":"前から順に見て、果物ごとに何番目の答えかを書き出します。数え終わった答えに印を付けていくと、数え落としや二重に数えることを防げます。"},{"title":"表に書き、合計がたずねた人数と合うか確かめる","formula":"果物 | 人数\nりんご | 6\nみかん | 4\nぶどう | 2\n合計 | 12\n6 + 4 + 2 = 12","body":"数えた人数を表に書き、いちばん下に合計の行を付け加えます。3種類の人数を足すと12人で、たずねた人数と同じです。合わなければ、どこかで数え間違えています。"},{"title":"表から、いちばん多い果物を読み取る","formula":"6人、4人、2人のうち、いちばん大きい数：6人","body":"表にまとめると、人数を見比べるだけで答えられます。いちばん多いのは、りんごの6人です。"}]},{"label":"棒グラフの目盛りを読む","question":"ある店で売れたパンの数を、曜日ごとに表した棒グラフがあります。縦の軸は1目盛りが10個を表しています。月曜の棒は目盛り7つ分、火曜の棒は目盛り4つ分の高さです。月曜と火曜に売れた数は、それぞれ何個でしょうか。また、どちらが何個多いでしょうか。","answer":"月曜は70個、火曜は40個で、月曜が30個多い","steps":[{"title":"縦の軸の1目盛りが、いくつを表すか確かめる","formula":"1目盛り：10個","body":"棒グラフを読むときは、最初に1目盛りの大きさを確かめます。1目盛りが1個とは限りません。"},{"title":"月曜の棒の高さを、個数に直す","formula":"目盛り7つ分 → 10が7つで、70個","body":"1目盛りが10個なので、目盛り7つ分は70個です。7個と読み間違えないようにします。"},{"title":"火曜の棒の高さを、個数に直す","formula":"目盛り4つ分 → 10が4つで、40個","body":"同じように、目盛り4つ分は40個です。"},{"title":"二つの数を比べて、差を求める","formula":"70 − 40 = 30","body":"棒が高い月曜の方が多く売れています。差は30個です。"},{"title":"目盛りの数の差からも確かめる","formula":"7 − 4 = 3\n目盛り3つ分 → 10が3つで、30個","body":"棒の高さの差は目盛り3つ分で、30個です。先に求めた差と合います。"}]},{"label":"折れ線グラフの変化を読む","question":"ある図書室の、月ごとの貸し出し冊数を表した折れ線グラフがあります。グラフから読み取った数は表のとおりです。前の月と比べて、冊数がいちばん大きく増えたのは何月で、何冊増えたでしょうか。","answer":"7月で、6月から23冊増えた","tables":[{"caption":"折れ線グラフから読み取った貸し出し冊数（冊）","rows":[["月","4月","5月","6月","7月","8月"],["冊数","42","55","48","71","64"]]}],"steps":[{"title":"となり合う月どうしを比べると決める","formula":"比べる組：4月と5月、5月と6月、6月と7月、7月と8月","body":"「前の月と比べて」の増え方をたずねているので、となり合う月どうしを比べます。折れ線グラフでは、線が右上がりなら増え、右下がりなら減っています。傾きが急なほど、変化が大きくなります。"},{"title":"増えたか減ったかを、組ごとに見分ける","formula":"4月から5月：42 → 55（増えた）\n5月から6月：55 → 48（減った）\n6月から7月：48 → 71（増えた）\n7月から8月：71 → 64（減った）","body":"増えたのは、5月と7月の二回です。"},{"title":"増えた二回について、増えた冊数を求める","formula":"55 − 42 = 13\n71 − 48 = 23","body":"後の月の冊数から、前の月の冊数を引きます。"},{"title":"増えた冊数を比べる","formula":"13冊と23冊のうち、大きい方：23冊","body":"いちばん大きく増えたのは、6月から7月にかけての23冊です。"},{"title":"増減を順にたどって、8月の冊数になるか確かめる","formula":"55 − 48 = 7\n71 − 64 = 7\n42 + 13 − 7 + 23 − 7 = 64","body":"減った分は、前の月の冊数から後の月の冊数を引いて求めます。減った二回は、どちらも7冊です。4月の42冊から増減を順にたどると、表の8月の64冊と合います。"}]}]}},"spi-counting":{"id":"spi-counting","name":"順列と組合せ","type":"learn","goal":"並べ方と選び方の数を、式で求められる。","part_of":"spi","tags":["matha","data"],"status":"verifie
