、考え方の型だけです。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"自己分析で、ある強みの候補が本物かを確かめるのに、いちばん役立つのはどれでしょうか。","options":["その強みが出た場面の、具体的な行動と結果を一つ示せるか","その強みを表す言葉が、就職情報サイトの人気の言葉に入っているか","その強みを、友人が一言でほめてくれたことがあるか"],"answer":0,"explanation":"強みは、実際にその行動をとった場面の具体的な行動と結果で裏づけます。人気の言葉かどうかは、その人に当てはまるかとは関係がありません。友人の一言は手がかりにはなりますが、それだけでは、どの場面で何をしたかが示せません。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、好みや流派で答えが割れないかを、就職情報サイトとハローワーク・厚生労働省の資料の記述と照らして確認。制度（若者雇用促進法の職場情報）は厚生労働省の資料で確認。指摘を反映した後に再検証。","title":"経験から強みと価値観を取り出し、エピソードで裏づける","lead":"強みは「何をしたか」、価値観は「何を大事にして選んだか」。言葉にしたら、それが出た場面の具体的な行動と結果で裏づける。","original":true,"problems":[{"label":"強みを裏づけるエピソードを選ぶ","question":"自己分析で、自分の強みを「目標から逆算して計画を立て、遅れを取り戻しながら進められること」と言葉にしました。この強みの裏づけとして、最も適切なものはどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"私は責任感が強く、一度引き受けたことは何があっても最後までやり遂げる人間です。","correct":false,"reason":"抽象的な自己評価で、いつ、どの場面で、何をしたかが書かれていない。しかも「責任感」は、計画を立てて進める強みとは別の強みの語。裏づけになる具体的な行動と結果がない。"},{"key":"B","text":"資格試験の3か月前に、試験範囲を週ごとに割り振った表を作った。毎週末に進み具合を確かめ、遅れた分は翌週の予定に振り替えた。予定どおり全範囲を2回復習して、試験に合格した。","correct":true,"reason":"試験日から逆算した計画（週ごとの表）、遅れの取り戻し方（翌週への振り替え）、結果（全範囲を2回復習して合格）がそろっていて、言葉にした強みの中身と一つずつ対応している。"},{"key":"C","text":"サークルの仲間から、話しかけやすくて相談に乗ってくれる人だと、よく言われる。","correct":false,"reason":"具体的な場面ではなく周りの評価で、いつ何をしたかがない。しかも示しているのは人当たりのよさで、計画を立てて進める強みとは別の強み。"},{"key":"D","text":"将来は、計画を立てる力を生かして、大きなプロジェクトを管理する仕事に就きたい。","correct":false,"reason":"これからの希望で、過去の経験ではない。強みが実際に出た場面を示していないので、裏づけにならない。"}],"steps":[{"title":"強みの言葉を、要素に分ける","formula":"目標から逆算して計画を立てる\n遅れを取り戻しながら進める","body":"裏づけのエピソードには、この二つの行動が実際に出ている必要があります。あわせて、その行動でどうなったかという結果も要ります。"},{"title":"具体的な場面かどうかで分ける","formula":"場面がある：B\n場面がない：A（抽象的な自己評価）、C（周りの評価）、D（将来の希望）","body":"Aは抽象的な自己評価、Cは周りからの評価、Dはこれからの希望です。どれも、過去のどの場面で何をしたかが書かれていません。"},{"title":"残った場面が、強みの要素と対応するか確かめる","formula":"B：週ごとに割り振った表 → 逆算した計画\nB：翌週の予定に振り替え → 遅れの取り戻し\nB：全範囲を2回復習して合格 → 結果","body":"Bは、強みの二つの要素と結果が一つずつ対応しています。Aの「責任感」とCの「相談に乗ってくれる」は、そもそも別の強みを指しています。答えはBです。"}]},{"label":"強みと価値観を区別する","question":"自己分析で書き出した次の文のうち、「強み（得意な行動や、できること）」ではなく、「価値観（何を大事にして選ぶか）」に当たるものはどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"初対面の人とでも、すぐに打ち解けて話ができる。","correct":false,"reason":"得意な行動を述べているので、強みに当たる。"},{"key":"B","text":"表の数字の細かな食い違いに、人より早く気づける。","correct":false,"reason":"できることを述べているので、強みに当たる。"},{"key":"C","text":"早く結果を出すことよりも、関わる人が全員納得してから進めることを大事にしたい。","correct":true,"reason":"二つのうちどちらを優先して選ぶかという判断の基準を述べていて、価値観に当たる。"},{"key":"D","text":"表計算ソフトの関数を使って、集計表を作れる。","correct":false,"reason":"身につけた技能、つまりできることなので、強みに当たる。"}],"steps":[{"title":"文の終わり方で分ける","formula":"A：話ができる　B：気づける　D：作れる\nC：大事にしたい","body":"A・B・Dは「できる」の形で、得意な行動や技能を述べています。Cだけが、何を大事にするかを述べています。語尾は目安で、決め手は、中身が判断の基準になっているかどうかです。"},{"title":"Cが判断の基準になっているか確かめる","formula":"C：早く結果を出すこと ＜ 全員が納得して進めること","body":"Cは、二つのうちどちらを優先するかを述べています。進路や会社を選ぶときにも使える、判断の基準です。これが価値観です。答えはCです。"}]},{"label":"自己分析の作業を、順に並べる","question":"自己分析の作業ア〜エを、前の作業の結果を使って次へ進める順に並べてください。\nア　いくつもの経験に繰り返し出てくる行動の傾向を、強みとして言葉にする。\nイ　学校、部活、アルバイトなどの経験を、時期ごとに書き出す。\nウ　言葉にした強みが実際に出た場面を一つ選び、行動と結果を書く。\nエ　一つ一つの経験について、何をしたか、なぜそうしたかを問い直す。","answer":"イ → エ → ア → ウ","kind":"order","alternatives":[{"try":"イ → ア → エ → ウ","why_not":"アの「繰り返し出てくる行動の傾向」は、経験ごとに何をしたかを問い直した結果（エ）から見つけるもの。エより前には置けない。"},{"try":"イ → エ → ウ → ア","why_not":"ウは「言葉にした強み」が出た場面を選ぶ作業なので、強みを言葉にする作業（ア）の後でないとできない。"}],"steps":[{"title":"それぞれの作業が、何を材料にしているかを書き出す","formula":"イ：材料なし（最初に経験を集める）\nエ：一つ一つの経験 → イが要る\nア：繰り返し出てくる行動の傾向 → エが要る\nウ：言葉にした強み → アが要る","body":"前の作業の結果を使う関係を、作業ごとに確かめます。"},{"title":"材料のつながりをたどって並べる","formula":"イ → エ → ア → ウ","body":"材料が要らないイが最初です。イで集めた経験をエで掘り下げ、エで見えた傾向をアで強みにし、アの強みをウで裏づけます。どの作業も一つ前の作業の結果だけを使うので、この順に決まります。"}]}]},"sources":[{"title":"厚生労働省 キャリア形成・リスキリング推進事業：学校でのジョブ・カードの活用（「興味・関心」「こだわり・価値観」「強み・能力」）","url":"https://carigaku.mhlw.go.jp/wp-content/uploads/2024/06/c_school.pdf","checked_at":"2026-10-16"}]},"shu-webtest-kind":{"id":"shu-webtest-kind","name":"Webテストの見分け方","type":"do","goal":"受検案内のURLや科目、問題数と制限時間から、SPI・玉手箱・GAB・TG-WEBのどれかを見分け、対策する到達点を選べる。","part_of":"shukatsu","status":"verified","scope_note":"見分け方の手がかりは、公式の資料ではなく、就職情報サイトの記述によります（下の資料。確認日を添えています）。URLのドメインや問題数と制限時間は、テストの改訂や受検方式で変わることがあります。CABは、到達点はありますが、対策できるのは計算の科目だけです。対策の到達点を持たないテストは、見分けるところまでしか扱いません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を語釈と照合し、具体例が練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"Webテストは、作っている会社ごとに種類があり、出る科目も形式も違います。受検の案内が届いたら、対策を始める前に、どの種類かを見分けます。手がかりは三つです。一つ目は、受検画面のURLのドメイン（https:// のすぐ後の部分）です。就職情報サイトによると、リクルートマネジメントソリューションズのSPIを自宅で受ける場合は arorua.net、日本エス・エイチ・エルのテスト（玉手箱、GAB、CAB）は e-exams.jp、ヒューマネージのTG-WEBは c-personal.com や e-gitest.com が含まれるとされます（TG-WEBは c-notes.jp とする記述もあります）。二つ目は、案内や画面に出る科目と形式の名前です。三つ目は、科目ごとの問題数と制限時間です。一つの手がかりで種類が一つに決まらないときは、次の手がかりで絞ります。最後まで決まらないときは、候補のうち、この木で対策できるテストに共通する単元から始めます。","example":"案内のURL：ドメインに c-personal.com が含まれる\n一つ目の手がかり：c-personal.com → ヒューマネージのTG-WEB。ここでは、従来型か新型かはまだ決まらない\n三つ目の手がかり：案内に「言語34問・7分、計数36問・8分」とある → 問題数が多く時間が短い形。玉手箱にも似た形があるが、URLとあわせてTG-WEBの新型\n次に見ること：案内に出る科目と形式の名前","note":"SPIをテストセンターで受ける場合など、会場や予約の画面からは種類がわかりにくいことがあります。そのときは、案内の文面にある検査の名前を探します。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。「やる」の単元で、練習で確かめられるのは型の知識だけ（DESIGN.md 10章の28）。学習時間は参考の見積もりで、実測ではない。"},"cost":{"hours":3,"yen":0},"assessment":{"question":"受検画面のURLに e-exams.jp があり、案内には計数が「図表の読み取り」、言語が「論理的読解」とある。言えることは？","options":["玉手箱と決まる","GABと決まる","玉手箱かGABで、どちらでも図表の読み取りと論理的読解を学べば対策になる"],"answer":2,"explanation":"e-exams.jp は、玉手箱・GAB・CABに共通するドメインとされる。図表の読み取りと論理的読解は、玉手箱の形式にもGABの科目にもあるので、ここまででは玉手箱かGABかは決まらない。玉手箱と決める手がかり（四則逆算などGABにない形式）も、GABと決める手がかりもないので、上の二つは言い切りすぎ。どちらでも同じ二つの単元が対策になる。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、ほかの選択肢を実際に試して正答が一つに決まるかを確認。誤答ごとの理由、全段階の計算と工夫、試験の形（就職情報サイトの記述）との適合を確認し、指摘を反映した後に再検証。","title":"受検案内の手がかりから、テストの種類と対策を決める","lead":"URLのドメイン、科目と形式、問題数と制限時間の順に見て、候補を絞る。","original":true,"problems":[{"label":"URLと形式の名前から見分ける","question":"ある企業から、Webテストの受検案内が届きました。受検画面のURLは https://web2.e-exams.jp/… で、案内には「計数：四則逆算」「言語：論理的読解」と書かれています。このWebテストは、どれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"SPI","correct":false,"reason":"SPIを自宅で受けるときのURLには arorua.net が含まれるとされます。e-exams.jp ではありません。"},{"key":"B","text":"玉手箱","correct":true,"reason":"e-exams.jp で玉手箱・GAB・CABに絞られます。四則逆算と論理的読解の両方があるのは、この中では玉手箱だけです。"},{"key":"C","text":"GAB","correct":false,"reason":"GABも e-exams.jp を使うとされますが、GABの計数は図表の読み取りで、四則逆算はありません。"},{"key":"D","text":"TG-WEB","correct":false,"reason":"TG-WEBのURLには c-personal.com や e-gitest.com などが含まれるとされ、e-exams.jp ではありません。"}],"steps":[{"title":"URLのドメインを取り出す","formula":"https://web2.e-exams.jp/…\n→ ドメイン：web2.e-exams.jp（e-exams.jp の前に web2 が付いた形）","body":"https:// のすぐ後から、次の / までがドメインです。web2 の部分は番号つきの入口の名前で、会社を見分けるのは後ろの e-exams.jp です。"},{"title":"ドメインで候補を絞る","formula":"e-exams.jp → 日本エス・エイチ・エルのテスト\n候補：玉手箱、GAB、CABなど\n外れるもの：SPI（arorua.net）、TG-WEB（c-personal.com など）","body":"ここで SPI と TG-WEB は外れます。ただし、玉手箱・GAB・CABなど、同じ会社のテストは同じドメインを使うとされるので、URLだけではまだ一つに決まりません。"},{"title":"形式の名前で一つに決める","formula":"四則逆算 → 玉手箱の計数の形式（GABの計数は図表の読み取りなので、出ない）\n論理的読解 → 玉手箱の言語の形式（CABには言語の科目がないとされるので、出ない）","body":"四則逆算は、□に入る数を求める式が続く形式で、玉手箱の計数にあります（CABの計数にもあるとされます）。GABの計数は図表の読み取りなので、四則逆算は出ません。言語の論理的読解は、玉手箱にもGABにもありますが、CABにはありません。両方の手がかりに合うのは玉手箱だけです。"},{"title":"対策する到達点を選ぶ","formula":"玉手箱 → 到達点「玉手箱」の計数の道「四則逆算」と、言語の道「論理的読解」","body":"玉手箱は、計数と言語のそれぞれで形式を企業が選びます。案内に形式が書かれていれば、その形式の単元から始めます。書かれていない科目は、その科目のすべての形式を学んでおきます。"}]},{"label":"URLだけでは決まらないとき","question":"受検案内には、受検画面のURL https://web1.e-exams.jp/… だけが書かれていて、科目や形式の名前、問題数や制限時間は書かれていません。この時点で言えることは、どれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"SPIと決まる","correct":false,"reason":"SPIを自宅で受けるときのURLは arorua.net とされ、e-exams.jp ではありません。"},{"key":"B","text":"玉手箱と決まる","correct":false,"reason":"e-exams.jp は、GABやCABでも使われるとされます。URLだけで玉手箱と言い切ることはできません。"},{"key":"C","text":"日本エス・エイチ・エルのテスト（玉手箱、GAB、CABなど）で、種類までは決まらない","correct":true,"reason":"ドメインで会社までは絞れますが、同じ会社のテストどうしは同じドメインを使うとされるので（IMAGES も e-exams.jp とする資料があります）、種類は決まりません。"},{"key":"D","text":"TG-WEBと決まる","correct":false,"reason":"TG-WEBのURLには c-personal.com や e-gitest.com などが含まれるとされ、e-exams.jp ではありません。"}],"steps":[{"title":"ドメインで会社を決める","formula":"web1.e-exams.jp → e-exams.jp → 日本エス・エイチ・エル\n（e-exams2.jp、e-exams4.jp の形もあるとされる）","body":"前の問題と同じく、会社を見分けるのはドメインの後ろの e-exams.jp です。資料には、web1・web2 のほか、tsvs1.e-exams2.jp や nsvs1.e-exams4.jp のような形も挙がっていますが、前に付く番号でテストの種類を見分けられるとする資料はありません。"},{"title":"同じ会社のテストが、ほかの手がかりなしで分けられるかを確かめる","formula":"玉手箱：e-exams.jp\nGAB：e-exams.jp\nCAB：e-exams.jp\n→ URLでは区別できない","body":"三つとも同じドメインを使うとされ、ほかにも同じ会社のテストがあります。科目や形式、問題数と制限時間の手がかりがないので、ここで止まります。"},{"title":"決まらないときの進め方","formula":"玉手箱とGABに共通する単元：図表の読み取り、論理的読解","body":"CABは、この木では計算の科目だけに対策の到達点があり、法則性・命令表・暗号は扱いません。そこで、まず玉手箱とGABに共通する単元から始めます。Web-CABの四則逆算は玉手箱の四則逆算と同じ形とされるので、企業の過去の受検者の体験談などで形式の見当がついて玉手箱の単元を足すと、Web-CABの計算の科目の対策にもなります。"}]},{"label":"問題数と制限時間から見分ける","question":"受検案内のURLは書かれておらず、「言語：12問・12分、計数：9問・18分」とだけ書かれています。就職情報サイトの記述によると、このWebテストはどれでしょうか。","answer":"D","kind":"choice","options":[{"key":"A","text":"SPI","correct":false,"reason":"SPIの自宅受検（WEBテスティング）は、言語と非言語をあわせて約35分とされ、科目ごとに12分・18分と分かれた形ではありません。"},{"key":"B","text":"玉手箱","correct":false,"reason":"玉手箱の形式は、四則逆算が50問・9分、論理的読解が32問・15分のように、短い時間に多くの問題が出るとされます。12問・12分や9問・18分の形式はありません。"},{"key":"C","text":"GAB","correct":false,"reason":"GABは、紙の試験もWeb-GABも言語25分・計数35分（Web-GABは言語52問・計数40問）とされます。テストセンターのC-GABの問題数と時間は資料によって違いますが、どの記述も12問・12分、9問・18分とは合いません。"},{"key":"D","text":"TG-WEB","correct":true,"reason":"TG-WEBの従来型は、言語12問・12分、計数9問・18分とされます。一問に1分から2分かけられる、問題数の少ない形です。"}],"steps":[{"title":"一問あたりの時間を出す","formula":"言語：12分 ÷ 12問 → 1問1分\n計数：18分 ÷ 9問 → 1問2分","body":"問題数と時間の組を、一問にかけられる時間に直すと、ほかのテストと比べやすくなります。"},{"title":"玉手箱とGABの問題数と時間を並べる","formula":"玉手箱 四則逆算：50問・9分\n玉手箱 図表の読み取り：29問・15分\n玉手箱 表の空欄推測：20問・20分\n玉手箱 論理的読解：32問・15分\n玉手箱 趣旨判定：32問・10分\n玉手箱 趣旨把握：10問・12分\nWeb-GAB：言語52問・25分、計数40問・35分","body":"玉手箱には、表の空欄推測（1問1分）や趣旨把握（1問1分余り）のように、一問に時間をかけられる形式もあります。ですから、一問あたりの時間の長さだけでは決められません。決め手は、12問・12分と9問・18分の組と完全に一致する形式が、玉手箱にもGABにもないことです。"},{"title":"SPIと比べる","formula":"SPI（自宅受検）：言語と非言語をあわせて約35分","body":"SPIの自宅受検は、言語と非言語を続けて受け、合わせて約35分とされます。科目ごとに12分・18分と時間が示される形ではありません。"},{"title":"TG-WEBの型と照らし合わせる","formula":"TG-WEB 従来型：言語12問・12分、計数9問・18分\nTG-WEB 新型：言語34問・7分、計数36問・8分","body":"従来型の組と、問題数も時間も一致します。新型は問題数が多く時間が短い形なので、この案内は従来型です。TG-WEBの従来型の計数は、暗号や推論のような、一問に時間をかけて考える問題が出るとされます。"}]},{"label":"見分けた後に、対策の到達点を選ぶ","question":"受検案内の受検画面のURLは https://arorua.net/… でした。この木で対策を始める到達点として、正しいものはどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"SPI（SPI非言語とSPI言語）","correct":true,"reason":"arorua.net は、SPIを自宅で受けるときのドメインとされます。SPIの能力検査は非言語と言語の二つなので、二つの到達点から始めます。"},{"key":"B","text":"玉手箱","correct":false,"reason":"玉手箱のURLは e-exams.jp とされます。arorua.net ではありません。"},{"key":"C","text":"GAB","correct":false,"reason":"GABも玉手箱と同じ e-exams.jp を使うとされます。arorua.net ではありません。"},{"key":"D","text":"TG-WEB","correct":false,"reason":"TG-WEBのURLには c-personal.com や e-gitest.com などが含まれるとされます。arorua.net ではありません。"}],"steps":[{"title":"ドメインからテストを決める","formula":"https://arorua.net/… → arorua.net → SPI（自宅受検）","body":"arorua.net を使うのはSPIだけとされるので、この手がかりだけで一つに決まります。"},{"title":"テストの科目を到達点に対応させる","formula":"SPIの能力検査：非言語、言語\n→ 到達点「SPI」（その前提の「SPI非言語」「SPI言語」）","body":"この木では、到達点「SPI」の下に、非言語と言語を別々の到達点として置いています。案内に英語や構造的把握力のような追加の科目が書かれていれば、それも確かめます（この木では未収録です）。"}]}]},"sources":[{"title":"CREX：Webテストを受検URLから見分ける方法（SPI、玉手箱、GAB、TG-WEBのドメイン）","url":"https://crexgroup.com/ja/shukatsu/test/aptitude-test-url-identify/","checked_at":"2026-10-16"},{"title":"ONE CAREER：Webテストの種類と見分け方（受験用URL、形式ごとの問題数と制限時間）","url":"https://www.onecareer.jp/articles/3370","checked_at":"2026-10-16"},{"title":"インターンシップガイド：Webテストの種類と見分け方（URL、TG-WEBの従来型と新型の制限時間）","url":"https://internshipguide.jp/columns/view/web-test-type","checked_at":"2026-10-16"}]},"spi-blank":{"id":"spi-blank","name":"空欄補充","type":"learn","goal":"文の意味と語どうしの結びつきから、文中の空欄に入る最も適切な語句を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"空欄補充は、文の中の空欄に入る最も適切な語句を、選択肢から選ぶ問題です。手がかりは二つあります。一つは、空欄の前後の語との結びつきです。「少しも」の後に打ち消しが来るように、組になって使う語があります。もう一つは、文全体の意味です。空欄に選択肢を入れて読み、文の前半と後半の内容が食い違わないかを確かめます。文法として正しく見えても、文の意味と合わなければ正答ではありません。文章の中の接続語を選ぶ問題は、長文読解の単元で扱います。","example":"組になって使う語：\n少しも ……ない\nまるで ……ようだ\nもし ……なら\nなぜ ……か\n文の意味で決まる語：\n「雨が強くなったので、試合は（　）された」→ 雨が強くなったことと合う語を選ぶ","note":"選択肢を入れた文は、空欄の前だけでなく、文の終わりまで読み通して確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。理由を示す「ため」「以上」の読み取りは説明文の読解に収まる。組になって使う語と、禁止・推量・たとえは、この単元で説明している。学習時間は、単元どうしの釣り合いと外部の目安との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"jp-reading","level":"must"},{"id":"spi-word-usage","level":"helps"}],"assessment":{"question":"「その話は、（　）信じられない。」の空欄に入る語は？","options":["とても","とうとう","やっと"],"answer":0,"explanation":"「とても」は打ち消しの語と組になって、「どうしても〜できない」という意味を表す。「とうとう」は最終的にそうなったことを表し、「とうとう信じられなかった」のように過去の結果に使う。「やっと」は、長くかかって実現したことを表す。どちらも、今の気持ちを述べる「信じられない」とは合わない。"},"practice":{"title":"前後の語との結びつきと、文の意味から選ぶ","lead":"選んだ語を空欄に入れて、文の終わりまで読み通す。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の判定・別の選択肢を実際に試して確認。選択肢ごとの理由、全段階の説明、語釈（デジタル大辞泉）、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","problems":[{"label":"打ち消しと組になる語を選ぶ","question":"「この件は、（　）外部に漏らしてはならない。」の空欄に入る最も適切な語は、次のうちどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"決して","correct":true,"reason":"「決して」は「〜てはならない」「〜ない」のような打ち消しや禁止と組になり、それを強めます。"},{"key":"B","text":"必ず","correct":false,"reason":"現代の文では、「必ず」は「必ず〜する」のように、打ち消しのない言い方で使います（「必ずしも〜ない」は、いつもそうとはかぎらない、という別の意味です）。禁止の「〜てはならない」とは合いません。"},{"key":"C","text":"きっと","correct":false,"reason":"「きっと」は「きっと来るだろう」「きっと来てください」のように、話し手の推量や強い期待、要望を表します。禁止の言い方とは合いません。"},{"key":"D","text":"たぶん","correct":false,"reason":"「たぶん」は「たぶん〜だろう」のように、推量と組になります。禁止の言い方とは合いません。"},{"key":"E","text":"まるで","correct":false,"reason":"「まるで」は「まるで〜ようだ」のように、たとえと組になります。"}],"steps":[{"title":"空欄の後の、文の終わり方を見る","formula":"外部に漏らしてはならない\n終わり方：禁止（〜てはならない）","body":"空欄に入る語は、文の終わり方と組になることがあります。まず文の終わりを確かめます。"},{"title":"選択肢ごとに、組になる終わり方を並べる","formula":"決して：〜ない、〜てはならない\n必ず：〜する\nきっと：〜だろう、〜する\nたぶん：〜だろう\nまるで：〜ようだ","body":"禁止は「〜てはならない」「〜するな」と止める言い方、推量は「〜だろう」とおしはかる言い方、たとえは「〜ようだ」と似たものにたとえる言い方です。禁止の終わり方と組になるのは「決して」だけです。"},{"title":"入れた文を読み通して確かめる","formula":"この件は、決して外部に漏らしてはならない。","body":"禁止が強められ、意味が通ります。A です。"}]},{"label":"文の前後と合う語を選ぶ","question":"「新製品は発売直後から注文が殺到し、生産が（　）ため、届くまで2か月待ちの状態が続いている。」の空欄に入る最も適切な語句は、次のうちどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"過剰な","correct":false,"reason":"生産が過剰なら、作った物が余り、注文した人にすぐ届けられます。2か月待ちになる理由と合いません。"},{"key":"B","text":"追いつかない","correct":true,"reason":"注文が多すぎて、作る量が注文の量に届かないことを表します。「注文が殺到し」とも、「2か月待ち」とも合います。"},{"key":"C","text":"順調な","correct":false,"reason":"「ため」の前は、2か月待ちになった理由です。生産が順調なことは、待たされる理由になりません。"},{"key":"D","text":"注文を上回る","correct":false,"reason":"作る量が注文より多いなら、待たずに届きます。2か月待ちと合いません。"},{"key":"E","text":"落ち着いた","correct":false,"reason":"注文が殺到している最中なので、生産が落ち着いたことと合いません。待たされる理由にもなりません。"}],"steps":[{"title":"空欄の前後が述べている状況をつかむ","formula":"前：発売直後から注文が殺到し\n後：（　）ため、届くまで2か月待ち","body":"「殺到」は、多くのものが一度に押し寄せることです。空欄の後の「ため」は、空欄をふくむ部分が、2か月待ちになった理由だと示しています。"},{"title":"空欄に入る意味を予想する","formula":"注文がとても多い\n届くまで待たされる\n入る意味：作る量が、注文の量に届かない","body":"前の内容から自然に続き、後の結果の理由にもなる意味を考えます。"},{"title":"選択肢を入れて読み通す","formula":"生産が追いつかないため、2か月待ち（前とも後とも合う）\n生産が過剰なため、2か月待ち（理由にならない）\n生産が順調なため、2か月待ち（理由にならない）\n生産が注文を上回るため、2か月待ち（理由にならない）\n生産が落ち着いたため、2か月待ち（殺到と合わず、理由にもならない）","body":"前の内容とも、後の結果とも食い違わないのは「追いつかない」だけです。B です。"}]},{"label":"文末の言い方を選ぶ","question":"「記録が残っていない以上、当時の判断が正しかったかどうかは、今となっては確かめ（　）。」の空欄に入る最も適切な語句は、次のうちどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"られる","correct":false,"reason":"「確かめられる」は、確かめることができるという意味です。記録が残っていないことと合いません。"},{"key":"B","text":"てある","correct":false,"reason":"「確かめてある」は、すでに確かめが済んでいる状態を表します。記録がないので確かめられない、という文の流れと合いません。"},{"key":"C","text":"ようがない","correct":true,"reason":"「確かめようがない」は、確かめる方法がないという意味です。「記録が残っていない以上」「今となっては」と合います。"},{"key":"D","text":"させた","correct":false,"reason":"「確かめさせた」は、だれかに確かめることをさせたという意味です。「今となっては」は今の状態を述べる言い方で、過去にさせたことを述べる文とは合いません。"},{"key":"E","text":"ている","correct":false,"reason":"「確かめている」は、今まさに確かめている最中か、確かめ続けていることを表します。記録がないこととも、「今となっては」とも合いません。"}],"steps":[{"title":"空欄の前にある、理由と時を表す言葉を見る","formula":"記録が残っていない以上：理由（記録がないのだから）\n今となっては：時がたった今では、もうどうにもならない","body":"「〜以上」は、それを理由として当然こうなる、という言い方です。「今となっては」は、今ではもうできない、という気持ちでよく使われます。"},{"title":"二つの言葉から、文の結論を予想する","formula":"記録がない + 時がたった\n予想：確かめることができない","body":"記録がないうえに時がたっているので、確かめる手立てがない、という結論が自然です。"},{"title":"選択肢を入れて読み通す","formula":"今となっては確かめようがない（予想と合う）\n今となっては確かめられる（予想と反対）\n今となっては確かめてある（記録がないことと合わない）\n今となっては確かめさせた（今の状態を述べる「今となっては」と合わない）\n今となっては確かめている（記録がないことと合わない）","body":"予想した結論と合うのは「ようがない」だけです。C です。"}]}]}},"spi-counting":{"id":"spi-counting","name":"順列と組合せ","type":"learn","goal":"並べ方と選び方の数を、式で求められる。","part_of":"spi","tags":["matha","data"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"場合の数は、あることがらの起こり方が全部で何通りあるかを数えたものです。選んだものを一列に並べたり、役割を区別したりするときは「順列」で、選ぶ順番が違えば別のものとして数えます。順番や役割を区別せず、選ばれた顔ぶれだけを考えるときは「組合せ」で、同じ顔ぶれを何回も数えた分を割って取り除きます。二つのことを続けて行うときは、それぞれの場合の数をかけます。","example":"7人から2人を選んで順に並べる（順列）：7 × 6 = 42\n7人から2人を選ぶ（組合せ）：7 × 6 ÷ 2 = 21","note":"組合せでは、同じ2人を順番違いで2回数えているので、2で割ります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのはかけ算と、割り切れるわり算で、かけ算わり算に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"6人の中から、当番を2人選びます。選び方は何通りあるでしょうか。","options":["15通り","30通り","36通り"],"answer":0,"explanation":"順番を区別すると6 × 5 = 30通り。同じ2人を2回ずつ数えているので、30 ÷ 2 = 15通り。"},"practice":{"title":"並べ方と選び方の数を、式で求める","lead":"順番を区別するかどうかを、先に決める。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"役を区別して選ぶ","question":"5人の中から、委員長と副委員長を1人ずつ選びます。同じ人が両方を兼ねることはできません。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ役を置き、順番を区別するか決める","formula":"人数：5人\n選ぶ役：委員長1人、副委員長1人","body":"同じ2人を選んでも、どちらが委員長かが入れ替われば別の選び方です。順番（役）を区別して数えます。"},{"title":"委員長の選び方を数える","formula":"委員長の選び方：5通り","body":"5人のだれでも委員長になれます。"},{"title":"副委員長の選び方を数える","formula":"副委員長の選び方：5 − 1 = 4","body":"委員長になった人は副委員長になれないので、残りの4人から選びます。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"5 × 4 = 20","body":"委員長の5通りのそれぞれに、副委員長の4通りがあります。「それぞれに」なので、かけ算です。"},{"title":"人数を3人に減らして、書き出した数と式を比べる","formula":"A、B、Cの3人の場合：AB、AC、BA、BC、CA、CB\n3 × 2 = 6","body":"左を委員長、右を副委員長として書き出すと6通りで、式の3 × 2と一致します。同じ考え方で、5人なら5 × 4になります。"}]},{"label":"役を区別せずに選ぶ","question":"6人の中から、掃除当番を3人選びます。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ人数を置き、順番を区別するか決める","formula":"人数：6人\n選ぶ人数：3人（役の区別なし）","body":"3人の当番に役の違いはありません。選ぶ順番が違っても、同じ3人なら1通りと数えます。"},{"title":"いったん、順番を区別して数える","formula":"6 × 5 × 4 = 120","body":"1人目は6通り、2人目は残りの5通り、3人目は残りの4通りです。"},{"title":"同じ3人が、何回数えられているかを求める","formula":"3 × 2 × 1 = 6","body":"3人を並べる順番は、1人目が3通り、2人目が残りの2通り、3人目が残りの1通りです。たとえばA、B、Cの3人は、ABC、ACB、BAC、BCA、CAB、CBAの6通りの順番で数えられています。"},{"title":"重なって数えた分で割って、選び方を求める","formula":"120 ÷ 6 = 20","body":"どの3人の組も6回ずつ数えているので、6で割ると組の数になります。"},{"title":"4人から3人を選ぶ場合で、考え方を確かめる","formula":"4 × 3 × 2 = 24\n24 ÷ 6 = 4","body":"4人から3人を選ぶのは、選ばない1人を決めるのと同じなので4通りです。式でも4通りになります。"}]},{"label":"二つのグループから選ぶ","question":"男子4人、女子3人の中から、男子2人と女子1人を選びます。選び方は何通りあるでしょうか。","answer":"18通り","steps":[{"title":"人数と選ぶ人数を置く","formula":"男子：4人から2人を選ぶ\n女子：3人から1人を選ぶ","body":"男子の選び方と女子の選び方を、別々に数えてから組み合わせます。選ばれる人に役の区別はありません。"},{"title":"男子2人の選び方を数える","formula":"4 × 3 = 12\n12 ÷ 2 = 6","body":"順番を区別すると12通りです。同じ2人を2回ずつ数えているので、2で割って6通りです。"},{"title":"女子1人の選び方を数える","formula":"女子の選び方：3通り","body":"3人のうちのだれか1人です。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"6 × 3 = 18","body":"男子の6通りのそれぞれに、女子の3通りがあります。"},{"title":"足し算にしてはいけないことを確かめる","formula":"誤り：6 + 3 = 9\n正しい：6 × 3 = 18","body":"足し算の9通りは、「男子2人を選ぶ」か「女子1人を選ぶ」のどちらか一方だけをする場合の数です。今回は両方を同時に行うので、かけ算の18通りになります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-data":{"id":"spi-data","name":"資料の読み取り（正誤）","type":"learn","goal":"表の数から、資料についての記述が正しいか、誤りか、資料からはわからないかを見分けられる。","part_of":"spi","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を就職情報サイトの記述と照合し、練習の正答を見せていないか、前提の範囲に収まるかを確認。指摘を反映した。","text":"資料の読み取りは、表やグラフについて書かれた記述（ア、イ、ウなど）が、資料から正しいと言えるかを判断する問題です。記述を判断するときは、正しい、誤り、資料からはわからない、の三つに分けて考えます。選ぶのは正しいものだけです。資料にない数（内訳の移り変わりや、一人ひとりの事情など）についての記述は、もっともらしく見えても、正しいとは言えません。よくある取り違えは三つあります。一つ目は、割合（構成比）と実際の数の取り違えです。割合が上がっても、全体の数が減れば、実際の数は減ることがあります。二つ目は、増えた数と増えた割合の取り違えです。三つ目は、割合どうしの差と、割合が何%増えたかの取り違えです。百分率どうしの差は「ポイント」で表します。記述を一つずつ、必要な数を計算して確かめます。","example":"割合が上がっても、実際の数が減る例\n前の年：全体200のうちの30%　200 × 0.3 = 60\n次の年：全体150のうちの36%　150 × 0.36 = 54\n割合どうしの差：20%から25%へ上がると、25 − 20 = 5 で、5ポイント上がった\n割合が何%増えたか：(25 − 20) ÷ 20 = 0.25","note":"選択肢は、正しい記述をすべて選ぶ形や、正しい記述の組合せを選ぶ形、一つだけ選ぶ形があります。対策サイトでは、主にテストセンターで出る分野とされています（ペーパーテストでは「表の読み取り」として扱うとするものもあります）。企業の受検案内で方式を確かめてください。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流（SPI非言語の到達点）の一覧と範囲の断りが合うかを照合。学習時間は SPI の近い単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"spi-tables","level":"must"},{"id":"spi-inference","level":"helps"}],"assessment":{"question":"ある店の客数は、前の年が1,000人、今年が800人。客に占める学生の割合は、前の年の20%から今年は25%に上がった。学生の客数はどうなった？","options":["増えた","変わらない","減った"],"answer":1,"explanation":"前の年の学生は 1,000 × 0.2 = 200人、今年は 800 × 0.25 = 200人で、変わらない。割合が上がったので「増えた」としたくなるが、客数の全体が減っている。「減った」は全体の客数だけを見た答えで、学生の数は計算していない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と表だけから独立に解いて正答を照合し、ほかの選択肢・組合せ・読み方を実際に試して正答が一つに決まるかを確認。資料からはわからない記述が本当に決まらないか、全段階の計算、誤答と別解の理由、SPIの出題の形（就職情報サイトの記述）との適合を確認し、指摘を反映した。","title":"資料から言えることと、言えないことを見分ける","lead":"割合か実際の数か、増えた数か増えた割合かを、記述ごとに確かめる。","original":true,"problems":[{"label":"増えた割合と、増えた数を見分ける","question":"表1は、ある会社の部門別の社員数です。次のア〜エのうち、表1から正しいと言えるものをすべて選んでください。","answer":"アとウ","kind":"choice","select":"all","tables":[{"caption":"表1　部門別の社員数（人）","rows":[["部門","2024年","2025年"],["営業","120","135"],["開発","80","100"],["総務","50","45"],["合計","250","280"]]}],"options":[{"key":"ア","text":"開発の社員数は、2024年から2025年に25%増えた。","correct":true,"reason":"増えたのは20人で、基準の2024年の80人で割ると 20 ÷ 80 = 0.25。25%増えている。"},{"key":"イ","text":"2024年から2025年に社員数が最も多く増えた部門は、営業である。","correct":false,"reason":"増えた人数は、営業が15人、開発が20人で、開発の方が多い。営業は社員数が最も多い部門だが、増えた数は最も多くない。"},{"key":"ウ","text":"全社員に占める総務の社員の割合は、2024年より2025年の方が低い。","correct":true,"reason":"2024年は 50 ÷ 250 = 0.2 で20%、2025年は 45 ÷ 280 で約16%。2025年の方が低い。"},{"key":"エ","text":"2025年に、営業から開発へ異動した社員がいる。","correct":false,"reason":"表1は各年の部門ごとの人数だけで、誰がどこから移ったかはわからない。開発の増えた20人が、新しく入った社員かもしれない。資料からはわからないので、正しいとは言えない。"}],"steps":[{"title":"記述ごとに、必要な数を表から拾う","formula":"ア：開発の2024年と2025年\nイ：3部門の2024年と2025年\nウ：総務と合計の、2024年と2025年\nエ：異動した人の数（表にない）","body":"記述を読むたびに、どの行と列の数を使うかを先に決めます。エは、表のどこにも答えになる数がありません。"},{"title":"アを確かめる：増えた割合を求める","formula":"100 − 80 = 20\n20 ÷ 80 = 0.25","body":"増えた割合は、増えた数を、基準の2024年の数で割ります。0.25は25%なので、アは正しい記述です。"},{"title":"イを確かめる：増えた人数を部門ごとに比べる","formula":"営業：135 − 120 = 15\n開発：100 − 80 = 20\n総務：45 − 50 = −5","body":"最も多く増えたのは開発です。イは誤りです。社員数が最も多い部門と、最も多く増えた部門は、別のことです。"},{"title":"ウを確かめる：年ごとに、合計に占める割合を求める","formula":"2024年：50 ÷ 250 = 0.2\n2025年：45 ÷ 280 ≒ 0.161","body":"基準は、その年の合計です。年ごとに合計が違うので、それぞれの年の合計で割ります。2025年の方が低いので、ウは正しい記述です。"},{"title":"エを確かめる：資料にない数かどうかを見る","formula":"表1にあるもの：各年の部門ごとの人数\n表1にないもの：異動、入社、退職の人数","body":"部門ごとの人数が変わった理由は、表1からはわかりません。正しいとも誤りとも決められない記述は、「正しいと言えるもの」には入りません。"},{"title":"正しいと言えるものを、すべて答える","formula":"ア：正しい\nイ：誤り\nウ：正しい\nエ：資料からはわからない","body":"正しいと言えるのは、アとウです。"}]},{"label":"割合と実際の数を見分ける","question":"表1は、あるイベントの来場者数の合計、表2は、来場者の年代別の構成比です。次のア〜ウのうち、表1と表2から正しいと言えるものを一つ選んでください。","answer":"ウ","kind":"choice","tables":[{"caption":"表1　来場者数の合計（人）","rows":[["年","来場者数"],["2024年","2,000"],["2025年","1,600"]]},{"caption":"表2　来場者の年代別の構成比（％）","rows":[["年代","2024年","2025年"],["10〜20代","30","35"],["30〜40代","45","40"],["50代以上","25","25"]]}],"options":[{"key":"ア","text":"10〜20代の来場者数は、2024年より2025年の方が多い。","correct":false,"reason":"2024年は 2,000 × 0.3 = 600人、2025年は 1,600 × 0.35 = 560人で、2025年の方が少ない。構成比は上がっているが、全体の来場者数が減っている。"},{"key":"イ","text":"50代以上の来場者数は、2024年と2025年で同じである。","correct":false,"reason":"構成比は同じ25%だが、2024年は 2,000 × 0.25 = 500人、2025年は 1,600 × 0.25 = 400人で、2025年の方が少ない。"},{"key":"ウ","text":"2025年の30〜40代の来場者数は、640人である。","correct":true,"reason":"2025年の来場者数1,600人の40%で、1,600 × 0.4 = 640人。"}],"steps":[{"title":"二つの表の関係を置く","formula":"表1：年ごとの来場者数の合計\n表2：その年の合計を100%としたときの、年代ごとの割合","body":"表2の数は割合なので、来場者数を比べるときは、表1の合計にかけて実際の数に直します。"},{"title":"アを確かめる","formula":"2024年：2,000 × 0.3 = 600\n2025年：1,600 × 0.35 = 560","body":"構成比は30%から35%に上がっていますが、実際の数は減っています。アは誤りです。"},{"title":"イを確かめる","formula":"2024年：2,000 × 0.25 = 500\n2025年：1,600 × 0.25 = 400","body":"構成比が同じでも、全体の数が違えば、実際の数は違います。イは誤りです。"},{"title":"ウを確かめる","formula":"1,600 × 0.4 = 640","body":"2025年の合計に、30〜40代の構成比をかけます。ウは正しい記述です。"}]},{"label":"ポイントと、増えた割合を見分ける","question":"表1は、ある市の世帯数と、そのうちペットを飼っている世帯の割合です。次のア〜エのうち、表1から正しいと言えるものを一つ選んでください。","answer":"ア","kind":"choice","tables":[{"caption":"表1　世帯数と、ペットを飼っている世帯の割合","rows":[["年","世帯数","ペットを飼っている世帯の割合（％）"],["2015年","50,000","20"],["2025年","60,000","24"]]}],"options":[{"key":"ア","text":"ペットを飼っている世帯の割合は、2015年から2025年に4ポイント上がった。","correct":true,"reason":"割合どうしの差は 24 − 20 = 4 で、4ポイント上がっている。"},{"key":"イ","text":"ペットを飼っている世帯の数は、2015年から2025年に20%増えた。","correct":false,"reason":"飼っている世帯の数は10,000世帯から14,400世帯になり、増えた割合は 4,400 ÷ 10,000 = 0.44 で44%。20%は割合（20%から24%）が何%増えたかの数で、世帯の数の増え方ではない。"},{"key":"ウ","text":"ペットを飼っていない世帯の数は、2015年から2025年に減った。","correct":false,"reason":"飼っていない世帯は、2015年が 50,000 − 10,000 = 40,000世帯、2025年が 60,000 − 14,400 = 45,600世帯で、増えている。割合は80%から76%に下がったが、全体の世帯数が増えている。"},{"key":"エ","text":"ペットを飼っている世帯の、1世帯あたりのペットの数は、2015年から2025年に増えた。","correct":false,"reason":"表1には、ペットの数が書かれていない。資料からはわからないので、正しいとは言えない。"}],"steps":[{"title":"アを確かめる：割合どうしの差を求める","formula":"24 − 20 = 4","body":"百分率どうしの差は、ポイントで表します。アは正しい記述です。"},{"title":"イを確かめる：飼っている世帯の数に直す","formula":"2015年：50,000 × 0.2 = 10,000\n2025年：60,000 × 0.24 = 14,400\n14,400 − 10,000 = 4,400\n4,400 ÷ 10,000 = 0.44","body":"世帯の数は、全体の世帯数に割合をかけて求めます。増えた割合は44%で、20%ではありません。(24 − 20) ÷ 20 = 0.2 は、割合そのものが何%増えたかで、世帯の数の増え方とは違います。イは誤りです。"},{"title":"ウを確かめる：飼っていない世帯の数に直す","formula":"2015年：50,000 − 10,000 = 40,000\n2025年：60,000 − 14,400 = 45,600","body":"飼っていない世帯は増えています。ウは誤りです。"},{"title":"エを確かめる：資料にない数かどうかを見る","formula":"表1にあるもの：世帯数、飼っている世帯の割合\n表1にないもの：ペットの数","body":"資料からはわからない記述なので、正しいとは言えません。正しいと言えるのは、アだけです。"}]}]},"sources":[{"title":"就活の教科書：SPIのペーパーテストの出題範囲（資料の読み取りは出題なし、表の読み取りは出題あり）","url":"https://reashu.com/spi-paper-test_hanni/","checked_at":"2026-10-16"},{"title":"実務教育出版：SPIの基礎知識（非言語の分野に「資料の読み取り」を挙げる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf","checked_at":"2026-10-16"},{"title":"SPI攻略ナビ（スタキャリ）：グラフ・資料の読み取り（表を分析した記述から正しいものを一つ選ぶ例題）","url":"https://spi.stacari.com/higengo/graph-data-reading/","checked_at":"2026-10-16"},{"title":"PORTキャリア：SPI「テストセンター」の練習問題（資料の読み取りで、ア〜ウの記述が資料と一致するかを判断する例題）","url":"https://www.theport.jp/portcareer/web-test/274813/","checked_at":"2026-10-16"},{"title":"Study Pro：SPI（テストセンター）の出題範囲（資料の読み取りはテストセンターで出題とする）","url":"https://saisokuspi.com/gaiyou/taisaku_testcenter/3/20/","checked_at":"2026-10-16"}]},"spi-discount":{"id":"spi-discount","name":"料金の割引","type":"learn","goal":"団体割引など、条件つきの料金の合計を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"料金の割引は、人数や個数などの条件によって割引が変わるときの、料金の合計を求める問題です。「20人以上は全員が2割引」のように全員に割引がかかる型と、「30人を超えた分だけ1割引」のように一部にだけかかる型があります。どの人に、どの料金がかかるかを先に分けてから計算します。","example":"全員が割引：通常料金 × (1 − 割引の割合) × 人数\n超えた分だけ割引：通常料金 × 基準の人数 + 割引料金 × 超えた人数\n例　1人1,000円、10人を超えた分は2割引、12人の合計：1,000 × 10 + 800 × 2 = 11,600","note":"同じ「2割引」でも、だれの分にかかるかで合計が変わります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは割・百分率と小数のかけ算で、割合と比（その前提の小数と分数を含む）に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"入場料は1人500円。10人を超えた分は1人につき2割引になる。15人の合計は？","options":["6,000円","7,000円","7,500円"],"answer":1,"explanation":"割引になるのは10人を超えた5人だけ。2割引の1人分は 500 × 0.8 = 400円。500 × 10 + 400 × 5 = 7,000円。全員を割引すると6,000円、誰も割引しないと7,500円になり、どちらも誤り。"},"practice":{"title":"条件つきの割引で、料金の合計を求める","lead":"割引になるのは誰の分かを、先に確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全員が割引になる団体料金","question":"入場料は1人1,200円です。20人以上の団体は、全員が2割引になります。25人で入場すると、料金の合計はいくらでしょうか。","answer":"24,000円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人1,200円\n割引：20人以上で全員2割引\n人数：25人","body":"25人は20人以上なので、団体の条件に当てはまります。25人全員が割引の対象です。"},{"title":"割引後の1人分の料金を求める","formula":"1,200 × (1 − 0.2) = 1,200 × 0.8 = 960","body":"2割は20%、小数では0.2です。2割引は、通常料金の8割を払うということなので、通常料金を0.8倍します。"},{"title":"1人分に人数をかけて、合計を求める","formula":"960 × 25 = 24,000","body":"全員が同じ960円なので、人数の25をかけます。"},{"title":"通常料金の合計から割引額を引く方法で確かめる","formula":"通常料金の合計：1,200 × 25 = 30,000\n割引額：30,000 × 0.2 = 6,000\n30,000 − 6,000 = 24,000","body":"先に合計を出してから2割を引いても、同じ24,000円になります。"}]},{"label":"超えた分だけが割引になる料金","question":"入場料は1人800円です。30人を超えた分は、1人につき25%引きになります。42人で入場すると、料金の合計はいくらでしょうか。","answer":"31,200円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人800円\n割引：30人を超えた分だけ25%引き\n人数：42人","body":"割引になるのは全員ではありません。30人を超えた人の分だけです。"},{"title":"通常料金の人と、割引料金の人に分ける","formula":"通常料金の人数：30人\n割引料金の人数：42 − 30 = 12","body":"30人目までは通常料金です。31人目から42人目までの12人が割引料金になります。"},{"title":"通常料金の30人分を求める","formula":"800 × 30 = 24,000","body":"割引のない30人分の合計です。"},{"title":"割引後の1人分の料金を求める","formula":"800 × (1 − 0.25) = 800 × 0.75 = 600","body":"25%引きは、通常料金の75%を払うということです。"},{"title":"割引料金の12人分を求める","formula":"600 × 12 = 7,200","body":"割引後の600円に、割引になる人数の12をかけます。"},{"title":"二つを足して、合計を求める","formula":"24,000 + 7,200 = 31,200","body":"通常料金の30人分と、割引料金の12人分を足します。"},{"title":"全員を割引してはいけないことを確かめる","formula":"全員を割引した場合：600 × 42 = 25,200\n差：31,200 − 25,200 = 6,000","body":"42人全員を600円で計算すると、6,000円少なくなってしまいます。これは、通常料金のはずの30人まで200円ずつ引いた分です。"}]},{"label":"人数を多く数えた方が安くなる場合","question":"入場料は1人1,500円です。20人以上の団体は、全員が3割引になります。18人で行くとき、18人分を通常料金で払う場合と、20人分を団体料金で払う場合とでは、どちらがいくら安いでしょうか。","answer":"20人分を団体料金で払う方が、6,000円安い","steps":[{"title":"料金と割引の条件、比べる二つの払い方を置く","formula":"通常料金：1人1,500円\n団体料金：20人以上で全員3割引\n払い方A：18人分を通常料金で払う\n払い方B：20人分を団体料金で払う","body":"18人は20人に届かないので、そのままでは割引になりません。2人分を多く払って団体の条件を満たす払い方と比べます。"},{"title":"払い方Aの合計を求める","formula":"1,500 × 18 = 27,000","body":"割引なしの通常料金に、実際の人数の18をかけます。"},{"title":"団体料金の1人分を求める","formula":"1,500 × (1 − 0.3) = 1,500 × 0.7 = 1,050","body":"3割は30%、小数では0.3です。3割引は、通常料金の7割を払うということです。"},{"title":"払い方Bの合計を求める","formula":"1,050 × 20 = 21,000","body":"団体料金は20人分を払う必要があるので、18ではなく20をかけます。"},{"title":"二つの合計を比べる","formula":"払い方A：27,000\n払い方B：21,000\n27,000 − 21,000 = 6,000","body":"払う人数を2人分増やしても、20人分の団体料金の方が6,000円安くなります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-flow":{"id":"spi-flow","name":"物の流れと比率","type":"learn","goal":"流れ図に書かれた比率から、届く量を式で表し、割合を計算できる。","part_of":"spi","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、用語と書き方の決まりを資料と照合し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"物の流れと比率の問題は、商品などが場所から場所へ流れる様子を、箱と矢印の図で表したものです。箱の文字は、その場所が扱う量を表します。矢印は流れる向きを表し、矢印に添えた文字や数は比率（割合と同じ意味）です。比率は、矢印の出発する箱の量のうち、どれだけが矢印の先に届くかを表します。XからYへの矢印に a と書いてあれば、Yに届く量は a × X で、これを Y = aX と書きます。矢印が続いているときは比率をかけ、二つの矢印が同じ箱に入るときはそれぞれの量を足します。一つの箱から出る比率を全部足しても1より小さいときは、残りは図にかかれていない所へ行くものと考えます。図にかかれていない所から、箱に入ってくる量はありません。","example":"X から Y へ、比率 a で流れる：Y = aX\nX から Y へ a、Y から Z へ b で続く：Z = bY = abX\nX から Z へ a、Y から Z へ b で集まる：Z = aX + bY\n例　X が 200、a が 0.3 のとき、Y に届く量：200 × 0.3 = 60","note":"大文字は量、小文字は比率を表します。対策書や対策サイトでは、この分野は主にペーパーテスティングで出るとされています。対策サイトの例題では、三つの式の正誤を判定して、「アだけ」「アとイ」のような組合せの中から一つを選ぶ形が多く見られます。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"},{"id":"math-letters","level":"must"}],"assessment":{"question":"XからYへ、Xの量のうち比率0.4にあたる量が流れる。Xが300のとき、Yに届く量は？","options":["120","340","750"],"answer":0,"explanation":"届く量は、出発する量×比率。300 × 0.4 = 120。340は300に40を足した数、750は300を0.4で割った数で、どちらも比率の使い方が違う。"},"practice":{"title":"流れ図の比率から、届く量を式で表し、割合を求める","lead":"続く矢印はかけ算、集まる矢印はたし算。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、図と問題文の一致、前提の範囲、下流の単元から見た不足、説明・確認問題との整合を確認。一度検証を通らず、作り直した後に全手順で再検証。","problems":[{"label":"続いて流れる","question":"図は、商品が工場Pから倉庫Qへ、倉庫Qから店Rへ流れる様子を表しています。箱の文字はその場所が扱う量、矢印の文字は、出発する場所の量のうち矢印の先に届く量の比率です。店Rが扱う量を表す式として正しいものを、次のうちからすべて選んでください。","answer":"アとイ","kind":"choice","select":"all","figures":[{"kind":"flow","caption":"図1　工場P、倉庫Q、店Rの流れ","alt":"PからQへ比率sの矢印、QからRへ比率tの矢印が、一列に続いている。","nodes":[{"id":"P","label":"P","col":0,"row":0},{"id":"Q","label":"Q","col":1,"row":0},{"id":"R","label":"R","col":2,"row":0}],"edges":[{"from":"P","to":"Q","label":"s"},{"from":"Q","to":"R","label":"t"}]}],"options":[{"key":"ア","text":"R = tQ","correct":true,"reason":"Rに入る矢印はQからの1本で、比率は t。Qの量のうち t が届く。"},{"key":"イ","text":"R = stP","correct":true,"reason":"Q = sP を R = tQ に代入すると、R = t × sP = stP になる。"},{"key":"ウ","text":"R = (s + t)P","correct":false,"reason":"続いて流れるときは、比率を足すのではなくかける。t はPの量ではなく、Qの量に対する比率。"}],"steps":[{"title":"矢印を1本ずつ、式にする","formula":"PからQへ、比率 s：Q = sP　…①\nQからRへ、比率 t：R = tQ　…②","body":"矢印1本につき、式が一つできます。矢印の先の量は、出発する箱の量に比率をかけたものです。"},{"title":"アを確かめる","formula":"ア：R = tQ\n②：R = tQ","body":"アは、②の式そのものです。正しい式です。"},{"title":"①を②に代入して、RをPで表す","formula":"R = tQ\nR = t × sP\nR = stP","body":"②の Q のところに、①の sP を入れます。かけ算はかける順番を変えても同じなので、比率の文字を先に、量の文字を後に並べて stP と書きます。イはこの式と同じなので、正しい式です。"},{"title":"ウを、数を入れて確かめる","formula":"P が 100、s が 0.5、t が 0.4 のとき\nQ：100 × 0.5 = 50\nR：50 × 0.4 = 20\nウの式：(0.5 + 0.4) × 100 = 90","body":"実際にRに届くのは20ですが、ウの式では90になります。合わないので、ウは正しくありません。イの式では 0.5 × 0.4 × 100 で20になり、合います。"},{"title":"正しい式を、すべて答える","formula":"ア：正しい\nイ：正しい\nウ：正しくない","body":"同じ量を、Qを使って表したのがア、Pまでさかのぼって表したのがイです。どちらも正しいので、両方選びます。"}]},{"label":"集まってから、続いて流れる","question":"図は、商品が工場Kと工場Lから倉庫Mに集まり、倉庫Mから店Nへ流れる様子を表しています。箱の文字はその場所が扱う量、矢印の文字は、出発する場所の量のうち矢印の先に届く量の比率です。店Nが扱う量を表す式として正しいものを、次のうちからすべて選んでください。","answer":"アとイとエ","kind":"choice","select":"all","figures":[{"kind":"flow","caption":"図2　工場K、工場Lから倉庫Mを通って店Nへの流れ","alt":"KからMへ比率aの矢印、LからMへ比率bの矢印があり、二つの矢印がMに集まっている。MからNへ比率cの矢印が続いている。KとLの間に矢印はない。","nodes":[{"id":"K","label":"K","col":0,"row":0},{"id":"L","label":"L","col":0,"row":2},{"id":"M","label":"M","col":1,"row":1},{"id":"N","label":"N","col":2,"row":1}],"edges":[{"from":"K","to":"M","label":"a"},{"from":"L","to":"M","label":"b"},{"from":"M","to":"N","label":"c"}]}],"options":[{"key":"ア","text":"N = cM","correct":true,"reason":"Nに入る矢印はMからの1本で、比率は c。"},{"key":"イ","text":"N = c(aK + bL)","correct":true,"reason":"M = aK + bL を N = cM に代入した式。Mに集まった量の全体に c がかかる。"},{"key":"ウ","text":"N = acK + bL","correct":false,"reason":"c が aK にしかかかっていない。Lから来た分も、Mを通るときに c がかかる。"},{"key":"エ","text":"N = acK + bcL","correct":true,"reason":"イの式のかっこをはずした式。c を aK と bL の両方にかけている。"}],"steps":[{"title":"矢印を、箱ごとに式にする","formula":"Mに入る矢印は2本：M = aK + bL　…①\nNに入る矢印は1本：N = cM　…②","body":"同じ箱に二つの矢印が入るときは、それぞれの届く量を足します。アは②の式そのものなので、正しい式です。"},{"title":"①を②に代入する","formula":"N = cM\nN = c(aK + bL)","body":"②の M のところに、①の aK + bL を入れます。入れる式が足し算でできているので、かっこをつけます。イがこの式なので、正しい式です。"},{"title":"かっこをはずす","formula":"c(aK + bL)\n= c × aK + c × bL\n= acK + bcL","body":"かっこの外の c を、中の aK と bL の両方にかけます（分配法則）。エがこの式なので、正しい式です。"},{"title":"ウを、エと比べる","formula":"エ：N = acK + bcL\nウ：N = acK + bL","body":"ウは、bL に c がかかっていません。かっこをはずすときに、c を片方にしかかけなかった形です。"},{"title":"数を入れて、四つの式を確かめる","formula":"K が 100、L が 200、a が 0.5、b が 0.1、c が 0.4 のとき\nMに届く量：100 × 0.5 + 200 × 0.1 = 70\nNに届く量：70 × 0.4 = 28\nエの式：0.5 × 0.4 × 100 + 0.1 × 0.4 × 200 = 28\nウの式：0.5 × 0.4 × 100 + 0.1 × 200 = 40","body":"実際にNに届くのは28です。ア（0.4 × 70）、イ（0.4 × (50 + 20)）、エは28になり、ウだけが40になって合いません。"}]},{"label":"二つの道すじを通って届く","question":"図は、商品が工場Xから店Zへ届くまでの流れを表しています。工場Xから倉庫Yを通って店Zへ行く道すじと、工場Xから店Zへ直接行く道すじがあります。箱の文字はその場所が扱う量、矢印の数は、出発する場所の量のうち矢印の先に届く量の比率です。工場Xが扱う量のうち、図にかかれていない残りは、ほかの店へ行きます。工場Xが扱う量のうち、店Zに届くのは何%でしょうか。","answer":"50%","figures":[{"kind":"flow","caption":"図3　工場Xから店Zへの二つの道すじ","alt":"XからYへ比率0.6の矢印、YからZへ比率0.5の矢印が続いている。それとは別に、XからZへ直接、比率0.2の矢印がある。","nodes":[{"id":"X","label":"X","col":0,"row":1},{"id":"Y","label":"Y","col":1,"row":0},{"id":"Z","label":"Z","col":2,"row":1}],"edges":[{"from":"X","to":"Y","label":"0.6"},{"from":"Y","to":"Z","label":"0.5"},{"from":"X","to":"Z","label":"0.2"}]}],"alternatives":[{"try":"0.6 × 0.5 = 0.3 で、30%","why_not":"Yを通る道すじの分だけ。直接届く0.2を足し忘れている。"},{"try":"0.6 + 0.5 + 0.2 = 1.3 で、130%","why_not":"0.5はXの量ではなく、Yの量に対する比率。そのまま足すことはできない。扱う量より多く届くことにもなり、おかしい。"},{"try":"0.6 × 0.5 × 0.2 = 0.06 で、6%","why_not":"三つの矢印は一列に続いていない。直接の道すじは、Yを通る道すじとは別に届くので、かけずに足す。"},{"try":"0.5 + 0.2 = 0.7 で、70%","why_not":"Zに入る二つの矢印の比率を足しているが、0.5はYの量、0.2はXの量に対する比率で、基準にしている量が違う。"},{"try":"0.5 ÷ 0.8 = 0.625 で、62.5%","why_not":"図にかかれた矢印の分（0.6 + 0.2 = 0.8）だけを全体にしている。問われているのは、ほかの店へ行く分も含めた、Xが扱う量全体に対する割合。"}],"steps":[{"title":"道すじを二つに分ける","formula":"道すじ1：X → Y → Z（比率 0.6、0.5）\n道すじ2：X → Z（比率 0.2）","body":"Zには矢印が二つ入っています。Yを通ってくる分と、直接くる分を、別々に求めてから足します。"},{"title":"道すじごとに、Xの量の何倍が届くかを求める","formula":"道すじ1：0.6 × 0.5 = 0.3\n道すじ2：0.2","body":"道すじ1は矢印が続いているので、比率をかけます。Xの量の0.6倍がYに届き、そのまた0.5倍がZに届くので、Xの量の0.3倍です。道すじ2は矢印が1本だけなので、そのまま0.2倍です。"},{"title":"二つの道すじの分を足す","formula":"0.3 + 0.2 = 0.5","body":"どちらもXの量に対する比率になったので、足せます。Zに届くのは、Xの量の0.5倍、つまり50%です。"},{"title":"Xが1,000個の場合で確かめる","formula":"Yに届く量：1,000 × 0.6 = 600\nYからZへ：600 × 0.5 = 300\nXからZへ直接：1,000 × 0.2 = 200\nZに届く量：300 + 200 = 500\n500 ÷ 1,000 = 0.5","body":"1,000個のうち500個がZに届くので、50%です。"}]},{"label":"二つの道すじを比べる","question":"図は、前の問題と同じ流れを表しています。箱の文字はその場所が扱う量、矢印の数は、出発する場所の量のうち矢印の先に届く量の比率です。倉庫Yを通って店Zに届く量は、工場Xから店Zへ直接届く量の何%にあたるでしょうか。","answer":"150%","figures":[{"kind":"flow","caption":"図3　工場Xから店Zへの二つの道すじ","alt":"XからYへ比率0.6の矢印、YからZへ比率0.5の矢印が続いている。それとは別に、XからZへ直接、比率0.2の矢印がある。","nodes":[{"id":"X","label":"X","col":0,"row":1},{"id":"Y","label":"Y","col":1,"row":0},{"id":"Z","label":"Z","col":2,"row":1}],"edges":[{"from":"X","to":"Y","label":"0.6"},{"from":"Y","to":"Z","label":"0.5"},{"from":"X","to":"Z","label":"0.2"}]}],"alternatives":[{"try":"0.6 ÷ 0.2 = 3 で、300%","why_not":"0.6はYに届く量の比率。Zに届くのはそのうちの0.5なので、0.3にしてから比べる。"},{"try":"0.2 ÷ 0.3 で、約67%","why_not":"基準にする量と比べる量が逆。「直接届く量の何%か」なので、直接届く量で割る。"},{"try":"0.5 ÷ 0.2 = 2.5 で、250%","why_not":"0.5はYの量に対する比率で、Xの量に対する比率ではない。Yを通る道すじは、0.6 × 0.5 = 0.3 にしてから比べる。"}],"steps":[{"title":"比べる量と、基準の量を決める","formula":"比べる量：Yを通ってZに届く量\n基準の量：XからZへ直接届く量","body":"「直接届く量の何%か」なので、基準は直接届く量です。"},{"title":"二つの量を、Xの量の何倍かで表す","formula":"Yを通って届く量：0.6 × 0.5 = 0.3\n直接届く量：0.2","body":"基準をそろえないと比べられません。どちらも、Xの量に対する比率に直します。"},{"title":"比べる量を、基準の量で割る","formula":"0.3 ÷ 0.2 = 1.5","body":"1.5は150%です。Yを通って届く量の方が多いので、100%を超えます。"},{"title":"Xが1,000個の場合で確かめる","formula":"Yを通って届く量：1,000 × 0.6 × 0.5 = 300\n直接届く量：1,000 × 0.2 = 200\n300 ÷ 200 = 1.5","body":"300個は200個の1.5倍で、150%です。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-idioms":{"id":"spi-idioms","name":"熟語","type":"learn","goal":"二字熟語の成り立ちを見分け、説明された意味に合う熟語を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"熟語の問題には、二字熟語の成り立ちを答えるものと、説明された意味に合う語を選ぶものがあります。成り立ちは、二つの漢字の関係で分けます。似た意味の字を重ねたもの、反対の意味の字を重ねたもの、前の字が後の字を詳しく説明する（修飾する）もの、動詞の後にその動作の対象（「〜を」「〜に」に当たる語。目的語）を置いたもの、主語（何が）と述語（どうする）の関係になっているものの五つです。見分けるときは、漢字を一字ずつ訓読みにするか、訓読みのない字はその字の意味を考えて、短い文に読み下します。意味を選ぶ問題では、選択肢の語を一つずつ自分の言葉で言いかえ、説明と重なる部分と、はみ出す部分を比べます。","example":"増加 → 増える・加わる（似た意味の字を重ねる）\n増減 → 増える・減る（反対の意味の字を重ねる）\n青空 → 青い空（前の字が後の字を修飾する）\n読書 → 書を読む（動詞の後に目的語を置く）\n地震 → 地が震える（主語と述語の関係。何が・どうする）","note":"「読書」は下の字から上の字へ返って読むと、意味が通ります。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"「読書」と同じ成り立ちの熟語は？","options":["登山","永久","日没"],"answer":0,"explanation":"読書は「書を読む」で、動詞の後に目的語を置く形。登山も「山に登る」で同じ形。永久は似た意味の字を重ねたもの、日没は「日が没する」で主語と述語の関係。"},"practice":{"title":"漢字を読み下して成り立ちを見分け、意味に合う語を選ぶ","lead":"一字ずつ意味を確かめて、短い文に読み下す。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"一つの熟語の成り立ちを答える","question":"熟語「温暖」の成り立ちとして当てはまるものは、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"似た意味の字を重ねる","correct":true,"reason":"「温」も「暖」も、あたたかいという意味。"},{"key":"イ","text":"反対の意味の字を重ねる","correct":false,"reason":"「温」と「暖」は反対の意味ではない。"},{"key":"ウ","text":"前の字が後の字を修飾する","correct":false,"reason":"「温かい暖」とは読めず、一方がもう一方を説明していない。"},{"key":"エ","text":"動詞の後に目的語を置く","correct":false,"reason":"下から上へ返って「暖を温める」と読んでも、意味が通らない。"},{"key":"オ","text":"主語と述語の関係にある","correct":false,"reason":"上から下へ「温が暖まる」と読んでも、意味が通らない。"}],"steps":[{"title":"漢字を一字ずつ、訓読みにする","formula":"温 → あたたかい\n暖 → あたたかい","body":"音読みのままでは関係が見えにくいので、一字ずつ訓読みに直して意味を確かめます。"},{"title":"二つの字の意味の関係を比べる","formula":"温（あたたかい）と 暖（あたたかい）\n→ 似た意味","body":"どちらの字も、あたたかいという意味です。反対の意味ではないので、イではありません。"},{"title":"ほかの成り立ちに当てはまらないか確かめる","formula":"ウ：温かい暖 → 意味が通らない\nエ：暖を温める → 意味が通らない\nオ：温が暖まる → 意味が通らない","body":"「温」と「暖」は対等に並んでいます。一方がもう一方を説明したり、「〜を〜する」「〜が〜する」と読み下したりすることはできません。"},{"title":"同じ成り立ちの熟語で確かめる","formula":"増加 → 増（ふえる）・加（くわわる）\n温暖 → 温（あたたかい）・暖（あたたかい）","body":"似た意味の字を重ねた「増加」と同じ形です。答えはアです。"}]},{"label":"三つの熟語の成り立ちを見分ける","question":"次の三つの熟語の成り立ちを、それぞれ下のア〜オから選んでください。\n①着席　②国営　③強風\nア　似た意味の字を重ねる\nイ　反対の意味の字を重ねる\nウ　前の字が後の字を修飾する\nエ　動詞の後に目的語を置く\nオ　主語と述語の関係にある","answer":"①エ　②オ　③ウ","steps":[{"title":"①着席を、読み下す","formula":"着席 → 席に着く\n成り立ち：エ（動詞の後に目的語を置く）","body":"上の字「着」が動詞で、下の字「席」がその対象です。下から上へ返って読むと意味が通ります。「〜に」と読む場合も、この形に入ります。"},{"title":"②国営を、読み下す","formula":"国営 → 国が営む\n成り立ち：オ（主語と述語の関係）","body":"上の字「国」が主語で、下の字「営」が述語です。上から下へ「〜が〜する」と読めます。"},{"title":"③強風を、読み下す","formula":"強風 → 強い風\n成り立ち：ウ（前の字が後の字を修飾する）","body":"上の字「強」が、下の字「風」がどんな風かを説明しています。"},{"title":"三つの読み下し方の違いをまとめる","formula":"着席：下から上へ「席に着く」\n国営：上から下へ「国が営む」\n強風：上から下へ「強い風」","body":"「〜を」「〜に」と下から返って読めればエ、「〜が」と読めればオ、上の字が下の字を説明していればウです。ウには、「予習（予（あらかじ）め習う）」のように、上の字が下の動作を説明するものもあります。"}]},{"label":"説明に合う語を選ぶ","question":"「対立している両者が、互いにゆずり合って一致点を見つけること」という意味に最も近い語は、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"妥協","correct":true,"reason":"対立している、互いにゆずり合う、一致点を見つける、の三つすべてに当てはまる。"},{"key":"イ","text":"協調","correct":false,"reason":"利害や立場の違う者が力を合わせること。中心は協力で、互いにゆずり合うことは意味の中心にない。"},{"key":"ウ","text":"譲渡","correct":false,"reason":"権利や財産を一方がゆずり渡すことで、互いにゆずり合うことではない。"},{"key":"エ","text":"交渉","correct":false,"reason":"話し合うこと自体を指し、一致点が見つかったかどうかは含まない。"}],"steps":[{"title":"説明を、欠かせない部分に分ける","formula":"① 対立している\n② 互いにゆずり合う\n③ 一致点を見つける","body":"説明を、いくつかの部分に分けます。三つすべてに当てはまる語を探します。"},{"title":"選択肢を一つずつ、自分の言葉で言いかえる","formula":"妥協：対立する両者がゆずり合って、話をまとめること\n協調：立場や利害の違う者どうしが、力を合わせること\n譲渡：権利や財産を、ほかの人にゆずり渡すこと\n交渉：ある問題について、相手と話し合うこと","body":"似た字や、似た場面で使う語が並んでいます。字の印象ではなく、言いかえた意味で比べます。"},{"title":"説明の三つの部分と比べる","formula":"妥協：①②③に当てはまる\n協調：中心は協力で、互いにゆずり合うことは意味の中心にない\n譲渡：ゆずるのは一方だけで、物や権利の話\n交渉：話し合うことで、まとまるとは限らない","body":"「譲渡」は「譲」の字から選びたくなりますが、互いにゆずり合うのではなく、一方が渡すことです。「交渉」は話し合いの途中を指し、一致点が見つかったかどうかは含みません。"},{"title":"選んだ語を、短い文に入れて確かめる","formula":"双方が妥協して、契約がまとまった。","body":"対立していた両者がゆずり合って話をまとめた、という意味で通ります。答えはアです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-inference":{"id":"spi-inference","name":"推論","type":"learn","goal":"与えられた条件から、順位や内訳について必ず言えることを判断できる。","part_of":"spi","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"推論は、与えられた条件を整理して、そこから確実に言えることを判断する問題です。計算よりも、条件を図や表にまとめる力を使います。あり得る場合をすべて書き出し、そのすべてで成り立つことだけが「必ず正しい」と言えます。一つの場合でも成り立たなければ「正しいとは限らない」、どの場合でも成り立たなければ「必ず誤り」です。","example":"条件：XはYより背が高い。YはZより背が高い。\n整理：X ＞ Y ＞ Z\n必ず正しい：XはZより背が高い\n\n条件：XはYより背が高い。XはZより背が高い。\n整理：X ＞ Y、X ＞ Z（YとZの順は決まらない）\n正しいとは限らない：YはZより背が高い","note":"二つ目の例では、YとZのどちらが高い場合もあり得ます。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。前提なしで足りることを確認（使うのは順序の整理と、1けたの数の合計だけ）。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":12,"yen":0},"assessment":{"question":"AはBより前、BはCより前に到着した。必ず正しいのは？","options":["CはAより前","AはCより前","Bは最後"],"answer":1,"explanation":"条件を A → B → C と並べる。AはCより前。最後はCなので「Bは最後」は誤り。"},"practice":{"title":"条件を整理して、必ず言えることを判断する","lead":"決まることと、決まらないことを分ける。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"順位の条件を整理する","question":"A、B、C、Dの4人が競走をしました。同着はなく、次の三つのことがわかっています。\n① AはBより先にゴールした。\n② CはAより先にゴールした。\n③ DはCより後にゴールした。\nこのとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Cは1位である\nイ　Dは4位である\nウ　AはDより先にゴールした","answer":"アだけ","steps":[{"title":"三つの条件を、矢印で置く","formula":"① A → B\n② C → A\n③ C → D\n（矢印の左が、先にゴールした人）","body":"文のままでは比べにくいので、先にゴールした人を左にして、同じ形にそろえます。"},{"title":"つながる条件を、一本につなぐ","formula":"②と①：C → A → B\n③：C → D","body":"②の右と①の左がどちらもAなので、つなげられます。Dは、Cより後ということしかわかっていません。"},{"title":"Cの順位が決まるか調べる","formula":"CはAより先\nCはBより先（C → A → B から）\nCはDより先","body":"Cは、ほかの3人全員より先にゴールしています。Cは1位に決まります。"},{"title":"Dの入る場所を、すべて書き出す","formula":"C D A B\nC A D B\nC A B D","body":"A → B の順は決まっています。DはCより後ならどこでもよいので、並び方は3通りあります。"},{"title":"三つの文を、3通りすべてで調べる","formula":"ア：3通りすべてでCは1位 → 必ず正しい\nイ：Dが4位なのは C A B D だけ → 正しいとは限らない\nウ：C D A B ではDがAより先 → 正しいとは限らない","body":"「必ず正しい」と言えるのは、あり得る並び方のすべてで成り立つ文だけです。1通りでも成り立たなければ、必ず正しいとは言えません。"}]},{"label":"個数の内訳を場合分けする","question":"赤、青、白の玉が合わせて10個あります。どの色も1個以上あり、赤は青より多く、青は白より多いことがわかっています。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　白は1個である\nイ　青は3個以上である\nウ　赤は5個以上である","answer":"ウだけ","steps":[{"title":"条件を置く","formula":"合計：10個\nどの色も1個以上\n赤 ＞ 青 ＞ 白","body":"いちばん少ないのは白です。白の個数を小さい順に決めて、あり得る内訳をすべて書き出します。"},{"title":"白が1個の場合を書き出す","formula":"青と赤の合計：10 − 1 = 9\n白1・青2・赤7\n白1・青3・赤6\n白1・青4・赤5","body":"青は白より多いので2個以上です。青が5個だと赤は4個になり、赤が青より多いという条件に合いません。青がそれより多くても同じです。"},{"title":"白が2個の場合を書き出す","formula":"青と赤の合計：10 − 2 = 8\n白2・青3・赤5","body":"青は3個以上です。青が4個だと赤も4個になり、条件に合いません。青がそれより多くても同じです。"},{"title":"白が3個以上の場合がないことを確かめる","formula":"3 + 4 + 5 = 12","body":"白が3個以上なら、青は4個以上、赤は5個以上が必要です。いちばん少なくても12個になり、10個を超えます。"},{"title":"あり得る内訳をまとめ、合計を確かめる","formula":"1 + 2 + 7 = 10\n1 + 3 + 6 = 10\n1 + 4 + 5 = 10\n2 + 3 + 5 = 10","body":"白・青・赤の内訳は、この4通りだけです。"},{"title":"三つの文を、4通りすべてで調べる","formula":"ア：白2・青3・赤5 では白は2個 → 正しいとは限らない\nイ：白1・青2・赤7 では青は2個 → 正しいとは限らない\nウ：赤は7、6、5、5個で、すべて5個以上 → 必ず正しい","body":"4通りのすべてで成り立つのは、ウだけです。"}]},{"label":"位置の条件を場合分けする","question":"5階建ての建物の1階から5階に、P、Q、R、S、Tの5人が1人ずつ住んでいます。PはQより2つ上の階に住み、RはSのすぐ下の階に住んでいます。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Pは5階に住んでいる\nイ　Tは2階か4階に住んでいる\nウ　SはQより上の階に住んでいる","answer":"イだけ","steps":[{"title":"条件を置く","formula":"階：1階から5階に1人ずつ\n条件1：PはQの2つ上の階\n条件2：RはSのすぐ下の階","body":"あり得る場合が少ない条件から先に使います。条件1は、PとQの階の組が3通りしかありません。"},{"title":"条件1に合うPとQの階を書き出す","formula":"Q1階・P3階\nQ2階・P4階\nQ3階・P5階","body":"Qが4階だとPは6階になり、建物にありません。"},{"title":"それぞれの場合で、残っている階を書き出す","formula":"Q1階・P3階 → 残りは2階、4階、5階\nQ2階・P4階 → 残りは1階、3階、5階\nQ3階・P5階 → 残りは1階、2階、4階","body":"残りの三つの階に、R、S、Tが入ります。"},{"title":"条件2に合う入り方があるか、場合ごとに調べる","formula":"2階、4階、5階 → R4階・S5階、Tは2階\n1階、3階、5階 → 上下に続いた階がないので、あり得ない\n1階、2階、4階 → R1階・S2階、Tは4階","body":"RとSは、上下に続いた二つの階に、Rが下、Sが上になるように入る必要があります。残ったTの階も、これで決まります。"},{"title":"あり得る住み方をまとめる","formula":"住み方1（1階から順に）：Q、T、P、R、S\n住み方2（1階から順に）：R、S、Q、T、P","body":"条件に合う住み方は、この2通りだけです。"},{"title":"三つの文を、2通りの両方で調べる","formula":"ア：住み方1ではPは3階 → 正しいとは限らない\nイ：Tは住み方1で2階、住み方2で4階 → 必ず正しい\nウ：住み方2ではSは2階、Qは3階 → 正しいとは限らない","body":"2通りの両方で成り立つのは、イだけです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-installment":{"id":"spi-installment","name":"分割払い","type":"learn","goal":"総額を1として、分割払いの各回の支払いが総額のどれだけにあたるかを求められる。","part_of":"spi","tags":["sansu","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"分割払いの問題は、代金を何回かに分けて払うときに、ある回の支払いが総額のどれだけにあたるかを求める問題です。金額が書かれていないので、総額を1と置いて、支払いを分数で表します。最初に払う頭金を引いた残りを、残額といいます。残額を毎回同じ額ずつ払うのが均等払いで、残額を回数で割ると1回分になります。「総額の1/3」と「残額の1/3」では、もとにする量が違うので、どちらなのかを先に確かめます。","example":"残額 = 1 − 頭金の割合\n均等払いの1回分 = 残額 ÷ 回数\n例　総額の1/4を頭金で払い、残りを5回の均等払いにするとき\n　残額：1 − 1/4 = 3/4\n　1回分：(3/4) ÷ 5 = 3/20","note":"手数料がないときは、払った分をすべて足すと総額の1に戻ります。手数料があるときは、1に手数料を足した数になります。これで確かめられます。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"総額の1/3を頭金として払い、残りを4回の均等払いにする。1回分は総額のどれだけ？","options":["1/6","1/4","1/12"],"answer":0,"explanation":"残額は 1 − 1/3 = 2/3。これを4回で割ると 2/3 ÷ 4 = 2/12 = 1/6。1/12 は、頭金の1/3を4で割ってしまった場合の数。1/4 は、頭金を引かずに1を4で割った数。"},"practice":{"title":"総額を 1 として、各回の支払いを分数で求める","lead":"何をもとにした割合かを、先に確かめる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"頭金を払い、残りを均等に払う","question":"ある商品を買うのに、購入額の2/5を頭金として払い、残りを6回の均等払いにしました。均等払いの1回分は、購入額のどれだけにあたるでしょうか。","answer":"1/10","alternatives":[{"try":"2/5 ÷ 6 = 1/15","why_not":"6回に分けるのは、頭金の2/5ではなく、頭金を払った後の残りの3/5。"}],"steps":[{"title":"購入額を 1 と置く","formula":"購入額：1\n頭金：2/5\n残り：6回の均等払い","body":"金額が書かれていないので、購入額を1と置きます。支払いは、すべて購入額に対する分数で表します。"},{"title":"頭金を払った後の残額を求める","formula":"1 − 2/5 = 3/5","body":"全体の1から、頭金の2/5を引きます。これから払う分は、購入額の3/5です。"},{"title":"残額を回数で割って、1回分を求める","formula":"(3/5) ÷ 6 = 3/5 × 1/6 = 3/30 = 1/10","body":"6回で均等に払うので、残額を6で割ります。6で割ることは、1/6をかけることと同じです。"},{"title":"払った分をすべて足して、購入額になるか確かめる","formula":"均等払いの合計：1/10 × 6 = 6/10 = 3/5\n2/5 + 3/5 = 1","body":"頭金と、6回分の均等払いを足すと1になります。"}]},{"label":"残額をもとにした支払いがある","question":"ある工事の代金を、次のように払います。契約時に総額の1/4を払い、完成時に、そのときの残額の1/3を払います。残りは、4回の均等払いにします。均等払いの1回分は、総額のどれだけにあたるでしょうか。","answer":"1/8","alternatives":[{"try":"1 − 1/4 − 1/3 = 5/12、5/12 ÷ 4 = 5/48","why_not":"完成時に払うのは「総額の1/3」ではなく「残額の1/3」。残額3/4の1/3なので、総額に対しては1/4になる。"}],"steps":[{"title":"総額を 1 と置き、支払いごとに、もとにする量を確かめる","formula":"総額：1\n契約時：総額の1/4\n完成時：残額の1/3\n残り：4回の均等払い","body":"契約時の支払いは総額がもと、完成時の支払いは残額がもとです。もとにする量が途中で変わります。"},{"title":"契約時に払った後の残額を求める","formula":"1 − 1/4 = 3/4","body":"総額の1から、契約時の1/4を引きます。"},{"title":"完成時に払う分を、総額に対する分数で表す","formula":"3/4 × 1/3 = 3/12 = 1/4","body":"残額3/4の、そのまた1/3です。総額に対する分数に直すため、残額に1/3をかけます。"},{"title":"完成時に払った後の残額を求める","formula":"3/4 − 1/4 = 2/4 = 1/2","body":"契約時の後の残額から、完成時に払った分を引きます。"},{"title":"残額を回数で割って、1回分を求める","formula":"(1/2) ÷ 4 = 1/2 × 1/4 = 1/8","body":"残りの1/2を、4回で均等に払います。"},{"title":"払った分をすべて足して、総額になるか確かめる","formula":"均等払いの合計：1/8 × 4 = 4/8 = 1/2\n1/4 + 1/4 + 1/2 = 1","body":"契約時、完成時、均等払いの合計を足すと1になります。"}]},{"label":"手数料が加わる","question":"ある商品を買うのに、購入額の1/5を頭金として払い、残りを10回の均等払いにします。ただし、分割払いの手数料として、頭金を払った後の残額の1/10にあたる額が、1度だけ残額に加算されます。均等払いの1回分は、購入額のどれだけにあたるでしょうか。","answer":"11/125","alternatives":[{"try":"4/5 ÷ 10 = 2/25","why_not":"手数料を加える前の残額を割っている。10回で払うのは、残額に手数料を足した額。"},{"try":"手数料を購入額の1/10として、4/5 + 1/10 = 9/10、9/10 ÷ 10 = 9/100","why_not":"手数料は「購入額の1/10」ではなく「残額の1/10」。残額4/5の1/10なので、購入額に対しては2/25になる。"}],"steps":[{"title":"購入額を 1 と置き、頭金を払った後の残額を求める","formula":"購入額：1\n1 − 1/5 = 4/5","body":"頭金を払った後の残額は、購入額の4/5です。"},{"title":"手数料を、購入額に対する分数で表す","formula":"4/5 × 1/10 = 4/50 = 2/25","body":"手数料は、残額の1/10です。残額の4/5に1/10をかけます。"},{"title":"残額に手数料を足して、均等払いで払う合計を求める","formula":"4/5 + 2/25 = 20/25 + 2/25 = 22/25","body":"分母を25にそろえて足します。均等払いで払うのは、購入額の22/25にあたる額です。"},{"title":"合計を回数で割って、1回分を求める","formula":"(22/25) ÷ 10 = 22/250 = 11/125","body":"10回で均等に払うので、10で割ります。分母と分子を2で割って約分します。"},{"title":"払った分をすべて足して、購入額と手数料の合計になるか確かめる","formula":"均等払いの合計：11/125 × 10 = 110/125 = 22/25\n払った合計：1/5 + 22/25 = 5/25 + 22/25 = 27/25\n購入額と手数料：1 + 2/25 = 27/25","body":"手数料があるので、払った合計は1より大きくなります。購入額の1に手数料の2/25を足した額と同じになっています。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-nonverbal":{"id":"spi-nonverbal","name":"SPI非言語","type":"target","goal":"代表的な非言語問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","featured":true,"scope_note":"代表分野への学習経路で、SPIの全範囲は網羅していません。出版社の資料が挙げる非言語の分野のうち、集計表と、座標の図が要る条件と領域・グラフの領域は未収録です。集計表は、問題の形を資料で確かめられなかったので単元にしていません。仕事算と集合は、就職情報サイトが非言語の分野として挙げているものを単元にしました（出版社の資料の分野には入っていません）。出題される分野と形式は、受検方式によって異なります。企業の受検案内で方式を確認してください。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"受検方式、言語・非言語の分野、測る力の説明を、公式サイト・出版社の資料・就職情報サイトの記述と照合し、具体例の分野の一覧を前提の線と照合。指摘を反映した。","text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。非言語は能力検査のうち、数を使った処理と論理的な思考を測る分野です。受検方式には、テストセンター（リアル会場かオンライン会場）、インハウスCBT（応募企業などの会場）、WEBテスティング（自宅や学校など）、ペーパーテスティング（マークシート）があり、出版社の資料によると、SPIの種類と実施方法によって出題項目が異なります。ここでは代表的な分野を単元として並べています。","example":"この木に入れている分野（必須の前提）：損益算、料金の割引、速さと時間、仕事算、集合、順列と組合せ、確率、表の読み取り、資料の読み取り（正誤）、割合の割合と全体の割合、推論、分割払い、代金の精算、長文の読み取り計算。あると楽な前提：物の流れと比率","note":"全範囲を網羅したものではありません。受検方式は、企業からの受検案内で確かめてください。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"spi-profit","level":"must"},{"id":"spi-discount","level":"must"},{"id":"spi-speed","level":"must"},{"id":"spi-work","level":"must"},{"id":"spi-sets","level":"must"},{"id":"spi-counting","level":"must"},{"id":"math-probability","level":"must"},{"id":"spi-inference","level":"must"},{"id":"spi-installment","level":"must"},{"id":"spi-settlement","level":"must"},{"id":"spi-text-calc","level":"must"},{"id":"spi-flow","level":"helps"},{"id":"spi-data","level":"must"},{"id":"spi-percent","level":"must"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/","checked_at":"2026-10-16"},{"title":"SPI公式サイト：テストセンター・インハウスCBT・WEBテスティングの違い","url":"https://www.spi.recruit.co.jp/spi3news/000203.html","checked_at":"2026-10-16"},{"title":"実務教育出版：SPIの基礎知識（非言語分野の出題範囲、方式別に出題が異なる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf","checked_at":"2026-10-16"},{"title":"リクナビ就活準備ガイド：SPIの練習問題（言語と非言語が測る内容）","url":"https://job.rikunabi.com/contents/test/22304/","checked_at":"2026-10-16"},{"title":"就活ハンドブック（ジョーカツ）：SPIの言語・非言語の出題傾向（非言語の9分野に仕事算と集合を含む）","url":"https://jo-katsu.com/campus/1332/","checked_at":"2026-10-16"}],"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-percent":{"id":"spi-percent","name":"割合の割合と全体の割合","type":"learn","goal":"割合の割合を全体に対する割合に直し、割合の違う集団を合わせた全体の割合や、そこから一方の集団の割合を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を就職情報サイトの記述と照合し、練習の正答を見せていないか、前提の範囲に収まるかを確認。指摘を反映した。","text":"SPIの割合の問題では、割合をいくつか組み合わせる形がよく出ます。一つは割合の割合です。「全体のうちのある部分の、そのまた何%」は、二つの割合をかけると、全体に対する割合になります。「残りのうちの何%」なら、先に残りの割合（1から前の割合を引いたもの）を求めてからかけます。もう一つは、割合の違う二つの集団を合わせた全体の割合です。人数の違う集団の割合を、そのまま平均したり足したりすることはできません。それぞれを実際の数に直して足し、全体の数で割ります。全体の割合と一方の集団の割合から、もう一方の集団の割合を逆に求めることもあります。WEBテスティングでは、答えの数値を入力する形で出ることがあり、四捨五入の指示があればそれに従います。","example":"割合の割合：全体の60%のうちの30%\n0.6 × 0.3 = 0.18\n残りの割合：前の割合が40%なら、1 − 0.4 = 0.6\n二つの集団を合わせた割合 = (集団1の数 × 集団1の割合 + 集団2の数 × 集団2の割合) ÷ (集団1の数 + 集団2の数)\n例　40人のうちの50%と、60人のうちの25%：(40 × 0.5 + 60 × 0.25) ÷ 100 = 0.35","note":"割合をかけるときも足すときも、それぞれの割合が何を基準にしているかを先に確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件に収まるか、必須の前提が実際に使われているか、下流（SPI非言語の到達点）の一覧と範囲の断りが合うかを照合。学習時間は SPI の近い単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"},{"id":"spi-tables","level":"helps"}],"assessment":{"question":"ある町の住民の50%が会社員で、会社員の20%が車で通勤している。車で通勤する会社員は、住民全体の何%？","options":["10%","20%","70%"],"answer":0,"explanation":"20%は会社員に対する割合なので、住民全体に対する割合は 0.5 × 0.2 = 0.1 で10%。20%は基準を会社員のままにした数、70%は二つの割合を足した数で、どちらも住民全体に対する割合ではない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と表だけから独立に解いて正答を照合し、ほかの選択肢・組合せ・読み方を実際に試して正答が一つに決まるかを確認。資料からはわからない記述が本当に決まらないか、全段階の計算、誤答と別解の理由、SPIの出題の形（就職情報サイトの記述）との適合を確認し、指摘を反映した。","title":"割合を組み合わせて、全体に対する割合を求める","lead":"割合ごとに、何を基準にしているかを書き出す。","original":true,"problems":[{"label":"割合の割合を求める","question":"ある大学の学生のうち、40%が自宅から通っています。自宅から通う学生のうち、35%が電車を使っています。自宅から電車で通う学生は、学生全体の何%でしょうか。","answer":"14%","alternatives":[{"try":"35%","why_not":"35%は、自宅から通う学生を基準にした割合。学生全体を基準にした割合ではない。"},{"try":"0.4 + 0.35 = 0.75 で、75%","why_not":"基準の違う割合は足せない。「〜のうちの〜%」は、かけて基準を全体にそろえる。"}],"steps":[{"title":"割合ごとに、基準を書き出す","formula":"40%：学生全体が基準\n35%：自宅から通う学生が基準","body":"35%は、学生全体ではなく、自宅から通う学生に対する割合です。"},{"title":"二つの割合をかける","formula":"0.4 × 0.35 = 0.14","body":"学生全体の0.4倍のうちの、さらに0.35倍なので、学生全体の0.14倍です。0.14は14%です。"},{"title":"学生が1,000人の場合で確かめる","formula":"自宅から通う学生：1,000 × 0.4 = 400\nそのうち電車を使う学生：400 × 0.35 = 140\n140 ÷ 1,000 = 0.14","body":"1,000人のうち140人なので、14%です。"}]},{"label":"残りのうちの割合を求める","question":"ある会の会員のうち、30%が東京都に住んでいます。東京都以外に住む会員のうち、40%が神奈川県に住んでいます。東京都にも神奈川県にも住んでいない会員は、会員全体の何%でしょうか。","answer":"42%","alternatives":[{"try":"1 − 0.3 − 0.4 = 0.3 で、30%","why_not":"40%は会員全体ではなく、東京都以外に住む会員に対する割合。そのまま全体から引くことはできない。"},{"try":"0.7 × 0.4 = 0.28 で、28%","why_not":"神奈川県に住む会員の割合を答えている。問われているのは、東京都にも神奈川県にも住んでいない会員の割合。"},{"try":"60%","why_not":"東京都以外に住む会員のうちの、神奈川県以外の割合（1 − 0.4）。基準が東京都以外に住む会員のままで、会員全体に対する割合になっていない。"}],"steps":[{"title":"割合ごとに、基準を書き出す","formula":"30%：会員全体が基準（東京都）\n40%：東京都以外に住む会員が基準（神奈川県）","body":"二つの割合は、基準が違います。40%を会員全体から引くことはできません。"},{"title":"東京都以外に住む会員の割合を求める","formula":"1 − 0.3 = 0.7","body":"会員全体を1とすると、東京都以外に住む会員は0.7です。これが、40%の基準になる「残り」です。"},{"title":"神奈川県に住む会員が、会員全体の何%かを求める","formula":"0.7 × 0.4 = 0.28","body":"残りの0.7のうちの0.4倍なので、会員全体の0.28倍、つまり28%です。"},{"title":"どちらにも住んでいない会員の割合を求める","formula":"1 − 0.3 − 0.28 = 0.42","body":"会員全体の1から、東京都の0.3と神奈川県の0.28を引きます。どちらも会員全体に対する割合になったので、引くことができます。0.42は42%です。"},{"title":"別の道すじで確かめる","formula":"東京都以外のうち、神奈川県以外の割合：1 − 0.4 = 0.6\n0.7 × 0.6 = 0.42","body":"東京都以外の0.7のうち、神奈川県でない0.6倍が、どちらにも住んでいない会員です。同じ0.42になります。"},{"title":"会員が1,000人の場合で確かめる","formula":"東京都：1,000 × 0.3 = 300\n東京都以外：1,000 − 300 = 700\n神奈川県：700 × 0.4 = 280\nどちらでもない：700 − 280 = 420\n420 ÷ 1,000 = 0.42","body":"1,000人のうち420人なので、42%です。"}]},{"label":"二つの集団を合わせた割合を求める","question":"ある会社で、ある案についてアンケートをとりました。男性の社員120人のうち45%が、女性の社員80人のうち70%が賛成しました。社員200人全体のうち、賛成した人の割合は何%でしょうか。次のA〜Cから一つ選んでください。","answer":"A","kind":"choice","options":[{"key":"A","text":"55%","correct":true,"reason":"賛成した人は、男性が 120 × 0.45 = 54人、女性が 80 × 0.7 = 56人で、合わせて110人。110 ÷ 200 = 0.55。"},{"key":"B","text":"57.5%","correct":false,"reason":"二つの割合の平均（(45 + 70) ÷ 2）。男性と女性で人数が違うので、割合をそのまま平均することはできない。"},{"key":"C","text":"115%","correct":false,"reason":"二つの割合を足した数。基準の人数が違う割合は足せない。100%を超えるのもおかしい。"}],"steps":[{"title":"それぞれの集団の、賛成した人数を求める","formula":"男性：120 × 0.45 = 54\n女性：80 × 0.7 = 56","body":"割合は集団ごとに基準が違うので、まず実際の人数に直します。"},{"title":"人数を足して、全体で割る","formula":"54 + 56 = 110\n110 ÷ 200 = 0.55","body":"基準を社員全体の200人にそろえて割ります。0.55は55%です。"},{"title":"平均と違う理由を確かめる","formula":"(45 + 70) ÷ 2 = 57.5","body":"割合の平均は57.5%で、正しい55%より大きくなります。人数の多い男性の割合45%の方に、全体の割合が引き寄せられるからです。"}]},{"label":"全体の割合から、一方の集団の割合を求める","question":"ある会社の社員300人のうち、男性は180人、女性は120人です。研修を受けた人は、社員全体の60%、男性の50%でした。女性のうち研修を受けた人は、何%でしょうか。","answer":"75%","alternatives":[{"try":"60 + (60 − 50) = 70 で、70%","why_not":"割合の差をそのまま足し引きしている。男性と女性で人数が違うので、割合の差は人数の差と釣り合わない。"},{"try":"90 ÷ 300 = 0.3 で、30%","why_not":"研修を受けた女性の90人を、社員全体の300人で割っている。「女性のうちの何%」なので、基準は女性の120人。"}],"steps":[{"title":"全体と男性の、研修を受けた人数を求める","formula":"全体：300 × 0.6 = 180\n男性：180 × 0.5 = 90","body":"割合を、それぞれの基準の人数にかけて、実際の人数に直します。"},{"title":"女性の、研修を受けた人数を求める","formula":"180 − 90 = 90","body":"全体の人数から男性の人数を引くと、女性の人数です。"},{"title":"女性の人数で割る","formula":"90 ÷ 120 = 0.75","body":"「女性のうちの何%」なので、基準は女性の120人です。0.75は75%です。"},{"title":"全体の割合になるか確かめる","formula":"(180 × 0.5 + 120 × 0.75) ÷ 300 = 0.6","body":"男性と女性の人数に直して足し、全体の300人で割ると、60%になります。"}]}]},"sources":[{"title":"実務教育出版：SPIの基礎知識（非言語の分野に「割合」を挙げる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf","checked_at":"2026-10-16"},{"title":"Reashu：SPI「割合」の練習問題（割合の割合、二つのグループを合わせた割合の例題）","url":"https://reashu.com/spi_wariai/","checked_at":"2026-10-16"},{"title":"SPI個別対策塾マーサ：WEBテスティングの分析（割合の答えの数値を入力する形、四捨五入の指示）","url":"https://martha-spi.com/blog/web-testing/","checked_at":"2026-10-16"},{"title":"PORTキャリア：SPI「テストセンター」の練習問題（全体の人数に対する割合を二段階でかけ合わせる例題）","url":"https://www.theport.jp/portcareer/web-test/274813/","checked_at":"2026-10-16"}]},"spi-profit":{"id":"spi-profit","name":"損益算","type":"learn","goal":"原価、定価、利益の関係から、売値や利益率を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"損益算は、商品の仕入れと販売で生じる利益や損失を、割合を使って計算する問題です。仕入れた値段を原価、利益を見込んでつけた値段を定価、実際に売った値段を売値といいます。利益は「売値 − 原価」で、マイナスなら損失です。「原価の何%の利益」「定価の何%引き」のように、割合の基準が原価か定価かで計算が変わるので、基準を先に確かめます。","example":"定価 = 原価 × (1 + 見込む利益の割合)\n売値 = 定価 × (1 − 割引の割合)\n利益 = 売値 − 原価\n利益率（原価に対する）= 利益 ÷ 原価\n例　原価1,000円に2割の利益を見込んだ定価：1,000 × 1.2 = 1,200","note":"言葉の式に、問題文の数を当てはめて解きます。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは百分率、基準を1と置く考え方、小数のかけ算・わり算で、割合と比（その前提の小数と分数を含む）に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"原価600円の商品を750円で売った。原価に対する利益率は？","options":["20%","25%","125%"],"answer":1,"explanation":"利益は150円。利益率は150 ÷ 600 = 0.25 = 25%。売値ではなく原価で割る。"},"practice":{"title":"原価・定価・売値の関係から求める","lead":"何に対する割合かを、一つずつ確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現を確認し、指摘を反映した後に再検証。","problems":[{"label":"利益を見込んで定価をつける","question":"原価800円の商品に、原価の25%の利益を見込んで定価をつけました。定価はいくらでしょうか。","answer":"1,000円","steps":[{"title":"わかっている数と、割合の基準を置く","formula":"原価：800円\n見込む利益：原価の25%","body":"「原価の25%」と書いてあるので、25%は原価800円に対する割合です。"},{"title":"見込む利益を、金額で求める","formula":"800 × 0.25 = 200","body":"25%は小数で0.25です。基準の原価にかけると、利益の金額になります。"},{"title":"原価に利益を足して、定価を求める","formula":"800 + 200 = 1,000","body":"定価は、原価に見込んだ利益を上乗せした値段です。"},{"title":"同じ計算を、一つの式にまとめる","formula":"800 × (1 + 0.25) = 800 × 1.25 = 1,000","body":"原価の1倍に0.25倍を足すので、原価を1.25倍すれば一度で定価が出ます。"},{"title":"定価1,000円で、利益が原価の25%になるか確かめる","formula":"1,000 − 800 = 200\n200 ÷ 800 = 0.25","body":"利益200円は原価800円の25%です。問題の条件に合います。"}]},{"label":"定価から割り引いて売る","question":"原価1,200円の商品に、原価の30%の利益を見込んで定価をつけました。売れないので、定価の10%引きで売りました。利益は何円でしょうか。また、それは原価の何%でしょうか。","answer":"利益は204円、原価の17%","steps":[{"title":"三つの値段と、それぞれの割合の基準を置く","formula":"原価：1,200円\n定価：原価の30%増し\n売値：定価の10%引き","body":"原価の30%の利益を見込むので、定価は原価の30%増しです。30%は原価に対する割合、10%は定価に対する割合で、途中で基準が変わります。"},{"title":"原価から定価を求める","formula":"1,200 × 1.3 = 1,560","body":"原価の30%増しなので、原価を1.3倍します。"},{"title":"定価から売値を求める","formula":"1,560 × 0.9 = 1,404","body":"10%引きは、定価の90%で売るということです。定価を0.9倍します。"},{"title":"売値から原価を引いて、利益を求める","formula":"1,404 − 1,200 = 204","body":"利益は、実際に売った値段と原価の差です。定価との差ではありません。"},{"title":"利益が原価の何%かを求める","formula":"204 ÷ 1,200 = 0.17","body":"「原価の何%か」なので、原価で割ります。0.17は17%です。"},{"title":"30% − 10% = 20% としてはいけない理由を確かめる","formula":"見込んだ利益：1,200 × 0.3 = 360\n値引き：1,560 × 0.1 = 156\n360 − 156 = 204","body":"10%引きは定価1,560円に対する156円です。原価の10%（120円）ではないので、利益は原価の20%（240円）になりません。"}]},{"label":"利益から原価をさかのぼる","question":"ある商品に、原価の40%の利益を見込んで定価をつけました。定価の20%引きで売ったところ、利益は180円でした。原価はいくらでしょうか。","answer":"1,500円","steps":[{"title":"わからない原価を 1 と置く","formula":"原価：1\n定価：原価の40%増し\n売値：定価の20%引き\n利益：180円","body":"原価の金額がわからないので、原価を1として、ほかの値段を原価の何倍かで表します。原価の40%の利益を見込むので、定価は原価の40%増しです。"},{"title":"定価が原価の何倍かを求める","formula":"1 × 1.4 = 1.4","body":"原価の40%増しなので、定価は原価の1.4倍です。"},{"title":"売値が原価の何倍かを求める","formula":"1.4 × 0.8 = 1.12","body":"20%引きは定価の80%です。売値は原価の1.12倍になります。"},{"title":"利益が原価の何倍かを求める","formula":"1.12 − 1 = 0.12","body":"売値から原価を引いた残りが利益です。利益は原価の0.12倍、つまり12%です。"},{"title":"利益180円から、原価を求める","formula":"原価の0.12倍 = 180\n原価 = 180 ÷ 0.12 = 1,500","body":"原価の0.12倍が180円なので、180を0.12で割ると原価に戻ります。"},{"title":"原価1,500円で、利益が180円になるか確かめる","formula":"定価：1,500 × 1.4 = 2,100\n売値：2,100 × 0.8 = 1,680\n利益：1,680 − 1,500 = 180","body":"利益は180円で、問題の条件に合います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-reading":{"id":"spi-reading","name":"長文読解","type":"learn","goal":"長文を読み、空欄に入る語や、本文の内容に合う選択肢を選べる。","part_of":"spi","tags":["kokugo","reading"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"長文読解は、数百字ほどの文章を読んで、いくつかの問いに答える問題です。ここでは、三つの型の問いを扱います。空欄に入る接続語などを選ぶもの、指示語や語句が指す内容を答えるもの、本文の内容に合う選択肢を選ぶものです。どの型でも、答えの根拠は本文の中にあります。自分の意見や知識ではなく、本文のどの文に書いてあるかを示せる選択肢を選びます。先に問いを読んで何を探すかを決めてから本文を読むと、探す場所をしぼれます。","example":"空欄に入る語：空欄の前の文と後の文の関係を確かめる\n指示語の内容：直前の文から探し、当てはめて意味が通るか確かめる\n内容に合うもの：選択肢を一つずつ、本文の文と照らし合わせる","note":"本文に書かれていないことや、本文より言いすぎている選択肢は、常識として正しそうでも選びません。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"jp-reading","level":"must"}],"assessment":{"question":"「朝から強い雨が降っていた。（　）、遠足は中止になった。」の空欄に入る語は？","options":["だから","しかし","たとえば"],"answer":0,"explanation":"強い雨は、遠足が中止になった理由。前が理由、後が結果なので「だから」。「しかし」は逆の内容、「たとえば」は例が続くときに使う。"},"practice":{"title":"本文の中に根拠を見つけて答える","lead":"どの文に書いてあるかを、指で示せる選択肢を選ぶ。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","passage":"道具は、人の能力を広げるために作られてきた。たとえば、望遠鏡は遠くのものを見る力を、自動車は速く移動する力を広げた。［　1　］、道具に頼るほど、もともと持っていた力は使われなくなる。地図アプリを使う人は、道順を覚えようとしなくなる。これを、力が衰えたとなげく人もいる。しかし、私はそうは考えない。覚えることに使っていた力を、別のことに向けられるようになったと考えるからである。大切なのは、道具に任せることと自分で行うことを、自分で選べることだ。","problems":[{"label":"空欄に入る接続語を選ぶ","question":"本文の［　1　］に入る語として最も適切なものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"なぜなら","correct":false,"reason":"後の文は、前の文（力が広がったこと）の理由を述べていない。"},{"key":"イ","text":"一方で","correct":true,"reason":"前の文は道具が力を広げる面、後の文は力が使われなくなる面で、向きの違う二つの面を並べている。"},{"key":"ウ","text":"つまり","correct":false,"reason":"後の文は、前の文の言いかえではない。"}],"steps":[{"title":"空欄の前の文が、何を述べているかをまとめる","formula":"前の文：望遠鏡は遠くのものを見る力を、自動車は速く移動する力を広げた。\nまとめ：道具のよい面","body":"空欄に入る語は、前の文と後の文の関係で決まります。まず前の文の内容を、短くまとめます。"},{"title":"空欄の後の文が、何を述べているかをまとめる","formula":"後の文：道具に頼るほど、もともと持っていた力は使われなくなる。\nまとめ：道具の、もう一つの面","body":"前の文は力が広がる話、後の文は力が使われなくなる話です。向きの違う内容が並んでいます。"},{"title":"三つの語の使い方を確かめる","formula":"なぜなら：前の文の理由を、後で述べるときに使う\n一方で：前と向きの違う面を並べるときに使う\nつまり：前を言いかえるときに使う","body":"後の文は、力が広がったことの理由ではありません。前の文の言いかえでもありません。別の面を並べる「一方で」が合います。"},{"title":"入れた文を読み通して確かめる","formula":"…自動車は速く移動する力を広げた。一方で、道具に頼るほど、もともと持っていた力は使われなくなる。","body":"道具の二つの面を並べる文として、意味が通ります。答えはイです。"}]},{"label":"指示語が指す内容を答える","question":"本文の「これを、力が衰えたとなげく人もいる」の「これ」が指す内容として最も適切なものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"道具が、人の能力を広げてきたこと","correct":false,"reason":"能力が広がったことは、「力が衰えた」となげく内容にならない。"},{"key":"イ","text":"道具に頼ると、もともと持っていた力が使われなくなること","correct":true,"reason":"直前の文が例になっている、一つ前の文の内容。当てはめて意味が通る。"},{"key":"ウ","text":"地図アプリが、道順を教えてくれること","correct":false,"reason":"便利であることは「力が衰えた」となげく内容にならない。アプリが道順を教えてくれるとも、本文には書かれていない。"}],"steps":[{"title":"指示語の直前の文と、その前の文を書き出す","formula":"直前の文：地図アプリを使う人は、道順を覚えようとしなくなる。\nその前の文：道具に頼るほど、もともと持っていた力は使われなくなる。","body":"指示語は、ふつう直前の内容を指します。直前の文は、その前の文の具体例になっています。選択肢に直前の文そのものはないので、直前の文が何の例かを確かめ、もとの内容に当たる選択肢を探します。"},{"title":"指示語の後に続く言葉から、内容をしぼる","formula":"これを、力が衰えたとなげく","body":"「力が衰えた」となげかれるのは、力に関わる、よくない方の変化です。能力が広がったこと（ア）や、アプリが道順を教えてくれること（ウ）は、なげく内容になりません。"},{"title":"選択肢を「これ」に当てはめて読む","formula":"ア：能力を広げてきたことを、力が衰えたとなげく（通らない）\nイ：もともとの力が使われなくなることを、力が衰えたとなげく（通る）\nウ：アプリが道順を教えてくれることを、力が衰えたとなげく（通らない）","body":"当てはめて意味が通るのは、イだけです。"},{"title":"本文のどこに書いてあるかを確かめる","formula":"根拠の文：道具に頼るほど、もともと持っていた力は使われなくなる。","body":"イは、本文のこの文とほぼ同じ内容です。直前の地図アプリの文は、その一つの例に当たります。"}]},{"label":"筆者の考えに合う選択肢を選ぶ","question":"本文で述べられている筆者の考えに合うものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"道具に頼ると力が衰えるので、できるだけ使わない方がよい。","correct":false,"reason":"力が衰えたというのは「なげく人」の見方で、筆者は打ち消している。使わない方がよいとも書かれていない。"},{"key":"イ","text":"道具に任せた分の力は、別のことに向けることができる。","correct":true,"reason":"本文の「覚えることに使っていた力を、別のことに向けられるようになった」に当たる。"},{"key":"ウ","text":"道具に任せるか自分で行うかは、道具の性能によって決まる。","correct":false,"reason":"本文は「自分で選べること」と述べていて、道具の性能には触れていない。"}],"steps":[{"title":"筆者の考えが書かれている文を探す","formula":"しかし、私はそうは考えない。\n覚えることに使っていた力を、別のことに向けられるようになったと考えるからである。\n大切なのは、道具に任せることと自分で行うことを、自分で選べることだ。","body":"「私は」「考える」「大切なのは」という言葉のある文が、筆者の考えです。それより前は、事実として述べていることと、ほかの人の見方の説明です。"},{"title":"アを、本文と照らし合わせる","formula":"ア：力が衰えるので、使わない方がよい\n本文：力が衰えたとなげく人もいる。しかし、私はそうは考えない。","body":"力が衰えたというのは、筆者ではなく「なげく人」の見方です。筆者はそれを打ち消しています。「使わない方がよい」とも書かれていません。"},{"title":"イを、本文と照らし合わせる","formula":"イ：任せた分の力は、別のことに向けられる\n本文：覚えることに使っていた力を、別のことに向けられるようになった","body":"本文は道順を覚える力を例にしていますが、道具に頼ることについての話の中の例です。「任せた分の力」とまとめた言い方でも、筆者の考えに合います。"},{"title":"ウを、本文と照らし合わせる","formula":"ウ：道具の性能によって決まる\n本文：自分で選べることだ","body":"本文は、選ぶのは自分だと述べています。道具の性能については、どこにも書かれていません。"},{"title":"根拠を示せた選択肢を選ぶ","formula":"ア：筆者が打ち消している見方\nイ：本文に根拠がある\nウ：本文に書かれていない","body":"本文の文を根拠として示せるのは、イだけです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-sentence-order":{"id":"spi-sentence-order","name":"文の並べ替え","type":"learn","goal":"ばらばらの語句や文を、意味の通る順に並べ替えられる。","part_of":"spi","tags":["kokugo","reading"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文の並べ替えは、順番を入れかえた語句や文を、意味の通る順に戻す問題です。一つの文の中の語句を並べ替えるものと、いくつかの文を並べ替えて文章にするものがあります。全部を一度に並べようとせず、必ずつながる二つを先に見つけます。語句の並べ替えでは、文の最初と最後の決まっている部分につながるものから決めます。文の並べ替えでは、指示語と接続語を手がかりにします。「この」「そこで」「たとえば」で始まる文は、前に受ける内容が必要なので、最初には来ません。","example":"A：その結果、売り上げが伸びた。\nB：店は、商品の並べ方を変えた。\n手がかり：Aの「その結果」は、前に原因となる文が必要\n順番：B → A","note":"指示語も接続語もない文が、最初の文の候補です。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"jp-reading","level":"must"}],"assessment":{"question":"「彼は［1］［2］［3］出かけた。」の空欄に、A「傘を持たずに」、B「降りそうだったが」、C「雨が」を入れて最も自然な文にするとき、［2］に入るのは？","options":["傘を持たずに","降りそうだったが","雨が"],"answer":1,"explanation":"「雨が」の後には「降りそうだったが」が続く。「傘を持たずに」は「出かけた」のようすを表すので、その直前に入る。順番は C → B → A で、［2］はB。"},"practice":{"title":"手がかりを見つけて、意味の通る順に並べ替える","lead":"必ずつながる二つを、先に決める。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"一つの文の中の語句を並べ替える","question":"次の文の［1］〜［4］に、A〜Dの語句を一つずつ入れて、意味の通る文にします。［3］に入るのはどれでしょうか。\n日本の夏は［1］［2］［3］［4］ことが多い。","answer":"C","kind":"choice","options":[{"key":"A","text":"湿度も高いため","correct":false,"reason":"［2］に入る。「湿度も」の「も」がBを受けるので、Bのすぐ後に来る。"},{"key":"B","text":"気温が高いだけでなく","correct":false,"reason":"［1］に入る。「〜だけでなく」が、後に付け加える内容を呼ぶ。"},{"key":"C","text":"実際の気温よりも","correct":true,"reason":"［3］に入る。「〜よりも」は、比べた結果を表すDの直前に来る。"},{"key":"D","text":"暑く感じられる","correct":false,"reason":"［4］に入る。「こと」に直接つながる形は、Dだけ。"}],"alternatives":[{"try":"C → B → A → D（この並びだと［3］はA）","why_not":"「実際の気温よりも」のすぐ後に「気温が高い」が来て、「実際の気温よりも気温が高い」と読めてしまう。比べる言葉は、比べた結果の「暑く感じられる」の直前に置く。"},{"try":"A → B → C → D（この並びでも［3］はC）","why_not":"「だけでなく」が付け加える相手が「暑く感じられる」になり、理由の「湿度も高いため」が「気温が高い」にもかかって、筋が通らない。「湿度も」の「も」も、先に「気温が高い」が出ている方が自然に受けられる。"}],"steps":[{"title":"最後の空欄に入る語句を決める","formula":"［4］ことが多い。\n→ D：暑く感じられる ことが多い。","body":"「ことが多い」の直前には、「こと」に直接つながる形の語句が入ります。A・B・Cは「ため」「でなく」「よりも」で終わり、「こと」にはつながりません。つながるのはDだけです。"},{"title":"必ずつながる二つを見つける","formula":"B：気温が高いだけでなく → A：湿度も高いため","body":"「〜だけでなく」の後には、付け加える内容が続きます。Aの「湿度も」の「も」が、それを受けています。「も」は、先に「気温が高い」が出ている方が自然に受けられるので、AはBより後で、BのすぐあとにAが来ます。"},{"title":"残った語句の位置を決める","formula":"C：実際の気温よりも → D：暑く感じられる","body":"「〜よりも」は、何かと比べる言い方です。比べた結果を表す「暑く感じられる」の直前に入ります。"},{"title":"全体を並べて、読み通す","formula":"B → A → C → D\n日本の夏は、気温が高いだけでなく湿度も高いため、実際の気温よりも暑く感じられることが多い。","body":"理由（B・A）が先、その結果（C・D）が後になり、意味が通ります。［3］に入るのはCです。"}]},{"label":"四つの文を並べ替える","question":"次のア〜エの文を、意味の通る順に並べ替えてください。\nア　そのため、朝食を抜くと、午前中の集中力が下がりやすい。\nイ　脳は、眠っている間もエネルギーを使い続けている。\nウ　だから、忙しい朝でも、少しでも何か食べておくとよい。\nエ　その結果、朝起きたときには、脳のエネルギーが不足しがちになっている。","answer":"イ → エ → ア → ウ","kind":"order","alternatives":[{"try":"イ → エ → ウ → ア","why_not":"「食べておくとよい」が、集中力が下がることの理由になってしまい、つながらない。"},{"try":"イ → ア → エ → ウ","why_not":"エは朝起きたとき、つまり朝食より前の時点の話。朝食を抜いた後のことを述べるアの後には置けない。"}],"steps":[{"title":"それぞれの文の、最初の言葉を書き出す","formula":"ア：そのため、\nイ：（接続語なし）\nウ：だから、\nエ：その結果、","body":"「そのため」「だから」「その結果」は、どれも前の文を受ける言葉です。前に受ける内容が必要なので、最初の文にはなれません。"},{"title":"最初の文を決める","formula":"最初の文：イ","body":"接続語も指示語もないのは、イだけです。"},{"title":"イの次に来る文を決める","formula":"イ：眠っている間もエネルギーを使い続けている\n→ エ：その結果、朝にはエネルギーが不足しがちになっている","body":"使い続けたことの結果として、不足が起こります。「その結果」が、イの内容を受けています。イの次にアを置いても一見つながりますが、そうすると、朝食より前の時点を述べているエを置く場所がなくなります。"},{"title":"残りの二つの順を決める","formula":"エ：エネルギーが不足しがちになっている\n→ ア：そのため、朝食を抜くと集中力が下がりやすい\n→ ウ：だから、何か食べておくとよい","body":"不足しがちだから、補わないと集中力が下がる。朝食を抜くと集中力が下がるから、食べておくとよい。この順で、理由と結果がつながります。ウは全体の結論なので、最後に来ます。"},{"title":"アとウを入れかえた場合と比べて確かめる","formula":"エ → ウ → ア の場合\n…何か食べておくとよい。そのため、朝食を抜くと集中力が下がりやすい。","body":"「食べておくとよい」が、集中力が下がる理由になってしまい、つながりません。順番は イ → エ → ア → ウ です。"}]},{"label":"指示語を手がかりに、五つの文を並べ替える","question":"次のア〜オの文を、意味の通る順に並べ替えてください。\nア　しかし、この方法は、いつでも使えるわけではなかった。\nイ　昔の旅人は、太陽や星の位置を頼りに方角を知った。\nウ　こうして、天気に関係なく、方角がわかるようになった。\nエ　そこで使われるようになったのが、磁石を利用した方位磁針である。\nオ　たとえば、曇りの日には、太陽も星も見えない。","answer":"イ → ア → オ → エ → ウ","kind":"order","alternatives":[{"try":"イ → ア → エ → オ → ウ","why_not":"方位磁針の文の後に「たとえば」が来ると、曇りの日が何の例なのかがわからなくなる。"},{"try":"イ → ア → オ → ウ → エ","why_not":"解決の道具が出てくる前に、「こうして」で結果をまとめることになる。"},{"try":"イ → ア → エ → ウ → オ","why_not":"オは「いつでも使えるわけではなかった」の例。解決した後の「天気に関係なくわかる」の例にはならず、困った話で文章が終わってしまう。"}],"steps":[{"title":"指示語と接続語を、文ごとに書き出す","formula":"ア：しかし、この方法は\nイ：（なし）\nウ：こうして、\nエ：そこで\nオ：たとえば、","body":"イ以外の文は、どれも前の文を受ける言葉で始まっています。最初の文はイです。"},{"title":"「この方法」が指す内容を探す","formula":"ア：この方法\n→ イ：太陽や星の位置を頼りに方角を知る方法","body":"アより前に置ける文で、方法について述べているのはイだけです。アはイのすぐ後に来ます。"},{"title":"「たとえば」が、何の例かを探す","formula":"オ：曇りの日には、太陽も星も見えない\n→ ア：いつでも使えるわけではなかった、の例","body":"「たとえば」の後には、直前に述べたことの具体例が来ます。曇りの日は、太陽や星を使う方法が使えない場合の例なので、オはアのすぐ後に来ます。"},{"title":"残りの二つの順を決める","formula":"オ：太陽も星も見えない\n→ エ：そこで、方位磁針が使われるようになった\n→ ウ：こうして、天気に関係なく方角がわかるようになった","body":"「そこで」は、前の事情を受けて、次に起きたことを述べる言葉です。困ったことがあり（オ）、その解決として方位磁針が現れ（エ）、その結果どうなったか（ウ）、という順です。「こうして」は、それまでの流れ全体をまとめる言葉なので、ウが最後です。"},{"title":"全体を読み通して確かめる","formula":"イ → ア → オ → エ → ウ","body":"昔の方法、その弱点、弱点の例、解決の道具、結果、の順になり、指示語と接続語がすべて前の文を受けています。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-sets":{"id":"spi-sets","name":"集合","type":"learn","goal":"ベン図を書いて、重なりのある人数を求められる。","part_of":"spi","tags":["matha","data"],"also_tags":["math1"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"集合の問題は、ある条件に当てはまる人や物の数を、重なりに注意して数える問題です。二つの条件AとBがあるとき、全体は「Aだけ」「Bだけ」「AとBの両方」「どちらでもない」の四つに分かれます。Aの人数とBの人数をそのまま足すと、両方に当てはまる人を2回数えてしまうので、1回分を引きます。重なり合う二つの円の図（ベン図）をかくと整理しやすくなります。","example":"少なくとも一方 = Aの人数 + Bの人数 − 両方の人数\nどちらでもない = 全体 − 少なくとも一方\n例　全体30人、Aが18人、Bが15人、両方が8人のとき\n　少なくとも一方：18 + 15 − 8 = 25\n　どちらでもない：30 − 25 = 5","note":"Aだけは 18 − 8 で10人、Bだけは 15 − 8 で7人です。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは2けたのたし算・ひき算だけで、たし算ひき算に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"20人中、犬好き12人、猫好き9人、両方好き5人。少なくとも一方が好きな人数は？","options":["16人","20人","21人"],"answer":0,"explanation":"12 + 9 は両方の5人を二重に数えている。12 + 9 − 5 = 16人。"},"practice":{"title":"重なりのある人数を、ベン図で整理する","lead":"二重に数えた分を、一度だけ引く。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"両方に当てはまる人数を求める","question":"40人のクラスで、英語が得意な人は28人、数学が得意な人は19人、どちらも得意でない人は5人でした。英語と数学の両方が得意な人は何人でしょうか。","answer":"12人","steps":[{"title":"わかっている人数を置き、ベン図を思い浮かべる","formul
