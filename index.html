d","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"場合の数は、あることがらの起こり方が全部で何通りあるかを数えたものです。選んだものを一列に並べたり、役割を区別したりするときは「順列」で、選ぶ順番が違えば別のものとして数えます。順番や役割を区別せず、選ばれた顔ぶれだけを考えるときは「組合せ」で、同じ顔ぶれを何回も数えた分を割って取り除きます。二つのことを続けて行うときは、それぞれの場合の数をかけます。","example":"7人から2人を選んで順に並べる（順列）：7 × 6 = 42\n7人から2人を選ぶ（組合せ）：7 × 6 ÷ 2 = 21","note":"組合せでは、同じ2人を順番違いで2回数えているので、2で割ります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのはかけ算と、割り切れるわり算で、かけ算わり算に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"6人の中から、当番を2人選びます。選び方は何通りあるでしょうか。","options":["15通り","30通り","36通り"],"answer":0,"explanation":"順番を区別すると6 × 5 = 30通り。同じ2人を2回ずつ数えているので、30 ÷ 2 = 15通り。"},"practice":{"title":"並べ方と選び方の数を、式で求める","lead":"順番を区別するかどうかを、先に決める。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"役を区別して選ぶ","question":"5人の中から、委員長と副委員長を1人ずつ選びます。同じ人が両方を兼ねることはできません。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ役を置き、順番を区別するか決める","formula":"人数：5人\n選ぶ役：委員長1人、副委員長1人","body":"同じ2人を選んでも、どちらが委員長かが入れ替われば別の選び方です。順番（役）を区別して数えます。"},{"title":"委員長の選び方を数える","formula":"委員長の選び方：5通り","body":"5人のだれでも委員長になれます。"},{"title":"副委員長の選び方を数える","formula":"副委員長の選び方：5 − 1 = 4","body":"委員長になった人は副委員長になれないので、残りの4人から選びます。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"5 × 4 = 20","body":"委員長の5通りのそれぞれに、副委員長の4通りがあります。「それぞれに」なので、かけ算です。"},{"title":"人数を3人に減らして、書き出した数と式を比べる","formula":"A、B、Cの3人の場合：AB、AC、BA、BC、CA、CB\n3 × 2 = 6","body":"左を委員長、右を副委員長として書き出すと6通りで、式の3 × 2と一致します。同じ考え方で、5人なら5 × 4になります。"}]},{"label":"役を区別せずに選ぶ","question":"6人の中から、掃除当番を3人選びます。選び方は何通りあるでしょうか。","answer":"20通り","steps":[{"title":"人数と選ぶ人数を置き、順番を区別するか決める","formula":"人数：6人\n選ぶ人数：3人（役の区別なし）","body":"3人の当番に役の違いはありません。選ぶ順番が違っても、同じ3人なら1通りと数えます。"},{"title":"いったん、順番を区別して数える","formula":"6 × 5 × 4 = 120","body":"1人目は6通り、2人目は残りの5通り、3人目は残りの4通りです。"},{"title":"同じ3人が、何回数えられているかを求める","formula":"3 × 2 × 1 = 6","body":"3人を並べる順番は、1人目が3通り、2人目が残りの2通り、3人目が残りの1通りです。たとえばA、B、Cの3人は、ABC、ACB、BAC、BCA、CAB、CBAの6通りの順番で数えられています。"},{"title":"重なって数えた分で割って、選び方を求める","formula":"120 ÷ 6 = 20","body":"どの3人の組も6回ずつ数えているので、6で割ると組の数になります。"},{"title":"4人から3人を選ぶ場合で、考え方を確かめる","formula":"4 × 3 × 2 = 24\n24 ÷ 6 = 4","body":"4人から3人を選ぶのは、選ばない1人を決めるのと同じなので4通りです。式でも4通りになります。"}]},{"label":"二つのグループから選ぶ","question":"男子4人、女子3人の中から、男子2人と女子1人を選びます。選び方は何通りあるでしょうか。","answer":"18通り","steps":[{"title":"人数と選ぶ人数を置く","formula":"男子：4人から2人を選ぶ\n女子：3人から1人を選ぶ","body":"男子の選び方と女子の選び方を、別々に数えてから組み合わせます。選ばれる人に役の区別はありません。"},{"title":"男子2人の選び方を数える","formula":"4 × 3 = 12\n12 ÷ 2 = 6","body":"順番を区別すると12通りです。同じ2人を2回ずつ数えているので、2で割って6通りです。"},{"title":"女子1人の選び方を数える","formula":"女子の選び方：3通り","body":"3人のうちのだれか1人です。"},{"title":"二つの数をかけて、全部の選び方を求める","formula":"6 × 3 = 18","body":"男子の6通りのそれぞれに、女子の3通りがあります。"},{"title":"足し算にしてはいけないことを確かめる","formula":"誤り：6 + 3 = 9\n正しい：6 × 3 = 18","body":"足し算の9通りは、「男子2人を選ぶ」か「女子1人を選ぶ」のどちらか一方だけをする場合の数です。今回は両方を同時に行うので、かけ算の18通りになります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-discount":{"id":"spi-discount","name":"料金の割引","type":"learn","goal":"団体割引など、条件つきの料金の合計を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"料金の割引は、人数や個数などの条件によって割引が変わるときの、料金の合計を求める問題です。「20人以上は全員が2割引」のように全員に割引がかかる型と、「30人を超えた分だけ1割引」のように一部にだけかかる型があります。どの人に、どの料金がかかるかを先に分けてから計算します。","example":"全員が割引：通常料金 × (1 − 割引の割合) × 人数\n超えた分だけ割引：通常料金 × 基準の人数 + 割引料金 × 超えた人数\n例　1人1,000円、10人を超えた分は2割引、12人の合計：1,000 × 10 + 800 × 2 = 11,600","note":"同じ「2割引」でも、だれの分にかかるかで合計が変わります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは割・百分率と小数のかけ算で、割合と比（その前提の小数と分数を含む）に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":4,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"入場料は1人500円。10人を超えた分は1人につき2割引になる。15人の合計は？","options":["6,000円","7,000円","7,500円"],"answer":1,"explanation":"割引になるのは10人を超えた5人だけ。2割引の1人分は 500 × 0.8 = 400円。500 × 10 + 400 × 5 = 7,000円。全員を割引すると6,000円、誰も割引しないと7,500円になり、どちらも誤り。"},"practice":{"title":"条件つきの割引で、料金の合計を求める","lead":"割引になるのは誰の分かを、先に確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全員が割引になる団体料金","question":"入場料は1人1,200円です。20人以上の団体は、全員が2割引になります。25人で入場すると、料金の合計はいくらでしょうか。","answer":"24,000円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人1,200円\n割引：20人以上で全員2割引\n人数：25人","body":"25人は20人以上なので、団体の条件に当てはまります。25人全員が割引の対象です。"},{"title":"割引後の1人分の料金を求める","formula":"1,200 × (1 − 0.2) = 1,200 × 0.8 = 960","body":"2割は20%、小数では0.2です。2割引は、通常料金の8割を払うということなので、通常料金を0.8倍します。"},{"title":"1人分に人数をかけて、合計を求める","formula":"960 × 25 = 24,000","body":"全員が同じ960円なので、人数の25をかけます。"},{"title":"通常料金の合計から割引額を引く方法で確かめる","formula":"通常料金の合計：1,200 × 25 = 30,000\n割引額：30,000 × 0.2 = 6,000\n30,000 − 6,000 = 24,000","body":"先に合計を出してから2割を引いても、同じ24,000円になります。"}]},{"label":"超えた分だけが割引になる料金","question":"入場料は1人800円です。30人を超えた分は、1人につき25%引きになります。42人で入場すると、料金の合計はいくらでしょうか。","answer":"31,200円","steps":[{"title":"料金と割引の条件、人数を置く","formula":"通常料金：1人800円\n割引：30人を超えた分だけ25%引き\n人数：42人","body":"割引になるのは全員ではありません。30人を超えた人の分だけです。"},{"title":"通常料金の人と、割引料金の人に分ける","formula":"通常料金の人数：30人\n割引料金の人数：42 − 30 = 12","body":"30人目までは通常料金です。31人目から42人目までの12人が割引料金になります。"},{"title":"通常料金の30人分を求める","formula":"800 × 30 = 24,000","body":"割引のない30人分の合計です。"},{"title":"割引後の1人分の料金を求める","formula":"800 × (1 − 0.25) = 800 × 0.75 = 600","body":"25%引きは、通常料金の75%を払うということです。"},{"title":"割引料金の12人分を求める","formula":"600 × 12 = 7,200","body":"割引後の600円に、割引になる人数の12をかけます。"},{"title":"二つを足して、合計を求める","formula":"24,000 + 7,200 = 31,200","body":"通常料金の30人分と、割引料金の12人分を足します。"},{"title":"全員を割引してはいけないことを確かめる","formula":"全員を割引した場合：600 × 42 = 25,200\n差：31,200 − 25,200 = 6,000","body":"42人全員を600円で計算すると、6,000円少なくなってしまいます。これは、通常料金のはずの30人まで200円ずつ引いた分です。"}]},{"label":"人数を多く数えた方が安くなる場合","question":"入場料は1人1,500円です。20人以上の団体は、全員が3割引になります。18人で行くとき、18人分を通常料金で払う場合と、20人分を団体料金で払う場合とでは、どちらがいくら安いでしょうか。","answer":"20人分を団体料金で払う方が、6,000円安い","steps":[{"title":"料金と割引の条件、比べる二つの払い方を置く","formula":"通常料金：1人1,500円\n団体料金：20人以上で全員3割引\n払い方A：18人分を通常料金で払う\n払い方B：20人分を団体料金で払う","body":"18人は20人に届かないので、そのままでは割引になりません。2人分を多く払って団体の条件を満たす払い方と比べます。"},{"title":"払い方Aの合計を求める","formula":"1,500 × 18 = 27,000","body":"割引なしの通常料金に、実際の人数の18をかけます。"},{"title":"団体料金の1人分を求める","formula":"1,500 × (1 − 0.3) = 1,500 × 0.7 = 1,050","body":"3割は30%、小数では0.3です。3割引は、通常料金の7割を払うということです。"},{"title":"払い方Bの合計を求める","formula":"1,050 × 20 = 21,000","body":"団体料金は20人分を払う必要があるので、18ではなく20をかけます。"},{"title":"二つの合計を比べる","formula":"払い方A：27,000\n払い方B：21,000\n27,000 − 21,000 = 6,000","body":"払う人数を2人分増やしても、20人分の団体料金の方が6,000円安くなります。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-flow":{"id":"spi-flow","name":"物の流れと比率","type":"learn","goal":"流れ図に書かれた比率から、届く量を式で表し、割合を計算できる。","part_of":"spi","tags":["jhmath","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、用語と書き方の決まりを資料と照合し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"物の流れと比率の問題は、商品などが場所から場所へ流れる様子を、箱と矢印の図で表したものです。箱の文字は、その場所が扱う量を表します。矢印は流れる向きを表し、矢印に添えた文字や数は比率（割合と同じ意味）です。比率は、矢印の出発する箱の量のうち、どれだけが矢印の先に届くかを表します。XからYへの矢印に a と書いてあれば、Yに届く量は a × X で、これを Y = aX と書きます。矢印が続いているときは比率をかけ、二つの矢印が同じ箱に入るときはそれぞれの量を足します。一つの箱から出る比率を全部足しても1より小さいときは、残りは図にかかれていない所へ行くものと考えます。図にかかれていない所から、箱に入ってくる量はありません。","example":"X から Y へ、比率 a で流れる：Y = aX\nX から Y へ a、Y から Z へ b で続く：Z = bY = abX\nX から Z へ a、Y から Z へ b で集まる：Z = aX + bY\n例　X が 200、a が 0.3 のとき、Y に届く量：200 × 0.3 = 60","note":"大文字は量、小文字は比率を表します。対策書や対策サイトでは、この分野は主にペーパーテスティングで出るとされています。対策サイトの例題では、三つの式の正誤を判定して、「アだけ」「アとイ」のような組合せの中から一つを選ぶ形が多く見られます。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"},{"id":"math-letters","level":"must"}],"assessment":{"question":"XからYへ、Xの量のうち比率0.4にあたる量が流れる。Xが300のとき、Yに届く量は？","options":["120","340","750"],"answer":0,"explanation":"届く量は、出発する量×比率。300 × 0.4 = 120。340は300に40を足した数、750は300を0.4で割った数で、どちらも比率の使い方が違う。"},"practice":{"title":"流れ図の比率から、届く量を式で表し、割合を求める","lead":"続く矢印はかけ算、集まる矢印はたし算。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、図と問題文の一致、前提の範囲、下流の単元から見た不足、説明・確認問題との整合を確認。一度検証を通らず、作り直した後に全手順で再検証。","problems":[{"label":"続いて流れる","question":"図は、商品が工場Pから倉庫Qへ、倉庫Qから店Rへ流れる様子を表しています。箱の文字はその場所が扱う量、矢印の文字は、出発する場所の量のうち矢印の先に届く量の比率です。店Rが扱う量を表す式として正しいものを、次のうちからすべて選んでください。","answer":"アとイ","kind":"choice","select":"all","figures":[{"kind":"flow","caption":"図1　工場P、倉庫Q、店Rの流れ","alt":"PからQへ比率sの矢印、QからRへ比率tの矢印が、一列に続いている。","nodes":[{"id":"P","label":"P","col":0,"row":0},{"id":"Q","label":"Q","col":1,"row":0},{"id":"R","label":"R","col":2,"row":0}],"edges":[{"from":"P","to":"Q","label":"s"},{"from":"Q","to":"R","label":"t"}]}],"options":[{"key":"ア","text":"R = tQ","correct":true,"reason":"Rに入る矢印はQからの1本で、比率は t。Qの量のうち t が届く。"},{"key":"イ","text":"R = stP","correct":true,"reason":"Q = sP を R = tQ に代入すると、R = t × sP = stP になる。"},{"key":"ウ","text":"R = (s + t)P","correct":false,"reason":"続いて流れるときは、比率を足すのではなくかける。t はPの量ではなく、Qの量に対する比率。"}],"steps":[{"title":"矢印を1本ずつ、式にする","formula":"PからQへ、比率 s：Q = sP　…①\nQからRへ、比率 t：R = tQ　…②","body":"矢印1本につき、式が一つできます。矢印の先の量は、出発する箱の量に比率をかけたものです。"},{"title":"アを確かめる","formula":"ア：R = tQ\n②：R = tQ","body":"アは、②の式そのものです。正しい式です。"},{"title":"①を②に代入して、RをPで表す","formula":"R = tQ\nR = t × sP\nR = stP","body":"②の Q のところに、①の sP を入れます。かけ算はかける順番を変えても同じなので、比率の文字を先に、量の文字を後に並べて stP と書きます。イはこの式と同じなので、正しい式です。"},{"title":"ウを、数を入れて確かめる","formula":"P が 100、s が 0.5、t が 0.4 のとき\nQ：100 × 0.5 = 50\nR：50 × 0.4 = 20\nウの式：(0.5 + 0.4) × 100 = 90","body":"実際にRに届くのは20ですが、ウの式では90になります。合わないので、ウは正しくありません。イの式では 0.5 × 0.4 × 100 で20になり、合います。"},{"title":"正しい式を、すべて答える","formula":"ア：正しい\nイ：正しい\nウ：正しくない","body":"同じ量を、Qを使って表したのがア、Pまでさかのぼって表したのがイです。どちらも正しいので、両方選びます。"}]},{"label":"集まってから、続いて流れる","question":"図は、商品が工場Kと工場Lから倉庫Mに集まり、倉庫Mから店Nへ流れる様子を表しています。箱の文字はその場所が扱う量、矢印の文字は、出発する場所の量のうち矢印の先に届く量の比率です。店Nが扱う量を表す式として正しいものを、次のうちからすべて選んでください。","answer":"アとイとエ","kind":"choice","select":"all","figures":[{"kind":"flow","caption":"図2　工場K、工場Lから倉庫Mを通って店Nへの流れ","alt":"KからMへ比率aの矢印、LからMへ比率bの矢印があり、二つの矢印がMに集まっている。MからNへ比率cの矢印が続いている。KとLの間に矢印はない。","nodes":[{"id":"K","label":"K","col":0,"row":0},{"id":"L","label":"L","col":0,"row":2},{"id":"M","label":"M","col":1,"row":1},{"id":"N","label":"N","col":2,"row":1}],"edges":[{"from":"K","to":"M","label":"a"},{"from":"L","to":"M","label":"b"},{"from":"M","to":"N","label":"c"}]}],"options":[{"key":"ア","text":"N = cM","correct":true,"reason":"Nに入る矢印はMからの1本で、比率は c。"},{"key":"イ","text":"N = c(aK + bL)","correct":true,"reason":"M = aK + bL を N = cM に代入した式。Mに集まった量の全体に c がかかる。"},{"key":"ウ","text":"N = acK + bL","correct":false,"reason":"c が aK にしかかかっていない。Lから来た分も、Mを通るときに c がかかる。"},{"key":"エ","text":"N = acK + bcL","correct":true,"reason":"イの式のかっこをはずした式。c を aK と bL の両方にかけている。"}],"steps":[{"title":"矢印を、箱ごとに式にする","formula":"Mに入る矢印は2本：M = aK + bL　…①\nNに入る矢印は1本：N = cM　…②","body":"同じ箱に二つの矢印が入るときは、それぞれの届く量を足します。アは②の式そのものなので、正しい式です。"},{"title":"①を②に代入する","formula":"N = cM\nN = c(aK + bL)","body":"②の M のところに、①の aK + bL を入れます。入れる式が足し算でできているので、かっこをつけます。イがこの式なので、正しい式です。"},{"title":"かっこをはずす","formula":"c(aK + bL)\n= c × aK + c × bL\n= acK + bcL","body":"かっこの外の c を、中の aK と bL の両方にかけます（分配法則）。エがこの式なので、正しい式です。"},{"title":"ウを、エと比べる","formula":"エ：N = acK + bcL\nウ：N = acK + bL","body":"ウは、bL に c がかかっていません。かっこをはずすときに、c を片方にしかかけなかった形です。"},{"title":"数を入れて、四つの式を確かめる","formula":"K が 100、L が 200、a が 0.5、b が 0.1、c が 0.4 のとき\nMに届く量：100 × 0.5 + 200 × 0.1 = 70\nNに届く量：70 × 0.4 = 28\nエの式：0.5 × 0.4 × 100 + 0.1 × 0.4 × 200 = 28\nウの式：0.5 × 0.4 × 100 + 0.1 × 200 = 40","body":"実際にNに届くのは28です。ア（0.4 × 70）、イ（0.4 × (50 + 20)）、エは28になり、ウだけが40になって合いません。"}]},{"label":"二つの道すじを通って届く","question":"図は、商品が工場Xから店Zへ届くまでの流れを表しています。工場Xから倉庫Yを通って店Zへ行く道すじと、工場Xから店Zへ直接行く道すじがあります。箱の文字はその場所が扱う量、矢印の数は、出発する場所の量のうち矢印の先に届く量の比率です。工場Xが扱う量のうち、図にかかれていない残りは、ほかの店へ行きます。工場Xが扱う量のうち、店Zに届くのは何%でしょうか。","answer":"50%","figures":[{"kind":"flow","caption":"図3　工場Xから店Zへの二つの道すじ","alt":"XからYへ比率0.6の矢印、YからZへ比率0.5の矢印が続いている。それとは別に、XからZへ直接、比率0.2の矢印がある。","nodes":[{"id":"X","label":"X","col":0,"row":1},{"id":"Y","label":"Y","col":1,"row":0},{"id":"Z","label":"Z","col":2,"row":1}],"edges":[{"from":"X","to":"Y","label":"0.6"},{"from":"Y","to":"Z","label":"0.5"},{"from":"X","to":"Z","label":"0.2"}]}],"alternatives":[{"try":"0.6 × 0.5 = 0.3 で、30%","why_not":"Yを通る道すじの分だけ。直接届く0.2を足し忘れている。"},{"try":"0.6 + 0.5 + 0.2 = 1.3 で、130%","why_not":"0.5はXの量ではなく、Yの量に対する比率。そのまま足すことはできない。扱う量より多く届くことにもなり、おかしい。"},{"try":"0.6 × 0.5 × 0.2 = 0.06 で、6%","why_not":"三つの矢印は一列に続いていない。直接の道すじは、Yを通る道すじとは別に届くので、かけずに足す。"},{"try":"0.5 + 0.2 = 0.7 で、70%","why_not":"Zに入る二つの矢印の比率を足しているが、0.5はYの量、0.2はXの量に対する比率で、基準にしている量が違う。"},{"try":"0.5 ÷ 0.8 = 0.625 で、62.5%","why_not":"図にかかれた矢印の分（0.6 + 0.2 = 0.8）だけを全体にしている。問われているのは、ほかの店へ行く分も含めた、Xが扱う量全体に対する割合。"}],"steps":[{"title":"道すじを二つに分ける","formula":"道すじ1：X → Y → Z（比率 0.6、0.5）\n道すじ2：X → Z（比率 0.2）","body":"Zには矢印が二つ入っています。Yを通ってくる分と、直接くる分を、別々に求めてから足します。"},{"title":"道すじごとに、Xの量の何倍が届くかを求める","formula":"道すじ1：0.6 × 0.5 = 0.3\n道すじ2：0.2","body":"道すじ1は矢印が続いているので、比率をかけます。Xの量の0.6倍がYに届き、そのまた0.5倍がZに届くので、Xの量の0.3倍です。道すじ2は矢印が1本だけなので、そのまま0.2倍です。"},{"title":"二つの道すじの分を足す","formula":"0.3 + 0.2 = 0.5","body":"どちらもXの量に対する比率になったので、足せます。Zに届くのは、Xの量の0.5倍、つまり50%です。"},{"title":"Xが1,000個の場合で確かめる","formula":"Yに届く量：1,000 × 0.6 = 600\nYからZへ：600 × 0.5 = 300\nXからZへ直接：1,000 × 0.2 = 200\nZに届く量：300 + 200 = 500\n500 ÷ 1,000 = 0.5","body":"1,000個のうち500個がZに届くので、50%です。"}]},{"label":"二つの道すじを比べる","question":"図は、前の問題と同じ流れを表しています。箱の文字はその場所が扱う量、矢印の数は、出発する場所の量のうち矢印の先に届く量の比率です。倉庫Yを通って店Zに届く量は、工場Xから店Zへ直接届く量の何%にあたるでしょうか。","answer":"150%","figures":[{"kind":"flow","caption":"図3　工場Xから店Zへの二つの道すじ","alt":"XからYへ比率0.6の矢印、YからZへ比率0.5の矢印が続いている。それとは別に、XからZへ直接、比率0.2の矢印がある。","nodes":[{"id":"X","label":"X","col":0,"row":1},{"id":"Y","label":"Y","col":1,"row":0},{"id":"Z","label":"Z","col":2,"row":1}],"edges":[{"from":"X","to":"Y","label":"0.6"},{"from":"Y","to":"Z","label":"0.5"},{"from":"X","to":"Z","label":"0.2"}]}],"alternatives":[{"try":"0.6 ÷ 0.2 = 3 で、300%","why_not":"0.6はYに届く量の比率。Zに届くのはそのうちの0.5なので、0.3にしてから比べる。"},{"try":"0.2 ÷ 0.3 で、約67%","why_not":"基準にする量と比べる量が逆。「直接届く量の何%か」なので、直接届く量で割る。"},{"try":"0.5 ÷ 0.2 = 2.5 で、250%","why_not":"0.5はYの量に対する比率で、Xの量に対する比率ではない。Yを通る道すじは、0.6 × 0.5 = 0.3 にしてから比べる。"}],"steps":[{"title":"比べる量と、基準の量を決める","formula":"比べる量：Yを通ってZに届く量\n基準の量：XからZへ直接届く量","body":"「直接届く量の何%か」なので、基準は直接届く量です。"},{"title":"二つの量を、Xの量の何倍かで表す","formula":"Yを通って届く量：0.6 × 0.5 = 0.3\n直接届く量：0.2","body":"基準をそろえないと比べられません。どちらも、Xの量に対する比率に直します。"},{"title":"比べる量を、基準の量で割る","formula":"0.3 ÷ 0.2 = 1.5","body":"1.5は150%です。Yを通って届く量の方が多いので、100%を超えます。"},{"title":"Xが1,000個の場合で確かめる","formula":"Yを通って届く量：1,000 × 0.6 × 0.5 = 300\n直接届く量：1,000 × 0.2 = 200\n300 ÷ 200 = 1.5","body":"300個は200個の1.5倍で、150%です。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-idioms":{"id":"spi-idioms","name":"熟語","type":"learn","goal":"二字熟語の成り立ちを見分け、説明された意味に合う熟語を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"熟語の問題には、二字熟語の成り立ちを答えるものと、説明された意味に合う語を選ぶものがあります。成り立ちは、二つの漢字の関係で分けます。似た意味の字を重ねたもの、反対の意味の字を重ねたもの、前の字が後の字を詳しく説明する（修飾する）もの、動詞の後にその動作の対象（「〜を」「〜に」に当たる語。目的語）を置いたもの、主語（何が）と述語（どうする）の関係になっているものの五つです。見分けるときは、漢字を一字ずつ訓読みにするか、訓読みのない字はその字の意味を考えて、短い文に読み下します。意味を選ぶ問題では、選択肢の語を一つずつ自分の言葉で言いかえ、説明と重なる部分と、はみ出す部分を比べます。","example":"増加 → 増える・加わる（似た意味の字を重ねる）\n増減 → 増える・減る（反対の意味の字を重ねる）\n青空 → 青い空（前の字が後の字を修飾する）\n読書 → 書を読む（動詞の後に目的語を置く）\n地震 → 地が震える（主語と述語の関係。何が・どうする）","note":"「読書」は下の字から上の字へ返って読むと、意味が通ります。"},"cost":{"hours":10,"yen":0},"assessment":{"question":"「読書」と同じ成り立ちの熟語は？","options":["登山","永久","日没"],"answer":0,"explanation":"読書は「書を読む」で、動詞の後に目的語を置く形。登山も「山に登る」で同じ形。永久は似た意味の字を重ねたもの、日没は「日が没する」で主語と述語の関係。"},"practice":{"title":"漢字を読み下して成り立ちを見分け、意味に合う語を選ぶ","lead":"一字ずつ意味を確かめて、短い文に読み下す。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"一つの熟語の成り立ちを答える","question":"熟語「温暖」の成り立ちとして当てはまるものは、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"似た意味の字を重ねる","correct":true,"reason":"「温」も「暖」も、あたたかいという意味。"},{"key":"イ","text":"反対の意味の字を重ねる","correct":false,"reason":"「温」と「暖」は反対の意味ではない。"},{"key":"ウ","text":"前の字が後の字を修飾する","correct":false,"reason":"「温かい暖」とは読めず、一方がもう一方を説明していない。"},{"key":"エ","text":"動詞の後に目的語を置く","correct":false,"reason":"下から上へ返って「暖を温める」と読んでも、意味が通らない。"},{"key":"オ","text":"主語と述語の関係にある","correct":false,"reason":"上から下へ「温が暖まる」と読んでも、意味が通らない。"}],"steps":[{"title":"漢字を一字ずつ、訓読みにする","formula":"温 → あたたかい\n暖 → あたたかい","body":"音読みのままでは関係が見えにくいので、一字ずつ訓読みに直して意味を確かめます。"},{"title":"二つの字の意味の関係を比べる","formula":"温（あたたかい）と 暖（あたたかい）\n→ 似た意味","body":"どちらの字も、あたたかいという意味です。反対の意味ではないので、イではありません。"},{"title":"ほかの成り立ちに当てはまらないか確かめる","formula":"ウ：温かい暖 → 意味が通らない\nエ：暖を温める → 意味が通らない\nオ：温が暖まる → 意味が通らない","body":"「温」と「暖」は対等に並んでいます。一方がもう一方を説明したり、「〜を〜する」「〜が〜する」と読み下したりすることはできません。"},{"title":"同じ成り立ちの熟語で確かめる","formula":"増加 → 増（ふえる）・加（くわわる）\n温暖 → 温（あたたかい）・暖（あたたかい）","body":"似た意味の字を重ねた「増加」と同じ形です。答えはアです。"}]},{"label":"三つの熟語の成り立ちを見分ける","question":"次の三つの熟語の成り立ちを、それぞれ下のア〜オから選んでください。\n①着席　②国営　③強風\nア　似た意味の字を重ねる\nイ　反対の意味の字を重ねる\nウ　前の字が後の字を修飾する\nエ　動詞の後に目的語を置く\nオ　主語と述語の関係にある","answer":"①エ　②オ　③ウ","steps":[{"title":"①着席を、読み下す","formula":"着席 → 席に着く\n成り立ち：エ（動詞の後に目的語を置く）","body":"上の字「着」が動詞で、下の字「席」がその対象です。下から上へ返って読むと意味が通ります。「〜に」と読む場合も、この形に入ります。"},{"title":"②国営を、読み下す","formula":"国営 → 国が営む\n成り立ち：オ（主語と述語の関係）","body":"上の字「国」が主語で、下の字「営」が述語です。上から下へ「〜が〜する」と読めます。"},{"title":"③強風を、読み下す","formula":"強風 → 強い風\n成り立ち：ウ（前の字が後の字を修飾する）","body":"上の字「強」が、下の字「風」がどんな風かを説明しています。"},{"title":"三つの読み下し方の違いをまとめる","formula":"着席：下から上へ「席に着く」\n国営：上から下へ「国が営む」\n強風：上から下へ「強い風」","body":"「〜を」「〜に」と下から返って読めればエ、「〜が」と読めればオ、上の字が下の字を説明していればウです。ウには、「予習（予（あらかじ）め習う）」のように、上の字が下の動作を説明するものもあります。"}]},{"label":"説明に合う語を選ぶ","question":"「対立している両者が、互いにゆずり合って一致点を見つけること」という意味に最も近い語は、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"妥協","correct":true,"reason":"対立している、互いにゆずり合う、一致点を見つける、の三つすべてに当てはまる。"},{"key":"イ","text":"協調","correct":false,"reason":"利害や立場の違う者が力を合わせること。中心は協力で、互いにゆずり合うことは意味の中心にない。"},{"key":"ウ","text":"譲渡","correct":false,"reason":"権利や財産を一方がゆずり渡すことで、互いにゆずり合うことではない。"},{"key":"エ","text":"交渉","correct":false,"reason":"話し合うこと自体を指し、一致点が見つかったかどうかは含まない。"}],"steps":[{"title":"説明を、欠かせない部分に分ける","formula":"① 対立している\n② 互いにゆずり合う\n③ 一致点を見つける","body":"説明を、いくつかの部分に分けます。三つすべてに当てはまる語を探します。"},{"title":"選択肢を一つずつ、自分の言葉で言いかえる","formula":"妥協：対立する両者がゆずり合って、話をまとめること\n協調：立場や利害の違う者どうしが、力を合わせること\n譲渡：権利や財産を、ほかの人にゆずり渡すこと\n交渉：ある問題について、相手と話し合うこと","body":"似た字や、似た場面で使う語が並んでいます。字の印象ではなく、言いかえた意味で比べます。"},{"title":"説明の三つの部分と比べる","formula":"妥協：①②③に当てはまる\n協調：中心は協力で、互いにゆずり合うことは意味の中心にない\n譲渡：ゆずるのは一方だけで、物や権利の話\n交渉：話し合うことで、まとまるとは限らない","body":"「譲渡」は「譲」の字から選びたくなりますが、互いにゆずり合うのではなく、一方が渡すことです。「交渉」は話し合いの途中を指し、一致点が見つかったかどうかは含みません。"},{"title":"選んだ語を、短い文に入れて確かめる","formula":"双方が妥協して、契約がまとまった。","body":"対立していた両者がゆずり合って話をまとめた、という意味で通ります。答えはアです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-inference":{"id":"spi-inference","name":"推論","type":"learn","goal":"与えられた条件から、順位や内訳について必ず言えることを判断できる。","part_of":"spi","tags":["logic"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"推論は、与えられた条件を整理して、そこから確実に言えることを判断する問題です。計算よりも、条件を図や表にまとめる力を使います。あり得る場合をすべて書き出し、そのすべてで成り立つことだけが「必ず正しい」と言えます。一つの場合でも成り立たなければ「正しいとは限らない」、どの場合でも成り立たなければ「必ず誤り」です。","example":"条件：XはYより背が高い。YはZより背が高い。\n整理：X ＞ Y ＞ Z\n必ず正しい：XはZより背が高い\n\n条件：XはYより背が高い。XはZより背が高い。\n整理：X ＞ Y、X ＞ Z（YとZの順は決まらない）\n正しいとは限らない：YはZより背が高い","note":"二つ目の例では、YとZのどちらが高い場合もあり得ます。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。前提なしで足りることを確認（使うのは順序の整理と、1けたの数の合計だけ）。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":12,"yen":0},"assessment":{"question":"AはBより前、BはCより前に到着した。必ず正しいのは？","options":["CはAより前","AはCより前","Bは最後"],"answer":1,"explanation":"条件を A → B → C と並べる。AはCより前。最後はCなので「Bは最後」は誤り。"},"practice":{"title":"条件を整理して、必ず言えることを判断する","lead":"決まることと、決まらないことを分ける。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"順位の条件を整理する","question":"A、B、C、Dの4人が競走をしました。同着はなく、次の三つのことがわかっています。\n① AはBより先にゴールした。\n② CはAより先にゴールした。\n③ DはCより後にゴールした。\nこのとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Cは1位である\nイ　Dは4位である\nウ　AはDより先にゴールした","answer":"アだけ","steps":[{"title":"三つの条件を、矢印で置く","formula":"① A → B\n② C → A\n③ C → D\n（矢印の左が、先にゴールした人）","body":"文のままでは比べにくいので、先にゴールした人を左にして、同じ形にそろえます。"},{"title":"つながる条件を、一本につなぐ","formula":"②と①：C → A → B\n③：C → D","body":"②の右と①の左がどちらもAなので、つなげられます。Dは、Cより後ということしかわかっていません。"},{"title":"Cの順位が決まるか調べる","formula":"CはAより先\nCはBより先（C → A → B から）\nCはDより先","body":"Cは、ほかの3人全員より先にゴールしています。Cは1位に決まります。"},{"title":"Dの入る場所を、すべて書き出す","formula":"C D A B\nC A D B\nC A B D","body":"A → B の順は決まっています。DはCより後ならどこでもよいので、並び方は3通りあります。"},{"title":"三つの文を、3通りすべてで調べる","formula":"ア：3通りすべてでCは1位 → 必ず正しい\nイ：Dが4位なのは C A B D だけ → 正しいとは限らない\nウ：C D A B ではDがAより先 → 正しいとは限らない","body":"「必ず正しい」と言えるのは、あり得る並び方のすべてで成り立つ文だけです。1通りでも成り立たなければ、必ず正しいとは言えません。"}]},{"label":"個数の内訳を場合分けする","question":"赤、青、白の玉が合わせて10個あります。どの色も1個以上あり、赤は青より多く、青は白より多いことがわかっています。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　白は1個である\nイ　青は3個以上である\nウ　赤は5個以上である","answer":"ウだけ","steps":[{"title":"条件を置く","formula":"合計：10個\nどの色も1個以上\n赤 ＞ 青 ＞ 白","body":"いちばん少ないのは白です。白の個数を小さい順に決めて、あり得る内訳をすべて書き出します。"},{"title":"白が1個の場合を書き出す","formula":"青と赤の合計：10 − 1 = 9\n白1・青2・赤7\n白1・青3・赤6\n白1・青4・赤5","body":"青は白より多いので2個以上です。青が5個だと赤は4個になり、赤が青より多いという条件に合いません。青がそれより多くても同じです。"},{"title":"白が2個の場合を書き出す","formula":"青と赤の合計：10 − 2 = 8\n白2・青3・赤5","body":"青は3個以上です。青が4個だと赤も4個になり、条件に合いません。青がそれより多くても同じです。"},{"title":"白が3個以上の場合がないことを確かめる","formula":"3 + 4 + 5 = 12","body":"白が3個以上なら、青は4個以上、赤は5個以上が必要です。いちばん少なくても12個になり、10個を超えます。"},{"title":"あり得る内訳をまとめ、合計を確かめる","formula":"1 + 2 + 7 = 10\n1 + 3 + 6 = 10\n1 + 4 + 5 = 10\n2 + 3 + 5 = 10","body":"白・青・赤の内訳は、この4通りだけです。"},{"title":"三つの文を、4通りすべてで調べる","formula":"ア：白2・青3・赤5 では白は2個 → 正しいとは限らない\nイ：白1・青2・赤7 では青は2個 → 正しいとは限らない\nウ：赤は7、6、5、5個で、すべて5個以上 → 必ず正しい","body":"4通りのすべてで成り立つのは、ウだけです。"}]},{"label":"位置の条件を場合分けする","question":"5階建ての建物の1階から5階に、P、Q、R、S、Tの5人が1人ずつ住んでいます。PはQより2つ上の階に住み、RはSのすぐ下の階に住んでいます。このとき、次のうち必ず正しいと言えるものはどれでしょうか。\nア　Pは5階に住んでいる\nイ　Tは2階か4階に住んでいる\nウ　SはQより上の階に住んでいる","answer":"イだけ","steps":[{"title":"条件を置く","formula":"階：1階から5階に1人ずつ\n条件1：PはQの2つ上の階\n条件2：RはSのすぐ下の階","body":"あり得る場合が少ない条件から先に使います。条件1は、PとQの階の組が3通りしかありません。"},{"title":"条件1に合うPとQの階を書き出す","formula":"Q1階・P3階\nQ2階・P4階\nQ3階・P5階","body":"Qが4階だとPは6階になり、建物にありません。"},{"title":"それぞれの場合で、残っている階を書き出す","formula":"Q1階・P3階 → 残りは2階、4階、5階\nQ2階・P4階 → 残りは1階、3階、5階\nQ3階・P5階 → 残りは1階、2階、4階","body":"残りの三つの階に、R、S、Tが入ります。"},{"title":"条件2に合う入り方があるか、場合ごとに調べる","formula":"2階、4階、5階 → R4階・S5階、Tは2階\n1階、3階、5階 → 上下に続いた階がないので、あり得ない\n1階、2階、4階 → R1階・S2階、Tは4階","body":"RとSは、上下に続いた二つの階に、Rが下、Sが上になるように入る必要があります。残ったTの階も、これで決まります。"},{"title":"あり得る住み方をまとめる","formula":"住み方1（1階から順に）：Q、T、P、R、S\n住み方2（1階から順に）：R、S、Q、T、P","body":"条件に合う住み方は、この2通りだけです。"},{"title":"三つの文を、2通りの両方で調べる","formula":"ア：住み方1ではPは3階 → 正しいとは限らない\nイ：Tは住み方1で2階、住み方2で4階 → 必ず正しい\nウ：住み方2ではSは2階、Qは3階 → 正しいとは限らない","body":"2通りの両方で成り立つのは、イだけです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-installment":{"id":"spi-installment","name":"分割払い","type":"learn","goal":"総額を1として、分割払いの各回の支払いが総額のどれだけにあたるかを求められる。","part_of":"spi","tags":["sansu","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"分割払いの問題は、代金を何回かに分けて払うときに、ある回の支払いが総額のどれだけにあたるかを求める問題です。金額が書かれていないので、総額を1と置いて、支払いを分数で表します。最初に払う頭金を引いた残りを、残額といいます。残額を毎回同じ額ずつ払うのが均等払いで、残額を回数で割ると1回分になります。「総額の1/3」と「残額の1/3」では、もとにする量が違うので、どちらなのかを先に確かめます。","example":"残額 = 1 − 頭金の割合\n均等払いの1回分 = 残額 ÷ 回数\n例　総額の1/4を頭金で払い、残りを5回の均等払いにするとき\n　残額：1 − 1/4 = 3/4\n　1回分：(3/4) ÷ 5 = 3/20","note":"手数料がないときは、払った分をすべて足すと総額の1に戻ります。手数料があるときは、1に手数料を足した数になります。これで確かめられます。"},"cost":{"hours":4,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"総額の1/3を頭金として払い、残りを4回の均等払いにする。1回分は総額のどれだけ？","options":["1/6","1/4","1/12"],"answer":0,"explanation":"残額は 1 − 1/3 = 2/3。これを4回で割ると 2/3 ÷ 4 = 2/12 = 1/6。1/12 は、頭金の1/3を4で割ってしまった場合の数。1/4 は、頭金を引かずに1を4で割った数。"},"practice":{"title":"総額を 1 として、各回の支払いを分数で求める","lead":"何をもとにした割合かを、先に確かめる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"頭金を払い、残りを均等に払う","question":"ある商品を買うのに、購入額の2/5を頭金として払い、残りを6回の均等払いにしました。均等払いの1回分は、購入額のどれだけにあたるでしょうか。","answer":"1/10","alternatives":[{"try":"2/5 ÷ 6 = 1/15","why_not":"6回に分けるのは、頭金の2/5ではなく、頭金を払った後の残りの3/5。"}],"steps":[{"title":"購入額を 1 と置く","formula":"購入額：1\n頭金：2/5\n残り：6回の均等払い","body":"金額が書かれていないので、購入額を1と置きます。支払いは、すべて購入額に対する分数で表します。"},{"title":"頭金を払った後の残額を求める","formula":"1 − 2/5 = 3/5","body":"全体の1から、頭金の2/5を引きます。これから払う分は、購入額の3/5です。"},{"title":"残額を回数で割って、1回分を求める","formula":"(3/5) ÷ 6 = 3/5 × 1/6 = 3/30 = 1/10","body":"6回で均等に払うので、残額を6で割ります。6で割ることは、1/6をかけることと同じです。"},{"title":"払った分をすべて足して、購入額になるか確かめる","formula":"均等払いの合計：1/10 × 6 = 6/10 = 3/5\n2/5 + 3/5 = 1","body":"頭金と、6回分の均等払いを足すと1になります。"}]},{"label":"残額をもとにした支払いがある","question":"ある工事の代金を、次のように払います。契約時に総額の1/4を払い、完成時に、そのときの残額の1/3を払います。残りは、4回の均等払いにします。均等払いの1回分は、総額のどれだけにあたるでしょうか。","answer":"1/8","alternatives":[{"try":"1 − 1/4 − 1/3 = 5/12、5/12 ÷ 4 = 5/48","why_not":"完成時に払うのは「総額の1/3」ではなく「残額の1/3」。残額3/4の1/3なので、総額に対しては1/4になる。"}],"steps":[{"title":"総額を 1 と置き、支払いごとに、もとにする量を確かめる","formula":"総額：1\n契約時：総額の1/4\n完成時：残額の1/3\n残り：4回の均等払い","body":"契約時の支払いは総額がもと、完成時の支払いは残額がもとです。もとにする量が途中で変わります。"},{"title":"契約時に払った後の残額を求める","formula":"1 − 1/4 = 3/4","body":"総額の1から、契約時の1/4を引きます。"},{"title":"完成時に払う分を、総額に対する分数で表す","formula":"3/4 × 1/3 = 3/12 = 1/4","body":"残額3/4の、そのまた1/3です。総額に対する分数に直すため、残額に1/3をかけます。"},{"title":"完成時に払った後の残額を求める","formula":"3/4 − 1/4 = 2/4 = 1/2","body":"契約時の後の残額から、完成時に払った分を引きます。"},{"title":"残額を回数で割って、1回分を求める","formula":"(1/2) ÷ 4 = 1/2 × 1/4 = 1/8","body":"残りの1/2を、4回で均等に払います。"},{"title":"払った分をすべて足して、総額になるか確かめる","formula":"均等払いの合計：1/8 × 4 = 4/8 = 1/2\n1/4 + 1/4 + 1/2 = 1","body":"契約時、完成時、均等払いの合計を足すと1になります。"}]},{"label":"手数料が加わる","question":"ある商品を買うのに、購入額の1/5を頭金として払い、残りを10回の均等払いにします。ただし、分割払いの手数料として、頭金を払った後の残額の1/10にあたる額が、1度だけ残額に加算されます。均等払いの1回分は、購入額のどれだけにあたるでしょうか。","answer":"11/125","alternatives":[{"try":"4/5 ÷ 10 = 2/25","why_not":"手数料を加える前の残額を割っている。10回で払うのは、残額に手数料を足した額。"},{"try":"手数料を購入額の1/10として、4/5 + 1/10 = 9/10、9/10 ÷ 10 = 9/100","why_not":"手数料は「購入額の1/10」ではなく「残額の1/10」。残額4/5の1/10なので、購入額に対しては2/25になる。"}],"steps":[{"title":"購入額を 1 と置き、頭金を払った後の残額を求める","formula":"購入額：1\n1 − 1/5 = 4/5","body":"頭金を払った後の残額は、購入額の4/5です。"},{"title":"手数料を、購入額に対する分数で表す","formula":"4/5 × 1/10 = 4/50 = 2/25","body":"手数料は、残額の1/10です。残額の4/5に1/10をかけます。"},{"title":"残額に手数料を足して、均等払いで払う合計を求める","formula":"4/5 + 2/25 = 20/25 + 2/25 = 22/25","body":"分母を25にそろえて足します。均等払いで払うのは、購入額の22/25にあたる額です。"},{"title":"合計を回数で割って、1回分を求める","formula":"(22/25) ÷ 10 = 22/250 = 11/125","body":"10回で均等に払うので、10で割ります。分母と分子を2で割って約分します。"},{"title":"払った分をすべて足して、購入額と手数料の合計になるか確かめる","formula":"均等払いの合計：11/125 × 10 = 110/125 = 22/25\n払った合計：1/5 + 22/25 = 5/25 + 22/25 = 27/25\n購入額と手数料：1 + 2/25 = 27/25","body":"手数料があるので、払った合計は1より大きくなります。購入額の1に手数料の2/25を足した額と同じになっています。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-nonverbal":{"id":"spi-nonverbal","name":"SPI非言語","type":"target","goal":"代表的な非言語問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","featured":true,"scope_note":"代表分野への学習経路です。SPI全範囲や通過を保証するものではありません。条件と領域・グラフの領域など、座標の図が要る分野は未収録です。企業の受検案内で方式を確認してください。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。非言語は能力検査のうち、数を使った処理と論理的な思考を測る分野です。出題される内容や形式は、受検方式によって異なります。ここでは代表的な分野を単元として並べています。","example":"この木に入れている分野：損益算、料金の割引、速さと時間、仕事算、集合、順列と組合せ、確率、表の読み取り、推論、分割払い、代金の精算、長文の読み取り計算、物の流れと比率","note":"全範囲を網羅したものではありません。受検方式は、企業からの受検案内で確かめてください。"},"cost":{"hours":15,"yen":0},"requires":[{"id":"spi-profit","level":"must"},{"id":"spi-discount","level":"must"},{"id":"spi-speed","level":"must"},{"id":"spi-work","level":"must"},{"id":"spi-sets","level":"must"},{"id":"spi-counting","level":"must"},{"id":"math-probability","level":"must"},{"id":"spi-tables","level":"must"},{"id":"spi-inference","level":"must"},{"id":"spi-installment","level":"must"},{"id":"spi-settlement","level":"must"},{"id":"spi-text-calc","level":"must"},{"id":"spi-flow","level":"helps"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/"},{"title":"実務教育出版：SPIの基礎知識（方式別に出題が異なる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf"}],"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-profit":{"id":"spi-profit","name":"損益算","type":"learn","goal":"原価、定価、利益の関係から、売値や利益率を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"損益算は、商品の仕入れと販売で生じる利益や損失を、割合を使って計算する問題です。仕入れた値段を原価、利益を見込んでつけた値段を定価、実際に売った値段を売値といいます。利益は「売値 − 原価」で、マイナスなら損失です。「原価の何%の利益」「定価の何%引き」のように、割合の基準が原価か定価かで計算が変わるので、基準を先に確かめます。","example":"定価 = 原価 × (1 + 見込む利益の割合)\n売値 = 定価 × (1 − 割引の割合)\n利益 = 売値 − 原価\n利益率（原価に対する）= 利益 ÷ 原価\n例　原価1,000円に2割の利益を見込んだ定価：1,000 × 1.2 = 1,200","note":"言葉の式に、問題文の数を当てはめて解きます。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは百分率、基準を1と置く考え方、小数のかけ算・わり算で、割合と比（その前提の小数と分数を含む）に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"原価600円の商品を750円で売った。原価に対する利益率は？","options":["20%","25%","125%"],"answer":1,"explanation":"利益は150円。利益率は150 ÷ 600 = 0.25 = 25%。売値ではなく原価で割る。"},"practice":{"title":"原価・定価・売値の関係から求める","lead":"何に対する割合かを、一つずつ確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現を確認し、指摘を反映した後に再検証。","problems":[{"label":"利益を見込んで定価をつける","question":"原価800円の商品に、原価の25%の利益を見込んで定価をつけました。定価はいくらでしょうか。","answer":"1,000円","steps":[{"title":"わかっている数と、割合の基準を置く","formula":"原価：800円\n見込む利益：原価の25%","body":"「原価の25%」と書いてあるので、25%は原価800円に対する割合です。"},{"title":"見込む利益を、金額で求める","formula":"800 × 0.25 = 200","body":"25%は小数で0.25です。基準の原価にかけると、利益の金額になります。"},{"title":"原価に利益を足して、定価を求める","formula":"800 + 200 = 1,000","body":"定価は、原価に見込んだ利益を上乗せした値段です。"},{"title":"同じ計算を、一つの式にまとめる","formula":"800 × (1 + 0.25) = 800 × 1.25 = 1,000","body":"原価の1倍に0.25倍を足すので、原価を1.25倍すれば一度で定価が出ます。"},{"title":"定価1,000円で、利益が原価の25%になるか確かめる","formula":"1,000 − 800 = 200\n200 ÷ 800 = 0.25","body":"利益200円は原価800円の25%です。問題の条件に合います。"}]},{"label":"定価から割り引いて売る","question":"原価1,200円の商品に、原価の30%の利益を見込んで定価をつけました。売れないので、定価の10%引きで売りました。利益は何円でしょうか。また、それは原価の何%でしょうか。","answer":"利益は204円、原価の17%","steps":[{"title":"三つの値段と、それぞれの割合の基準を置く","formula":"原価：1,200円\n定価：原価の30%増し\n売値：定価の10%引き","body":"原価の30%の利益を見込むので、定価は原価の30%増しです。30%は原価に対する割合、10%は定価に対する割合で、途中で基準が変わります。"},{"title":"原価から定価を求める","formula":"1,200 × 1.3 = 1,560","body":"原価の30%増しなので、原価を1.3倍します。"},{"title":"定価から売値を求める","formula":"1,560 × 0.9 = 1,404","body":"10%引きは、定価の90%で売るということです。定価を0.9倍します。"},{"title":"売値から原価を引いて、利益を求める","formula":"1,404 − 1,200 = 204","body":"利益は、実際に売った値段と原価の差です。定価との差ではありません。"},{"title":"利益が原価の何%かを求める","formula":"204 ÷ 1,200 = 0.17","body":"「原価の何%か」なので、原価で割ります。0.17は17%です。"},{"title":"30% − 10% = 20% としてはいけない理由を確かめる","formula":"見込んだ利益：1,200 × 0.3 = 360\n値引き：1,560 × 0.1 = 156\n360 − 156 = 204","body":"10%引きは定価1,560円に対する156円です。原価の10%（120円）ではないので、利益は原価の20%（240円）になりません。"}]},{"label":"利益から原価をさかのぼる","question":"ある商品に、原価の40%の利益を見込んで定価をつけました。定価の20%引きで売ったところ、利益は180円でした。原価はいくらでしょうか。","answer":"1,500円","steps":[{"title":"わからない原価を 1 と置く","formula":"原価：1\n定価：原価の40%増し\n売値：定価の20%引き\n利益：180円","body":"原価の金額がわからないので、原価を1として、ほかの値段を原価の何倍かで表します。原価の40%の利益を見込むので、定価は原価の40%増しです。"},{"title":"定価が原価の何倍かを求める","formula":"1 × 1.4 = 1.4","body":"原価の40%増しなので、定価は原価の1.4倍です。"},{"title":"売値が原価の何倍かを求める","formula":"1.4 × 0.8 = 1.12","body":"20%引きは定価の80%です。売値は原価の1.12倍になります。"},{"title":"利益が原価の何倍かを求める","formula":"1.12 − 1 = 0.12","body":"売値から原価を引いた残りが利益です。利益は原価の0.12倍、つまり12%です。"},{"title":"利益180円から、原価を求める","formula":"原価の0.12倍 = 180\n原価 = 180 ÷ 0.12 = 1,500","body":"原価の0.12倍が180円なので、180を0.12で割ると原価に戻ります。"},{"title":"原価1,500円で、利益が180円になるか確かめる","formula":"定価：1,500 × 1.4 = 2,100\n売値：2,100 × 0.8 = 1,680\n利益：1,680 − 1,500 = 180","body":"利益は180円で、問題の条件に合います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-reading":{"id":"spi-reading","name":"長文読解","type":"learn","goal":"長文を読み、空欄に入る語や、本文の内容に合う選択肢を選べる。","part_of":"spi","tags":["kokugo","reading"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"長文読解は、数百字ほどの文章を読んで、いくつかの問いに答える問題です。ここでは、三つの型の問いを扱います。空欄に入る接続語などを選ぶもの、指示語や語句が指す内容を答えるもの、本文の内容に合う選択肢を選ぶものです。どの型でも、答えの根拠は本文の中にあります。自分の意見や知識ではなく、本文のどの文に書いてあるかを示せる選択肢を選びます。先に問いを読んで何を探すかを決めてから本文を読むと、探す場所をしぼれます。","example":"空欄に入る語：空欄の前の文と後の文の関係を確かめる\n指示語の内容：直前の文から探し、当てはめて意味が通るか確かめる\n内容に合うもの：選択肢を一つずつ、本文の文と照らし合わせる","note":"本文に書かれていないことや、本文より言いすぎている選択肢は、常識として正しそうでも選びません。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"jp-reading","level":"must"}],"assessment":{"question":"「朝から強い雨が降っていた。（　）、遠足は中止になった。」の空欄に入る語は？","options":["だから","しかし","たとえば"],"answer":0,"explanation":"強い雨は、遠足が中止になった理由。前が理由、後が結果なので「だから」。「しかし」は逆の内容、「たとえば」は例が続くときに使う。"},"practice":{"title":"本文の中に根拠を見つけて答える","lead":"どの文に書いてあるかを、指で示せる選択肢を選ぶ。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","passage":"道具は、人の能力を広げるために作られてきた。たとえば、望遠鏡は遠くのものを見る力を、自動車は速く移動する力を広げた。［　1　］、道具に頼るほど、もともと持っていた力は使われなくなる。地図アプリを使う人は、道順を覚えようとしなくなる。これを、力が衰えたとなげく人もいる。しかし、私はそうは考えない。覚えることに使っていた力を、別のことに向けられるようになったと考えるからである。大切なのは、道具に任せることと自分で行うことを、自分で選べることだ。","problems":[{"label":"空欄に入る接続語を選ぶ","question":"本文の［　1　］に入る語として最も適切なものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"なぜなら","correct":false,"reason":"後の文は、前の文（力が広がったこと）の理由を述べていない。"},{"key":"イ","text":"一方で","correct":true,"reason":"前の文は道具が力を広げる面、後の文は力が使われなくなる面で、向きの違う二つの面を並べている。"},{"key":"ウ","text":"つまり","correct":false,"reason":"後の文は、前の文の言いかえではない。"}],"steps":[{"title":"空欄の前の文が、何を述べているかをまとめる","formula":"前の文：望遠鏡は遠くのものを見る力を、自動車は速く移動する力を広げた。\nまとめ：道具のよい面","body":"空欄に入る語は、前の文と後の文の関係で決まります。まず前の文の内容を、短くまとめます。"},{"title":"空欄の後の文が、何を述べているかをまとめる","formula":"後の文：道具に頼るほど、もともと持っていた力は使われなくなる。\nまとめ：道具の、もう一つの面","body":"前の文は力が広がる話、後の文は力が使われなくなる話です。向きの違う内容が並んでいます。"},{"title":"三つの語の使い方を確かめる","formula":"なぜなら：前の文の理由を、後で述べるときに使う\n一方で：前と向きの違う面を並べるときに使う\nつまり：前を言いかえるときに使う","body":"後の文は、力が広がったことの理由ではありません。前の文の言いかえでもありません。別の面を並べる「一方で」が合います。"},{"title":"入れた文を読み通して確かめる","formula":"…自動車は速く移動する力を広げた。一方で、道具に頼るほど、もともと持っていた力は使われなくなる。","body":"道具の二つの面を並べる文として、意味が通ります。答えはイです。"}]},{"label":"指示語が指す内容を答える","question":"本文の「これを、力が衰えたとなげく人もいる」の「これ」が指す内容として最も適切なものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"道具が、人の能力を広げてきたこと","correct":false,"reason":"能力が広がったことは、「力が衰えた」となげく内容にならない。"},{"key":"イ","text":"道具に頼ると、もともと持っていた力が使われなくなること","correct":true,"reason":"直前の文が例になっている、一つ前の文の内容。当てはめて意味が通る。"},{"key":"ウ","text":"地図アプリが、道順を教えてくれること","correct":false,"reason":"便利であることは「力が衰えた」となげく内容にならない。アプリが道順を教えてくれるとも、本文には書かれていない。"}],"steps":[{"title":"指示語の直前の文と、その前の文を書き出す","formula":"直前の文：地図アプリを使う人は、道順を覚えようとしなくなる。\nその前の文：道具に頼るほど、もともと持っていた力は使われなくなる。","body":"指示語は、ふつう直前の内容を指します。直前の文は、その前の文の具体例になっています。選択肢に直前の文そのものはないので、直前の文が何の例かを確かめ、もとの内容に当たる選択肢を探します。"},{"title":"指示語の後に続く言葉から、内容をしぼる","formula":"これを、力が衰えたとなげく","body":"「力が衰えた」となげかれるのは、力に関わる、よくない方の変化です。能力が広がったこと（ア）や、アプリが道順を教えてくれること（ウ）は、なげく内容になりません。"},{"title":"選択肢を「これ」に当てはめて読む","formula":"ア：能力を広げてきたことを、力が衰えたとなげく（通らない）\nイ：もともとの力が使われなくなることを、力が衰えたとなげく（通る）\nウ：アプリが道順を教えてくれることを、力が衰えたとなげく（通らない）","body":"当てはめて意味が通るのは、イだけです。"},{"title":"本文のどこに書いてあるかを確かめる","formula":"根拠の文：道具に頼るほど、もともと持っていた力は使われなくなる。","body":"イは、本文のこの文とほぼ同じ内容です。直前の地図アプリの文は、その一つの例に当たります。"}]},{"label":"筆者の考えに合う選択肢を選ぶ","question":"本文で述べられている筆者の考えに合うものは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"道具に頼ると力が衰えるので、できるだけ使わない方がよい。","correct":false,"reason":"力が衰えたというのは「なげく人」の見方で、筆者は打ち消している。使わない方がよいとも書かれていない。"},{"key":"イ","text":"道具に任せた分の力は、別のことに向けることができる。","correct":true,"reason":"本文の「覚えることに使っていた力を、別のことに向けられるようになった」に当たる。"},{"key":"ウ","text":"道具に任せるか自分で行うかは、道具の性能によって決まる。","correct":false,"reason":"本文は「自分で選べること」と述べていて、道具の性能には触れていない。"}],"steps":[{"title":"筆者の考えが書かれている文を探す","formula":"しかし、私はそうは考えない。\n覚えることに使っていた力を、別のことに向けられるようになったと考えるからである。\n大切なのは、道具に任せることと自分で行うことを、自分で選べることだ。","body":"「私は」「考える」「大切なのは」という言葉のある文が、筆者の考えです。それより前は、事実として述べていることと、ほかの人の見方の説明です。"},{"title":"アを、本文と照らし合わせる","formula":"ア：力が衰えるので、使わない方がよい\n本文：力が衰えたとなげく人もいる。しかし、私はそうは考えない。","body":"力が衰えたというのは、筆者ではなく「なげく人」の見方です。筆者はそれを打ち消しています。「使わない方がよい」とも書かれていません。"},{"title":"イを、本文と照らし合わせる","formula":"イ：任せた分の力は、別のことに向けられる\n本文：覚えることに使っていた力を、別のことに向けられるようになった","body":"本文は道順を覚える力を例にしていますが、道具に頼ることについての話の中の例です。「任せた分の力」とまとめた言い方でも、筆者の考えに合います。"},{"title":"ウを、本文と照らし合わせる","formula":"ウ：道具の性能によって決まる\n本文：自分で選べることだ","body":"本文は、選ぶのは自分だと述べています。道具の性能については、どこにも書かれていません。"},{"title":"根拠を示せた選択肢を選ぶ","formula":"ア：筆者が打ち消している見方\nイ：本文に根拠がある\nウ：本文に書かれていない","body":"本文の文を根拠として示せるのは、イだけです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-sentence-order":{"id":"spi-sentence-order","name":"文の並べ替え","type":"learn","goal":"ばらばらの語句や文を、意味の通る順に並べ替えられる。","part_of":"spi","tags":["kokugo","reading"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"文の並べ替えは、順番を入れかえた語句や文を、意味の通る順に戻す問題です。一つの文の中の語句を並べ替えるものと、いくつかの文を並べ替えて文章にするものがあります。全部を一度に並べようとせず、必ずつながる二つを先に見つけます。語句の並べ替えでは、文の最初と最後の決まっている部分につながるものから決めます。文の並べ替えでは、指示語と接続語を手がかりにします。「この」「そこで」「たとえば」で始まる文は、前に受ける内容が必要なので、最初には来ません。","example":"A：その結果、売り上げが伸びた。\nB：店は、商品の並べ方を変えた。\n手がかり：Aの「その結果」は、前に原因となる文が必要\n順番：B → A","note":"指示語も接続語もない文が、最初の文の候補です。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"jp-reading","level":"must"}],"assessment":{"question":"「彼は［1］［2］［3］出かけた。」の空欄に、A「傘を持たずに」、B「降りそうだったが」、C「雨が」を入れて最も自然な文にするとき、［2］に入るのは？","options":["傘を持たずに","降りそうだったが","雨が"],"answer":1,"explanation":"「雨が」の後には「降りそうだったが」が続く。「傘を持たずに」は「出かけた」のようすを表すので、その直前に入る。順番は C → B → A で、［2］はB。"},"practice":{"title":"手がかりを見つけて、意味の通る順に並べ替える","lead":"必ずつながる二つを、先に決める。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"一つの文の中の語句を並べ替える","question":"次の文の［1］〜［4］に、A〜Dの語句を一つずつ入れて、意味の通る文にします。［3］に入るのはどれでしょうか。\n日本の夏は［1］［2］［3］［4］ことが多い。","answer":"C","kind":"choice","options":[{"key":"A","text":"湿度も高いため","correct":false,"reason":"［2］に入る。「湿度も」の「も」がBを受けるので、Bのすぐ後に来る。"},{"key":"B","text":"気温が高いだけでなく","correct":false,"reason":"［1］に入る。「〜だけでなく」が、後に付け加える内容を呼ぶ。"},{"key":"C","text":"実際の気温よりも","correct":true,"reason":"［3］に入る。「〜よりも」は、比べた結果を表すDの直前に来る。"},{"key":"D","text":"暑く感じられる","correct":false,"reason":"［4］に入る。「こと」に直接つながる形は、Dだけ。"}],"alternatives":[{"try":"C → B → A → D（この並びだと［3］はA）","why_not":"「実際の気温よりも」のすぐ後に「気温が高い」が来て、「実際の気温よりも気温が高い」と読めてしまう。比べる言葉は、比べた結果の「暑く感じられる」の直前に置く。"},{"try":"A → B → C → D（この並びでも［3］はC）","why_not":"「だけでなく」が付け加える相手が「暑く感じられる」になり、理由の「湿度も高いため」が「気温が高い」にもかかって、筋が通らない。「湿度も」の「も」も、先に「気温が高い」が出ている方が自然に受けられる。"}],"steps":[{"title":"最後の空欄に入る語句を決める","formula":"［4］ことが多い。\n→ D：暑く感じられる ことが多い。","body":"「ことが多い」の直前には、「こと」に直接つながる形の語句が入ります。A・B・Cは「ため」「でなく」「よりも」で終わり、「こと」にはつながりません。つながるのはDだけです。"},{"title":"必ずつながる二つを見つける","formula":"B：気温が高いだけでなく → A：湿度も高いため","body":"「〜だけでなく」の後には、付け加える内容が続きます。Aの「湿度も」の「も」が、それを受けています。「も」は、先に「気温が高い」が出ている方が自然に受けられるので、AはBより後で、BのすぐあとにAが来ます。"},{"title":"残った語句の位置を決める","formula":"C：実際の気温よりも → D：暑く感じられる","body":"「〜よりも」は、何かと比べる言い方です。比べた結果を表す「暑く感じられる」の直前に入ります。"},{"title":"全体を並べて、読み通す","formula":"B → A → C → D\n日本の夏は、気温が高いだけでなく湿度も高いため、実際の気温よりも暑く感じられることが多い。","body":"理由（B・A）が先、その結果（C・D）が後になり、意味が通ります。［3］に入るのはCです。"}]},{"label":"四つの文を並べ替える","question":"次のア〜エの文を、意味の通る順に並べ替えてください。\nア　そのため、朝食を抜くと、午前中の集中力が下がりやすい。\nイ　脳は、眠っている間もエネルギーを使い続けている。\nウ　だから、忙しい朝でも、少しでも何か食べておくとよい。\nエ　その結果、朝起きたときには、脳のエネルギーが不足しがちになっている。","answer":"イ → エ → ア → ウ","kind":"order","alternatives":[{"try":"イ → エ → ウ → ア","why_not":"「食べておくとよい」が、集中力が下がることの理由になってしまい、つながらない。"},{"try":"イ → ア → エ → ウ","why_not":"エは朝起きたとき、つまり朝食より前の時点の話。朝食を抜いた後のことを述べるアの後には置けない。"}],"steps":[{"title":"それぞれの文の、最初の言葉を書き出す","formula":"ア：そのため、\nイ：（接続語なし）\nウ：だから、\nエ：その結果、","body":"「そのため」「だから」「その結果」は、どれも前の文を受ける言葉です。前に受ける内容が必要なので、最初の文にはなれません。"},{"title":"最初の文を決める","formula":"最初の文：イ","body":"接続語も指示語もないのは、イだけです。"},{"title":"イの次に来る文を決める","formula":"イ：眠っている間もエネルギーを使い続けている\n→ エ：その結果、朝にはエネルギーが不足しがちになっている","body":"使い続けたことの結果として、不足が起こります。「その結果」が、イの内容を受けています。イの次にアを置いても一見つながりますが、そうすると、朝食より前の時点を述べているエを置く場所がなくなります。"},{"title":"残りの二つの順を決める","formula":"エ：エネルギーが不足しがちになっている\n→ ア：そのため、朝食を抜くと集中力が下がりやすい\n→ ウ：だから、何か食べておくとよい","body":"不足しがちだから、補わないと集中力が下がる。朝食を抜くと集中力が下がるから、食べておくとよい。この順で、理由と結果がつながります。ウは全体の結論なので、最後に来ます。"},{"title":"アとウを入れかえた場合と比べて確かめる","formula":"エ → ウ → ア の場合\n…何か食べておくとよい。そのため、朝食を抜くと集中力が下がりやすい。","body":"「食べておくとよい」が、集中力が下がる理由になってしまい、つながりません。順番は イ → エ → ア → ウ です。"}]},{"label":"指示語を手がかりに、五つの文を並べ替える","question":"次のア〜オの文を、意味の通る順に並べ替えてください。\nア　しかし、この方法は、いつでも使えるわけではなかった。\nイ　昔の旅人は、太陽や星の位置を頼りに方角を知った。\nウ　こうして、天気に関係なく、方角がわかるようになった。\nエ　そこで使われるようになったのが、磁石を利用した方位磁針である。\nオ　たとえば、曇りの日には、太陽も星も見えない。","answer":"イ → ア → オ → エ → ウ","kind":"order","alternatives":[{"try":"イ → ア → エ → オ → ウ","why_not":"方位磁針の文の後に「たとえば」が来ると、曇りの日が何の例なのかがわからなくなる。"},{"try":"イ → ア → オ → ウ → エ","why_not":"解決の道具が出てくる前に、「こうして」で結果をまとめることになる。"},{"try":"イ → ア → エ → ウ → オ","why_not":"オは「いつでも使えるわけではなかった」の例。解決した後の「天気に関係なくわかる」の例にはならず、困った話で文章が終わってしまう。"}],"steps":[{"title":"指示語と接続語を、文ごとに書き出す","formula":"ア：しかし、この方法は\nイ：（なし）\nウ：こうして、\nエ：そこで\nオ：たとえば、","body":"イ以外の文は、どれも前の文を受ける言葉で始まっています。最初の文はイです。"},{"title":"「この方法」が指す内容を探す","formula":"ア：この方法\n→ イ：太陽や星の位置を頼りに方角を知る方法","body":"アより前に置ける文で、方法について述べているのはイだけです。アはイのすぐ後に来ます。"},{"title":"「たとえば」が、何の例かを探す","formula":"オ：曇りの日には、太陽も星も見えない\n→ ア：いつでも使えるわけではなかった、の例","body":"「たとえば」の後には、直前に述べたことの具体例が来ます。曇りの日は、太陽や星を使う方法が使えない場合の例なので、オはアのすぐ後に来ます。"},{"title":"残りの二つの順を決める","formula":"オ：太陽も星も見えない\n→ エ：そこで、方位磁針が使われるようになった\n→ ウ：こうして、天気に関係なく方角がわかるようになった","body":"「そこで」は、前の事情を受けて、次に起きたことを述べる言葉です。困ったことがあり（オ）、その解決として方位磁針が現れ（エ）、その結果どうなったか（ウ）、という順です。「こうして」は、それまでの流れ全体をまとめる言葉なので、ウが最後です。"},{"title":"全体を読み通して確かめる","formula":"イ → ア → オ → エ → ウ","body":"昔の方法、その弱点、弱点の例、解決の道具、結果、の順になり、指示語と接続語がすべて前の文を受けています。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-sets":{"id":"spi-sets","name":"集合","type":"learn","goal":"ベン図を書いて、重なりのある人数を求められる。","part_of":"spi","tags":["matha","data"],"also_tags":["math1"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"集合の問題は、ある条件に当てはまる人や物の数を、重なりに注意して数える問題です。二つの条件AとBがあるとき、全体は「Aだけ」「Bだけ」「AとBの両方」「どちらでもない」の四つに分かれます。Aの人数とBの人数をそのまま足すと、両方に当てはまる人を2回数えてしまうので、1回分を引きます。重なり合う二つの円の図（ベン図）をかくと整理しやすくなります。","example":"少なくとも一方 = Aの人数 + Bの人数 − 両方の人数\nどちらでもない = 全体 − 少なくとも一方\n例　全体30人、Aが18人、Bが15人、両方が8人のとき\n　少なくとも一方：18 + 15 − 8 = 25\n　どちらでもない：30 − 25 = 5","note":"Aだけは 18 − 8 で10人、Bだけは 15 − 8 で7人です。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは2けたのたし算・ひき算だけで、たし算ひき算に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-addsub","level":"must"}],"assessment":{"question":"20人中、犬好き12人、猫好き9人、両方好き5人。少なくとも一方が好きな人数は？","options":["16人","20人","21人"],"answer":0,"explanation":"12 + 9 は両方の5人を二重に数えている。12 + 9 − 5 = 16人。"},"practice":{"title":"重なりのある人数を、ベン図で整理する","lead":"二重に数えた分を、一度だけ引く。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"両方に当てはまる人数を求める","question":"40人のクラスで、英語が得意な人は28人、数学が得意な人は19人、どちらも得意でない人は5人でした。英語と数学の両方が得意な人は何人でしょうか。","answer":"12人","steps":[{"title":"わかっている人数を置き、ベン図を思い浮かべる","formula":"全体：40人\n英語が得意：28人\n数学が得意：19人\nどちらも得意でない：5人","body":"全体の40人を表す四角の中に、英語が得意な人の円と、数学が得意な人の円を、一部が重なるようにかきます。円の重なった部分が「両方が得意な人」、二つの円の外側が「どちらも得意でない人」です。"},{"title":"少なくとも一方が得意な人数を求める","formula":"40 − 5 = 35","body":"全体から、どちらも得意でない5人を除くと、二つの円のどこかに入る人数になります。"},{"title":"英語と数学の人数を、そのまま足す","formula":"28 + 19 = 47","body":"この47人は、両方が得意な人を英語と数学で2回数えています。"},{"title":"数えすぎた分が、両方が得意な人数になる","formula":"47 − 35 = 12","body":"重なりの人を2回数えた47人と、少なくとも一方が得意な35人との差が、重なりの人数です。"},{"title":"四つの部分を足して、全体になるか確かめる","formula":"英語だけ：28 − 12 = 16\n数学だけ：19 − 12 = 7\n16 + 12 + 7 + 5 = 40","body":"英語だけ、両方、数学だけ、どちらでもない、の四つを足すと40人になります。"}]},{"label":"片方だけの人数と、どちらでもない人数を求める","question":"60人に通勤の方法をたずねました。電車を使う人は38人、バスを使う人は27人、両方を使う人は14人でした。電車だけを使う人と、どちらも使わない人は、それぞれ何人でしょうか。","answer":"電車だけを使う人は24人、どちらも使わない人は9人","steps":[{"title":"わかっている人数を置く","formula":"全体：60人\n電車を使う：38人\nバスを使う：27人\n両方を使う：14人","body":"「電車を使う38人」には、バスも使う14人が含まれています。「電車だけ」とは別の数です。"},{"title":"電車だけを使う人数を求める","formula":"38 − 14 = 24","body":"電車を使う人の円と、バスを使う人の円を重ねてかきます。電車の円から、重なりの部分を除きます。"},{"title":"バスだけを使う人数を求める","formula":"27 − 14 = 13","body":"バスの円からも、同じように重なりの部分を除きます。"},{"title":"少なくとも一方を使う人数を求める","formula":"24 + 14 + 13 = 51","body":"電車だけ、両方、バスだけの三つの部分を足します。"},{"title":"全体から引いて、どちらも使わない人数を求める","formula":"60 − 51 = 9","body":"二つの円の外側にいる人数です。"},{"title":"別の求め方で、少なくとも一方の人数を確かめる","formula":"38 + 27 − 14 = 51","body":"二つをそのまま足して、2回数えた重なりを1回引いても、同じ51人になります。"}]},{"label":"重なりの人数の範囲を求める","question":"50人のうち、朝食を食べた人は36人、運動をした人は22人でした。朝食を食べて運動もした人は、最も少なくて何人、最も多くて何人でしょうか。","answer":"最も少なくて8人、最も多くて22人","steps":[{"title":"わかっている人数と、求めるものを置く","formula":"全体：50人\n朝食を食べた：36人\n運動をした：22人\n求めるもの：両方に当てはまる人数の範囲","body":"「どちらもしていない人」の数が書かれていないので、両方に当てはまる人数は一つに決まりません。あり得る範囲を求めます。"},{"title":"最も多い場合を考える","formula":"36人と22人のうち、少ない方：22人","body":"運動をした22人が全員、朝食も食べていた場合が最も多くなります。重なりは、少ない方の22人を超えられません。"},{"title":"最も少ない場合のために、二つの人数を足す","formula":"36 + 22 = 58","body":"重なりをできるだけ少なくしたいので、まず重なりがないものとして足してみます。"},{"title":"全体を超えた分が、必ず重なる人数になる","formula":"58 − 50 = 8","body":"58人は全体の50人より8人多いので、どう分けても8人は両方に当てはまります。"},{"title":"最も少ない場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 8 = 28\n運動だけ：22 − 8 = 14\n28 + 8 + 14 = 50","body":"このとき、どちらもしていない人は0人です。"},{"title":"最も多い場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 22 = 14\n少なくとも一方：14 + 22 = 36\nどちらもしていない：50 − 36 = 14\n14 + 22 + 0 + 14 = 50","body":"このとき、運動だけの人は0人で、どちらもしていない人が14人います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-settlement":{"id":"spi-settlement","name":"代金の精算","type":"learn","goal":"立て替えた金額から、だれがだれにいくら払えば同じ負担になるかを求められる。","part_of":"spi","tags":["sansu","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"代金の精算は、何人かが別々に立て替えたお金を、最後に全員が同じ負担になるように精算する問題です。まず、かかった金額の合計を人数で割って、1人が負担すべき額を求めます。次に、それぞれが実際に払った額と比べます。負担すべき額より多く払った人は差額を受け取り、少なく払った人は差額を払います。以前からの貸し借りがあるときは、精算で払う額と、返してもらう額を差し引きします。","example":"1人の負担額 = かかった合計 ÷ 人数\n受け取る額 = 実際に払った額 − 1人の負担額\n払う額 = 1人の負担額 − 実際に払った額\n例　2人で、一方が3,000円、もう一方が1,000円を立て替えたとき\n　1人の負担額：4,000 ÷ 2 = 2,000\n　1,000円を立て替えた人が払う額：2,000 − 1,000 = 1,000","note":"払う額の合計と、受け取る額の合計は、いつも同じになります。"},"cost":{"hours":4,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"AとBの2人で買い物をし、Aが5,000円、Bが1,000円を立て替えた。同じ負担にするには？","options":["BがAに2,000円払う","BがAに4,000円払う","BがAに3,000円払う"],"answer":0,"explanation":"合計は6,000円で、1人の負担額は3,000円。Bは1,000円しか払っていないので、差の2,000円をAに払う。4,000円は二人の立て替えた額の差で、これを払うとBの負担が多くなりすぎる。3,000円は1人の負担額で、Bがすでに払った1,000円を引いていない。"},"practice":{"title":"1人の負担額を求めて、差額を精算する","lead":"負担すべき額と、実際に払った額を比べる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"3人で立て替えた費用を精算する","question":"X、Y、Zの3人で旅行に行きました。Xが宿泊費18,000円、Yが交通費9,000円、Zが食事代3,000円を立て替えました。3人が同じ額を負担するように精算します。足りない人が、多く払った人に直接払うものとします。だれが、だれに、いくら払えばよいでしょうか。","answer":"YがXに1,000円、ZがXに7,000円払う","alternatives":[{"try":"YとZが、Xの立て替えた18,000円を半分ずつ（9,000円ずつ）Xに払う","why_not":"YとZも自分で立て替えている。その分を考えに入れないと、YとZの負担が多くなりすぎる。"},{"try":"18,000 ÷ 3 = 6,000円ずつを、YとZがXに払う","why_not":"割るのはXの立て替えた額ではなく、3人が立て替えた合計の30,000円。YとZがすでに払った額も引く必要がある。"}],"steps":[{"title":"立て替えた額を書き出す","formula":"X：18,000円\nY：9,000円\nZ：3,000円","body":"何の費用かは、精算には関係しません。だれがいくら払ったかだけを見ます。"},{"title":"かかった合計を求める","formula":"18,000 + 9,000 + 3,000 = 30,000","body":"3人が立て替えた額をすべて足します。千円を単位にすると 18 + 9 + 3 = 30 で、千円が30個分、つまり30,000円です。"},{"title":"1人の負担額を求める","formula":"30,000 ÷ 3 = 10,000","body":"合計を人数で割ります。3人とも、10,000円ずつ負担するのが正しい形です。"},{"title":"それぞれが払った額を、負担額と比べる","formula":"X：18,000 − 10,000 = 8,000（多く払った）\nY：10,000 − 9,000 = 1,000（足りない）\nZ：10,000 − 3,000 = 7,000（足りない）","body":"Xは8,000円多く払っています。YとZは、負担額に足りない分があります。"},{"title":"足りない人から、多く払った人へ払う","formula":"Y → X：1,000円\nZ → X：7,000円","body":"多く払ったのはXだけなので、YとZは、足りない分をそれぞれXに払います。"},{"title":"Xが受け取る額が、多く払った額と合うか確かめる","formula":"1,000 + 7,000 = 8,000","body":"YとZから受け取る合計は8,000円で、Xが多く払った額と同じです。精算の後は、3人とも10,000円の負担になります。"}]},{"label":"以前の貸し借りと差し引きする","question":"PとQの2人で、8,000円の贈り物を買いました。代金はPが全額を払い、2人で同じ額を負担することにしました。ところで、Qは以前、Pに1,500円を貸していて、まだ返してもらっていません。貸し借りもまとめて精算するには、QはPにいくら払えばよいでしょうか。","answer":"QがPに2,500円払う","alternatives":[{"try":"4,000 + 1,500 = 5,500円を、QがPに払う","why_not":"お金を貸しているのはQの方。1,500円はPがQに返す額なので、足すのではなく引く。"}],"steps":[{"title":"二つのお金の動きを分けて書き出す","formula":"贈り物：8,000円をPが全額払った。2人で同じ額を負担する\n貸し借り：QがPに1,500円を貸している","body":"贈り物の精算と、以前の貸し借りは、別々のお金の動きです。まず一つずつ考えます。"},{"title":"贈り物の、1人の負担額を求める","formula":"8,000 ÷ 2 = 4,000","body":"Qは何も払っていないので、贈り物については、QがPに4,000円払うことになります。"},{"title":"貸し借りで、だれがだれに払うかを確かめる","formula":"P → Q：1,500円（借りたお金を返す）","body":"貸しているのはQです。PがQに1,500円を返すことになります。"},{"title":"向きが逆の二つを、差し引きする","formula":"Q → P：4,000円\nP → Q：1,500円\n4,000 − 1,500 = 2,500","body":"QがPに4,000円払い、PがQに1,500円返すのは、QがPに2,500円払うのと同じです。"},{"title":"精算の後、Pの手元から出たお金を確かめる","formula":"8,000 − 2,500 = 5,500\n4,000 + 1,500 = 5,500","body":"Pは8,000円払って2,500円を受け取ったので、5,500円を出したことになります。これは、贈り物の負担額4,000円と、返した1,500円の合計と同じです。"}]},{"label":"払っていない人がいる精算","question":"A、B、Cの3人で食事会を開きました。Aが会場費12,000円、Bが料理代6,000円を払い、Cは何も払っていません。3人が同じ額を負担するように精算します。なお、Cは以前、Aに2,000円を貸していて、まだ返してもらっていません。貸し借りもまとめて精算します。足りない人が、多く払った人に直接払うものとすると、だれが、だれに、いくら払えばよいでしょうか。","answer":"CがAに4,000円払う（Bは払うことも受け取ることもない）","alternatives":[{"try":"CがAとBに、3,000円ずつ払う","why_not":"Bが払った6,000円は、ちょうど1人の負担額。Bは受け取る立場ではない。"},{"try":"CがAに6,000円払う","why_not":"食事会の精算だけで、以前の貸し借りを入れ忘れている。"},{"try":"6,000 + 2,000 = 8,000円を、CがAに払う","why_not":"お金を貸しているのはCの方。2,000円はAがCに返す額なので、足すのではなく引く。"}],"steps":[{"title":"かかった合計と、1人の負担額を求める","formula":"12,000 + 6,000 = 18,000\n18,000 ÷ 3 = 6,000","body":"払っていないCも含めて、3人で割ります。"},{"title":"それぞれが払った額を、負担額と比べる","formula":"A：12,000 − 6,000 = 6,000（多く払った）\nB：6,000 − 6,000 = 0（ちょうど）\nC：6,000 − 0 = 6,000（足りない）","body":"Bは、払った額がちょうど負担額と同じです。食事会の精算には関わりません。"},{"title":"食事会について、だれがだれに払うかを決める","formula":"C → A：6,000円","body":"足りないCが、多く払ったAに6,000円を払います。"},{"title":"貸し借りと差し引きする","formula":"C → A：6,000円\nA → C：2,000円（借りたお金を返す）\n6,000 − 2,000 = 4,000","body":"AはCに2,000円を返す立場です。向きが逆の二つを差し引きすると、CがAに4,000円払えば済みます。"},{"title":"精算の後、Aの手元から出たお金を確かめる","formula":"12,000 − 4,000 = 8,000\n6,000 + 2,000 = 8,000","body":"Aは12,000円払って4,000円を受け取ったので、8,000円を出したことになります。食事会の負担額6,000円と、返した2,000円の合計と同じです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-speed":{"id":"spi-speed","name":"速さと時間","type":"learn","goal":"速さ、時間、距離の関係を使って、出会いや追いつきの問題を解ける。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"速さは、決まった時間に進む距離のことです。時速は1時間、分速は1分間、秒速は1秒間に進む距離を表します。速さ・時間・距離のうち二つがわかれば、残りの一つを求められます。計算の前に、時間と距離の単位を速さの単位にそろえます。二人が向かい合って進むときは速さの和、同じ向きに進むときは速さの差の分だけ、二人の間の距離が変わります。","example":"距離 = 速さ × 時間\n速さ = 距離 ÷ 時間\n時間 = 距離 ÷ 速さ\n例　分速80mで15分歩いた距離：80 × 15 = 1,200","note":"三つの式は、同じ関係を求めたいものに合わせて書き直したものです。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは小数・分数のかけ算わり算と、km・m、時間・分の換算で、小数と分数に収まる。練習の解説は方程式を使っておらず、方程式の「あると楽」は内容からは確かめられないので仮のまま。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-linear-eq","level":"helps"}],"assessment":{"question":"時速60kmで30分進んだ距離は？","options":["2km","30km","120km"],"answer":1,"explanation":"時間の単位をそろえる。30分 = 0.5時間。60 × 0.5 = 30km。"},"practice":{"title":"速さ・時間・距離の関係から求める","lead":"単位をそろえ、二人の間の距離が1分でどれだけ変わるかを見る。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"単位をそろえて距離を求める","question":"時速4.8kmで25分歩きました。歩いた距離は何kmでしょうか。","answer":"2km","steps":[{"title":"速さと時間、求めるものを置く","formula":"速さ：時速4.8km\n時間：25分\n求めるもの：距離（km）","body":"速さは「1時間あたり」なのに、時間は「分」で書かれています。このままではかけ算できないので、単位をそろえます。"},{"title":"25分を、時間の単位に直す","formula":"25 ÷ 60 = 25/60 = 5/12","body":"1時間は60分なので、25分は5/12時間です。"},{"title":"速さに時間をかけて、距離を求める","formula":"4.8 × 5/12 = 4.8 ÷ 12 × 5 = 0.4 × 5 = 2","body":"距離は、速さ×時間です。時速と時間（時）をかけるので、答えはkmになります。"},{"title":"分速に直す方法で確かめる","formula":"分速：4,800 ÷ 60 = 80\n80 × 25 = 2,000","body":"時速4.8kmは1時間に4,800mなので、分速80mです。25分で2,000m、つまり2kmになり、同じ答えです。"}]},{"label":"向かい合って進み、出会う","question":"2.7km離れた二つの地点から、兄は分速80m、弟は分速55mで、向かい合って同時に出発しました。二人が出会うのは、出発してから何分後でしょうか。","answer":"20分後","steps":[{"title":"二人の間の距離と、それぞれの速さを置く","formula":"二人の間の距離：2.7km = 2,700m\n兄：分速80m\n弟：分速55m","body":"速さが分速（m）なので、距離もmに直します。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"80 + 55 = 135","body":"向かい合って進むので、二人の間は、1分ごとに二人が進んだ分を合わせた長さだけ縮まります。"},{"title":"はじめの距離を、1分で縮まる距離で割る","formula":"2,700 ÷ 135 = 20","body":"2,700mが、1分に135mずつ縮まります。0mになったときが出会うときなので、20分後です。"},{"title":"20分で二人が進んだ距離を足して確かめる","formula":"兄：80 × 20 = 1,600\n弟：55 × 20 = 1,100\n1,600 + 1,100 = 2,700","body":"二人が進んだ距離の合計が、はじめの2,700mと同じになります。"}]},{"label":"後から出発して、追いつく","question":"弟が分速60mで家を出ました。その8分後に、兄が分速100mで同じ道を追いかけました。兄が弟に追いつくのは、兄が家を出てから何分後でしょうか。","answer":"12分後","steps":[{"title":"二人の速さと、出発のずれを置く","formula":"弟：分速60m、先に出発\n兄：分速100m、8分後に出発\n求めるもの：兄が出発してから追いつくまでの時間","body":"数えはじめるのは、兄が出発したときです。そのとき、弟はすでに先へ進んでいます。"},{"title":"兄が出発するとき、弟が何m先にいるかを求める","formula":"60 × 8 = 480","body":"弟は分速60mで8分進んでいるので、兄より480m先にいます。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"100 − 60 = 40","body":"同じ向きに進むので、二人の間は、速さの差の分だけ縮まります。向かい合うときと違い、足すのではなく引きます。"},{"title":"先にいる距離を、1分で縮まる距離で割る","formula":"480 ÷ 40 = 12","body":"480mの差が、1分に40mずつ縮まります。差が0mになるのは、兄が出発してから12分後です。"},{"title":"追いついたとき、二人の進んだ距離が同じか確かめる","formula":"兄：100 × 12 = 1,200\n弟：60 × (8 + 12) = 1,200","body":"兄は12分、弟は8分と12分を合わせた20分進んでいます。どちらも家から1,200mで、同じ場所にいます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-tables":{"id":"spi-tables","name":"表の読み取り","type":"learn","goal":"複数の表から必要な数値を拾い、割合や増減を計算できる。","part_of":"spi","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表の読み取りは、一つまたは複数の表から必要な数値を探し、割合や増減を計算する問題です。表の題、行と列の見出し、単位を先に確かめて、どの数が何を表しているかをつかみます。割合を求めるときは、何を基準（100%）にするかを問題文から読み取ります。複数の表を使うときは、一方の表の割合を、もう一方の表の実際の数にかけて求めます。","example":"全体に占める割合 = その項目の数 ÷ 合計\n増加率 = (後の数 − 前の数) ÷ 前の数\n実際の数 = 基準の数 × 割合\n例　前年50、今年60のときの増加率：(60 − 50) ÷ 50 = 0.2","note":"0.2は20%です。割る数は、基準である前年の50です。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。表の行と列から数を拾う操作は表とグラフ、割合と増加率は割合と比に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-table","level":"must"},{"id":"math-ratio","level":"must"}],"assessment":{"question":"A店の売上は前年80万円、今年100万円。今年の売上は、前年に比べて何%増えた？","options":["20%","25%","125%"],"answer":1,"explanation":"増加は20万円。基準は前年なので20 ÷ 80 = 0.25で、25%。125%は今年の売上が前年の何%かを表す数で、増えた割合ではない。"},"practice":{"title":"複数の表から、割合や増減を求める","lead":"どの数を基準にするかを、表の見出しで確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全体に占める割合を求める","question":"表1で、5月の3支店の売上の合計に占めるA支店の売上の割合は、何%でしょうか。","answer":"30%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う列：5月\n比べる量：A支店の売上 270万円\n基準：3支店の5月の売上の合計","body":"「合計に占める割合」なので、基準は5月の合計です。4月の列は使いません。"},{"title":"5月の売上の合計を求める","formula":"270 + 360 + 270 = 900","body":"表に合計の行がないので、3支店の5月の売上を足します。"},{"title":"A支店の売上を、合計で割る","formula":"270 ÷ 900 = 0.3","body":"割合は、比べる量÷基準の量です。0.3は30%です。"},{"title":"3支店の割合を足すと、100%になるか確かめる","formula":"B支店：360 ÷ 900 = 0.4\nC支店：270 ÷ 900 = 0.3\n0.3 + 0.4 + 0.3 = 1","body":"B支店は40%、C支店は30%で、3支店を足すと100%になります。基準を4月の合計800万円に取り違えていれば、足しても100%になりません。"}]},{"label":"前の月からの増加率を求める","question":"表1で、C支店の5月の売上は、4月に比べて何%増えたでしょうか。","answer":"35%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う行：C支店\n4月：200万円（基準）\n5月：270万円","body":"「4月に比べて」なので、基準は4月の売上です。"},{"title":"増えた金額を求める","formula":"270 − 200 = 70","body":"5月の売上から4月の売上を引きます。"},{"title":"増えた金額を、基準の4月の売上で割る","formula":"70 ÷ 200 = 0.35","body":"0.35は35%です。5月の270万円で割ると、基準を取り違えた別の数になります。"},{"title":"4月の売上を35%増やすと、5月の売上になるか確かめる","formula":"200 × (1 + 0.35) = 200 × 1.35 = 270","body":"200万円の1.35倍が270万円で、表の5月の数と合います。"}]},{"label":"二つの表を組み合わせる","question":"表1と表2から、5月の商品Xの売上は、3支店の合計で何万円でしょうか。また、それは5月の3支店の売上の合計の何%でしょうか。","answer":"369万円、5月の3支店の売上の合計の41%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]},{"caption":"表2　各支店の5月の売上に占める商品別の割合（％）","rows":[["支店","商品X","商品Y","商品Z"],["A支店","40","35","25"],["B支店","50","30","20"],["C支店","30","30","40"]]}],"steps":[{"title":"二つの表の関係を置く","formula":"表1：支店ごとの売上（万円）\n表2：その支店の5月の売上を100%としたときの、商品ごとの割合","body":"表2の割合は、支店ごとに基準が違います。商品Xの金額は、支店ごとに「表1の5月の売上×表2の割合」で求めます。"},{"title":"A支店の商品Xの売上を求める","formula":"270 × 0.4 = 108","body":"A支店の5月の売上270万円の40%です。"},{"title":"B支店の商品Xの売上を求める","formula":"360 × 0.5 = 180","body":"B支店の5月の売上360万円の50%です。"},{"title":"C支店の商品Xの売上を求める","formula":"270 × 0.3 = 81","body":"C支店の5月の売上270万円の30%です。"},{"title":"3支店の商品Xの売上を足す","formula":"108 + 180 + 81 = 369","body":"金額に直してから足します。"},{"title":"5月の売上の合計に占める割合を求める","formula":"5月の売上の合計：270 + 360 + 270 = 900\n369 ÷ 900 = 0.41","body":"基準は3支店の5月の売上の合計900万円です。0.41は41%です。"},{"title":"割合を平均してはいけないことを確かめる","formula":"(40 + 50 + 30) ÷ 3 = 40","body":"三つの割合を平均すると40%になり、正しい41%と合いません。支店ごとに売上の大きさが違うので、割合どうしをそのまま平均することはできません。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-text-calc":{"id":"spi-text-calc","name":"長文の読み取り計算","type":"learn","goal":"文章の中から必要な数値を拾い、割合や1あたりの量を計算できる。","part_of":"spi","tags":["sansu","data"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"長文の読み取り計算は、数値がいくつも出てくる文章を読んで、そこから計算で答えを出す問題です。表と違い、数値が文の中に散らばっているので、問いに必要な数値だけを拾い出します。割合が出てきたら、それが何をもとにした割合かを、文から読み取ります。文章に直接書かれていない数値は、書かれている数値から順に求めます。本番では、いくつかの記述が本文と合うかどうかを判定する形で出ることがあります。判定のためにする計算は、数値を直接答える場合と同じです。","example":"比べる量 = 基準の量 × 割合\n基準の量 = 比べる量 ÷ 割合\n1あたりの量 = 全体の量 ÷ 個数や人数\n例　「会員は600人で、町の人口の20%にあたる」ときの人口：600 ÷ 0.2 = 3,000","note":"この例では、600人が比べる量、人口が基準の量です。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"「ある店の今月の売上は、先月の200万円より10%増えた。」今月の売上は？","options":["210万円","220万円","20万円"],"answer":1,"explanation":"10%増えたので、先月の1.1倍。200 × 1.1 = 220万円。20万円は増えた分で、今月の売上ではない。210万円は、5%増えた場合の数。"},"practice":{"title":"文章から数値を拾って計算する","lead":"何をもとにした割合かを、文から読み取る。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","passage":"ある市の図書館の年間の貸出冊数は、昨年度は48万冊であった。今年度は、昨年度より5%増えた。今年度の貸出冊数のうち、児童書は30%を占めており、その冊数は、昨年度の児童書の貸出冊数より2万4千冊多い。また、今年度の利用登録者は6万3千人で、これは市の人口の35%にあたる。","problems":[{"label":"増えた後の量を求める","question":"本文から、今年度の貸出冊数は何万冊でしょうか。","answer":"50.4万冊","alternatives":[{"try":"48 × 0.05 = 2.4万冊","why_not":"これは昨年度から増えた分。問われているのは、増えた後の今年度の冊数。"}],"steps":[{"title":"本文から、必要な数値を拾う","formula":"昨年度の貸出冊数：48万冊\n今年度：昨年度より5%増えた","body":"児童書や利用登録者の数値は、この問いには使いません。5%は、昨年度の冊数をもとにした割合です。"},{"title":"今年度が、昨年度の何倍かを求める","formula":"1 + 0.05 = 1.05","body":"5%は小数で0.05です。昨年度の1倍に、増えた0.05倍を足します。"},{"title":"昨年度の冊数にかけて、今年度の冊数を求める","formula":"48 × 1.05 = 50.4","body":"単位は万冊のまま計算します。今年度は50.4万冊です。"},{"title":"増えた分を足す方法で確かめる","formula":"増えた分：48 × 0.05 = 2.4\n48 + 2.4 = 50.4","body":"増えた2.4万冊を昨年度に足しても、同じ50.4万冊になります。"}]},{"label":"書かれていない数値を、順に求める","question":"本文から、昨年度の児童書の貸出冊数は、昨年度の貸出冊数全体の何%にあたるでしょうか。","answer":"26.5%","alternatives":[{"try":"30%","why_not":"30%は、今年度の貸出冊数に占める児童書の割合。昨年度の割合は、本文に直接は書かれていない。"},{"try":"12.72 ÷ 50.4 = 約25.2%","why_not":"昨年度の児童書を、今年度の全体で割っている。「昨年度の全体の何%か」なので、基準の量は昨年度の48万冊。"}],"steps":[{"title":"求める割合の、基準の量と比べる量を決める","formula":"基準の量：昨年度の貸出冊数（48万冊）\n比べる量：昨年度の児童書の貸出冊数（書かれていない）","body":"昨年度の児童書の冊数は、本文に直接は書かれていません。今年度の児童書の冊数から、さかのぼって求めます。"},{"title":"今年度の児童書の貸出冊数を求める","formula":"50.4 × 0.3 = 15.12","body":"今年度の貸出冊数は、1問目で求めた50.4万冊です。その30%が児童書なので、15.12万冊です。"},{"title":"昨年度の児童書の貸出冊数を求める","formula":"2万4千冊 → 2.4万冊\n15.12 − 2.4 = 12.72","body":"今年度の児童書は、昨年度より2万4千冊多いと書かれています。単位を万冊にそろえてから、今年度の冊数から引きます。"},{"title":"昨年度の全体で割って、割合を求める","formula":"12.72 ÷ 48 = 0.265","body":"0.265は26.5%です。"},{"title":"求めた割合から、昨年度の児童書の冊数に戻るか確かめる","formula":"48 × 0.265 = 12.72","body":"昨年度の48万冊の26.5%は12.72万冊で、先に求めた冊数と合います。"}]},{"label":"基準の量と、1人あたりの量を求める","question":"本文から、市の人口は何万人でしょうか。また、今年度の貸出冊数は、市民1人あたり何冊にあたるでしょうか。","answer":"人口は18万人、市民1人あたり2.8冊","alternatives":[{"try":"6.3 × 0.35 = 2.205万人","why_not":"6万3千人は、人口の35%にあたる量。人口はそれより多いはずなので、かけるのではなく割る。"},{"try":"50.4 ÷ 6.3 = 8冊","why_not":"これは利用登録者1人あたりの冊数。問われているのは、市民1人あたりの冊数。"}],"steps":[{"title":"本文から、必要な数値を拾う","formula":"利用登録者：6万3千人 → 6.3万人\n利用登録者は、市の人口の35%\n今年度の貸出冊数：50.4万冊","body":"35%は、市の人口をもとにした割合です。人口は書かれていないので、利用登録者の数から求めます。"},{"title":"利用登録者の数を割合で割って、人口を求める","formula":"6.3 ÷ 0.35 = 18","body":"人口の0.35倍が6.3万人なので、6.3を0.35で割ると人口に戻ります。人口は18万人です。"},{"title":"人口の35%が、利用登録者の数になるか確かめる","formula":"18 × 0.35 = 6.3","body":"18万人の35%は6.3万人で、本文と合います。"},{"title":"貸出冊数を人口で割って、1人あたりの冊数を求める","formula":"50.4 ÷ 18 = 2.8","body":"どちらも単位が「万」なので、そのまま割れます。市民1人あたり2.8冊です。"},{"title":"1人あたりの冊数に人口をかけて、貸出冊数に戻るか確かめる","formula":"2.8 × 18 = 50.4","body":"1人あたり2.8冊で18万人なら50.4万冊で、今年度の貸出冊数と合います。"}]},{"label":"本文と合う記述を選ぶ","question":"次のア〜ウのうち、本文の内容と合うものをすべて選んでください。","answer":"アとウ","kind":"choice","select":"all","options":[{"key":"ア","text":"今年度の貸出冊数は、50万冊を超えている。","correct":true,"reason":"今年度は 48 × 1.05 = 50.4万冊で、50万冊を超えている。"},{"key":"イ","text":"昨年度の児童書の貸出冊数は、昨年度の貸出冊数全体の3割を超えている。","correct":false,"reason":"昨年度の児童書は12.72万冊で、昨年度全体48万冊の26.5%。3割に届かない。30%は今年度の割合。"},{"key":"ウ","text":"市の人口は、20万人より少ない。","correct":true,"reason":"人口は 6.3 ÷ 0.35 = 18万人で、20万人より少ない。"}],"steps":[{"title":"記述ごとに、確かめるために必要な数を決める","formula":"ア：今年度の貸出冊数\nイ：昨年度の児童書の、昨年度全体に対する割合\nウ：市の人口","body":"本番では、このように、いくつかの記述が本文と合うかを判定する形で出ることがあります。どの記述も、本文に直接は書かれていない数を計算しないと判定できません。"},{"title":"アを確かめる","formula":"48 × 1.05 = 50.4","body":"今年度は50.4万冊で、50万冊を超えています。アは本文と合います。"},{"title":"イを確かめる","formula":"今年度の児童書：50.4 × 0.3 = 15.12\n昨年度の児童書：15.12 − 2.4 = 12.72\n12.72 ÷ 48 = 0.265","body":"昨年度の児童書は、昨年度全体の26.5%です。3割は30%なので、超えていません。本文の「30%」は今年度の割合で、昨年度の割合ではありません。イは本文と合いません。"},{"title":"ウを確かめる","formula":"6.3 ÷ 0.35 = 18","body":"人口は18万人で、20万人より少ないです。ウは本文と合います。"},{"title":"合うものを、すべて答える","formula":"ア：合う\nイ：合わない\nウ：合う","body":"「すべて選ぶ」問題なので、一つ見つけても止めず、三つとも確かめます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-verbal":{"id":"spi-verbal","name":"SPI言語","type":"target","goal":"代表的な言語問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","featured":true,"scope_note":"代表分野への学習経路です。SPI全範囲や通過を保証するものではありません。出題される分野と形式は、受検方式によって異なります。企業の受検案内で方式を確認してください。線はこの経路での学習順序を表し、公式の必須条件ではありません。資料によっては、空欄補充を独立の分野として挙げています（この木では長文読解の中で接続語の形だけ扱っています）。語彙の量そのものは、この木の単元では補えません。","concept":{"text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。言語は能力検査のうち、言葉の意味や話の要旨を的確に捉えて理解する力を測る分野です。出題される内容や形式は、受検方式によって異なります。ここでは、出版社の資料が出題範囲として挙げている五つの分野を単元として並べています。","example":"この木に入れている分野：二語関係、熟語、語の用法、文の並べ替え、長文読解","note":"受検方式は、企業からの受検案内で確かめてください。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"spi-word-relations","level":"must"},{"id":"spi-idioms","level":"must"},{"id":"spi-word-usage","level":"must"},{"id":"spi-sentence-order","level":"must"},{"id":"spi-reading","level":"must"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/"},{"title":"実務教育出版：SPIの基礎知識（言語分野の出題範囲）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf"},{"title":"リクナビ就活準備ガイド：SPIの練習問題（言語分野が測る内容）","url":"https://job.rikunabi.com/contents/test/22304/"},{"title":"キャリタス就活：SPI練習問題一覧（空欄補充を含む6分野の挙げ方）","url":"https://job.career-tasu.jp/guide/step/150/"}],"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-word-relations":{"id":"spi-word-relations","name":"二語関係","type":"learn","goal":"二つの語の関係を見分け、同じ関係になっている組を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二語関係は、例として示された二つの語の関係を読み取り、同じ関係になっている組を選ぶ問題です。よく出る関係には、一方がもう一方に含まれる「包含」、意味が反対の「対立」、同じ仲間どうしの「同列」、物とその使いみちの「用途」、製品とそのもとになる「原料」があります。解くときは、二つの語を「AはBの一種」「AはBから作られる」のような短い文にします。同じ文に当てはめて意味が通る組が、同じ関係の組です。包含・用途・原料のように向きがある関係では、左右が逆の組は同じ関係とは数えません。対立と同列は、左右を入れかえても同じ関係です。","example":"犬：動物 → 犬は動物の一種（包含。左が右に含まれる）\n拡大：縮小 → 拡大と縮小は反対の意味（対立）\n犬：猫 → 犬も猫も動物の仲間（同列）\nほうき：掃く → ほうきは掃くために使う（用途）\nバター：牛乳 → バターは牛乳から作られる（原料）","note":"「動物：犬」は、同じ包含でも向きが逆です。「動物は犬の一種」とは言えません。"},"cost":{"hours":5,"yen":0},"assessment":{"question":"「拡大：縮小」と同じ関係になっている組は？","options":["上昇：下降","犬：動物","鉛筆：書く"],"answer":0,"explanation":"拡大と縮小は反対の意味（対立）。上昇と下降も反対の意味。「犬：動物」は包含、「鉛筆：書く」は用途。"},"practice":{"title":"二つの語の関係を、短い文にして比べる","lead":"関係の種類と、左右の向きの両方を確かめる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"含む・含まれるの向きを見分ける","question":"「チューリップ：花」と同じ関係になっている組は、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"野菜：にんじん","correct":false,"reason":"含む・含まれるの関係だが、左右の向きが逆（にんじんが野菜の一種）。"},{"key":"イ","text":"すずめ：鳥","correct":true,"reason":"すずめは鳥の一種。関係の種類も、左右の向きも例と同じ。"},{"key":"ウ","text":"ピアノ：バイオリン","correct":false,"reason":"どちらも楽器の仲間で、同列の関係。一方がもう一方に含まれてはいない。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"チューリップ：花\n→ チューリップは、花の一種である\n関係：包含（左が右に含まれる）","body":"左の語をA、右の語をBとして「AはBの一種である」という文にします。左右を入れかえた「花はチューリップの一種である」は成り立たないので、向きも決まります。"},{"title":"アを、同じ文に当てはめる","formula":"野菜：にんじん\n→ 野菜は、にんじんの一種である（成り立たない）","body":"にんじんが野菜の一種なので、含む・含まれるの関係ではありますが、左右の向きが例と逆です。同じ関係とは数えません。"},{"title":"イを、同じ文に当てはめる","formula":"すずめ：鳥\n→ すずめは、鳥の一種である（成り立つ）","body":"関係の種類も、左右の向きも、例と同じです。"},{"title":"ウを、同じ文に当てはめる","formula":"ピアノ：バイオリン\n→ ピアノは、バイオリンの一種である（成り立たない）\n関係：同列（どちらも楽器の仲間）","body":"ピアノもバイオリンも楽器の一種で、同じ仲間どうしです。一方がもう一方に含まれる関係ではありません。"},{"title":"同じ文が成り立った組を選ぶ","formula":"ア：向きが逆\nイ：同じ関係\nウ：同列","body":"例と同じ文がそのまま成り立つのは、イだけです。"}]},{"label":"用途の関係を見分ける","question":"「はさみ：切る」と同じ関係になっている組は、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"消しゴム：消す","correct":true,"reason":"消しゴムは消すために使う。用途の関係で、向きも例と同じ。"},{"key":"イ","text":"パン：小麦","correct":false,"reason":"パンは小麦から作られる。原料の関係で、用途ではない。"},{"key":"ウ","text":"本：図書館","correct":false,"reason":"本は図書館に置かれている。物と、置かれる場所の関係で、用途ではない。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"はさみ：切る\n→ はさみは、切るために使う\n関係：用途（左が道具、右が使いみち）","body":"右の語は動作を表しています。左の物を、右の動作のために使う、という関係です。"},{"title":"三つの組を、同じ文に当てはめる","formula":"ア：消しゴムは、消すために使う（成り立つ）\nイ：パンは、小麦のために使う（成り立たない）\nウ：本は、図書館のために使う（成り立たない）","body":"同じ文に当てはめて意味が通るのは、アだけです。"},{"title":"イとウが、どの関係かを確かめる","formula":"イ：パンは、小麦から作られる（原料）\nウ：本は、図書館に置かれている（物と、置かれる場所）","body":"イとウにも二語の関係はありますが、用途ではありません。関係の種類が違うので、選びません。"}]},{"label":"同じ関係の組を、すべて選ぶ","question":"「豆腐：大豆」と同じ関係になっている組を、次のうちからすべて選んでください。","answer":"アとウ","kind":"choice","select":"all","options":[{"key":"ア","text":"ワイン：ぶどう","correct":true,"reason":"ワインはぶどうから作られる。左が製品、右が原料で、例と同じ。"},{"key":"イ","text":"牛乳：チーズ","correct":false,"reason":"原料の関係だが、左が原料、右が製品で、例と向きが逆。"},{"key":"ウ","text":"紙：木材","correct":true,"reason":"紙は木材から作られる。左が製品、右が原料で、例と同じ。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"豆腐：大豆\n→ 豆腐は、大豆から作られる\n関係：原料（左が製品、右が原料）","body":"左が作られた物、右がそのもとになる物です。この向きも含めて、同じ文に当てはめます。"},{"title":"アを、同じ文に当てはめる","formula":"ワインは、ぶどうから作られる（成り立つ）","body":"関係の種類も、左右の向きも、例と同じです。"},{"title":"イを、同じ文に当てはめる","formula":"牛乳は、チーズから作られる（成り立たない）\n正しくは：チーズは、牛乳から作られる","body":"原料の関係ではありますが、左が原料、右が製品で、例と向きが逆です。"},{"title":"ウを、同じ文に当てはめる","formula":"紙は、木材から作られる（成り立つ）","body":"紙は、木材から取り出した繊維（パルプ）を原料にして作られます。例と同じ関係です。"},{"title":"成り立った組を、すべて答える","formula":"ア：同じ関係\nイ：向きが逆\nウ：同じ関係","body":"「すべて選ぶ」問題では、一つ見つけても止めず、残りの組も最後まで当てはめます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-word-usage":{"id":"spi-word-usage","name":"語の用法","type":"learn","goal":"同じ語が、例文と同じ意味やはたらきで使われている文を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"語の用法は、例文の中の語と同じ意味やはたらきで使われている文を選ぶ問題です。問われるのは、いくつもの意味を持つ語（多義語）と、助詞（語の後について、ほかの語との関係を示す語。「で」「の」など）、助動詞（動詞などの後について、意味をつけ加える語。「れる・られる」など）です。同じ形の語でも、文によって意味やはたらきが変わります。見分けるには、その語を別の言葉に言いかえます。例文と同じ言いかえができる文が、同じ用法の文です。","example":"多義語「とる」\n　写真をとる → 写す\n　責任をとる → 引き受ける\n助詞「で」\n　駅で待つ → 場所（〜において）\n　バスで行く → 手段（〜を使って）\n　雨で中止になる → 原因（〜が原因で）","note":"言いかえた言葉を、例文と選択肢の両方に入れて、意味が変わらないかを確かめます。"},"cost":{"hours":6,"yen":0},"assessment":{"question":"「雨の降る日」の「の」と同じ使い方をしているのは？","options":["私の本","花の咲く庭","走るのが速い"],"answer":1,"explanation":"「雨の降る日」は「雨が降る日」と言いかえられ、「の」は主語を示している。「花の咲く庭」も「花が咲く庭」と言える。「私の本」は持ち主を示し、「走るのが」は「走ること」の意味。"},"practice":{"title":"言いかえて、同じ用法の文を選ぶ","lead":"例文の語を、別の言葉に置きかえてから比べる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"多義語の意味を見分ける","question":"「会議のメモをとる」の「とる」と最も近い意味で使われているのは、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"実験の記録をとる","correct":true,"reason":"「記録を書き記す」と言いかえられ、例文と同じ意味。"},{"key":"イ","text":"三日間の休みをとる","correct":false,"reason":"「休みを得る」の意味で、書き記すことではない。"},{"key":"ウ","text":"部屋に入って帽子をとる","correct":false,"reason":"「帽子を脱ぐ・はずす」の意味で、書き記すことではない。"}],"steps":[{"title":"例文の「とる」を、別の言葉に言いかえる","formula":"会議のメモをとる\n→ 会議のメモを書き記す","body":"言いかえても、例文の意味は変わりません。この「とる」は「書き記す」という意味です。"},{"title":"同じ言いかえを、三つの文に入れる","formula":"ア：実験の記録を書き記す（意味が通る）\nイ：三日間の休みを書き記す（意味が変わる）\nウ：部屋に入って帽子を書き記す（意味が通らない）","body":"例文と同じ言いかえができるのは、アだけです。"},{"title":"イとウの「とる」を、それぞれ言いかえる","formula":"イ：休みをとる → 休みを得る\nウ：帽子をとる → 帽子を脱ぐ・はずす","body":"イは「得る」、ウは「脱ぐ・はずす」で、例文の「書き記す」とは別の意味です。"}]},{"label":"助詞「で」のはたらきを見分ける","question":"「台風で電車が止まる」の「で」と同じはたらきで使われているのは、次のうちどれでしょうか。","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"公園で遊ぶ","correct":false,"reason":"「公園において」と言いかえられ、動作をする場所を表す。"},{"key":"イ","text":"鉛筆で書く","correct":false,"reason":"「鉛筆を使って」と言いかえられ、手段（動作に使う道具）を表す。"},{"key":"ウ","text":"風邪で学校を休む","correct":true,"reason":"「風邪が原因で」と言いかえられ、例文と同じく原因を表す。"}],"steps":[{"title":"例文の「で」を、別の言葉に言いかえる","formula":"台風で電車が止まる\n→ 台風が原因で電車が止まる\nはたらき：原因","body":"台風は、電車が止まった原因です。「〜が原因で」と言いかえられます。"},{"title":"同じ言いかえを、三つの文に入れる","formula":"ア：公園が原因で遊ぶ（意味が変わる）\nイ：鉛筆が原因で書く（意味が変わる）\nウ：風邪が原因で学校を休む（意味が通る）","body":"原因を表す言いかえが、もとの文の意味のまま成り立つのは、ウだけです。"},{"title":"アとイの「で」を、それぞれ言いかえる","formula":"ア：公園で遊ぶ → 公園において遊ぶ（場所）\nイ：鉛筆で書く → 鉛筆を使って書く（手段）","body":"アは動作をする場所、イは動作に使う道具を表しています。原因ではありません。"}]},{"label":"助動詞「れる・られる」の意味を見分ける","question":"「私は先生に名前を呼ばれる」の「れる」と同じ意味で「れる・られる」が使われているのは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"昔のことが思い出される","correct":false,"reason":"「自然に」を補える。自発の意味。"},{"key":"イ","text":"私は弟に日記を読まれる","correct":true,"reason":"「弟が私の日記を読む」と直せる。例文と同じ受け身の意味。"},{"key":"ウ","text":"弟はもう一人で服を着られる","correct":false,"reason":"「着ることができる」と直せる。可能の意味。"},{"key":"エ","text":"校長先生が話される","correct":false,"reason":"「お話しになる」と直せる。尊敬の意味。"}],"steps":[{"title":"「れる・られる」の四つの意味を確かめる","formula":"受け身：ほかから動作を受ける\n可能：〜することができる\n自発：自然にそうなる\n尊敬：動作をする人を高める","body":"「れる・られる」には四つの意味があります。どれに当たるかを、言いかえで見分けます。"},{"title":"例文の意味を見分ける","formula":"私は先生に名前を呼ばれる\n→ 先生が私の名前を呼ぶ、と直せる\n意味：受け身","body":"「先生に」と、動作をする人が示されています。その人を主語にした文に直せるので、受け身です。"},{"title":"四つの文を、それぞれ言いかえる","formula":"ア：昔のことが自然に思い出される、と言える（自発）\nイ：弟が私の日記を読む、と直せる（受け身）\nウ：弟はもう一人で服を着ることができる、と直せる（可能）\nエ：校長先生がお話しになる、と直せる（尊敬）","body":"アは「自然に」を補える、ウは「〜ことができる」に直せる、エは「お〜になる」に直せることから、それぞれ見分けます。"},{"title":"例文と同じ意味の文を選ぶ","formula":"例文：受け身\nイ：受け身","body":"イも「弟に」と動作をする人が示されていて、その人を主語にした文に直せます。答えはイです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-work":{"id":"spi-work","name":"仕事算","type":"learn","goal":"全体を1として、複数人での仕事にかかる日数を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"仕事算は、複数の人や機械が一つの仕事をするときに、かかる日数や時間を求める問題です。仕事の量が具体的な数で書かれていないので、仕事全体を1と置きます。すると、1人で8日かかる人は、1日に全体の1/8を進めると表せます。一緒に働くときは、それぞれの1日分を足して、全体の1をその和で割ります。","example":"1日にできる量 = 1 ÷ かかる日数\n一緒にしたときの1日分 = それぞれの1日分の和\nかかる日数 = 1 ÷ 1日分\n例　どちらも1人で8日かかる二人の1日分：1/8 + 1/8 = 1/4","note":"この二人が一緒にすると、1 ÷ (1/4) で4日かかります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の
