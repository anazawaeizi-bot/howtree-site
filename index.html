a":"全体：40人\n英語が得意：28人\n数学が得意：19人\nどちらも得意でない：5人","body":"全体の40人を表す四角の中に、英語が得意な人の円と、数学が得意な人の円を、一部が重なるようにかきます。円の重なった部分が「両方が得意な人」、二つの円の外側が「どちらも得意でない人」です。"},{"title":"少なくとも一方が得意な人数を求める","formula":"40 − 5 = 35","body":"全体から、どちらも得意でない5人を除くと、二つの円のどこかに入る人数になります。"},{"title":"英語と数学の人数を、そのまま足す","formula":"28 + 19 = 47","body":"この47人は、両方が得意な人を英語と数学で2回数えています。"},{"title":"数えすぎた分が、両方が得意な人数になる","formula":"47 − 35 = 12","body":"重なりの人を2回数えた47人と、少なくとも一方が得意な35人との差が、重なりの人数です。"},{"title":"四つの部分を足して、全体になるか確かめる","formula":"英語だけ：28 − 12 = 16\n数学だけ：19 − 12 = 7\n16 + 12 + 7 + 5 = 40","body":"英語だけ、両方、数学だけ、どちらでもない、の四つを足すと40人になります。"}]},{"label":"片方だけの人数と、どちらでもない人数を求める","question":"60人に通勤の方法をたずねました。電車を使う人は38人、バスを使う人は27人、両方を使う人は14人でした。電車だけを使う人と、どちらも使わない人は、それぞれ何人でしょうか。","answer":"電車だけを使う人は24人、どちらも使わない人は9人","steps":[{"title":"わかっている人数を置く","formula":"全体：60人\n電車を使う：38人\nバスを使う：27人\n両方を使う：14人","body":"「電車を使う38人」には、バスも使う14人が含まれています。「電車だけ」とは別の数です。"},{"title":"電車だけを使う人数を求める","formula":"38 − 14 = 24","body":"電車を使う人の円と、バスを使う人の円を重ねてかきます。電車の円から、重なりの部分を除きます。"},{"title":"バスだけを使う人数を求める","formula":"27 − 14 = 13","body":"バスの円からも、同じように重なりの部分を除きます。"},{"title":"少なくとも一方を使う人数を求める","formula":"24 + 14 + 13 = 51","body":"電車だけ、両方、バスだけの三つの部分を足します。"},{"title":"全体から引いて、どちらも使わない人数を求める","formula":"60 − 51 = 9","body":"二つの円の外側にいる人数です。"},{"title":"別の求め方で、少なくとも一方の人数を確かめる","formula":"38 + 27 − 14 = 51","body":"二つをそのまま足して、2回数えた重なりを1回引いても、同じ51人になります。"}]},{"label":"重なりの人数の範囲を求める","question":"50人のうち、朝食を食べた人は36人、運動をした人は22人でした。朝食を食べて運動もした人は、最も少なくて何人、最も多くて何人でしょうか。","answer":"最も少なくて8人、最も多くて22人","steps":[{"title":"わかっている人数と、求めるものを置く","formula":"全体：50人\n朝食を食べた：36人\n運動をした：22人\n求めるもの：両方に当てはまる人数の範囲","body":"「どちらもしていない人」の数が書かれていないので、両方に当てはまる人数は一つに決まりません。あり得る範囲を求めます。"},{"title":"最も多い場合を考える","formula":"36人と22人のうち、少ない方：22人","body":"運動をした22人が全員、朝食も食べていた場合が最も多くなります。重なりは、少ない方の22人を超えられません。"},{"title":"最も少ない場合のために、二つの人数を足す","formula":"36 + 22 = 58","body":"重なりをできるだけ少なくしたいので、まず重なりがないものとして足してみます。"},{"title":"全体を超えた分が、必ず重なる人数になる","formula":"58 − 50 = 8","body":"58人は全体の50人より8人多いので、どう分けても8人は両方に当てはまります。"},{"title":"最も少ない場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 8 = 28\n運動だけ：22 − 8 = 14\n28 + 8 + 14 = 50","body":"このとき、どちらもしていない人は0人です。"},{"title":"最も多い場合に、全体が50人になるか確かめる","formula":"朝食だけ：36 − 22 = 14\n少なくとも一方：14 + 22 = 36\nどちらもしていない：50 − 36 = 14\n14 + 22 + 0 + 14 = 50","body":"このとき、運動だけの人は0人で、どちらもしていない人が14人います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-settlement":{"id":"spi-settlement","name":"代金の精算","type":"learn","goal":"立て替えた金額から、だれがだれにいくら払えば同じ負担になるかを求められる。","part_of":"spi","tags":["sansu","num"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"代金の精算は、何人かが別々に立て替えたお金を、最後に全員が同じ負担になるように精算する問題です。まず、かかった金額の合計を人数で割って、1人が負担すべき額を求めます。次に、それぞれが実際に払った額と比べます。負担すべき額より多く払った人は差額を受け取り、少なく払った人は差額を払います。以前からの貸し借りがあるときは、精算で払う額と、返してもらう額を差し引きします。","example":"1人の負担額 = かかった合計 ÷ 人数\n受け取る額 = 実際に払った額 − 1人の負担額\n払う額 = 1人の負担額 − 実際に払った額\n例　2人で、一方が3,000円、もう一方が1,000円を立て替えたとき\n　1人の負担額：4,000 ÷ 2 = 2,000\n　1,000円を立て替えた人が払う額：2,000 − 1,000 = 1,000","note":"払う額の合計と、受け取る額の合計は、いつも同じになります。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-muldiv","level":"must"}],"assessment":{"question":"AとBの2人で買い物をし、Aが5,000円、Bが1,000円を立て替えた。同じ負担にするには？","options":["BがAに2,000円払う","BがAに4,000円払う","BがAに3,000円払う"],"answer":0,"explanation":"合計は6,000円で、1人の負担額は3,000円。Bは1,000円しか払っていないので、差の2,000円をAに払う。4,000円は二人の立て替えた額の差で、これを払うとBの負担が多くなりすぎる。3,000円は1人の負担額で、Bがすでに払った1,000円を引いていない。"},"practice":{"title":"1人の負担額を求めて、差額を精算する","lead":"負担すべき額と、実際に払った額を比べる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"3人で立て替えた費用を精算する","question":"X、Y、Zの3人で旅行に行きました。Xが宿泊費18,000円、Yが交通費9,000円、Zが食事代3,000円を立て替えました。3人が同じ額を負担するように精算します。足りない人が、多く払った人に直接払うものとします。だれが、だれに、いくら払えばよいでしょうか。","answer":"YがXに1,000円、ZがXに7,000円払う","alternatives":[{"try":"YとZが、Xの立て替えた18,000円を半分ずつ（9,000円ずつ）Xに払う","why_not":"YとZも自分で立て替えている。その分を考えに入れないと、YとZの負担が多くなりすぎる。"},{"try":"18,000 ÷ 3 = 6,000円ずつを、YとZがXに払う","why_not":"割るのはXの立て替えた額ではなく、3人が立て替えた合計の30,000円。YとZがすでに払った額も引く必要がある。"}],"steps":[{"title":"立て替えた額を書き出す","formula":"X：18,000円\nY：9,000円\nZ：3,000円","body":"何の費用かは、精算には関係しません。だれがいくら払ったかだけを見ます。"},{"title":"かかった合計を求める","formula":"18,000 + 9,000 + 3,000 = 30,000","body":"3人が立て替えた額をすべて足します。千円を単位にすると 18 + 9 + 3 = 30 で、千円が30個分、つまり30,000円です。"},{"title":"1人の負担額を求める","formula":"30,000 ÷ 3 = 10,000","body":"合計を人数で割ります。3人とも、10,000円ずつ負担するのが正しい形です。"},{"title":"それぞれが払った額を、負担額と比べる","formula":"X：18,000 − 10,000 = 8,000（多く払った）\nY：10,000 − 9,000 = 1,000（足りない）\nZ：10,000 − 3,000 = 7,000（足りない）","body":"Xは8,000円多く払っています。YとZは、負担額に足りない分があります。"},{"title":"足りない人から、多く払った人へ払う","formula":"Y → X：1,000円\nZ → X：7,000円","body":"多く払ったのはXだけなので、YとZは、足りない分をそれぞれXに払います。"},{"title":"Xが受け取る額が、多く払った額と合うか確かめる","formula":"1,000 + 7,000 = 8,000","body":"YとZから受け取る合計は8,000円で、Xが多く払った額と同じです。精算の後は、3人とも10,000円の負担になります。"}]},{"label":"以前の貸し借りと差し引きする","question":"PとQの2人で、8,000円の贈り物を買いました。代金はPが全額を払い、2人で同じ額を負担することにしました。ところで、Qは以前、Pに1,500円を貸していて、まだ返してもらっていません。貸し借りもまとめて精算するには、QはPにいくら払えばよいでしょうか。","answer":"QがPに2,500円払う","alternatives":[{"try":"4,000 + 1,500 = 5,500円を、QがPに払う","why_not":"お金を貸しているのはQの方。1,500円はPがQに返す額なので、足すのではなく引く。"}],"steps":[{"title":"二つのお金の動きを分けて書き出す","formula":"贈り物：8,000円をPが全額払った。2人で同じ額を負担する\n貸し借り：QがPに1,500円を貸している","body":"贈り物の精算と、以前の貸し借りは、別々のお金の動きです。まず一つずつ考えます。"},{"title":"贈り物の、1人の負担額を求める","formula":"8,000 ÷ 2 = 4,000","body":"Qは何も払っていないので、贈り物については、QがPに4,000円払うことになります。"},{"title":"貸し借りで、だれがだれに払うかを確かめる","formula":"P → Q：1,500円（借りたお金を返す）","body":"貸しているのはQです。PがQに1,500円を返すことになります。"},{"title":"向きが逆の二つを、差し引きする","formula":"Q → P：4,000円\nP → Q：1,500円\n4,000 − 1,500 = 2,500","body":"QがPに4,000円払い、PがQに1,500円返すのは、QがPに2,500円払うのと同じです。"},{"title":"精算の後、Pの手元から出たお金を確かめる","formula":"8,000 − 2,500 = 5,500\n4,000 + 1,500 = 5,500","body":"Pは8,000円払って2,500円を受け取ったので、5,500円を出したことになります。これは、贈り物の負担額4,000円と、返した1,500円の合計と同じです。"}]},{"label":"払っていない人がいる精算","question":"A、B、Cの3人で食事会を開きました。Aが会場費12,000円、Bが料理代6,000円を払い、Cは何も払っていません。3人が同じ額を負担するように精算します。なお、Cは以前、Aに2,000円を貸していて、まだ返してもらっていません。貸し借りもまとめて精算します。足りない人が、多く払った人に直接払うものとすると、だれが、だれに、いくら払えばよいでしょうか。","answer":"CがAに4,000円払う（Bは払うことも受け取ることもない）","alternatives":[{"try":"CがAとBに、3,000円ずつ払う","why_not":"Bが払った6,000円は、ちょうど1人の負担額。Bは受け取る立場ではない。"},{"try":"CがAに6,000円払う","why_not":"食事会の精算だけで、以前の貸し借りを入れ忘れている。"},{"try":"6,000 + 2,000 = 8,000円を、CがAに払う","why_not":"お金を貸しているのはCの方。2,000円はAがCに返す額なので、足すのではなく引く。"}],"steps":[{"title":"かかった合計と、1人の負担額を求める","formula":"12,000 + 6,000 = 18,000\n18,000 ÷ 3 = 6,000","body":"払っていないCも含めて、3人で割ります。"},{"title":"それぞれが払った額を、負担額と比べる","formula":"A：12,000 − 6,000 = 6,000（多く払った）\nB：6,000 − 6,000 = 0（ちょうど）\nC：6,000 − 0 = 6,000（足りない）","body":"Bは、払った額がちょうど負担額と同じです。食事会の精算には関わりません。"},{"title":"食事会について、だれがだれに払うかを決める","formula":"C → A：6,000円","body":"足りないCが、多く払ったAに6,000円を払います。"},{"title":"貸し借りと差し引きする","formula":"C → A：6,000円\nA → C：2,000円（借りたお金を返す）\n6,000 − 2,000 = 4,000","body":"AはCに2,000円を返す立場です。向きが逆の二つを差し引きすると、CがAに4,000円払えば済みます。"},{"title":"精算の後、Aの手元から出たお金を確かめる","formula":"12,000 − 4,000 = 8,000\n6,000 + 2,000 = 8,000","body":"Aは12,000円払って4,000円を受け取ったので、8,000円を出したことになります。食事会の負担額6,000円と、返した2,000円の合計と同じです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-speed":{"id":"spi-speed","name":"速さと時間","type":"learn","goal":"速さ、時間、距離の関係を使って、出会いや追いつきの問題を解ける。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"速さは、決まった時間に進む距離のことです。時速は1時間、分速は1分間、秒速は1秒間に進む距離を表します。速さ・時間・距離のうち二つがわかれば、残りの一つを求められます。計算の前に、時間と距離の単位を速さの単位にそろえます。二人が向かい合って進むときは速さの和、同じ向きに進むときは速さの差の分だけ、二人の間の距離が変わります。","example":"距離 = 速さ × 時間\n速さ = 距離 ÷ 時間\n時間 = 距離 ÷ 速さ\n例　分速80mで15分歩いた距離：80 × 15 = 1,200","note":"三つの式は、同じ関係を求めたいものに合わせて書き直したものです。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは小数・分数のかけ算わり算と、km・m、時間・分の換算で、小数と分数に収まる。練習の解説は方程式を使っておらず、方程式の「あると楽」は内容からは確かめられないので仮のまま。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"math-fraction","level":"must"},{"id":"math-linear-eq","level":"helps"}],"assessment":{"question":"時速60kmで30分進んだ距離は？","options":["2km","30km","120km"],"answer":1,"explanation":"時間の単位をそろえる。30分 = 0.5時間。60 × 0.5 = 30km。"},"practice":{"title":"速さ・時間・距離の関係から求める","lead":"単位をそろえ、二人の間の距離が1分でどれだけ変わるかを見る。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"単位をそろえて距離を求める","question":"時速4.8kmで25分歩きました。歩いた距離は何kmでしょうか。","answer":"2km","steps":[{"title":"速さと時間、求めるものを置く","formula":"速さ：時速4.8km\n時間：25分\n求めるもの：距離（km）","body":"速さは「1時間あたり」なのに、時間は「分」で書かれています。このままではかけ算できないので、単位をそろえます。"},{"title":"25分を、時間の単位に直す","formula":"25 ÷ 60 = 25/60 = 5/12","body":"1時間は60分なので、25分は5/12時間です。"},{"title":"速さに時間をかけて、距離を求める","formula":"4.8 × 5/12 = 4.8 ÷ 12 × 5 = 0.4 × 5 = 2","body":"距離は、速さ×時間です。時速と時間（時）をかけるので、答えはkmになります。"},{"title":"分速に直す方法で確かめる","formula":"分速：4,800 ÷ 60 = 80\n80 × 25 = 2,000","body":"時速4.8kmは1時間に4,800mなので、分速80mです。25分で2,000m、つまり2kmになり、同じ答えです。"}]},{"label":"向かい合って進み、出会う","question":"2.7km離れた二つの地点から、兄は分速80m、弟は分速55mで、向かい合って同時に出発しました。二人が出会うのは、出発してから何分後でしょうか。","answer":"20分後","steps":[{"title":"二人の間の距離と、それぞれの速さを置く","formula":"二人の間の距離：2.7km = 2,700m\n兄：分速80m\n弟：分速55m","body":"速さが分速（m）なので、距離もmに直します。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"80 + 55 = 135","body":"向かい合って進むので、二人の間は、1分ごとに二人が進んだ分を合わせた長さだけ縮まります。"},{"title":"はじめの距離を、1分で縮まる距離で割る","formula":"2,700 ÷ 135 = 20","body":"2,700mが、1分に135mずつ縮まります。0mになったときが出会うときなので、20分後です。"},{"title":"20分で二人が進んだ距離を足して確かめる","formula":"兄：80 × 20 = 1,600\n弟：55 × 20 = 1,100\n1,600 + 1,100 = 2,700","body":"二人が進んだ距離の合計が、はじめの2,700mと同じになります。"}]},{"label":"後から出発して、追いつく","question":"弟が分速60mで家を出ました。その8分後に、兄が分速100mで同じ道を追いかけました。兄が弟に追いつくのは、兄が家を出てから何分後でしょうか。","answer":"12分後","steps":[{"title":"二人の速さと、出発のずれを置く","formula":"弟：分速60m、先に出発\n兄：分速100m、8分後に出発\n求めるもの：兄が出発してから追いつくまでの時間","body":"数えはじめるのは、兄が出発したときです。そのとき、弟はすでに先へ進んでいます。"},{"title":"兄が出発するとき、弟が何m先にいるかを求める","formula":"60 × 8 = 480","body":"弟は分速60mで8分進んでいるので、兄より480m先にいます。"},{"title":"1分で二人の間が何m縮まるかを求める","formula":"100 − 60 = 40","body":"同じ向きに進むので、二人の間は、速さの差の分だけ縮まります。向かい合うときと違い、足すのではなく引きます。"},{"title":"先にいる距離を、1分で縮まる距離で割る","formula":"480 ÷ 40 = 12","body":"480mの差が、1分に40mずつ縮まります。差が0mになるのは、兄が出発してから12分後です。"},{"title":"追いついたとき、二人の進んだ距離が同じか確かめる","formula":"兄：100 × 12 = 1,200\n弟：60 × (8 + 12) = 1,200","body":"兄は12分、弟は8分と12分を合わせた20分進んでいます。どちらも家から1,200mで、同じ場所にいます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-tables":{"id":"spi-tables","name":"表の読み取り","type":"learn","goal":"複数の表から必要な数値を拾い、割合や増減を計算できる。","part_of":"spi","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表の読み取りは、一つまたは複数の表から必要な数値を探し、割合や増減を計算する問題です。表の題、行と列の見出し、単位を先に確かめて、どの数が何を表しているかをつかみます。割合を求めるときは、何を基準（100%）にするかを問題文から読み取ります。複数の表を使うときは、一方の表の割合を、もう一方の表の実際の数にかけて求めます。","example":"全体に占める割合 = その項目の数 ÷ 合計\n増加率 = (後の数 − 前の数) ÷ 前の数\n実際の数 = 基準の数 × 割合\n例　前年50、今年60のときの増加率：(60 − 50) ÷ 50 = 0.2","note":"0.2は20%です。割る数は、基準である前年の50です。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。表の行と列から数を拾う操作は表とグラフ、割合と増加率は割合と比に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-table","level":"must"},{"id":"math-ratio","level":"must"},{"id":"math-average","level":"helps"}],"assessment":{"question":"A店の売上は前年80万円、今年100万円。今年の売上は、前年に比べて何%増えた？","options":["20%","25%","125%"],"answer":1,"explanation":"増加は20万円。基準は前年なので20 ÷ 80 = 0.25で、25%。125%は今年の売上が前年の何%かを表す数で、増えた割合ではない。"},"practice":{"title":"複数の表から、割合や増減を求める","lead":"どの数を基準にするかを、表の見出しで確かめる。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"全体に占める割合を求める","question":"表1で、5月の3支店の売上の合計に占めるA支店の売上の割合は、何%でしょうか。","answer":"30%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う列：5月\n比べる量：A支店の売上 270万円\n基準：3支店の5月の売上の合計","body":"「合計に占める割合」なので、基準は5月の合計です。4月の列は使いません。"},{"title":"5月の売上の合計を求める","formula":"270 + 360 + 270 = 900","body":"表に合計の行がないので、3支店の5月の売上を足します。"},{"title":"A支店の売上を、合計で割る","formula":"270 ÷ 900 = 0.3","body":"割合は、比べる量÷基準の量です。0.3は30%です。"},{"title":"3支店の割合を足すと、100%になるか確かめる","formula":"B支店：360 ÷ 900 = 0.4\nC支店：270 ÷ 900 = 0.3\n0.3 + 0.4 + 0.3 = 1","body":"B支店は40%、C支店は30%で、3支店を足すと100%になります。基準を4月の合計800万円に取り違えていれば、足しても100%になりません。"}]},{"label":"前の月からの増加率を求める","question":"表1で、C支店の5月の売上は、4月に比べて何%増えたでしょうか。","answer":"35%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]}],"steps":[{"title":"表から必要な数を拾い、基準を置く","formula":"使う行：C支店\n4月：200万円（基準）\n5月：270万円","body":"「4月に比べて」なので、基準は4月の売上です。"},{"title":"増えた金額を求める","formula":"270 − 200 = 70","body":"5月の売上から4月の売上を引きます。"},{"title":"増えた金額を、基準の4月の売上で割る","formula":"70 ÷ 200 = 0.35","body":"0.35は35%です。5月の270万円で割ると、基準を取り違えた別の数になります。"},{"title":"4月の売上を35%増やすと、5月の売上になるか確かめる","formula":"200 × (1 + 0.35) = 200 × 1.35 = 270","body":"200万円の1.35倍が270万円で、表の5月の数と合います。"}]},{"label":"二つの表を組み合わせる","question":"表1と表2から、5月の商品Xの売上は、3支店の合計で何万円でしょうか。また、それは5月の3支店の売上の合計の何%でしょうか。","answer":"369万円、5月の3支店の売上の合計の41%","tables":[{"caption":"表1　支店別の売上（万円）","rows":[["支店","4月","5月"],["A支店","240","270"],["B支店","360","360"],["C支店","200","270"]]},{"caption":"表2　各支店の5月の売上に占める商品別の割合（％）","rows":[["支店","商品X","商品Y","商品Z"],["A支店","40","35","25"],["B支店","50","30","20"],["C支店","30","30","40"]]}],"steps":[{"title":"二つの表の関係を置く","formula":"表1：支店ごとの売上（万円）\n表2：その支店の5月の売上を100%としたときの、商品ごとの割合","body":"表2の割合は、支店ごとに基準が違います。商品Xの金額は、支店ごとに「表1の5月の売上×表2の割合」で求めます。"},{"title":"A支店の商品Xの売上を求める","formula":"270 × 0.4 = 108","body":"A支店の5月の売上270万円の40%です。"},{"title":"B支店の商品Xの売上を求める","formula":"360 × 0.5 = 180","body":"B支店の5月の売上360万円の50%です。"},{"title":"C支店の商品Xの売上を求める","formula":"270 × 0.3 = 81","body":"C支店の5月の売上270万円の30%です。"},{"title":"3支店の商品Xの売上を足す","formula":"108 + 180 + 81 = 369","body":"金額に直してから足します。"},{"title":"5月の売上の合計に占める割合を求める","formula":"5月の売上の合計：270 + 360 + 270 = 900\n369 ÷ 900 = 0.41","body":"基準は3支店の5月の売上の合計900万円です。0.41は41%です。"},{"title":"割合を平均してはいけないことを確かめる","formula":"(40 + 50 + 30) ÷ 3 = 40","body":"三つの割合を平均すると40%になり、正しい41%と合いません。支店ごとに売上の大きさが違うので、割合どうしをそのまま平均することはできません。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-text-calc":{"id":"spi-text-calc","name":"長文の読み取り計算","type":"learn","goal":"文章の中から必要な数値を拾い、割合や1あたりの量を計算できる。","part_of":"spi","tags":["sansu","data"],"status":"draft","concept":{"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"長文の読み取り計算は、数値がいくつも出てくる文章を読んで、そこから計算で答えを出す問題です。表と違い、数値が文の中に散らばっているので、問いに必要な数値だけを拾い出します。割合が出てきたら、それが何をもとにした割合かを、文から読み取ります。文章に直接書かれていない数値は、書かれている数値から順に求めます。本番では、いくつかの記述が本文と合うかどうかを判定する形で出ることがあります。判定のためにする計算は、数値を直接答える場合と同じです。","example":"比べる量 = 基準の量 × 割合\n基準の量 = 比べる量 ÷ 割合\n1あたりの量 = 全体の量 ÷ 個数や人数\n例　「会員は600人で、町の人口の20%にあたる」ときの人口：600 ÷ 0.2 = 3,000","note":"この例では、600人が比べる量、人口が基準の量です。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"math-ratio","level":"must"}],"assessment":{"question":"「ある店の今月の売上は、先月の200万円より10%増えた。」今月の売上は？","options":["210万円","220万円","20万円"],"answer":1,"explanation":"10%増えたので、先月の1.1倍。200 × 1.1 = 220万円。20万円は増えた分で、今月の売上ではない。210万円は、5%増えた場合の数。"},"practice":{"title":"文章から数値を拾って計算する","lead":"何をもとにした割合かを、文から読み取る。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","passage":"ある市の図書館の年間の貸出冊数は、昨年度は48万冊であった。今年度は、昨年度より5%増えた。今年度の貸出冊数のうち、児童書は30%を占めており、その冊数は、昨年度の児童書の貸出冊数より2万4千冊多い。また、今年度の利用登録者は6万3千人で、これは市の人口の35%にあたる。","problems":[{"label":"増えた後の量を求める","question":"本文から、今年度の貸出冊数は何万冊でしょうか。","answer":"50.4万冊","alternatives":[{"try":"48 × 0.05 = 2.4万冊","why_not":"これは昨年度から増えた分。問われているのは、増えた後の今年度の冊数。"}],"steps":[{"title":"本文から、必要な数値を拾う","formula":"昨年度の貸出冊数：48万冊\n今年度：昨年度より5%増えた","body":"児童書や利用登録者の数値は、この問いには使いません。5%は、昨年度の冊数をもとにした割合です。"},{"title":"今年度が、昨年度の何倍かを求める","formula":"1 + 0.05 = 1.05","body":"5%は小数で0.05です。昨年度の1倍に、増えた0.05倍を足します。"},{"title":"昨年度の冊数にかけて、今年度の冊数を求める","formula":"48 × 1.05 = 50.4","body":"単位は万冊のまま計算します。今年度は50.4万冊です。"},{"title":"増えた分を足す方法で確かめる","formula":"増えた分：48 × 0.05 = 2.4\n48 + 2.4 = 50.4","body":"増えた2.4万冊を昨年度に足しても、同じ50.4万冊になります。"}]},{"label":"書かれていない数値を、順に求める","question":"本文から、昨年度の児童書の貸出冊数は、昨年度の貸出冊数全体の何%にあたるでしょうか。","answer":"26.5%","alternatives":[{"try":"30%","why_not":"30%は、今年度の貸出冊数に占める児童書の割合。昨年度の割合は、本文に直接は書かれていない。"},{"try":"12.72 ÷ 50.4 = 約25.2%","why_not":"昨年度の児童書を、今年度の全体で割っている。「昨年度の全体の何%か」なので、基準の量は昨年度の48万冊。"}],"steps":[{"title":"求める割合の、基準の量と比べる量を決める","formula":"基準の量：昨年度の貸出冊数（48万冊）\n比べる量：昨年度の児童書の貸出冊数（書かれていない）","body":"昨年度の児童書の冊数は、本文に直接は書かれていません。今年度の児童書の冊数から、さかのぼって求めます。"},{"title":"今年度の児童書の貸出冊数を求める","formula":"50.4 × 0.3 = 15.12","body":"今年度の貸出冊数は、1問目で求めた50.4万冊です。その30%が児童書なので、15.12万冊です。"},{"title":"昨年度の児童書の貸出冊数を求める","formula":"2万4千冊 → 2.4万冊\n15.12 − 2.4 = 12.72","body":"今年度の児童書は、昨年度より2万4千冊多いと書かれています。単位を万冊にそろえてから、今年度の冊数から引きます。"},{"title":"昨年度の全体で割って、割合を求める","formula":"12.72 ÷ 48 = 0.265","body":"0.265は26.5%です。"},{"title":"求めた割合から、昨年度の児童書の冊数に戻るか確かめる","formula":"48 × 0.265 = 12.72","body":"昨年度の48万冊の26.5%は12.72万冊で、先に求めた冊数と合います。"}]},{"label":"基準の量と、1人あたりの量を求める","question":"本文から、市の人口は何万人でしょうか。また、今年度の貸出冊数は、市民1人あたり何冊にあたるでしょうか。","answer":"人口は18万人、市民1人あたり2.8冊","alternatives":[{"try":"6.3 × 0.35 = 2.205万人","why_not":"6万3千人は、人口の35%にあたる量。人口はそれより多いはずなので、かけるのではなく割る。"},{"try":"50.4 ÷ 6.3 = 8冊","why_not":"これは利用登録者1人あたりの冊数。問われているのは、市民1人あたりの冊数。"}],"steps":[{"title":"本文から、必要な数値を拾う","formula":"利用登録者：6万3千人 → 6.3万人\n利用登録者は、市の人口の35%\n今年度の貸出冊数：50.4万冊","body":"35%は、市の人口をもとにした割合です。人口は書かれていないので、利用登録者の数から求めます。"},{"title":"利用登録者の数を割合で割って、人口を求める","formula":"6.3 ÷ 0.35 = 18","body":"人口の0.35倍が6.3万人なので、6.3を0.35で割ると人口に戻ります。人口は18万人です。"},{"title":"人口の35%が、利用登録者の数になるか確かめる","formula":"18 × 0.35 = 6.3","body":"18万人の35%は6.3万人で、本文と合います。"},{"title":"貸出冊数を人口で割って、1人あたりの冊数を求める","formula":"50.4 ÷ 18 = 2.8","body":"どちらも単位が「万」なので、そのまま割れます。市民1人あたり2.8冊です。"},{"title":"1人あたりの冊数に人口をかけて、貸出冊数に戻るか確かめる","formula":"2.8 × 18 = 50.4","body":"1人あたり2.8冊で18万人なら50.4万冊で、今年度の貸出冊数と合います。"}]},{"label":"本文と合う記述を選ぶ","question":"次のア〜ウのうち、本文の内容と合うものをすべて選んでください。","answer":"アとウ","kind":"choice","select":"all","options":[{"key":"ア","text":"今年度の貸出冊数は、50万冊を超えている。","correct":true,"reason":"今年度は 48 × 1.05 = 50.4万冊で、50万冊を超えている。"},{"key":"イ","text":"昨年度の児童書の貸出冊数は、昨年度の貸出冊数全体の3割を超えている。","correct":false,"reason":"昨年度の児童書は12.72万冊で、昨年度全体48万冊の26.5%。3割に届かない。30%は今年度の割合。"},{"key":"ウ","text":"市の人口は、20万人より少ない。","correct":true,"reason":"人口は 6.3 ÷ 0.35 = 18万人で、20万人より少ない。"}],"steps":[{"title":"記述ごとに、確かめるために必要な数を決める","formula":"ア：今年度の貸出冊数\nイ：昨年度の児童書の、昨年度全体に対する割合\nウ：市の人口","body":"本番では、このように、いくつかの記述が本文と合うかを判定する形で出ることがあります。どの記述も、本文に直接は書かれていない数を計算しないと判定できません。"},{"title":"アを確かめる","formula":"48 × 1.05 = 50.4","body":"今年度は50.4万冊で、50万冊を超えています。アは本文と合います。"},{"title":"イを確かめる","formula":"今年度の児童書：50.4 × 0.3 = 15.12\n昨年度の児童書：15.12 − 2.4 = 12.72\n12.72 ÷ 48 = 0.265","body":"昨年度の児童書は、昨年度全体の26.5%です。3割は30%なので、超えていません。本文の「30%」は今年度の割合で、昨年度の割合ではありません。イは本文と合いません。"},{"title":"ウを確かめる","formula":"6.3 ÷ 0.35 = 18","body":"人口は18万人で、20万人より少ないです。ウは本文と合います。"},{"title":"合うものを、すべて答える","formula":"ア：合う\nイ：合わない\nウ：合う","body":"「すべて選ぶ」問題なので、一つ見つけても止めず、三つとも確かめます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-verbal":{"id":"spi-verbal","name":"SPI言語","type":"target","goal":"代表的な言語問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","featured":true,"scope_note":"代表分野への学習経路で、SPIの全範囲は網羅していません。出題される分野と形式は、受検方式によって異なります。企業の受検案内で方式を確認してください。線はこの経路での学習順序を表し、公式の必須条件ではありません。空欄補充は、就職情報サイトが独立の分野として挙げているものを単元にしました（出版社の資料の五つの分野には入っていません）。語彙の量そのものは、この木の単元では補えません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"受検方式、言語・非言語の分野、測る力の説明を、公式サイト・出版社の資料・就職情報サイトの記述と照合し、具体例の分野の一覧を前提の線と照合。指摘を反映した。","text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。言語は能力検査のうち、言葉の意味や話の要旨を的確に捉えて理解する力を測る分野です。受検方式には、テストセンター（リアル会場かオンライン会場）、インハウスCBT（応募企業などの会場）、WEBテスティング（自宅や学校など）、ペーパーテスティング（マークシート）があり、出版社の資料によると、SPIの種類と実施方法によって出題項目が異なります。ここでは、出版社の資料が出題範囲として挙げている五つの分野と、就職情報サイトが挙げる空欄補充を単元として並べています。","example":"この木に入れている分野（どれも必須の前提）：二語関係、熟語、語の用法、文の並べ替え、長文読解、空欄補充","note":"受検方式は、企業からの受検案内で確かめてください。"},"cost":{"hours":10,"yen":0},"requires":[{"id":"spi-word-relations","level":"must"},{"id":"spi-idioms","level":"must"},{"id":"spi-word-usage","level":"must"},{"id":"spi-sentence-order","level":"must"},{"id":"spi-reading","level":"must"},{"id":"spi-blank","level":"must"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/","checked_at":"2026-10-16"},{"title":"SPI公式サイト：テストセンター・インハウスCBT・WEBテスティングの違い","url":"https://www.spi.recruit.co.jp/spi3news/000203.html","checked_at":"2026-10-16"},{"title":"実務教育出版：SPIの基礎知識（言語分野の出題範囲）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf","checked_at":"2026-10-16"},{"title":"リクナビ就活準備ガイド：SPIの練習問題（言語分野が測る内容）","url":"https://job.rikunabi.com/contents/test/22304/","checked_at":"2026-10-16"},{"title":"就活ハンドブック（ジョーカツ）：SPIの言語・非言語の出題傾向（空欄補充を含む6分野の挙げ方）","url":"https://jo-katsu.com/campus/1332/","checked_at":"2026-10-16"}],"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-word-relations":{"id":"spi-word-relations","name":"二語関係","type":"learn","goal":"二つの語の関係を見分け、同じ関係になっている組を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"二語関係は、例として示された二つの語の関係を読み取り、同じ関係になっている組を選ぶ問題です。よく出る関係には、一方がもう一方に含まれる「包含」、意味が反対の「対立」、同じ仲間どうしの「同列」、物とその使いみちの「用途」、製品とそのもとになる「原料」があります。解くときは、二つの語を「AはBの一種」「AはBから作られる」のような短い文にします。同じ文に当てはめて意味が通る組が、同じ関係の組です。包含・用途・原料のように向きがある関係では、左右が逆の組は同じ関係とは数えません。対立と同列は、左右を入れかえても同じ関係です。","example":"犬：動物 → 犬は動物の一種（包含。左が右に含まれる）\n拡大：縮小 → 拡大と縮小は反対の意味（対立）\n犬：猫 → 犬も猫も動物の仲間（同列）\nほうき：掃く → ほうきは掃くために使う（用途）\nバター：牛乳 → バターは牛乳から作られる（原料）","note":"「動物：犬」は、同じ包含でも向きが逆です。「動物は犬の一種」とは言えません。"},"cost":{"hours":5,"yen":0},"assessment":{"question":"「拡大：縮小」と同じ関係になっている組は？","options":["上昇：下降","犬：動物","鉛筆：書く"],"answer":0,"explanation":"拡大と縮小は反対の意味（対立）。上昇と下降も反対の意味。「犬：動物」は包含、「鉛筆：書く」は用途。"},"practice":{"title":"二つの語の関係を、短い文にして比べる","lead":"関係の種類と、左右の向きの両方を確かめる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"含む・含まれるの向きを見分ける","question":"「チューリップ：花」と同じ関係になっている組は、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"野菜：にんじん","correct":false,"reason":"含む・含まれるの関係だが、左右の向きが逆（にんじんが野菜の一種）。"},{"key":"イ","text":"すずめ：鳥","correct":true,"reason":"すずめは鳥の一種。関係の種類も、左右の向きも例と同じ。"},{"key":"ウ","text":"ピアノ：バイオリン","correct":false,"reason":"どちらも楽器の仲間で、同列の関係。一方がもう一方に含まれてはいない。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"チューリップ：花\n→ チューリップは、花の一種である\n関係：包含（左が右に含まれる）","body":"左の語をA、右の語をBとして「AはBの一種である」という文にします。左右を入れかえた「花はチューリップの一種である」は成り立たないので、向きも決まります。"},{"title":"アを、同じ文に当てはめる","formula":"野菜：にんじん\n→ 野菜は、にんじんの一種である（成り立たない）","body":"にんじんが野菜の一種なので、含む・含まれるの関係ではありますが、左右の向きが例と逆です。同じ関係とは数えません。"},{"title":"イを、同じ文に当てはめる","formula":"すずめ：鳥\n→ すずめは、鳥の一種である（成り立つ）","body":"関係の種類も、左右の向きも、例と同じです。"},{"title":"ウを、同じ文に当てはめる","formula":"ピアノ：バイオリン\n→ ピアノは、バイオリンの一種である（成り立たない）\n関係：同列（どちらも楽器の仲間）","body":"ピアノもバイオリンも楽器の一種で、同じ仲間どうしです。一方がもう一方に含まれる関係ではありません。"},{"title":"同じ文が成り立った組を選ぶ","formula":"ア：向きが逆\nイ：同じ関係\nウ：同列","body":"例と同じ文がそのまま成り立つのは、イだけです。"}]},{"label":"用途の関係を見分ける","question":"「はさみ：切る」と同じ関係になっている組は、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"消しゴム：消す","correct":true,"reason":"消しゴムは消すために使う。用途の関係で、向きも例と同じ。"},{"key":"イ","text":"パン：小麦","correct":false,"reason":"パンは小麦から作られる。原料の関係で、用途ではない。"},{"key":"ウ","text":"本：図書館","correct":false,"reason":"本は図書館に置かれている。物と、置かれる場所の関係で、用途ではない。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"はさみ：切る\n→ はさみは、切るために使う\n関係：用途（左が道具、右が使いみち）","body":"右の語は動作を表しています。左の物を、右の動作のために使う、という関係です。"},{"title":"三つの組を、同じ文に当てはめる","formula":"ア：消しゴムは、消すために使う（成り立つ）\nイ：パンは、小麦のために使う（成り立たない）\nウ：本は、図書館のために使う（成り立たない）","body":"同じ文に当てはめて意味が通るのは、アだけです。"},{"title":"イとウが、どの関係かを確かめる","formula":"イ：パンは、小麦から作られる（原料）\nウ：本は、図書館に置かれている（物と、置かれる場所）","body":"イとウにも二語の関係はありますが、用途ではありません。関係の種類が違うので、選びません。"}]},{"label":"同じ関係の組を、すべて選ぶ","question":"「豆腐：大豆」と同じ関係になっている組を、次のうちからすべて選んでください。","answer":"アとウ","kind":"choice","select":"all","options":[{"key":"ア","text":"ワイン：ぶどう","correct":true,"reason":"ワインはぶどうから作られる。左が製品、右が原料で、例と同じ。"},{"key":"イ","text":"牛乳：チーズ","correct":false,"reason":"原料の関係だが、左が原料、右が製品で、例と向きが逆。"},{"key":"ウ","text":"紙：木材","correct":true,"reason":"紙は木材から作られる。左が製品、右が原料で、例と同じ。"}],"steps":[{"title":"例の二語の関係を、短い文にする","formula":"豆腐：大豆\n→ 豆腐は、大豆から作られる\n関係：原料（左が製品、右が原料）","body":"左が作られた物、右がそのもとになる物です。この向きも含めて、同じ文に当てはめます。"},{"title":"アを、同じ文に当てはめる","formula":"ワインは、ぶどうから作られる（成り立つ）","body":"関係の種類も、左右の向きも、例と同じです。"},{"title":"イを、同じ文に当てはめる","formula":"牛乳は、チーズから作られる（成り立たない）\n正しくは：チーズは、牛乳から作られる","body":"原料の関係ではありますが、左が原料、右が製品で、例と向きが逆です。"},{"title":"ウを、同じ文に当てはめる","formula":"紙は、木材から作られる（成り立つ）","body":"紙は、木材から取り出した繊維（パルプ）を原料にして作られます。例と同じ関係です。"},{"title":"成り立った組を、すべて答える","formula":"ア：同じ関係\nイ：向きが逆\nウ：同じ関係","body":"「すべて選ぶ」問題では、一つ見つけても止めず、残りの組も最後まで当てはめます。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-word-usage":{"id":"spi-word-usage","name":"語の用法","type":"learn","goal":"同じ語が、例文と同じ意味やはたらきで使われている文を選べる。","part_of":"spi","tags":["kokugo","vocab"],"status":"draft","concept":{"reviewed_at":"2026-10-07","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・分類と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"語の用法は、例文の中の語と同じ意味やはたらきで使われている文を選ぶ問題です。問われるのは、いくつもの意味を持つ語（多義語）と、助詞（語の後について、ほかの語との関係を示す語。「で」「の」など）、助動詞（動詞などの後について、意味をつけ加える語。「れる・られる」など）です。同じ形の語でも、文によって意味やはたらきが変わります。見分けるには、その語を別の言葉に言いかえます。例文と同じ言いかえができる文が、同じ用法の文です。","example":"多義語「とる」\n　写真をとる → 写す\n　責任をとる → 引き受ける\n助詞「で」\n　駅で待つ → 場所（〜において）\n　バスで行く → 手段（〜を使って）\n　雨で中止になる → 原因（〜が原因で）","note":"言いかえた言葉を、例文と選択肢の両方に入れて、意味が変わらないかを確かめます。"},"cost":{"hours":6,"yen":0},"assessment":{"question":"「雨の降る日」の「の」と同じ使い方をしているのは？","options":["私の本","花の咲く庭","走るのが速い"],"answer":1,"explanation":"「雨の降る日」は「雨が降る日」と言いかえられ、「の」は主語を示している。「花の咲く庭」も「花が咲く庭」と言える。「私の本」は持ち主を示し、「走るのが」は「走ること」の意味。"},"practice":{"title":"言いかえて、同じ用法の文を選ぶ","lead":"例文の語を、別の言葉に置きかえてから比べる。","original":true,"reviewed_at":"2026-10-09","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の並び・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","problems":[{"label":"多義語の意味を見分ける","question":"「会議のメモをとる」の「とる」と最も近い意味で使われているのは、次のうちどれでしょうか。","answer":"ア","kind":"choice","options":[{"key":"ア","text":"実験の記録をとる","correct":true,"reason":"「記録を書き記す」と言いかえられ、例文と同じ意味。"},{"key":"イ","text":"三日間の休みをとる","correct":false,"reason":"「休みを得る」の意味で、書き記すことではない。"},{"key":"ウ","text":"部屋に入って帽子をとる","correct":false,"reason":"「帽子を脱ぐ・はずす」の意味で、書き記すことではない。"}],"steps":[{"title":"例文の「とる」を、別の言葉に言いかえる","formula":"会議のメモをとる\n→ 会議のメモを書き記す","body":"言いかえても、例文の意味は変わりません。この「とる」は「書き記す」という意味です。"},{"title":"同じ言いかえを、三つの文に入れる","formula":"ア：実験の記録を書き記す（意味が通る）\nイ：三日間の休みを書き記す（意味が変わる）\nウ：部屋に入って帽子を書き記す（意味が通らない）","body":"例文と同じ言いかえができるのは、アだけです。"},{"title":"イとウの「とる」を、それぞれ言いかえる","formula":"イ：休みをとる → 休みを得る\nウ：帽子をとる → 帽子を脱ぐ・はずす","body":"イは「得る」、ウは「脱ぐ・はずす」で、例文の「書き記す」とは別の意味です。"}]},{"label":"助詞「で」のはたらきを見分ける","question":"「台風で電車が止まる」の「で」と同じはたらきで使われているのは、次のうちどれでしょうか。","answer":"ウ","kind":"choice","options":[{"key":"ア","text":"公園で遊ぶ","correct":false,"reason":"「公園において」と言いかえられ、動作をする場所を表す。"},{"key":"イ","text":"鉛筆で書く","correct":false,"reason":"「鉛筆を使って」と言いかえられ、手段（動作に使う道具）を表す。"},{"key":"ウ","text":"風邪で学校を休む","correct":true,"reason":"「風邪が原因で」と言いかえられ、例文と同じく原因を表す。"}],"steps":[{"title":"例文の「で」を、別の言葉に言いかえる","formula":"台風で電車が止まる\n→ 台風が原因で電車が止まる\nはたらき：原因","body":"台風は、電車が止まった原因です。「〜が原因で」と言いかえられます。"},{"title":"同じ言いかえを、三つの文に入れる","formula":"ア：公園が原因で遊ぶ（意味が変わる）\nイ：鉛筆が原因で書く（意味が変わる）\nウ：風邪が原因で学校を休む（意味が通る）","body":"原因を表す言いかえが、もとの文の意味のまま成り立つのは、ウだけです。"},{"title":"アとイの「で」を、それぞれ言いかえる","formula":"ア：公園で遊ぶ → 公園において遊ぶ（場所）\nイ：鉛筆で書く → 鉛筆を使って書く（手段）","body":"アは動作をする場所、イは動作に使う道具を表しています。原因ではありません。"}]},{"label":"助動詞「れる・られる」の意味を見分ける","question":"「私は先生に名前を呼ばれる」の「れる」と同じ意味で「れる・られる」が使われているのは、次のうちどれでしょうか。","answer":"イ","kind":"choice","options":[{"key":"ア","text":"昔のことが思い出される","correct":false,"reason":"「自然に」を補える。自発の意味。"},{"key":"イ","text":"私は弟に日記を読まれる","correct":true,"reason":"「弟が私の日記を読む」と直せる。例文と同じ受け身の意味。"},{"key":"ウ","text":"弟はもう一人で服を着られる","correct":false,"reason":"「着ることができる」と直せる。可能の意味。"},{"key":"エ","text":"校長先生が話される","correct":false,"reason":"「お話しになる」と直せる。尊敬の意味。"}],"steps":[{"title":"「れる・られる」の四つの意味を確かめる","formula":"受け身：ほかから動作を受ける\n可能：〜することができる\n自発：自然にそうなる\n尊敬：動作をする人を高める","body":"「れる・られる」には四つの意味があります。どれに当たるかを、言いかえで見分けます。"},{"title":"例文の意味を見分ける","formula":"私は先生に名前を呼ばれる\n→ 先生が私の名前を呼ぶ、と直せる\n意味：受け身","body":"「先生に」と、動作をする人が示されています。その人を主語にした文に直せるので、受け身です。"},{"title":"四つの文を、それぞれ言いかえる","formula":"ア：昔のことが自然に思い出される、と言える（自発）\nイ：弟が私の日記を読む、と直せる（受け身）\nウ：弟はもう一人で服を着ることができる、と直せる（可能）\nエ：校長先生がお話しになる、と直せる（尊敬）","body":"アは「自然に」を補える、ウは「〜ことができる」に直せる、エは「お〜になる」に直せることから、それぞれ見分けます。"},{"title":"例文と同じ意味の文を選ぶ","formula":"例文：受け身\nイ：受け身","body":"イも「弟に」と動作をする人が示されていて、その人を主語にした文に直せます。答えはイです。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"言語分野と非言語分野の両方を扱う本です。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi-work":{"id":"spi-work","name":"仕事算","type":"learn","goal":"全体を1として、複数人での仕事にかかる日数を求められる。","part_of":"spi","tags":["sansu","num"],"status":"verified","concept":{"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義・性質と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"仕事算は、複数の人や機械が一つの仕事をするときに、かかる日数や時間を求める問題です。仕事の量が具体的な数で書かれていないので、仕事全体を1と置きます。すると、1人で8日かかる人は、1日に全体の1/8を進めると表せます。一緒に働くときは、それぞれの1日分を足して、全体の1をその和で割ります。","example":"1日にできる量 = 1 ÷ かかる日数\n一緒にしたときの1日分 = それぞれの1日分の和\nかかる日数 = 1 ÷ 1日分\n例　どちらも1人で8日かかる二人の1日分：1/8 + 1/8 = 1/4","note":"この二人が一緒にすると、1 ÷ (1/4) で4日かかります。"},"review":{"checked_at":"2026-10-07","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。使うのは分数の通分・加減・逆数をかけるわり算で、小数と分数に収まる。学習時間は、単元どうしの釣り合いと外部の目安（SPI対策全体で30〜60時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-fraction","level":"must"}],"assessment":{"question":"ある仕事を、Aが1人ですると6日、Bが1人ですると3日かかります。二人が一緒にすると、何日で終わるでしょうか。","options":["2日","3日","4.5日"],"answer":0,"explanation":"1日分は1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2。全体1を終えるには1 ÷ (1/2) = 2日。"},"practice":{"title":"全体を 1 として、仕事にかかる日数を求める","lead":"1日にできる量を、分数で表す。","original":true,"reviewed_at":"2026-10-06","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"問題文だけから独立に解いて正答を照合。全段階の式・説明・前提の範囲・表現と、確認問題を確認し、指摘を反映した後に再検証。","problems":[{"label":"二人で一緒に進める","question":"ある仕事を、Aが1人ですると12日、Bが1人ですると4日かかります。二人が一緒にすると、何日で終わるでしょうか。","answer":"3日","steps":[{"title":"仕事全体を 1 と置く","formula":"仕事全体：1\nAが1人でかかる日数：12日\nBが1人でかかる日数：4日","body":"仕事の量が数で書かれていないので、全体を1と置きます。こうすると、1日にできる量を分数で表せます。"},{"title":"それぞれが1日にできる量を求める","formula":"Aの1日分：1 ÷ 12 = 1/12\nBの1日分：1 ÷ 4 = 1/4","body":"全体1を、かかる日数で割ります。Aは1日に全体の1/12、Bは1日に全体の1/4を進めます。"},{"title":"二人が一緒にしたときの1日分を求める","formula":"1/12 + 1/4 = 1/12 + 3/12 = 4/12 = 1/3","body":"同じ日に二人とも働くので、1日分どうしを足します。分母を12にそろえて計算します。"},{"title":"全体を1日分で割って、日数を求める","formula":"1 ÷ (1/3) = 3","body":"1日に全体の1/3ずつ進むので、全体1が終わるまでに3日かかります。"},{"title":"3日で仕事がちょうど終わるか確かめる","formula":"Aの3日分：1/12 × 3 = 1/4\nBの3日分：1/4 × 3 = 3/4\n1/4 + 3/4 = 1","body":"二人の3日分を足すと全体の1になります。"}]},{"label":"途中から一人で進める","question":"ある仕事を、Aが1人ですると10日、Bが1人ですると15日かかります。はじめの4日間は二人で一緒に行い、残りをBが1人で行いました。Bは、あと何日かかったでしょうか。","answer":"あと5日","steps":[{"title":"仕事全体を 1 と置き、進め方を二つの期間に分ける","formula":"仕事全体：1\n期間1：二人で4日間\n期間2：残りをBが1人で","body":"途中で働く人数が変わるので、期間ごとに進んだ量を考えます。"},{"title":"それぞれが1日にできる量を求める","formula":"Aの1日分：1/10\nBの1日分：1/15","body":"全体1を、1人でかかる日数で割った量です。"},{"title":"二人が一緒にしたときの1日分を求める","formula":"1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6","body":"分母を30にそろえて足します。二人なら1日に全体の1/6が進みます。"},{"title":"はじめの4日間で進んだ量を求める","formula":"1/6 × 4 = 4/6 = 2/3","body":"1日分の1/6に、日数の4をかけます。"},{"title":"残っている仕事の量を求める","formula":"1 − 2/3 = 1/3","body":"全体1から、進んだ2/3を引きます。"},{"title":"残りをBの1日分で割って、日数を求める","formula":"(1/3) ÷ (1/15) = 1/3 × 15 = 5","body":"残りの1/3を、Bが1日に進める1/15ずつ片づけます。分数で割るときは、逆数をかけます。"},{"title":"全部を足して仕事が終わるか確かめる","formula":"二人の4日分：2/3\nBの5日分：1/15 × 5 = 1/3\n2/3 + 1/3 = 1","body":"二つの期間で進んだ量を足すと、全体の1になります。"}]},{"label":"一人でかかる日数をさかのぼる","question":"ある仕事を、AとBの二人が一緒にすると6日で終わります。同じ仕事をAが1人ですると9日かかります。Bが1人ですると、何日かかるでしょうか。","answer":"18日","steps":[{"title":"仕事全体を 1 と置く","formula":"仕事全体：1\n二人でかかる日数：6日\nAが1人でかかる日数：9日","body":"わかっているのは、二人の場合とAだけの場合です。ここからBだけの場合を求めます。"},{"title":"1日にできる量を、二人の場合とAだけの場合で求める","formula":"二人の1日分：1/6\nAの1日分：1/9","body":"どちらも、全体1をかかる日数で割った量です。"},{"title":"二人の1日分からAの1日分を引いて、Bの1日分を求める","formula":"1/6 − 1/9 = 3/18 − 2/18 = 1/18","body":"二人の1日分は、Aの1日分とBの1日分を足したものです。引くのは日数どうし（9 − 6）ではなく、1日分の量どうしです。"},{"title":"全体をBの1日分で割って、日数を求める","formula":"1 ÷ (1/18) = 18","body":"Bは1日に全体の1/18ずつ進めるので、1人では18日かかります。"},{"title":"Bが18日なら、二人で6日になるか確かめる","formula":"1/9 + 1/18 = 2/18 + 1/18 = 3/18 = 1/6","body":"二人の1日分が1/6になり、6日で終わるという条件に合います。"}]}]},"resources":[{"kind":"book","title":"SPI3をひとつひとつわかりやすく。2028年度版","publisher":"Gakken","url":"https://www.amazon.co.jp/dp/4058026162","errata_url":"https://hon.gakken.jp/info/n20260521EPR0000572","assumes":"四則計算・分数・割合。同じ本を複数の単元で使います。単元ごとに買い直す必要はありません。","checked_at":"2026-10-06"}]},"spi":{"id":"spi","name":"SPI","type":"target","goal":"SPIの言語と非言語の代表的な問題を学び、受検方式に合う問題集で演習を始める。","part_of":"spi","status":"draft","scope_note":"SPIの能力検査の、言語と非言語をまとめた到達点です。SPIでは言語と非言語の両方が出るので、二つの到達点をどちらも前提にしています。英語、構造的把握力、性格検査は未収録です。出題される分野と形式は受検方式によって異なるので、企業の受検案内で方式を確かめてください。線はこの経路での学習順序を表し、公式の必須条件ではありません。","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"受検方式、言語・非言語の分野、測る力の説明を、公式サイト・出版社の資料・就職情報サイトの記述と照合し、具体例の分野の一覧を前提の線と照合。指摘を反映した。","text":"SPIは、企業の採用選考で使われている適性検査で、能力検査と性格検査からなります。能力検査は、言葉の意味や話の要旨を捉える言語と、数を使った処理と論理的な思考を測る非言語に分かれます。受検方式には、テストセンター（リアル会場かオンライン会場）、インハウスCBT（応募企業などの会場）、WEBテスティング（自宅や学校など）、ペーパーテスティング（マークシート）があり、出版社の資料によると、SPIの種類と実施方法によって出題項目が異なります。選考でSPIを課されたら、両方を準備します。"},"cost":{"hours":0,"yen":0},"requires":[{"id":"spi-nonverbal","level":"must"},{"id":"spi-verbal","level":"must"}],"sources":[{"title":"SPI公式サイト（検査の概要）","url":"https://www.spi.recruit.co.jp/","checked_at":"2026-10-16"},{"title":"SPI公式サイト：テストセンター・インハウスCBT・WEBテスティングの違い","url":"https://www.spi.recruit.co.jp/spi3news/000203.html","checked_at":"2026-10-16"},{"title":"実務教育出版：SPIの基礎知識（言語と非言語の出題範囲、方式別に出題が異なる）","url":"https://www.jitsumu.co.jp/assets/pdf/kyouzai/university/spi-knowledge.pdf","checked_at":"2026-10-16"},{"title":"リクナビ就活準備ガイド：SPIの練習問題（言語と非言語が測る内容）","url":"https://job.rikunabi.com/contents/test/22304/","checked_at":"2026-10-16"}]},"tama-blank-table":{"id":"tama-blank-table","name":"表の空欄推測","type":"learn","goal":"表の埋まっている行から数どうしの関係を見つけ、空欄に入る数を求められる。","part_of":"tamatebako","tags":["sansu","func"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例の式を一行ずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"表の空欄推測は、表の一部が空欄になっていて、ほかの行から規則を見つけて空欄の数を求める問題です。玉手箱の計数の形式の一つです。規則は問題文に書かれていないので、埋まっている行どうしを比べて自分で見つけます。よく出る関係は、ある数がもう一つの数に比例するもの、決まった額に量に比例する額が足されるもの、いくつかの欄をかけ合わせると別の欄になるものです。見つけた規則は、埋まっている行のすべてで成り立つかを確かめてから、空欄に使います。","example":"比例：一方を何倍かすると、もう一方も同じ倍になる。二つの数の比が、どの行でも同じ\n決まった額 + 比例する額：量が1増えるごとに、同じだけ増える。量が0でも残る額がある\nかけ合わせ：たとえば、人数 × 1人あたりの額 = 合計の額","note":"規則を一つの行だけで決めると、別の規則でもその行が成り立つことがあります。二つ以上の行で確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。比例は比例と反比例、百分率は割合と比に収まる。決まった額と比例する額の和（一次の関係）は、この単元で差から求める手順を説明しているので、一次関数は関連にとどめた。表の読み取りは重なりが小さく、あると楽から外した。分野のタグは、量どうしの関係を見つける内容なので関数にした。学習時間は、単元どうしの釣り合いと外部の目安との比較だけで、実測ではない。"},"cost":{"hours":6,"yen":0},"requires":[{"id":"math-proportion","level":"must"},{"id":"math-linear-fn","level":"related"}],"assessment":{"question":"ある品物を3個買うと450円、5個買うと750円だった。同じ買い方で8個買うと何円？","options":["1,200円","6,000円","3,600円"],"answer":0,"explanation":"450 ÷ 3 = 150、750 ÷ 5 = 150 で、1個150円の比例とわかる。8個なら150 × 8 = 1,200円。6,000円は5個の値段750円を1個の値段と取り違えた数、3,600円は3個の値段450円を1個の値段と取り違えた数。"},"practice":{"title":"埋まっている行から規則を見つけ、空欄を埋める","lead":"規則は一つの行で決めず、二つ以上の行で確かめる。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の選択肢・別の計算を実際に試して確認。選択肢ごとの理由、別解の理由、全段階の説明、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","problems":[{"label":"比例の関係を見つける","question":"表1は、ある印刷所でチラシを刷ったときの部数と料金です。500部のときの料金は何円でしょうか。","answer":"8,500円","tables":[{"caption":"表1　チラシの部数と料金","rows":[["部数（部）","料金（円）"],["200","3,400"],["350","5,950"],["500","？"]]}],"steps":[{"title":"1部あたりの料金を、行ごとに求める","formula":"3,400 ÷ 200 = 17\n5,950 ÷ 350 = 17","body":"二つの行で、1部あたりの料金がどちらも17円です。"},{"title":"規則を言葉にする","formula":"料金 = 17 × 部数","body":"1部あたりが同じなので、料金は部数に比例しています。"},{"title":"規則を空欄の行に当てはめる","formula":"17 × 500 = 8,500","body":"500部の料金は8,500円です。"}],"alternatives":[{"try":"3,400 + 5,950 = 9,350","why_not":"200部と350部の料金を足すと、550部の料金になります。500部の料金ではありません。"}]},{"label":"決まった額がある関係を見つける","question":"表2は、ある貸し会議室の利用時間と料金です。8時間使ったときの料金は何円でしょうか。","answer":"19,000円","tables":[{"caption":"表2　会議室の利用時間と料金","rows":[["利用時間（時間）","料金（円）"],["2","7,000"],["5","13,000"],["8","？"]]}],"steps":[{"title":"まず比例かどうかを確かめる","formula":"7,000 ÷ 2 = 3,500\n13,000 ÷ 5 = 2,600","body":"1時間あたりの料金が行によって違うので、料金は利用時間に比例していません。"},{"title":"時間が増えた分と、料金が増えた分を比べる","formula":"5 − 2 = 3\n13,000 − 7,000 = 6,000\n6,000 ÷ 3 = 2,000","body":"3時間増えると6,000円増えるので、1時間増えるごとに2,000円増えます。"},{"title":"時間によらない、決まった額を求める","formula":"7,000 − 2,000 × 2 = 3,000","body":"2時間の料金7,000円のうち、時間に比例する分は4,000円です。残りの3,000円は、時間によらない決まった額です。"},{"title":"規則がもう一つの行でも成り立つか確かめる","formula":"料金 = 3,000 + 2,000 × 利用時間\n3,000 + 2,000 × 5 = 13,000","body":"5時間の行も、表のとおり13,000円になります。"},{"title":"規則を空欄の行に当てはめる","formula":"3,000 + 2,000 × 8 = 19,000","body":"8時間の料金は19,000円です。"}],"alternatives":[{"try":"13,000 ÷ 5 × 8 = 20,800","why_not":"料金が時間に比例するとみなしています。この規則だと2時間は5,200円になり、表の7,000円と合いません。"},{"try":"7,000 ÷ 2 × 8 = 28,000","why_not":"これも比例とみなしています。この規則だと5時間は17,500円になり、表の13,000円と合いません。"}]},{"label":"欄をかけ合わせる関係を見つける","question":"表3は、三つの店のある日の記録です。売上は、来店者数、購入率、1人あたりの購入額から決まっています。R店の購入率は何%でしょうか。","answer":"24%","tables":[{"caption":"表3　店ごとの来店者数と売上（ある日）","rows":[["店","来店者数（人）","購入率（%）","1人あたりの購入額（円）","売上（万円）"],["P店","1,200","40","2,500","120"],["Q店","800","45","3,000","108"],["R店","1,600","？","2,500","96"]]}],"steps":[{"title":"欄どうしの関係を予想する","formula":"来店者数 × 購入率 = 買った人の数\n買った人の数 × 1人あたりの購入額 = 売上","body":"購入率は、来店者のうち買った人の割合です。1人あたりの購入額は、買った人1人が使った額と読めます。"},{"title":"予想した関係を、P店で確かめる","formula":"1,200 × 0.4 × 2,500 = 1,200,000\n1,200,000円 = 120万円","body":"表の売上120万円と合います。"},{"title":"Q店でも確かめる","formula":"800 × 0.45 × 3,000 = 1,080,000\n1,080,000円 = 108万円","body":"Q店も表のとおりです。二つの行で成り立つので、この関係を使います。"},{"title":"R店で、わかっている欄をかけ合わせる","formula":"1,600 × 2,500 = 4,000,000","body":"来店者数と1人あたりの購入額をかけた数に、購入率をかけると売上になります。"},{"title":"売上を割って、購入率を求める","formula":"96万円 = 960,000円\n960,000 ÷ 4,000,000 = 0.24","body":"0.24は24%です。R店の購入率は24%です。"}],"alternatives":[{"try":"96 ÷ 120 × 40 = 32","why_not":"P店とR店の売上の比だけで、購入率を求めています。来店者数がP店と違うので、売上の比は購入率の比になりません。購入率32%なら、R店の売上は128万円になります。"}]}]}},"tama-charts":{"id":"tama-charts","name":"図表の読み取り","type":"learn","goal":"表やグラフの数から、実際の数、増減の割合、二つの量の割合を求め、選択肢から最も近い値を選べる。","part_of":"tamatebako","tags":["sansu","data"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・練習問題・前提の範囲と照合。指摘を反映した後に再検証。","text":"図表の読み取りは、表やグラフから必要な数を拾って計算し、選択肢から答えを選ぶ問題です。玉手箱の計数の形式の一つです。表の数は、実際の数ではなく、指数や構成比で示されていることがよくあります。指数は、基準にした年などを100として、ほかの値がその何倍かを100倍して表した数です。構成比は、全体を100%としたときの各部分の割合です。どちらも、実際の数に直すには、基準の数や全体の数にかけます。選択肢の値が十分に離れているときは、細かい計算をせず、数を丸めた概算で選べます。","example":"実際の数 = 基準の数 × 指数 ÷ 100\n部分の数 = 全体の数 × 構成比（%） ÷ 100\n指数どうしの増減の割合 = (後の指数 − 前の指数) ÷ 前の指数\n例　基準の年を100として、ある年が130なら、その年は基準の年の1.3倍","note":"グラフで出る問題も、読み取った数で同じ計算をします。この単元の練習のグラフは、棒グラフ、折れ線グラフ、円グラフ、帯グラフで、どれも値を書き添えてあります。円グラフと帯グラフの値は構成比なので、実際の数は全体の数にかけて求めます。帯グラフで年ごとに全体の数が違うときは、構成比の大小と実際の数の大小が一致しないことがあります。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている計算と知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。増減の割合と、基準の数 × 割合は表の読み取りに収まる。指数、構成比、概算はこの単元で説明している。表の読み取りと重なる分を除き、新しく足すのは指数・構成比・概算の三つなので、学習時間を6時間から5時間に下げた。学習時間は、単元どうしの釣り合いと外部の目安（玉手箱の対策全体で30〜50時間とする就職情報サイトの記述）との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"spi-tables","level":"must"}],"assessment":{"question":"2020年の売上を100とした指数で、2023年は130だった。2020年の売上が200万円なら、2023年の売上は？","options":["260万円","330万円","130万円"],"answer":0,"explanation":"指数130は、基準の2020年の1.3倍という意味。200 × 1.3 = 260で260万円。330万円は200に130を足した数、130万円は指数をそのまま金額と読んだ数。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文と図表だけから独立に解いて正答を照合し、正答が一つに決まるかを別の答え・別の読み方を実際に試して確認。選択肢・別解ごとの理由、全段階の計算、前提の範囲、説明・確認問題との整合を確認し、指摘を反映した後に再検証。","title":"表とグラフから、実際の数と割合を求める","lead":"表やグラフの数が実際の数か、指数か、構成比かを、見出しで先に確かめる。","original":true,"problems":[{"label":"指数から実際の数に直す","question":"表1で、2022年の販売量は3,400トンでした。2024年の販売量は何トンでしょうか。","answer":"3,128トン","tables":[{"caption":"表1　ある商品の販売量の指数（2022年 = 100）","rows":[["年","2022年","2023年","2024年"],["指数","100","115","92"]]}],"steps":[{"title":"表の数が何を表すかを確かめる","formula":"表の数：2022年を100とした指数\n基準の数：2022年の販売量 3,400トン","body":"見出しに「2022年 = 100」とあるので、表の数は販売量そのものではありません。2022年の何倍かを100倍した数です。"},{"title":"2024年の指数を、基準の何倍かに直す","formula":"92 ÷ 100 = 0.92","body":"指数92は、2022年の0.92倍という意味です。"},{"title":"基準の数にかけて、実際の数を求める","formula":"3,400 × 0.92 = 3,128","body":"2022年の販売量3,400トンの0.92倍が、2024年の販売量です。"}],"alternatives":[{"try":"3,400 − 8 = 3,392","why_not":"指数の差の8を、トンの差として引いています。指数の8は、基準の3,400トンの8%に当たる272トンです。"}]},{"label":"指数どうしで増減の割合を求める","question":"表1で、2024年の販売量は、2023年に比べてどうなったでしょうか。次のうちから選びましょう。","answer":"B","kind":"choice","tables":[{"caption":"表1　ある商品の販売量の指数（2022年 = 100）","rows":[["年","2022年","2023年","2024年"],["指数","100","115","92"]]}],"options":[{"key":"A","text":"8%減った","correct":false,"reason":"2022年の100と2024年の92を比べた割合です。問われているのは、2023年との比べです。"},{"key":"B","text":"20%減った","correct":true,"reason":"減った分の23を、比べるもとの2023年の115で割ると0.2で、20%です。"},{"key":"C","text":"23%減った","correct":false,"reason":"指数の差の23を、そのまま%と読んでいます。指数の差が%になるのは、比べるもとが100のときだけです。"},{"key":"D","text":"25%減った","correct":false,"reason":"23を、後の年の92で割った割合です。増減の割合は、前の年の数で割ります。"},{"key":"E","text":"実際の販売量がないので、求められない","correct":false,"reason":"指数は、どの年も同じ基準の何倍かを表しているので、指数どうしの比は、実際の販売量の比と同じです。増減の割合は指数だけで求められます。"}],"steps":[{"title":"比べるもとと、比べる年を決める","formula":"比べるもと：2023年（指数115）\n比べる年：2024年（指数92）","body":"「2023年に比べて」とあるので、基準の2022年ではなく、2023年がもとになります。"},{"title":"指数の差を求める","formula":"92 − 115 = −23","body":"2024年は2023年より、指数で23小さくなっています。"},{"title":"差を、比べるもとの指数で割る","formula":"23 ÷ 115 = 0.2","body":"減った分を、もとの2023年の115で割ります。0.2は20%なので、20%減りました。"},{"title":"実際の数でも同じになるか確かめる","formula":"2023年：3,400 × 1.15 = 3,910\n2024年：3,400 × 0.92 = 3,128\n3,910 − 3,128 = 782\n782 ÷ 3,910 = 0.2","body":"前の問題の基準3,400トンを使って実際の数に直しても、20%減になります。指数どうしで計算してよいことがわかります。"}]},{"label":"構成比から、概算で選ぶ","question":"表2で、2024年度の西日本の売上は、およそ何万円でしょうか。次のうち最も近いものを選びましょう。","answer":"C","kind":"choice","tables":[{"caption":"表2　地域別の売上の構成比（2024年度。売上の合計は4,870万円）","rows":[["地域","構成比（%）"],["東日本","38.2"],["中日本","24.6"],["西日本","29.1"],["その他","8.1"]]}],"options":[{"key":"A","text":"約390万円","correct":false,"reason":"その他の8.1%を使った値です（4,870 × 0.081 は約394）。"},{"key":"B","text":"約1,200万円","correct":false,"reason":"中日本の24.6%を使った値です（4,870 × 0.246 は約1,198）。"},{"key":"C","text":"約1,420万円","correct":true,"reason":"4,870 × 0.291 は約1,417で、最も近い値です。"},{"key":"D","text":"約1,860万円","correct":false,"reason":"東日本の38.2%を使った値です（4,870 × 0.382 は約1,860）。"},{"key":"E","text":"約3,450万円","correct":false,"reason":"合計から西日本の約1,417万円を引いた、西日本以外の売上です。"}],"steps":[{"title":"表の数が何を表すかを確かめる","formula":"表の数：合計を100%とした構成比\n全体の数：売上の合計 4,870万円","body":"表の数は、売上そのものではなく割合です。実際の売上は、合計に構成比をかけて求めます。"},{"title":"数を丸めて、おおよその値を出す","formula":"4,870 → 約4,900\n29.1% → 約30%\n4,900 × 0.3 = 1,470","body":"選択肢は数百万円ずつ離れているので、丸めた数で見当をつけます。二つとも少し大きめに丸めたので、本当の値は1,470より少し小さくなります。"},{"title":"見当に近い選択肢をしぼる","formula":"1,470より少し小さい\n近い選択肢：約1,420万円（C）\n次に近い選択肢：約1,200万円（B）、約1,860万円（D）","body":"見当の1,470に近いのはCです。BとDは200万円以上離れていて、丸めのずれでは説明できません。"},{"title":"必要なら、丸めずに計算して確かめる","formula":"4,870 × 0.291 = 1,417.17","body":"約1,417万円で、Cの約1,420万円が最も近い値です。"}]},{"label":"棒グラフから、増加率がいちばん大きい年を選ぶ","question":"図1で、来場者数の前年からの増加率がいちばん大きいのは何年でしょうか。","answer":"A","kind":"choice","figures":[{"kind":"bar","caption":"図1　ある観光施設の来場者数","unit":"万人","alt":"棒グラフ。来場者数は、2020年32万人、2021年41万人、2022年48万人、2023年54万人、2024年63万人。","x":["2020年","2021年","2022年","2023年","2024年"],"series":[{"name":"来場者数","values":[32,41,48,54,63]}]}],"options":[{"key":"A","text":"2021年","correct":true,"reason":"増加は9万人で、前年の32万人で割ると約28%です。ほかの年は20%に届きません。"},{"key":"B","text":"2022年","correct":false,"reason":"増加は7万人で、前年の41万人で割ると約17%です。"},{"key":"C","text":"2023年","correct":false,"reason":"増加は6万人で、前年の48万人で割ると12.5%です。"},{"key":"D","text":"2024年","correct":false,"reason":"増加は2021年と同じ9万人ですが、前年の54万人で割ると約17%です。前年の数が大きいので、増加率は2021年より小さくなります。"},{"key":"E","text":"2021年と2024年が同じ","correct":false,"reason":"同じなのは増加の人数（9万人）です。増加率は、前年の数で割るので同じになりません。"}],"steps":[{"title":"グラフから、年ごとの値を読み取る","formula":"2020年：32\n2021年：41\n2022年：48\n2023年：54\n2024年：63","body":"棒の上に書かれた値を読みます。単位は万人です。"},{"title":"前年からの増加を、人数で出す","formula":"2021年：41 − 32 = 9\n2022年：48 − 41 = 7\n2023年：54 − 48 = 6\n2024年：63 − 54 = 9","body":"増加の人数では、2021年と2024年が9万人で並びます。人数だけでは決まりません。"},{"title":"増加を前年の値で割って、増加率にする","formula":"2021年：9 ÷ 32 = 0.28125\n2022年：7 ÷ 41 ≒ 0.171\n2023年：6 ÷ 48 = 0.125\n2024年：9 ÷ 54 ≒ 0.167","body":"増加率は、増加を前年の値で割ります。同じ9万人でも、前年が小さい2021年のほうが増加率は大きくなります。"},{"title":"概算でしぼる見方も確かめる","formula":"2021年：9は32の4分の1（8）より大きい\nほかの年：増加は前年の5分の1より小さい","body":"2021年だけが25%を超え、ほかの年は20%に届きません。細かく割らなくても、2021年がいちばん大きいとわかります。"}]},{"label":"折れ線グラフから、二つの系列を比べる","question":"図2で、2024年のB社の売上高は、同じ年のA社の売上高のおよそ何%でしょうか。次のうち最も近いものを選びましょう。","answer":"D","kind":"choice","figures":[{"kind":"line","caption":"図2　A社とB社の売上高","unit":"億円","alt":"折れ線グラフ。A社の売上高は、2021年120億円、2022年132億円、2023年150億円、2024年162億円。B社の売上高は、2021年80億円、2022年96億円、2023年110億円、2024年135億円。","x":["2021年","2022年","2023年","2024年"],"series":[{"name":"A社","values":[120,132,150,162]},{"name":"B社","values":[80,96,110,135]}]}],"options":[{"key":"A","text":"約17%","correct":false,"reason":"二社の差27億円を、A社の162億円で割った割合です。B社がA社の何%かではありません。"},{"key":"B","text":"約67%","correct":false,"reason":"2021年の値（80 ÷ 120）です。問われているのは2024年です。"},{"key":"C","text":"約73%","correct":false,"reason":"2023年の値（110 ÷ 150）です。問われているのは2024年です。"},{"key":"D","text":"約83%","correct":true,"reason":"135 ÷ 162 は約0.833で、約83%です。"},{"key":"E","text":"約120%","correct":false,"reason":"A社をB社で割った値（162 ÷ 135 = 1.2）です。「A社の何%」なので、A社で割ります。"}],"steps":[{"title":"比べる年と、基準になる系列を決める","formula":"年：2024年\n比べる量：B社 135億円\n基準（100%）：A社 162億円","body":"「A社の売上高の何%」なので、A社が基準です。凡例で、どちらの線がA社かを先に確かめます。"},{"title":"基準で割る","formula":"135 ÷ 162 ≒ 0.833","body":"0.833は約83%です。"},{"title":"かけ算で確かめる","formula":"162 × 0.8 = 129.6\n162 × 0.85 = 137.7","body":"135億円は、A社の80%（129.6億円）と85%（137.7億円）のあいだにあり、Dの約83%と合います。"}]},{"label":"円グラフから、二つの区分の差を人数で求める","question":"図3で、製造部門の従業員数は、開発部門の従業員数より何人多いでしょうか。次のうち最も近いものを選びましょう。","answer":"B","kind":"choice","figures":[{"kind":"pie","caption":"図3　ある会社の部門別の従業員数の構成比（2024年。従業員の合計は2,360人）","unit":"%","alt":"円グラフ。2024年の部門別の従業員数の構成比は、営業31.5%、製造28%、開発17.5%、管理12%、その他11%。従業員の合計は2,360人。","x":["営業","製造","開発","管理","その他"],"series":[{"name":"2024年","values":[31.5,28.0,17.5,12.0,11.0]}]}],"options":[{"key":"A","text":"約11人","correct":false,"reason":"構成比の差の10.5を、そのまま人数と読んでいます。10.5は%の差なので、合計の2,360人にかけて人数に直します。"},{"key":"B","text":"約248人","correct":true,"reason":"構成比の差は10.5%で、2,360 × 0.105 は247.8なので、約248人です。"},{"key":"C","text":"約378人","correct":false,"reason":"製造（28%）と管理（12%）の差の16%を使った値です（2,360 × 0.16 は377.6）。比べる相手は開発です。"},{"key":"D","text":"約413人","correct":false,"reason":"開発部門の人数そのもの（2,360 × 0.175 は413）です。問われているのは製造との差です。"},{"key":"E","text":"約661人","correct":false,"reason":"製造部門の人数そのもの（2,360 × 0.28 は660.8）です。開発部門の人数を引いていません。"}],"steps":[{"title":"グラフの数が何を表すかを確かめる","formula":"グラフの数：従業員の合計を100%とした構成比\n全体の数：従業員の合計 2,360人","body":"円グラフの値は人数ではなく割合です。人数は、見出しにある合計の2,360人にかけて求めます。"},{"title":"比べる二つの区分の構成比を読み取る","formula":"製造：28%\n開発：17.5%","body":"凡例で区分の名前と色を確かめてから、扇の外に書かれた値を読みます。"},{"title":"構成比の差を求める","formula":"28 − 17.5 = 10.5","body":"どちらも同じ合計2,360人の割合なので、先に割合どうしで引いてから人数に直せます。それぞれ人数に直してから引くより、計算が一度で済みます。"},{"title":"差の割合を、合計にかけて人数に直す","formula":"10.5 ÷ 100 = 0.105\n2,360 × 0.105 = 247.8","body":"差は約248人で、Bです。"},{"title":"人数に直してから引いても同じになるか確かめる","formula":"製造：2,360 × 0.28 = 660.8\n開発：2,360 × 0.175 = 413\n660.8 − 413 = 247.8","body":"人数どうしで引いても247.8人です。DとEは、この途中の人数のどちらか一方を答えにしたものです。"}],"alternatives":[{"try":"28 ÷ 17.5 = 1.6","why_not":"製造が開発の何倍かを出しています。問われているのは人数の差なので、構成比どうしを割らずに引き、その差を合計の2,360人にかけて人数に直します。"}]},{"label":"帯グラフと合計から、実際の数の増加率を求める","question":"図4と表3で、1人世帯の数は、2014年から2024年にかけておよそ何%増えたでしょうか。次のうち最も近いものを選びましょう。","answer":"E","kind":"choice","figures":[{"kind":"band","caption":"図4　ある市の世帯の人数別の構成比","unit":"%","alt":"帯グラフ。世帯の人数別の構成比。2014年は、1人28%、2人30%、3人20%、4人以上22%。2024年は、1人35%、2人31%、3人18%、4人以上16%。","x":["1人","2人","3人","4人以上"],"series":[{"name":"2014年","values":[28,30,20,22]},{"name":"2024年","values":[35,31,18,16]}]}],"tables":[{"caption":"表3　ある市の世帯の総数","rows":[["年","2014年","2024年"],["世帯の総数（世帯）","52,000","60,000"]]}],"options":[{"key":"A","text":"約7%","correct":false,"reason":"構成比の差（35 − 28 = 7）を、そのまま増加率と読んでいます。構成比の差は割合の差で、世帯の数が何%増えたかではありません。"},{"key":"B","text":"約15%","correct":false,"reason":"世帯の総数の増加率（60,000 ÷ 52,000 は約1.15）です。1人世帯の構成比も増えているので、1人世帯の増加率はこれより大きくなります。"},{"key":"C","text":"約25%","correct":false,"reason":"構成比どうしの比（35 ÷ 28 = 1.25）です。二つの年で世帯の総数が違うので、構成比の比は実際の数の比になりません。"},{"key":"D","text":"約31%","correct":false,"reason":"増えた6,440世帯を、後の2024年の21,000世帯で割った割合です。増加率は、前の2014年の数で割ります。"},{"key":"E","text":"約44%","correct":true,"reason":"1人世帯は14,560世帯から21,000世帯に6,440世帯増え、6,440 ÷ 14,560 は約0.442で、約44%です。"}],"steps":[{"title":"グラフと表の数が何を表すかを確かめる","formula":"図4の数：その年の世帯の総数を100%とした構成比\n表3の数：世帯の総数（実際の数）","body":"帯グラフは年ごとに全体を100%にしています。帯の中の値は、それぞれの年の総数に対する割合で、もとにする総数は年ごとに違います。実際の数は、その年の総数にかけて求めます。"},{"title":"1人世帯の構成比と、その年の総数を読み取る","formula":"2014年：1人世帯 28%、総数 52,000世帯\n2024年：1人世帯 35%、総数 60,000世帯","body":"凡例で「1人」の色を確かめ、各年の帯のいちばん左の区分の値を読みます。"},{"title":"それぞれの年の1人世帯の数を求める","formula":"2014年：52,000 × 0.28 = 14,560\n2024年：60,000 × 0.35 = 21,000","body":"構成比を小数に直し、その年の総数にかけます。"},{"title":"増えた数を求める","formula":"21,000 − 14,560 = 6,440","body":"1人世帯は6,440世帯増えました。"},{"title":"増えた数を、前の年の数で割る","formula":"6,440 ÷ 14,560 ≒ 0.442","body":"増加率は、比べるもとの2014年の14,560世帯で割ります。約44%増えたので、Eです。"},{"title":"倍率をかけ合わせる見方で確かめる","formula":"総数の倍率：60,000 ÷ 52,000 ≒ 1.154\n構成比の倍率：35 ÷ 28 = 1.25\n1.154 × 1.25 ≒ 1.442","body":"実際の数は総数 × 構成比なので、実際の数の倍率は、総数の倍率と構成比の倍率の積になります。約1.44倍で、約44%増と合います。BとCは、このどちらか一方の倍率だけを見たものです。"}],"alternatives":[{"try":"35 − 28 = 7","why_not":"構成比の差は「全体に占める割合が7ポイント上がった」ことを表すだけで、1人世帯の数が何%増えたかではありません。数の増加率を出すには、各年の総数にかけて実際の数に直します。"},{"try":"3人世帯は構成比が20%から18%に下がったので、数も減った","why_not":"2014年は52,000 × 0.20 = 10,400世帯、2024年は60,000 × 0.18 = 10,800世帯で、数は増えています。総数が増えているので、構成比が下がっても数が増えることがあります。"}]}]}},"tama-eng-logic":{"id":"tama-eng-logic","name":"英文の論理的読解","type":"learn","goal":"英文の本文を読み、英語の設問の文が本文から明らかに正しいか、明らかに誤りか、本文だけでは判断できないかを判定できる。","part_of":"tamatebako","tags":["eigo","reading"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を就職情報サイトの記述と照合し、具体例が練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"英文の論理的読解は、玉手箱の英語の形式の一つで、言語の論理的読解（GAB形式）を英文にしたものです。就職情報サイトでは、8つの長文に3問ずつ、24問を10分とされ、一つの長文とその3問に使えるのは1分あまりです。設問の文も英語で、三つから選びます。A（TRUE）は、本文から明らかに正しいか、論理的に導けるもの。B（UNTRUE）は、本文から明らかに誤っているか、反対のことが導けるもの。C（CANNOT SAY）は、本文だけでは正しいか誤っているか判断できないものです。判定の決まりは日本語の論理的読解と同じで、根拠は本文だけです。英文では、数や範囲を表す語に注意します。本文が some（一部の）と言っているのに設問が all や every と言いきっていたり、本文が no more than two（2つまで）なのに設問が four と言っていたりすれば、設問は本文より範囲を広げています。also、only、not、no longer のような短い語でも、文の意味は大きく変わります。","example":"本文：The shop opens at 10 a.m. on weekdays.（その店は平日、午前10時に開く。）\n設問「On weekdays, the shop is not open at 9 a.m.」→ A（10時に開くので、9時には開いていない）\n設問「The shop opens at 8 a.m. every weekday.」→ B（10時に開くことと両立しない）\n設問「The shop opens at 10 a.m. on Saturdays.」→ C（土曜日は平日ではなく、本文は何も述べていない）","note":"設問を読んだら、本文で同じ語や言いかえを探し、その文だけを丁寧に読むと時間が足ります。数や範囲の語が本文と設問で違っていないかを、最後に確かめます。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件（と、範囲の断りに書いた高校までの単語と文法）に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。学習時間は国語の同じ形式の単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"eng-reading","level":"must"},{"id":"tama-logic","level":"helps"}],"sources":[{"title":"ONE CAREER：玉手箱の英語（論理的読解はGAB形式の英語版で、8長文×3問の24問を10分、A・B・C の三択）","url":"https://www.onecareer.jp/articles/830","checked_at":"2026-10-16"},{"title":"就活の教科書：玉手箱の英語の対策（GAB形式とIMAGES形式、問題数と制限時間、選択肢の数）","url":"https://reashu.com/tamatebako-eigo-taisaku/","checked_at":"2026-10-16"},{"title":"CREX：玉手箱の対策（英語の2形式、それぞれ24問を10分）","url":"https://crexgroup.com/ja/shukatsu/test/web-test-tamatebako-preparation/","checked_at":"2026-10-16"}],"assessment":{"question":"本文「All visitors must show a ticket at the entrance.」設問「Children do not need a ticket to enter.」の判定は？（A：TRUE／B：UNTRUE／C：CANNOT SAY）","options":["A","B","C"],"answer":1,"explanation":"本文は「すべての来場者は入口で券を見せなければならない（All visitors must show a ticket）」と言っている。子どもも来場者なので、子どもも券を見せる必要がある。設問の「子どもは券がなくても入れる」はこれと両立しないので B。A（TRUE）は、本文と反対のことを正しいとしている。C（CANNOT SAY）ではない。All visitors（すべての来場者）に子どもも含まれるので、本文から判断できる。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。本文と問題文だけから独立に解いて正答を照合し、TRUE／UNTRUE／CANNOT SAY の境目や5択のほかの選択肢を実際に試して正答が一つに決まるかを確認。英文の文法、和訳、選択肢ごとの理由、全段階の説明、試験の形（就職情報サイトの記述）との適合を確認し、指摘を反映した後に再検証。","title":"英文の本文だけを根拠に、A・B・C を判定する","lead":"設問の英語の語を本文から探し、その文を訳して比べる。数や範囲の語の違いに印を付ける。","original":true,"passage":"Remote work has changed how some companies use their offices. At Kestrel Design, a firm of about 200 employees, staff have been allowed to work from home up to three days a week since 2022. As a result, on a typical day fewer than half of the desks in the office are in use. Last year the company decided not to renew the lease on one of its two floors, which reduced its rent by about a third. The remaining floor was redesigned with more meeting rooms and fewer individual desks, because employees now come to the office mainly to work with colleagues rather than to work alone. Some managers worried that new employees would find it harder to learn from experienced staff. To address this concern, the company asks new employees to come to the office four days a week during their first three months.","problems":[{"label":"数や範囲の語の違いを見分ける","question":"設問「Employees at Kestrel Design are allowed to work from home five days a week.」は、A・B・C のどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"TRUE：本文から明らかに正しい、または論理的に導ける","correct":false,"reason":"本文で認められているのは、在宅勤務を週に最大3日（up to three days a week）までです。5日は認められていません。"},{"key":"B","text":"UNTRUE：本文から明らかに誤り、または反対のことが導ける","correct":true,"reason":"本文の「staff have been allowed to work from home up to three days a week（社員は週に最大3日まで在宅勤務を認められている）」と両立しません。最大3日なら、5日は認められていません。"},{"key":"C","text":"CANNOT SAY：本文だけでは判断できない","correct":false,"reason":"在宅勤務が週に何日まで認められているかは、本文がはっきり述べています。判断の根拠があるので C ではありません。"}],"steps":[{"title":"設問を訳し、言いきっている部分をつかむ","formula":"Employees at Kestrel Design are allowed to work from home five days a week.\nKestrel Design の社員は、週に5日、在宅勤務を認められている","body":"数の語「five days a week（週に5日）」に印を付けます。"},{"title":"本文から、同じ話題の文を探して訳す","formula":"staff have been allowed to work from home up to three days a week since 2022\n2022年から、社員は週に最大3日まで在宅勤務を認められている","body":"up to は「最大で、〜まで」の意味です。"},{"title":"数を比べて判定する","formula":"本文：最大3日まで\n設問：5日\n5 は 3 より大きい → 本文と両立しない\n判定：B","body":"最大3日までと決まっているので、5日の在宅勤務は認められていません。B です。"}]},{"label":"本文に書かれていない気持ちを見分ける","question":"設問「Most employees at Kestrel Design prefer working from home to working in the office.」は、A・B・C のどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"TRUE：本文から明らかに正しい、または論理的に導ける","correct":false,"reason":"本文の「fewer than half of the desks are in use（使われている机は半分に満たない）」は、出社する人が少ないという事実です。社員がどちらを好むかは、本文から導けません。"},{"key":"B","text":"UNTRUE：本文から明らかに誤り、または反対のことが導ける","correct":false,"reason":"本文には、社員の多くが会社で働くほうを好むという文もありません。誤りと決める根拠がありません。"},{"key":"C","text":"CANNOT SAY：本文だけでは判断できない","correct":true,"reason":"社員がどちらの働き方を好むか（prefer）について、本文は何も述べていません。"}],"steps":[{"title":"設問を訳し、言いきっている部分をつかむ","formula":"Most employees at Kestrel Design prefer working from home to working in the office.\nKestrel Design の社員の大半は、会社で働くより在宅で働くほうを好む","body":"設問は、社員の好み（prefer）について言いきっています。"},{"title":"本文の近い話題の文を訳し、何を述べているかを確かめる","formula":"on a typical day fewer than half of the desks in the office are in use\nふだんの日、会社の机のうち使われているのは半分に満たない\nemployees now come to the office mainly to work with colleagues\n社員はいま、主に同僚と一緒に仕事をするために出社する","body":"どちらも、出社の様子や目的という事実です。好みについての文ではありません。"},{"title":"反対の内容が書かれていないかも確かめて判定する","formula":"在宅のほうを好む：本文になし\n会社のほうを好む：本文になし\n判定：C","body":"出社が少ないことは、在宅を好むからとはかぎりません。好みとは別の理由で出社しない日があるのかもしれません。本文からは決まらないので C です。"}]},{"label":"本文の文を組み合わせて判断する","question":"設問「Kestrel Design's rent went down after it reduced its office space to a single floor.」は、A・B・C のどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"TRUE：本文から明らかに正しい、または論理的に導ける","correct":true,"reason":"2フロアのうち1フロアの賃貸借契約を更新しなかったので、残りは1フロアです。それで家賃が約3分の1減ったと本文にあります。二つを合わせると、設問の内容が導けます。"},{"key":"B","text":"UNTRUE：本文から明らかに誤り、または反対のことが導ける","correct":false,"reason":"本文に、家賃が上がった、変わらなかったという文はありません。設問と両立しない文がないので B ではありません。"},{"key":"C","text":"CANNOT SAY：本文だけでは判断できない","correct":false,"reason":"「a single floor（1フロアだけ）」という語は本文にありませんが、「two floors のうち one を手放した」から必ず言えます。直接書かれていないことは、すぐに C とはかぎりません。"}],"steps":[{"title":"設問を訳し、言いきっている部分を分ける","formula":"Kestrel Design's rent went down after it reduced its office space to a single floor.\nKestrel Design の家賃は、会社がオフィスを1フロアだけに減らしたあと、下がった","body":"確かめることは二つです。オフィスが1フロアになったか、そのあと家賃が下がったか、です。"},{"title":"本文の該当する文を訳す","formula":"Last year the company decided not to renew the lease on one of its two floors, which reduced its rent by about a third.\n昨年、会社は2フロアのうち1フロアの賃貸借契約を更新しないことに決め、それによって家賃が約3分の1減った","body":"which は、前の内容（1フロアを手放したこと）を受けて、その結果を述べています。"},{"title":"二つの点を一つずつ確かめる","formula":"フロアの数：2 − 1 = 1\n家賃：約3分の1減った（下がった）\n判定：A","body":"どちらの点も本文から必ず言えます。A です。"}]},{"label":"理由を示す語から判断する","question":"設問「The rule that new employees should come to the office four days a week during their first three months was introduced because of a worry that some managers had.」は、A・B・C のどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"TRUE：本文から明らかに正しい、または論理的に導ける","correct":true,"reason":"本文の「To address this concern（この懸念に対処するために）」が、新しい社員に週4日の出社を求める理由を示しています。this concern は、直前の文の、一部の管理職の心配です。"},{"key":"B","text":"UNTRUE：本文から明らかに誤り、または反対のことが導ける","correct":false,"reason":"本文に、この決まりがほかの理由で作られたという文はありません。設問と両立しない文がないので B ではありません。"},{"key":"C","text":"CANNOT SAY：本文だけでは判断できない","correct":false,"reason":"決まりの理由は、To address this concern で本文がはっきり示しています。because という語は本文にありませんが、目的を示す To address が同じ関係を表しています。"}],"steps":[{"title":"設問を訳し、言いきっている部分を分ける","formula":"The rule that new employees should come to the office four days a week during their first three months was introduced because of a worry that some managers had.\n新しい社員は最初の3か月、週4日出社するという決まりは、一部の管理職が持った心配のために設けられた","body":"確かめることは、最初の3か月に週4日出社する決まりがあることと、その理由が管理職の心配であることの二つです。"},{"title":"本文の該当する二つの文を訳す","formula":"Some managers worried that new employees would find it harder to learn from experienced staff.\n一部の管理職は、新しい社員が経験のある社員から学ぶのが難しくなると心配した\nTo address this concern, the company asks new employees to come to the office four days a week during their first three months.\nこの懸念に対処するために、会社は新しい社員に、最初の3か月は週4日出社するよう求めている","body":"this concern は、直前の文の管理職の心配を指します。To address は「〜に対処するために」で、決まりを設けた目的、つまり理由を示します。"},{"title":"設問と照らし合わせて判定する","formula":"決まり：新しい社員は最初の3か月、週4日出社（本文と同じ）\n理由：管理職の心配（this concern ＝ worried の内容）\n判定：A","body":"設問の「because of a worry（心配のために）」は、本文の「To address this concern」の言いかえです。A です。"}]}]}},"tama-eng-reading":{"id":"tama-eng-reading","name":"英語の長文読解","type":"learn","goal":"英語の長文を読み、英語の設問に対して、本文の内容に合う答えを5つの選択肢から選べる。","part_of":"tamatebako","tags":["eigo","reading"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明と具体例を就職情報サイトの記述と照合し、具体例が練習の正答を見せていないかを確認。指摘を反映した後に再検証。","text":"英語の長文読解は、玉手箱の英語の形式の一つで、IMAGES形式の英語版とも呼ばれます。就職情報サイトでは、8つの長文に3問ずつ、24問を10分とされ、設問も英語で、5つの選択肢から1つを選びます。設問には、本文の細かい点（理由、数、だれが何をしたか）を問うもの、本文の内容に合う（または合わない）選択肢を選ぶもの、文章の種類を問うものがあります。時間が短いので、本文を頭から訳すより、先に設問を読んで、何を探すかを決めてから本文に戻ります。誤りの選択肢は、本文の語をそのまま使いながら内容を変えたり、本文にないことを足したり、some を all にするように言いすぎたりして作られます。選んだ答えは、根拠になる本文の文を一つ指させるかで確かめます。設問の種類の挙げ方は就職情報サイトによって違い、ここでは代表的なものだけを扱います。","example":"設問の例：According to the passage, why did ...?（本文によると、なぜ…か）\n→ 本文の because、so、This is why などの近くを探す\n設問の例：Which of the following is true according to the passage?（本文の内容に合うものはどれか）\n→ 選択肢ごとに本文の該当箇所を探し、合わない語を一つ見つけたら外す\n設問の例：Which of the following is NOT true according to the passage?（本文の内容に合わないものはどれか）\n→ 本文と合う選択肢を一つずつ外し、最後に残ったものを本文の文で確かめる\n設問の例：What kind of text is this?（これはどんな種類の文章か）\n→ だれがだれに向けて、何のために書いたかを見る（値段や買い方があれば広告、宛名と署名があれば手紙）","note":"内容に合うものを選ぶ設問では、正しそうな選択肢を探すより、誤りの選択肢を一つずつ外すほうが速く確かです。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"VERIFY.md の「ノード情報の検証の指示文」で検証。説明・確認問題・練習の全段階で使う知識を洗い出し、この単元の説明か必須の前提の到達条件（と、範囲の断りに書いた高校までの単語と文法）に収まるか、必須の前提が実際に使われているか、下流が範囲を超えて使っていないかを照合。学習時間は国語の同じ形式の単元との釣り合いで見た参考の見積もりで、実測ではない。"},"cost":{"hours":8,"yen":0},"requires":[{"id":"eng-reading","level":"must"},{"id":"tama-gist","level":"related"}],"sources":[{"title":"ONE CAREER：玉手箱の英語（長文読解はIMAGES形式の英語版で、8長文×3問の24問を10分、5つの選択肢）","url":"https://www.onecareer.jp/articles/830","checked_at":"2026-10-16"},{"title":"就活の教科書：玉手箱の英語の対策（GAB形式とIMAGES形式、問題数と制限時間、選択肢の数）","url":"https://reashu.com/tamatebako-eigo-taisaku/","checked_at":"2026-10-16"},{"title":"就活ハンドブック：玉手箱英語の特徴と対策（長文読解の例題に、文章の種類、内容に合うもの、合わないものを問う設問。5つの選択肢）","url":"https://jo-katsu.com/?p=4801","checked_at":"2026-10-16"},{"title":"CREX：玉手箱の対策（英語の2形式、それぞれ24問を10分）","url":"https://crexgroup.com/ja/shukatsu/test/web-test-tamatebako-preparation/","checked_at":"2026-10-16"}],"assessment":{"question":"本文「The bus usually leaves at 8:10, but on rainy days it often leaves a few minutes late.」設問「According to the passage, when is the bus often late?」の答えは？","options":["Every morning","On rainy days","At 8:10"],"answer":1,"explanation":"本文の but 以下に「on rainy days it often leaves a few minutes late（雨の日には、よく数分遅れて出る）」とある。Every morning（毎朝）は本文にない言いすぎ。At 8:10 はふだんの出発時刻で、遅れる時ではない。"},"practice":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。本文と問題文だけから独立に解いて正答を照合し、TRUE／UNTRUE／CANNOT SAY の境目や5択のほかの選択肢を実際に試して正答が一つに決まるかを確認。英文の文法、和訳、選択肢ごとの理由、全段階の説明、試験の形（就職情報サイトの記述）との適合を確認し、指摘を反映した後に再検証。","title":"英語の設問に、5つの選択肢から答える","lead":"先に設問を読み、探す語を決めてから本文に戻る。選んだら、根拠の文を訳して確かめる。","original":true,"passage":"Many people believe that taking a nap during the day is a sign of laziness, but there are reasons to think the opposite. In one office, workers who slept for 15 to 20 minutes after lunch made fewer mistakes in the afternoon than those who did not nap. However, the length of the nap matters. When people slept for more than 30 minutes, they often woke up feeling heavy and confused, and needed some time before they could work well again. This happens because a longer nap allows the brain to enter deep sleep, from which it is hard to wake up. For this reason, some companies have set up quiet rooms where staff can rest for a short time, and use alarms to end the rest after 20 minutes. Used in the right way, a short nap is not a sign of laziness but a simple tool for working better.","problems":[{"label":"理由を問う設問に答える","question":"According to the passage, why do people often feel heavy and confused after a long nap?","answer":"B","kind":"choice","options":[{"key":"A","text":"Because they ate lunch just before sleeping.","correct":false,"reason":"昼食のあと（after lunch）という語は本文にありますが、短い昼寝をした時を述べた文で、ぼんやりする理由としては書かれていません。本文の語を使って内容を変えた選択肢です。"},{"key":"B","text":"Because the brain has entered deep sleep during the nap.","correct":true,"reason":"本文の「This happens because a longer nap allows the brain to enter deep sleep（これが起きるのは、長い昼寝では脳が深い眠りに入るからだ）」の言いかえです。"},{"key":"C","text":"Because the quiet rooms at work are too dark.","correct":false,"reason":"静かな部屋（quiet rooms）は本文に出てきますが、暗さについては何も書かれていません。本文にないことを足した選択肢です。"},{"key":"D","text":"Because they made many mistakes in the afternoon.","correct":false,"reason":"本文は、短い昼寝をした人のほうが午後の誤りが少なかったと述べているだけです。誤りが多かったことは、ぼんやりする理由として書かれていません。"},{"key":"E","text":"Because an alarm woke them up suddenly.","correct":false,"reason":"アラーム（alarms）は、休みを20分で終わらせるために使うと書かれているだけです。ぼんやりする理由ではありません。"}],"steps":[{"title":"設問を訳し、探すものを決める","formula":"why do people often feel heavy and confused after a long nap?\n長い昼寝のあと、人はなぜよく、体が重くぼんやりするのか\n探すもの：heavy、confused の近くにある、理由を示す語","body":"設問の heavy と confused は、本文でもそのまま使われているはずです。"},{"title":"本文の該当箇所を探して訳す","formula":"When people slept for more than 30 minutes, they often woke up feeling heavy and confused\n30分より長く眠ると、人はよく、体が重くぼんやりした状態で目が覚めた\nThis happens because a longer nap allows the brain to enter deep sleep, from which it is hard to wake up.\nこれが起きるのは、長い昼寝では脳が深い眠りに入り、そこからは目覚めにくいからだ","body":"This は、前の文の「体が重くぼんやりして目が覚める」ことを指します。because の後が理由です。"},{"title":"理由と同じことを言っている選択肢を選ぶ","formula":"本文の理由：脳が深い眠り（deep sleep）に入る\nB：the brain has entered deep sleep（脳が深い眠りに入った）\n判定：B","body":"ほかの選択肢は、本文の語（lunch、quiet rooms、mistakes、alarm）を使っていますが、理由としては書かれていません。B です。"}]},{"label":"本文の内容に合うものを選ぶ","question":"Which of the following is true according to the passage?","answer":"C","kind":"choice","options":[{"key":"A","text":"Workers who napped after lunch made more mistakes than those who did not.","correct":false,"reason":"本文は、昼寝をした人のほうが誤りが少なかった（fewer mistakes）と述べています。more と fewer が反対です。"},{"key":"B","text":"Naps longer than 30 minutes help people work well in the afternoon.","correct":false,"reason":"本文は、30分より長く眠ると、ぼんやりして、また仕事がうまくできるまで時間がかかると述べています。反対です。"},{"key":"C","text":"Some companies use alarms to keep staff rest short.","correct":true,"reason":"本文の「some companies ... use alarms to end the rest after 20 minutes（一部の会社は、アラームを使って休みを20分で終わらせる）」の言いかえです。"},{"key":"D","text":"Most companies now have quiet rooms for their staff.","correct":false,"reason":"本文は some companies（一部の会社）と述べています。Most companies（ほとんどの会社）は言いすぎです。"},{"key":"E","text":"People who nap during the day are usually lazy.","correct":false,"reason":"本文の最初の文で、多くの人がそう思っていると紹介したうえで、筆者はその反対を考える理由があると述べています。本文の内容に合いません。"}],"steps":[{"title":"選択肢ごとに、本文の該当箇所を探す","formula":"A：mistakes → 2つ目の文\nB：30 minutes → 4つ目の文\nC：alarms → 6つ目の文\nD：quiet rooms → 6つ目の文\nE：lazy、laziness → 1つ目の文","body":"選択肢の目立つ語を手がかりに、本文の文を一つずつ対応させます。"},{"title":"本文の文と比べ、合わない語を見つけて外す","formula":"A：本文 fewer mistakes ⇔ 選択肢 more mistakes → 外す\nB：本文 heavy and confused（ぼんやりする）⇔ 選択肢 help people work well → 外す\nD：本文 some companies ⇔ 選択肢 Most companies → 外す\nE：本文 a sign of laziness と考えるのは many people で、筆者は the opposite → 外す","body":"合わない語が一つでもあれば、その選択肢は外します。"},{"title":"残った選択肢を、本文の文で確かめる","formula":"some companies ... use alarms to end the rest after 20 minutes\n一部の会社は、アラームを使って休みを20分で終わらせる\nC：Some companies use alarms to keep staff rest short.\n一部の会社は、社員の休みを短くするためにアラームを使う\n判定：C","body":"20分で終わらせることは、休みを短くすることの言いかえです。C です。"}]},{"label":"文章の種類を見分ける","question":"What kind of text is this?","answer":"C","kind":"choice","options":[{"key":"A","text":"An advertisement for a product that helps people sleep","correct":false,"reason":"本文には、売っている品物の名前も、値段や買い方もありません。広告ではありません。"},{"key":"B","text":"A notice from a company telling its staff about new rules for breaks","correct":false,"reason":"本文は会社のことを「some companies（一部の会社）」と外から紹介していて、ある会社が自分の社員に決まりを知らせる書き方ではありません。日付や守ることの指示もありません。"},{"key":"C","text":"An article giving reasons why short naps can be useful","correct":true,"reason":"最初の文で「多くの人は昼寝を怠けのしるしと思うが、その反対を考える理由がある（there are reasons to think the opposite）」と述べ、例と理由を挙げて、最後の文で考えをまとめています。読み手一般に向けて、理由を示して考えを述べる記事です。"},{"key":"D","text":"A letter from a worker to a friend about a bad afternoon","correct":false,"reason":"宛名（Dear ...）や署名がなく、書き手が自分（I）の出来事を友人に伝える文もありません。手紙ではありません。"},{"key":"E","text":"A story about one worker's day at the office","correct":false,"reason":"本文に、名前のある一人の人物は出てきません。people、workers、some companies のように、人や会社を一般的に述べています。物語ではありません。"}],"steps":[{"title":"設問を訳し、見るものを決める","formula":"What kind of text is this?\nこれはどんな種類の文章か\n見るもの：だれがだれに向けて、何のために書いたか","body":"広告なら品物と値段や買い方、手紙なら宛名と署名、知らせなら日時や守ること、物語なら名前のある人物と出来事の流れ、という手がかりがあるはずです。"},{"title":"最初と最後の文から、書き手の目的をつかむ","formula":"Many people believe that taking a nap during the day is a sign of laziness, but there are reasons to think the opposite.\n多くの人は、日中に昼寝をするのは怠けのしるしだと思っているが、その反対を考える理由がある\nUsed in the right way, a short nap is not a sign of laziness but a simple tool for working better.\n正しく使えば、短い昼寝は怠けのしるしではなく、よりよく働くための簡単な道具だ","body":"書き手は、読み手一般に向けて、ある考えとその理由を述べています。間の文は、その理由と例（ある職場の結果、深い眠り、会社の取り組み）です。"},{"title":"ほかの種類の手がかりがないことを確かめて判定する","formula":"品物・値段・買い方：なし → A でない\n会社から自分の社員への指示：なし（some companies と外から紹介）→ B でない\n宛名・署名・I の出来事：なし → D でない\n名前のある一人の人物：なし → E でない\n判定：C","body":"考えを理由とともに述べる記事なので、C です。"}]},{"label":"本文の内容に合わないものを選ぶ","question":"Which of the following is NOT true according to the passage?","answer":"D","kind":"choice","options":[{"key":"A","text":"Many people see napping during the day as a sign of laziness.","correct":false,"reason":"本文の最初の文「Many people believe that taking a nap during the day is a sign of laziness（多くの人は、日中の昼寝は怠けのしるしだと思っている）」と合います。筆者自身の考えではありませんが、多くの人がそう思っていることは本文のとおりです。"},{"key":"B","text":"People who sleep for more than 30 minutes may need some time before they can work well again.","correct":false,"reason":"本文の「When people slept for more than 30 minutes, they ... needed some time before they could work well again（30分より長く眠ると、また仕事がうまくできるまで時間がかかった）」と合います。"},{"key":"C","text":"It is hard to wake up from deep sleep.","correct":false,"reason":"本文の「deep sleep, from which it is hard to wake up（そこからは目覚めにくい深い眠り）」と合います。"},{"key":"D","text":"The companies that set up quiet rooms let staff rest for as long as they like.","correct":true,"reason":"本文は、静かな部屋を用意した会社が「use alarms to end the rest after 20 minutes（アラームを使って休みを20分で終わらせる）」と述べています。好きなだけ休める（for as long as they like）とは両立しないので、本文に合いません。"},{"key":"E","text":"The writer thinks that a short nap can be a tool for working better.","correct":false,"reason":"本文の最後の文「a short nap is ... a simple tool for working better（短い昼寝は、よりよく働くための簡単な道具だ）」と合います。"}],"steps":[{"title":"設問を訳し、探すものを決める","formula":"Which of the following is NOT true according to the passage?\n本文によると、次のうち正しくないものはどれか\n探すもの：本文と合わない選択肢を1つ","body":"NOT を見落とすと、合うものを選んでしまいます。設問の NOT に印を付けます。本文と合う4つを外していきます。"},{"title":"選択肢ごとに、本文の該当箇所を探す","formula":"A：laziness → 1つ目の文\nB：30 minutes → 4つ目の文\nC：deep sleep → 5つ目の文\nD：quiet rooms → 6つ目の文\nE：tool for working better → 7つ目の文","body":"選択肢の目立つ語を手がかりに、本文の文を一つずつ対応させます。"},{"title":"本文と合う選択肢を外す","formula":"A：Many people believe that taking a nap during the day is a sign of laziness\n多くの人は、日中の昼寝は怠けのしるしだと思っている → 合う\nB：they ... needed some time before they could work well again\nまた仕事がうまくできるまで時間がかかった → 合う\nC：deep sleep, from which it is hard to wake up\nそこからは目覚めにくい深い眠り → 合う\nE：a short nap is ... a simple tool for working better\n短い昼寝は、よりよく働くための簡単な道具だ → 合う","body":"A は筆者の考えではなく多くの人の考えですが、選択肢も「Many people」の考えとして述べているので、本文と合います。"},{"title":"残った選択肢を、本文の文で確かめて判定する","formula":"some companies have set up quiet rooms where staff can rest for a short time, and use alarms to end the rest after 20 minutes\n一部の会社は、社員が短い時間休める静かな部屋を用意し、アラームを使って休みを20分で終わらせている\nD：The companies that set up quiet rooms let staff rest for as long as they like.\n静かな部屋を用意した会社は、社員を好きなだけ休ませる\n20分で終わらせる ⇔ 好きなだけ → 合わない\n判定：D","body":"本文は休みを短く区切ると述べていて、D と反対です。D です。"}]}]}},"tama-gist":{"id":"tama-gist","name":"趣旨判定","type":"learn","goal":"本文を読み、設問の文が筆者の最も言いたいことか、本文に書かれているが最も言いたいことではないか、本文と関係ないかを判定できる。","part_of":"tamatebako","tags":["kokugo","reading"],"status":"verified","concept":{"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"説明の定義と具体例を一つずつ確認し、単元の到達条件・確認問題・練習問題と照合。指摘を反映した後に再検証。","text":"趣旨判定は、本文を読んで、設問の文を三つに分ける問題です。玉手箱の言語の形式の一つで、IMAGES形式とも呼ばれます。A は、筆者が最も言いたいこと（趣旨）を述べているもの。B は、本文に書かれているが、最も言いたいことではないもの。C は、本文と関係のないことを述べているものです。論理的読解と違い、正しいか誤っているかではなく、本文の中での役割を判定します。趣旨は、文章の終わりのほうで「〜べきだ」「大切なのは〜」のように、筆者の考えとして述べられることが多いです。例や理由、筆者が退けた考えは、本文に書かれていても趣旨ではありません。","example":"趣旨（A）：筆者の考えの中心。ほかの文は、これを支えるために置かれている\n書かれているが趣旨ではない（B）：例、理由、経緯、筆者が退けた考え\n関係ない（C）：本文が述べていないこと。本文の話題に近くても、本文に書かれていなければここに入る","note":"B と C の分かれ目は、本文に書かれているかどうかです。A と B の分かれ目は、その文を取り去ると筆者の主張がなくなるかどうかです。"},"review":{"checked_at":"2026-10-16","by":"Claude Opus 5.5（作成とは別の実行）","method":"概念の説明・確認問題・練習問題の全段階で使っている知識を洗い出し、必須の前提の到達条件に収まっているか、必須の前提が実際に使われているかを照合。書き手の考えを述べた文の見分け方は説明文の読解に収まる。長文読解は時間を2割縮めるとは言いにくく、関連に下げた。学習時間は、単元どうしの釣り合いと外部の目安との比較だけで、実測ではない。"},"cost":{"hours":5,"yen":0},"requires":[{"id":"jp-reading","level":"must"},{"id":"spi-reading","level":"related"}],"assessment":{"question":"本文「朝食をとると集中しやすいという人は多い。しかし、大切なのは何を食べるかより、毎日同じ時刻に起きることだ。」設問「毎日同じ時刻に起きることが大切だ。」の判定は？（A：趣旨／B：書かれているが趣旨ではない／C：本文と関係ない）","options":["A","B","C"],"answer":0,"explanation":"「しかし、大切なのは〜」で、筆者の考えの中心が述べられている。設問はその言いかえなので A。B は朝食についての前半の文のような、書かれているが中心ではない文。本文に書かれている内容なので C ではない。"},"practice":{"title":"本文の中での役割から、A・B・C を判定する","lead":"先に趣旨の一文を見つけ、それから設問の文を一つずつ比べる。","original":true,"reviewed_at":"2026-10-16","reviewed_by":"Claude Opus 5.5（作成とは別の実行）","review_method":"VERIFY.md の指示文で検証。問題文だけから独立に解いて正答を照合し、正答が一つに決まるかを別の判定・別の選択肢を実際に試して確認。選択肢ごとの理由、全段階の説明、語釈（デジタル大辞泉）、前提の範囲、説明・確認問題との整合、試験の形との適合を確認し、指摘を反映した後に再検証。","passage":"新しい道具を職場に入れるとき、多くの人は使い方の説明会を開けば済むと考える。確かに、説明会で操作は覚えられる。しかし、道具が根づくかどうかを決めるのは、操作を覚えたあとの数週間である。使い始めた人は、必ず小さなつまずきに出会う。そのときにすぐ聞ける相手がいなければ、人は慣れた古いやり方に戻ってしまう。実際、説明会の参加者が多かった職場でも、質問を受ける係を置かなかったところでは、新しい道具がほとんど使われなくなった例がある。道具を入れる側が力を注ぐべきなのは、最初の説明よりも、使い始めてからのつまずきをすぐに解消できる仕組みづくりである。","problems":[{"label":"趣旨の言いかえを見分ける","question":"設問「新しい道具を根づかせるには、使い始めてからのつまずきにすぐ対処できる仕組みが大切だ。」は、A・B・C のどれでしょうか。","answer":"A","kind":"choice","options":[{"key":"A","text":"筆者が最も言いたいこと（趣旨）を述べている","correct":true,"reason":"最後の文「道具を入れる側が力を注ぐべきなのは、……つまずきをすぐに解消できる仕組みづくりである」の言いかえです。"},{"key":"B","text":"本文に書かれているが、最も言いたいことではない","correct":false,"reason":"この内容は、例や理由ではなく、ほかの文が支えている結論そのものです。"},{"key":"C","text":"本文と関係ないことを述べている","correct":false,"reason":"本文の最後の文に、同じ内容が書かれています。"}],"steps":[{"title":"本文の中で、筆者の考えを述べた文を探す","formula":"「〜べきなのは、……である」：最後の文\n「しかし、……を決めるのは……である」：三つ目の文","body":"「べき」や「しかし」の後は、筆者の考えが出やすい場所です。"},{"title":"文どうしの関係から、趣旨を一つに決める","formula":"三つ目の文：根づくかどうかは、使い始めの数週間で決まる\n四〜六つ目の文：その理由と例\n最後の文：だから、つまずきを解消する仕組みに力を注ぐべきだ","body":"三つ目の文から六つ目の文までは、最後の文の結論を導くために置かれています。趣旨は最後の文です。"},{"title":"設問の文を、趣旨と比べる","formula":"設問：つまずきにすぐ対処できる仕組みが大切だ\n趣旨：つまずきをすぐに解消できる仕組みづくりに力を注ぐべきだ\n判定：A","body":"言葉は違いますが、言っていることは同じです。A です。"}]},{"label":"筆者が認めたうえで退けた考えを見分ける","question":"設問「説明会を開けば、道具の操作を覚えることはできる。」は、A・B・C のどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"筆者が最も言いたいこと（趣旨）を述べている","correct":false,"reason":"筆者は「確かに」で一度認めたあと、「しかし」で別の考えを出しています。この文は、筆者が強調したいことではありません。"},{"key":"B","text":"本文に書かれているが、最も言いたいことではない","correct":true,"reason":"二つ目の文「確かに、説明会で操作は覚えられる」に書かれていますが、後の「しかし」で、筆者の考えの中心は別にあると示されています。"},{"key":"C","text":"本文と関係ないことを述べている","correct":false,"reason":"本文の二つ目の文に、同じ内容が書かれています。"}],"steps":[{"title":"設問と同じ内容の文を、本文から探す","formula":"設問：説明会を開けば、操作を覚えることはできる\n本文：確かに、説明会で操作は覚えられる","body":"本文に書かれているので、C ではありません。"},{"title":"その文の前後の言葉から、役割を確かめる","formula":"「確かに」：一度認める\n「しかし」：その後に、筆者の考えの中心が来る","body":"「確かに……。しかし……」は、相手の考えを一部認めてから、自分の考えを出す言い方です。"},{"title":"判定する","formula":"本文に書かれている：はい\n筆者の考えの中心か：いいえ（「しかし」の前で認めただけ）\n判定：B","body":"書かれているが、最も言いたいことではないので B です。"}]},{"label":"趣旨を支える理由を見分ける","question":"設問「使い始めてつまずいたときに、すぐ聞ける相手がいないと、人は慣れた古いやり方に戻ってしまう。」は、A・B・C のどれでしょうか。","answer":"B","kind":"choice","options":[{"key":"A","text":"筆者が最も言いたいこと（趣旨）を述べている","correct":false,"reason":"これは、仕組みづくりに力を注ぐべき理由として置かれた文です。筆者が最後に求めているのは、つまずきを解消する仕組みづくりです。"},{"key":"B","text":"本文に書かれているが、最も言いたいことではない","correct":true,"reason":"五つ目の文に書かれていますが、最後の文の結論を支える理由の一つです。"},{"key":"C","text":"本文と関係ないことを述べている","correct":false,"reason":"本文の五つ目の文に、同じ内容が書かれています。"}],"steps":[{"title":"設問と同じ内容の文を、本文から探す","formula":"本文：そのときにすぐ聞ける相手がいなければ、人は慣れた古いやり方に戻ってしまう","body":"「そのとき」は、前の文の「小さなつまずきに出会う」ときです。本文に書かれているので、C ではありません。"},{"title":"その文を取り去っても、筆者の主張が残るかを考える","formula":"取り去った後の最後の文：つまずきをすぐに解消できる仕組みづくりに力を注ぐべきだ\n主張は残る","body":"この文がなくても、筆者の主張は残ります。主張を支える理由の一つで、主張そのものではありません。"},{"title":"判定する","formula":"本文に書かれている：はい\n筆者の考えの中心か：いいえ（結論を支える理由）\n判定：B","body":"趣旨に近い内容ですが、役割は理由です。B です。"}]},{"label":"本文の話題に近いが書かれていないことを見分ける","question":"設問「新しい道具は、年齢の若い人ほど早く使いこなせる。」は、A・B・C のどれでしょうか。","answer":"C","kind":"choice","options":[{"key":"A","text":"筆者が最も言いたいこと（趣旨）を述べている","correct":false,"reason":"本文は、使う
